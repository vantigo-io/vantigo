name: vantigo

# Vantigo — pre-built container images from GHCR.
#
# Quick start:
#   1. Copy .env.example            -> .env
#   2. Copy vantigo.env.example     -> vantigo.env
#   3. docker compose up -d
#
# See README.md next to this file for details.
#
# Database roles: POSTGRES_USER owns the schemas and runs the migration job.
# POSTGRES_APP_USER is a least-privilege runtime role (NOSUPERUSER NOBYPASSRLS,
# table DML only, owns nothing). VANTIGO_DB_USER selects which of the two the
# API connects as and defaults to the runtime role, so the tenant row-level
# security policies apply to the application. See README.md and docs/tenancy.md.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    configs:
      - source: create-databases
        target: /docker-entrypoint-initdb.d/create-databases.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantigo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vantigo-migrate:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["migrate"]
    env_file: vantigo.env
    environment:
      ConnectionStrings__vantigo: Host=postgres;Database=vantigo;Username=${POSTGRES_USER:-vantigo};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vantigo:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["api"]
    env_file: vantigo.env
    environment:
      ConnectionStrings__vantigo: Host=postgres;Database=vantigo;Username=${VANTIGO_DB_USER:-${POSTGRES_APP_USER:-vantigo_app}};Password=${VANTIGO_DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}
    ports:
      - "${VANTIGO_PORT:-8080}:8080"
    depends_on:
      vantigo-migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image is chiseled and distroless (no shell, curl, or wget), so the
      # app execs itself with its own "healthcheck" command instead of a
      # CMD-SHELL script. It probes /health/ready: startup complete,
      # PostgreSQL reachable, and object storage reachable if configured.
      test: ["CMD", "/app/Vantigo.Host", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

configs:
  create-databases:
    # Runs once, only when the postgres-data volume is first initialized.
    # Existing installations must apply the role statements by hand; the exact
    # SQL is reproduced in README.md.
    content: |
      CREATE DATABASE vantigo;

      \connect vantigo

      -- Least-privilege runtime role. It is not a superuser, cannot bypass
      -- row-level security, and owns no schema or table, so the tenant RLS
      -- policies actually apply to it. Default privileges are attached to the
      -- owner role so the tables the migration job creates later are covered.
      CREATE ROLE "${POSTGRES_APP_USER:-vantigo_app}"
          LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT
          PASSWORD '${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}';

      GRANT CONNECT ON DATABASE vantigo TO "${POSTGRES_APP_USER:-vantigo_app}";

      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT USAGE ON SCHEMAS TO "${POSTGRES_APP_USER:-vantigo_app}";
      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${POSTGRES_APP_USER:-vantigo_app}";
      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT USAGE, SELECT ON SEQUENCES TO "${POSTGRES_APP_USER:-vantigo_app}";

volumes:
  postgres-data:
