name: vantigo

# Vantigo — pre-built container images from GHCR.
#
# Quick start:
#   1. Copy .env.example            -> .env
#   2. Copy vantigo.env.example     -> vantigo.env
#   3. docker compose up -d
#
# See README.md next to this file for details.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    configs:
      - source: create-databases
        target: /docker-entrypoint-initdb.d/create-databases.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantigo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vantigo-migrate:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["migrate"]
    env_file: vantigo.env
    environment:
      ConnectionStrings__vantigo: Host=postgres;Database=vantigo;Username=${POSTGRES_USER:-vantigo};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vantigo:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["api"]
    env_file: vantigo.env
    environment:
      ConnectionStrings__vantigo: Host=postgres;Database=vantigo;Username=${POSTGRES_USER:-vantigo};Password=${POSTGRES_PASSWORD}
      DataProtection__KeysPath: /var/lib/vantigo/dataprotection
    ports:
      - "${VANTIGO_PORT:-8080}:8080"
    volumes:
      - vantigo-dataprotection:/var/lib/vantigo/dataprotection
    depends_on:
      vantigo-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

configs:
  create-databases:
    content: |
      CREATE DATABASE vantigo;

volumes:
  postgres-data:
  vantigo-dataprotection:
