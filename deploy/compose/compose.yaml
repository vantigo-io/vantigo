name: vantigo

# Vantigo — pre-built container images from GHCR.
#
# Quick start:
#   1. Copy .env.example            -> .env
#   2. Copy vantigo.env.example     -> vantigo.env
#   3. docker compose up -d
#
# See README.md next to this file for details.
#
# Database roles: POSTGRES_USER owns the schemas and runs the migration job.
# POSTGRES_APP_USER is a least-privilege runtime role (NOSUPERUSER NOBYPASSRLS,
# table DML only, owns nothing) so a compromised API process cannot alter the
# schema or escalate. VANTIGO_DB_USER selects which of the two the API
# connects as and defaults to the runtime role. This is single-tenant: there
# is no per-row tenant isolation to preserve, only the usual defense-in-depth
# of not running the API as the schema owner. See README.md.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vantigo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    configs:
      - source: create-databases
        target: /docker-entrypoint-initdb.d/create-databases.sql
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vantigo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  vantigo-migrate:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["migrate"]
    env_file: vantigo.env
    environment:
      # Owner role: applying migrations needs the DDL rights the runtime role
      # below does not have.
      DATABASE_URL: postgresql://${POSTGRES_USER:-vantigo}:${POSTGRES_PASSWORD}@postgres:5432/vantigo
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  vantigo:
    image: ghcr.io/vantigo-io/vantigo:${VANTIGO_TAG:-latest}
    command: ["api"]
    env_file: vantigo.env
    environment:
      # Least-privilege runtime role: what the API queries and writes as, so
      # a compromised API process cannot touch the schema or act as its owner.
      # `api` mode also re-checks migrations itself before it starts serving
      # (cmd/vantigo/main.go, case modeAPI); MIGRATIONS_DATABASE_URL is
      # deliberately left unset so that check runs as this same role too.
      # It only needs read access to conclude there is nothing to do: goose's
      # tryEnsureVersionTable probes for goose_db_version with a plain SELECT
      # and returns immediately when it already exists, never issuing CREATE
      # TABLE. The owner role never needs to reach this container at all —
      # vantigo-migrate (below) already applies migrations first, and
      # depends_on: condition: service_completed_successfully means `vantigo`
      # never even starts while any are still pending, upgrades included.
      DATABASE_URL: postgresql://${VANTIGO_DB_USER:-${POSTGRES_APP_USER:-vantigo_app}}:${VANTIGO_DB_PASSWORD:-${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}}@postgres:5432/vantigo
    ports:
      - "${VANTIGO_PORT:-8080}:8080"
    depends_on:
      vantigo-migrate:
        condition: service_completed_successfully
    healthcheck:
      # The image is chiseled and distroless (no shell, curl, or wget), so the
      # app execs itself with its own "healthcheck" command instead of a
      # CMD-SHELL script. It probes /health/ready: startup complete,
      # PostgreSQL reachable, and object storage reachable if configured.
      # This must stay exec form: an httpGet-style probe would send this
      # container's own address as the Host header, and internal/security/
      # hostfilter.go only allows APP_URL's host plus loopback.
      test: ["CMD", "/app/vantigo", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Must exceed SHUTDOWN_TIMEOUT (30s default; see vantigo.env.example) so
    # the graceful drain always finishes before Compose sends SIGKILL.
    stop_grace_period: 35s
    restart: unless-stopped

configs:
  create-databases:
    # Runs once, only when the postgres-data volume is first initialized.
    # Existing installations must apply the role statements by hand; the exact
    # SQL is reproduced in README.md.
    content: |
      CREATE DATABASE vantigo;

      \connect vantigo

      -- Least-privilege runtime role. It is not a superuser, cannot bypass
      -- row-level security (there is none defined here — NOBYPASSRLS is
      -- forward defense, not something this schema currently relies on), and
      -- owns no schema or table. Default privileges are attached to the
      -- owner role so the tables the migration job creates later are covered.
      CREATE ROLE "${POSTGRES_APP_USER:-vantigo_app}"
          LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS NOINHERIT
          PASSWORD '${POSTGRES_APP_PASSWORD:-${POSTGRES_PASSWORD}}';

      GRANT CONNECT ON DATABASE vantigo TO "${POSTGRES_APP_USER:-vantigo_app}";

      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT USAGE ON SCHEMAS TO "${POSTGRES_APP_USER:-vantigo_app}";
      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "${POSTGRES_APP_USER:-vantigo_app}";
      ALTER DEFAULT PRIVILEGES FOR ROLE "${POSTGRES_USER:-vantigo}"
          GRANT USAGE, SELECT ON SEQUENCES TO "${POSTGRES_APP_USER:-vantigo_app}";

volumes:
  postgres-data:
