# Every artefact the EHF oracle downloads, pinned by SHA-256. validate.sh
# fetches each into tools/ehf/.cache under the first column's name and refuses
# to run on a mismatch; CI caches that directory keyed on this file's hash.
# How to bump a pin: tools/ehf/README.md.
#
# <file in .cache> <sha256> <url>
#
# validate.sh finds each artefact by its file name's prefix — Saxon-HE-,
# xmlresolver-, schxslt-, en16931-ubl-, peppol-bis-invoice-3-, UBL- — so a
# bumped file keeps its prefix.

# Saxon-HE 12.7 and the two jars its POM requires (xmlresolver 5.3.3, and its
# "data" classifier), from Maven Central.
Saxon-HE-12.7.jar c607e8b395d4ee237495ad163183971ca3453d491534c847ebb55e0462772086 https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.7/Saxon-HE-12.7.jar
xmlresolver-5.3.3.jar 1fe4d5b92f708dcdb82dbce12919e0171e6b5ca62c6dca6220483625098feb5f https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.3.3/xmlresolver-5.3.3.jar
xmlresolver-5.3.3-data.jar b0c487ad2f3e558be8d829c916d2458d10aca6a5bafa7a4d0524b70845e48a5c https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.3.3/xmlresolver-5.3.3-data.jar

