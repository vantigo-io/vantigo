components:
    schemas:
        AddressRequest:
            properties:
                city:
                    nullable: true
                    type: string
                countryCode:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                streetAddress:
                    nullable: true
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        AddressResponse:
            properties:
                city:
                    type: string
                countryCode:
                    type: string
                postalCode:
                    type: string
                streetAddress:
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        ConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        ConsumptionResponse:
            properties:
                end:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quality:
                    type: string
                quantityKwh:
                    format: double
                    type: number
                receivedAt:
                    format: date-time
                    type: string
                source:
                    type: string
                start:
                    format: date-time
                    type: string
            required:
                - id
                - meteringPointId
                - start
                - end
                - quantityKwh
                - quality
                - source
                - receivedAt
            type: object
        CreateSupplyPeriodRequest:
            properties:
                customerId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
            required:
                - customerId
                - start
            type: object
        CustomerConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - meteringPointId
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        CustomerMeteringPointResponse:
            properties:
                meteringPoint:
                    $ref: '#/components/schemas/MeteringPointResponse'
                supplyPeriods:
                    items:
                        $ref: '#/components/schemas/SupplyPeriodResponse'
                    type: array
            required:
                - meteringPoint
                - supplyPeriods
            type: object
        EndSupplyPeriodRequest:
            properties:
                end:
                    format: date-time
                    type: string
            required:
                - end
            type: object
        EnergyPaginationMetadata:
            properties:
                page:
                    format: int32
                    type: integer
                pageSize:
                    format: int32
                    type: integer
                totalCount:
                    format: int32
                    type: integer
                totalPages:
                    format: int32
                    type: integer
            required:
                - page
                - pageSize
                - totalCount
                - totalPages
            type: object
        EnergyStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        EnergyStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            type: object
        EnergyStatsSummaryResponse:
            properties:
                activeSupplyPeriods:
                    format: int32
                    type: integer
                activeSupplyPeriodsDelta:
                    format: int32
                    type: integer
                consumptionKwh:
                    format: double
                    type: number
                consumptionKwhDelta:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                meteringPointCount:
                    format: int32
                    type: integer
                meteringPointCountDelta:
                    format: int32
                    type: integer
                previousConsumptionKwh:
                    format: double
                    type: number
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - meteringPointCount
                - meteringPointCountDelta
                - activeSupplyPeriods
                - activeSupplyPeriodsDelta
                - consumptionKwh
                - consumptionKwhDelta
                - previousConsumptionKwh
            type: object
        ManualConsumptionRequest:
            properties:
                end:
                    format: date-time
                    type: string
                quantityKwh:
                    format: double
                    type: number
                start:
                    format: date-time
                    type: string
            required:
                - start
                - end
                - quantityKwh
            type: object
        MeterResponse:
            properties:
                id:
                    format: int32
                    type: integer
                installedAt:
                    format: date-time
                    type: string
                meterNumber:
                    type: string
                meteringPointId:
                    format: int32
                    type: integer
                removedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - meteringPointId
                - meterNumber
                - installedAt
                - removedAt
            type: object
        MeteringPointRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    nullable: true
                    type: string
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - meterNumber
                - address
                - priceArea
            type: object
        MeteringPointResponse:
            properties:
                address:
                    $ref: '#/components/schemas/AddressResponse'
                connectionStatus:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    type: string
                id:
                    format: int32
                    type: integer
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - gsrn
                - meterNumber
                - address
                - priceArea
                - gridArea
                - expectedAnnualConsumptionKwh
                - latitude
                - longitude
                - connectionStatus
                - createdAt
                - updatedAt
            type: object
        MeteringPointUpdateRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    nullable: true
                    type: string
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - address
                - priceArea
            type: object
        PaginatedResponseOfMeteringPointResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/MeteringPointResponse'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        ReplaceMeterRequest:
            properties:
                installedAt:
                    format: date-time
                    nullable: true
                    type: string
                meterNumber:
                    nullable: true
                    type: string
            required:
                - meterNumber
                - installedAt
            type: object
        SupplyPeriodResponse:
            properties:
                customerId:
                    format: int32
                    type: integer
                end:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
                status:
                    type: string
            required:
                - id
                - meteringPointId
                - customerId
                - start
                - end
                - status
            type: object
        SwitchSupplyPeriodRequest:
            properties:
                customerId:
                    format: int32
                    type: integer
                switchAt:
                    format: date-time
                    type: string
            required:
                - customerId
                - switchAt
            type: object
        SwitchSupplyPeriodResponse:
            properties:
                endedPeriod:
                    allOf:
                        - $ref: '#/components/schemas/SupplyPeriodResponse'
                    nullable: true
                newPeriod:
                    $ref: '#/components/schemas/SupplyPeriodResponse'
            required:
                - endedPeriod
                - newPeriod
            type: object
info:
    title: Vantigo Energy API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/energy/customers/{customerId}/consumption:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumption
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ConsumptionResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/consumption/aggregate:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumptionAggregate
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: resolution
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerConsumptionAggregateResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Aggregate a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/metering-points:
        get:
            operationId: getEnergyCustomersByCustomerIdMeteringPoints
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerMeteringPointResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's metering points
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:metering-points-view+energy:meters-view+energy:supply-periods-view
    /api/v1/energy/metering-points:
        get:
            operationId: getEnergyMeteringPoints
            parameters:
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfMeteringPointResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List metering points
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:metering-points-view+energy:meters-view
        post:
            operationId: postEnergyMeteringPoints
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MeteringPointRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MeteringPointResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Create a metering point
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:metering-points-manage+energy:metering-points-view+energy:meters-manage+energy:meters-view
    /api/v1/energy/metering-points/{id}:
        get:
            operationId: getEnergyMeteringPoint
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MeteringPointResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a metering point
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:metering-points-view+energy:meters-view
        put:
            operationId: putEnergyMeteringPointsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MeteringPointUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MeteringPointResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Update a metering point
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:metering-points-manage+energy:metering-points-view+energy:meters-view
    /api/v1/energy/metering-points/{id}/consumption:
        get:
            operationId: getEnergyMeteringPointsByIdConsumption
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ConsumptionResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List current consumption intervals
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:consumption-view
        post:
            operationId: postEnergyMeteringPointsByIdConsumption
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ManualConsumptionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConsumptionResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Add a manual consumption interval
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:consumption-manage+energy:consumption-view
    /api/v1/energy/metering-points/{id}/consumption/aggregate:
        get:
            operationId: getEnergyMeteringPointsByIdConsumptionAggregate
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: resolution
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ConsumptionAggregateResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Aggregate consumption
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/metering-points/{id}/meters:
        get:
            operationId: getEnergyMeteringPointsByIdMeters
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/MeterResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List meter history
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:meters-view
        post:
            operationId: postEnergyMeteringPointsByIdMeters
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReplaceMeterRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MeterResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Replace a meter
            tags:
                - Energy metering points
            x-vantigo-access: permission:energy:meters-manage+energy:meters-view
    /api/v1/energy/metering-points/{id}/supply-periods:
        get:
            operationId: getEnergyMeteringPointsByIdSupplyPeriods
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/SupplyPeriodResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List supply periods
            tags:
