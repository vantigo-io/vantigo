    /api/v1/identity/users/{id}/badge:
        delete:
            description: Removes the badge enrolled for a person. Audited badge_cleared.
            operationId: deleteIdentityUsersByIdBadge
            parameters:
                - description: The person.
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Not Found
            summary: Remove a person's badge
            tags:
                - Shop-floor stations
            x-vantigo-access: permission:identity:manage
            x-vantigo-assistant: never
        put:
            description: Enrols the code a keyboard-wedge card reader types for a person who holds manufacturing:shop-floor (M132), stored as an HMAC under a key from APP_SECRET. Replaces the person's badge and ends their operator sessions at every station. Needs the current password unless the session signed in within the last 10 minutes; the person is mailed that a badge was enrolled for them. Audited badge_enrolled.
            operationId: putIdentityUsersByIdBadge
            parameters:
                - description: The person.
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/BadgeRequest'
                            nullable: true
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Bad Request — invalid_request, also for a person who does not hold manufacturing:shop-floor.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized — also invalid_credentials, a wrong current password.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Forbidden — also reauthentication_required: the change needs the current password, the session having signed in more than 10 minutes ago.'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Conflict — badge_unavailable: the card cannot be enrolled; the answer does not say why.'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Enrol a person's badge
            tags:
                - Shop-floor stations
            x-vantigo-access: permission:identity:manage
            x-vantigo-assistant: never
