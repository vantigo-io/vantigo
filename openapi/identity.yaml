    /api/v1/identity/brand-assets/{file}:
        get:
            description: 'A brand''s logo file by the hash of its bytes (brands design B15): anonymous, content-addressed, served immutable with a long max-age, never sniffed and rate-limited per address. It answers only for an asset a published brand names; any other hash, an unpublished draft''s logo included, is a 404.'
            operationId: getIdentityBrandAssetsByFile
            parameters:
                - description: The logo's SHA-256 in lower-case hex and its extension, png or jpg.
                  in: path
                  name: file
                  required: true
                  schema:
                    pattern: ^[0-9a-f]{64}\.(png|jpg)$
                    type: string
                - description: The ETag a client holds; when it names the asset the answer is a bare 304, without reading the object store.
                  in: header
                  name: If-None-Match
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        image/jpeg:
                            schema:
                                format: binary
                                type: string
                        image/png:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "304":
                    description: Not Modified - If-None-Match names this published asset.
                "404":
                    description: Not Found - no published brand names this asset. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
