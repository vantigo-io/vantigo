                - today
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandCandidate:
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandCheck:
            properties:
                background:
                    type: string
                foreground:
                    type: string
                pair:
                    enum:
                        - filled
                        - filledHover
                        - linkPage
                        - linkCard
                        - linkTint
                    type: string
                pass:
                    type: boolean
                ratio:
                    format: double
                    type: number
                scheme:
                    enum:
                        - light
                        - dark
                    type: string
            required:
                - pair
                - scheme
                - foreground
                - background
                - ratio
                - pass
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandChoiceRequest:
            properties:
                brandId:
                    description: The brand to see, one of the candidates; null for automatic.
                    format: uuid
                    nullable: true
                    type: string
            required:
                - brandId
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandListResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/BrandSummary'
                    type: array
            required:
                - items
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandLogo:
            properties:
                contentType:
                    enum:
                        - image/png
                        - image/jpeg
                    type: string
                sha256:
                    type: string
            required:
                - sha256
                - contentType
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandLogoUrls:
            description: The URLs of a version's logos, by slot; a slot with no logo is absent.
            properties:
                icon:
                    type: string
                mark_dark:
                    type: string
                mark_light:
                    type: string
                wordmark:
                    type: string
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandLogos:
            properties:
                icon:
                    $ref: '#/components/schemas/BrandLogo'
                mark_dark:
                    $ref: '#/components/schemas/BrandLogo'
                mark_light:
                    $ref: '#/components/schemas/BrandLogo'
                wordmark:
                    $ref: '#/components/schemas/BrandLogo'
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRef:
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandResolution:
            properties:
                brand:
                    $ref: '#/components/schemas/BrandRef'
                candidates:
                    items:
                        $ref: '#/components/schemas/BrandCandidate'
                    type: array
                choiceIgnored:
                    description: The person has a choice that is no longer one of their candidates, so it is ignored.
                    type: boolean
                details:
                    $ref: '#/components/schemas/BrandResolutionDetails'
                displayName:
                    type: string
                rule:
                    $ref: '#/components/schemas/BrandResolutionRule'
                source:
                    enum:
                        - choice
                        - rule
                        - default
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - brand
                - source
                - candidates
                - choiceIgnored
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandResolutionDetails:
            description: Only for a caller who also holds staff:view, with Staff enabled.
            properties:
                accessGroups:
                    items:
                        type: string
                    type: array
                emailDomain:
                    type: string
                legalEntities:
                    items:
                        type: string
                    type: array
            required:
                - emailDomain
                - accessGroups
                - legalEntities
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandResolutionRule:
            description: The first rule that matches the person (the one that decides unless they chose).
            properties:
                id:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - domain
                        - legal_entity
                        - access_group
                    type: string
                position:
                    description: Where the rule stands in the list, from 1.
                    format: int32
                    type: integer
                targetLabel:
                    type: string
                targetRef:
                    type: string
            required:
                - id
                - kind
                - targetRef
                - targetLabel
                - position
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandResponse:
            properties:
                checks:
                    description: The contrast checks of the version being edited, light then dark.
                    items:
                        $ref: '#/components/schemas/BrandCheck'
                    type: array
                draft:
                    allOf:
                        - $ref: '#/components/schemas/BrandVersion'
                    nullable: true
                id:
                    format: uuid
                    type: string
                importNotice:
                    description: Why a logo could not be imported from APP_LOGO_URL, when it could not.
                    nullable: true
                    type: string
                isDefault:
                    type: boolean
                logoStorageAvailable:
                    description: Whether this installation has an object store, so logos can be uploaded.
                    type: boolean
                published:
                    allOf:
                        - $ref: '#/components/schemas/BrandVersion'
                    nullable: true
                publishedVersion:
                    format: int32
                    type: integer
                revision:
                    format: int32
                    type: integer
                state:
                    enum:
                        - draft
                        - published
                        - archived
                    type: string
                suggestedPrimary:
                    description: The nearest primary that passes every check, when the version being edited fails; absent otherwise.
                    nullable: true
                    type: string
            required:
                - id
                - isDefault
                - state
                - revision
                - publishedVersion
                - published
                - draft
                - checks
                - logoStorageAvailable
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRule:
            properties:
                brandId:
                    format: uuid
                    type: string
                brandName:
                    type: string
                id:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - domain
                        - legal_entity
                        - access_group
                    type: string
                position:
                    format: int32
                    type: integer
                stale:
                    description: The target no longer exists, is inactive or archived, or is a legal entity while Staff is off; the rule is kept and matches no one.
                    type: boolean
                staleReason:
                    enum:
                        - missing
                        - inactive
                        - archived
                        - staff_disabled
                    type: string
                targetLabel:
                    type: string
                targetRef:
                    type: string
            required:
                - id
                - brandId
                - brandName
                - position
                - kind
                - targetRef
                - targetLabel
                - stale
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRuleInput:
            properties:
                brandId:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - domain
                        - legal_entity
                        - access_group
                    type: string
                targetRef:
                    description: A domain (written in any case, with any trailing dot), a Staff legal entity id or an access group id.
                    maxLength: 255
                    minLength: 1
                    type: string
            required:
                - brandId
                - kind
                - targetRef
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRuleTargetsResponse:
            properties:
                accessGroups:
                    items:
                        $ref: '#/components/schemas/BrandRuleTarget'
                    type: array
                legalEntities:
                    items:
                        $ref: '#/components/schemas/BrandRuleTarget'
                    type: array
                staffEnabled:
                    type: boolean
            required:
                - staffEnabled
                - accessGroups
                - legalEntities
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRuleTarget:
            properties:
                available:
                    description: False for a group that is inactive or a legal entity that is archived.
                    type: boolean
                id:
                    type: string
                name:
                    type: string
            required:
                - id
                - name
                - available
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRulesRequest:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/BrandRuleInput'
                    maxItems: 200
                    type: array
            required:
                - items
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandRulesResponse:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/BrandRule'
                    type: array
                revision:
                    format: int32
                    type: integer
                staffEnabled:
                    type: boolean
            required:
                - revision
                - staffEnabled
                - items
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandSchemeTokens:
            properties:
                derived:
                    additionalProperties:
                        type: string
                    description: The variables Mantine derives from the shades, as ready CSS variable values.
                    type: object
                filledText:
                    type: string
                link:
                    type: string
                shades:
                    items:
                        type: string
                    maxItems: 10
                    minItems: 10
                    type: array
                subtleBg:
                    type: string
            required:
                - shades
                - filledText
                - link
                - subtleBg
                - derived
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandSummary:
            properties:
                hasDraft:
                    type: boolean
                id:
                    format: uuid
                    type: string
                isDefault:
                    type: boolean
                name:
                    type: string
                primary:
                    type: string
                publishedVersion:
                    format: int32
                    type: integer
                revision:
                    format: int32
                    type: integer
                state:
                    enum:
                        - draft
                        - published
                        - archived
                    type: string
                title:
                    type: string
            required:
                - id
                - name
                - title
                - primary
                - isDefault
                - state
                - hasDraft
                - publishedVersion
                - revision
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandSupport:
            properties:
                email:
                    type: string
                phone:
                    type: string
                url:
                    type: string
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandTokens:
            properties:
                dark:
                    $ref: '#/components/schemas/BrandSchemeTokens'
                light:
                    $ref: '#/components/schemas/BrandSchemeTokens'
                radius:
                    description: The value of --mantine-radius-default.
                    type: string
            required:
                - light
                - dark
                - radius
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandUpdateRequest:
            additionalProperties: true
            description: A brand's inputs. Any other member, tokens and shades included, is refused 400.
            properties:
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                primary:
                    description: 'The primary colour, as #rrggbb.'
                    type: string
                radius:
                    enum:
                        - xs
                        - sm
                        - md
                        - lg
                        - xl
                    type: string
                support:
                    $ref: '#/components/schemas/BrandSupport'
                title:
                    description: The product name in the tab, the shell header and the sign-in page; defaults to the name.
                    maxLength: 60
                    type: string
            required:
                - name
                - primary
                - radius
            type: object
            x-vantigo-source: Vantigo.Identity
        BrandVersion:
            properties:
                algorithm:
                    format: int32
                    type: integer
                logos:
                    $ref: '#/components/schemas/BrandLogos'
                name:
                    type: string
                primary:
                    type: string
                radius:
                    enum:
                        - xs
                        - sm
                        - md
                        - lg
                        - xl
                    type: string
                support:
                    $ref: '#/components/schemas/BrandSupport'
                title:
                    type: string
                tokens:
                    $ref: '#/components/schemas/BrandTokens'
            required:
                - name
                - title
                - primary
                - radius
                - support
                - logos
                - algorithm
                - tokens
            type: object
            x-vantigo-source: Vantigo.Identity
        ResolvedBrand:
            description: The brand a person sees, in the versioned payload of brands design B36.
            properties:
                algorithm:
                    format: int32
                    type: integer
                brandId:
                    format: uuid
                    type: string
                campaign:
                    $ref: '#/components/schemas/BrandCampaignRef'
                candidates:
                    description: The brands the person may choose among (B12); the switcher shows with more than one. Empty on the public look.
                    items:
                        $ref: '#/components/schemas/BrandCandidate'
                    type: array
                choiceIgnored:
                    description: The person has a choice that is no longer one of their candidates, so it is ignored.
                    type: boolean
                logos:
                    $ref: '#/components/schemas/BrandLogoUrls'
                matched:
                    description: On the public look only (B25) - true when the domain asked about is attached to a published brand by a rule, false for the default brand.
                    type: boolean
                name:
                    type: string
                source:
                    description: Why the person sees this brand (B7).
                    enum:
                        - default
                        - preview
                        - choice
                        - rule
                    type: string
                support:
                    $ref: '#/components/schemas/BrandSupport'
                title:
                    type: string
                tokens:
                    $ref: '#/components/schemas/BrandTokens'
                v:
                    format: int32
                    type: integer
                validUntil:
                    description: 'The next time the campaign in force changes (B24): the start of the day a campaign starts or the day after one ends, in the business time zone. Absent when nothing is scheduled. The client refetches at the nearer of this and six hours.'
                    format: date-time
                    type: string
                version:
                    description: The cache key of the payload.
                    type: string
            required:
                - v
                - algorithm
                - brandId
                - version
                - name
                - title
                - tokens
                - logos
                - support
                - source
            type: object
            x-vantigo-source: Vantigo.Identity

info:
    title: Vantigo Identity API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/identity/access/audit:
        get:
            operationId: getIdentityAccessAudit
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AuthorizationAuditEvent'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the authorization audit events
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/access/catalog:
        get:
            operationId: getIdentityAccessCatalog
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PermissionDescriptor'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the permission catalog
            tags:
                - Authorization
            x-vantigo-access: policy:AuthorizationManagement
            x-vantigo-api: never
    /api/v1/identity/access/delegations:
        get:
            operationId: getIdentityAccessDelegations
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/DelegationResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the authorization delegations
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
        post:
            operationId: postIdentityAccessDelegations
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            nullable: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationSaveResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Create an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/access/delegations/{id}:
        put:
            operationId: putIdentityAccessDelegationsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationSaveResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Update an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/access/delegations/{id}/revoke:
        post:
            operationId: postIdentityAccessDelegationsByIdRevoke
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationMutationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationRevokeResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Revoke an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/access/groups:
        get:
            operationId: getIdentityAccessGroups
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AccessGroupResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the access groups
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
        post:
            operationId: postIdentityAccessGroups
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/AccessGroupRequest'
                            nullable: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccessGroupResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Create an access group
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/access/groups/{groupId}/members/{userId}:
        delete:
            operationId: deleteIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccessGroupResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Remove a member from an access group
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
        post:
            operationId: postIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccessGroupResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Add a member to an access group
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-api: never
        put:
            operationId: putIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
