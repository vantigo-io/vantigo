                    description: Unauthorized
            summary: Get the authenticated browser session
            tags:
                - Authentication
            x-vantigo-access: session
    /api/v1/identity/station:
        get:
            description: 'The shared shop-floor station this browser is paired as (manufacturing phase 2 M129, M130): its name, idle timeout and badge rule, the workspace''s time zone, and the operators signed in at it. Read with the station cookie alone; a request that also carries a session cookie is refused station_has_session.'
            operationId: getIdentityStation
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationSelf'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Unauthorized — station_unknown: no station cookie, or one of a revoked, expired or unknown station, or a request from outside the station''s networks.'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Conflict — station_has_session: this browser is also signed in to Vantigo as a person; sign out first (M134).'
            summary: Read this station
            tags:
                - Shop-floor stations
            x-vantigo-access: anonymous
            x-vantigo-assistant: never
    /api/v1/identity/station/operators:
        get:
            description: 'The people who may switch in at this station (M133): every active person holding manufacturing:shop-floor who has set a PIN or been given a badge, by display name, with initials and which of the two they have. Nothing else about them. Read with the station cookie alone.'
            operationId: getIdentityStationOperators
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationOperatorCandidateList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Unauthorized — station_unknown: no station cookie, or one of a revoked, expired or unknown station, or a request from outside the station''s networks.'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Conflict — station_has_session: this browser is also signed in to Vantigo as a person; sign out first (M134).'
            summary: List who may switch in at this station
            tags:
                - Shop-floor stations
            x-vantigo-access: anonymous
            x-vantigo-assistant: never
        post:
            description: 'Switches an operator in with the station cookie (M133): a user and their PIN, or a badge (and, while the station requires it, the badge''s holder''s PIN as well). Thirty attempts in five minutes, and ten failed ones, close the station for the rest of the window (an attempt refused for a person in backoff counts on neither); attempts for one person at one station are taken one at a time, a second one at once answering 429; from the fifth consecutive failure for one person at this station each attempt waits, 30 seconds doubling to 15 minutes, and a run an hour past its last failure starts again. A PIN or badge enrolled under an earlier version of the installation''s key does not verify. Success answers an operator token for the Authorization header (Station <token>), which the page keeps in memory only. Signing in a person already signed in here replaces their session. Audited operator_signed_in or operator_sign_in_failed.'
            operationId: postIdentityStationOperators
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/StationOperatorSignInRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationOperatorSignIn'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Bad Request — invalid_request: neither a user and PIN nor a badge.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized — operator_sign_in_failed, the same for an unknown user, a wrong PIN or badge, a person in backoff and a person who may not act; or station_unknown.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Conflict — too_many_operators (ten are signed in) or station_has_session.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Switch an operator in at this station
            tags:
                - Shop-floor stations
            x-vantigo-access: anonymous
            x-vantigo-assistant: never
    /api/v1/identity/station/operators/{sessionId}/end:
        post:
            description: 'Ends an operator''s session at this station (M136) with the station cookie alone: the operator''s token is not needed, since a reload has forgotten it. Time logs left running keep running. Audited operator_signed_out.'
            operationId: postIdentityStationOperatorsBySessionIdEnd
            parameters:
                - description: The operator session, as the station answered it.
                  in: path
                  name: sessionId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Unauthorized — station_unknown: no station cookie, or one of a revoked, expired or unknown station, or a request from outside the station''s networks.'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Not Found — operator_session_unknown: not one of this station''s signed-in operators.'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Conflict — station_has_session: this browser is also signed in to Vantigo as a person; sign out first (M134).'
            summary: Switch an operator out at this station
            tags:
                - Shop-floor stations
            x-vantigo-access: anonymous
            x-vantigo-assistant: never
    /api/v1/identity/station/pair:
        post:
            description: Pairs this browser as a shared shop-floor station with the one-time code an administrator issued (M129). The code is spent; a 256-bit station token is minted, its hash stored, and the vantigo.station cookie set for 90 days. A session cookie on the request is signed out in the same answer, so a station browser never holds both. A code tried from an address outside the station's network allowlist is refused as an invalid one. Ten attempts per address in 15 minutes, and 60 an hour across the installation. Audited station_paired; a refused attempt is audited station_pairing_failed.
            operationId: postIdentityStationPair
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/StationPairRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationSelf'
                    description: OK — the station cookie is set (HttpOnly, Secure on https, SameSite=Strict, 90 days).
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Bad Request — pairing_code_invalid: unknown, used or expired.'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Pair this browser as a station
            tags:
                - Shop-floor stations
            x-vantigo-access: anonymous
            x-vantigo-assistant: never
    /api/v1/identity/stations:
        get:
            description: 'Every shared shop-floor station (M139): its state, network allowlist, last activity and the operators signed in at it, and whether failed sign-ins alerted administrators.'
            operationId: getIdentityStations
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the shop-floor stations
            tags:
                - Shop-floor stations
            x-vantigo-access: permission:identity:manage
            x-vantigo-assistant: never
        post:
            description: 'Registers a shared shop-floor station (M129) and answers a one-time pairing code: eight characters of Crockford base32, valid 15 minutes, stored only as a hash. A station that takes a badge alone (requirePinWithBadge false) needs the current password unless the session signed in within the last 10 minutes, and the holders of identity:manage are mailed. Audited station_registered.'
            operationId: postIdentityStations
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/StationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StationPairing'
                    description: OK — the station and its one-time pairing code, shown once.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized — also invalid_credentials, a wrong current password.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Forbidden — also reauthentication_required: the change needs the current password, the session having signed in more than 10 minutes ago.'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — rate_limited, too many wrong current passwords.
            summary: Register a shop-floor station
            tags:
                - Shop-floor stations
            x-vantigo-access: permission:identity:manage
            x-vantigo-assistant: never
