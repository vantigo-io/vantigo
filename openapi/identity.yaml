    /api/v1/identity/oidc/callback:
        get:
            description: The workforce OpenID Connect redirect URI, served by the authentication handler rather than an endpoint (so the .NET OpenAPI dump omits it). Exchanges the authorization code, then redirects to the redirect URI the challenge set, or to /sign-in?error=… on failure.
            operationId: getIdentityOidcCallback
            parameters:
                - in: query
                  name: code
                  schema:
                    type: string
                - in: query
                  name: state
                  schema:
                    type: string
                - in: query
                  name: error
                  schema:
                    type: string
                - in: query
                  name: error_description
                  schema:
                    type: string
            responses:
                "302":
                    description: Redirect to the challenge's redirect URI, or to /sign-in?error=… on failure.
                    headers:
                        Location:
                            schema:
                                type: string
            x-vantigo-access: anonymous
        post:
            description: The same redirect URI for the form_post response mode (the ASP.NET default), with the authorization response in a form body.
            operationId: postIdentityOidcCallback
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                code:
                                    type: string
                                error:
                                    type: string
                                error_description:
                                    type: string
                                state:
                                    type: string
                            type: object
                required: true
            responses:
                "302":
                    description: Redirect to the challenge's redirect URI, or to /sign-in?error=… on failure.
                    headers:
                        Location:
                            schema:
                                type: string
            x-vantigo-access: anonymous
    /api/v1/identity/oidc/challenge:
        get:
            operationId: getIdentityOidcChallenge
            responses:
                "302":
                    description: Redirect to the workforce OpenID Connect provider
                    headers:
                        Location:
                            schema:
                                type: string
                "404":
                    description: Not Found
            summary: Start workforce OpenID Connect sign-in
            tags:
                - Authentication
            x-vantigo-access: anonymous
    /api/v1/identity/oidc/complete:
        get:
            operationId: getIdentityOidcComplete
            responses:
                "302":
                    description: Redirect to / on success, or to /sign-in?error=… on failure.
                    headers:
                        Location:
                            schema:
                                type: string
                "404":
                    description: Not Found
            summary: Complete workforce OpenID Connect sign-in
            tags:
                - Authentication
            x-vantigo-access: anonymous
