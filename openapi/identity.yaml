components:
    schemas:
        AccessGroupRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                displayName:
                    nullable: true
                    type: string
                isActive:
                    type: boolean
            required:
                - displayName
            type: object
        AccessGroupResponse:
            properties:
                concurrencyStamp:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
                isActive:
                    type: boolean
                memberUserIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                scimConnectionId:
                    format: uuid
                    nullable: true
                    type: string
                source:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - displayName
                - source
                - scimConnectionId
                - isActive
                - createdAt
                - updatedAt
                - concurrencyStamp
                - memberUserIds
                - roleIds
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessMeResponse:
            properties:
                administrationScope:
                    allOf:
                        - $ref: '#/components/schemas/AdministrationScopeResponse'
                    nullable: true
                canManageAuthorization:
                    type: boolean
                permissions:
                    items:
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roles:
                    items:
                        nullable: true
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
                version:
                    nullable: true
                    type: string
            required:
                - userId
                - roles
                - roleIds
                - permissions
                - version
                - canManageAuthorization
                - administrationScope
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessRoleSummary:
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    nullable: true
                    type: string
            required:
                - id
                - name
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessUserResponse:
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                isDisabled:
                    type: boolean
                kind:
                    default: person
                    description: person for a user who signs in, agent for an AI agent (virtual employees design V5). An agent has no credential and is listed apart from the people.
                    enum:
                        - person
                        - agent
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/AccessRoleSummary'
                    type: array
                version:
                    nullable: true
                    type: string
            required:
                - id
                - displayName
                - email
                - isDisabled
                - active
                - version
                - roles
            type: object
            x-vantigo-source: Vantigo.Identity
        AccountPasswordRequest:
            properties:
                currentPassword:
                    nullable: true
                    type: string
                newPassword:
                    nullable: true
                    type: string
            required:
                - currentPassword
                - newPassword
            type: object
        AccountProfileRequest:
            properties:
                colorScheme:
                    description: The colour scheme the person chose, 'light' or 'dark'; null, or 'automatic', follows the computer. Omitted, on any of the three operations, leaves it as it is, so a client that predates it does not clear it. Any other value is a 400 invalid_request on colorScheme.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                displayName:
                    nullable: true
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
                timeZone:
                    description: The zone instants are shown to this user in (time zones design D5), an IANA name such as Europe/Oslo that the server and its database read the same way — 'CET', 'Local' or a name either does not know is a 400 invalid_request on timeZone. Null, or a blank name, clears it, so the user follows the workspace's business time zone again. Omitted, on any of the three operations, leaves it as it is, so a client that predates it does not clear it. It never moves a bookkeeping day, which is always the business day.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
            required:
                - displayName
            type: object
        AccountResponse:
            properties:
                avatarManagedBy:
                    description: staff when Staff's photo is the picture and the avatar cannot be changed here; null otherwise. Always answered; optional in the schema only because the recorded exchanges predate it.
                    enum:
                        - staff
                    nullable: true
                    type: string
                    x-enum-varnames:
                        - AvatarManagedByStaff
                    x-omitempty: false
                avatarUrl:
                    nullable: true
                    type: string
                colorScheme:
                    description: The colour scheme the person chose, 'light' or 'dark', or null when they follow the computer. Always answered; optional in the schema only because the recorded exchanges predate it.
                    nullable: true
                    type: string
                    x-omitempty: false
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
                timeZone:
                    description: The user's own time zone (time zones design D5), an IANA name, or null when they follow the workspace's business time zone. The zone in effect, whichever it is, is the session's timeZone. Always answered; optional in the schema only because the recorded exchanges predate it.
                    nullable: true
                    type: string
                    x-omitempty: false
            required:
                - id
                - displayName
                - email
                - preferredLanguage
                - avatarUrl
            type: object
            x-vantigo-source: Vantigo.Identity
        AdministrationScopeResponse:
            properties:
                delegationScopes:
                    items:
                        $ref: '#/components/schemas/DelegationScopeResponse'
                    type: array
                isOwner:
                    type: boolean
            required:
                - isOwner
                - delegationScopes
            type: object
            x-vantigo-source: Vantigo.Identity
        AiSettings:
            description: 'The installation''s AI plan as an Owner sees it (AI as a platform provider design T12, T13): the provider, the models the plan allows and whether a key is configured, all instance configuration shown as facts, and the AI tasks the enabled modules perform, grouped by module, each with the model it uses now. The key itself is never answered, in any form.'
            properties:
                allowedModels:
                    description: The models the plan allows (AI_MODELS), in the order the operator wrote them; the first is the plan's default.
                    items:
                        type: string
                    type: array
                keyConfigured:
                    description: Whether an API key is configured (AI_API_KEY). A local model (Ollama, vLLM, LM Studio) takes none, so this is false there. The key itself is never sent.
                    type: boolean
                modules:
                    description: The modules that perform AI tasks and are enabled, by name, each with its tasks by key. A module that is off is not listed.
                    items:
                        $ref: '#/components/schemas/AiSettingsModule'
                    type: array
                planDefault:
                    description: The model a task uses when nobody chose one and the module recommends none the plan allows — the first of allowedModels.
                    type: string
                provider:
                    description: The provider the plan calls (AI_PROVIDER), as the operator wrote it. openai-compatible is the OpenAI protocol served by something else, such as a local model. anthropic is Anthropic's Messages API.
                    enum:
                        - openai
                        - openai-compatible
                        - anthropic
                    type: string
            required:
                - provider
                - allowedModels
                - planDefault
                - keyConfigured
                - modules
            type: object
        AiSettingsModule:
            description: One module's AI tasks.
            properties:
                module:
                    description: The module's name, such as communications.
                    type: string
                tasks:
                    items:
                        $ref: '#/components/schemas/AiSettingsTask'
                    type: array
            required:
                - module
                - tasks
            type: object
        AiSettingsTask:
            description: One AI job a module performs and the model it uses.
            properties:
                default:
                    description: The model the module recommends for the task, or null when it recommends none. It applies while nobody has chosen, and only when the plan allows it.
                    nullable: true
                    type: string
                description:
                    description: What the model is asked to do, and with what data.
                    type: string
                display:
                    description: What the task is called, in English.
                    type: string
                key:
                    description: The task's key, module.task-name, such as communications.compose-reply.
                    type: string
                model:
                    description: The model the task uses now, always one the plan allows — the choice if there is one and it is still allowed, else the module's recommendation if allowed, else the plan's default.
                    type: string
                source:
                    description: 'Where model comes from: chosen (an Owner chose it), default (the module''s recommendation) or plan (the plan''s default).'
                    enum:
                        - chosen
                        - default
                        - plan
                    type: string
                version:
                    description: The task's version for If-Match, bare — the microseconds of the choice's last change since the epoch, 0 while nobody has chosen. It moves with every save of the task.
                    type: string
            required:
                - key
                - display
                - description
                - model
                - default
                - source
                - version
            type: object
        AiTaskRequest:
            properties:
                model:
                    description: The model the task is to use, one of allowedModels. Anything else is refused 422 model_not_allowed.
                    maxLength: 150
                    type: string
            required:
                - model
            type: object
        AssignRolesResponse:
            properties:
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
                version:
                    nullable: true
                    type: string
            required:
                - userId
                - roleIds
                - version
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthSessionResponse:
            properties:
                businessTimeZone:
                    description: The workspace's business time zone (time zones design D4), the calendar every bookkeeping day is judged in. Always answered; optional in the schema only because the recorded exchanges predate it.
                    type: string
                isSystemAdmin:
                    type: boolean
                timeZone:
                    description: The zone instants are shown to this user in — their own when they chose one, else the business time zone (time zones design D5).
                    type: string
                timeZoneSource:
                    description: Whether timeZone is the user's own choice (personal) or the workspace's (business).
                    enum:
                        - personal
                        - business
                    type: string
                mfaAuthenticated:
                    type: boolean
                mfaEnrollmentRequired:
                    type: boolean
                twoFactorEnabled:
                    type: boolean
                user:
                    $ref: '#/components/schemas/AuthUserResponse'
            required:
                - user
                - twoFactorEnabled
                - mfaEnrollmentRequired
                - mfaAuthenticated
                - isSystemAdmin
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthSuccessResponse:
            properties:
                mfaEnrollmentRequired:
                    type: boolean
                requiresTwoFactor:
                    type: boolean
                twoFactorEnabled:
                    type: boolean
                user:
                    allOf:
                        - $ref: '#/components/schemas/AuthUserResponse'
                    nullable: true
            required:
                - user
                - requiresTwoFactor
                - twoFactorEnabled
                - mfaEnrollmentRequired
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthUserResponse:
            properties:
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                roles:
                    items:
                        type: string
                    type: array
            required:
                - id
                - displayName
                - email
                - roles
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthorizationAuditEvent:
            properties:
                action:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                afterJson:
                    type: string
                beforeJson:
                    type: string
                correlationId:
                    type: string
                details:
                    type: string
                id:
                    format: int64
                    type: integer
                mfaAuthenticated:
                    type: boolean
                occurredAt:
                    format: date-time
                    type: string
                targetRoleId:
                    format: uuid
                    nullable: true
                    type: string
                targetUserId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - id
                - actorUserId
                - targetUserId
                - targetRoleId
                - action
                - details
                - beforeJson
                - afterJson
                - correlationId
                - mfaAuthenticated
                - occurredAt
            type: object
            x-vantigo-source: Vantigo.Identity
        AvatarResponse:
            properties:
                uploaded:
                    type: boolean
                url:
                    type: string
            required:
                - uploaded
                - url
            type: object
            x-vantigo-source: Vantigo.Identity
        BootstrapRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
            required:
                - email
                - displayName
                - password
            type: object
        BootstrapResponse:
            properties:
                user:
                    $ref: '#/components/schemas/AuthUserResponse'
            required:
                - user
            type: object
            x-vantigo-source: Vantigo.Identity
        BootstrapStatusResponse:
            properties:
                available:
                    type: boolean
            required:
                - available
            type: object
            x-vantigo-source: Vantigo.Identity
        CodeMessageError:
            properties:
                code:
                    type: string
                message:
                    type: string
            required:
                - code
                - message
            type: object
        DelegationMutationRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
            required:
                - concurrencyStamp
            type: object
        DelegationRequest:
            properties:
                canCreateRoles:
                    type: boolean
                concurrencyStamp:
                    nullable: true
                    type: string
                expiresAt:
                    format: date-time
                    nullable: true
                    type: string
                granteeUserId:
                    format: uuid
                    type: string
                permissionKeys:
                    items:
                        type: string
                    nullable: true
                    type: array
                stewardedRoleIds:
                    items:
                        format: uuid
                        type: string
                    nullable: true
                    type: array
            required:
                - permissionKeys
                - stewardedRoleIds
            type: object
        DelegationResponse:
            properties:
                canCreateRoles:
                    type: boolean
                expiresAt:
                    format: date-time
                    nullable: true
                    type: string
                granteeUserId:
                    format: uuid
                    type: string
                id:
                    format: uuid
                    type: string
                permissionKeys:
                    items:
                        type: string
                    type: array
                revokedAt:
                    format: date-time
                    nullable: true
                    type: string
                stewardedRoleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                version:
                    type: string
            required:
                - id
                - granteeUserId
                - expiresAt
                - revokedAt
                - version
                - canCreateRoles
                - permissionKeys
                - stewardedRoleIds
            type: object
            x-vantigo-source: Vantigo.Identity
        DelegationRevokeResponse:
            properties:
                id:
                    format: uuid
                    type: string
                revokedAt:
                    format: date-time
                    nullable: true
                    type: string
                version:
                    type: string
            required:
                - id
                - version
                - revokedAt
            type: object
            x-vantigo-source: Vantigo.Identity
        DelegationSaveResponse:
            properties:
                id:
                    format: uuid
                    type: string
                version:
                    type: string
            required:
                - id
                - version
            type: object
            x-vantigo-source: Vantigo.Identity
        DelegationScopeResponse:
            properties:
                assignableRoleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                canCreateRoles:
                    type: boolean
                grantablePermissionKeys:
                    items:
                        type: string
                    type: array
                id:
                    format: uuid
                    type: string
                stewardedRoleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
            required:
                - id
                - canCreateRoles
                - grantablePermissionKeys
                - stewardedRoleIds
                - assignableRoleIds
            type: object
            x-vantigo-source: Vantigo.Identity
        EffectiveAccessResponse:
            properties:
                id:
                    format: uuid
                    type: string
                permissions:
                    items:
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roles:
                    items:
                        nullable: true
                        type: string
                    type: array
                version:
                    nullable: true
                    type: string
            required:
                - id
                - roles
                - roleIds
                - permissions
                - version
            type: object
            x-vantigo-source: Vantigo.Identity
        IdentitySystemStatusResponse:
            properties:
                active:
                    format: int32
                    type: integer
                disabled:
                    format: int32
                    type: integer
                lastAuthenticatedScimRequestAtUtc:
                    format: date-time
                    nullable: true
                    type: string
                lastStaticOidcSignInAtUtc:
                    format: date-time
                    nullable: true
                    type: string
                pendingInvitations:
                    format: int32
                    type: integer
                staticOidcEnabled:
                    type: boolean
                staticOidcProvider:
                    nullable: true
                    type: string
                staticScimEnabled:
                    type: boolean
                total:
                    format: int32
                    type: integer
            required:
                - total
                - active
                - disabled
                - pendingInvitations
                - staticOidcEnabled
                - staticOidcProvider
                - staticScimEnabled
                - lastStaticOidcSignInAtUtc
                - lastAuthenticatedScimRequestAtUtc
            type: object
            x-vantigo-source: Vantigo.Identity
        ApiKey:
            description: An API key of an integration, never its secret (API access design K11).
            properties:
                allowedNetworks:
                    description: The CIDRs the key may be used from; empty for anywhere.
                    items:
                        type: string
                    type: array
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    format: uuid
                    nullable: true
                    type: string
                display:
                    description: The key as it can be recognised once its secret is gone, such as vtg_4f2a…9XyZ.
                    type: string
                expiresAt:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                lastUsedAt:
                    description: When the key was last used, to the minute.
                    format: date-time
                    nullable: true
                    type: string
                lastUsedIp:
                    nullable: true
                    type: string
                name:
                    type: string
                permissions:
                    description: The narrowing, null for none. A permission the roles do not grant does nothing until they do; one the catalog no longer has is kept and ignored.
                    items:
                        $ref: '#/components/schemas/ApiKeyPermission'
                    nullable: true
                    type: array
                readOnly:
                    type: boolean
                revokedAt:
                    format: date-time
                    nullable: true
                    type: string
                rolledFrom:
                    description: The key this one was rolled from.
                    format: uuid
                    nullable: true
                    type: string
                status:
                    enum:
                        - active
                        - expired
                        - revoked
                    type: string
            required:
                - id
                - name
                - display
                - status
                - readOnly
                - allowedNetworks
                - permissions
                - expiresAt
                - createdAt
                - createdBy
                - revokedAt
                - rolledFrom
                - lastUsedAt
                - lastUsedIp
            type: object
        ApiKeyCreateRequest:
            properties:
                allowedNetworks:
                    description: At most 20 CIDRs, IPv4 or IPv6, or single addresses; absent or empty for anywhere.
                    items:
                        type: string
                    type: array
                expiresAt:
                    description: When the key expires, at most 365 days ahead; instead of expiresInDays.
                    format: date-time
                    type: string
                expiresInDays:
                    description: 30, 90, 180 or 365; 90 when neither this nor expiresAt is given.
                    type: integer
                name:
                    description: 1 to 100 characters, such as Production.
                    type: string
                permissions:
                    description: The narrowing, permission keys of the catalog's form; absent for none.
                    items:
                        type: string
                    type: array
                readOnly:
                    description: True for a key that may call only reads.
                    type: boolean
            required:
                - name
            type: object
        ApiKeyPermission:
            properties:
                apiNever:
                    description: True for a permission no API key ever holds, whatever the roles grant (K7).
                    type: boolean
                grantedByRoles:
                    description: Whether the integration's roles grant the permission now and a key may hold it (it is not apiNever).
                    type: boolean
                inCatalog:
                    description: Whether the permission catalog still has the permission.
                    type: boolean
                key:
                    type: string
            required:
                - key
                - grantedByRoles
                - inCatalog
                - apiNever
            type: object
        ApiKeyRollRequest:
            properties:
                expiresAt:
                    description: When the new key expires, at most 365 days ahead; instead of expiresInDays.
                    format: date-time
                    type: string
                expiresInDays:
                    description: 30, 90, 180 or 365; 90 when neither this nor expiresAt is given.
                    type: integer
                overlapHours:
                    description: How long the old key works on, 0 to 168 hours; 24 when absent.
                    type: integer
            type: object
        ApiKeySecret:
            description: A key just created or rolled, with its secret, which is never shown again.
            properties:
                key:
                    $ref: '#/components/schemas/ApiKey'
                secret:
                    description: The key itself, vtg_ and 49 characters, to send as Authorization Bearer.
                    type: string
            required:
                - key
                - secret
            type: object
        Integration:
            description: An external application's account (API access design K8).
            properties:
                archivedAt:
                    format: date-time
                    nullable: true
                    type: string
                contactDisplayName:
                    nullable: true
                    type: string
                contactUserId:
                    description: The person responsible, who gets the integration's notices; null for none.
                    format: uuid
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                id:
                    description: The integration's user, which is what its requests are attributed to.
                    format: uuid
                    type: string
                keyCount:
                    description: The keys in force, neither revoked nor expired.
                    type: integer
                lastUsedAt:
                    format: date-time
                    nullable: true
                    type: string
                name:
                    type: string
                nearestExpiry:
                    description: The earliest expiry among the keys in force.
                    format: date-time
                    nullable: true
                    type: string
                rateLimitPerMinute:
                    type: integer
                roles:
                    items:
                        $ref: '#/components/schemas/IntegrationRole'
                    type: array
                status:
                    enum:
                        - active
                        - disabled
                        - archived
                    type: string
                version:
                    description: The integration's version for If-Match.
                    type: string
            required:
                - id
                - name
                - description
                - contactUserId
                - contactDisplayName
                - rateLimitPerMinute
                - status
                - roles
                - keyCount
                - nearestExpiry
                - lastUsedAt
                - createdAt
                - createdBy
                - archivedAt
                - version
            type: object
        IntegrationConnection:
            description: A connected app (OAuth connections design C25).
            properties:
                authorizedBy:
                    description: The person who connected it, null once they are deleted.
                    format: uuid
                    nullable: true
                    type: string
                authorizedByName:
                    nullable: true
                    type: string
                clientHost:
                    description: For a client identified by its metadata document, the host Vantigo fetched the document from; for a registered client, the host of the redirect URI it was approved for.
                    type: string
                clientId:
                    type: string
                clientKind:
                    description: metadata for a client identified by its metadata document, registered for a client an Owner registered here (OAuth connections design C8, C25).
                    enum:
                        - metadata
                        - registered
                    type: string
                clientName:
                    description: The name the client calls itself, or the name it was registered under, as the consent page showed it.
                    type: string
                connectedAt:
                    format: date-time
                    type: string
                expiresAt:
                    description: When the connection ends by itself, 180 days after it was approved.
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                inactiveReason:
                    description: Why an inactive connection is held back. authorizer_removed when the person who connected it is no longer an active Owner, and its tokens are refused; client_not_allowed when its client's host is no longer on the workspace's list of client hosts (C11), and it cannot renew its token until the host is listed again.
                    nullable: true
                    type: string
                lastUsedAt:
                    format: date-time
                    nullable: true
                    type: string
                lastUsedIp:
                    nullable: true
                    type: string
                scopes:
                    description: read, and write for Read and write.
                    items:
                        type: string
                    type: array
                status:
                    enum:
                        - active
                        - inactive
                    type: string
            required:
                - id
                - clientId
                - clientKind
                - clientName
                - clientHost
                - scopes
                - authorizedBy
                - authorizedByName
                - connectedAt
                - expiresAt
                - lastUsedAt
                - lastUsedIp
                - status
                - inactiveReason
            type: object
        IntegrationConnectionList:
            properties:
                connections:
                    items:
                        $ref: '#/components/schemas/IntegrationConnection'
                    type: array
            required:
                - connections
            type: object
