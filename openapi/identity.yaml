                        - google
                    type: string
                workloadTokenFile:
                    description: Entra only — the absolute path of the workload identity token file the server presents as a client assertion in place of a secret, read afresh at every sign-in; absent while a secret is used.
                    type: string
            required:
                - enabled
                - allowedDomains
                - callbackUrl
            type: object
        SsoOidcSettingsRequest:
            description: 'The workforce OpenID Connect provider, whole; a PUT replaces every field and turns OIDC on. The rules are the ones the OIDC_* environment variables were held to, now checked at the save, and each refusal is a field error under the request''s own field name. The credential: a present workloadTokenFile clears the sealed secret; a present clientSecret clears the token file; a change of provider or clientId requires clientSecret or workloadTokenFile in the same request, since the old application''s credential is never carried to a new one; clientSecret absent with the same provider and clientId keeps the sealed one.'
            properties:
                allowedDomains:
                    description: Google only, where at least one is required — the email domains a sign-in is admitted from, as bare DNS names such as example.com. Each is trimmed, lower-cased and stripped of trailing dots, and duplicates are dropped; a URL, an address, a port or a single label is refused. Absent or empty for Entra.
                    items:
                        type: string
                    type: array
                authority:
                    description: Exactly https://login.microsoftonline.com/<tenant-guid>/v2.0 for entra, exactly https://accounts.google.com for google. A change while people are linked to the provider under the current authority needs confirmIssuerChange.
                    maxLength: 200
                    type: string
                clientId:
                    description: The application's client id — a GUID for entra, one ending .apps.googleusercontent.com for google.
                    maxLength: 200
                    type: string
                clientSecret:
                    description: The client secret, sealed at rest and never answered. Present, it replaces the secret and clears the token file. Absent with the same provider and clientId as the settings hold, it keeps the secret already set; a change of provider or clientId needs clientSecret or workloadTokenFile in the same request, since the old application's credential is never carried to a new one. A secret and workloadTokenFile are mutually exclusive, and one of the two is required.
                    type: string
                confirmIssuerChange:
                    description: True to change the authority while people are linked to the provider under the current one. The links are keyed on the issuer, so a linked person has no link under the new one, so their next sign-in through it finds their address already an account's and is refused oidc_email_conflict, and they sign in with a local credential, if they have one, until an Owner announces their account again under the new provider (POST /owner/users/{id}/sso-link) and their next sign-in links them under it — the old link stays as a row nothing reads; announced links not yet fulfilled are counted with the links. Without this flag such a change is refused 409 oidc_links_exist.
                    type: boolean
                displayName:
                    description: The label of the sign-in page's provider button, at most 100 characters; Workforce SSO when absent or empty.
                    maxLength: 100
                    type: string
                provider:
                    description: entra or google.
                    enum:
                        - entra
                        - google
                    type: string
                workloadTokenFile:
                    description: Entra only — the absolute path of a workload identity token file, presented as a client assertion in place of a secret. Present, it clears the sealed client secret. It must lie in the directory the deployment names (OIDC_WORKLOAD_IDENTITY_TOKEN_DIR), and nothing outside that directory is looked at; the process that saves it must be able to read it, and every replica must see the same file at the same path. It is saved cleaned.
                    maxLength: 500
                    type: string
            required:
                - provider
                - authority
                - clientId
            type: object
        SsoScimSettings:
            description: The SCIM credential a directory provisions users and groups with (Entra design D1 and D2). The token is generated by the server and answered once, when it is issued; only its SHA-256 is kept, so a lost token is replaced, never shown again.
            properties:
                enabled:
                    description: Whether the SCIM endpoint accepts requests.
                    type: boolean
                endpointUrl:
                    description: The SCIM base URL to give the directory — this installation's origin and base path followed by /api/v1/identity/scim/v2. Always sent.
                    type: string
                previousExpiresAt:
                    description: While a rotation overlaps, when the token it replaced stops being accepted; absent otherwise.
                    format: date-time
                    type: string
                tokenSetAt:
                    description: When the current token was issued, or imported from SCIM_TOKEN; absent while there is none.
                    format: date-time
                    type: string
            required:
                - enabled
                - endpointUrl
            type: object
        SsoScimToken:
            description: A newly issued SCIM token, answered this once and never again, since only its SHA-256 is kept. The directory presents it as its bearer token at endpointUrl.
            properties:
                endpointUrl:
                    description: The SCIM base URL to give the directory with the token.
                    type: string
                previousExpiresAt:
                    description: When the token this one replaced stops being accepted; absent when there was none.
                    format: date-time
                    type: string
                settings:
                    $ref: '#/components/schemas/SsoSettings'
                token:
                    description: The bearer token — 32 random bytes, base64url without padding.
                    type: string
            required:
                - token
                - endpointUrl
                - settings
            type: object
        SsoScimTokenRequest:
            description: How long the token being replaced is still accepted, so a directory can be moved to the new one without a gap. Ignored when there is no token yet.
            properties:
                previousExpiresAt:
                    description: When the current token stops being accepted once the new one is issued — in the future and at most 24 hours ahead; 24 hours from now when absent.
                    format: date-time
                    type: string
            type: object
        SsoSettings:
            description: The installation's single sign-on settings (Entra design D1 and D2) — the workforce OpenID Connect provider and the SCIM credential — held in one row that an Owner edits and every process reads within 20 seconds of a save. The client secret and the SCIM tokens are never answered.
            properties:
                directory:
                    allOf:
                        - $ref: '#/components/schemas/SsoDirectory'
                    description: The directory an Owner may connect existing users from — the module serving the configured provider's directory search, so the users page knows whether to offer the picker and the matches. Null while OIDC is off or no enabled module serves the configured provider's directory.
                    nullable: true
                importedFromEnvironment:
                    description: True when the settings were imported from the OIDC_* and SCIM_* environment variables, at the first API start that found them never written. The variables are ignored from then on and should be removed.
                    type: boolean
                lastOidcSignInAt:
                    description: The last sign-in through the OIDC provider; absent while there has been none.
                    format: date-time
                    type: string
                lastScimRequestAt:
                    description: The last SCIM request that presented a valid token; absent while there has been none.
                    format: date-time
                    type: string
                oidc:
                    $ref: '#/components/schemas/SsoOidcSettings'
                scim:
                    $ref: '#/components/schemas/SsoScimSettings'
                version:
                    description: The settings' version, 0 while they were never written. Every write that changes something — the PUT, the token issue and the deletes included — moves it on; a delete with nothing to clear writes nothing. Every write answers the whole row with its version, so a screen holding the row stays current after its own action. Send it back as If-Match on PUT /owner/sso/oidc.
                    format: int32
                    type: integer
            required:
                - version
                - oidc
                - scim
                - importedFromEnvironment
                - directory
            type: object
        AccountPinRequest:
            properties:
                currentPassword:
                    description: The caller's password; not needed when the session signed in within the last 10 minutes.
                    nullable: true
                    type: string
                pin:
                    description: Six digits, not all one digit and not an ascending or descending run.
                    type: string
            required:
                - pin
            type: object
        AccountPinResponse:
            properties:
                needsReenrolment:
                    description: The PIN was set under an earlier version of the installation's key and no longer verifies; set it again.
                    type: boolean
                set:
                    type: boolean
                setAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - set
                - setAt
                - needsReenrolment
            type: object
        BadgeRequest:
            properties:
                badge:
                    description: The code the card reader types, 4 to 128 characters.
                    type: string
                currentPassword:
                    description: The administrator's own password; not needed when their session signed in within the last 10 minutes.
                    nullable: true
                    type: string
            required:
                - badge
            type: object
        OperatorCredentials:
            properties:
                badgeSetAt:
                    format: date-time
                    nullable: true
                    type: string
                badgeNeedsReenrolment:
                    description: The badge was enrolled under an earlier version of the installation's key and no longer verifies; enrol it again.
                    type: boolean
                hasBadge:
                    type: boolean
                hasPin:
                    type: boolean
                pinNeedsReenrolment:
                    description: The PIN was set under an earlier version of the installation's key and no longer verifies; the person sets it again.
                    type: boolean
                pinSetAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - hasPin
                - pinSetAt
                - pinNeedsReenrolment
                - hasBadge
                - badgeSetAt
                - badgeNeedsReenrolment
            type: object
        Station:
            description: A shared shop-floor station (manufacturing phase 2 M129).
            properties:
                activeOperators:
                    items:
                        $ref: '#/components/schemas/StationOperatorSession'
                    type: array
                alertedAt:
                    description: The last time failed operator sign-ins here mailed the administrators.
                    format: date-time
                    nullable: true
                    type: string
                allowedNetworks:
                    description: The networks (CIDR) station requests may come from; null for any.
                    items:
                        type: string
                    nullable: true
                    type: array
                backoff:
                    description: The people with a run of failed sign-ins here that has not yet decayed (an hour after its last failure), each of which an administrator may reset.
                    items:
                        $ref: '#/components/schemas/StationBackoff'
                    type: array
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                idleMinutes:
                    type: integer
                lastSeenAt:
                    format: date-time
                    nullable: true
                    type: string
                lastSeenIp:
                    nullable: true
                    type: string
                name:
                    type: string
                pairedAt:
                    format: date-time
                    nullable: true
                    type: string
                pairingExpiresAt:
                    format: date-time
                    nullable: true
                    type: string
                requirePinWithBadge:
                    type: boolean
                revokedAt:
                    format: date-time
                    nullable: true
                    type: string
                state:
                    $ref: '#/components/schemas/StationState'
                tokenExpiresAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - name
                - state
                - idleMinutes
                - requirePinWithBadge
                - allowedNetworks
                - createdAt
                - pairedAt
                - pairingExpiresAt
                - tokenExpiresAt
                - lastSeenAt
                - lastSeenIp
                - revokedAt
                - alertedAt
                - activeOperators
                - backoff
            type: object
        StationBackoff:
            description: A person's run of consecutive failed sign-ins at a station (M133).
            properties:
                displayName:
                    type: string
                failures:
                    type: integer
                lastFailureAt:
                    format: date-time
                    type: string
                nextAttemptAt:
                    description: Until when the person's attempts here are refused without verifying; null before the fifth failure.
                    format: date-time
                    nullable: true
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - failures
                - lastFailureAt
                - nextAttemptAt
            type: object
        StationList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/Station'
                    type: array
            required:
                - items
            type: object
        StationOperator:
            properties:
                displayName:
                    type: string
                initials:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - initials
            type: object
        StationOperatorCandidate:
            properties:
                displayName:
                    type: string
                hasBadge:
                    type: boolean
                hasPin:
                    type: boolean
                initials:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - initials
                - hasPin
                - hasBadge
            type: object
        StationOperatorCandidateList:
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/StationOperatorCandidate'
                    type: array
            required:
                - items
            type: object
        StationOperatorSession:
            properties:
                displayName:
                    type: string
                initials:
                    type: string
                lastActivityAt:
                    format: date-time
                    type: string
                sessionId:
                    format: uuid
                    type: string
                startedAt:
                    format: date-time
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - sessionId
                - userId
                - displayName
                - initials
                - startedAt
                - lastActivityAt
            type: object
        StationOperatorSignIn:
            properties:
                operator:
                    $ref: '#/components/schemas/StationOperator'
                sessionId:
                    format: uuid
                    type: string
                startedAt:
                    format: date-time
                    type: string
                token:
                    description: The operator token, sent as Authorization Station <token> with each request the operator makes. Kept in memory only.
                    type: string
            required:
                - sessionId
                - token
                - operator
                - startedAt
            type: object
        StationOperatorSignInRequest:
            properties:
                badge:
                    nullable: true
                    type: string
                pin:
                    nullable: true
                    type: string
                userId:
                    format: uuid
                    nullable: true
                    type: string
            type: object
        StationPairRequest:
            properties:
                code:
                    description: The eight-character pairing code an administrator issued.
                    type: string
            required:
                - code
            type: object
        StationPairing:
            properties:
                pairingCode:
                    description: The one-time code, shown once.
                    type: string
                pairingExpiresAt:
                    format: date-time
                    type: string
                station:
                    $ref: '#/components/schemas/Station'
            required:
                - station
                - pairingCode
                - pairingExpiresAt
            type: object
        StationRequest:
            properties:
                allowedNetworks:
                    description: Networks in CIDR notation (192.168.10.0/24) or single addresses; null or empty for any.
                    items:
                        type: string
                    maxItems: 50
                    nullable: true
                    type: array
                currentPassword:
                    description: The administrator's own password, needed to make a station take a badge alone (requirePinWithBadge false) unless their session signed in within the last 10 minutes.
                    nullable: true
                    type: string
                idleMinutes:
                    description: 1 to 60; 5 when left out.
                    nullable: true
                    type: integer
                name:
                    maxLength: 100
                    type: string
                requirePinWithBadge:
                    description: Whether a badge needs its holder's PIN too; true when left out.
                    nullable: true
                    type: boolean
            required:
                - name
            type: object
        StationSelf:
            description: The station this browser is paired as, as the station itself reads it.
            properties:
                id:
                    format: uuid
                    type: string
                idleMinutes:
                    type: integer
                name:
                    type: string
                operators:
                    items:
                        $ref: '#/components/schemas/StationOperatorSession'
                    type: array
                requirePinWithBadge:
                    type: boolean
                timeZone:
                    description: The workspace's business time zone.
                    type: string
            required:
                - id
                - name
                - idleMinutes
                - requirePinWithBadge
                - timeZone
                - operators
            type: object
        StationState:
            enum:
                - pairing
                - paired
                - expired
                - unpaired
                - revoked
            type: string
        SystemMaintenanceRequest:
            properties:
                enabled:
                    type: boolean
                message:
                    nullable: true
                    type: string
            type: object
        SystemMaintenanceStatus:
            properties:
                maintenance:
                    type: boolean
                message:
                    nullable: true
                    type: string
            required:
                - maintenance
                - message
            type: object
            x-vantigo-source: Vantigo.Identity
        TwoFactorRequest:
            properties:
                code:
                    nullable: true
                    type: string
                rememberMe:
                    default: false
                    type: boolean
            required:
                - code
            type: object
        WorkspaceSettings:
            description: The workspace's own settings (time zones design D2 and D3). businessTimeZone is the one calendar every bookkeeping day in the installation is judged in — an invoice's issue day, a period lock, a trip's departure day, Staff's "today" — which every module reads through the platform's BusinessCalendar contract; Europe/Oslo until an Owner sets another.
            properties:
                businessTimeZone:
                    description: An IANA name, such as Europe/Oslo.
                    type: string
            required:
                - businessTimeZone
            type: object
        WorkspaceSettingsRequest:
            properties:
                businessTimeZone:
                    description: An IANA name such as Europe/Oslo, which this server and its database must read the same way; a name the two read differently (CET, an abbreviation to the database and a zone with summer time to the server) is refused. Changing it moves "today" and every day derived from an instant from the next request on; dates already written stay what they were.
                    maxLength: 64
                    type: string
            required:
                - businessTimeZone
            type: object
info:
    title: Vantigo Identity API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/identity/access/audit:
        get:
            operationId: getIdentityAccessAudit
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AuthorizationAuditEvent'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the authorization audit events
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/catalog:
        get:
            operationId: getIdentityAccessCatalog
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PermissionDescriptor'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the permission catalog
            tags:
                - Authorization
            x-vantigo-access: policy:AuthorizationManagement
    /api/v1/identity/access/delegations:
        get:
            operationId: getIdentityAccessDelegations
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/DelegationResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the authorization delegations
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
        post:
            operationId: postIdentityAccessDelegations
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            nullable: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationSaveResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Create an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/delegations/{id}:
        put:
            operationId: putIdentityAccessDelegationsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationSaveResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Update an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/delegations/{id}/revoke:
        post:
            operationId: postIdentityAccessDelegationsByIdRevoke
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/DelegationMutationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegationRevokeResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Revoke an authorization delegation
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/groups:
        get:
            operationId: getIdentityAccessGroups
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/AccessGroupResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the access groups
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
        post:
            operationId: postIdentityAccessGroups
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/AccessGroupRequest'
                            nullable: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccessGroupResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Conflict
            summary: Create an access group
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/groups/{groupId}/members/{userId}:
        delete:
            operationId: deleteIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccessGroupResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CodeMessageError'
                    description: Bad Request
                "401":
                    content:
