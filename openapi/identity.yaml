                    items:
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roles:
                    items:
                        nullable: true
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
                version:
                    nullable: true
                    type: string
            required:
                - userId
                - roles
                - roleIds
                - permissions
                - version
                - canManageAuthorization
                - administrationScope
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessRoleSummary:
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    nullable: true
                    type: string
            required:
                - id
                - name
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessUserResponse:
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                isDisabled:
                    type: boolean
                kind:
                    default: person
                    description: person for a user who signs in, agent for an AI agent (virtual employees design V5). An agent has no credential and is listed apart from the people.
                    enum:
                        - person
                        - agent
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/AccessRoleSummary'
                    type: array
                version:
                    nullable: true
                    type: string
            required:
                - id
                - displayName
                - email
                - isDisabled
                - active
                - version
                - roles
            type: object
            x-vantigo-source: Vantigo.Identity
        AccountPasswordRequest:
            properties:
                currentPassword:
                    nullable: true
                    type: string
                newPassword:
                    nullable: true
                    type: string
            required:
                - currentPassword
                - newPassword
            type: object
        AccountProfileRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
                timeZone:
                    description: The zone instants are shown to this user in (time zones design D5), an IANA name such as Europe/Oslo that the server and its database read the same way — 'CET', 'Local' or a name either does not know is a 400 invalid_request on timeZone. Null, or a blank name, clears it, so the user follows the workspace's business time zone again. Omitted, on any of the three operations, leaves it as it is, so a client that predates it does not clear it. It never moves a bookkeeping day, which is always the business day.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
            required:
                - displayName
            type: object
        AccountResponse:
            properties:
                avatarManagedBy:
                    description: staff when Staff's photo is the picture and the avatar cannot be changed here; null otherwise. Always answered; optional in the schema only because the recorded exchanges predate it.
                    enum:
                        - staff
                    nullable: true
                    type: string
                    x-enum-varnames:
                        - AvatarManagedByStaff
                    x-omitempty: false
                avatarUrl:
                    nullable: true
                    type: string
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
                timeZone:
                    description: The user's own time zone (time zones design D5), an IANA name, or null when they follow the workspace's business time zone. The zone in effect, whichever it is, is the session's timeZone. Always answered; optional in the schema only because the recorded exchanges predate it.
                    nullable: true
                    type: string
                    x-omitempty: false
            required:
                - id
                - displayName
                - email
                - preferredLanguage
                - avatarUrl
            type: object
            x-vantigo-source: Vantigo.Identity
        AdministrationScopeResponse:
            properties:
                delegationScopes:
                    items:
                        $ref: '#/components/schemas/DelegationScopeResponse'
                    type: array
                isOwner:
                    type: boolean
            required:
                - isOwner
                - delegationScopes
            type: object
            x-vantigo-source: Vantigo.Identity
        AiSettings:
            description: 'The installation''s AI plan as an Owner sees it (AI as a platform provider design T12, T13): the provider, the models the plan allows and whether a key is configured, all instance configuration shown as facts, and the AI tasks the enabled modules perform, grouped by module, each with the model it uses now. The key itself is never answered, in any form.'
            properties:
                allowedModels:
                    description: The models the plan allows (AI_MODELS), in the order the operator wrote them; the first is the plan's default.
                    items:
                        type: string
                    type: array
                keyConfigured:
                    description: Whether an API key is configured (AI_API_KEY). A local model (Ollama, vLLM, LM Studio) takes none, so this is false there. The key itself is never sent.
                    type: boolean
                modules:
                    description: The modules that perform AI tasks and are enabled, by name, each with its tasks by key. A module that is off is not listed.
                    items:
                        $ref: '#/components/schemas/AiSettingsModule'
                    type: array
                planDefault:
                    description: The model a task uses when nobody chose one and the module recommends none the plan allows — the first of allowedModels.
                    type: string
                provider:
                    description: The provider the plan calls (AI_PROVIDER), as the operator wrote it. openai-compatible is the OpenAI protocol served by something else, such as a local model. anthropic is Anthropic's Messages API.
                    enum:
                        - openai
                        - openai-compatible
                        - anthropic
                    type: string
            required:
                - provider
                - allowedModels
                - planDefault
                - keyConfigured
                - modules
            type: object
        AiSettingsModule:
            description: One module's AI tasks.
            properties:
                module:
                    description: The module's name, such as communications.
                    type: string
                tasks:
                    items:
                        $ref: '#/components/schemas/AiSettingsTask'
                    type: array
            required:
                - module
                - tasks
            type: object
        AiSettingsTask:
            description: One AI job a module performs and the model it uses.
            properties:
                default:
                    description: The model the module recommends for the task, or null when it recommends none. It applies while nobody has chosen, and only when the plan allows it.
                    nullable: true
                    type: string
                description:
                    description: What the model is asked to do, and with what data.
                    type: string
                display:
                    description: What the task is called, in English.
                    type: string
                key:
                    description: The task's key, module.task-name, such as communications.compose-reply.
                    type: string
                model:
                    description: The model the task uses now, always one the plan allows — the choice if there is one and it is still allowed, else the module's recommendation if allowed, else the plan's default.
                    type: string
                source:
                    description: 'Where model comes from: chosen (an Owner chose it), default (the module''s recommendation) or plan (the plan''s default).'
                    enum:
                        - chosen
                        - default
                        - plan
                    type: string
                version:
                    description: The task's version for If-Match, bare — the microseconds of the choice's last change since the epoch, 0 while nobody has chosen. It moves with every save of the task.
                    type: string
            required:
                - key
                - display
                - description
                - model
                - default
                - source
                - version
            type: object
        AiTaskRequest:
            properties:
                model:
                    description: The model the task is to use, one of allowedModels. Anything else is refused 422 model_not_allowed.
                    maxLength: 150
                    type: string
            required:
                - model
            type: object
        AssignRolesResponse:
            properties:
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
                version:
                    nullable: true
                    type: string
            required:
