    /api/v1/identity/owner/sso/directory/matches:
        get:
            description: 'Proposes, for every user not yet connected to the configured workforce provider, the one account in its directory that matches them exactly — the review an Owner connects a whole workspace from (Google Workspace design G8). The directory is the module''s whose directory search serves the configured provider; the candidates are identity''s: every user who is not pending and has neither a link nor an announced link under the configured issuer, the caller excluded, at most as many as the provider reads (1000 for Entra), in the users'' order (truncated says when more wait). The directory is asked by the candidates'' addresses and employee numbers, exact values only. A guest account matches nobody. A candidate is proposed only when every key that matched points to one and the same account, and that account is neither held for another user nor the one match of another candidate; everything else is left out, and counted as ambiguous when more than one account was in play. The addresses are compared by the provider and never answered. Connecting is POST /owner/users/{id}/sso-link, once per chosen pair. 409 no_directory while OIDC is off or no enabled module serves the configured provider''s directory; 503 provider_unreachable when the directory could not be asked. Rate limited to 6 per client address a minute, a bucket of its own.'
            operationId: getIdentityOwnerSsoDirectoryMatches
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SsoDirectoryMatches'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Conflict — no_directory, OIDC is off or no enabled module serves the configured provider's directory.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — DirectoryMatches's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Service Unavailable — provider_unreachable, the directory could not be asked, or the read took longer than the provider allows.
            summary: Find the directory's exact matches
            tags:
                - Single sign-on
            x-vantigo-access: policy:Owner+OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/owner/sso/directory/users:
        get:
            description: 'Searches the configured workforce provider''s directory by name and address — the picker an Owner connects one user from (Google Workspace design G8). At most 25 accounts. Each says who already holds it under the configured issuer, as far as identity knows: an announced link, a SCIM mapping or an announced account. An account whose person signed in through the provider already is not marked: the link a sign-in makes names no key the directory answers, and connecting it twice is still refused. 400 invalid_request when search is not 2 to 100 characters once trimmed; 409 no_directory while OIDC is off or no enabled module serves the configured provider''s directory; 503 provider_unreachable when the directory could not be asked. Rate limited to 60 per client address a minute, a bucket of its own.'
            operationId: getIdentityOwnerSsoDirectoryUsers
            parameters:
                - description: What to search for, 2 to 100 characters once trimmed. A double quote or a backslash in it is left out.
                  in: query
                  name: search
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SsoDirectoryUsers'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Bad Request — invalid_request, search is not 2 to 100 characters once trimmed; fields names search.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Conflict — no_directory, OIDC is off or no enabled module serves the configured provider's directory.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — DirectorySearch's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Service Unavailable — provider_unreachable, the directory could not be asked.
            summary: Search the directory
            tags:
                - Single sign-on
            x-vantigo-access: policy:Owner+OwnerManagement
            x-vantigo-api: never
    /api/v1/identity/owner/sso/oidc:
        delete:
            description: Turns the workforce OpenID Connect provider off and clears it, the sealed client secret included; every process stops offering it within 20 seconds. While people are linked to the provider, or announced to it and not yet linked, it is refused 409 oidc_links_exist unless confirm is true. Audited sso-settings.changed, without the secret.
            operationId: deleteIdentityOwnerSsoOidc
            parameters:
                - description: True to turn the provider off while people are linked to it.
                  in: query
                  name: confirm
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SsoSettings'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Bad Request — a confirm that is not a boolean.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Conflict — oidc_links_exist, people are linked to the provider and confirm is not true.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Turn the workforce OIDC provider off
            tags:
                - Single sign-on
            x-vantigo-access: policy:Owner+OwnerManagement
            x-vantigo-api: never
        put:
            description: Replaces the workforce OpenID Connect provider whole and turns it on, under If-Match on the settings' version. The rules are the ones the OIDC_* environment variables were held to, each refusal a 400 with field errors under the request's field names. An absent clientSecret keeps the sealed one; a present one replaces it. A change of authority while people are linked under the current one is refused 409 oidc_links_exist unless confirmIssuerChange is true. Audited sso-settings.changed, without the secret; every process reads the change within 20 seconds.
            operationId: putIdentityOwnerSsoOidc
            parameters:
                - description: The version the settings were read at, bare (3) or quoted ("3"). A version that has moved on is a 412 version_mismatch.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/SsoOidcSettingsRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SsoSettings'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Bad Request — field errors on the body, or an If-Match that is not a version.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Conflict — oidc_links_exist, the authority changes while people are linked under the current one and confirmIssuerChange is not true.
                "412":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Precondition Failed — version_mismatch, the settings have been written since the If-Match version.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
