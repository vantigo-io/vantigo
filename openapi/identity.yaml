            operationId: getIdentityIntegrationsByIdRequests
            parameters:
                - description: The integration (its user's id).
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: Only the requests of this key.
                  in: query
                  name: key
                  schema:
                    format: uuid
                    type: string
                - description: Only the requests of this connected app (OAuth connections design A18). With key as well, only requests that match both, which is none.
                  in: query
                  name: connection
                  schema:
                    format: uuid
                    type: string
                - description: Only the requests answered with this status class, 2 for 2xx through 5 for 5xx.
                  in: query
                  name: statusClass
                  schema:
                    maximum: 5
                    minimum: 2
                    type: integer
                - description: Only the requests refused for this reason, or, for idempotent_replay, the answers replayed for an Idempotency-Key.
                  in: query
                  name: reason
                  schema:
                    enum:
                        - expired
                        - revoked
                        - disabled
                        - archived
                        - network
                        - read_only
                        - never
                        - forbidden
                        - rate_limited
                        - insufficient_scope
                        - token_invalid
                        - idempotent_replay
                    type: string
                - description: Only this UTC day, one of the last 30.
                  in: query
                  name: day
                  schema:
                    format: date
                    type: string
