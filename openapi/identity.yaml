                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Bad Request — an If-Match that is not a version.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
