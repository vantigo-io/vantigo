                            schema:
                                type: string
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Service Unavailable — provider_unreachable, the directory could not be asked, or the read took longer than the provider allows.
