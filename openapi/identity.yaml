                        schema:
                            properties:
                                code:
                                    type: string
                                error:
                                    type: string
                                error_description:
                                    type: string
                                state:
                                    type: string
                            type: object
                required: true
            responses:
                "302":
                    description: Redirect to the challenge's redirect URI, or to /sign-in?error=… on failure.
                    headers:
                        Location:
                            schema:
                                type: string
