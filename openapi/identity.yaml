    /api/v1/identity/integrations/{id}/webhooks/{webhookId}/deliveries:
        get:
            description: 'The delivery log of a webhook endpoint (outgoing webhooks design W23), newest first (and by id among those queued at the same instant), by cursor: every event and test event (kind ping) queued to it in the last 30 days, with its state, its attempts and the last one''s status and error word, never its body. state and event narrow it to one state or one event name (webhook.ping for the test events).'
            operationId: getIdentityIntegrationsByIdWebhooksByWebhookIdDeliveries
            parameters:
                - description: The integration (its user's id).
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: The endpoint.
                  in: path
                  name: webhookId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: Only deliveries in this state.
                  in: query
                  name: state
                  required: false
                  schema:
                    enum:
                        - pending
                        - succeeded
                        - dead
                        - skipped
                    type: string
                - description: Only deliveries of this event name, as orders.sales_order.confirmed or webhook.ping.
                  in: query
                  name: event
                  required: false
                  schema:
                    maxLength: 100
                    type: string
                - description: The previous page's nextCursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    type: string
                - description: How many deliveries a page holds, 1 to 100.
                  in: query
                  name: limit
                  required: false
                  schema:
                    default: 50
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WebhookDeliveryPage'
                    description: 'OK'
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Bad Request — invalid_request with field errors: a state, limit or cursor that does not read.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Unauthorized'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Forbidden'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: 'Not Found — not_found, no such integration or endpoint.'
            summary: List a webhook endpoint's deliveries
            tags:
                - API access
            x-vantigo-access: policy:Owner+OwnerManagement
            x-vantigo-api: never
            x-vantigo-assistant: never
