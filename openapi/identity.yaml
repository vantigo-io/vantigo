                    nullable: true
                    type: string
                displayName:
                    nullable: true
                    type: string
                isActive:
                    type: boolean
            required:
                - displayName
            type: object
        AccessGroupResponse:
            properties:
                concurrencyStamp:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
                isActive:
                    type: boolean
                memberUserIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                scimConnectionId:
                    format: uuid
                    nullable: true
                    type: string
                source:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - displayName
                - source
                - scimConnectionId
                - isActive
                - createdAt
                - updatedAt
                - concurrencyStamp
                - memberUserIds
                - roleIds
            type: object
            x-vantigo-source: Vantigo.Identity
        AccessMeResponse:
            properties:
                administrationScope:
