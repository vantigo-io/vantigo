                                $ref: "#/components/schemas/KnowledgeSaved"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Forbidden — the permission is missing (application/json), or article_read_only: the caller can read the article but not write it."
                "404":
                    description: "Not Found — no article the caller can read, or no such version. The body is empty."
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Conflict — version_conflict, article_locked."
            summary: Restore a version of an article
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/assignable-users:
        get:
            description: "Active users from the user directory, for the access dialog's member picker (K4). Only display names are answered."
            operationId: listKnowledgeAssignableUsers
            parameters:
                - description: Narrows the directory search by display name. Absent or blank lists the first page of active users.
                  in: query
                  name: query
                  required: false
                  schema:
                      maxLength: 200
                      type: string
                - description: How many users to answer, 1-20. Defaults to 20.
                  in: query
                  name: limit
                  required: false
                  schema:
                      default: 20
                      format: int32
                      maximum: 20
                      minimum: 1
                      type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeAssignableUserList"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Bad Request — field errors."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Search users to make members
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/favourites:
        get:
            operationId: listKnowledgeFavourites
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeFavouriteList"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: List my favourite articles
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/favourites/{id}:
        delete:
            operationId: removeKnowledgeFavourite
            parameters:
                - description: The article.
                  in: path
                  name: id
                  required: true
                  schema:
                      format: uuid
                      type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: "Not Found — the article is not among the caller's favourites. The body is empty."
            summary: Remove an article from my favourites
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
        put:
            description: "Puts it last; adding one already there changes nothing."
            operationId: addKnowledgeFavourite
            parameters:
                - description: The article.
                  in: path
                  name: id
                  required: true
                  schema:
                      format: uuid
                      type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: "Not Found — no article the caller can read. The body is empty."
            summary: Add an article to my favourites
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/favourites/{id}/move:
        post:
            operationId: moveKnowledgeFavourite
            parameters:
                - description: The article.
                  in: path
                  name: id
                  required: true
                  schema:
                      format: uuid
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/KnowledgeFavouriteMove"
                required: true
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Bad Request — after_invalid: afterId is not among the caller's favourites."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: "Not Found — the article is not among the caller's favourites. The body is empty."
            summary: Reorder my favourites
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/files/{fileId}:
        get:
            description: "Streams a file of an article the caller can read (K19): a JPEG or a PNG inline, anything else as a download (Content-Disposition attachment, application/octet-stream), never sniffed, Cache-Control private. A file whose article the caller cannot read is the bare 404 an unknown id is."
            operationId: getKnowledgeFile
            parameters:
                - description: The file.
                  in: path
                  name: fileId
                  required: true
                  schema:
                      format: uuid
                      type: string
            responses:
                "200":
                    content:
                        "*/*":
                            schema:
                                format: binary
                                type: string
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: "Not Found — no such file, its article is one the caller cannot read, or the object is gone from the store. The body is empty."
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Service Unavailable — storage_unavailable: the object store could not be read."
            summary: Download a file of an article
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/import:
        post:
            description: "Imports Markdown (K23): multipart, the part file holding one .md or a .zip (an Obsidian vault or a Notion export) of at most 50 MiB, at most 500 files and 200 MiB uncompressed, folders at most 10 deep. The articles are created under parentId, which the caller must be able to write, or as roots in section (workspace when neither is given). A zip's folders become the tree; Obsidian's > [!note] callouts become callouts and [[wiki links]] between the imported files become article links; its JPEG and PNG images become the articles' files. What could not be carried over is listed in warnings."
            operationId: importKnowledgeMarkdown
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                                parentId:
                                    format: uuid
                                    type: string
                                section:
                                    $ref: "#/components/schemas/KnowledgeRootSection"
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeImportResult"
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Bad Request — field errors on file (missing, not .md or .zip, a zip that is unreadable, has more than 500 files, is over 200 MiB uncompressed, holds a path outside it or is more than 10 deep, or holds no .md), on parentId (parent_invalid), too_deep."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Forbidden — the permission is missing (application/json), or article_read_only: the caller can read the article but not write it."
                "413":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Payload Too Large — file_too_large: the upload is over 50 MiB."
                "429":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Too Many Requests — import_busy: two imports are running in this server already; try again after Retry-After seconds."
                    headers:
                        Retry-After:
                            schema:
                                type: integer
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Service Unavailable — storage_unavailable: an image could not be written; nothing was created."
            summary: Import Markdown
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/links/resolve:
        post:
            description: "Resolves the targets of a page's article links (K21), in the order asked: ok with the current title and icon, no_access for one the caller cannot read — trashed included — and deleted for one gone for good. The title of an article the caller cannot read is never answered. It writes nothing."
            operationId: resolveKnowledgeLinks
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/KnowledgeLinkResolveRequest"
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeResolvedLinkList"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Bad Request — field errors on ids (more than 200)."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Resolve article links
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/search:
        get:
            description: Full-text search over titles and text in Norwegian and English at once, the last word matched as a prefix (K12). Only articles the caller can read are found, and for the Assistant none hidden from it (K16).
            operationId: searchKnowledge
            parameters:
                - in: query
                  name: q
                  required: true
                  schema:
                      maxLength: 200
                      minLength: 1
                      type: string
                - in: query
                  name: limit
                  required: false
                  schema:
                      default: 20
                      format: int32
                      maximum: 50
                      minimum: 1
                      type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeSearchResult"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeProblem"
                    description: "Bad Request — field errors."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Search articles
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
    /api/v1/knowledge/trash:
        delete:
            description: Deletes every trashed article for good, with its versions (K10). The interface confirms first.
            operationId: emptyKnowledgeTrash
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Empty the trash
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:manage
            x-vantigo-assistant: never
        get:
            description: "The trash groups whose root the caller could write; with knowledge:manage, every one that is not private (K10)."
            operationId: listKnowledgeTrash
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeTrashList"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: List the trash
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
    /api/v1/knowledge/tree:
        get:
            description: "Without parentId, the topmost readable article of every section (K4); with it, that article's readable children. Trashed articles are left out."
            operationId: listKnowledgeTree
            parameters:
                - in: query
                  name: parentId
                  required: false
                  schema:
                      format: uuid
                      type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/KnowledgeTree"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: "Not Found — parentId names no article the caller can read. The body is empty."
            summary: List the sidebar's articles
            tags:
                - Knowledge
            x-vantigo-access: permission:knowledge:articles
            x-vantigo-assistant: never
servers:
