                invoiceId:
                    description: The invoice in Invoices the fact is about — a credit note's, the invoice it credits.
                    format: int64
                    nullable: true
                    type: integer
                lastTriedAt:
                    format: date-time
                    type: string
                orderKey:
                    description: 'What an expense fact waits behind: entry:<id> or claim:<id>.'
                    nullable: true
