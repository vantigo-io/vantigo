                    $ref: '#/components/schemas/AccountingVatTermState'
                total:
                    description: The return's total in whole kroner, to pay (positive) or to receive (negative) — as closed, or as the books stand now; null in the meta for an open term, whose figures the VAT pages compute.
                    nullable: true
                    type: string
                year:
                    format: int32
                    type: integer
            required:
                - closedAt
                - closedByUserId
                - closing
                - coversFrom
                - dueDate
                - filedAt
                - filedByUserId
                - filedClosing
                - filedReference
                - lockCovers
                - needsClosing
                - needsFiling
                - number
                - partial
                - periodEnd
                - periodName
                - periodStart
                - settlementVoucher
                - state
                - total
                - year
            type: object
        AccountingVatTermList:
            additionalProperties: false
            properties:
                terms:
                    description: Oldest first, through the term that holds today; empty when vatTerm is none.
                    items:
                        $ref: '#/components/schemas/AccountingVatTermItem'
                    type: array
                vatTerm:
                    $ref: '#/components/schemas/AccountingVatTerm'
            required:
                - terms
                - vatTerm
            type: object
        AccountingVatTermState:
            enum:
                - open
                - closed
            type: string
        AccountingVoucher:
            additionalProperties: false
            properties:
                amount:
                    description: The sum of the debits.
                    type: string
                attachments:
                    items:
                        $ref: '#/components/schemas/AccountingAttachment'
                    type: array
                description:
                    type: string
                display:
                    type: string
                documentDate:
                    format: date
                    type: string
                fiscalYear:
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingVoucherKind'
                number:
                    format: int32
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                postedByUserId:
                    format: uuid
                    nullable: true
                    type: string
                postings:
                    items:
                        $ref: '#/components/schemas/AccountingPosting'
                    type: array
                reversalReason:
                    nullable: true
                    type: string
                reversedBy:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                reverses:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                rule:
                    nullable: true
                    type: string
                ruleVersion:
                    format: int32
                    nullable: true
                    type: integer
                source:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSource'
                    nullable: true
                sourceDocumentId:
                    description: The document in Invoices a system voucher belongs to — the invoice its payment, credit note or write-off is about — which the screen links to.
                    format: int64
                    nullable: true
                    type: integer
                system:
                    type: boolean
                voucherDate:
                    format: date
                    type: string
            required:
                - amount
                - attachments
                - description
                - display
                - documentDate
                - fiscalYear
                - id
                - kind
                - number
                - postedAt
                - postedByUserId
                - postings
                - reversalReason
                - reversedBy
                - reverses
                - rule
                - ruleVersion
                - source
                - sourceDocumentId
                - system
                - voucherDate
            type: object
        AccountingVoucherKind:
            enum:
                - manual
                - opening
                - sales_invoice
                - sales_credit_note
                - customer_payment
                - charge
                - write_off
                - supplier_invoice
                - supplier_credit_note
                - supplier_payment
                - expense
                - reimbursement
                - vat_settlement
                - bank
                - import
            type: string
        AccountingVoucherList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingVoucherSummary'
                    type: array
                total:
                    description: Every voucher the filters match.
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        AccountingVoucherRef:
            additionalProperties: false
            properties:
                display:
                    description: 2027-000123.
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - display
                - id
            type: object
        AccountingVoucherSummary:
            additionalProperties: false
            properties:
                amount:
                    description: The sum of the debits.
                    type: string
                description:
                    type: string
                display:
                    description: 'The voucher''s number as shown: 2027-000123.'
                    type: string
                documentDate:
                    format: date
                    type: string
                fiscalYear:
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingVoucherKind'
                number:
                    format: int32
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                reversedBy:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                reverses:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                source:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSource'
                    nullable: true
                sourceDocumentId:
                    format: int64
                    nullable: true
                    type: integer
                system:
                    description: Posted by the system for a source fact; only its source reverses it.
                    type: boolean
                voucherDate:
                    format: date
                    type: string
            required:
                - amount
                - description
                - display
                - documentDate
                - fiscalYear
                - id
                - kind
                - number
                - postedAt
                - reversedBy
                - reverses
                - source
                - sourceDocumentId
                - system
                - voucherDate
            type: object
info:
    title: Vantigo Accounting API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/accounting/accounts:
        get:
            operationId: listAccountingAccounts
            parameters:
                - description: Matched against number and name.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
                - description: Only active, or only inactive, accounts.
                  in: query
                  name: active
                  required: false
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccountList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List the chart of accounts
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        post:
            operationId: createAccountingAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingAccountInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors; account_kind_mismatch.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; account_number_taken.
            summary: Create an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/accounts/{id}:
        delete:
            operationId: deleteAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; account_has_postings, account_has_role.
            summary: Delete an account that has no postings
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
        get:
            operationId: getAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Get an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        put:
            operationId: updateAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingAccountUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors; account_kind_mismatch.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; revision_conflict, account_number_taken, account_has_postings (number or kind changed).
            summary: Change an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/accounts/{id}/groupings:
        put:
            operationId: putAccountingAccountGroupings
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingGroupingsInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: 'Bad Request — field errors: a year twice, a code that is not in the year''s list.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Set an account's grouping codes
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/catch-up:
        get:
            description: Reads Invoices' sales journal, with no transaction open, for how far each stream is behind.
            operationId: getAccountingCatchUp
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingCatchUp'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Where the catch-up of sales stands
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/grouping-codes:
        get:
            operationId: listAccountingGroupingCodes
            parameters:
                - description: Default the current year; the latest list not after it is answered.
                  in: query
                  name: year
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: Matched against code and both names.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingGroupingCodeList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List Skatteetaten's grouping codes
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/lock:
        get:
            operationId: getAccountingLock
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingLock'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Get the lock date and its history
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        put:
            description: Forward to a month end, or back with a reason, which the lock's history keeps (A8, R10) — never behind the last VAT term filed at Skatteetaten.
            operationId: putAccountingLock
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingLockInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingLock'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — lock_not_month_end, lock_before_books_start, lock_reason_required, lock_in_future.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; lock_behind_filed_term, lock_behind_closed_term.
            summary: Move the lock date
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/meta:
        get:
            operationId: getAccountingMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingMeta'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get what the caller may do in Accounting and whether the books are set up
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/open-items:
        get:
            operationId: listAccountingOpenItems
            parameters:
                - in: query
                  name: kind
                  required: false
                  schema:
                    $ref: '#/components/schemas/AccountingPartyKind'
                - in: query
                  name: customerId
                  required: false
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: supplierId
                  required: false
                  schema:
                    format: int64
                    type: integer
                - description: 'Default true: only items with a balance.'
                  in: query
                  name: open
                  required: false
                  schema:
                    type: boolean
                - in: query
                  name: offset
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: Default 200, at most 1000.
                  in: query
                  name: limit
                  required: false
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingOpenItemList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List open items
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/open-items/{id}/settlements:
        post:
            operationId: settleAccountingOpenItem
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingSettlementInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingVoucher'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors, amount_invalid, bank_account_invalid, date_before_books_start.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; settlement_source_document, settlement_exceeds_balance, settlement_settled, period_locked.
            summary: Register a receipt, payment or refund on an open item
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:post+accounting:read
    /api/v1/accounting/opening:
        get:
            operationId: getAccountingOpening
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingOpening'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Get the opening balances and the open invoices to offer
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        post:
            description: One voucher of kind opening dated booksStart; a receivables or payables line opens one item per document, and the difference goes to the opening account (A9).
            operationId: postAccountingOpening
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingOpeningInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingVoucher'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors; account_unknown, account_inactive, party_required, party_not_allowed, amount_invalid, voucher_empty, open_item_unknown (a sourceDocumentId that is not an invoice open at the day before books_start, of the line's customer and amount), opening_vat_account (a line on a tax code's VAT or counter account).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; opening_exists, opening_locked.
            summary: Enter the opening balances
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/posting-rules:
        get:
            description: The rules in force, in precedence order. It writes nothing; the default rules are seeded by Set up the books, and for books set up before they existed by the catch-up worker.
            operationId: listAccountingPostingRules
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingPostingRuleList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List the posting rules
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        post:
            operationId: createAccountingPostingRule
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingPostingRuleInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingPostingRule'
