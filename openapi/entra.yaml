components:
    schemas:
        EntraAccount:
            description: 'One account the module keeps in the tenant (Entra design D11, D13): the user it found or created for a person Staff registers, by the directory''s immutable object id. A deleted account stays, marked deleted, for the events'' sake. The pass itself is never answered here; hasPass says one waits to be revealed on the person''s Account tab in Staff.'
            properties:
                adoptionConfirmed:
                    description: True when a holder of entra:manage confirmed the adoption of a user the module found (POST /accounts/{objectId}/confirm). Until then the module writes nothing to that user and reports adoption_unconfirmed. False, and of no matter, for a user the module created.
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                createdByUs:
                    description: True when the module created the user; false when it found one already holding the employee number and linked it — an adopted account, untrusted until confirmed (adoptionConfirmed).
                    type: boolean
                employeeNumber:
                    description: The employee number the user holds as employeeId, at most 16 characters.
                    type: string
                hasPass:
                    description: A Temporary Access Pass was issued and is neither revealed nor expired.
                    type: boolean
                lastSyncedAt:
                    description: When the module last wrote the user. Absent until it has.
                    format: date-time
                    type: string
                objectId:
                    description: The user's object id in the tenant, immutable.
                    format: uuid
                    type: string
                reported:
                    description: The codes of what the module could not act on at its last write — hire_date_not_written, privileged, pass_not_allowed, pass_forbidden, licence_unavailable:<part number>, manager_not_found, leaver_step_failed:<step>, adoption_unconfirmed — never the directory's words.
                    items:
                        type: string
                    type: array
                state:
                    enum:
                        - disabled
                        - enabled
                        - deleted
                    type: string
                userPrincipalName:
                    type: string
            required:
                - objectId
                - employeeNumber
                - userPrincipalName
                - state
                - createdByUs
                - adoptionConfirmed
                - hasPass
                - reported
                - createdAt
            type: object
        EntraAccountCounts:
            description: How many accounts the module keeps in the tenant, by state; count is all of them, deleted included.
            properties:
                count:
                    format: int32
                    type: integer
                deleted:
                    format: int32
                    type: integer
                disabled:
                    format: int32
                    type: integer
                enabled:
                    format: int32
                    type: integer
            required:
                - count
                - enabled
                - disabled
                - deleted
            type: object
        EntraCalendarSyncNotifications:
            description: 'The change notifications from Outlook (calendar Outlook sync design O11.7): with them, a change in a synced mailbox makes its sync due at once rather than at the next poll, which runs either way. status is off while CALENDAR_MAILBOX_NOTIFICATIONS_ENABLED is 0; not_configured while PUBLIC_BASE_URL is unset, Microsoft needing a public HTTPS address; unreachable when Microsoft could not reach the webhook to validate a subscription within the last hour, no subscription being asked for until then; active otherwise.'
            properties:
                lastNotificationAt:
                    description: When a notification last came, to within a minute. Absent until one has.
                    format: date-time
                    type: string
                status:
                    enum:
                        - "off"
                        - not_configured
                        - active
                        - unreachable
                    type: string
                subscriptions:
                    description: The mailboxes with a live subscription.
                    format: int32
                    type: integer
                unreachableAt:
                    description: When Microsoft last could not reach the webhook. Present while status is unreachable.
                    format: date-time
                    type: string
            required:
                - status
                - subscriptions
            type: object
        EntraConnection:
            description: 'The installation''s one connection to a Microsoft Entra ID tenant (Entra design D11): the tenant and the application registered in it, what the last connection test found, the account rules, the client secrets without their values, and how many accounts and groups the module keeps. Sent whether or not anything is set, so the wizard can show every step before the first is done.'
            properties:
                accounts:
                    $ref: '#/components/schemas/EntraAccountCounts'
                clientId:
                    description: The application (client) id of the app registration. Absent until step 1 is saved.
                    format: uuid
                    type: string
                credentials:
                    description: Every client secret ever added, revoked ones included, newest first. The secret itself is sealed and never answered.
                    items:
                        $ref: '#/components/schemas/EntraCredential'
                    type: array
                groups:
                    $ref: '#/components/schemas/EntraGroupCounts'
                lastCheckedAt:
                    description: When the connection was last tested. Absent until it has been, and again after the tenant or the client changes.
                    format: date-time
                    type: string
                organisationName:
                    description: The tenant's organisation name as the last test read it.
                    type: string
                outlookConnect:
                    $ref: '#/components/schemas/EntraOutlookConnect'
                permissionsMissing:
                    description: The application permissions the module needs (User.ReadWrite.All, User-LifeCycleInfo.ReadWrite.All, User.RevokeSessions.All, UserAuthMethod-TAP.ReadWrite.All, LicenseAssignment.ReadWrite.All, Group.ReadWrite.All, Domain.Read.All, Organization.Read.All, and Calendars.ReadWrite while the Outlook connection switch is on) that the last test's token did not carry; all of them before the first test.
                    items:
                        type: string
                    type: array
                permissionsPresent:
                    description: The application permissions the last test's token carried in its roles claim.
                    items:
                        type: string
                    type: array
                permissionsUnexpected:
                    description: 'The application permissions the last test''s token carried that the module does not use (Outlook connection design M19) — a warning, never a status: a permission granted to the application reaches every mailbox or account in the tenant, so one nobody needs is better removed in the portal.'
                    items:
                        type: string
                    type: array
                settings:
                    $ref: '#/components/schemas/EntraSettings'
                status:
                    description: 'unconfigured while the tenant, the client or a valid secret is missing; otherwise what the last test, or a refusal since, found: connected or failing.'
                    enum:
                        - unconfigured
                        - connected
                        - failing
                    type: string
                statusReason:
                    description: 'A code, never the directory''s words: for failing, credential_invalid, tenant_unreachable, consent_missing or secret_expired; for connected, secret_expiring (the newest valid secret ends within 30 days) or role_missing (three sensitive writes in a row were refused, which is the User Administrator role not assigned). Absent when there is nothing to say.'
                    type: string
                tenantId:
                    description: The directory (tenant) id. Absent until step 1 is saved.
                    format: uuid
                    type: string
                verifiedDomains:
                    description: The tenant's verified domains as the last test read them, the choices for the UPN domain.
                    items:
                        type: string
                    type: array
                version:
                    description: The connection's version. PUT /connection and PUT /connection/settings move it on and answer the whole connection; what a test finds, a secret added or revoked and a refusal in the tenant leave it as it is, so an open form is not refused for them. Send it back as If-Match on both PUTs.
                    format: int32
                    type: integer
            required:
                - status
                - verifiedDomains
                - permissionsPresent
                - permissionsMissing
                - settings
                - credentials
                - accounts
                - groups
                - outlookConnect
                - permissionsUnexpected
                - version
            type: object
        EntraConnectionRequest:
            description: Step 1, the tenant and the application registered in it, both GUIDs as the portal's Overview shows them. A change sends the status back to unconfigured until the next test.
            properties:
                clientId:
                    description: The application (client) id, a GUID.
                    type: string
                confirmChange:
                    description: True to change the tenant or the client while the module keeps accounts; without it such a change is refused 409 connection_in_use. Nothing in the tenant is deleted either way.
                    type: boolean
                tenantId:
                    description: The directory (tenant) id, a GUID.
                    type: string
            required:
                - tenantId
                - clientId
            type: object
        EntraConnectionTest:
            description: 'What POST /connection/test found: a token taken with the newest valid secret, the organisation read, and the token''s roles compared with the permissions the module needs. The same is written to the connection.'
            properties:
                organisationName:
                    type: string
                permissionsMissing:
                    items:
                        type: string
                    type: array
                permissionsPresent:
                    items:
                        type: string
                    type: array
                permissionsUnexpected:
                    description: The application permissions the token carried that the module does not use (Outlook connection design M19), a warning.
                    items:
                        type: string
                    type: array
                reason:
                    description: Why the test failed, a code — credential_invalid, tenant_unreachable or consent_missing. Absent when it connected.
                    type: string
                roleKnown:
                    description: Always false. Whether the application holds the User Administrator role cannot be read without a further permission, so the wizard asks the Owner to check it in the portal.
                    type: boolean
                status:
                    enum:
                        - unconfigured
                        - connected
                        - failing
                    type: string
                verifiedDomains:
                    items:
                        type: string
                    type: array
            required:
                - status
                - verifiedDomains
                - permissionsPresent
                - permissionsMissing
                - permissionsUnexpected
                - roleKnown
            type: object
        EntraCredential:
            description: One client secret of the app registration (Entra design D11, credentials in the plural). The newest unrevoked one whose expiry is ahead is the one used. Its value is sealed and never answered.
            properties:
                createdAt:
                    format: date-time
                    type: string
                expiresAt:
                    description: When the secret ends in the tenant, as the portal showed it when it was made.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                inUse:
                    description: This is the secret the module uses now.
                    type: boolean
                kind:
                    enum:
                        - client_secret
                    type: string
                label:
                    description: The secret's description in the portal, or whatever helps the Owner tell two apart.
                    type: string
                lastFailedAt:
                    description: When the tenant last refused a token for it.
                    format: date-time
                    type: string
                lastUsedAt:
                    description: When it last fetched a token, to the minute.
                    format: date-time
                    type: string
                revokedAt:
                    description: When it was revoked here. A revoked secret is kept and never used again.
                    format: date-time
                    type: string
            required:
                - id
                - kind
                - expiresAt
                - createdAt
                - inUse
            type: object
        EntraCredentialRequest:
            description: Step 2, a client secret made under Certificates & secrets. The value is shown in the portal once; it is sealed here at once and never answered again.
            properties:
                expiresAt:
                    description: When the secret ends, in the future and at most 24 months ahead.
                    format: date-time
                    type: string
                kind:
                    enum:
                        - client_secret
                    type: string
                label:
                    description: At most 100 characters.
                    maxLength: 100
                    type: string
                secret:
                    description: The secret's value, 1 to 1000 characters.
                    maxLength: 1000
                    type: string
            required:
                - kind
                - secret
                - expiresAt
            type: object
        EntraDirectoryHolder:
            description: 'Who already holds a directory account''s keys under the configured issuer, as identity knows it: expected, an Owner announced it for an existing user; mapped, the provider''s SCIM push maps it to a user (its userName the principal name, or its externalId the object id); account, Staff announced it for a person yet to arrive, with no user. A sign-in through the provider is not shown: the link it makes names no key the directory answers.'
            properties:
                kind:
                    enum:
                        - expected
                        - mapped
                        - account
                    type: string
                userId:
                    description: The user holding the account. Absent for account.
                    format: uuid
                    type: string
            required:
                - kind
            type: object
        EntraDirectoryMatch:
            description: A user not yet connected and the one directory account that matches them exactly, proposed for connecting.
            properties:
                account:
                    $ref: '#/components/schemas/EntraDirectoryUser'
                matchedBy:
                    description: 'What matched: the user''s address equal, ignoring case, to the account''s mail or its principal name; the user''s employee number equal, trimmed and ignoring case, to the account''s employeeId. Every key that matched points to this account.'
                    items:
                        enum:
                            - mail
                            - userPrincipalName
                            - employeeId
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - account
                - matchedBy
            type: object
        EntraDirectoryMatches:
            description: The exact matches between the users not yet connected and the tenant's accounts. Only an exact match is proposed — no fuzzy match, no guess between two, never a guest account. The users' addresses are compared in the server and never answered.
            properties:
                ambiguous:
                    description: How many candidates were left out because more than one account matched them, or because the account that matched them matched another candidate too. A guest account is no match at all — it is neither proposed nor counted here.
                    format: int32
                    type: integer
                candidates:
                    description: How many users not yet connected were read — every user who is not pending and has neither a link nor an announced link under the configured issuer, the caller excluded.
                    format: int32
                    type: integer
                matches:
                    description: The proposals, in the order identity lists the users.
                    items:
                        $ref: '#/components/schemas/EntraDirectoryMatch'
                    type: array
                truncated:
                    description: True when more than 1000 users were waiting and only the first 1000, in identity's order, were read.
                    type: boolean
            required:
                - matches
                - candidates
                - ambiguous
                - truncated
            type: object
        EntraDirectoryUser:
            description: One account in the tenant as the directory answers it.
            properties:
                accountEnabled:
                    type: boolean
                displayName:
                    type: string
                employeeId:
                    description: The account's employeeId. Absent when it has none.
                    type: string
                guest:
                    description: True when the account is a guest of the tenant (its userType is Guest), invited from another organisation. Absent for a member. The matches never propose a guest.
                    type: boolean
                holder:
                    $ref: '#/components/schemas/EntraDirectoryHolder'
                mail:
                    description: The account's mail. Absent when it has none.
                    type: string
                objectId:
                    description: The account's object id in the tenant, immutable.
                    format: uuid
                    type: string
                userPrincipalName:
                    type: string
            required:
                - objectId
                - displayName
                - userPrincipalName
                - accountEnabled
            type: object
        EntraDirectoryUsers:
            description: The accounts a directory search found, by display name, at most 25. When 25 come back there may be more, and the search should be narrowed.
            properties:
                users:
                    items:
                        $ref: '#/components/schemas/EntraDirectoryUser'
                    type: array
            required:
                - users
            type: object
        EntraEvent:
            description: One write the module made, in the tenant or to its own connection — the module's own append-only trail. It carries the codes and the UPN the module made, never an address beyond it, a secret or a pass.
            properties:
                action:
                    description: entra.connection.changed, entra.connection.tested, entra.settings.changed, entra.credential.added, entra.credential.revoked, entra.user.prepared, entra.user.activated, entra.user.deactivated, entra.user.updated, entra.user.deleted, entra.user.photo_set, entra.user.photo_cleared, entra.pass.issued, entra.pass.revealed or entra.account.adoption_confirmed.
                    type: string
                actor:
                    description: Who acted — the user's id, or the system's name (system:staff-accounts).
                    type: string
                at:
                    format: date-time
                    type: string
                codes:
                    description: What the write reported, as codes.
                    items:
                        type: string
                    type: array
                id:
                    format: int64
                    type: integer
                objectId:
                    description: The user it concerned, by object id. Absent on a connection's event.
                    format: uuid
                    type: string
                upn:
                    description: The user principal name the module made or found. Absent on a connection's event.
                    type: string
            required:
                - id
                - at
                - actor
                - action
                - codes
            type: object
        EntraGroup:
            description: 'One group the module keeps in the tenant for a Staff group (Entra design D14), by the directory''s immutable object id: made by the module, or found by its mail nickname and adopted. Its members and its traits are Staff''s; this is the tenant''s side. A deleted group stays, marked deleted; a security group the module made and Staff let go stays, marked retired: emptied of its people and kept, since the tenant deletes a security group for good.'
            properties:
                adoptionConfirmedAt:
                    description: When a holder of entra:manage confirmed the adoption of a group the module found rather than made (POST /groups/{objectId}/confirm). Until then the module writes nothing to that group — no name, no owner, no member, no delete. Absent for one not confirmed, and for one the module made, which needs no confirmation.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdByUs:
                    description: True when the module created the group; false when it found one holding the mail nickname that it may write, and adopted it — untrusted until confirmed (adoptionConfirmedAt).
                    type: boolean
                displayName:
                    description: The name the module last wrote — Staff's name, with " (archived)" after it once Staff archived the group and keeps it.
                    type: string
                groupId:
                    description: The Staff group's id.
                    type: string
                key:
                    description: The Staff group's key.
                    type: string
                lastMembersAt:
                    description: When the module last reconciled the group's members. Absent until it has.
                    format: date-time
                    type: string
                mailNickname:
                    type: string
                objectId:
                    description: The group's object id in the tenant, immutable.
                    format: uuid
                    type: string
                state:
                    description: present; deleted (soft-deleted in the tenant, or a group the module did not make, left to the tenant); retired (a security group the module made, emptied of its people, renamed "… (archived)" and kept).
                    enum:
                        - present
                        - deleted
                        - retired
                    type: string
                team:
                    description: True once the group became a team in Microsoft Teams.
                    type: boolean
                type:
                    description: security or microsoft365, as the group was made; it never changes.
                    enum:
                        - security
                        - microsoft365
                    type: string
            required:
                - objectId
                - groupId
                - key
                - displayName
                - mailNickname
                - type
                - team
                - state
                - createdByUs
                - createdAt
            type: object
        EntraGroupCounts:
            description: How many groups the module keeps present in the tenant; deleted ones are not counted.
            properties:
                count:
                    format: int32
                    type: integer
            required:
                - count
            type: object
        EntraOutlookAuthorize:
            description: Where to send the browser to connect Outlook — Microsoft's authorization endpoint for the connection's tenant, with the state, nonce and PKCE challenge the answer's cookie holds sealed.
            properties:
                authorizeUrl:
                    type: string
            required:
                - authorizeUrl
            type: object
        EntraOutlookComplete:
            description: A connect completed — the person's connection as it now stands, and the path in Vantigo to return to.
            properties:
                connection:
                    $ref: '#/components/schemas/EntraOutlookConnection'
                returnTo:
                    description: A path on this installation, never another origin; /settings/connections when the connect named none.
                    type: string
            required:
                - connection
                - returnTo
            type: object
        EntraOutlookConnect:
            description: 'The Outlook connection switch (Outlook connection design M2): whether people may connect their own Outlook to Vantigo, and whether a connect can work. status is off while the switch is; unavailable when on but the connection is not connected, reason then being the connection''s statusReason; permission_missing, advisory, when the last test''s token lacks the Calendars.ReadWrite application permission the calendar''s sync still writes with (expected when it is granted with Exchange RBAC for Applications); consent_missing when the last connect found a feature''s delegated permission not consented in the tenant; ready when someone has connected since the switch was last turned on; untested otherwise. connected and reconnect count the people connected and those whose connection Microsoft refused, waiting for them to connect again. redirectUri is the redirect URI to add to the app registration''s Web platform.'
            properties:
                connected:
                    format: int32
                    type: integer
                enabled:
                    type: boolean
                notifications:
                    $ref: '#/components/schemas/EntraCalendarSyncNotifications'
                reason:
                    description: A code, never the directory's words; absent when there is nothing to say.
                    type: string
                reconnect:
                    format: int32
                    type: integer
                redirectUri:
                    description: APP_URL with the base path and /api/v1/entra/outlook/callback.
                    type: string
                status:
                    enum:
                        - "off"
                        - ready
                        - untested
                        - permission_missing
                        - consent_missing
                        - unavailable
                    type: string
            required:
                - enabled
                - status
                - connected
                - reconnect
                - redirectUri
                - notifications
            type: object
        EntraOutlookConnectRequest:
            description: What a connect is for, and where to return once it completes.
            properties:
                feature:
                    description: The feature the connect asks Microsoft's consent for; calendar asks for Calendars.ReadWrite.
                    enum:
                        - calendar
                    type: string
                returnTo:
                    description: A path on this installation to return to; anything that is not one becomes /settings/connections.
                    type: string
            required:
                - feature
            type: object
        EntraOutlookConnection:
            description: 'The caller''s own Outlook connection (Outlook connection design M3, M8). offered says whether the caller may connect at all — false while the switch is off (reason switch_off) or Vantigo knows no Entra account of theirs that the module manages (reason no_account). state is not_connected with no connection, active while it works, reconnect when Microsoft refused it (errorCode says why) and closing once disconnected, which reads as not connected.'
            properties:
                account:
                    description: The userPrincipalName of the Entra account Vantigo knows the caller by. Absent when there is none.
                    type: string
                connectedAt:
                    format: date-time
                    type: string
                errorCode:
                    description: 'Why Microsoft refused the connection, a code: expired, sign_in_again, mfa, blocked or consent_missing. Present while state is reconnect.'
                    type: string
                features:
                    description: The features the granted scopes allow, such as calendar.
                    items:
                        type: string
                    type: array
                offered:
                    type: boolean
                reason:
                    enum:
                        - switch_off
                        - no_account
                    type: string
                scopes:
                    description: The delegated scopes Microsoft granted, lower-cased and sorted.
                    items:
                        type: string
                    type: array
                state:
                    enum:
                        - not_connected
                        - active
                        - reconnect
                        - closing
                    type: string
            required:
                - offered
                - state
                - scopes
                - features
            type: object
        EntraProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: connection_in_use (409: the tenant or the client changes while the module keeps accounts, and confirmChange is not true), adoption_confirmed (409: the account''s adoption is confirmed already), credential_in_use (409: the secret is the only valid one while the module keeps accounts), version_mismatch (412: the connection has been written since the If-Match version), sso_not_configured (409: single sign-on is not configured, so there is nothing to connect under), invalid_request (400: a field is not valid), credential_invalid and tenant_unreachable (503: the tenant could not be asked), throttled (503: the tenant throttled the module twice in a row); for the Outlook connection, switch_off (409: the Outlook connection switch is off), no_account (409: Vantigo knows no Entra account of the caller''s that the module manages), account_taken (409: another person''s connection holds the account), account_mismatch (409: the caller signed in to Microsoft as another account than the one Vantigo knows them by), feature_unknown (422: the connect names no feature the module offers) and expired (410: the connect''s sealed cookie is missing, expired or another session''s). errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        EntraSettings:
            description: 'The account rules (Entra design D13): how the UPN is made, the usage location a licence needs, what a leaver loses, and the Temporary Access Pass a joiner gets.'
            properties:
                defaultUsageLocation:
                    description: The ISO 3166-1 alpha-2 country written as usageLocation when the person's work country is unknown.
                    type: string
                leaverRemoveGroups:
                    description: 'all: a leaver leaves every group that is not dynamic, role-assignable or mail-enabled only; managed: only the module''s own groups; none: no group.'
                    enum:
                        - all
                        - managed
                        - none
                    type: string
                leaverRevokeSessions:
                    description: A leaver's sign-in sessions are revoked after the account is disabled.
                    type: boolean
                leaverStripLicences:
                    description: A leaver's directly assigned licences are removed; group-assigned ones go with the groups.
                    type: boolean
                leaverWriteLeaveDate:
                    description: A leaver's last day is written as employeeLeaveDateTime, 23:00 in the business time zone.
                    type: boolean
                passDelivery:
                    description: Who is meant to hand a joiner their pass — hr, manager or both. Stored and offered; the pass itself is revealed only on the person's Account tab in Staff.
                    enum:
                        - hr
                        - manager
                        - both
                    type: string
                passLifetimeMinutes:
                    description: The pass's lifetime, 10 to 43200 minutes; the tenant's own policy may cap it lower.
                    format: int32
                    type: integer
                passUsableOnce:
                    type: boolean
                upnDomain:
                    description: The verified domain a made-up UPN ends in. Absent until set.
                    type: string
                upnPattern:
                    description: How the UPN's local part is made from the folded names when the work email cannot be the UPN.
                    enum:
                        - given.family
                        - g.family
                        - given
                    type: string
                writeHireDate:
                    description: A joiner's first day is written as employeeHireDate, 01:00 in the business time zone.
                    type: boolean
            required:
                - upnPattern
                - defaultUsageLocation
                - leaverStripLicences
                - leaverRemoveGroups
                - leaverRevokeSessions
                - leaverWriteLeaveDate
                - writeHireDate
                - passLifetimeMinutes
                - passUsableOnce
                - passDelivery
            type: object
        EntraSettingsRequest:
            description: Step 4, the account rules and the Outlook connection switch. Every field is optional, and one left out keeps its value; each refusal is a field error under its own name.
            properties:
                defaultUsageLocation:
                    description: Two letters, ISO 3166-1 alpha-2.
                    type: string
                leaverRemoveGroups:
                    enum:
                        - all
                        - managed
                        - none
                    type: string
                leaverRevokeSessions:
                    type: boolean
                leaverStripLicences:
                    type: boolean
                leaverWriteLeaveDate:
                    type: boolean
                outlookConnect:
                    description: Lets people connect their own Outlook to Vantigo (Outlook connection design M2). Turning it on records when; turning it off closes every person's connection, so each must connect again, and the calendar's copies already written are removed.
                    type: boolean
                passDelivery:
                    enum:
                        - hr
                        - manager
                        - both
                    type: string
                passLifetimeMinutes:
                    description: 10 to 43200.
                    format: int32
                    type: integer
                passUsableOnce:
                    type: boolean
                upnDomain:
                    description: One of the tenant's verified domains once a test has read them; before that, any lower-case domain name.
                    maxLength: 253
                    type: string
                upnPattern:
                    enum:
                        - given.family
                        - g.family
                        - given
                    type: string
                writeHireDate:
                    type: boolean
            type: object
        EntraSku:
            description: One licence the tenant subscribes to, as subscribedSkus lists it.
            properties:
                consumed:
                    description: The seats assigned.
                    format: int32
                    type: integer
                enabled:
                    description: The seats bought (prepaidUnits.enabled).
                    format: int32
                    type: integer
                skuId:
                    format: uuid
                    type: string
                skuPartNumber:
                    description: The part number a Staff group's licences trait names, such as ENTERPRISEPACK.
                    type: string
            required:
                - skuId
                - skuPartNumber
                - enabled
                - consumed
            type: object
info:
    title: Vantigo Microsoft Entra ID API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/entra/accounts:
        get:
            description: Every account the module keeps in the tenant, by UPN, with its state — a read-only list. The pass is never answered.
            operationId: getEntraAccounts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/EntraAccount'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The module's accounts
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/accounts/{objectId}/confirm:
        post:
            description: 'Confirms the adoption of a user the module found holding a person''s employee number rather than created. Until it is confirmed the module writes nothing to that user — no property, no pass, no disable, no delete — and reports adoption_unconfirmed; from then on it manages the user as one it created, and the next write brings it to the person''s spec. Audited entra.account.adoption_confirmed with the actor. 404 for an account the module does not keep, 409 adoption_confirmed for one confirmed already or one the module created.'
            operationId: postEntraAccountsByObjectIdConfirm
            parameters:
                - in: path
                  name: objectId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraAccount'
                    description: OK — the account as confirmed.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the module keeps no account by that object id. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — adoption_confirmed, the adoption is confirmed already, or the module created the user and there is nothing to confirm.
            summary: Confirm an adopted account
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/connection:
        get:
            description: The connection, its settings and its secrets without their values, and the accounts' counts — the status card and every step's Done mark. Reads the module's own rows only; nothing reaches the tenant.
            operationId: getEntraConnection
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraConnection'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the connection
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
        put:
            description: 'Step 1: sets the tenant and the client, under If-Match on the connection''s version, and sends the status back to unconfigured until the next test. While the module keeps accounts a change is refused 409 connection_in_use unless confirmChange is true; a change deletes nothing in the tenant, but the accounts of the old tenant are no longer disabled or deleted by Vantigo, and a change of the tenant forgets every pass not yet revealed. The Owner''s, as the single sign-on settings are: a tenant-wide application credential is an Owner''s to hold. Audited entra.connection.changed with the ids before and after. Rate limited to 30 per client address a minute, shared with every Owner operation of the module.'
            operationId: putEntraConnection
            parameters:
                - description: The version the connection was read at, bare (3) or quoted ("3"). A version that has moved on is a 412 version_mismatch.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EntraConnectionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraConnection'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — field errors on the body, or an If-Match that is not a version.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — connection_in_use, the module keeps accounts and confirmChange is not true.
                "412":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Precondition Failed — version_mismatch, the connection has been written since the If-Match version.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-owner's limit for this client address, shared with every Owner operation of the module.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Set the tenant and the client
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/connection/credentials:
        post:
            description: 'Step 2: adds a client secret, sealed at once and never answered again. Rotation is adding the new one and revoking the old: the newest unrevoked secret whose expiry is ahead is the one used. The Owner''s. Audited entra.credential.added with the label and the dates, never the value. Rate limited with every Owner operation of the module.'
            operationId: postEntraConnectionCredentials
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EntraCredentialRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraCredential'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — field errors on the body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-owner's limit for this client address, shared with every Owner operation of the module.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Add a client secret
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/connection/credentials/{id}:
        delete:
            description: Revokes a client secret — it is kept, marked revoked, and never used again; nothing changes in the tenant, where the Owner deletes it themselves. The only valid secret is refused 409 credential_in_use while the module keeps accounts. The Owner's. Audited entra.credential.revoked. Rate limited with every Owner operation of the module.
            operationId: deleteEntraConnectionCredentialsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraCredential'
                    description: OK — the secret as revoked.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such secret. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — credential_in_use, the only valid secret while the module keeps accounts.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-owner's limit for this client address, shared with every Owner operation of the module.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Revoke a client secret
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/connection/settings:
        put:
            description: 'Step 4: the account rules, under If-Match on the connection''s version. Every field is optional and one left out keeps its value; each refusal is a field error. Audited entra.settings.changed.'
            operationId: putEntraConnectionSettings
            parameters:
                - description: The version the connection was read at, bare (3) or quoted ("3"). A version that has moved on is a 412 version_mismatch.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EntraSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraConnection'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — field errors on the body, or an If-Match that is not a version.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "412":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Precondition Failed — version_mismatch, the connection has been written since the If-Match version.
            summary: Set the account rules
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/connection/skus:
        get:
            description: The licences the tenant subscribes to, with the seats bought and assigned, read from the tenant through the connection — the choices for a Staff group's licences. 503 when the tenant cannot be asked. Rate limited to 30 per client address a minute, a bucket of its own.
            operationId: getEntraConnectionSkus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/EntraSku'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-skus's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Service Unavailable — credential_invalid, no secret fetched a token; or tenant_unreachable, the tenant did not answer.
            summary: The tenant's licences
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/connection/test:
        post:
            description: 'Step 3: tests the connection — a token with the newest valid secret, the organisation and its verified domains read, the token''s roles compared with the permissions the module needs — and writes what it found to the connection. 200 with the result whatever it found, a failure included. The Owner''s. Audited entra.connection.tested with the status and the missing permissions. Rate limited with every Owner operation of the module.'
            operationId: postEntraConnectionTest
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraConnectionTest'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-owner's limit for this client address, shared with every Owner operation of the module.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Test the connection
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/directory/matches:
        get:
            description: 'Proposes, for every user not yet connected to the workforce provider, the one account in the tenant that matches them exactly — the review an Owner connects a whole workspace from. The candidates are identity''s: every user who is not pending and has neither a link nor an announced link under the configured issuer, the caller excluded, at most 1000 of them in identity''s order (truncated says when more wait). The tenant is asked by the candidates'' addresses (mail and userPrincipalName) and employee numbers (employeeId), exact values only. A guest account (userType Guest) matches nobody: it is left out before matching, and not counted. A candidate is proposed only when every key that matched points to one and the same account, and that account is neither held for another user (an announced link or a SCIM mapping of somebody else''s, or an announced account, names it) nor the one match of another candidate; everything else is left out, and counted as ambiguous when more than one account was in play. The addresses are compared here and never answered. The read is bounded to two minutes, past which it answers 503 tenant_unreachable; an Owner''s second request while their first is still reading waits for it and gets the same answer. Connecting is identity''s announced link, POST /api/v1/identity/owner/users/{id}/sso-link, once per chosen pair. 409 sso_not_configured while single sign-on is off. Rate limited to 6 per client address a minute, a bucket of its own.'
            operationId: getEntraDirectoryMatches
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraDirectoryMatches'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — sso_not_configured, single sign-on is not configured, so there is nothing to connect under.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-matches's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Service Unavailable — credential_invalid, no secret fetched a token; tenant_unreachable, the tenant did not answer, or the read took more than two minutes; or throttled, the tenant throttled the module twice in a row.
            summary: Find the directory's exact matches
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/directory/users:
        get:
            description: 'Searches the tenant''s accounts by display name, mail and principal name — the picker an Owner connects one user from. At most 25 accounts, by display name. Each says who already holds it under the configured issuer, as far as identity knows: an announced link, a SCIM mapping or an announced account. An account whose person signed in through the provider already is not marked: the link a sign-in makes names no key the directory answers, and identity still refuses connecting it twice. Rate limited to 60 per client address a minute, a bucket of its own.'
            operationId: getEntraDirectoryUsers
            parameters:
                - description: What to search for, 2 to 100 characters once trimmed. A double quote or a backslash in it is left out.
                  in: query
                  name: q
                  required: true
                  schema:
                    maxLength: 100
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraDirectoryUsers'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — invalid_request, q is not 2 to 100 characters once trimmed; errors names q.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-directory's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Service Unavailable — credential_invalid, no secret fetched a token; tenant_unreachable, the tenant did not answer; or throttled, the tenant throttled the module twice in a row.
            summary: Search the directory
            tags:
                - Entra
            x-vantigo-access: policy:Owner+OwnerManagement
    /api/v1/entra/events:
        get:
            description: The module's recent writes, newest first — the status card's events.
            operationId: getEntraEvents
            parameters:
                - description: How many, 1 to 200; 50 when absent.
                  in: query
                  name: limit
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/EntraEvent'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — a limit outside 1 to 200.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The module's recent events
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/groups:
        get:
            description: Every group the module keeps in the tenant for Staff's groups, deleted ones included, by display name — a read-only list. Staff decides what exists; the module page shows the tenant's side.
            operationId: getEntraGroups
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/EntraGroup'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The module's groups
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/groups/{objectId}/confirm:
        post:
            description: 'Confirms the adoption of a group the module found holding a Staff group''s mail nickname rather than made. Until it is confirmed the module writes nothing to that group — no name, no description, no owner, no member — and Staff''s sync waits with group_unconfirmed; from then on the module writes to it as to one it made, and Staff''s next cycle adds the owners and writes the name, the description and the members. The module never deletes a group it did not make. Idempotent: a group confirmed already, or one the module made, is answered as it is. Audited entra.group.adoption_confirmed with the actor, once. 404 for a group the module does not keep.'
            operationId: postEntraGroupsByObjectIdConfirm
            parameters:
                - in: path
                  name: objectId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraGroup'
                    description: OK — the group as confirmed.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the module keeps no group by that object id. The body is empty.
            summary: Confirm an adopted group
            tags:
                - Entra
            x-vantigo-access: permission:entra:manage
    /api/v1/entra/mailbox-notifications:
        post:
            description: 'Microsoft Graph''s webhook for the change notifications of the Outlook sync (calendar Outlook sync design O11.5): Graph posts here, to PUBLIC_BASE_URL, on the public host''s allowlist and on the app''s host alike. Anonymous: Graph sends no session, and a signed-in caller is answered alike. A notification is a nudge — it makes the mailbox''s sync due and nothing more; nothing it says is trusted beyond "this subscription fired", nor stored. The handshake: a request carrying validationToken is answered 200 text/plain with the token, only while the module is creating a subscription (for 30 seconds before each create) and only for a token of at most 1024 bytes with no control character; else 404 with no body. A notification: {"value": [...]}, at most 1000 items read, each taken only when its subscriptionId is a GUID the module holds, its clientState''s SHA-256 equals the one stored (compared in constant time) and its tenantId is the connection''s; a valid one marks its subscription notified, and a lifecycle event of reauthorizationRequired or subscriptionRemoved marks the subscription for renewal or as removed. 202 with no body for any body that decodes, whatever it named — an unknown subscription and a valid one are answered alike. The body is capped at 1 MiB. Rate limited to 600 per client address a minute (entra-mailbox-notifications). Served by the generated strict wrapper: it reads a text/plain body as a string and a JSON one as a free-form object, and answers the handshake as text/plain.'
            operationId: postEntraMailboxNotifications
            parameters:
                - description: Graph's validation token, present on the handshake alone and answered back as it came, decoded.
                  in: query
                  name: validationToken
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            additionalProperties: true
                            type: object
                    text/plain:
                        schema:
                            type: string
                required: false
            responses:
                "200":
                    content:
                        text/plain; charset=utf-8:
                            schema:
                                type: string
                    description: OK — the handshake, answered with the validation token.
                    headers:
                        Cache-Control:
                            schema:
                                type: string
                        X-Content-Type-Options:
                            schema:
                                type: string
                "202":
                    description: Accepted — the body decoded; whatever it named, nothing more is said. The body is empty.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Bad Request — a body that does not decode.
                "404":
                    description: Not Found — a handshake outside a create in flight, or a token too long or carrying a control character. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-mailbox-notifications's limit for this client address. Graph retries.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Service Unavailable — the notification could not be recorded within two seconds. Graph retries.
            summary: Microsoft's change notifications
            tags:
                - Entra
            x-vantigo-access: anonymous
    /api/v1/entra/outlook/callback:
        get:
            description: 'The Outlook connection''s redirect URI (Outlook connection design M4), on APP_URL with the base path, never the public host. Anonymous: Microsoft''s redirect carries the browser''s Lax cookies but the session''s Strict one is not sent. It checks the state against the sealed vantigo.entra.connect cookie — nothing is written without a valid one — redeems the code through the module''s guarded client with the PKCE verifier, verifies the id_token''s signature, issuer, audience, nonce and tenant, checks the granted scopes, and seals the result into vantigo.entra.connected for POST /outlook/complete. Every answer clears vantigo.entra.connect and redirects to /settings/connections with outlook=complete, or outlook=failed and code: expired, access_denied, tenant_mismatch, consent_missing or failed. error_description is never read, session_state is ignored. Rate limited to 60 per client address a minute (entra-outlook-callback).'
            operationId: getEntraOutlookCallback
            parameters:
                - in: query
                  name: code
                  schema:
                    type: string
                - in: query
                  name: state
                  schema:
                    type: string
                - in: query
                  name: error
                  schema:
                    type: string
                - description: Microsoft's words, never read.
                  in: query
                  name: error_description
                  schema:
                    type: string
                - description: Ignored.
                  in: query
                  name: session_state
                  schema:
                    type: string
            responses:
                "302":
                    description: Found — to /settings/connections?outlook=complete, or ?outlook=failed&code=… on any failure.
                    headers:
                        Location:
                            schema:
                                type: string
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-outlook-callback's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Microsoft's answer to a connect
            tags:
                - Entra
            x-vantigo-access: anonymous
    /api/v1/entra/outlook/complete:
        post:
            description: 'Completes a connect under the session (Outlook connection design M4): opens vantigo.entra.connected, which must be the caller''s and this session''s, checks the switch and that the account signed in is the one Vantigo knows the caller by, and stores the connection with its refresh token sealed — taking over a closing connection of the same account, and closing the caller''s connection of another account. Audited entra.outlook.connected. The cookie is cleared on every answer. 410 expired for a cookie missing, expired or another session''s; 409 switch_off, no_account, account_mismatch (the detail names both accounts) or account_taken. Rate limited to 30 per client address a minute, shared with POST /outlook/connect (entra-outlook).'
            operationId: postEntraOutlookComplete
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraOutlookComplete'
                    description: OK — connected.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — switch_off, no_account, account_mismatch or account_taken.
                "410":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Gone — expired, the connect's cookie is missing, expired, or another session's.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-outlook's limit for this client address, shared with POST /outlook/connect.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Complete connecting Outlook
            tags:
                - Entra
            x-vantigo-access: session
    /api/v1/entra/outlook/connect:
        post:
            description: 'Starts connecting the caller''s Outlook (Outlook connection design M4): checks the feature, the switch, the Entra account Vantigo knows the caller by (Staff''s directory account, managed by this module, enabled and trusted) and that no other person''s connection holds it; then seals a fresh state, nonce and PKCE verifier with the session into the vantigo.entra.connect cookie (HttpOnly, SameSite=Lax, ten minutes, on /api/v1/entra/outlook) and answers the authorization URL to send the browser to. 422 feature_unknown; 409 switch_off, no_account or account_taken. Rate limited to 30 per client address a minute, shared with POST /outlook/complete (entra-outlook).'
            operationId: postEntraOutlookConnect
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EntraOutlookConnectRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraOutlookAuthorize'
                    description: OK — the cookie is set; send the browser to authorizeUrl.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Conflict — switch_off, no_account or account_taken.
                "422":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EntraProblem'
                    description: Unprocessable Content — feature_unknown.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — entra-outlook's limit for this client address, shared with POST /outlook/complete.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Start connecting Outlook
            tags:
                - Entra
            x-vantigo-access: session
    /api/v1/entra/outlook/connection:
        delete:
            description: 'Disconnects the caller''s Outlook (Outlook connection design M7): their live connection closes, its token kept only for the removals that may still need it, and is deleted once nothing does. Audited entra.outlook.disconnected. 204 whether or not there was one. The person''s sign-in sessions are never revoked.'
            operationId: deleteEntraOutlookConnection
            responses:
                "204":
                    description: No Content — disconnected, or nothing was connected.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
            summary: Disconnect Outlook
            tags:
                - Entra
            x-vantigo-access: session
        get:
            description: The caller's own Outlook connection, whether they may connect, and the account Vantigo knows them by. Always 200, so the page can tell "not connected" from "nothing to connect". Reads the module's own rows and Staff's directory account; nothing reaches the tenant.
            operationId: getEntraOutlookConnection
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntraOutlookConnection'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
            summary: Get my Outlook connection
            tags:
                - Entra
            x-vantigo-access: session
servers:
    - url: /
