components:
    schemas:
        CategoryRequest:
            properties:
                name:
                    type: string
                parentId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - name
            type: object
        CategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                parentId:
                    format: int32
                    nullable: true
                    type: integer
                productCount:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - productCount
            type: object
        PaginatedResponseOfProductResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProductResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProductCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        ProductImageProblem:
            description: 'An RFC 9457 problem with this module''s image refusal code, the one place Products'' problems carry a code (messenger design N13): image_type_unsupported (422: not a JPEG or PNG, WebP and HEIC among them), image_too_large (422: more than 10 MiB, or more than 40 megapixels), image_too_small (422: a side under 200 pixels), image_invalid (422: the bytes are no picture, or cannot be decoded) and storage_unavailable (503: the object store could not be reached).'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        ProductImageResponse:
            description: An image of a product (messenger design N13). The bytes are the normalised file, upright, at most 2048 pixels on the longer side and without metadata, streamed by GET .../content; the thumbnail, 320 pixels on the longer side, by the same with size=thumb.
            properties:
                altText:
                    description: What the picture shows, for a customer who cannot see it. Absent when not set.
                    type: string
                byteSize:
                    description: The normalised file's size in bytes.
                    format: int32
                    type: integer
                contentType:
                    description: image/jpeg or image/png.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                height:
                    description: The normalised file's height in pixels.
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                isPrimary:
                    description: Whether this is the product's primary image. Exactly one image of a product is, once it has any.
                    type: boolean
                productId:
                    format: int32
                    type: integer
                sortOrder:
                    description: The image's place among the product's images, from 0, with no gaps.
                    format: int32
                    type: integer
                uses:
                    description: 'Where the image may be shown: communications, to a customer in a message; marketing, for marketing use such as ads — nothing reads it yet.'
                    items:
                        enum:
                            - communications
                            - marketing
                        type: string
                    type: array
                width:
                    description: The normalised file's width in pixels.
                    format: int32
                    type: integer
            required:
                - id
                - productId
                - contentType
                - byteSize
                - width
                - height
                - sortOrder
                - isPrimary
                - uses
                - createdAt
            type: object
        ProductImageUpdateRequest:
            description: A change to an image. Every field is optional, and a field left out is left as it is.
            properties:
                altText:
                    description: What the picture shows, at most 250 characters. An empty text clears it.
                    type: string
                isPrimary:
                    description: true makes this the product's primary image, and the one that was primary stops being it. false is refused for the primary image, since another image's true is what replaces it.
                    type: boolean
                sortOrder:
                    description: The place, from 0, to move the image to among the product's images; the others close the gap, and a place past the last is the last.
                    format: int32
                    type: integer
                uses:
                    description: Where the image may be shown, replacing the earlier list; at most one of each, and none is allowed.
                    items:
                        enum:
                            - communications
                            - marketing
                        type: string
                    type: array
            type: object
        ProductPackagingRequest:
            description: A packaging's fields, on create and on a whole replace. Give either quantity, or containsPackagingId with containsCount — not both. A variant has at most 10 packagings. Changing what a packaging holds recomputes every packaging built from it; stock is never touched, it is always in the variant's unit.
            properties:
                barcode:
                    description: A GTIN with a valid check digit.
                    maxLength: 14
                    nullable: true
                    type: string
                containsCount:
                    format: int32
                    minimum: 2
                    nullable: true
                    type: integer
                containsPackagingId:
                    format: int32
                    nullable: true
                    type: integer
                heightCm:
                    format: double
                    nullable: true
                    type: number
                kind:
                    description: inner, case, pallet or other.
                    type: string
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                name:
                    maxLength: 40
                    type: string
                quantity:
                    description: More than 0, at most three decimals.
                    format: double
                    nullable: true
                    type: number
                sortOrder:
                    format: int32
                    type: integer
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - name
                - kind
            type: object
        ProductPackagingResponse:
            description: 'A packaging of a variant (inventory design I24): a box, a case or a pallet the variant is stored and counted in. It holds either a quantity of the variant''s unit, or a count of another packaging of the same variant, in which case quantity is derived (a Euro pallet of 40 boxes of 15 holds 600).'
            properties:
                barcode:
                    description: A GTIN-8, -12, -13 or -14, unique across every variant and packaging.
                    nullable: true
                    type: string
                containsCount:
                    description: How many of containsPackagingId it holds, at least 2.
                    format: int32
                    nullable: true
                    type: integer
                containsPackagingId:
                    description: The packaging it is built from; absent when it holds a quantity directly.
                    format: int32
                    nullable: true
                    type: integer
                createdAt:
                    format: date-time
                    type: string
                heightCm:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                kind:
                    description: inner, case, pallet or other.
                    type: string
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                quantity:
                    description: What it holds in the variant's unit, three decimals; derived when it is built from another packaging.
                    format: double
                    type: number
                sortOrder:
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - name
                - kind
                - quantity
                - sortOrder
                - createdAt
                - updatedAt
            type: object
        ProductPriceRequest:
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                validFrom:
                    format: date-time
                    nullable: true
                    type: string
                validTo:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - currency
                - amount
            type: object
        ProductPriceResponse:
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                id:
                    format: int32
                    type: integer
                validFrom:
                    format: date-time
                    nullable: true
                    type: string
                validTo:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - currency
                - amount
            type: object
        ProductRequest:
            properties:
                categoryId:
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                name:
                    type: string
                status:
                    nullable: true
                    type: string
                taxCategoryId:
                    format: int32
                    type: integer
                type:
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/VariantRequest'
                    nullable: true
                    type: array
            required:
                - name
                - type
                - taxCategoryId
            type: object
        ProductResponse:
            properties:
                barcode:
                    nullable: true
                    type: string
                category:
                    allOf:
                        - $ref: '#/components/schemas/ProductCategoryResponse'
                    nullable: true
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                effectivePrices:
                    items:
                        $ref: '#/components/schemas/ProductPriceResponse'
                    type: array
                heightCm:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                sku:
                    nullable: true
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                status:
                    type: string
                taxCategory:
                    $ref: '#/components/schemas/ProductTaxCategoryResponse'
                type:
                    type: string
                unit:
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/ProductVariantResponse'
                    type: array
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - name
                - type
                - status
                - taxCategory
                - effectivePrices
                - variants
                - createdAt
                - updatedAt
            type: object
        ProductStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ProductStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        ProductStatsSummaryResponse:
            properties:
                from:
                    format: date-time
                    type: string
                newProducts:
                    format: int32
                    type: integer
                newProductsDelta:
                    format: int32
                    type: integer
                statusCountDeltas:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                statusCounts:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                to:
                    format: date-time
                    type: string
                totalActiveProducts:
                    format: int32
                    type: integer
                totalActiveProductsDelta:
                    format: int32
                    type: integer
            required:
                - from
                - to
                - totalActiveProducts
                - totalActiveProductsDelta
                - newProducts
                - newProductsDelta
                - statusCounts
                - statusCountDeltas
            type: object
        ProductTaxCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - rate
            type: object
        ProductVariantResponse:
            properties:
                barcode:
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                effectivePrices:
                    items:
                        $ref: '#/components/schemas/ProductPriceResponse'
                    type: array
                heightCm:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                optionValues:
                    additionalProperties:
                        type: string
                    type: object
                packagings:
                    description: The variant's packagings, by sort order then id; always sent (optional only because the recorded exchanges of the port predate it).
                    items:
                        $ref: '#/components/schemas/ProductPackagingResponse'
                    type: array
                sku:
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                tracking:
                    $ref: '#/components/schemas/VariantTracking'
                expiryDays:
                    description: The days a new lot's expiry lies after its production or receipt date (manufacturing phase 2 M49); null when unset.
                    format: int32
                    nullable: true
                    type: integer
                bestBeforeDays:
                    description: The days a new lot's best-before date lies after its production or receipt date; null when unset.
                    format: int32
                    nullable: true
                    type: integer
                unit:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - sku
                - unit
                - optionValues
                - effectivePrices
                - tracking
                - createdAt
                - updatedAt
            type: object
        TaxCategoryRequest:
            properties:
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - name
                - kind
                - rate
            type: object
        TaxCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - rate
            type: object
        VariantTracking:
            description: |-
                How the variant's stock is tracked (manufacturing phase 2 M49): none, in lots, or in serials (lots of at most one). Only a goods product's variant may be tracked. On a create, absent is none; on an update, absent keeps the stored mode. Until production captures lots, a write of any mode but none is refused with 409 *Tracking unavailable*.
            enum:
                - none
                - lot
                - serial
            type: string
        VariantRequest:
            properties:
                barcode:
                    nullable: true
                    type: string
                heightCm:
                    format: double
                    nullable: true
                    type: number
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                optionValues:
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
                prices:
                    items:
                        $ref: '#/components/schemas/ProductPriceRequest'
                    nullable: true
                    type: array
                sku:
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                tracking:
                    $ref: '#/components/schemas/VariantTracking'
                expiryDays:
                    description: The days a new lot's expiry lies after its production or receipt date, 1–3650; null or absent clears it.
                    format: int32
                    nullable: true
                    type: integer
                bestBeforeDays:
                    description: The days a new lot's best-before date lies after its production or receipt date, 1–3650; null or absent clears it.
                    format: int32
                    nullable: true
                    type: integer
                unit:
                    nullable: true
                    type: string
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - sku
            type: object
info:
    title: Vantigo Products API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/products:
        get:
            operationId: getProducts
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: sortBy
                  schema:
                    type: string
                - in: query
                  name: sortDirection
                  schema:
                    type: string
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: categoryId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: uncategorized
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProductResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all products
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-view+products:tax-categories-view+products:variants-view
        post:
            operationId: postProducts
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: Created
                    headers:
                        Location:
                            description: The path of the newly created product, /api/v1/products/{id}.
                            schema:
                                type: string
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Create a new product
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-manage+products:tax-categories-view+products:variants-manage+products:variants-view
    /api/v1/products/{id}:
        delete:
            description: Marks the product as discontinued. Products are never hard-deleted because other services reference them.
            operationId: deleteProductsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a product
            tags:
                - Products
            x-vantigo-access: permission:products:products-manage
        get:
            operationId: getProduct
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a product by id
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-view+products:tax-categories-view+products:variants-view
        put:
            operationId: putProductsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: 'Conflict — titled Product has stock: the type changes from Goods to Service while a module holding one of its variants (Inventory) answers that it still lies somewhere. Products'' problems carry no code.'
            summary: Update a product
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-manage+products:tax-categories-view+products:variants-view
    /api/v1/products/{id}/images:
        get:
            description: The product's images in their order, empty when it has none.
            operationId: getProductsByIdImages
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ProductImageResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List a product's images
            tags:
                - Products
            x-vantigo-access: permission:products:products-view
        post:
            description: 'Uploads an image of the product (messenger design N13): a JPEG or PNG of at most 10 MiB and at least 200 by 200 pixels, in the multipart field file, whose own bytes decide its type. More than 40 megapixels is refused before anything is decoded. The picture is turned upright by its EXIF orientation, scaled down so its longer side is at most 2048 pixels, and encoded again — JPEG at quality 90, or PNG — which drops all its metadata, camera location included; only that file is kept, and a 320 pixel thumbnail beside it. The first image of a product becomes its primary one, and a new image is last in the order, shown in Communications. Products'' problems carry no code, but an image''s refusals do.'
            operationId: postProductsByIdImages
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductImageResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the file is missing, empty or sent more than once, or the body cannot be read as a multipart form.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "422":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProductImageProblem'
                    description: Unprocessable Entity — image_type_unsupported, image_too_large, image_too_small or image_invalid.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 600 image uploads an hour from one client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ProductImageProblem'
                    description: Service Unavailable — storage_unavailable, the object store could not be written; nothing was recorded.
