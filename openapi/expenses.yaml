            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesRateResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — including a validFrom the kind already has another row for.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no rate has that id.
            summary: Change an expense rate
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/settings:
        get:
            description: The settings every expenses:access holder may know — the currency a new expense starts in, the default markup, the receipt threshold and the period lock.
            operationId: getExpensesSettings
            responses:
