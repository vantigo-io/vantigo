components:
    schemas:
        Agent:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                dailyTokenBudget:
                    description: Null for none.
                    format: int32
                    nullable: true
                    type: integer
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                hasAvatar:
                    type: boolean
                id:
                    format: uuid
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: The model the agent works with (task agents.run), always one AI_MODELS allows; empty when the installation has no AI provider.
                    type: string
                name:
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/AgentRole'
                    type: array
                state:
                    enum:
                        - active
                        - paused
                    type: string
                style:
                    description: How it writes, up to 1,500 characters.
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                userId:
                    description: The agent's identity user, of kind agent. Its roles are given on Identity's roles screen.
                    format: uuid
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - userId
                - name
                - style
                - languages
                - disclosureWording
                - state
                - dailyTokenBudget
                - model
                - hasAvatar
                - roles
                - version
                - createdAt
                - updatedAt
            type: object
        AgentCreateRequest:
            additionalProperties: false
            properties:
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: A model AI_MODELS allows; empty follows the workspace's choice for the task.
                    type: string
                name:
                    description: 1 to 60 characters.
                    maxLength: 60
                    minLength: 1
                    type: string
                style:
                    description: Up to 1,500 characters.
                    maxLength: 1500
                    type: string
            required:
                - name
                - style
                - languages
                - disclosureWording
                - model
            type: object
        AgentList:
            additionalProperties: false
            properties:
                agents:
                    items:
                        $ref: '#/components/schemas/Agent'
                    type: array
            required:
                - agents
            type: object
        AgentPermission:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
                version:
                    description: The agent's version after the change.
                    format: int32
                    type: integer
            required:
                - permissionKey
                - level
                - version
            type: object
        AgentPermissionRequest:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
            required:
                - level
            type: object
        AgentRole:
            additionalProperties: false
            properties:
                agentId:
                    format: uuid
                    type: string
                capsToolCalls:
                    description: Tool calls a run may make, 1 to 60.
                    format: int32
                    type: integer
                capsTurns:
                    description: Model turns a run may take, 1 to 16.
                    format: int32
                    type: integer
                channelIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                complaintTagIds:
                    description: 'The Communications tags that mark a complaint (S5): a conversation carrying one is held in Review and Auto above X %.'
                    items:
                        format: uuid
                        type: string
                    type: array
                createdAt:
                    format: date-time
                    type: string
                handOffUserId:
                    description: The person a hand-off goes to; null for the Inbox, unassigned.
                    format: uuid
                    nullable: true
                    type: string
                handOffWarning:
                    description: 'Why the hand-off would go to the Inbox instead: the person is disabled, no longer holds communications:conversations-view, or is not a person.'
                    enum:
                        - none
                        - disabled
                        - no_permission
                        - not_a_person
                    type: string
                id:
                    format: uuid
                    type: string
                instructions:
                    description: Up to 8,000 characters.
                    type: string
                maxRepliesPerDay:
                    description: Replies per conversation per day, 1 to 50.
                    format: int32
                    type: integer
                name:
                    type: string
                replyMode:
                    description: How the role's replies are decided (V19). Stored in this delivery and acted on from the next.
                    enum:
                        - review
                        - auto_above
                        - auto
                    type: string
                template:
                    enum:
                        - front_desk
                    type: string
                threshold:
                    description: '50 to 100: the score from which auto_above sends a reply.'
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - agentId
                - template
                - name
                - instructions
                - replyMode
                - threshold
                - capsToolCalls
                - capsTurns
                - maxRepliesPerDay
                - handOffUserId
                - handOffWarning
                - channelIds
                - version
                - createdAt
                - updatedAt
            type: object
        ConversationHandOff:
            additionalProperties: false
            description: Whether an agent handed a conversation to the people, and so does not answer it again until a person replies in it or assigns it, or it is given back.
            properties:
                at:
                    format: date-time
                    nullable: true
                    type: string
                handedOff:
                    type: boolean
                reason:
                    description: Why the agent handed off, such as hand_off, discarded, expired, budget, guard or lapsed.
                    nullable: true
                    type: string
                roleId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - handedOff
                - at
                - reason
                - roleId
            type: object
        AgentRoleChannelsRequest:
            additionalProperties: false
            properties:
                channelIds:
                    items:
                        format: uuid
                        type: string
                    type: array
            required:
                - channelIds
            type: object
        AgentRoleCreateRequest:
            additionalProperties: false
            properties:
                instructions:
                    description: Up to 8,000 characters; empty takes the template's default.
                    type: string
                name:
                    description: 1 to 80 characters.
                    maxLength: 80
                    minLength: 1
                    type: string
                template:
                    enum:
                        - front_desk
                    type: string
            required:
                - template
                - name
                - instructions
            type: object
        AgentRoleUpdateRequest:
            additionalProperties: false
            properties:
                capsToolCalls:
                    description: 1 to 60.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                capsTurns:
                    description: 1 to 16.
                    format: int32
                    maximum: 16
                    minimum: 1
                    type: integer
                complaintTagIds:
                    description: The Communications tags that mark a complaint (S5), at most 20. Absent keeps the role's.
                    items:
                        format: uuid
                        type: string
                    maxItems: 20
                    type: array
                handOffUserId:
                    description: A person who is active and holds communications:conversations-view; null for the Inbox, unassigned.
                    format: uuid
                    nullable: true
                    type: string
                instructions:
                    description: Up to 8,000 characters.
                    maxLength: 8000
                    type: string
                maxRepliesPerDay:
                    description: 1 to 50.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                name:
                    description: 1 to 80 characters.
                    maxLength: 80
                    minLength: 1
                    type: string
                replyMode:
                    enum:
                        - review
                        - auto_above
                        - auto
                    type: string
                threshold:
                    description: 50 to 100.
                    format: int32
                    maximum: 100
                    minimum: 50
                    type: integer
            required:
                - name
                - instructions
                - replyMode
                - threshold
                - capsToolCalls
                - capsTurns
                - maxRepliesPerDay
                - handOffUserId
            type: object
        AgentSetup:
            additionalProperties: false
            description: What the agent's roles need and what is missing (V12's setup screen).
            properties:
                hasRoles:
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/AgentSetupItem'
                    type: array
                ready:
                    description: The agent has a role and every needed level and Identity role is in place.
                    type: boolean
            required:
                - ready
                - hasRoles
                - items
            type: object
        AgentSetupItem:
            additionalProperties: false
            properties:
                display:
                    type: string
                heldByRoles:
                    description: The agent's user holds the permission through its Identity roles. Without it the level changes nothing.
                    type: boolean
                level:
                    description: The level the Owner gave this agent; off until raised.
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
                locked:
                    description: No level can raise it (agentNever).
                    type: boolean
                needed:
                    enum:
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
                satisfied:
                    description: The level is at least what the roles need.
                    type: boolean
            required:
                - permissionKey
                - display
                - needed
                - level
                - satisfied
                - heldByRoles
                - locked
            type: object
        AgentTemplate:
            additionalProperties: false
            properties:
                allowlist:
                    items:
                        description: An operationId the role's agent may call, whatever its levels (V9b).
                        type: string
                    type: array
                defaultInstructions:
                    type: string
                defaultName:
                    type: string
                hardRules:
                    items:
                        $ref: '#/components/schemas/AgentTemplateRule'
                    type: array
                key:
                    enum:
                        - front_desk
                    type: string
                needs:
                    items:
                        $ref: '#/components/schemas/AgentTemplateNeed'
                    type: array
            required:
                - key
                - defaultName
                - defaultInstructions
                - allowlist
                - needs
                - hardRules
            type: object
        AgentTemplateList:
            additionalProperties: false
            properties:
                templates:
                    items:
                        $ref: '#/components/schemas/AgentTemplate'
                    type: array
            required:
                - templates
            type: object
        AgentTemplateNeed:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
            required:
                - permissionKey
                - level
            type: object
        AgentTemplateRule:
            additionalProperties: false
            properties:
                code:
                    description: S1 to S7, C1 or C2 (V18).
                    type: string
                locked:
                    description: Holds in every mode, Auto too.
                    type: boolean
            required:
                - code
                - locked
            type: object
        AgentUpdateRequest:
            additionalProperties: false
            properties:
                dailyTokenBudget:
                    description: The tokens (input and output) the agent may use in a business day, at least 1000; 0 removes the budget. Absent keeps it. At the budget no new run starts and the requests that wait are handed off with the note Daily budget reached.
                    format: int32
                    minimum: 0
                    type: integer
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: A model AI_MODELS allows; empty follows the workspace's choice for the task.
                    type: string
                name:
                    description: 1 to 60 characters.
                    maxLength: 60
                    minLength: 1
                    type: string
                style:
                    description: Up to 1,500 characters.
                    maxLength: 1500
                    type: string
            required:
                - name
                - style
                - languages
                - disclosureWording
                - model
            type: object
        AgentsProblem:
            description: 'An RFC 9457 problem with this module''s refusal code: not_found (404), invalid (400), version_conflict (409), company_name_required (409), channel_bound (409), owner_required (403), level_locked (409), ai_unavailable (503). errors carries the field errors of a 400.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        AgentsSettings:
            additionalProperties: false
            properties:
                companyName:
                    description: The company the disclosure names (V11). Empty until the Owner sets it; no agent is created before.
                    type: string
                configured:
                    description: The installation has an AI provider. Without one the app shows the Assistant's AI is not set up state and nothing runs.
                    type: boolean
                models:
                    items:
                        description: A model AI_MODELS allows.
                        type: string
                    type: array
                retentionMonths:
                    description: How long a run is kept, 1 to 60.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - companyName
                - retentionMonths
                - version
                - updatedAt
                - configured
                - models
            type: object
        AgentsSettingsRequest:
            additionalProperties: false
            properties:
                companyName:
                    description: 1 to 120 characters.
                    maxLength: 120
                    minLength: 1
                    type: string
                retentionMonths:
                    description: 1 to 60.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
            required:
                - companyName
                - retentionMonths
            type: object
info:
    title: Vantigo Agents API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/agents/agents:
        get:
            description: The agents that are not deleted, by name, each with its roles and their channels.
            operationId: listAgents
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the agents
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        post:
            description: Makes an agent user in Identity and the agent with its persona. Refused with 409 company_name_required until the Owner has set the company name in the settings, and with 400 for a model that AI_MODELS does not allow.
            operationId: createAgent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors, or a model that is not allowed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - company_name_required.
            summary: Create an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}:
        delete:
            description: 'Deletes the agent: its roles stop answering, its channels are free, its grants end and its user is disabled. The user and its history stay, so the audit''s references stay true.'
            operationId: deleteAgent
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Delete an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
        get:
            description: The agent with its persona, its model and its roles.
            operationId: getAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Get an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        put:
            description: Replaces the name, the style, the languages, the disclosure wording and the model. Guarded by If-Match.
            operationId: updateAgent
            parameters:
                - description: The version the resource was read at, bare (3) or quoted ("3"). A version that has moved on is a 409 version_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors, or a model that is not allowed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - version_conflict.
            summary: Change an agent's persona
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/avatar:
        get:
            description: The agent's picture; 404 when it has none.
            operationId: getAgentAvatar
            responses:
                "200":
                    content:
                        image/jpeg:
                            schema:
                                format: binary
                                type: string
                        image/png:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get an agent's avatar
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        put:
            description: Sets the picture, a JPEG or PNG.
            operationId: putAgentAvatar
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                avatar:
                                    format: binary
                                    type: string
                            required:
                                - avatar
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - the picture is not a JPEG or PNG
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Set an agent's avatar
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/pause:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Stops new runs; queued ones stay queued.
            operationId: pauseAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Pause an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/permissions/{key}:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
            - description: A permission key of the catalog, such as customers:view.
              in: path
              name: key
              required: true
              schema:
                type: string
        put:
            description: Sets the level (off, read or change) the agent may use the permission at; every permission is off until raised. Lowering needs agents:manage; raising is the Owner's alone (403 owner_required). A permission in the agentNever list is 409 level_locked.
            operationId: putAgentPermission
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentPermissionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentPermission'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - the level is not valid
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Forbidden - owner_required (the change leaves more to the agent and is the Owner's alone), or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found, or a permission the catalog lacks
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - level_locked.
            summary: Set an agent's level for a permission
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/resume:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Lets a paused agent run again.
            operationId: resumeAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
