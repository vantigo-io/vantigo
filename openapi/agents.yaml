                                $ref: '#/components/schemas/AgentsProblem'
                    description: Forbidden - reviewer_not_permitted (the caller may not do what the item would do), or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
