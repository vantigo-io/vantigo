components:
    schemas:
        Agent:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                dailyTokenBudget:
                    description: Null for none.
                    format: int32
                    nullable: true
                    type: integer
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                hasAvatar:
                    type: boolean
                id:
                    format: uuid
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: The model the agent works with (task agents.run), always one AI_MODELS allows; empty when the installation has no AI provider.
                    type: string
                name:
                    type: string
                roles:
                    items:
                        $ref: '#/components/schemas/AgentRole'
                    type: array
                state:
                    enum:
                        - active
                        - paused
                    type: string
                style:
                    description: How it writes, up to 1,500 characters.
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                userId:
                    description: The agent's identity user, of kind agent. Its roles are given on Identity's roles screen.
                    format: uuid
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - userId
                - name
                - style
                - languages
                - disclosureWording
                - state
                - dailyTokenBudget
                - model
                - hasAvatar
                - roles
                - version
                - createdAt
                - updatedAt
            type: object
        AgentCreateRequest:
            additionalProperties: false
            properties:
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: A model AI_MODELS allows; empty follows the workspace's choice for the task.
                    type: string
                name:
                    description: 1 to 60 characters.
                    maxLength: 60
                    minLength: 1
                    type: string
                style:
                    description: Up to 1,500 characters.
                    maxLength: 1500
                    type: string
            required:
                - name
                - style
                - languages
                - disclosureWording
                - model
            type: object
        AgentList:
            additionalProperties: false
            properties:
                agents:
                    items:
                        $ref: '#/components/schemas/Agent'
                    type: array
            required:
                - agents
            type: object
        AgentPermission:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
                version:
                    description: The agent's version after the change.
                    format: int32
                    type: integer
            required:
                - permissionKey
                - level
                - version
            type: object
        AgentPermissionRequest:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
            required:
                - level
            type: object
        AgentRole:
            additionalProperties: false
            properties:
                agentId:
                    format: uuid
                    type: string
                capsToolCalls:
                    description: Tool calls a run may make, 1 to 60.
                    format: int32
                    type: integer
                capsTurns:
                    description: Model turns a run may take, 1 to 16.
                    format: int32
                    type: integer
                channelIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                complaintTagIds:
                    description: 'The Communications tags that mark a complaint (S5): a conversation carrying one is held in Review and Auto above X %.'
                    items:
                        format: uuid
                        type: string
                    type: array
                createdAt:
                    format: date-time
                    type: string
                handOffUserId:
                    description: The person a hand-off goes to; null for the Inbox, unassigned.
                    format: uuid
                    nullable: true
                    type: string
                handOffWarning:
                    description: 'Why the hand-off would go to the Inbox instead: the person is disabled, no longer holds communications:conversations-view, or is not a person.'
                    enum:
                        - none
                        - disabled
                        - no_permission
                        - not_a_person
                    type: string
                id:
                    format: uuid
                    type: string
                instructions:
                    description: Up to 8,000 characters.
                    type: string
                maxRepliesPerDay:
                    description: Replies per conversation per day, 1 to 50.
                    format: int32
                    type: integer
                name:
                    type: string
                replyMode:
                    description: How the role's replies are decided (V19). Stored in this delivery and acted on from the next.
                    enum:
                        - review
                        - auto_above
                        - auto
                    type: string
                template:
                    enum:
                        - front_desk
                    type: string
                threshold:
                    description: '50 to 100: the score from which auto_above sends a reply.'
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - agentId
                - template
                - name
                - instructions
                - replyMode
                - threshold
                - capsToolCalls
                - capsTurns
                - maxRepliesPerDay
                - handOffUserId
                - handOffWarning
                - channelIds
                - version
                - createdAt
                - updatedAt
            type: object
        ConversationHandOff:
            additionalProperties: false
            description: Whether an agent handed a conversation to the people, and so does not answer it again until a person replies in it or assigns it, or it is given back.
            properties:
                at:
                    format: date-time
                    nullable: true
                    type: string
                handedOff:
                    type: boolean
                reason:
                    description: Why the agent handed off, such as hand_off, discarded, expired, budget, guard or lapsed.
                    nullable: true
                    type: string
                roleId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - handedOff
                - at
                - reason
                - roleId
            type: object
        AgentRoleChannelsRequest:
            additionalProperties: false
            properties:
                channelIds:
                    items:
                        format: uuid
                        type: string
                    type: array
            required:
                - channelIds
            type: object
        AgentRoleCreateRequest:
            additionalProperties: false
            properties:
                instructions:
                    description: Up to 8,000 characters; empty takes the template's default.
                    type: string
                name:
                    description: 1 to 80 characters.
                    maxLength: 80
                    minLength: 1
                    type: string
                template:
                    enum:
                        - front_desk
                    type: string
            required:
                - template
                - name
                - instructions
            type: object
        AgentRoleUpdateRequest:
            additionalProperties: false
            properties:
                capsToolCalls:
                    description: 1 to 60.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                capsTurns:
                    description: 1 to 16.
                    format: int32
                    maximum: 16
                    minimum: 1
                    type: integer
                complaintTagIds:
                    description: The Communications tags that mark a complaint (S5), at most 20. Absent keeps the role's.
                    items:
                        format: uuid
                        type: string
                    maxItems: 20
                    type: array
                handOffUserId:
                    description: A person who is active and holds communications:conversations-view; null for the Inbox, unassigned.
                    format: uuid
                    nullable: true
                    type: string
                instructions:
                    description: Up to 8,000 characters.
                    maxLength: 8000
                    type: string
                maxRepliesPerDay:
                    description: 1 to 50.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                name:
                    description: 1 to 80 characters.
                    maxLength: 80
                    minLength: 1
                    type: string
                replyMode:
                    enum:
                        - review
                        - auto_above
                        - auto
                    type: string
                threshold:
                    description: 50 to 100.
                    format: int32
                    maximum: 100
                    minimum: 50
                    type: integer
            required:
                - name
                - instructions
                - replyMode
                - threshold
                - capsToolCalls
                - capsTurns
                - maxRepliesPerDay
                - handOffUserId
            type: object
        AgentSetup:
            additionalProperties: false
            description: What the agent's roles need and what is missing (V12's setup screen).
            properties:
                hasRoles:
                    type: boolean
                items:
                    items:
                        $ref: '#/components/schemas/AgentSetupItem'
                    type: array
                ready:
                    description: The agent has a role and every needed level and Identity role is in place.
                    type: boolean
            required:
                - ready
                - hasRoles
                - items
            type: object
        AgentSetupItem:
            additionalProperties: false
            properties:
                display:
                    type: string
                heldByRoles:
                    description: The agent's user holds the permission through its Identity roles. Without it the level changes nothing.
                    type: boolean
                level:
                    description: The level the Owner gave this agent; off until raised.
                    enum:
                        - 'off'
                        - read
                        - change
                    type: string
                locked:
                    description: No level can raise it (agentNever).
                    type: boolean
                needed:
                    enum:
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
                satisfied:
                    description: The level is at least what the roles need.
                    type: boolean
            required:
                - permissionKey
                - display
                - needed
                - level
                - satisfied
                - heldByRoles
                - locked
            type: object
        AgentTemplate:
            additionalProperties: false
            properties:
                allowlist:
                    items:
                        description: An operationId the role's agent may call, whatever its levels (V9b).
                        type: string
                    type: array
                defaultInstructions:
                    type: string
                defaultName:
                    type: string
                hardRules:
                    items:
                        $ref: '#/components/schemas/AgentTemplateRule'
                    type: array
                key:
                    enum:
                        - front_desk
                    type: string
                needs:
                    items:
                        $ref: '#/components/schemas/AgentTemplateNeed'
                    type: array
            required:
                - key
                - defaultName
                - defaultInstructions
                - allowlist
                - needs
                - hardRules
            type: object
        AgentTemplateList:
            additionalProperties: false
            properties:
                templates:
                    items:
                        $ref: '#/components/schemas/AgentTemplate'
                    type: array
            required:
                - templates
            type: object
        AgentTemplateNeed:
            additionalProperties: false
            properties:
                level:
                    enum:
                        - read
                        - change
                    type: string
                permissionKey:
                    type: string
            required:
                - permissionKey
                - level
            type: object
        AgentTemplateRule:
            additionalProperties: false
            properties:
                code:
                    description: S1 to S7, C1 or C2 (V18).
                    type: string
                locked:
                    description: Holds in every mode, Auto too.
                    type: boolean
            required:
                - code
                - locked
            type: object
        AgentUpdateRequest:
            additionalProperties: false
            properties:
                dailyTokenBudget:
                    description: The tokens (input and output) the agent may use in a business day, at least 1000; 0 removes the budget. Absent keeps it. At the budget no new run starts and the requests that wait are handed off with the note Daily budget reached.
                    format: int32
                    minimum: 0
                    type: integer
                disclosureWording:
                    enum:
                        - assistant
                        - talking
                        - compact
                    type: string
                languages:
                    enum:
                        - customer
                        - nb
                        - en
                    type: string
                model:
                    description: A model AI_MODELS allows; empty follows the workspace's choice for the task.
                    type: string
                name:
                    description: 1 to 60 characters.
                    maxLength: 60
                    minLength: 1
                    type: string
                style:
                    description: Up to 1,500 characters.
                    maxLength: 1500
                    type: string
            required:
                - name
                - style
                - languages
                - disclosureWording
                - model
            type: object
        AgentsProblem:
            description: 'An RFC 9457 problem with this module''s refusal code: not_found (404), invalid (400), version_conflict (409), company_name_required (409), channel_bound (409), owner_required (403), level_locked (409), ai_unavailable (503), suggestion_decided (409), suggestion_stale (409), and for the review queue reviewer_not_permitted (403), item_decided (409), reply_key_reused (409), held (422, rules names them), channel_refused (422) and send_unknown (502). errors carries the field errors of a 400.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                rules:
                    description: The rules that hold a reviewed item (held), such as S1 or C1.
                    items:
                        type: string
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        AgentsSettings:
            additionalProperties: false
            properties:
                companyName:
                    description: The company the disclosure names (V11). Empty until the Owner sets it; no agent is created before.
                    type: string
                configured:
                    description: The installation has an AI provider. Without one the app shows the Assistant's AI is not set up state and nothing runs.
                    type: boolean
                models:
                    items:
                        description: A model AI_MODELS allows.
                        type: string
                    type: array
                retentionCapMonths:
                    description: The longest retention Communications' own message retention allows (V26); a longer retentionMonths is lowered to it, when saved and every night.
                    format: int32
                    type: integer
                retentionMonths:
                    description: How long a run is kept, 1 to 60, and never longer than Communications keeps its messages.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - companyName
                - retentionMonths
                - retentionCapMonths
                - version
                - updatedAt
                - configured
                - models
            type: object
        AgentsSettingsRequest:
            additionalProperties: false
            properties:
                companyName:
                    description: 1 to 120 characters.
                    maxLength: 120
                    minLength: 1
                    type: string
                retentionMonths:
                    description: 1 to 60.
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
            required:
                - companyName
                - retentionMonths
            type: object
        AgentAuditEvent:
            additionalProperties: false
            description: One change of the Owner's settings (V25), with before and after.
            properties:
                action:
                    description: 'What changed, such as agent.changed, role.changed, permission.changed, role.channels.changed or settings.changed.'
                    type: string
                actorUserId:
                    format: uuid
                    type: string
                after:
                    additionalProperties: true
                    description: Null for what was deleted.
                    nullable: true
                    type: object
                at:
                    format: date-time
                    type: string
                before:
                    additionalProperties: true
                    description: Null for what was created.
                    nullable: true
                    type: object
                id:
                    format: int64
                    type: integer
                target:
                    description: The agent, role or agent and permission key the change was about.
                    nullable: true
                    type: string
            required:
                - id
                - at
                - actorUserId
                - action
                - target
                - before
                - after
            type: object
        AgentAuditList:
            additionalProperties: false
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/AgentAuditEvent'
                    type: array
                limit:
                    format: int32
                    type: integer
                offset:
                    format: int32
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - events
                - total
                - limit
                - offset
            type: object
        AgentRun:
            additionalProperties: false
            description: One run of an agent on a conversation (V14).
            properties:
                agentId:
                    format: uuid
                    type: string
                attempt:
                    format: int32
                    type: integer
                conversationId:
                    format: uuid
                    type: string
                endedAt:
                    format: date-time
                    nullable: true
                    type: string
                errorCode:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                inputTokens:
                    format: int64
                    type: integer
                modelTurns:
                    format: int32
                    type: integer
                outcome:
                    description: 'What the run ended in: sent, review, handed_off or no_reply.'
                    nullable: true
                    type: string
                outputTokens:
                    format: int64
                    type: integer
                reason:
                    type: string
                roleId:
                    format: uuid
                    type: string
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - queued
                        - running
                        - done
                        - waiting_review
                        - handed_off
                        - failed
                        - stopped
                    type: string
                summary:
                    description: 'The note a hand-off carries: what the agent found, or why it could not go on.'
                    nullable: true
                    type: string
                toolCalls:
                    format: int32
                    type: integer
            required:
                - id
                - agentId
                - roleId
                - conversationId
                - reason
                - attempt
                - state
                - outcome
                - errorCode
                - summary
                - toolCalls
                - modelTurns
                - inputTokens
                - outputTokens
                - startedAt
                - endedAt
            type: object
        AgentRunAction:
            additionalProperties: false
            description: One tool call of a run (V25). It never holds a body.
            properties:
                approvedByUserId:
                    description: The reviewer whose approval the call was made on.
                    format: uuid
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                durationMs:
                    format: int32
                    type: integer
                httpStatus:
                    format: int32
                    nullable: true
                    type: integer
                id:
                    format: int64
                    type: integer
                mode:
                    type: string
                operationId:
                    type: string
                ref:
                    description: The operation and the ids it named.
                    type: string
                scoped:
                    description: The operation returns a customer's data.
                    type: boolean
                status:
                    type: string
            required:
                - id
                - operationId
                - ref
                - scoped
                - mode
                - status
                - httpStatus
                - durationMs
                - approvedByUserId
                - createdAt
            type: object
        AgentRunDetail:
            additionalProperties: false
            properties:
                actions:
                    items:
                        $ref: '#/components/schemas/AgentRunAction'
                    type: array
                items:
                    description: The review items the run left (V20), with the verdict each carries.
                    items:
                        $ref: '#/components/schemas/ReviewItem'
                    type: array
                run:
                    $ref: '#/components/schemas/AgentRun'
                transcript:
                    items:
                        $ref: '#/components/schemas/AgentRunMessage'
                    type: array
                verdict:
                    additionalProperties: true
                    description: 'What the pipeline decided for the run''s reply: the mode and threshold, the score before and after the sources were checked, the valid sources, the rules that held or stopped it, and whether it was sent. Absent for a run that proposed no reply.'
                    type: object
            required:
                - run
                - actions
                - items
                - transcript
            type: object
        AgentRunList:
            additionalProperties: false
            properties:
                limit:
                    format: int32
                    type: integer
                offset:
                    format: int32
                    type: integer
                runs:
                    items:
                        $ref: '#/components/schemas/AgentRun'
                    type: array
                total:
                    format: int64
                    type: integer
            required:
                - runs
                - total
                - limit
                - offset
            type: object
        AgentRunMessage:
            additionalProperties: false
            description: One message of a run's transcript (V14). It copies message bodies, so it is deleted with the run.
            properties:
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                role:
                    type: string
                text:
                    type: string
                toolCallId:
                    nullable: true
                    type: string
                toolCalls:
                    description: The tool calls an assistant message asked for.
                    nullable: true
                    type: array
                    items:
                        additionalProperties: true
                        type: object
            required:
                - id
                - role
                - text
                - toolCallId
                - toolCalls
                - createdAt
            type: object
        AgentUsage:
            additionalProperties: false
            properties:
                agentId:
                    format: uuid
                    type: string
                dailyTokenBudget:
                    description: Null for none.
                    format: int32
                    nullable: true
                    type: integer
                days:
                    description: One entry for each of the last days, the oldest first, zeros for a day with nothing.
                    items:
                        $ref: '#/components/schemas/AgentUsageDay'
                    type: array
            required:
                - agentId
                - dailyTokenBudget
                - days
            type: object
        AgentUsageDay:
            additionalProperties: false
            properties:
                day:
                    format: date
                    type: string
                discarded:
                    format: int32
                    type: integer
                held:
                    format: int32
                    type: integer
                inputTokens:
                    format: int64
                    type: integer
                outputTokens:
                    format: int64
                    type: integer
                runs:
                    format: int32
                    type: integer
                sent:
                    format: int32
                    type: integer
            required:
                - day
                - runs
                - inputTokens
                - outputTokens
                - sent
                - held
                - discarded
            type: object
        CalibrationPoint:
            additionalProperties: false
            description: What a threshold of x would have done over the role's labelled items.
            properties:
                autoCount:
                    description: The items that would have run by itself, score at least x and no rule holding them.
                    format: int32
                    type: integer
                autoShare:
                    description: autoCount of the labelled items, 0 to 1.
                    format: double
                    type: number
                badCount:
                    description: Of those, the ones a person edited beyond 20 % or discarded.
                    format: int32
                    type: integer
                badShare:
                    description: badCount of autoCount, 0 to 1; 0 when none would have run by itself.
                    format: double
                    type: number
                x:
                    format: int32
                    type: integer
            required:
                - x
                - autoCount
                - autoShare
                - badCount
                - badShare
            type: object
        AgentMemoryCounts:
            additionalProperties: false
            properties:
                conversationNotes:
                    description: Notes about conversations with no customer.
                    format: int32
                    type: integer
                customerNotes:
                    description: Notes about customers.
                    format: int32
                    type: integer
                customers:
                    description: How many customers the notes are about.
                    format: int32
                    type: integer
            required:
                - customerNotes
                - conversationNotes
                - customers
            type: object
        InstructionSuggestion:
            additionalProperties: false
            properties:
                createdAt:
                    format: date-time
                    type: string
                decidedAt:
                    format: date-time
                    nullable: true
                    type: string
                decidedBy:
                    description: The person who applied or dismissed it.
                    format: uuid
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                itemIds:
                    description: The review items the suggestion rests on, ids only.
                    items:
                        format: uuid
                        type: string
                    type: array
                newText:
                    description: The wording to put in.
                    type: string
                oldText:
                    description: The passage of the instructions to replace; null to append newText as a paragraph.
                    nullable: true
                    type: string
                rationale:
                    description: Why, in a sentence or two. It quotes no customer.
                    type: string
                roleId:
                    format: uuid
                    type: string
                state:
                    enum:
                        - proposed
                        - applied
                        - dismissed
                    type: string
            required:
                - id
                - roleId
                - newText
                - rationale
                - itemIds
                - state
                - createdAt
            type: object
        InstructionSuggestionList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/InstructionSuggestion'
                    type: array
            required:
                - items
            type: object
        ReviewChange:
            additionalProperties: false
            description: A change the agent asks to make, with the preview the Assistant shows (V20).
            properties:
                body:
                    additionalProperties: true
                    type: object
                explain:
                    description: One sentence from the agent saying what the change will do.
                    type: string
                operationId:
                    type: string
                pathParams:
                    additionalProperties: true
                    type: object
                query:
                    additionalProperties: true
                    type: object
                summary:
                    type: string
            required:
                - operationId
                - summary
                - explain
            type: object
        ReviewCount:
            additionalProperties: false
            properties:
                waiting:
                    description: The items waiting for a decision, for the badge on the agents tile.
                    format: int64
                    type: integer
            required:
                - waiting
            type: object
        ReviewDiscardRequest:
            additionalProperties: false
            properties:
                reason:
                    enum:
                        - wrong_facts
                        - wrong_tone
                        - should_not_answer
                        - other
                    type: string
                text:
                    description: An optional explanation, up to 2,000 characters.
                    maxLength: 2000
                    type: string
            required:
                - reason
            type: object
        ReviewItem:
            additionalProperties: false
            description: 'What a run leaves for a person (V20): a reply or a change.'
            properties:
                agentId:
                    format: uuid
                    type: string
                agentName:
                    type: string
                change:
                    $ref: '#/components/schemas/ReviewChange'
                conversationId:
                    format: uuid
                    type: string
                createdAt:
                    format: date-time
                    type: string
                decidedAt:
                    format: date-time
                    nullable: true
                    type: string
                decidedByUserId:
                    description: The reviewer, kept as an opaque id.
                    format: uuid
                    nullable: true
                    type: string
                discardReason:
                    enum:
                        - wrong_facts
                        - wrong_tone
                        - should_not_answer
                        - other
                    nullable: true
                    type: string
                discardText:
                    nullable: true
                    type: string
                editRatio:
                    description: How much of the text a reviewer changed, 0 to 1, character by character.
                    format: double
                    nullable: true
                    type: number
                expiresAt:
                    description: When the item lapses, a day after it was made, or for a Messenger reply 15 minutes before the window closes.
                    format: date-time
                    type: string
                heldBy:
                    description: 'The rules that hold the item: S1 to S5, C1, C2, CHANGE and SEND. The interface words them.'
                    items:
                        type: string
                    type: array
                id:
                    format: uuid
                    type: string
                kind:
                    enum:
                        - reply
                        - change
                    type: string
                modelScore:
                    description: The model's own score before the sources were checked.
                    format: int32
                    type: integer
                outcome:
                    nullable: true
                    type: string
                reply:
                    $ref: '#/components/schemas/ReviewReply'
                roleId:
                    format: uuid
                    type: string
                roleName:
                    nullable: true
                    type: string
                runId:
                    format: uuid
                    type: string
                score:
                    description: 'The score after the sources were checked: 0 with no valid source.'
                    format: int32
                    type: integer
                sources:
                    description: The sources the run read that support the item.
                    items:
                        type: string
                    type: array
                state:
                    enum:
                        - waiting
                        - sent
                        - edited_sent
                        - discarded
                        - withdrawn
                        - expired
                    type: string
                version:
                    format: int32
                    type: integer
                windowClosesAt:
                    description: The close of a Messenger reply window, for the countdown.
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - runId
                - agentId
                - agentName
                - roleId
                - roleName
                - conversationId
                - kind
                - state
                - score
                - modelScore
                - sources
                - heldBy
                - expiresAt
                - windowClosesAt
                - createdAt
                - decidedAt
                - decidedByUserId
                - discardReason
                - discardText
                - editRatio
                - outcome
                - version
            type: object
        ReviewItemList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ReviewItem'
                    type: array
                limit:
                    format: int32
                    type: integer
                offset:
                    format: int32
                    type: integer
                total:
                    format: int64
                    type: integer
            required:
                - items
                - total
                - limit
                - offset
            type: object
        ReviewReply:
            additionalProperties: false
            description: A reply waiting to be sent. The disclosure goes above the text, locked, and is added whatever the reviewer edits.
            properties:
                components:
                    additionalProperties: true
                    description: Answer options or cards, when the channel takes them.
                    type: object
                disclosure:
                    description: The opening line that names the agent and says it is an AI (V11).
                    type: string
                inReplyToMessageId:
                    description: The message the reply answers.
                    format: uuid
                    type: string
                text:
                    description: What the agent wrote, without the disclosure.
                    type: string
            required:
                - text
                - disclosure
            type: object
        ReviewSendRequest:
            additionalProperties: false
            properties:
                components:
                    additionalProperties: true
                    description: Answer options or cards, replacing the agent's. Absent keeps them.
                    type: object
                text:
                    description: The reviewer's text, without the disclosure, which is added.
                    maxLength: 20000
                    minLength: 1
                    type: string
            required:
                - text
            type: object
        RoleCalibration:
            additionalProperties: false
            description: How the role's score has agreed with its reviewers over its last labelled replies (V21).
            properties:
                heldCount:
                    description: The labelled replies a rule held, whatever their score.
                    format: int32
                    type: integer
                labelled:
                    description: How many labelled replies the figures rest on, at most 200.
                    format: int32
                    type: integer
                minimum:
                    description: The labelled replies needed before the figures are shown.
                    format: int32
                    type: integer
                notEnoughHistory:
                    type: boolean
                points:
                    description: One point for each threshold from 50 to 100; empty when there is not enough history.
                    items:
                        $ref: '#/components/schemas/CalibrationPoint'
                    type: array
                roleId:
                    format: uuid
                    type: string
                threshold:
                    description: The threshold the role has now.
                    format: int32
                    type: integer
            required:
                - roleId
                - labelled
                - minimum
                - notEnoughHistory
                - threshold
                - heldCount
                - points
            type: object
info:
    title: Vantigo Agents API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/agents/agents:
        get:
            description: The agents that are not deleted, by name, each with its roles and their channels.
            operationId: listAgents
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the agents
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        post:
            description: Makes an agent user in Identity and the agent with its persona. Refused with 409 company_name_required until the Owner has set the company name in the settings, and with 400 for a model that AI_MODELS does not allow.
            operationId: createAgent
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors, or a model that is not allowed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - company_name_required.
            summary: Create an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}:
        delete:
            description: 'Deletes the agent: its roles stop answering, its channels are free, its grants end and its user is disabled. The user and its history stay, so the audit''s references stay true.'
            operationId: deleteAgent
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Delete an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
        get:
            description: The agent with its persona, its model and its roles.
            operationId: getAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Get an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        put:
            description: Replaces the name, the style, the languages, the disclosure wording and the model. Guarded by If-Match.
            operationId: updateAgent
            parameters:
                - description: The version the resource was read at, bare (3) or quoted ("3"). A version that has moved on is a 409 version_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors, or a model that is not allowed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - version_conflict.
            summary: Change an agent's persona
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/avatar:
        get:
            description: The agent's picture; 404 when it has none.
            operationId: getAgentAvatar
            responses:
                "200":
                    content:
                        image/jpeg:
                            schema:
                                format: binary
                                type: string
                        image/png:
                            schema:
                                format: binary
                                type: string
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get an agent's avatar
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        put:
            description: Sets the picture, a JPEG or PNG.
            operationId: putAgentAvatar
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                avatar:
                                    format: binary
                                    type: string
                            required:
                                - avatar
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - the picture is not a JPEG or PNG
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Set an agent's avatar
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/pause:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Stops new runs; queued ones stay queued.
            operationId: pauseAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Pause an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/permissions/{key}:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
            - description: A permission key of the catalog, such as customers:view.
              in: path
              name: key
              required: true
              schema:
                type: string
        put:
            description: Sets the level (off, read or change) the agent may use the permission at; every permission is off until raised. Lowering needs agents:manage; raising is the Owner's alone (403 owner_required). A permission in the agentNever list is 409 level_locked.
            operationId: putAgentPermission
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentPermissionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentPermission'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - the level is not valid
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Forbidden - owner_required (the change leaves more to the agent and is the Owner's alone), or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found, or a permission the catalog lacks
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - level_locked.
            summary: Set an agent's level for a permission
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/runs:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        get:
            description: The agent's runs, newest first. Needs agents:activity, Communications' conversations-view and the read permissions of the role templates, because a run's summary quotes what the agent wrote.
            operationId: listAgentRuns
            parameters:
                - description: Only runs in this state.
                  in: query
                  name: state
                  schema:
                    type: string
                    enum:
                        - queued
                        - running
                        - done
                        - waiting_review
                        - handed_off
                        - failed
                        - stopped
                - description: At most this many, 1 to 200; 50 by default.
                  in: query
                  name: limit
                  schema:
                    type: integer
                    format: int32
                    maximum: 200
                    minimum: 1
                - description: Skip this many.
                  in: query
                  name: offset
                  schema:
                    type: integer
                    format: int32
                    minimum: 0
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentRunList'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - a filter is not valid
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Forbidden - reviewer_not_permitted, or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: List an agent's runs
            tags:
                - Agents
            x-vantigo-access: permission:agents:activity
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/usage:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        get:
            description: Runs, tokens and the day's sent, held and discarded counts for the last days (30 by default, at most 90), on the business day, oldest first, with zeros for a day with nothing. It holds counts only.
            operationId: getAgentUsage
            parameters:
                - description: How many days, 1 to 90; 30 by default.
                  in: query
                  name: days
                  schema:
                    type: integer
                    format: int32
                    maximum: 90
                    minimum: 1
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentUsage'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Get an agent's usage
            tags:
                - Agents
            x-vantigo-access: permission:agents:view
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/resume:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Lets a paused agent run again.
            operationId: resumeAgent
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Agent'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Resume an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/roles:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
        post:
            description: Adds a role from a template, in Review, with no channel bound.
            operationId: createAgentRole
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentRoleCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentRole'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Add a role to an agent
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/roles/{roleId}:
        delete:
            description: Removes the role and frees its channels.
            operationId: deleteAgentRole
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
            summary: Remove a role
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
            - in: path
              name: roleId
              required: true
              schema:
                format: uuid
                type: string
        put:
            description: Replaces the role's name, instructions, reply mode, threshold, caps and hand-off person. Guarded by If-Match. Raising the reply mode to auto_above or auto is the Owner's alone (403 owner_required).
            operationId: updateAgentRole
            parameters:
                - description: The version the resource was read at, bare (3) or quoted ("3"). A version that has moved on is a 409 version_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AgentRoleUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AgentRole'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Bad Request - field errors
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Forbidden - owner_required (the change leaves more to the agent and is the Owner's alone), or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Not Found - not_found.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AgentsProblem'
                    description: Conflict - version_conflict.
            summary: Change a role
            tags:
                - Agents
            x-vantigo-access: permission:agents:manage
            x-vantigo-assistant: never
    /api/v1/agents/agents/{agentId}/roles/{roleId}/channels:
        parameters:
            - in: path
              name: agentId
              required: true
              schema:
                format: uuid
                type: string
            - in: path
              name: roleId
              required: true
              schema:
                format: uuid
                type: string
        put:
