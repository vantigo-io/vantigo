components:
    schemas:
        GoogleAccount:
            description: 'One user the module made or found in the organisation for a person in Staff (Google Workspace design G17), as the module last recorded it — read from its own rows, nothing asked of Google. The password is never answered.'
            properties:
                adoptionConfirmedAt:
                    description: When a holder of google:manage confirmed the adoption of a user the module found rather than made. Absent on a user the module created, and on one not yet confirmed.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdByUs:
                    description: Whether the module created the user. A user it found holding the employee number is written to only once its adoption is confirmed.
                    type: boolean
                employeeNumber:
                    type: string
                lastError:
                    description: The last refusal's code — privileged, ambiguous, address_taken, enabled. Absent when the last write succeeded.
                    type: string
                lastSyncedAt:
                    format: date-time
                    type: string
                licences:
                    description: The licences the module assigned the user, each productId/skuId — the only ones it removes.
                    items:
                        type: string
                    type: array
                passWaiting:
                    description: Whether a password the module set waits to be revealed once, in Staff, before its lifetime ends.
                    type: boolean
                primaryEmail:
                    description: The user's address, as the module made or found it; never renamed.
                    type: string
                reported:
                    description: What the module could not act on, as codes — adoption_unconfirmed, privileged, manager_not_found, licence_unavailable:<skuId>, photo_not_written, sign_out_refused, leaver_step_failed:<step>.
                    items:
                        type: string
                    type: array
                state:
                    description: disabled (suspended), enabled, or deleted.
                    enum:
                        - disabled
                        - enabled
                        - deleted
                    type: string
                userId:
                    description: The user's Directory id.
                    type: string
            required:
                - userId
                - employeeNumber
                - primaryEmail
                - state
                - createdByUs
                - licences
                - reported
                - passWaiting
                - createdAt
            type: object
        GoogleConnection:
            description: 'The installation''s one connection to a Google Workspace organisation (Google Workspace design G12–G16): the service account Vantigo signs in as through domain-wide delegation, the admin it impersonates, the Internal web client, and what the last connection test found. Sent whether or not anything is set, so the Connection tab can show every step before the first is done. No key and no client secret is ever answered.'
            properties:
                addressDomain:
                    description: The domain new users' addresses are made at, one of the verified domains. Absent until set; the primary domain is used then.
                    type: string
                addressPattern:
                    description: How an address is made for a person whose work email cannot be theirs — given.family, g.family or given.
                    enum:
                        - given.family
                        - g.family
                        - given
                    type: string
                adminSubject:
                    description: The super admin (or delegated admin) whose address the Admin SDK calls impersonate. Absent until set.
                    type: string
                credentialKind:
                    description: How Vantigo obtains its tokens. service_account_key, the service account's JSON key the Owner uploads, is the only kind implemented; vantigo_hosted is reserved for a later delivery.
                    enum:
                        - service_account_key
                        - vantigo_hosted
                    type: string
                credentials:
                    description: Every key and client secret ever added, revoked ones included, newest first. The key and the secret themselves are sealed and never answered.
                    items:
                        $ref: '#/components/schemas/GoogleCredential'
                    type: array
                customerId:
                    description: The organisation's customer id (C0…), as the last successful test read it.
                    type: string
                delegationClientId:
                    description: The numeric client id of the service account whose key is in use — what the admin pastes into the Admin console's domain-wide delegation, beside the scopes. Absent until a key is uploaded.
                    type: string
                domains:
                    description: The organisation's verified domains, lower-case and sorted, as the last successful test read them.
                    items:
                        type: string
                    type: array
                lastCheckedAt:
                    description: When the connection was last tested. Absent until it has been, and again after the admin to impersonate changes.
                    format: date-time
                    type: string
                leaverRemoveGroups:
                    description: Which groups a leaver is taken out of — all, managed (the groups the module made) or none.
                    enum:
                        - all
                        - managed
                        - none
                    type: string
                leaverRemoveLicences:
                    description: Whether a leaver's licences are removed when the account is suspended. Google bills a suspended user's licence.
                    type: boolean
                leaverSignOut:
                    description: Whether a leaver is signed out of every session when the account is suspended.
                    type: boolean
                oauthClientId:
                    description: The Internal web client's id, ending .apps.googleusercontent.com — for the person's own Google connection and the sign-in with Google. Absent until set.
                    type: string
                oauthClientSecretAddedAt:
                    description: When the web client's secret in use was added. The secret itself is never answered; absent while none is.
                    format: date-time
                    type: string
                organisationName:
                    description: The organisation's name, as the last successful test read it.
                    type: string
                orgUnitPath:
                    description: The organisational unit new users are made in, / for the top.
                    type: string
                personalConnection:
                    $ref: '#/components/schemas/GooglePersonalSwitch'
                mailChannels:
                    $ref: '#/components/schemas/GoogleMailChannels'
                passDelivery:
                    description: Who is meant to hand the person their first password — hr, manager or both. HR shows it once on the person's Account tab in Staff; the setting is kept for a later release.
                    enum:
                        - hr
                        - manager
                        - both
                    type: string
                passLifetimeDays:
                    description: How many days, 1 to 30, the first password waits to be revealed before it is forgotten.
                    format: int32
                    type: integer
                primaryDomain:
                    description: The organisation's primary domain, as the last successful test read it.
                    type: string
                redirectUris:
                    description: The two redirect URIs to register on the Internal web client, built from APP_URL — the person's Google connection's callback and the sign-in's.
                    items:
                        type: string
                    type: array
                scopesGranted:
                    description: The scopes the last test was granted, in full.
                    items:
                        type: string
                    type: array
                scopesMissing:
                    description: The scopes Vantigo needs that the last test was refused — the features needing them are unavailable.
                    items:
                        type: string
                    type: array
                scopesToDelegate:
                    description: The scopes to paste into the Admin console's domain-wide delegation, in full, in the order Vantigo needs them. A function of the features turned on.
                    items:
                        type: string
                    type: array
                skus:
                    description: The licences the organisation holds, as the last read of them (GET /connection/skus) found them — the choices of a Staff group's licences.
                    items:
                        $ref: '#/components/schemas/GoogleSku'
                    type: array
                scopesUnexpected:
                    description: Scopes Vantigo never uses that the last test was granted anyway — a warning, never a status. Domain-wide delegation reaches every account of the organisation, so a scope nobody needs is better removed in the Admin console.
                    items:
                        type: string
                    type: array
                status:
                    description: unconfigured while no key is uploaded or no admin is named, or until the first test; pending_delegation when every scope Vantigo needs was refused; connected when the organisation answered; failing otherwise, with its reason.
                    enum:
                        - unconfigured
                        - pending_delegation
                        - connected
                        - failing
                    type: string
                statusReason:
                    description: 'Why the status is what it is: not_delegated (pending_delegation), credential_invalid (Google refused every key, or does not know the admin to impersonate), admin_refused (the admin may not read the organisation), google_unreachable (Google did not answer). Absent otherwise.'
                    type: string
                version:
                    description: The connection's version, the If-Match of PUT /connection.
                    format: int32
                    type: integer
            required:
                - status
                - credentialKind
                - domains
                - credentials
                - scopesToDelegate
                - scopesGranted
                - scopesMissing
                - scopesUnexpected
                - redirectUris
                - version
                - addressPattern
                - orgUnitPath
                - passLifetimeDays
                - passDelivery
                - leaverRemoveLicences
                - leaverRemoveGroups
                - leaverSignOut
                - skus
                - personalConnection
                - mailChannels
            type: object
        GoogleConnectionRequest:
            description: The connection's settings. Every field is optional and one left out keeps its value.
            properties:
                adminSubject:
                    description: The address of the admin to impersonate. A change sends the status back to unconfigured until the next test.
                    type: string
                credentialKind:
                    description: service_account_key; vantigo_hosted is refused 422 credential_kind_unsupported.
                    type: string
            type: object
        GoogleConnectionTest:
            description: What a connection test found (Google Workspace design G15).
            properties:
                customer:
                    $ref: '#/components/schemas/GoogleCustomer'
                domains:
                    description: The organisation's verified domains, lower-case and sorted.
                    items:
                        type: string
                    type: array
                granted:
                    description: The scopes Vantigo needs that were granted.
                    items:
                        type: string
                    type: array
                missing:
                    description: The scopes Vantigo needs that were refused.
                    items:
                        type: string
                    type: array
                reason:
                    description: The status's reason, as GoogleConnection's statusReason.
                    type: string
                status:
                    enum:
                        - unconfigured
                        - pending_delegation
                        - connected
                        - failing
                    type: string
                unexpected:
                    description: The scopes Vantigo never uses that were granted anyway.
                    items:
                        type: string
                    type: array
            required:
                - status
                - granted
                - missing
                - unexpected
                - domains
            type: object
        GoogleCredential:
            description: 'One credential the module keeps (Google Workspace design G13): a service account''s key, by the four fields of its file kept in the clear, or the Internal web client''s secret. The key and the secret themselves are sealed and never answered.'
            properties:
                clientEmail:
                    description: The service account's address. Present on a key.
                    type: string
                clientId:
                    description: The service account's numeric client id — what domain-wide delegation is granted to. Present on a key.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                inUse:
                    description: The key the module signs with — the newest live one, unless Google refused it since it last worked — or the client secret in use.
                    type: boolean
                kind:
                    enum:
                        - service_account_key
                        - oauth_client_secret
                    type: string
                lastFailedAt:
                    description: When Google last refused this key. Absent until it has.
                    format: date-time
                    type: string
                lastUsedAt:
                    description: When a token was last minted with this key. Absent until one has.
                    format: date-time
                    type: string
                privateKeyId:
                    description: The key's id, as the Cloud console lists it. Present on a key.
                    type: string
                projectId:
                    description: The Cloud project the service account belongs to. Present on a key.
                    type: string
                revokedAt:
                    description: When it was revoked. Absent while it is live.
                    format: date-time
                    type: string
            required:
                - id
                - kind
                - createdAt
                - inUse
            type: object
        GoogleCredentialRequest:
            description: A service account's JSON key, the file's text as the Owner pasted it or the page read it from a chosen file — at most 8 KiB.
            properties:
                json:
                    type: string
            required:
                - json
            type: object
        GoogleCustomer:
            description: The organisation, as customers.get(my_customer) answers it.
            properties:
                id:
                    description: The customer id, C0….
                    type: string
                organisationName:
                    type: string
                primaryDomain:
                    type: string
            required:
                - id
            type: object
        GoogleEvent:
            description: One write the module made, to its own connection or in the organisation — the module's own append-only trail. It carries codes and Google's ids, never an address, a key, a secret or a token.
            properties:
                action:
                    description: google.connection.changed, google.connection.tested, google.oauth_client.changed, google.credential.added, google.credential.revoked, google.credential.refused, google.settings.changed; the accounts' google.user.prepared, google.user.activated, google.user.updated, google.user.deactivated, google.user.deleted, google.user.photo_set, google.user.photo_cleared, google.pass.issued, google.pass.revealed, google.account.adoption_confirmed; the groups' google.group.created, google.group.adopted, google.group.updated, google.group.members_set, google.group.deleted, google.group.adoption_confirmed.
                    type: string
                actor:
                    description: Who acted — the user's id, or the system's name.
                    type: string
                at:
                    format: date-time
                    type: string
                codes:
                    description: What the write reported, as codes.
                    items:
                        type: string
                    type: array
                id:
                    format: int64
                    type: integer
                subjectId:
                    description: The Google id the write concerned. Absent on a connection's event.
                    type: string
            required:
                - id
                - at
                - actor
                - action
                - codes
            type: object
        GoogleGroup:
            description: One group the module made or found in the organisation for a group in Staff (Google Workspace design G20), from its own rows.
            properties:
                adoptionConfirmedAt:
                    description: When a holder of google:manage confirmed the adoption of a group the module found rather than made. Absent on a group the module created, and on one not yet confirmed.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdByUs:
                    type: boolean
                email:
                    description: The group's address, which never changes once the group exists.
                    type: string
                groupId:
                    description: The group's Directory id.
                    type: string
                staffGroupId:
                    description: The Staff group's id.
                    type: string
            required:
                - groupId
                - staffGroupId
                - email
                - createdByUs
                - createdAt
            type: object
        GoogleOAuthClientRequest:
            description: The Internal web client. A changed client id needs its secret; a secret alone rotates the current client's.
            properties:
                clientId:
                    description: The web client's id, ending .apps.googleusercontent.com.
                    type: string
                clientSecret:
                    description: The web client's secret, which Google shows once, at creation. Sealed at once and never answered.
                    type: string
            required:
                - clientId
            type: object
        GoogleMailChannels:
            description: 'Mail channels (Google Workspace design G33, G34): whether Communications'' channels may use the organisation''s licensed Gmail mailboxes, through domain-wide delegation. status is off while the switch is; unavailable when on but a channel cannot work yet, reason then being not_tested (no test has run since the switch was turned on, so Vantigo does not know whether the Gmail scopes are delegated), not_delegated (the last test was refused gmail.modify or gmail.send) or the connection''s own status or reason (unconfigured, pending_delegation, credential_invalid, admin_refused, google_unreachable); ready otherwise. While on, gmail.modify and gmail.send are among scopesToDelegate, and they reach every mailbox in the domain: Vantigo uses them only for the mailboxes that are channels. mailboxes counts the mailboxes a channel was checked against.'
            properties:
                enabled:
                    type: boolean
                mailboxes:
                    format: int32
                    type: integer
                reason:
                    description: A code, never Google's words; absent when there is nothing to say.
                    type: string
                status:
                    enum:
                        - "off"
                        - ready
                        - unavailable
                    type: string
            required:
                - enabled
                - status
                - mailboxes
            type: object
        GoogleMailChannelsRequest:
            description: Mail channels, on or off.
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        GooglePersonalAuthorize:
            description: Where to send the browser to connect Google — Google's authorization endpoint, with the state, nonce and PKCE challenge the answer's cookie holds sealed.
            properties:
                authorizeUrl:
                    type: string
            required:
                - authorizeUrl
            type: object
        GooglePersonalComplete:
            description: A connect completed — the person's connection as it now stands, and the path in Vantigo to return to.
            properties:
                connection:
                    $ref: '#/components/schemas/GooglePersonalConnection'
                returnTo:
                    description: A path on this installation, never another origin; /settings/connections when the connect named none.
                    type: string
            required:
                - connection
                - returnTo
            type: object
        GooglePersonalConnectRequest:
            description: What a connect is for, and where to return once it completes.
            properties:
                feature:
                    description: The feature the connect asks Google's consent for — calendar asks for calendar.events and calendar.app.created, mail for gmail.send — beside the features the person's connection already holds.
                    enum:
                        - calendar
                        - mail
                    type: string
                returnTo:
                    description: A path on this installation to return to; anything that is not one becomes /settings/connections.
                    type: string
            required:
                - feature
            type: object
        GooglePersonalConnection:
            description: 'The caller''s own Google connection (Google Workspace design G25–G29). offered says whether the caller may connect at all — false while Connection for people is off or the web client is not ready (reason switch_off), or Vantigo knows no Google account of theirs that it manages (reason no_account). state is not_connected with no connection, active while it works, reconnect when Google refused it (errorCode says why) and closing once disconnected, which reads as not connected.'
            properties:
                account:
                    description: The primary email of the Google account Vantigo knows the caller by. Absent when there is none.
                    type: string
                connectedAt:
                    format: date-time
                    type: string
                errorCode:
                    description: 'Why Google refused the connection, a code: expired, blocked, consent_missing or sign_in_again. Present while state is reconnect.'
                    type: string
                features:
                    description: The features the scopes Google granted allow — calendar, mail.
                    items:
                        type: string
                    type: array
                offered:
                    type: boolean
                reason:
                    enum:
                        - switch_off
                        - no_account
                    type: string
                state:
                    enum:
                        - not_connected
                        - active
                        - reconnect
                        - closing
                    type: string
            required:
                - offered
                - state
                - features
            type: object
        GooglePersonalSwitch:
            description: 'Connection for people (Google Workspace design G29): whether people may connect their own Google account to Vantigo, and whether a connect can work. status is off while the switch is; unavailable when on but the web client is not ready, reason then being no_web_client (no client id or no secret), not_tested (no test has read the organisation''s domains) or client_refused (Google refused the web client on a connect or a refresh); consent_missing when the last connect came back without the feature it asked; ready otherwise. connected and reconnect count the people connected and those whose connection Google refused, waiting for them to connect again. redirectUri is the redirect URI to register on the web client.'
            properties:
                connected:
                    format: int32
                    type: integer
                enabled:
                    type: boolean
                reason:
                    description: A code, never Google's words; absent when there is nothing to say.
                    type: string
                reconnect:
                    format: int32
                    type: integer
                redirectUri:
                    description: APP_URL with the base path and /api/v1/google/connect/callback.
                    type: string
                status:
                    enum:
                        - "off"
                        - ready
                        - consent_missing
                        - unavailable
                    type: string
            required:
                - enabled
                - status
                - connected
                - reconnect
                - redirectUri
            type: object
        GooglePersonalSwitchRequest:
            description: Connection for people, on or off.
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        GoogleProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: version_mismatch (412: the connection has been written since the If-Match version), client_mismatch (422: a key for another service account while one of the current account''s is live), credential_kind_unsupported (422: a credential kind this version does not implement), adoption_confirmed (409: the account''s adoption is confirmed already, or the module created it), credential_invalid and google_unreachable (503: Google could not be asked); and those of the person''s own Google connection: feature_unknown (422), switch_off, no_account, account_taken and account_mismatch (409), expired (410). errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        GoogleSettingsRequest:
            description: The account rules (Google Workspace design G17, G19). Every field is optional and one left out keeps its value.
            properties:
                addressDomain:
                    description: One of the verified domains, or empty to use the primary domain.
                    type: string
                addressPattern:
                    enum:
                        - given.family
                        - g.family
                        - given
                    type: string
                leaverRemoveGroups:
                    enum:
                        - all
                        - managed
                        - none
                    type: string
                leaverRemoveLicences:
                    type: boolean
                leaverSignOut:
                    type: boolean
                orgUnitPath:
                    description: An organisational unit's path, starting with /, at most 400 characters.
                    type: string
                passDelivery:
                    enum:
                        - hr
                        - manager
                        - both
                    type: string
                passLifetimeDays:
                    description: 1 to 30.
                    format: int32
                    type: integer
            type: object
        GoogleSku:
            description: One licence the organisation holds, as licenseAssignments.listForProduct answers it.
            properties:
                assigned:
                    description: How many users hold it, as the read counted them.
                    format: int32
                    type: integer
                name:
                    description: The licence's name, as Google answers it; the SKU id when it answers none.
                    type: string
                productId:
                    type: string
                skuId:
                    type: string
                value:
                    description: productId/skuId, the value a Staff group's licences name.
                    type: string
            required:
                - productId
                - skuId
                - value
                - name
                - assigned
            type: object
info:
    title: Vantigo Google Workspace API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/google/accounts:
        get:
            description: Every user the module keeps in the organisation, by address, with its state — the Accounts tab's table. From the module's own rows; nothing asked of Google. The password is never answered.
            operationId: getGoogleAccounts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/GoogleAccount'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The module's accounts
            tags:
                - Google
            x-vantigo-access: permission:google:manage
    /api/v1/google/accounts/{userId}/confirm:
        post:
            description: 'Confirms the adoption of a user the module found holding a person''s employee number rather than created. Until it is confirmed the module writes nothing to that user — no profile, no password, no suspension, no delete — and reports adoption_unconfirmed; from then on it manages the user as one it created, and Staff''s next cycle brings it to the person. Audited google.account.adoption_confirmed. 404 for an account the module does not keep, 409 adoption_confirmed for one confirmed already or one the module created.'
            operationId: postGoogleAccountsByUserIdConfirm
            parameters:
                - in: path
                  name: userId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GoogleAccount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the module keeps no account by that id. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/GoogleProblem'
                    description: Conflict — adoption_confirmed, the adoption is confirmed already, or the module created the user.
            summary: Confirm an adopted account
            tags:
                - Google
            x-vantigo-access: permission:google:manage
    /api/v1/google/calendar-notifications:
        post:
            description: 'Google Calendar''s push notifications for the calendar sync (Google Workspace design G32): Google posts here, to PUBLIC_BASE_URL, for each channel the module opened on a person''s primary calendar with events.watch; on the public host''s allowlist and on the app''s host alike. Anonymous: Google sends no session, and a signed-in caller is answered alike. A notification is a nudge — it makes the person''s sync due and nothing more; nothing it says is stored. Only the headers are read, never a body: X-Goog-Channel-ID must be a UUID naming a channel the module holds, the SHA-256 of X-Goog-Channel-Token must equal the one stored (compared in constant time) and X-Goog-Resource-ID must be the channel''s; then a resource state of exists or not_exists marks the channel notified, and sync (the channel''s first message) or anything else marks nothing. 204 with no body for every request, whatever it named — an unknown channel, a forged token and a valid notification are answered alike, and so is a database that could not be written. Rate limited to 600 per client address a minute (google-calendar-notifications).'
            operationId: postGoogleCalendarNotifications
            parameters:
                - description: The channel's id, the UUID the module gave events.watch.
                  in: header
                  name: X-Goog-Channel-ID
                  schema:
                    type: string
                - description: The channel's token, as the module gave it to events.watch; only its SHA-256 is stored.
                  in: header
                  name: X-Goog-Channel-Token
                  schema:
                    type: string
                - description: Google's id of the watched resource.
                  in: header
                  name: X-Goog-Resource-ID
                  schema:
                    type: string
                - description: sync for the channel's first message; exists or not_exists for a change.
                  in: header
                  name: X-Goog-Resource-State
                  schema:
                    type: string
                - description: The message's number on the channel, ignored.
                  in: header
                  name: X-Goog-Message-Number
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content — whatever the request named, nothing more is said.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
