info:
    title: Vantigo Communications API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/communications/attachments/{id}/download:
        get:
            description: A message's attachment. A clean one (the composer's) is answered as its declared media type; an unscanned one (received with an inbound message) as an attachment to save — Content-Disposition attachment with its file name — and as its media type only when that is passive (an image other than SVG, PDF, plain text, an Office document, zip), application/octet-stream otherwise.
            operationId: getCommunicationsAttachmentsByIdDownload
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                    description: OK
                    headers:
                        Content-Disposition:
                            description: attachment; filename*=UTF-8''… for an unscanned attachment; absent for a clean one.
                            schema:
                                type: string
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Service Unavailable
            tags:
                - ConversationEndpoints
            x-vantigo-access: permission:communications:conversations-view
    /api/v1/communications/channel-providers:
        get:
