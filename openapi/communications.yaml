info:
    title: Vantigo Communications API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/communications/attachments/{id}/download:
        get:
            operationId: getCommunicationsAttachmentsByIdDownload
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    description: OK
            tags:
                - ConversationEndpoints
            x-vantigo-access: permission:communications:conversations-view
    /api/v1/communications/channels:
        get:
            operationId: getCommunicationsChannels
            responses:
                "200":
                    description: OK
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
        post:
            operationId: postCommunicationsChannels
