                    items:
                        $ref: '#/components/schemas/ChannelEndpointResponse'
                    nullable: true
                    type: array
                    x-omitempty: false
                key:
                    description: A channel's provider value, smtp, a mailbox provider (`entra`, `google`) or a messenger provider (`meta`).
                    type: string
                maxMessageBytes:
                    description: The largest message the provider sends, in bytes of MIME; null when the provider sets no limit of its own.
                    format: int64
                    nullable: true
                    type: integer
                reason:
                    description: Why the provider is not available (switch_off, or the connection's reason); null while available.
                    nullable: true
                    type: string
