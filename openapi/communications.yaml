                    items:
                        $ref: '#/components/schemas/EmailRecipientRequest'
                    nullable: true
                    type: array
                channelId:
                    format: uuid
                    nullable: true
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                htmlBody:
                    nullable: true
                    type: string
                participantIds:
                    items:
                        format: uuid
                        nullable: true
                        type: string
                    nullable: true
                    type: array
                recipients:
                    items:
                        $ref: '#/components/schemas/ChannelRecipientRequest'
                    nullable: true
                    type: array
                sendFromPersonal:
                    description: When true, sends the initial outbound message from the caller's own connected address, through the personal mailbox provider personal-sender names, with Reply-To set to the channel's address.
                    nullable: true
                    type: boolean
                subject:
                    nullable: true
                    type: string
                textBody:
                    nullable: true
                    type: string
                to:
                    items:
                        $ref: '#/components/schemas/EmailRecipientRequest'
                    nullable: true
                    type: array
            required:
                - subject
            type: object
        CreateSuppressionRequest:
            properties:
                emailAddress:
                    nullable: true
                    type: string
                reason:
                    nullable: true
                    type: string
            required:
                - emailAddress
            type: object
        CreateTagRequest:
            properties:
                color:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
            required:
                - name
            type: object
        EmailRecipientRequest:
            properties:
                email:
                    nullable: true
                    type: string
            required:
                - email
            type: object
        MessageAnswer:
            description: The answer an inbound message is to an answer option or a card's choice of an earlier message of the conversation.
            properties:
                choiceId:
                    description: The id of the option or choice; share-email for an e-mail address the person shared.
                    type: string
                messageId:
                    description: The message the question was in.
                    format: uuid
                    type: string
                title:
                    description: The title the person saw.
                    type: string
            required:
                - messageId
                - choiceId
                - title
            type: object
        InboxCountsResponse:
            description: The caller's unread open conversations.
            properties:
                assignedToMeUnread:
                    description: Open conversations assigned to the caller that the caller has not read.
                    format: int32
                    type: integer
                unread:
                    description: Open conversations, assigned to anyone or no one, that the caller has not read.
                    format: int32
                    type: integer
            required:
                - unread
                - assignedToMeUnread
            type: object
        MessageComponentCard:
            properties:
                attachmentId:
                    description: Response only - the card's image, an attachment of role card.
                    format: uuid
                    nullable: true
                    type: string
                choices:
                    description: 0 to 3 choices.
                    items:
                        $ref: '#/components/schemas/MessageComponentChoice'
                    nullable: true
                    type: array
                productImageId:
                    description: Request only - the product image the card shows, copied when the reply is made.
                    format: int32
                    nullable: true
                    type: integer
                subtitle:
                    description: At most 80 characters.
                    nullable: true
                    type: string
                title:
                    description: 1 to 80 characters.
                    type: string
            required:
                - title
            type: object
        MessageComponentChoice:
            properties:
                id:
                    description: '[a-z0-9-], 1 to 40 characters, unique within the message.'
                    type: string
                title:
                    description: 1 to 20 characters.
                    type: string
            required:
                - id
                - title
            type: object
        MessageComponentLimits:
            description: What a message on a channel may carry, as its provider says.
            properties:
                maxAnswerOptions:
                    description: The most quick replies one message holds; the request for an e-mail address counts as one.
                    format: int32
                    type: integer
                maxAnswerTitle:
                    format: int32
                    type: integer
                maxAttachmentBytes:
                    description: The largest file one message carries, in bytes; absent when the provider names none. A larger staged attachment is refused with 422 too_large.
                    format: int64
                    type: integer
                maxCardChoices:
                    format: int32
                    type: integer
                maxCardSubtitle:
                    format: int32
                    type: integer
                maxCardTitle:
                    format: int32
                    type: integer
                maxCards:
                    format: int32
                    type: integer
                maxChoiceTitle:
                    format: int32
                    type: integer
                maxText:
                    format: int32
                    type: integer
                shareEmail:
                    type: boolean
            required:
                - maxText
                - maxAnswerOptions
                - maxAnswerTitle
                - shareEmail
                - maxCards
                - maxCardChoices
                - maxCardTitle
                - maxCardSubtitle
                - maxChoiceTitle
            type: object
        MessageComponents:
            description: What a message carries beside its text. Only a channel whose provider takes components accepts them; an e-mail channel answers 422 components_unsupported.
            properties:
                answerOptions:
                    description: Quick replies, in the order given - 1 to 13, each title 1 to 20 characters.
                    items:
                        $ref: '#/components/schemas/MessageComponentChoice'
                    nullable: true
                    type: array
                cards:
                    description: A carousel, 1 to 10 cards.
                    items:
                        $ref: '#/components/schemas/MessageComponentCard'
                    nullable: true
                    type: array
                shareEmail:
                    description: Asks the person for their e-mail address, as a quick reply.
                    nullable: true
                    type: boolean
            type: object
        NoteRequest:
            properties:
                textBody:
                    nullable: true
                    type: string
            required:
                - textBody
            type: object
        PaginatedResponseOfConversationListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ConversationListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PersonalSenderResponse:
            description: 'Whether the caller can send outbound mail from their own connected address through a personal mailbox provider (`entra`, `google`; Outlook connection design M20, Google Workspace design G3), and the address and display name they would send from.'
            properties:
                address:
                    description: The caller's directory email address; null when the caller has no enabled directory account or personal sending is unavailable.
                    nullable: true
                    type: string
                available:
                    description: True when the caller's personal connection to a mailbox provider is active with the mail scope granted.
                    type: boolean
                displayName:
                    description: The caller's display name in Vantigo; null when address is null.
                    nullable: true
                    type: string
                errorCode:
                    description: Why the provider refused the caller's connection (expired, sign_in_again, mfa, blocked, consent_missing) when reason is reconnect; null otherwise.
                    nullable: true
                    type: string
                providerDisplayName:
                    description: 'The name of the personal mailbox provider the answer is from, as the composer''s "Send from my address" names it (Outlook, Gmail): the first provider that can send for the caller, else the first that knows the caller''s account; null when no provider is enabled. Always answered; optional in the schema only because the recorded exchanges predate it.'
                    nullable: true
                    type: string
                reason:
                    description: Why available is false (unavailable, no_account, not_connected, reconnect); null while available is true.
                    nullable: true
                    type: string
            required:
                - available
                - reason
                - errorCode
                - address
                - displayName
            type: object
        ReplyRequest:
            properties:
                attachmentIds:
                    items:
                        format: uuid
                        type: string
                    nullable: true
                    type: array
                components:
                    allOf:
                        - $ref: '#/components/schemas/MessageComponents'
                    description: Answer options, a request for an e-mail address or cards, on a messenger conversation only.
                    nullable: true
                htmlBody:
                    nullable: true
                    type: string
                replyMode:
                    default: reply
                    nullable: true
                    type: string
                sendFromPersonal:
                    description: When true, sends the reply from the caller's own connected address, through the personal mailbox provider personal-sender names, with Reply-To set to the channel's address.
                    nullable: true
                    type: boolean
                subject:
                    nullable: true
                    type: string
                textBody:
                    nullable: true
                    type: string
            type: object
        ReplyWindow:
            description: Whether a reply may be sent in a messenger conversation now. The window is open for 24 hours after the participant's newest message - the platform's echoes do not count -, and runs to 7 days, the reply after the first 24 hours tagged, when the provider has the Human Agent permission.
            properties:
                closesAt:
                    description: When the window closes; null when there is no inbound message to count from.
                    format: date-time
                    nullable: true
                    type: string
                state:
                    description: open, human_agent (the first 24 hours are over and the extension holds) or closed.
                    type: string
            required:
                - state
                - closesAt
            type: object
        SmtpChannelCredentialRequest:
            properties:
                host:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
                port:
                    format: int32
                    nullable: true
                    type: integer
                useSsl:
                    nullable: true
                    type: boolean
                username:
                    nullable: true
                    type: string
            required:
                - host
                - port
            type: object
        SuppressionResponse:
            properties:
                createdAt:
                    format: date-time
                    type: string
                emailAddress:
                    type: string
                id:
                    format: uuid
                    type: string
                reason:
                    nullable: true
                    type: string
            required:
                - id
                - emailAddress
                - reason
                - createdAt
            type: object
            x-vantigo-source: Vantigo.Communications
        SwitchChannelProviderRequest:
            properties:
                folder:
                    description: 'The folder in the mailbox a closed conversation''s inbound messages are moved to when onClose is move (default "Handled in Vantigo").'
                    nullable: true
                    type: string
                importWindow:
                    description: 'How far back the switched channel imports: from_now (default), last_30_days or last_90_days.'
                    nullable: true
                    type: string
                onClose:
                    description: 'What closing a conversation on the switched channel does to its inbound messages in the mailbox: none (default), read or move.'
                    nullable: true
                    type: string
                provider:
                    description: A mailbox provider (`entra`, `google`) GET /channel-providers lists. smtp is refused; a channel on another mailbox provider is refused with provider_switch_unsupported.
                    type: string
            required:
                - provider
            type: object
        TagResponse:
            properties:
                color:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
                - color
            type: object
            x-vantigo-source: Vantigo.Communications
        UpdateChannelRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                folder:
                    description: 'The folder in the mailbox a closed conversation''s inbound messages are moved to when onClose is move (default "Handled in Vantigo").'
                    nullable: true
                    type: string
                isActive:
                    nullable: true
                    type: boolean
                isDefault:
                    nullable: true
                    type: boolean
                onClose:
                    description: 'What closing a conversation on a channel on a mailbox provider (`entra`, `google`) does to its inbound messages in the mailbox: none, read or move.'
                    nullable: true
                    type: string
                provider:
                    description: The channel's own provider when omitted. smtp with a full smtp block, the password included, switches a channel on a mailbox provider (`entra`, `google`) back to SMTP; another mailbox provider is refused here (POST /channels/{id}/provider switches to it).
                    nullable: true
                    type: string
                smtp:
                    allOf:
                        - $ref: '#/components/schemas/SmtpChannelCredentialRequest'
                    nullable: true
            type: object
        UpdateConversationRequest:
            properties:
                assignedUserId:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                customerId:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                status:
                    nullable: true
                    type: string
            type: object
info:
    title: Vantigo Communications API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/communications/attachments/{id}/download:
        get:
            description: A message's attachment. A clean one (the composer's) is answered as its declared media type; an unscanned one (received with an inbound message) as an attachment to save — Content-Disposition attachment with its file name — and as its media type only when that is passive (an image other than SVG, PDF, plain text, an Office document, zip), application/octet-stream otherwise.
            operationId: getCommunicationsAttachmentsByIdDownload
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                    description: OK
                    headers:
                        Content-Disposition:
                            description: attachment; filename*=UTF-8''… for an unscanned attachment; absent for a clean one.
                            schema:
                                type: string
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Service Unavailable
            summary: Download a message attachment
            tags:
                - ConversationEndpoints
            x-vantigo-access: permission:communications:conversations-view
    /api/v1/communications/channel-providers:
        get:
            description: The providers a channel can use — SMTP always, then every enabled mailbox provider (`entra`, `google`) — with whether each is available now.
            operationId: getCommunicationsChannelProviders
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ChannelProviderResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the providers a channel can use
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
    /api/v1/communications/channels:
        get:
            operationId: getCommunicationsChannels
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ChannelResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the mail channels
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
        post:
            operationId: postCommunicationsChannels
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/CreateChannelRequest'
                            nullable: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChannelResponse'
                    description: Created
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Conflict — channel_exists (the address already has a channel), mailbox_exists (for a mailbox provider, another channel already uses the mailbox on that provider), mail_channels_off (the mailbox provider is not available), messenger_off (the messenger provider is not available), default_channel_conflict.
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Unprocessable Entity — provider_type_mismatch (the provider does not serve the channel's type); for a mailbox provider, personal_mailbox (a person's own mailbox), group_address (the address is a group), mailbox_denied (outside the application's scope), mailbox_unknown; for a messenger provider, endpoint_unknown (no such Page is connected).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — communications-channel-check's limit for this client address, shared by creating, switching and verifying a channel.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Service Unavailable — provider_unreachable, the mailbox provider did not answer.
            summary: Create a mail channel
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
            x-vantigo-assistant: never
    /api/v1/communications/channels/{id}:
        get:
            operationId: getCommunicationsChannelsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChannelResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a mail channel by id
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
        put:
            operationId: putCommunicationsChannelsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/UpdateChannelRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChannelResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Update a mail channel
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
            x-vantigo-assistant: never
    /api/v1/communications/channels/{id}/provider:
        post:
            description: Switches an SMTP channel to a mailbox provider (`entra`, `google`) by its own address, keeping its id, conversations and default flag; the SMTP credentials are deleted in the same transaction.
            operationId: postCommunicationsChannelsByIdProvider
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SwitchChannelProviderRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChannelResponse'
                    description: OK
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Conflict — mailbox_exists (another channel already uses the mailbox on that provider), mail_channels_off, provider_switch_unsupported (the channel is on another mailbox provider; switch it back to SMTP first).
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Unprocessable Entity — provider_unchanged, personal_mailbox, group_address, mailbox_denied, mailbox_unknown.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — communications-channel-check's limit for this client address, shared by creating, switching and verifying a channel.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Service Unavailable — provider_unreachable, the mailbox provider did not answer.
            summary: Switch a mail channel to another provider
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
    /api/v1/communications/channels/{id}/verify:
        post:
            operationId: postCommunicationsChannelsByIdVerify
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ChannelVerifyResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CommunicationErrorResponse'
                    description: Unprocessable Entity — destination_rejected, verification_failed; for a mailbox provider, mail_channels_off, personal_mailbox, group_address, mailbox_denied, mailbox_unknown, mailbox_changed (the address now names another mailbox), provider_unreachable.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — communications-channel-check's limit for this client address, shared by creating, switching and verifying a channel.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Verify a mail channel's connection
            tags:
                - ChannelEndpoints
            x-vantigo-access: permission:communications:channels-manage
    /api/v1/communications/conversations:
        get:
            operationId: getCommunicationsConversations
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: assignedUserId
                  schema:
                    format: uuid
                    type: string
                - in: query
                  name: tagId
                  schema:
                    format: uuid
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: unreadOnly
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfConversationListItem'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List the conversations in the inbox
            tags:
                - ConversationEndpoints
            x-vantigo-access: permission:communications:conversations-view
        post:
            operationId: postCommunicationsConversations
            parameters:
                - description: Required. The client-chosen key that makes the send safe to retry — non-blank, at most 200 characters, no surrounding whitespace or control characters. A missing or invalid key is answered 400 `idempotency_key_required`; a key reused with a different payload, 409 `idempotency_key_reused`; a replay of the same payload returns the original result with 200.
                  in: header
                  name: Idempotency-Key
                  required: true
                  schema:
                    maxLength: 200
                    minLength: 1
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            allOf:
                                - $ref: '#/components/schemas/CreateConversationRequest'
                            nullable: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConversationMutationResponse'
                    description: OK
                "201":
