components:
    schemas:
        BillingLineListPrice:
            description: The variant's list price in the project's currency at the moment of the read, resolved through the products catalog. Absent when the project has no currency or the variant has no price in it.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - amount
                - currency
            type: object
        BillingLinePricing:
            description: What this line bills by, present only when the caller may see the project's financial fields (capabilities.canSeeFinancials). Projects stores the rule and never calculates money; whoever invoices resolves the amount.
            properties:
                budgetAmount:
                    description: The line's planning budget, in the project's currency. Financial data, alongside the rest of this block (unlike budgetHours, which every reader of the line sees); greater than zero when set.
                    format: double
                    nullable: true
                    type: number
                discountPercent:
                    description: Set exactly when mode is 'discount'; greater than zero and at most 100.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Set exactly when mode is 'fixed'; an amount in the project's currency.
                    format: double
                    nullable: true
                    type: number
                listPrice:
                    allOf:
                        - $ref: '#/components/schemas/BillingLineListPrice'
                    description: Absent when the project has no currency, or the variant has no list price in it.
                mode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
            required:
                - mode
            type: object
        BillingLineRequest:
            description: A billing line as it should stand. The line's variant and pricing rule are always carried in full; active is the one field a PUT may leave out, which leaves the line as it stands.
            properties:
                active:
                    description: PUT only. Absent leaves the line as it stands. There is no DELETE — a line other modules may have billed against is deactivated, never removed.
                    nullable: true
                    type: boolean
                budgetAmount:
                    description: Optional planning budget in the project's currency; greater than zero when set, and requires the project to have a currency.
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    description: Optional planning budget in hours; greater than zero when set.
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{1,10}$ and be unique within the project.
                    type: string
                discountPercent:
                    description: Required and in (0, 100] when pricingMode is 'discount', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Required and greater than zero when pricingMode is 'fixed', absent otherwise. A 'fixed' line needs the project to have a currency.
                    format: double
                    nullable: true
                    type: number
                pricingMode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
                variantId:
                    description: The product variant this line is pinned to; it must resolve through the products catalog.
                    format: int32
                    type: integer
            required:
                - code
                - variantId
                - pricingMode
            type: object
        BillingLineResponse:
            description: One billing line — a product variant plus a pricing rule (D9). The variant's product name, SKU and unit are embedded so a reader needs no products permission to render the line.
            properties:
                active:
                    type: boolean
                budgetHours:
                    description: The line's planning budget in hours. Planning data, visible with the line regardless of financial rights — unlike budgetAmount, which is inside pricing.
                    format: double
                    nullable: true
                    type: number
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int32
                    type: integer
                pricing:
                    allOf:
                        - $ref: '#/components/schemas/BillingLinePricing'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                productName:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                sku:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the line's code joined with a hyphen, as later modules quote it ('KVEM1000-PM'). It follows the project's code when that is changed.
                    type: string
                unit:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variantId:
                    format: int32
                    type: integer
                variantMissing:
                    description: Whether the products catalog no longer knows this line's variant. The line still resolves, so work already billed against it stays priced.
                    type: boolean
            required:
                - id
                - code
                - trackableCode
                - variantId
                - variantMissing
                - active
                - createdAt
                - updatedAt
            type: object
        BillingMilestoneCapabilities:
            description: What the calling user may do with this milestone right now, so the frontend never re-derives the status flow. Marking invoiced and undoing it need financial rights on the project; everything else is the project's manager.
            properties:
                canCancel:
                    description: Whether the milestone may be cancelled, which is what a manager does with one that is no longer going to be billed.
                    type: boolean
                canDelete:
                    description: Whether the milestone may be deleted. Only one that is still planned and has never changed status may be; anything else is cancelled instead.
                    type: boolean
                canEdit:
                    description: Whether the milestone's name, date and amount may be changed. An invoiced or a cancelled milestone is read-only until it is moved back.
                    type: boolean
                canMarkInvoiced:
                    type: boolean
                canMarkPlanned:
                    description: Whether a milestone that is ready may be put back to planned.
                    type: boolean
                canMarkReady:
                    type: boolean
                canReopen:
                    description: Whether a cancelled milestone may be put back to planned.
                    type: boolean
                canUndoInvoiced:
                    description: Whether the invoicing may be undone, which puts the milestone back to ready and clears the reference, the date and the frozen amount.
                    type: boolean
            required:
                - canEdit
                - canDelete
                - canMarkReady
                - canMarkPlanned
                - canMarkInvoiced
                - canUndoInvoiced
                - canCancel
                - canReopen
            type: object
        BillingMilestonePerson:
            description: Who marked a milestone ready or invoiced, named as the user directory knows them now. An account disabled since keeps the stamp and renders inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        BillingMilestonePlanResponse:
            description: A project's invoice plan — its billing milestones in manual order, cancelled ones last, and what they add up to.
            properties:
                milestones:
                    items:
                        $ref: '#/components/schemas/BillingMilestoneResponse'
                    type: array
                totals:
                    $ref: '#/components/schemas/BillingMilestonePlanTotals'
            required:
                - milestones
                - totals
            type: object
        BillingMilestonePlanTotals:
            description: What a project's milestones add up to, one sum of effective amounts per status. Totals never block a save; they are what the plan is read against.
            properties:
                cancelled:
                    description: Cancelled milestones bill nothing, so this sum counts against neither the fixed price nor anything else. It is reported so the plan can show what was dropped.
                    format: double
                    type: number
                currency:
                    description: The project's currency, which every amount here is in. Absent when the project has none — which is also when it can have no milestones.
                    nullable: true
                    type: string
                fixedPrice:
                    description: The project's fixed price, present only on a fixed-price project. It is what unplanned and overPlanned are measured against.
                    format: double
                    nullable: true
                    type: number
                invoiced:
                    format: double
                    type: number
                overPlanned:
                    description: How much the plan exceeds the fixed price by, present only on a fixed-price project the plan is over. Never present together with unplanned.
                    format: double
                    nullable: true
                    type: number
                planned:
                    description: The sum of the milestones still in 'planned'. Ready and invoiced ones have their own totals; this is not a running total of the three.
                    format: double
                    type: number
                ready:
                    format: double
                    type: number
                unplanned:
                    description: How much of the fixed price planned + ready + invoiced does not cover, present only on a fixed-price project with something left to plan.
                    format: double
                    nullable: true
                    type: number
            required:
                - planned
                - ready
                - invoiced
                - cancelled
            type: object
        BillingMilestonePositionRequest:
            description: Where a milestone should sit in the plan. The project's milestones are renumbered 1..n in one transaction, so the order never has a gap. Cancelled milestones keep their number and are still listed last.
            properties:
                position:
                    description: The 1-based place in the plan. A position past the end means last.
                    format: int32
                    type: integer
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
            required:
                - position
                - revision
            type: object
        BillingMilestoneRequest:
            description: A billing milestone as it should stand. Exactly one of amount and percent is carried — a percent is a share of the project's fixed price and needs the project to have one, and either way the project needs a currency.
            properties:
                amount:
                    description: A flat amount in the project's currency; greater than zero and at most 9999999999.99. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                description:
                    description: At most 2000 characters once trimmed; a blank one is stored as none.
                    nullable: true
                    type: string
                name:
                    description: Trimmed before validation and storage; never blank, at most 200 characters.
                    type: string
                percent:
                    description: A share of the project's fixed price, greater than zero and at most 100, with at most two decimals. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    description: The day the milestone is expected to be billed. A plain calendar date, compared with the server's own UTC date to decide whether the milestone is overdue.
                    format: date
                    nullable: true
                    type: string
            required:
                - name
            type: object
        BillingMilestoneResponse:
            description: One billing milestone — a named step of the invoice plan, priced either as a flat amount or as a share of the project's fixed price. Every milestone operation needs financial rights on the project, so nothing here is shaped out per caller.
            properties:
                amount:
                    description: The flat amount as entered, absent on a percent milestone.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/BillingMilestoneCapabilities'
                createdAt:
                    format: date-time
                    type: string
                currency:
                    description: The project's currency, which every amount on the milestone is in. Absent only when the project no longer has one, which only a cancelled milestone can outlive — the currency cannot be cleared while any milestone that still bills something exists.
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                effectiveAmount:
                    description: What the plan counts — the frozen amount once invoiced, else the flat amount, else the project's fixed price times the percent, in exact decimal rounded half up to two places. Computed on read, so an open percent milestone follows a change to the fixed price and an invoiced one does not. Absent in exactly one case, and never zero instead of it — a cancelled milestone priced as a percent of a fixed price the project has since dropped, which has no amount to report; every other milestone has one.
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                invoiceDate:
                    description: The date on the invoice, optional and only ever set while the milestone is invoiced.
                    format: date
                    nullable: true
                    type: string
                invoiceReference:
                    description: The reference of the invoice this milestone was billed on, optional and only ever set while the milestone is invoiced. At most 100 characters once trimmed.
                    nullable: true
                    type: string
                invoicedAt:
                    format: date-time
                    nullable: true
                    type: string
                invoicedBy:
                    allOf:
                        - $ref: '#/components/schemas/BillingMilestonePerson'
                    description: Absent until the milestone is invoiced, and cleared again when the invoicing is undone.
                name:
                    type: string
                overdue:
                    description: Whether the milestone is still planned or ready and its planned date has passed, compared as plain UTC dates against the server's clock.
                    type: boolean
                percent:
                    description: The share of the fixed price as entered, absent on an amount milestone.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    format: date
                    nullable: true
                    type: string
                position:
                    description: The milestone's manual place in the project's plan, 1-based and without gaps.
                    format: int32
                    type: integer
                projectId:
                    format: int32
                    type: integer
                readyAt:
                    format: date-time
                    nullable: true
                    type: string
                readyBy:
                    allOf:
                        - $ref: '#/components/schemas/BillingMilestonePerson'
                    description: Absent until the milestone is marked ready, and cleared again when it goes back to planned.
                revision:
                    description: The revision every write against this milestone must carry.
                    format: int32
                    type: integer
                status:
                    description: "'planned', 'ready', 'invoiced' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - status
                - position
                - overdue
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        BillingMilestoneStatusRequest:
            description: One move through the milestone's status flow — planned to ready to invoiced, cancelled from either open status and reopened from cancelled, and the invoicing undone back to ready. Any other pair is refused by naming both statuses. A move whose target is not 'cancelled' also re-asks the project's own rules, so reopening or marking ready is refused while the project has no currency, or while a milestone priced as a percent has no fixed price to be a share of. Undoing an invoicing is the one exception and is never refused — crediting an invoice is a real event — but if the fixed price is gone the milestone is converted to an amount milestone carrying the amount that was frozen when it was invoiced, with percent cleared; the timeline entry records that it was converted.
            properties:
                invoiceDate:
                    description: Accepted only on a move to 'invoiced'.
                    format: date
                    nullable: true
                    type: string
                invoiceReference:
                    description: Accepted only on a move to 'invoiced'; at most 100 characters once trimmed.
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
                status:
                    description: "'planned', 'ready', 'invoiced' or 'cancelled'."
                    type: string
            required:
                - status
                - revision
            type: object
        BillingMilestoneUpdateRequest:
            description: A milestone as it should stand afterwards, carrying the revision it was read at. Where it sits in the plan is not part of it — position is the move's — so an edit saved from an open form cannot undo somebody's reordering.
            properties:
                amount:
                    description: A flat amount in the project's currency; greater than zero and at most 9999999999.99. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                description:
                    description: At most 2000 characters once trimmed; a blank one is stored as none.
                    nullable: true
                    type: string
                name:
                    description: Trimmed before validation and storage; never blank, at most 200 characters.
                    type: string
                percent:
                    description: A share of the project's fixed price, greater than zero and at most 100, with at most two decimals. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    format: date
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
            required:
                - name
                - revision
            type: object
        ChecklistItemRequest:
            description: One thing to tick off a task. The text is trimmed before validation and storage; the item is appended after the ones already there, open.
            properties:
                text:
                    description: At most 500 characters once trimmed, and never blank.
                    type: string
            required:
                - text
            type: object
        ChecklistItemResponse:
            description: One item of a task's checklist. The counts the task tree carries are aggregates over these, so a tree renders progress without reading them.
            properties:
                done:
                    type: boolean
                id:
                    format: int64
                    type: integer
                position:
                    description: The item's 1-based place in its task's checklist.
                    format: int32
                    type: integer
                text:
                    type: string
            required:
                - id
                - text
                - done
                - position
            type: object
        ChecklistItemUpdateRequest:
            description: What the change should make of the item. Every field is optional and an absent one leaves that part of the item as it stands, so ticking an item off says nothing about its text or its place.
            properties:
                done:
                    description: Ticks the item off, or opens it again.
                    type: boolean
                position:
                    description: The 1-based place among the task's items to move it to; the rest are renumbered 1..n. A position past the end means last.
                    format: int32
                    type: integer
                text:
                    description: At most 500 characters once trimmed, and never blank.
                    type: string
            type: object
        CommentAuthor:
            description: Who wrote a comment. active is the user directory's answer, not the comment's — an account disabled or removed afterwards keeps the comment and is reported inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        CommentRequest:
            description: What a comment says. The body is trimmed before validation and storage.
            properties:
                body:
                    description: At most 4000 characters once trimmed, and never blank.
                    type: string
            required:
                - body
            type: object
        CommentResponse:
            description: One comment on a task. A task's comments are its own history, which is why a task writes nothing to the project timeline.
            properties:
                author:
                    $ref: '#/components/schemas/CommentAuthor'
                body:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                editedAt:
                    description: When the author last rewrote the comment. Absent — not null — on a comment nobody has edited.
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - author
                - body
                - createdAt
            type: object
        GetProjectStatsResponse:
            description: How many of the projects the caller may see stand in each status, for the list page's key-figure row. Every status is always present, 0 included.
            properties:
                active:
                    format: int32
                    type: integer
                cancelled:
                    format: int32
                    type: integer
                completed:
                    format: int32
                    type: integer
                onHold:
                    format: int32
                    type: integer
                planned:
                    format: int32
                    type: integer
            required:
                - planned
                - active
                - onHold
                - completed
                - cancelled
            type: object
        MyTaskResponse:
            description: One open task assigned to the caller, on a project they can see, named with the project it belongs to. It carries no subtasks — the list is flat, across projects.
            properties:
                assignee:
                    allOf:
                        - $ref: '#/components/schemas/TaskAssignee'
                    description: Always the caller on this endpoint; carried so one decoder reads both shapes.
                checklist:
                    $ref: '#/components/schemas/TaskChecklistProgress'
                commentCount:
                    format: int32
                    type: integer
                completedAt:
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                parentTaskId:
                    description: The top-level task this one is a subtask of, absent for a top-level task.
                    format: int32
                    nullable: true
                    type: integer
                position:
                    format: int32
                    type: integer
                projectCode:
                    type: string
                projectId:
                    format: int32
                    type: integer
                projectName:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo' or 'in-progress' — a done task is not open, and never listed here."
                    type: string
                title:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - projectCode
                - projectName
                - title
                - status
                - position
                - revision
                - createdAt
                - updatedAt
                - checklist
                - commentCount
            type: object
        PaginatedResponseOfCommentResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/CommentResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfProjectSummaryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProjectSummaryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfTimelineEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProjectCapabilities:
            description: What the calling user may do with this project, so the frontend never re-derives authorization.
            properties:
                canContribute:
                    description: Whether the caller may write the project's work — tasks, checklists and comments. True for its members and its managers.
                    type: boolean
                canManage:
                    type: boolean
                canManageMilestones:
                    description: Whether the caller may add, edit, reorder, cancel and reopen this project's billing milestones. The project's managers, and nobody else — a holder of projects:view-financials reads the plan and marks milestones invoiced, but does not write it.
                    type: boolean
                canSeeFinancials:
                    type: boolean
            required:
                - canManage
                - canContribute
                - canSeeFinancials
                - canManageMilestones
            type: object
        ProjectCodeSuggestionResponse:
            description: A project code nobody has used yet, derived from the customer and project names (design §4.2). The caller may type anything valid instead.
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        ProjectCreateRequest:
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in the project's currency. Greater than zero when set; requires currency, since it is an amount.
                    format: double
                    nullable: true
                    type: number
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
            type: object
        ProjectFinancials:
            description: The project's financial fields, present only when the caller may see them (capabilities.canSeeFinancials) and then always present, possibly with no fields inside, so a client can tell "may see, nothing entered" from "may not see".
            properties:
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                currency:
                    nullable: true
                    type: string
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in this currency.
                    format: double
                    nullable: true
                    type: number
                fixedPriceAmount:
                    format: double
                    nullable: true
                    type: number
            type: object
        ProjectPersonSummary:
            description: One user on a project, named for display.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        ProjectResponse:
            properties:
                billingLinesAvailable:
                    description: Whether the products module is enabled, and so whether this project can carry priced billing lines.
                    type: boolean
                billingType:
                    type: string
                budgetHours:
                    description: Planning data, visible to everyone who can see the project — unlike the amounts under financials.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/ProjectCapabilities'
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                financials:
                    allOf:
                        - $ref: '#/components/schemas/ProjectFinancials'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
                - capabilities
                - billingLinesAvailable
            type: object
        ProjectRoleAssignmentRequest:
            properties:
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
            required:
                - role
            type: object
        ProjectRoleResponse:
            description: One user's role on one project. active is the user directory's answer, not the assignment's — a disabled account keeps the role it was given and is reported inactive.
            properties:
                active:
                    description: Whether the user can still act. A user the directory no longer knows is reported inactive and named 'Unknown user'.
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
                - role
                - createdAt
            type: object
        ProjectStatsAttentionItem:
            description: One project the dashboard wants a human to look at. The shape is the dashboard's, shared by every module's /stats/attention; entityId is the project id, which the dashboard turns into a link to /projects/{id}.
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ProjectStatsDailyBucket:
            description: One UTC calendar day of a time series. Days with nothing in them are absent, not zero — the dashboard's sparkline plots the points it is given.
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        ProjectStatsSummaryResponse:
            description: The dashboard's projects card over one period, in the envelope every module's /stats/summary shares. Only the two figures and their deltas differ.
            properties:
                activeProjects:
                    format: int32
                    type: integer
                activeProjectsDelta:
                    format: int32
                    type: integer
                from:
                    format: date-time
                    type: string
                newProjects:
                    format: int32
                    type: integer
                newProjectsDelta:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - activeProjects
                - activeProjectsDelta
                - newProjects
                - newProjectsDelta
            type: object
        ProjectStatusChangeRequest:
            properties:
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'. Any transition is allowed, reopening a completed project included."
                    type: string
            required:
                - status
            type: object
        ProjectSummaryResponse:
            description: One project as a list row. It carries no financial fields at all — not shaped out, absent from the schema — so no caller ever sees a price in a list.
            properties:
                billingType:
                    type: string
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
            type: object
        ProjectUpdateRequest:
            description: Every field of the project as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409.
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in the project's currency. Greater than zero when set; requires currency, since it is an amount.
                    format: double
                    nullable: true
                    type: number
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                revision:
                    description: The revision the caller read the project at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
                - revision
            type: object
        TaskAssignee:
            description: The one person a task is assigned to (D6). active is the user directory's answer, not the assignment's — an account disabled afterwards keeps the task and is reported inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        TaskChecklistProgress:
            description: How far a task's checklist has come. The items themselves are read through the task's own checklist endpoints; the tree carries only the two counts.
            properties:
                done:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
            required:
                - total
                - done
            type: object
        TaskPositionRequest:
            description: Where a task should sit — among which siblings, and how far down. The siblings are renumbered 1..n in one transaction, so the order never has a gap.
            properties:
                parentTaskId:
                    description: The top-level task to move under, absent to move among the project's top-level tasks. A task that has subtasks of its own cannot become a subtask (D6).
                    format: int32
                    nullable: true
                    type: integer
                position:
                    description: The 1-based place among the siblings. A position past the end means last.
                    format: int32
                    type: integer
            required:
                - position
            type: object
        TaskRequest:
            properties:
                assigneeUserId:
                    description: The one person the task is assigned to. The user must exist and be active.
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    description: Not before startDate when both are set.
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    description: Greater than zero and at most 999999.99 when set.
                    format: double
                    nullable: true
                    type: number
                parentTaskId:
                    description: Creates the task as a subtask of this one, which must be a top-level task of the same project (D6 — one level of nesting).
                    format: int32
                    nullable: true
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'. Absent means 'todo'."
                    nullable: true
                    type: string
                title:
                    description: Trimmed before validation and storage; at most 200 characters.
                    type: string
            required:
                - title
            type: object
        TaskResponse:
            description: One task of a project. checklist and commentCount are aggregates over the task's own children, so a tree renders progress without reading either.
            properties:
                assignee:
                    allOf:
                        - $ref: '#/components/schemas/TaskAssignee'
                    description: Absent — not null — when nobody is assigned.
                checklist:
                    $ref: '#/components/schemas/TaskChecklistProgress'
                commentCount:
                    format: int32
                    type: integer
                completedAt:
                    description: When the task entered 'done'. Cleared when it leaves it again.
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                parentTaskId:
                    description: The top-level task this one is a subtask of, absent for a top-level task.
                    format: int32
                    nullable: true
                    type: integer
                position:
                    description: The task's 1-based place among its siblings — the project's top-level tasks, or its parent's subtasks.
                    format: int32
                    type: integer
                projectId:
                    format: int32
                    type: integer
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'."
                    type: string
                subtasks:
                    description: The task's own subtasks, by position. Present only on the endpoints that answer a tree, and never on a subtask itself (D6 — one level of nesting).
                    items:
                        $ref: '#/components/schemas/TaskResponse'
                    type: array
                title:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - title
                - status
                - position
                - revision
                - createdAt
                - updatedAt
                - checklist
                - commentCount
            type: object
        TaskUpdateRequest:
            description: Every field of the task as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409. Where the task sits is not part of it — that is the position operation's.
            properties:
                assigneeUserId:
                    description: The one person the task is assigned to. The user must exist and be active; leaving it out clears the assignment.
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    description: Not before startDate when both are set.
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    description: Greater than zero and at most 999999.99 when set.
                    format: double
                    nullable: true
                    type: number
                revision:
                    description: The revision the caller read the task at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'. Required: an update is a full replace, so a body that leaves the status out would silently reopen a finished task. Moving into 'done' stamps completedAt; leaving it clears the stamp."
                    type: string
                title:
                    description: Trimmed before validation and storage; at most 200 characters.
                    type: string
            required:
                - title
                - status
                - revision
            type: object
        TimelineEntryResponse:
            description: One generated event on a project's timeline. The actor's display name is the one captured when the change happened, not a name resolved on read.
            properties:
                actorDisplay:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                eventType:
                    type: string
                id:
                    format: int64
                    type: integer
                occurredAt:
                    format: date-time
                    type: string
                payload:
                    description: The event's own fields. Billing events name which fields changed and never their amounts, so a timeline needs no financial shaping.
                    type: object
            required:
                - id
                - eventType
                - payload
                - actorDisplay
                - occurredAt
            type: object
info:
    title: Vantigo Projects API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/projects:
        get:
            operationId: getProjects
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - description: Matches the project code or name, case-insensitively. '%' and '_' are literal characters, not wildcards.
                  in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: true for projects with no customer, false for projects with one.
                  in: query
                  name: internal
                  schema:
                    type: boolean
                - description: Narrows the list to projects the caller holds a role on.
                  in: query
                  name: mine
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProjectSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List projects
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        post:
            operationId: postProjects
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access+projects:create
    /api/v1/projects/code-suggestion:
        get:
            operationId: getProjectsCodeSuggestion
            parameters:
                - description: The customer the project bills to. Absent means an internal project, prefixed 'INT'. A customer that does not exist contributes no letters rather than an error.
                  in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: The project's working name, whose letters follow the customer prefix. Absent or empty contributes no letters.
                  in: query
                  name: name
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectCodeSuggestionResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Suggest a project code
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/milestones/{milestoneId}:
        delete:
            operationId: deleteProjectsMilestonesByMilestoneId
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content — the milestone is gone and the plan has been renumbered.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the milestone is not planned, or it has changed status at least once; cancel it instead.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller can see the project but is not its manager, or may not see its financial fields at all.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
            summary: Delete a billing milestone
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        get:
            operationId: getProjectsMilestonesByMilestoneId
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BillingMilestoneResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller can see the project but may not see its financial fields.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
            summary: Get a billing milestone by id
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        put:
            operationId: putProjectsMilestonesByMilestoneId
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillingMilestoneUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BillingMilestoneResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the body failed a rule, or the milestone is invoiced or cancelled and so read-only.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller can see the project but is not its manager, or may not see its financial fields at all.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the supplied revision is not the milestone's current one.
            summary: Update a billing milestone
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/milestones/{milestoneId}/position:
        put:
            operationId: putProjectsMilestonesByMilestoneIdPosition
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillingMilestonePositionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BillingMilestoneResponse'
                    description: OK — the milestone where it now sits; the project's milestones have been renumbered 1..n.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller can see the project but is not its manager, or may not see its financial fields at all.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the supplied revision is not the milestone's current one.
            summary: Move a billing milestone in the plan
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/milestones/{milestoneId}/status:
        post:
            operationId: postProjectsMilestonesByMilestoneIdStatus
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillingMilestoneStatusRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BillingMilestoneResponse'
                    description: OK — the milestone in its new status, with whatever stamps the move set or cleared.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the status is not one of the four, the move is not one the flow allows, the project can no longer denominate or price the milestone the move would revive, or an invoice reference or date was sent on a move other than to 'invoiced'.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — marking invoiced and undoing it need financial rights on the project; every other move needs the caller to be its manager.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the supplied revision is not the milestone's current one.
            summary: Move a billing milestone through its status flow
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/my-tasks:
        get:
            operationId: getProjectsMyTasks
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/MyTaskResponse'
                                type: array
                    description: OK — the caller's open tasks on the projects they can see, by due date (nulls last), then project code, then position.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the caller's open tasks
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}:
        get:
            operationId: getProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: Get a project by id
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        put:
            operationId: putProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
