components:
    schemas:
        BillingLineListPrice:
            description: The variant's list price in the project's currency at the moment of the read, resolved through the products catalog. Absent when the project has no currency or the variant has no price in it.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - amount
                - currency
            type: object
        BillingLinePricing:
            description: What this line bills by, present only when the caller may see the project's financial fields (capabilities.canSeeFinancials). Projects stores the rule and never calculates money; whoever invoices resolves the amount.
            properties:
                budgetAmount:
                    description: The line's planning budget, in the project's currency. Financial data, alongside the rest of this block (unlike budgetHours, which every reader of the line sees); greater than zero when set.
                    format: double
                    nullable: true
                    type: number
                discountPercent:
                    description: Set exactly when mode is 'discount'; greater than zero and at most 100.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Set exactly when mode is 'fixed'; an amount in the project's currency.
                    format: double
                    nullable: true
                    type: number
                listPrice:
                    allOf:
                        - $ref: '#/components/schemas/BillingLineListPrice'
                    description: Absent when the project has no currency, the variant has no list price in it, or the list price could not be read — only in that last case is the line's catalogUnavailable true. The rest of pricing is read off the stored line and is present regardless.
                mode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
            required:
                - mode
            type: object
        BillingLineRequest:
            description: A billing line as it should stand. The line's variant and pricing rule are always carried in full; active is the one field a PUT may leave out, which leaves the line as it stands.
            properties:
                active:
                    description: PUT only. Absent leaves the line as it stands. There is no DELETE — a line other modules may have billed against is deactivated, never removed.
                    nullable: true
                    type: boolean
                budgetAmount:
                    description: Optional planning budget in the project's currency; greater than zero when set, at most two decimals, and requires the project to have a currency.
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    description: Optional planning budget in hours; greater than zero when set, at most two decimals.
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{1,10}$ and be unique within the project.
                    type: string
                discountPercent:
                    description: Required and in (0, 100] when pricingMode is 'discount', absent otherwise. At most two decimals.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Required and greater than zero when pricingMode is 'fixed', absent otherwise, and at most two decimals. A 'fixed' line needs the project to have a currency.
                    format: double
                    nullable: true
                    type: number
                pricingMode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
                variantId:
                    description: The product variant this line is pinned to; it must resolve through the products catalog.
                    format: int32
                    type: integer
            required:
                - code
                - variantId
                - pricingMode
            type: object
        BillingLineResponse:
            description: One billing line — a product variant plus a pricing rule (D9). The variant's product name, SKU and unit are embedded so a reader needs no products permission to render the line.
            properties:
                active:
                    type: boolean
                budgetHours:
                    description: The line's planning budget in hours. Planning data, visible with the line regardless of financial rights — unlike budgetAmount, which is inside pricing.
                    format: double
                    nullable: true
                    type: number
                catalogUnavailable:
                    description: Whether at least one catalog-derived field on this line is missing because the products catalog could not be read. A read never fails on it, and whatever the catalog did supply is still here — the names (productName, sku, unit) and the list price are resolved by separate calls and fail independently, so this being true does not say which of them is gone, only that something is. Everything the line itself stores (code, variantId, active, budgets and the pricing rule) is unaffected either way. A client shows what is present and falls back only for what is absent.
                    type: boolean
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int32
                    type: integer
                pricing:
                    allOf:
                        - $ref: '#/components/schemas/BillingLinePricing'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                productName:
                    description: Absent when the catalog no longer knows the variant (variantMissing), or when the names could not be read at all — in which case catalogUnavailable is true and variantMissing is false. Present whenever the names were resolved, catalogUnavailable or not.
                    nullable: true
                    type: string
                sku:
                    description: Absent when the catalog no longer knows the variant (variantMissing), or when the names could not be read at all — in which case catalogUnavailable is true and variantMissing is false. Present whenever the names were resolved, catalogUnavailable or not.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the line's code joined with a hyphen, as later modules quote it ('KVEM1000-PM'). It follows the project's code when that is changed.
                    type: string
                unit:
                    description: Absent when the catalog no longer knows the variant (variantMissing), or when the names could not be read at all — in which case catalogUnavailable is true and variantMissing is false. Present whenever the names were resolved, catalogUnavailable or not.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variantId:
                    format: int32
                    type: integer
                variantMissing:
                    description: Whether the products catalog no longer knows this line's variant. The line still resolves, so work already billed against it stays priced. True only when the names lookup actually succeeded and answered that the variant is gone, so it can be trusted whenever it is true — it is never a guess. It can therefore coexist with catalogUnavailable (the names answered, some other catalog call did not), and it is false when the names themselves could not be read.
                    type: boolean
            required:
                - id
                - code
                - trackableCode
                - variantId
                - variantMissing
                - catalogUnavailable
                - active
                - createdAt
                - updatedAt
            type: object
        BillingMilestoneCapabilities:
            description: What the calling user may do with this milestone right now, so the frontend never re-derives the status flow. Marking invoiced and undoing it need financial rights on the project; everything else is the project's manager.
            properties:
                canCancel:
                    description: Whether the milestone may be cancelled, which is what a manager does with one that is no longer going to be billed.
                    type: boolean
                canDelete:
                    description: Whether the milestone may be deleted. Only one that is still planned and has never changed status may be; anything else is cancelled instead.
                    type: boolean
                canEdit:
                    description: Whether the milestone's name, date and amount may be changed. An invoiced or a cancelled milestone is read-only until it is moved back.
                    type: boolean
                canMarkInvoiced:
                    description: Whether the milestone may be marked invoiced, which freezes its effective amount. This is one of the two flags that does not mean "the caller manages the project" — financial rights alone are enough, because whoever may see the money may say it was billed.
                    type: boolean
                canMarkPlanned:
                    description: Whether a milestone that is ready may be put back to planned.
                    type: boolean
                canMarkReady:
                    description: Whether the milestone may be marked ready to invoice. The project's manager, and only while the project can still price it.
                    type: boolean
                canReopen:
                    description: Whether a cancelled milestone may be put back to planned.
                    type: boolean
                canUndoInvoiced:
                    description: Whether the invoicing may be undone, which puts the milestone back to ready and clears the reference, the date and the frozen amount.
                    type: boolean
            required:
                - canEdit
                - canDelete
                - canMarkReady
                - canMarkPlanned
                - canMarkInvoiced
                - canUndoInvoiced
                - canCancel
                - canReopen
            type: object
        BillingMilestonePerson:
            description: Who marked a milestone ready or invoiced, named as the user directory knows them now. An account disabled since keeps the stamp and renders inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        BillingMilestonePlanResponse:
            description: A project's invoice plan — its billing milestones in manual order, cancelled ones last, and what they add up to.
            properties:
                milestones:
                    items:
                        $ref: '#/components/schemas/BillingMilestoneResponse'
                    type: array
                totals:
                    $ref: '#/components/schemas/BillingMilestonePlanTotals'
            required:
                - milestones
                - totals
            type: object
        BillingMilestonePlanTotals:
            description: What a project's milestones add up to, one sum of effective amounts per open status. There is no cancelled sum — a cancelled milestone bills nothing and may still be denominated in a currency the project has moved off, so it is left out of the plan's arithmetic entirely. Totals never block a save; they are what the plan is read against.
            properties:
                currency:
                    description: The project's current currency, which every amount in these totals is in. Absent when the project has none — which a cancelled milestone can outlive, so it is not the same as "the plan is empty".
                    nullable: true
                    type: string
                fixedPrice:
                    description: The project's fixed price, present only on a fixed-price project. It is what unplanned and overPlanned are measured against.
                    format: double
                    nullable: true
                    type: number
                invoiced:
                    format: double
                    type: number
                overPlanned:
                    description: How much the plan exceeds the fixed price by, present only on a fixed-price project the plan is over. Never present together with unplanned.
                    format: double
                    nullable: true
                    type: number
                planned:
                    description: The sum of the milestones still in 'planned'. Ready and invoiced ones have their own totals; this is not a running total of the three.
                    format: double
                    type: number
                ready:
                    format: double
                    type: number
                unplanned:
                    description: How much of the fixed price planned + ready + invoiced does not cover, present only on a fixed-price project with something left to plan.
                    format: double
                    nullable: true
                    type: number
            required:
                - planned
                - ready
                - invoiced
            type: object
        BillingMilestonePositionRequest:
            description: Where a milestone should sit in the plan. The project's milestones are renumbered 1..n in one transaction, so the order never has a gap. Cancelled milestones keep their number and are still listed last.
            properties:
                position:
                    description: The 1-based place in the plan, in the same numbering BillingMilestoneResponse.position reports — not an index into the listing, which sorts cancelled milestones last. A position past the end means last.
                    format: int32
                    type: integer
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
            required:
                - position
                - revision
            type: object
        BillingMilestoneRequest:
            description: A billing milestone as it should stand. Exactly one of amount and percent is carried — a percent is a share of the project's fixed price and needs the project to have one, and either way the project needs a currency.
            properties:
                amount:
                    description: A flat amount in the project's currency; greater than zero and at most 9999999999.99. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                description:
                    description: At most 2000 characters once trimmed; a blank one is stored as none.
                    nullable: true
                    type: string
                name:
                    description: Trimmed before validation and storage; never blank, at most 200 characters.
                    type: string
                percent:
                    description: A share of the project's fixed price, greater than zero and at most 100, with at most two decimals. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    description: The day the milestone is expected to be billed. A plain calendar date, compared with the server's own UTC date to decide whether the milestone is overdue.
                    format: date
                    nullable: true
                    type: string
            required:
                - name
            type: object
        BillingMilestoneResponse:
            description: One billing milestone — a named step of the invoice plan, priced either as a flat amount or as a share of the project's fixed price. Every milestone operation needs financial rights on the project, so nothing here is shaped out per caller.
            properties:
                amount:
                    description: The flat amount as entered, absent on a percent milestone.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/BillingMilestoneCapabilities'
                createdAt:
                    format: date-time
                    type: string
                currency:
                    description: What this milestone's amounts are denominated in. A milestone with a flat amount carries the currency it was entered in and keeps it — a cancelled one can outlive a change to the project's, and its number still means what it meant. A milestone with a percent reports the project's current currency, because it resolves against a fixed price that is always in it, and is absent only when the project has no currency at all.
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                effectiveAmount:
                    description: What the plan counts — the frozen amount once invoiced, else the flat amount, else the project's fixed price times the percent, in exact decimal rounded half up to two places. Computed on read, so an open percent milestone follows a change to the fixed price and an invoiced one does not. Absent, and never zero instead of it, when the milestone cannot be priced at all — normally a cancelled milestone priced as a percent of a fixed price the project has since dropped, and such a milestone is left out of the totals too.
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                invoiceDate:
                    description: The date on the invoice, optional and only ever set while the milestone is invoiced.
                    format: date
                    nullable: true
                    type: string
                invoiceReference:
                    description: The reference of the invoice this milestone was billed on, optional and only ever set while the milestone is invoiced. At most 100 characters once trimmed.
                    nullable: true
                    type: string
                invoicedAt:
                    format: date-time
                    nullable: true
                    type: string
                invoicedBy:
                    allOf:
                        - $ref: '#/components/schemas/BillingMilestonePerson'
                    description: Absent until the milestone is invoiced, and cleared again when the invoicing is undone.
                name:
                    type: string
                overdue:
                    description: Whether the milestone is still planned or ready and its planned date has passed, compared as plain UTC dates against the server's clock.
                    type: boolean
                percent:
                    description: The share of the fixed price as entered, absent on an amount milestone.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    format: date
                    nullable: true
                    type: string
                position:
                    description: The milestone's own place in the project's plan — the stored 1..n numbering across all of the project's milestones, without gaps. It is not an index into the returned array, which lists cancelled milestones last whatever number they hold, so a cancelled milestone with an early position appears at the end with that early number. Send this field's value, never an array index, when moving a milestone.
                    format: int32
                    type: integer
                projectId:
                    format: int32
                    type: integer
                readyAt:
                    format: date-time
                    nullable: true
                    type: string
                readyBy:
                    allOf:
                        - $ref: '#/components/schemas/BillingMilestonePerson'
                    description: Absent until the milestone is marked ready, and cleared again when it goes back to planned.
                revision:
                    description: The revision every write against this milestone must carry.
                    format: int32
                    type: integer
                status:
                    description: "'planned', 'ready', 'invoiced' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - name
                - status
                - position
                - overdue
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        BillingMilestoneStatusRequest:
            description: One move through the milestone's status flow — planned to ready to invoiced, cancelled from either open status and reopened from cancelled, and the invoicing undone back to ready. Any other pair is refused by naming both statuses. A move whose target is not 'cancelled' also re-asks the project's own rules, so reopening or marking ready is refused while the project has no currency, or while a milestone priced as a percent has no fixed price to be a share of. Undoing an invoicing is the one exception and is never refused — crediting an invoice is a real event — but if the fixed price is gone the milestone is converted to an amount milestone carrying the amount that was frozen when it was invoiced, with percent cleared; the timeline entry records that it was converted.
            properties:
                invoiceDate:
                    description: Accepted only on a move to 'invoiced'.
                    format: date
                    nullable: true
                    type: string
                invoiceReference:
                    description: Accepted only on a move to 'invoiced'; at most 100 characters once trimmed.
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
                status:
                    description: "'planned', 'ready', 'invoiced' or 'cancelled'."
                    type: string
            required:
                - status
                - revision
            type: object
        BillingMilestoneUpdateRequest:
            description: A milestone as it should stand afterwards, carrying the revision it was read at. Where it sits in the plan is not part of it — position is the move's — so an edit saved from an open form cannot undo somebody's reordering.
            properties:
                amount:
                    description: A flat amount in the project's currency; greater than zero and at most 9999999999.99. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                description:
                    description: At most 2000 characters once trimmed; a blank one is stored as none.
                    nullable: true
                    type: string
                name:
                    description: Trimmed before validation and storage; never blank, at most 200 characters.
                    type: string
                percent:
                    description: A share of the project's fixed price, greater than zero and at most 100, with at most two decimals. Exactly one of amount and percent.
                    format: double
                    nullable: true
                    type: number
                plannedDate:
                    format: date
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the milestone at.
                    format: int32
                    type: integer
            required:
                - name
                - revision
            type: object
        ChecklistItemRequest:
            description: One thing to tick off a task. The text is trimmed before validation and storage; the item is appended after the ones already there, open.
            properties:
                text:
                    description: At most 500 characters once trimmed, and never blank.
                    type: string
            required:
                - text
            type: object
        ChecklistItemResponse:
            description: One item of a task's checklist. The counts the task tree carries are aggregates over these, so a tree renders progress without reading them.
            properties:
                done:
                    type: boolean
                id:
                    format: int64
                    type: integer
                position:
                    description: The item's 1-based place in its task's checklist.
                    format: int32
                    type: integer
                text:
                    type: string
            required:
                - id
                - text
                - done
                - position
            type: object
        ChecklistItemUpdateRequest:
            description: What the change should make of the item. Every field is optional and an absent one leaves that part of the item as it stands, so ticking an item off says nothing about its text or its place.
            properties:
                done:
                    description: Ticks the item off, or opens it again.
                    type: boolean
                position:
                    description: The 1-based place among the task's items to move it to; the rest are renumbered 1..n. A position past the end means last.
                    format: int32
                    type: integer
                text:
                    description: At most 500 characters once trimmed, and never blank.
                    type: string
            type: object
        CommentAuthor:
            description: Who wrote a comment. active is the user directory's answer, not the comment's — an account disabled or removed afterwards keeps the comment and is reported inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        CommentRequest:
            description: What a comment says. The body is trimmed before validation and storage.
            properties:
                body:
                    description: At most 4000 characters once trimmed, and never blank.
                    type: string
            required:
                - body
            type: object
        CommentResponse:
            description: One comment on a task. A task's comments are its own history, which is why a task writes nothing to the project timeline.
            properties:
                author:
                    $ref: '#/components/schemas/CommentAuthor'
                body:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                editedAt:
                    description: When the author last rewrote the comment. Absent — not null — on a comment nobody has edited.
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - author
                - body
                - createdAt
            type: object
        GetProjectStatsResponse:
            description: How many of the projects the caller may see stand in each status, for the list page's key-figure row. Every status is always present, 0 included.
            properties:
                active:
                    format: int32
                    type: integer
                cancelled:
                    format: int32
                    type: integer
                completed:
                    format: int32
                    type: integer
                onHold:
                    format: int32
                    type: integer
                planned:
                    format: int32
                    type: integer
            required:
                - planned
                - active
                - onHold
                - completed
                - cancelled
            type: object
        MyTaskResponse:
            description: One open task assigned to the caller, on a project they can see, named with the project it belongs to. It carries no subtasks — the list is flat, across projects.
            properties:
                assignee:
                    allOf:
                        - $ref: '#/components/schemas/TaskAssignee'
                    description: Always the caller on this endpoint; carried so one decoder reads both shapes.
                checklist:
                    $ref: '#/components/schemas/TaskChecklistProgress'
                commentCount:
                    format: int32
                    type: integer
                completedAt:
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                parentTaskId:
                    description: The top-level task this one is a subtask of, absent for a top-level task.
                    format: int32
                    nullable: true
                    type: integer
                position:
                    format: int32
                    type: integer
                projectCode:
                    type: string
                projectId:
                    format: int32
                    type: integer
                projectName:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo' or 'in-progress' — a done task is not open, and never listed here."
                    type: string
                title:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - projectCode
                - projectName
                - title
                - status
                - position
                - revision
                - createdAt
                - updatedAt
                - checklist
                - commentCount
            type: object
        PaginatedResponseOfCommentResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/CommentResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfProjectSummaryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProjectSummaryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfTimelineEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProjectCapabilities:
            description: What the calling user may do with this project, so the frontend never re-derives authorization.
            properties:
                canContribute:
                    description: Whether the caller may write the project's work — tasks, checklists and comments. True for its members and its managers.
                    type: boolean
                canManage:
                    type: boolean
                canManageMilestones:
                    description: Whether the caller may add, edit, reorder, cancel and reopen this project's billing milestones. The project's managers, and nobody else — a holder of projects:view-financials reads the plan and marks milestones invoiced, but does not write it.
                    type: boolean
                canSeeCosts:
                    description: Whether the caller may see what this project's work costs the company, and the margin — the economy read's `cost` block. Financial rights on the project *and* the sensitive projects:view-costs permission; a holder of the permission who may not see this project's money gets neither. It answers the permission question alone — the block is still absent when the project carries no currency or time tracking is off, so a surface decides whether to *offer* the view from this flag and whether to *draw* it from the block itself.
                    type: boolean
                canSeeFinancials:
                    type: boolean
            required:
                - canManage
                - canContribute
                - canSeeFinancials
                - canManageMilestones
                - canSeeCosts
            type: object
        ProjectCodeSuggestionResponse:
            description: A project code nobody has used yet, derived from the customer and project names (design §4.2). The caller may type anything valid instead.
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        ProjectCreateRequest:
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    description: Optional planning budget in the project's currency; greater than zero when set, at most two decimals, and requires a currency.
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    description: Optional planning budget in hours; greater than zero when set, at most two decimals.
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in the project's currency. Greater than zero when set and at most two decimals; requires currency, since it is an amount.
                    format: double
                    nullable: true
                    type: number
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise. At most two decimals — every decimal column here is scale 2, so a third would be rounded away silently.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
            type: object
        ProjectEconomyActuals:
            description: What has been logged, in the three buckets every economy surface shows the split of, plus the figures that span all three. Hours are visible to everyone who sees the project; the amounts are financial data and absent without financial rights on it.
            properties:
                approved:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBucket'
                    description: Approved and invoiced entries.
                billableHours:
                    description: The billable share of the three buckets' hours. Billable plus non-billable is the total.
                    format: double
                    type: number
                draft:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBucket'
                    description: Draft and rejected entries.
                lastEntryDate:
                    description: The day the most recent entry in any of the three buckets was logged for, drafts included. Absent when nothing has been logged.
                    format: date
                    nullable: true
                    type: string
                nonBillableHours:
                    description: The share of the three buckets' hours that nobody is billed for. Billable plus non-billable is the total.
                    format: double
                    type: number
                submitted:
                    $ref: '#/components/schemas/ProjectEconomyBucket'
                totalAmount:
                    description: The three buckets' bill amounts added up, in the project's currency. Financial data, so absent without financial rights; also absent when the project has no currency, since nothing could be denominated then.
                    format: double
                    nullable: true
                    type: number
                totalHours:
                    description: The three buckets' hours added up.
                    format: double
                    type: number
                unpricedHours:
                    description: Billable hours with no bill amount in the project's currency — work with no bill rate, and work priced in another currency — so they count in hours and in no amount. Non-billable hours are never unpriced — they were never meant to carry a price, and they are reported in nonBillableHours. It is not unconditionally the figure Time tracking's own project summary shows, which covers only submitted, approved and invoiced work.
                    format: double
                    type: number
            required:
                - approved
                - submitted
                - draft
                - totalHours
                - unpricedHours
                - billableHours
                - nonBillableHours
            type: object
        ProjectEconomyBucket:
            description: One bucket of logged work. The hours are there for everyone who sees the project; the amount is financial data.
            properties:
                amount:
                    description: What the bucket's work bills at, in the project's currency. Absent without financial rights on the project, and absent when the project has no currency.
                    format: double
                    nullable: true
                    type: number
                hours:
                    description: The bucket's hours, visible to everyone who can see the project.
                    format: double
                    type: number
            required:
                - hours
            type: object
        ProjectEconomyBudget:
            description: What was planned — the project's own budget and what its billing lines' budgets add up to. Hours are planning data and visible to everyone who sees the project; the amounts are financial and absent without financial rights on it. The project's budget and the lines' are independent numbers whose relation is shown, never enforced.
            properties:
                amount:
                    description: The project's budget amount, the budgeted value of the work.
                    format: double
                    nullable: true
                    type: number
                fixedPrice:
                    description: The project's fixed price, set only on a fixed-price project.
                    format: double
                    nullable: true
                    type: number
                hours:
                    description: The project's own budget in hours.
                    format: double
                    nullable: true
                    type: number
                linesAmount:
                    description: The billing lines' budget amounts added up, deactivated lines included. Absent when no line carries one.
                    format: double
                    nullable: true
                    type: number
                linesHours:
                    description: The billing lines' budget hours added up, deactivated lines included. Absent when no line carries one.
                    format: double
                    nullable: true
                    type: number
            type: object
        ProjectEconomyBudgetUsed:
            description: How much of the budget the logged work has used, by the module's one definition. The basis is chosen in a fixed order — the project's budget amount, then the fixed price of a fixed-price project, then the budget hours — and a caller who may not see amounts only ever gets the hours basis. Absent when the project has no basis at all, and absent when time tracking is not enabled.
            properties:
                approvedPercent:
                    description: The approved bucket alone against the same basis, rounded the same way.
                    format: double
                    type: number
                basis:
                    description: "'amount', 'fixedPrice' or 'hours' — which budget the percentages are measured against."
                    type: string
                percent:
                    description: 'All three buckets against the basis, as a percentage rounded half up to one decimal. The rounding is for display only: overBudget and the dashboard''s thresholds are decided on the exact ratio, so 100.04 % is over budget although it prints 100.0.'
                    format: double
                    type: number
            required:
                - basis
                - percent
                - approvedPercent
            type: object
        ProjectEconomyCost:
            description: What the work has cost the company and what is left over. Present only for a caller with financial rights on the project *and* projects:view-costs, only when time tracking is enabled, and only when the project carries a currency — a cost in no currency is a number nobody can read, and on a small project a total cost next to the hours reveals a person's cost rate. Every amount is in the project's currency; a cost recorded in another one is not summed, exactly as a bill amount in another one is not.
            properties:
                approved:
                    description: What the approved and invoiced hours cost the company.
                    format: double
                    type: number
                draft:
                    description: What the draft and rejected hours cost the company.
                    format: double
                    type: number
                expenseCost:
                    description: What the project's expenses cost the company, in its own currency — the other half of `margin`'s cost side, given here so a surface can show both without subtracting one from the other. It is the expenses' own-currency total, the same figure as `expenses.totalCost`, rounded on its own; `margin` is *not* this figure subtracted from anything, because it is rounded once from the unrounded whole. Absent exactly when expenseTracking is false.
                    format: double
                    nullable: true
                    type: number
                margin:
                    description: 'What is left over: the value of the work plus what the expenses will bill, less what the work cost plus what the expenses cost — every term in the project''s own currency, added exactly and rounded once at the end rather than half by half. All four terms are **across all three buckets**, the same basis the labour half has always used: the work''s own total (approved, submitted and draft together, as `actuals.totalAmount` and `cost.total` report it) and the expenses'' total (`expenses.totalCost` and `expenses.totalAmount`), never the approved bucket alone and never two different bases mixed. What is approved and what is not is shown by the three buckets themselves — `actuals.approved/submitted/draft` and `expenses.approved/submitted/draft`. With expenseTracking false the two expense terms are not there and this is the three buckets'' bill amount minus their cost, as it has always been. Negative when the project has cost more than it brings in.'
                    format: double
                    type: number
                submitted:
                    description: What the hours waiting for a decision cost the company.
                    format: double
                    type: number
                total:
                    description: What all three buckets cost the company, taken from the one across-bucket figure the module that owns the hours reports rather than by adding the three above — each of those is rounded on its own, so their sum can be a cent or two out.
                    format: double
                    type: number
                uncostedHours:
                    description: Hours the total leaves out because they carry no cost rate, or a cost rate in another currency. The margin is short by whatever they would have cost, so a surface showing it says how many hours it excludes.
                    format: double
                    type: number
            required:
                - approved
                - submitted
                - draft
                - total
                - margin
                - uncostedHours
            type: object
        ProjectEconomyCustomer:
            description: The customer a portfolio row's project bills to, absent on an internal project. The name is resolved through the customer directory, once per distinct customer on the page, and is absent when the directory no longer knows the customer — the project keeps the relationship it was started under either way.
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    nullable: true
                    type: string
            required:
                - id
            type: object
        ProjectEconomyExpenseBucket:
            description: One bucket of recorded expenses — how many lines are in it, what they cost the company and what their billable lines will charge the customer. The bucket a line falls in is its *unit's* status, so a travel claim's line is judged through the claim somebody approved or sent back; approved carries the lines already invoiced, because invoicing is a stamp rather than a status, and draft carries the rejected ones, exactly as the three buckets of logged work do. Each amount is rounded on its own, so two buckets need not add up to the cent — that is what the totals beside them are for.
            properties:
                amount:
                    description: What the bucket's billable lines will charge the customer. A non-billable line contributes nothing, and neither does a billable line nobody has priced — that one is in unpricedCount instead, because a missing price is not a price of nothing.
                    format: double
                    type: number
                cost:
                    description: What the bucket's lines cost the company — the net, the gross less the VAT, whoever paid. Financial data like every figure here, but not *labour* cost, so it needs financial rights on the project and not projects:view-costs.
                    format: double
                    type: number
                count:
                    description: 'How many lines are in the bucket. A travel claim''s lines count one each: a trip is one unit of approval, but it is its lines that cost money.'
                    format: int32
                    type: integer
            required:
                - count
                - cost
                - amount
            type: object
        ProjectEconomyExpenseCurrency:
            description: What was recorded in one currency the project itself is not in. Nothing is ever converted — adding two currencies would produce a number in neither — so a receipt in another currency is reported as what it is rather than folded into the project's figures or dropped. A project that carries no currency at all reports every currency this way and has no figures of its own.
            properties:
                amount:
                    description: What this currency's billable lines will charge the customer, across all three buckets.
                    format: double
                    type: number
                cost:
                    description: What this currency's lines cost the company, across all three buckets.
                    format: double
                    type: number
                count:
                    description: How many lines were recorded in this currency, in any bucket.
                    format: int32
                    type: integer
                currency:
                    description: The ISO 4217 code every figure here is in.
                    type: string
                readyAmount:
                    description: What of this currency is ready to invoice — approved, billable, priced and not yet invoiced.
                    format: double
                    type: number
            required:
                - currency
                - count
                - cost
                - amount
                - readyAmount
            type: object
        ProjectEconomyExpenses:
            description: 'What the project''s expenses cost, what they will bill, and what of them is ready to invoice. Present when this installation has a module that reports expenses (expenseTracking) *and* the caller has financial rights on the project — every figure in it is money — and absent otherwise, never zeroed. **None of it reaches the budget**: expenses are not work measured against a budget, so nothing here is in budgetUsed, overBudget, a line''s usedPercent or the logged work those are computed from. The ten figures of the project''s own currency (the three buckets and the seven beside them) are present or absent *together*, on the project carrying a currency; a project that carries none has only otherCurrencies. A project whose expenses are tracked and has none recorded is here with zeroes, which is a different answer from the block being absent.'
            properties:
                approved:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyExpenseBucket'
                    description: What has been approved, in the project's own currency, invoiced lines included. Absent when the project carries no currency.
                draft:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyExpenseBucket'
                    description: What nobody has been asked to accept yet, rejected units included. Absent when the project carries no currency.
                invoicedAmount:
                    description: What has already been charged for the invoiced lines, in the project's currency. Absent when the project carries no currency.
                    format: double
                    nullable: true
                    type: number
                invoicedCount:
                    description: 'How many lines have already been stamped as invoiced. Invoicing is a stamp, not a status: these lines are still in the approved bucket, and this says how much of it has already left the building. Absent when the project carries no currency.'
                    format: int32
                    nullable: true
                    type: integer
                lastEntryDate:
                    description: The day the most recently dated line was for, **across every currency and every bucket** — so on a project with a foreign-currency receipt it may be the day of a line reported under otherCurrencies. Absent when nothing has been recorded.
                    format: date
                    nullable: true
                    type: string
                otherCurrencies:
                    description: One entry per currency the project itself is not in, by currency code. Absent when everything was recorded in the project's own currency — and, on a project that carries no currency, this is the whole answer.
                    items:
                        $ref: '#/components/schemas/ProjectEconomyExpenseCurrency'
                    type: array
                readyAmount:
                    description: What the ready lines will charge, in the project's currency. Absent when the project carries no currency.
                    format: double
                    nullable: true
                    type: number
                readyCount:
                    description: 'How many lines can go on an invoice today: the unit approved, the line billable, a bill amount present and not yet invoiced. Absent when the project carries no currency.'
                    format: int32
                    nullable: true
                    type: integer
                submitted:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyExpenseBucket'
                    description: What is waiting for a decision. Absent when the project carries no currency.
                totalAmount:
                    description: What all three buckets' billable lines will charge, in the project's currency — the across-bucket figure the module that owns the expenses reports, rounded once from the unrounded whole rather than by adding the three buckets above, each of which was rounded on its own. Absent when the project carries no currency.
                    format: double
                    nullable: true
                    type: number
                totalCost:
                    description: What all three buckets cost the company, in the project's currency, taken the same across-bucket way as totalAmount. It is the figure cost.expenseCost repeats for a caller who may also see the labour cost. Absent when the project carries no currency.
                    format: double
                    nullable: true
                    type: number
                unpricedCount:
                    description: 'How many billable lines, in any bucket, carry no bill amount — billable mileage with no customer rate, an outlay nobody has priced yet. They are counted here and are in no amount, because a missing price is not a price of nothing: a surface showing what the project will bill must say how many lines the figure is short by. Absent when the project carries no currency.'
                    format: int32
                    nullable: true
                    type: integer
            type: object
        ProjectEconomyLine:
            description: One row of the per-line breakdown — every billing line of the project, deactivated ones included, in the same order the billing tab lists them, plus one row without a billingLineId for work logged against no line at all. A line the project does not have that work was nonetheless logged against folds into that same row rather than being dropped.
            properties:
                active:
                    description: Whether the line is still active. Absent on the row that stands for work logged without a line.
                    nullable: true
                    type: boolean
                actuals:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyActuals'
                    description: What has been logged against this line. Absent exactly when timeTracking is false.
                billingLineId:
                    description: The line this row is about. Absent on the row that stands for work logged without a line.
                    format: int32
                    nullable: true
                    type: integer
                budgetAmount:
                    description: The line's budget amount. Financial data, so absent without financial rights on the project.
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    description: The line's budget in hours, planning data like the project's own.
                    format: double
                    nullable: true
                    type: number
                code:
                    description: The line's own code, as the line carries it. Absent on the row that stands for work logged without a line.
                    nullable: true
                    type: string
                overBudget:
                    description: Whether the logged work has passed the line's budget, decided on the exact ratio rather than on the rounded usedPercent.
                    type: boolean
                remainingHours:
                    description: What is left of the line's budget hours, never negative — a line that has gone past its budget reports 0 here and says so through overBudget. Absent when the line carries no budget in hours, and when timeTracking is false.
                    format: double
                    nullable: true
                    type: number
                usedPercent:
                    description: The logged work against this line's own budget — its budget amount when the caller may see amounts and it is set, otherwise its budget hours — rounded half up to one decimal. Absent when the line has no budget to measure against, and when timeTracking is false.
                    format: double
                    nullable: true
                    type: number
            required:
                - overBudget
            type: object
        ProjectEconomyListResponse:
            description: 'One page of the economy portfolio, with totals over the whole filtered set rather than over the page: a portfolio read to decide where to look must not have its headline figures change when somebody turns the page.'
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProjectEconomyRow'
                    type: array
                expenseTracking:
                    description: Whether this installation has a module that reports what a project's expenses cost and bill, exactly as the per-project economy reports it. False means no row carries readyExpenseCount, readyExpenseAmount or readyTotalAmount and no currency's totals carry expenseAmount or totalAmount — not that nothing has been spent.
                    type: boolean
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
                timeTracking:
                    description: Whether this installation has a module that reports what has been logged against projects, exactly as the per-project economy reports it. False means no row carries actuals or budgetUsed — not that nothing has been logged.
                    type: boolean
                totals:
                    $ref: '#/components/schemas/ProjectEconomyTotals'
            required:
                - data
                - pagination
                - totals
                - timeTracking
                - expenseTracking
            type: object
        ProjectEconomyNextMilestone:
            description: The next open milestone of a portfolio row's project — the earliest-dated 'planned' or 'ready' one, undated ones after dated ones and then in the plan's own order. Absent when the project has no open milestone at all.
            properties:
                effectiveAmount:
                    description: What the milestone is worth, in the project's currency — the flat amount as entered, or the percentage of the project's fixed price. Absent for a milestone nobody can price, exactly as on the invoice plan itself.
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                overdue:
                    description: Whether the milestone's planned day has passed, on the server's own UTC calendar.
                    type: boolean
                plannedDate:
                    description: The day the milestone is planned for. Absent when nobody has dated it, which is what sorts it after every dated one.
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'planned' or 'ready' — the two open statuses."
                    type: string
            required:
                - id
                - name
                - status
                - overdue
            type: object
        ProjectEconomyReadyAmount:
            description: What is ready to invoice in one currency. The portfolio's totals carry one of these per currency, by currency code, because amounts in different currencies are not comparable and adding them would produce a number in neither. Each figure is rounded once from the exact sum across every row in that currency, never from the rows' own rounded figures.
            properties:
                amount:
                    description: 'What the ready *milestones* come to. It keeps that meaning: a currency in this list only because something is ready to invoice among its expenses reports 0 here, which is a sum over no milestones rather than a missing figure.'
                    format: double
                    type: number
                currency:
                    type: string
                expenseAmount:
                    description: What the ready *expense lines* come to. Absent exactly when expenseTracking is false.
                    format: double
                    nullable: true
                    type: number
                totalAmount:
                    description: amount and expenseAmount together — what is ready to invoice in this currency altogether, which is what the readyAmount sort orders rows by. Absent exactly when expenseTracking is false.
                    format: double
                    nullable: true
                    type: number
            required:
                - currency
                - amount
            type: object
        ProjectEconomyResponse:
            description: 'A project''s budget against what has been logged on it (design §5, delivery B). Everyone who sees the project sees the hours; amounts, the fixed price, the milestone totals and the currency need financial rights on it, and the cost block needs projects:view-costs as well. Fields the caller may not see are absent, never null and never zero. Nothing here is cached: the hours are read live through the actuals contract on every request.'
            properties:
                actuals:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyActuals'
                    description: What has been logged on the project as a whole. Absent exactly when timeTracking is false.
                budget:
                    $ref: '#/components/schemas/ProjectEconomyBudget'
                budgetUsed:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBudgetUsed'
                    description: Absent when there is no basis to measure against, and when timeTracking is false.
                cost:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyCost'
                    description: Absent without financial rights on the project and projects:view-costs, absent when timeTracking is false, and absent when the project carries no currency. Render the cost panel on this block being present rather than on capabilities.canSeeCosts, which answers only the permission half.
                currency:
                    description: The currency every amount in this response is in. Financial data, exactly as on the project itself, so a caller who may not see the money sees no currency either; absent too when the project carries none.
                    nullable: true
                    type: string
                expenseTracking:
                    description: Whether this installation has a module that reports what a project's expenses cost and bill. False means the expenses block is not there, the cost block carries no expenseCost and the margin is the labour one alone — not that nothing has been spent. It is about the installation rather than the caller, so it is true even for a caller who may not see the block.
                    type: boolean
                expenses:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyExpenses'
                    description: What the project's expenses cost and will bill. Absent when expenseTracking is false and absent without financial rights on the project. None of it reaches the budget (see the block's own description).
                lines:
                    description: One row per billing line, plus the no-line row when anything was logged without one. Always present, and empty on a project with no lines and nothing logged.
                    items:
                        $ref: '#/components/schemas/ProjectEconomyLine'
                    type: array
                milestones:
                    allOf:
                        - $ref: '#/components/schemas/BillingMilestonePlanTotals'
                    description: The invoice plan's totals, the same sums GET /projects/{id}/milestones answers with. Financial data, so absent without financial rights on the project; present, with zeroes, for a project whose plan is empty.
                overBudget:
                    description: Whether the logged work has passed the budget budgetUsed measures against, decided on the exact ratio rather than on the rounded percent. False when there is nothing to measure against.
                    type: boolean
                taskEstimateHours:
                    description: The project's tasks' estimates added up, subtasks and finished ones included — a secondary planning figure beside the budget, not a budget of its own. Absent when no task carries an estimate.
                    format: double
                    nullable: true
                    type: number
                timeTracking:
                    description: Whether this installation has a module that reports what has been logged against projects. False means the budgets and the invoice plan are still here and there are no actuals to compare them with — not that nothing has been logged.
                    type: boolean
            required:
                - timeTracking
                - expenseTracking
                - budget
                - lines
                - overBudget
            type: object
        ProjectEconomyRow:
            description: One project in the economy portfolio. Every row is a project the caller has financial rights on — the project's manager, projects:manage-all, or projects:view-financials on a project they can see — so the amounts are never shaped away here the way they are on the per-project economy; a caller who may not see a project's money does not get its row at all. There is no cost or margin in the portfolio — that block is the per-project read's, behind projects:view-costs.
            properties:
                actuals:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyRowActuals'
                    description: What has been logged on the project. Absent exactly when timeTracking is false.
                budgetUsed:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBudgetUsed'
                    description: Absent when the project has no basis to measure against — such rows sort last under the budgetUsed sort — and absent when timeTracking is false.
                currency:
                    description: The currency this row's amounts are in. Absent when the project carries none, and then the row has no amounts at all.
                    nullable: true
                    type: string
                nextMilestone:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyNextMilestone'
                    description: The project's next open milestone, absent when it has none.
                overBudget:
                    description: Whether the logged work has passed the budget budgetUsed measures against, decided on the exact ratio rather than on the rounded percent. False when there is nothing to measure against.
                    type: boolean
                pendingHours:
                    description: 'The hours waiting for a decision: the submitted and draft buckets added up. Absent exactly when actuals is — nobody has said there are none, only that this installation cannot say.'
                    format: double
                    nullable: true
                    type: number
                project:
                    $ref: '#/components/schemas/ProjectEconomyRowProject'
                readyAmount:
                    description: 'What the project''s ''ready'' milestones add up to, in its own currency. Absent when it has none ready, when none of them can be priced, and when the project carries no currency. It keeps meaning milestones: the expenses are beside it, and the two together are readyTotalAmount.'
                    format: double
                    nullable: true
                    type: number
                readyCount:
                    description: 'How many of the project''s milestones are ready to invoice. It keeps meaning milestones: the expense lines are counted in readyExpenseCount.'
                    format: int32
                    type: integer
                readyExpenseAmount:
                    description: What the project's ready expense lines will charge, in its own currency. Absent when it has none ready, when the project carries no currency, and absent exactly when expenseTracking is false.
                    format: double
                    nullable: true
                    type: number
                readyExpenseCount:
                    description: 'How many of the project''s expense lines are ready to invoice — approved, billable, priced, not yet invoiced — **in the project''s own currency only**. A line in another currency is not counted and not converted here; the per-project economy is where a project''s other currencies are reported, because a portfolio row is one line of a table — and 0 on a project that carries no currency at all, whose lines are reported under the per-project economy''s `otherCurrencies`. Absent exactly when expenseTracking is false, which is how "this installation cannot say" is told from "there are none".'
                    format: int32
                    nullable: true
                    type: integer
                readyTotalAmount:
                    description: readyAmount and readyExpenseAmount together — what is ready to invoice on this project altogether, in its own currency, which is what the readyAmount sort orders by. Absent when neither half has an amount, and absent exactly when expenseTracking is false.
                    format: double
                    nullable: true
                    type: number
            required:
                - project
                - overBudget
                - readyCount
            type: object
        ProjectEconomyRowActuals:
            description: What has been logged on a portfolio row's project — the three buckets and their totals, and no more. The unpriced, billable and non-billable splits are the per-project economy read's; a portfolio is read across hundreds of projects at once.
            properties:
                approved:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBucket'
                    description: Approved and invoiced entries.
                draft:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyBucket'
                    description: Draft and rejected entries.
                submitted:
                    $ref: '#/components/schemas/ProjectEconomyBucket'
                totalAmount:
                    description: The three buckets' bill amounts added up, in the project's currency. Absent when the project carries no currency.
                    format: double
                    nullable: true
                    type: number
                totalHours:
                    description: The three buckets' hours added up.
                    format: double
                    type: number
            required:
                - approved
                - submitted
                - draft
                - totalHours
            type: object
        ProjectEconomyRowProject:
            description: Which project a portfolio row is about, in the fields the table renders and links from.
            properties:
                code:
                    type: string
                customer:
                    allOf:
                        - $ref: '#/components/schemas/ProjectEconomyCustomer'
                    description: Absent on an internal project.
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - code
                - name
                - status
            type: object
        ProjectEconomyTotals:
            description: What the whole filtered set adds up to, page or no page. readyAmounts is a list rather than one number because the projects in it may be in several currencies, and two currencies never add up.
            properties:
                overBudgetCount:
                    description: How many of those projects have passed their budget. Always 0 when timeTracking is false, since nothing can be compared then.
                    format: int32
                    type: integer
                projectCount:
                    description: How many projects the filters matched, which is also the pagination's totalCount.
                    format: int32
                    type: integer
                readyAmounts:
                    description: What is ready to invoice, one entry per currency, by currency code — milestones, expenses and their total. A currency appears when either half has something in it. A project whose ready milestones cannot be priced, or that carries no currency, contributes to readyCount and to no amount.
                    items:
                        $ref: '#/components/schemas/ProjectEconomyReadyAmount'
                    type: array
                readyCount:
                    description: How many milestones across those projects are ready to invoice.
                    format: int32
                    type: integer
                readyExpenseCount:
                    description: How many expense lines across those projects are ready to invoice, each counted only in its own project's currency — a line in another currency, and every line of a project that carries no currency at all, is counted in no row and so in no total either. Absent exactly when expenseTracking is false.
                    format: int32
                    nullable: true
                    type: integer
            required:
                - projectCount
                - overBudgetCount
                - readyCount
                - readyAmounts
            type: object
        ProjectFinancials:
            description: The project's financial fields, present only when the caller may see them (capabilities.canSeeFinancials) and then always present, possibly with no fields inside, so a client can tell "may see, nothing entered" from "may not see".
            properties:
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                currency:
                    nullable: true
                    type: string
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in this currency.
                    format: double
                    nullable: true
                    type: number
                fixedPriceAmount:
                    format: double
                    nullable: true
                    type: number
            type: object
        ProjectPersonSummary:
            description: One user on a project, named for display.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        ProjectResponse:
            properties:
                billingLinesAvailable:
                    description: Whether the products module is enabled, and so whether this project can carry priced billing lines.
                    type: boolean
                billingType:
                    type: string
                budgetHours:
                    description: Planning data, visible to everyone who can see the project — unlike the amounts under financials.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/ProjectCapabilities'
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                financials:
                    allOf:
                        - $ref: '#/components/schemas/ProjectFinancials'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
                - capabilities
                - billingLinesAvailable
            type: object
        ProjectRoleAssignmentRequest:
            properties:
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
            required:
                - role
            type: object
        ProjectRoleResponse:
            description: One user's role on one project. active is the user directory's answer, not the assignment's — a disabled account keeps the role it was given and is reported inactive.
            properties:
                active:
                    description: Whether the user can still act. A user the directory no longer knows is reported inactive and named 'Unknown user'.
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
                - role
                - createdAt
            type: object
        ProjectStatsAttentionItem:
            description: |-
                One thing the dashboard wants a human to look at. The shape is the dashboard's, shared by every module's /stats/attention, and the host translates the sentence from `type` — the title is only the name of the thing.

                Five types, each with its own recipients: `projectOverdue`, an active project past its end date, for everyone who can see it; `budgetWarning` (80 % ≤ used ≤ 100 %) and `budgetExceeded` (over 100 %), for the managers of an active project and nobody else, so a holder of projects:manage-all is not sent every project's alerts; `milestoneReady`, for everyone with financial rights on a project that is not cancelled or completed; and `milestoneOverdue`, a planned milestone whose day has passed, for the managers of an active project. One project never raises both budget types.

                entityId is the project id for the three project-shaped types and `<projectId>/<milestoneId>` for the two milestone ones, which is what the dashboard builds the link from; id is unique within the list.

                The budget items need what has been logged, which comes from another module. When that module cannot answer, they are left out and the rest of the list is still returned — this endpoint is one of many the dashboard merges, and one degraded module must not empty it.
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ProjectStatsDailyBucket:
            description: One UTC calendar day of a time series. Days with nothing in them are absent, not zero — the dashboard's sparkline plots the points it is given.
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        ProjectStatsSummaryResponse:
            description: The dashboard's projects card over one period, in the envelope every module's /stats/summary shares. Only the two figures and their deltas differ.
            properties:
                activeProjects:
                    format: int32
                    type: integer
                activeProjectsDelta:
                    format: int32
                    type: integer
                from:
                    format: date-time
                    type: string
                newProjects:
                    format: int32
                    type: integer
                newProjectsDelta:
                    format: int32
                    type: integer
                readyMilestones:
                    description: 'How many billing milestones are ready to invoice, on the projects whose money the caller may see, leaving out cancelled and completed projects — whose invoicing is over — so that this count, the milestoneReady attention items and the portfolio all answer the same question the same way. A count and not an amount: the projects may be in several currencies, and two currencies never add up. It is a state now rather than a figure over the period, exactly as activeProjects is, and it has no delta for the same reason a currency-mixed amount would have no meaning.'
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - activeProjects
                - activeProjectsDelta
                - newProjects
                - newProjectsDelta
                - readyMilestones
            type: object
        ProjectStatusChangeRequest:
            properties:
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'. Any transition is allowed, reopening a completed project included."
                    type: string
            required:
                - status
            type: object
        ProjectSummaryResponse:
            description: One project as a list row. It carries no financial fields at all — not shaped out, absent from the schema — so no caller ever sees a price in a list.
            properties:
                billingType:
                    type: string
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
            type: object
        ProjectUpdateRequest:
            description: Every field of the project as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409.
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    description: Optional planning budget in the project's currency; greater than zero when set, at most two decimals, and requires a currency.
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    description: Optional planning budget in hours; greater than zero when set, at most two decimals.
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                defaultBillRate:
                    description: The rate a time entry bills at when no billing line sets one, in the project's currency. Greater than zero when set and at most two decimals; requires currency, since it is an amount.
                    format: double
                    nullable: true
                    type: number
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise. At most two decimals — every decimal column here is scale 2, so a third would be rounded away silently.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                revision:
                    description: The revision the caller read the project at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
                - revision
            type: object
        TaskAssignee:
            description: The one person a task is assigned to (D6). active is the user directory's answer, not the assignment's — an account disabled afterwards keeps the task and is reported inactive.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        TaskChecklistProgress:
            description: How far a task's checklist has come. The items themselves are read through the task's own checklist endpoints; the tree carries only the two counts.
            properties:
                done:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
            required:
                - total
                - done
            type: object
        TaskPositionRequest:
            description: Where a task should sit — among which siblings, and how far down. The siblings are renumbered 1..n in one transaction, so the order never has a gap.
            properties:
                parentTaskId:
                    description: The top-level task to move under, absent to move among the project's top-level tasks. A task that has subtasks of its own cannot become a subtask (D6).
                    format: int32
                    nullable: true
                    type: integer
                position:
                    description: The 1-based place among the siblings. A position past the end means last.
                    format: int32
                    type: integer
            required:
                - position
            type: object
        TaskRequest:
            properties:
                assigneeUserId:
                    description: The one person the task is assigned to. The user must exist and be active.
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    description: Not before startDate when both are set.
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    description: Greater than zero and at most 999999.99 when set.
                    format: double
                    nullable: true
                    type: number
                parentTaskId:
                    description: Creates the task as a subtask of this one, which must be a top-level task of the same project (D6 — one level of nesting).
                    format: int32
                    nullable: true
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'. Absent means 'todo'."
                    nullable: true
                    type: string
                title:
                    description: Trimmed before validation and storage; at most 200 characters.
                    type: string
            required:
                - title
            type: object
        TaskResponse:
            description: One task of a project. checklist and commentCount are aggregates over the task's own children, so a tree renders progress without reading either.
            properties:
                assignee:
                    allOf:
                        - $ref: '#/components/schemas/TaskAssignee'
                    description: Absent — not null — when nobody is assigned.
                checklist:
                    $ref: '#/components/schemas/TaskChecklistProgress'
                commentCount:
                    format: int32
                    type: integer
                completedAt:
                    description: When the task entered 'done'. Cleared when it leaves it again.
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                parentTaskId:
                    description: The top-level task this one is a subtask of, absent for a top-level task.
                    format: int32
                    nullable: true
                    type: integer
                position:
                    description: The task's 1-based place among its siblings — the project's top-level tasks, or its parent's subtasks.
                    format: int32
                    type: integer
                projectId:
                    format: int32
                    type: integer
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'."
                    type: string
                subtasks:
                    description: The task's own subtasks, by position. Present only on the endpoints that answer a tree, and never on a subtask itself (D6 — one level of nesting).
                    items:
                        $ref: '#/components/schemas/TaskResponse'
                    type: array
                title:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - projectId
                - title
                - status
                - position
                - revision
                - createdAt
                - updatedAt
                - checklist
                - commentCount
            type: object
        TaskUpdateRequest:
            description: Every field of the task as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409. Where the task sits is not part of it — that is the position operation's.
            properties:
                assigneeUserId:
                    description: The one person the task is assigned to. The user must exist and be active; leaving it out clears the assignment.
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                dueDate:
                    description: Not before startDate when both are set.
                    format: date
                    nullable: true
                    type: string
                estimateHours:
                    description: Greater than zero and at most 999999.99 when set.
                    format: double
                    nullable: true
                    type: number
                revision:
                    description: The revision the caller read the task at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'todo', 'in-progress' or 'done'. Required: an update is a full replace, so a body that leaves the status out would silently reopen a finished task. Moving into 'done' stamps completedAt; leaving it clears the stamp."
                    type: string
                title:
                    description: Trimmed before validation and storage; at most 200 characters.
                    type: string
            required:
                - title
                - status
                - revision
            type: object
        TimelineEntryResponse:
            description: One generated event on a project's timeline. The actor's display name is the one captured when the change happened, not a name resolved on read.
            properties:
                actorDisplay:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                eventType:
                    type: string
                id:
                    format: int64
                    type: integer
                occurredAt:
                    format: date-time
                    type: string
                payload:
                    description: The event's own fields. Billing events name which fields changed and never their amounts, so a timeline needs no financial shaping.
                    type: object
            required:
                - id
                - eventType
                - payload
                - actorDisplay
                - occurredAt
            type: object
info:
    title: Vantigo Projects API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/projects:
        get:
            operationId: getProjects
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - description: Matches the project code or name, case-insensitively. '%' and '_' are literal characters, not wildcards.
                  in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: true for projects with no customer, false for projects with one.
                  in: query
                  name: internal
                  schema:
                    type: boolean
                - description: Narrows the list to projects the caller holds a role on.
                  in: query
                  name: mine
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProjectSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List projects
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        post:
            operationId: postProjects
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access+projects:create
    /api/v1/projects/code-suggestion:
        get:
            operationId: getProjectsCodeSuggestion
            parameters:
                - description: The customer the project bills to. Absent means an internal project, prefixed 'INT'. A customer that does not exist contributes no letters rather than an error.
                  in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: The project's working name, whose letters follow the customer prefix. Absent or empty contributes no letters.
                  in: query
                  name: name
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectCodeSuggestionResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Suggest a project code
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/economy:
        get:
            description: 'The economy portfolio: every project the caller has financial rights on, with its budget usage, what has been logged on it and what it has ready to invoice, so somebody responsible for several projects can see which of them need looking at without opening each one. Rows the caller may not see the money of are not shaped down, they are absent — the portfolio is a financial surface end to end.'
            operationId: getProjectsEconomy
            parameters:
                - description: Which page to return, counting from 1. Defaults to 1; anything below it is refused rather than clamped.
                  in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - description: How many rows a page holds. Defaults to 25, and must be between 1 and 100.
                  in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - description: Matches the project code or name, case-insensitively. '%' and '_' are literal characters, not wildcards.
                  in: query
                  name: search
                  schema:
                    type: string
                - description: "One of 'planned', 'active', 'on-hold', 'completed', 'cancelled' or 'all'. An omitted *or empty* value is 'active' — a portfolio is about the work being done now — and 'all' is the only way to lift the filter. This differs from GET /api/v1/projects, where an empty status filters nothing: a cleared status control on a page that shares one with the project list has to send 'all' here."
                  in: query
                  name: status
                  schema:
                    default: active
                    type: string
                - description: Narrows the portfolio to one customer's projects. An internal project — one with no customer — matches no value of it.
                  in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: true keeps only the rows whose logged work has passed the budget. Nothing is over budget when time tracking is off.
                  in: query
                  name: overBudget
                  schema:
                    type: boolean
                - description: true keeps only the rows with at least one milestone ready to invoice.
                  in: query
                  name: hasReady
                  schema:
                    type: boolean
                - description: "Which order the rows come in. 'budgetUsed' (the default) is most-used first on the exact ratio, with rows that have no basis last; 'readyAmount' is by currency code and then the largest amount first, because amounts in different currencies are not comparable and one list cannot rank them against each other; 'nextMilestone' is the soonest planned date first, undated open milestones after dated ones and rows with no open milestone last; 'code' is alphabetical. Every order breaks ties by project code."
                  in: query
                  name: sort
                  schema:
                    default: budgetUsed
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectEconomyListResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the economy of the projects whose money the caller may see
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/milestones/{milestoneId}:
        delete:
            operationId: deleteProjectsMilestonesByMilestoneId
            parameters:
                - in: path
                  name: milestoneId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content — the milestone is gone and the plan has been renumbered.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the milestone is not planned, or it has changed status at least once; cancel it instead.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller can see the project but is not its manager, or may not see its financial fields at all.
                "404":
                    description: Not Found — the milestone does not exist, or it belongs to a project the caller cannot see.
