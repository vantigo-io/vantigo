                    description: Bad Request — field errors.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "404":
                    description: Not Found — no such quote or order. The body is empty.
                "409":
                    content:
