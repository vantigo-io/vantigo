components:
    schemas:
        OrdersAcceptInput:
            additionalProperties: false
            description: "Accept a sent (or expired) quote (O20, O21): which optional lines the customer took, and what to make. confirmed_order also needs orders:sales-confirm."
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                into:
                    description: "draft_order (the default), confirmed_order (also needs orders:sales-confirm) or subscription (needs orders:subscriptions-manage and plan; every line a service or free text, O20)."
                    enum:
                        - draft_order
                        - confirmed_order
                        - subscription
                    type: string
                optionalLineIds:
                    items:
                        format: int64
                        type: integer
                    type: array
                plan:
                    $ref: "#/components/schemas/OrdersSubscriptionPlan"
                overrideReason:
                    description: "Why a block warning is overridden; required with overrideWarnings, at most 500 characters. Logged on the order's change log, or in the quote's internal note."
                    maxLength: 500
                    type: string
                overrideWarnings:
                    description: "Override the document's block warnings (O33): only a holder of orders:settings may; anyone else is still refused with blocked_by_warning."
                    type: boolean
                revision:
                    format: int32
                    type: integer
            required:
                - revision
                - into
                - expectedUpdatedAt
            type: object
        OrdersAccepted:
            additionalProperties: false
            description: "The accepted quote and the document made from it: an order, or a subscription."
            properties:
                order:
                    $ref: "#/components/schemas/OrdersOrder"
                quote:
                    $ref: "#/components/schemas/OrdersQuote"
                subscription:
                    $ref: "#/components/schemas/OrdersSubscription"
            required:
                - quote
            type: object
        OrdersAddress:
            additionalProperties: false
            description: A postal address snapshotted on the document; every field optional.
            properties:
                city:
                    maxLength: 100
                    nullable: true
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    nullable: true
                    type: string
                line1:
                    maxLength: 255
                    nullable: true
                    type: string
                line2:
                    maxLength: 255
                    nullable: true
                    type: string
                name:
                    maxLength: 255
                    nullable: true
                    type: string
                postalCode:
                    maxLength: 20
                    nullable: true
                    type: string
            type: object
        OrdersApplyTemplateInput:
            additionalProperties: false
            description: "Apply a template to a draft quote (O23): its lines are appended, or replace the quote's with replace; empty texts are filled."
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                replace:
                    type: boolean
                revision:
                    format: int32
                    type: integer
                templateId:
                    format: int64
                    type: integer
            required:
                - revision
                - templateId
                - expectedUpdatedAt
            type: object
        OrdersCarrierAccount:
            additionalProperties: false
            description: "A carrier account under Integrations (O51). The credentials are never answered: hasCredentials says whether they are stored. carrierAllowed is false when SHIPPING_CARRIERS withholds the carrier on this installation."
            properties:
                carrier:
                    enum:
                        - bring
                    type: string
                carrierAllowed:
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                customerNumbers:
                    items:
                        type: string
                    type: array
                defaultService:
                    nullable: true
                    type: string
                hasCredentials:
                    type: boolean
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                sender:
                    $ref: "#/components/schemas/OrdersCarrierSender"
                status:
                    enum:
                        - active
                        - archived
                    type: string
                test:
                    description: "The carrier's test mode: Bring's X-Bring-Test-Indicator."
                    type: boolean
                updatedAt:
                    format: date-time
                    type: string
                verifiedAt:
                    format: date-time
                    nullable: true
                    description: When Verify last passed with the stored keys; cleared when they change.
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - carrier
                - carrierAllowed
                - name
                - customerNumbers
                - hasCredentials
                - test
                - sender
                - status
                - version
                - createdAt
                - updatedAt
            type: object
        OrdersCarrierAccountInput:
            additionalProperties: false
            description: "A carrier account to create or save (O51). credentials are write-only: on a save, absent keeps the stored ones. version is required on a save."
            properties:
                carrier:
                    enum:
                        - bring
                    type: string
                credentials:
                    $ref: "#/components/schemas/OrdersCarrierCredentials"
                customerNumbers:
                    maxItems: 5
                    minItems: 1
                    description: "Bring: the first books parcels, a second (when given) cargo."
                    items:
                        maxLength: 20
                        minLength: 1
                        type: string
                    type: array
                defaultService:
                    maxLength: 20
                    nullable: true
                    description: "A product code of the carrier's services."
                    type: string
                name:
                    maxLength: 100
                    minLength: 1
                    type: string
                sender:
                    $ref: "#/components/schemas/OrdersCarrierSender"
                status:
                    enum:
                        - active
                        - archived
                    type: string
                test:
                    type: boolean
                version:
                    format: int32
                    type: integer
            required:
                - carrier
                - name
                - customerNumbers
                - test
            type: object
        OrdersCarrierAccountList:
            additionalProperties: false
            description: "The carrier accounts, the active ones first; carriers are the adapters SHIPPING_CARRIERS allows."
            properties:
                carriers:
                    items:
                        type: string
                    type: array
                items:
                    items:
                        $ref: "#/components/schemas/OrdersCarrierAccount"
                    type: array
            required:
                - items
                - carriers
            type: object
        OrdersCarrierCredentials:
            additionalProperties: false
            description: "Bring's Mybring user id (the login e-mail) and API key. Write-only: sealed when stored and never answered."
            properties:
                key:
                    maxLength: 500
                    minLength: 1
                    type: string
                uid:
                    maxLength: 254
                    minLength: 1
                    type: string
            required:
                - uid
                - key
            type: object
        OrdersCarrierSender:
            additionalProperties: false
            description: "The sender address an account books with; empty fields fall back to the seller's address."
            properties:
                city:
                    maxLength: 100
                    nullable: true
                    type: string
                country:
                    maxLength: 2
                    minLength: 2
                    nullable: true
                    description: ISO 3166-1 alpha-2.
                    type: string
                email:
                    maxLength: 254
                    nullable: true
                    type: string
                line1:
                    maxLength: 200
                    nullable: true
                    type: string
                line2:
                    maxLength: 200
                    nullable: true
                    type: string
                name:
                    maxLength: 200
                    nullable: true
                    type: string
                phone:
                    maxLength: 50
                    nullable: true
                    type: string
                postalCode:
                    maxLength: 20
                    nullable: true
                    type: string
            type: object
        OrdersCarrierService:
            additionalProperties: false
            description: A product the carrier account may book.
            properties:
                code:
                    maxLength: 20
                    type: string
                name:
                    description: "The name in the caller's language."
                    type: string
                nameEn:
                    type: string
                nameNb:
                    type: string
                pickupPoint:
                    description: Delivered to a pickup point.
                    type: boolean
                segment:
                    enum:
                        - b2c
                        - b2b
                        - cargo
                        - return
                    type: string
                waybill:
                    description: Has a waybill (fraktbrev) apart from its labels; otherwise the label serves.
                    type: boolean
            required:
                - code
                - name
                - nameEn
                - nameNb
                - segment
                - pickupPoint
                - waybill
            type: object
        OrdersCarrierServiceList:
            additionalProperties: false
            description: The products the account may book.
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersCarrierService"
                    type: array
            required:
                - items
            type: object
        OrdersCarrierVerification:
            additionalProperties: false
            description: "What Verify learned (O51): ok, unauthorized (the carrier refused the keys), refused (the carrier refused the request, message says why) or unreachable. pricesAvailable is false when the user may not read the account's prices (Bring: the financial role is missing)."
            properties:
                message:
                    nullable: true
                    type: string
                notes:
                    items:
                        type: string
                    type: array
                pricesAvailable:
                    type: boolean
                result:
                    enum:
                        - ok
                        - unauthorized
                        - refused
                        - unreachable
                    type: string
                services:
                    items:
                        $ref: "#/components/schemas/OrdersCarrierService"
                    type: array
            required:
                - result
                - pricesAvailable
                - notes
                - services
            type: object
        OrdersChange:
            additionalProperties: false
            description: "One entry of an order's change log (O26)."
            properties:
                actions:
                    items:
                        $ref: "#/components/schemas/OrdersChangeAction"
                    type: array
                actor:
                    $ref: "#/components/schemas/OrdersPerson"
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                version:
                    format: int32
                    type: integer
            required:
                - id
                - version
                - actor
                - at
                - actions
            type: object
        OrdersChangeAction:
            description: "One typed action (O26, O32): line_added, line_removed, quantity_changed, price_changed, discount_changed, text_changed, delivery_changed, contact_changed, reference_changed, cancelled_remaining, held, released, locked, unlocked, delivered_marked, delivered_undone, warning_overridden (a block warning overridden at confirm: from is the warning, to the reason), draft_allocations_released (the order's draft invoice allocations released by hand, O36: to is how many). lineId names the line when the action is about one; from and to are the values before and after as text."
            properties:
                from:
                    nullable: true
                    type: string
                kind:
                    maxLength: 40
                    type: string
                lineId:
                    format: int64
                    nullable: true
                    type: integer
                to:
                    nullable: true
                    type: string
            required:
                - kind
            type: object
        OrdersChangeList:
            additionalProperties: false
            description: "An order's change log, oldest first."
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersChange"
                    type: array
            required:
                - items
            type: object
        OrdersConfirmInput:
            additionalProperties: false
            description: "Confirm a draft order at the version the client read; overrideWarnings with overrideReason overrides its block warnings (O33)."
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                plan:
                    $ref: "#/components/schemas/OrdersSubscriptionPlan"
                overrideReason:
                    description: "Why a block warning is overridden; required with overrideWarnings, at most 500 characters. Logged on the order's change log, or in the quote's internal note."
                    maxLength: 500
                    type: string
                overrideWarnings:
                    description: "Override the document's block warnings (O33): only a holder of orders:settings may; anyone else is still refused with blocked_by_warning."
                    type: boolean
                reserve:
                    description: "Reserve each goods line's open quantity at the order's site (O46), the default when Inventory keeps stock and the order names a site. false is Confirm without reserving, logged confirmed_without_reserving; a shortfall is otherwise refused with insufficient_available naming every short line."
                    type: boolean
                version:
                    format: int32
                    type: integer
            required:
                - version
                - expectedUpdatedAt
            type: object
        OrdersContact:
            additionalProperties: false
            description: "The chosen contact, snapshotted (O13)."
            properties:
                email:
                    maxLength: 254
                    nullable: true
                    type: string
                name:
                    maxLength: 255
                    nullable: true
                    type: string
                phone:
                    maxLength: 50
                    nullable: true
                    type: string
            type: object
        OrdersCountAmount:
            additionalProperties: false
            description: A count and a net amount, in the currency of the row that holds it.
            properties:
                amount:
                    format: double
                    type: number
                count:
                    format: int32
                    type: integer
            required:
                - count
                - amount
            type: object
        OrdersCurrencySum:
            additionalProperties: false
            description: A count and a sum in one currency.
            properties:
                amount:
                    format: double
                    type: number
                count:
                    format: int32
                    type: integer
                currency:
                    maxLength: 3
                    type: string
            required:
                - currency
                - count
                - amount
            type: object
        OrdersBacklog:
            additionalProperties: false
            description: "The backlog today (O35), per currency and net of VAT: what confirmed orders have ordered and not delivered (count is the orders), and what they have delivered and not invoiced, aged by the latest delivery marked on each line — 0–7, 8–30 and over 30 days, since bokføringsforskriften § 5-2-2 asks an invoice within a month."
            properties:
                asOf:
                    format: date
                    type: string
                deliveredNotInvoiced:
                    items:
                        $ref: "#/components/schemas/OrdersBacklogAged"
                    type: array
                orderedNotDelivered:
                    items:
                        $ref: "#/components/schemas/OrdersCurrencySum"
                    type: array
            required:
                - asOf
                - orderedNotDelivered
                - deliveredNotInvoiced
            type: object
        OrdersBacklogAged:
            additionalProperties: false
            description: "Delivered and not invoiced in one currency: the orders, the amount and the amount by age."
            properties:
                amount:
                    format: double
                    type: number
                count:
                    format: int32
                    type: integer
                currency:
                    maxLength: 3
                    type: string
                days0To7:
                    format: double
                    type: number
                days8To30:
                    format: double
                    type: number
                over30Days:
                    format: double
                    type: number
            required:
                - currency
                - count
                - amount
                - days0To7
                - days8To30
                - over30Days
            type: object
        OrdersCustomerSnapshot:
            additionalProperties: false
            description: "The customer as the document holds it (O13, O14): refreshed on every save of a draft, frozen once a quote is sent or an order confirmed, after which only the delivery address and the contact change."
            properties:
                contact:
                    $ref: "#/components/schemas/OrdersContact"
                contactId:
                    format: int32
                    nullable: true
                    type: integer
                country:
                    maxLength: 2
                    nullable: true
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerNumber:
                    format: int64
                    nullable: true
                    type: integer
                deliveryAddress:
                    $ref: "#/components/schemas/OrdersAddress"
                deliveryAddressId:
                    format: int32
                    nullable: true
                    type: integer
                foreignId:
                    maxLength: 60
                    nullable: true
                    type: string
                invoiceAddress:
                    $ref: "#/components/schemas/OrdersAddress"
                invoiceEmail:
                    description: "The customer's invoice e-mail as the billing profile resolves it, snapshotted with the rest; a send's default recipient when the document names no contact (O25)."
                    maxLength: 254
                    nullable: true
                    type: string
                name:
                    maxLength: 255
                    type: string
                organisationNumber:
                    maxLength: 9
                    nullable: true
                    type: string
                type:
                    enum:
                        - business
                        - person
                    nullable: true
                    type: string
            required:
                - customerId
                - name
                - invoiceAddress
                - deliveryAddress
                - contact
            type: object
        OrdersCustomerSummary:
            additionalProperties: false
            description: "What the customer page's Orders tab shows above its lists (O31a), per currency: open quotes (draft and sent), ordered and not delivered, delivered and not invoiced (from B; empty before)."
            properties:
                customerId:
                    format: int32
                    type: integer
                deliveredNotInvoiced:
                    items:
                        $ref: "#/components/schemas/OrdersCurrencySum"
                    type: array
                activeSubscriptions:
                    description: "The active and paused subscriptions, counted, and their value per year net of VAT (O42)."
                    items:
                        $ref: "#/components/schemas/OrdersCurrencySum"
                    type: array
                openQuotes:
                    items:
                        $ref: "#/components/schemas/OrdersCurrencySum"
                    type: array
                orderedNotDelivered:
                    items:
                        $ref: "#/components/schemas/OrdersCurrencySum"
                    type: array
            required:
                - customerId
                - openQuotes
                - orderedNotDelivered
                - deliveredNotInvoiced
                - activeSubscriptions
            type: object
        OrdersDeclineInput:
            additionalProperties: false
            description: "Decline a sent quote, with an optional reason."
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                reason:
                    maxLength: 500
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - revision
                - expectedUpdatedAt
            type: object
        OrdersDeliveredInput:
            additionalProperties: false
            description: "Register delivered, or undo (O32): per-line quantities; a line left out is not changed."
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersDeliveredLine"
                    maxItems: 500
                    minItems: 1
                    type: array
                version:
                    format: int32
                    type: integer
            required:
                - version
                - lines
                - expectedUpdatedAt
            type: object
        OrdersDeliveredLine:
            additionalProperties: false
            description: "One line's delivered quantity to add or take away."
            properties:
                lineId:
                    format: int64
                    type: integer
                quantity:
                    description: "Greater than 0, at most three decimals."
                    format: double
                    type: number
            required:
                - lineId
                - quantity
            type: object
        OrdersDelivery:
            additionalProperties: false
            description: "A delivery (leveranse, O47): what of an order leaves one site. A draft is edited, picked and posted or cancelled; a posted delivery is immutable. version is the draft's optimistic-concurrency token."
            properties:
                cancelledAt:
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    $ref: "#/components/schemas/OrdersPerson"
                customerId:
                    format: int32
                    type: integer
                customerName:
                    maxLength: 255
                    type: string
                deliveryAddress:
                    $ref: "#/components/schemas/OrdersAddress"
                id:
                    format: int64
                    type: integer
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersDeliveryLine"
                    type: array
                movementId:
                    description: "Inventory's issue movement, once posted."
                    format: int64
                    nullable: true
                    type: integer
                number:
                    format: int64
                    type: integer
                orderId:
                    format: int64
                    type: integer
                orderNumber:
                    format: int64
                    type: integer
                orderOnHold:
                    description: "Whether the order is on hold: a held order takes no delivery (order_on_hold)."
                    type: boolean
                packingSlipStored:
                    description: "Whether the posted delivery's packing slip is stored."
                    type: boolean
                postedAt:
                    format: date-time
                    nullable: true
                    type: string
                postedBy:
                    $ref: "#/components/schemas/OrdersPerson"
                siteId:
                    format: int64
                    type: integer
                status:
                    enum:
                        - draft
                        - posted
                        - cancelled
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - number
                - orderId
                - orderNumber
                - customerId
                - customerName
                - orderOnHold
                - siteId
                - status
                - packingSlipStored
                - lines
                - version
                - createdAt
                - updatedAt
            type: object
        OrdersDeliveryInput:
            additionalProperties: false
            description: "A new draft delivery of a confirmed order (O47): every open goods line is proposed — ordered less cancelled less delivered less what other draft deliveries hold — at what is available at the order's site, never more than is open."
            properties:
                orderId:
                    format: int64
                    type: integer
            required:
                - orderId
            type: object
        OrdersDeliveryLine:
            additionalProperties: false
            description: "A delivery's line: one order line, the quantity, and the location it is picked from (null until picked). open is what of the order line is still to deliver outside this delivery; locations, on a draft, are the site's locations holding the variant, by full code. A tracked variant's line (tracked) holds its quantity in lots instead, one row per lot and location (manufacturing phase 2 M75), and its fromLocationId stays null; lotChoices, on a draft, are the site's lots of the variant in FEFO order, for Change lot."
            properties:
                fromLocationCode:
                    maxLength: 100
                    nullable: true
                    type: string
                fromLocationId:
                    format: int64
                    nullable: true
                    type: integer
                id:
                    format: int64
                    type: integer
                locations:
                    items:
                        $ref: "#/components/schemas/OrdersStockLocation"
                    type: array
                lotChoices:
                    items:
                        $ref: "#/components/schemas/OrdersDeliveryLotChoice"
                    type: array
                lots:
                    items:
                        $ref: "#/components/schemas/OrdersDeliveryLineLot"
                    type: array
                name:
                    maxLength: 255
                    nullable: true
                    type: string
                open:
                    format: double
                    type: number
                orderLineId:
                    format: int64
                    type: integer
                ordered:
                    format: double
                    type: number
                position:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                short:
                    description: "What the lots do not cover of a tracked line's quantity, 0 when they cover it: the page marks the line Short by n, and the post refuses it (picks_mismatch) until the lots add up."
                    format: double
                    type: number
                sku:
                    maxLength: 100
                    nullable: true
                    type: string
                tracked:
                    description: "Whether the variant is tracked by lot or serial number: the line is picked by lot."
                    type: boolean
                unit:
                    maxLength: 20
                    type: string
                variantId:
                    format: int32
                    type: integer
            required:
                - id
                - position
                - orderLineId
                - variantId
                - unit
                - quantity
                - ordered
                - open
                - locations
                - tracked
                - lots
                - lotChoices
                - short
            type: object
        OrdersDeliveryLineLot:
            additionalProperties: false
            description: "One lot a tracked delivery line takes (manufacturing phase 2 M75): the lot and the location, with the lot's number, expiry and the location's code as they were when picked. chosen is whether a person chose it; proposed picks (FEFO) may be proposed again at the post when stock moved (M65a)."
            properties:
                allowExpired:
                    description: "The person chose this lot although it is expired; honoured only for a poster holding inventory:expired-override."
                    type: boolean
                chosen:
                    type: boolean
                expiry:
                    format: date
                    nullable: true
                    type: string
                locationCode:
                    maxLength: 100
                    type: string
                locationId:
                    format: int64
                    type: integer
                lotId:
                    format: int64
                    type: integer
                lotNumber:
                    maxLength: 20
                    type: string
                quantity:
                    format: double
                    type: number
            required:
                - lotId
                - lotNumber
                - expiry
                - locationId
                - locationCode
                - quantity
                - allowExpired
                - chosen
            type: object
        OrdersDeliveryLotChoice:
            additionalProperties: false
            description: "A lot of the variant at a location of the site, as Change lot offers it, in FEFO order (manufacturing phase 2 M65): its expiry and best-before, its status and what lies there."
            properties:
                bestBefore:
                    format: date
                    nullable: true
                    type: string
                expired:
                    description: "Whether the lot's expiry lies before today in the workspace's zone."
                    type: boolean
                expiry:
                    format: date
                    nullable: true
                    type: string
                fullCode:
                    maxLength: 100
                    type: string
                locationId:
                    format: int64
                    type: integer
                lotId:
                    format: int64
                    type: integer
                lotNumber:
                    maxLength: 20
                    type: string
                quantity:
                    format: double
                    type: number
                serial:
                    description: "Whether the lot is a serial number's: a pick of it takes exactly 1 (serial_quantity otherwise)."
                    type: boolean
                status:
                    enum:
                        - available
                        - quarantine
                        - blocked
                    type: string
                    x-enum-varnames:
                        - OrdersLotAvailable
                        - OrdersLotQuarantine
                        - OrdersLotBlocked
            required:
                - lotId
                - lotNumber
                - serial
                - expiry
                - bestBefore
                - locationId
                - fullCode
                - quantity
                - status
                - expired
            type: object
        OrdersDeliveryLineInput:
            additionalProperties: false
            description: "A draft delivery's line as the editor saves it. lots are a tracked line's picks as the person chose them (manufacturing phase 2 M77); left out, the line keeps its picks when a person chose them or while they still add up to its quantity, and is proposed again (FEFO) otherwise. proposeAgain proposes the line's lots again (FEFO) whatever they were, and is sent without lots."
            properties:
                fromLocationId:
                    format: int64
                    nullable: true
                    type: integer
                lots:
                    items:
