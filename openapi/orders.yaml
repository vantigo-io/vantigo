                    description: "Conflict — version_conflict, shipment_not_draft, carrier_account_archived, booking_in_progress, booking_outcome_unknown."
                "422":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/OrdersProblem"
                    description: "Unprocessable — carrier_refused, with the carrier's message."
                "503":
                    content:
