                - createdAt
                - updatedAt
            type: object
        OrdersSubscriptionInput:
            additionalProperties: false
            description: "A new draft subscription (O42). clientRequestId makes the create idempotent (O27)."
            properties:
                billing:
                    description: "in_advance bills a period when its first day is due, in_arrears when its last day is (O43)."
                    enum:
                        - in_advance
                        - in_arrears
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                finalPeriod:
                    $ref: "#/components/schemas/OrdersFinalPeriod"
                interval:
                    enum:
                        - monthly
                        - quarterly
                        - half_yearly
                        - yearly
                    type: string
                invoiceDay:
                    description: "The day of the month the invoice is made on, 1 to 28; null is the period's first day. Informational in this phase: printed, not used to judge what is due."
                    format: int32
                    maximum: 28
                    minimum: 1
                    nullable: true
                    type: integer
                noticeMonths:
                    description: The notice in months, 0 to 12; informational, printed.
                    format: int32
                    maximum: 12
                    minimum: 0
                    type: integer
                startDate:
                    format: date
                    type: string
                clientRequestId:
                    format: uuid
                    type: string
                closingText:
                    maxLength: 4000
                    type: string
                contactId:
                    format: int32
                    nullable: true
                    type: integer
                currency:
                    maxLength: 3
                    minLength: 3
                    type: string
                customerId:
                    format: int32
                    type: integer
                deliveryAddressId:
                    format: int32
                    nullable: true
                    type: integer
                discountVisible:
                    type: boolean
                internalNote:
                    maxLength: 4000
                    type: string
                introText:
                    maxLength: 4000
                    type: string
                language:
                    enum:
                        - nb
                        - en
                    type: string
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersLineInput"
                    maxItems: 500
                    type: array
                paymentTermsDays:
                    format: int32
                    maximum: 365
                    minimum: 0
                    type: integer
                pricesIncludeVat:
                    type: boolean
                projectId:
                    format: int32
                    nullable: true
                    type: integer
                salespersonId:
                    format: uuid
                    nullable: true
                    type: string
                yourReference:
                    maxLength: 100
                    type: string
            required:
                - clientRequestId
                - customerId
                - interval
                - billing
                - startDate
            type: object
        OrdersSubscriptionPage:
            additionalProperties: false
            description: One page of subscriptions and how many match.
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersSubscriptionSummary"
                    type: array
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        OrdersSubscriptionPeriod:
            additionalProperties: false
            description: "One billing period (O43): its first and last day, whether it is partial — a first period from a start that is not the first of a month, or a final period pro-rated to the end — what it bills net of VAT, and its state — invoiced (every line's period on an issued invoice), draft (on a draft invoice), skipped (by a pause), paused (after the pause), due (today, not yet on an invoice) or upcoming. invoiceNumbers are the invoices that billed it."
            properties:
                amount:
                    format: double
                    type: number
                end:
                    format: date
                    type: string
                invoiceNumbers:
                    items:
                        format: int64
                        type: integer
                    type: array
                partial:
                    type: boolean
                start:
                    format: date
                    type: string
                state:
                    enum:
                        - invoiced
                        - draft
                        - skipped
                        - paused
                        - due
                        - upcoming
                    type: string
            required:
                - start
                - end
                - partial
                - amount
                - state
                - invoiceNumbers
            type: object
        OrdersSubscriptionPlan:
            additionalProperties: false
            description: "A subscription's plan (O42), when a quote is accepted as a subscription."
            properties:
                billing:
                    description: "in_advance bills a period when its first day is due, in_arrears when its last day is (O43)."
                    enum:
                        - in_advance
                        - in_arrears
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                finalPeriod:
                    $ref: "#/components/schemas/OrdersFinalPeriod"
                interval:
                    enum:
                        - monthly
                        - quarterly
                        - half_yearly
                        - yearly
                    type: string
                invoiceDay:
                    description: "The day of the month the invoice is made on, 1 to 28; null is the period's first day. Informational in this phase: printed, not used to judge what is due."
                    format: int32
                    maximum: 28
                    minimum: 1
                    nullable: true
                    type: integer
                noticeMonths:
                    description: The notice in months, 0 to 12; informational, printed.
                    format: int32
                    maximum: 12
                    minimum: 0
                    type: integer
                startDate:
                    format: date
                    type: string
            required:
                - interval
                - billing
                - startDate
            type: object
        OrdersSubscriptionSummary:
            additionalProperties: false
            description: "A subscription in a list: net and gross are a full period's at the lines in force from its latest change on."
            properties:
                billedThrough:
                    format: date
                    nullable: true
                    type: string
                billing:
                    enum:
                        - in_advance
                        - in_arrears
                    type: string
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                gross:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                interval:
                    enum:
                        - monthly
                        - quarterly
                        - half_yearly
                        - yearly
                    type: string
                net:
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
                startDate:
                    format: date
                    type: string
                status:
                    enum:
                        - draft
                        - active
                        - paused
                        - ended
                        - cancelled
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - number
                - status
                - interval
                - billing
                - startDate
                - customerId
                - customerName
                - currency
                - net
                - gross
                - updatedAt
            type: object
        OrdersSubscriptionUpdate:
            additionalProperties: false
            description: "Save a subscription (O44). A draft takes everything. An active or paused one takes the header's texts, references, contact, noticeMonths and finalPeriod, and lines as they are to be from effectiveFrom on; its interval, billing, start and end are kept (end it with end). Lines named by id are kept when unchanged."
            properties:
                billing:
                    description: "in_advance bills a period when its first day is due, in_arrears when its last day is (O43)."
                    enum:
                        - in_advance
                        - in_arrears
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                finalPeriod:
                    $ref: "#/components/schemas/OrdersFinalPeriod"
                interval:
                    enum:
                        - monthly
                        - quarterly
                        - half_yearly
                        - yearly
                    type: string
                invoiceDay:
                    description: "The day of the month the invoice is made on, 1 to 28; null is the period's first day. Informational in this phase: printed, not used to judge what is due."
                    format: int32
                    maximum: 28
                    minimum: 1
                    nullable: true
                    type: integer
                noticeMonths:
                    description: The notice in months, 0 to 12; informational, printed.
                    format: int32
                    maximum: 12
                    minimum: 0
                    type: integer
                startDate:
                    format: date
                    type: string
                effectiveFrom:
                    description: "The period start a change of an active or paused subscription's lines takes effect from; absent is nextChangeFrom."
                    format: date
                    nullable: true
                    type: string
                expectedUpdatedAt:
                    description: "The updatedAt of the subscription as the client read it: the write is refused with version_conflict when it was written since (every write moves it)."
                    format: date-time
                    type: string
                closingText:
                    maxLength: 4000
                    type: string
                contactId:
                    format: int32
                    nullable: true
                    type: integer
                currency:
                    maxLength: 3
                    minLength: 3
                    type: string
                customerId:
                    format: int32
                    type: integer
                deliveryAddressId:
                    format: int32
                    nullable: true
                    type: integer
                discountVisible:
                    type: boolean
                internalNote:
                    maxLength: 4000
                    type: string
                introText:
                    maxLength: 4000
                    type: string
                language:
                    enum:
                        - nb
                        - en
                    type: string
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersLineInput"
                    maxItems: 500
                    type: array
                paymentTermsDays:
                    format: int32
                    maximum: 365
                    minimum: 0
                    type: integer
                pricesIncludeVat:
                    type: boolean
                projectId:
                    format: int32
                    nullable: true
                    type: integer
                salespersonId:
                    format: uuid
                    nullable: true
                    type: string
                yourReference:
                    maxLength: 100
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - version
                - expectedUpdatedAt
                - customerId
                - lines
            type: object
        OrdersTemplate:
            additionalProperties: false
            description: A quote template (O23).
            properties:
                archived:
                    type: boolean
                closingText:
                    maxLength: 4000
                    type: string
                discountVisible:
                    type: boolean
                id:
                    format: int64
                    type: integer
                introText:
                    maxLength: 4000
                    type: string
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersTemplateLine"
                    type: array
                name:
                    maxLength: 200
                    type: string
                revision:
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                validityDays:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - id
                - name
                - introText
                - closingText
                - discountVisible
                - archived
                - revision
                - lines
                - updatedAt
            type: object
        OrdersTemplateApplied:
            additionalProperties: false
            description: "The quote after a template was applied, and the template's lines skipped because their variant went away."
            properties:
                quote:
                    $ref: "#/components/schemas/OrdersQuote"
                skipped:
                    items:
                        $ref: "#/components/schemas/OrdersSkippedLine"
                    type: array
            required:
                - quote
                - skipped
            type: object
        OrdersTemplateInput:
            additionalProperties: false
            description: "A template's fields and lines. revision is required on an update."
            properties:
                archived:
                    type: boolean
                closingText:
                    maxLength: 4000
                    type: string
                discountVisible:
                    type: boolean
                introText:
                    maxLength: 4000
                    type: string
                lines:
                    items:
                        $ref: "#/components/schemas/OrdersTemplateLineInput"
                    maxItems: 500
                    type: array
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                revision:
                    format: int32
                    type: integer
                validityDays:
                    format: int32
                    maximum: 365
                    minimum: 1
                    nullable: true
                    type: integer
            required:
                - name
            type: object
        OrdersTemplateLine:
            additionalProperties: false
            description: "A template's line: a product line with its variant, quantity, optional flag and an optional price override; a section; or a note."
            properties:
                description:
                    maxLength: 2000
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: "An open set (O15): product, section and note in this phase."
                    enum:
                        - product
                        - section
                        - note
                    type: string
                name:
                    maxLength: 255
                    nullable: true
                    type: string
                optional:
                    type: boolean
                position:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    nullable: true
                    type: number
                sku:
                    maxLength: 64
                    nullable: true
                    type: string
                unitPrice:
                    description: "A price override; null takes the catalog's."
                    format: double
                    nullable: true
                    type: number
                variantId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - id
                - position
                - kind
                - description
                - optional
            type: object
        OrdersTemplateLineInput:
            additionalProperties: false
            description: A template line as saved; the lines are replaced whole.
            properties:
                description:
                    maxLength: 2000
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: "An open set (O15): product, section and note in this phase."
                    enum:
                        - product
                        - section
                        - note
                    type: string
                name:
                    maxLength: 255
                    type: string
                optional:
                    type: boolean
                quantity:
                    format: double
                    nullable: true
                    type: number
                unitPrice:
                    format: double
                    nullable: true
                    type: number
                variantId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - kind
            type: object
        OrdersTemplateList:
            additionalProperties: false
            description: "Every template, by name."
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersTemplateSummary"
                    type: array
            required:
                - items
            type: object
        OrdersTemplateSummary:
            additionalProperties: false
            description: A template in the list.
            properties:
                archived:
                    type: boolean
                id:
                    format: int64
                    type: integer
                lineCount:
                    format: int32
                    type: integer
                name:
                    maxLength: 200
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                validityDays:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - id
                - name
                - archived
                - lineCount
                - updatedAt
            type: object
        OrdersTotals:
            additionalProperties: false
            description: "The document's totals in its currency, leaving out a quote's optional lines (O17, O21)."
            properties:
                gross:
                    format: double
                    type: number
                net:
                    format: double
                    type: number
                vat:
                    format: double
                    type: number
                vatSummaries:
                    items:
                        $ref: "#/components/schemas/OrdersVatSummary"
                    type: array
            required:
                - net
                - vat
                - gross
                - vatSummaries
            type: object
        OrdersVariantGrid:
            additionalProperties: false
            description: "A product's variants for entry from a grid (O34). mode grid: options are the one or two options the variants differ by, each with its values in the order the variants list them, and cells are the variants, each with its values. mode list: the product has more than two options, an option with more than 30 values, or a variant without a value on an option, and variants lists them. price is the list price in the currency today, null when there is none."
            properties:
                cells:
                    items:
                        $ref: "#/components/schemas/OrdersGridVariant"
                    type: array
                currency:
                    maxLength: 3
                    type: string
                mode:
                    enum:
                        - grid
                        - list
                    type: string
                options:
                    items:
                        $ref: "#/components/schemas/OrdersGridOption"
                    type: array
                productId:
                    format: int32
                    type: integer
                productName:
                    type: string
                variants:
                    items:
                        $ref: "#/components/schemas/OrdersGridVariant"
                    type: array
            required:
                - productId
                - productName
                - currency
                - mode
                - options
                - cells
                - variants
            type: object
        OrdersVariant:
            additionalProperties: false
            description: "A catalog variant as a line takes it (O16): its snapshot, its list price in the asked currency today (null when it has none, which leaves the line unpriced) and the VAT code its tax category maps to (null when it maps to none)."
            properties:
                currency:
                    maxLength: 3
                    type: string
                description:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                packagings:
                    items:
                        $ref: "#/components/schemas/OrdersVariantPackaging"
                    type: array
                price:
                    description: The list price, net of VAT.
                    format: double
                    nullable: true
                    type: number
                productId:
                    format: int32
                    type: integer
                productType:
                    enum:
                        - Goods
                        - Service
                    type: string
                sku:
                    type: string
                unit:
                    type: string
                vatCode:
                    nullable: true
                    type: string
                vatCodeId:
                    format: int32
                    nullable: true
                    type: integer
                vatRatePercent:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - productId
                - sku
                - name
                - unit
                - productType
                - description
                - currency
                - packagings
            type: object
        OrdersVariantList:
            additionalProperties: false
            description: "Variants matching a search, by SKU."
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersVariant"
                    type: array
            required:
                - items
            type: object
        OrdersVariantPackaging:
            additionalProperties: false
            description: "A packaging a line may be entered in (O15)."
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                quantity:
                    description: "Its content in the variant's unit."
                    format: double
                    type: number
            required:
                - id
                - name
                - quantity
            type: object
        OrdersVatSummary:
            additionalProperties: false
            description: "VAT per (category, rate) on the sum of the nets (O17)."
            properties:
                category:
                    maxLength: 2
                    type: string
                ratePercent:
                    format: double
                    type: number
                taxableAmount:
                    format: double
                    type: number
                vatAmount:
                    format: double
                    type: number
            required:
                - category
                - ratePercent
                - taxableAmount
                - vatAmount
            type: object
        OrdersVersionInput:
            additionalProperties: false
            description: The version the client read.
            properties:
                expectedUpdatedAt:
                    description: "The updatedAt of the document as the client read it: the write is refused with version_conflict when the document was written since (every write moves it)."
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - version
                - expectedUpdatedAt
            type: object
        OrdersWarning:
            additionalProperties: false
            description: "A sales warning (O33) on a customer or a product: info is shown when it is put on a quote or an order, block also refuses send and confirm (blocked_by_warning) unless an orders:settings holder overrides it with a reason. name is the customer's or the product's name as it was when the warning was written."
            properties:
                id:
                    description: "The customer's or the product's id."
                    format: int32
                    type: integer
                level:
                    enum:
                        - info
                        - block
                    type: string
                name:
                    type: string
                orphaned:
                    description: "On the list only: true for a product warning whose product no longer exists in the catalog. It cannot be set again (404) but can be removed."
                    type: boolean
                scope:
                    enum:
                        - customer
                        - product
                    type: string
                text:
                    maxLength: 500
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                updatedBy:
                    allOf:
                        - $ref: "#/components/schemas/OrdersPerson"
                    nullable: true
            required:
                - scope
                - id
                - name
                - level
                - text
                - updatedAt
            type: object
        OrdersWarningInput:
            additionalProperties: false
            description: "A warning as it is set: its level and a text of 1–500 characters."
            properties:
                level:
                    enum:
                        - info
                        - block
                    type: string
                text:
                    maxLength: 500
                    minLength: 1
                    type: string
            required:
                - level
                - text
            type: object
        OrdersWarningList:
            additionalProperties: false
            description: "The warnings, customers' first, each by name."
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/OrdersWarning"
                    type: array
            required:
                - items
            type: object
info:
    title: Vantigo Orders API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/orders/analysis/backlog:
        get:
            description: "What confirmed orders have ordered and not delivered, and delivered and not invoiced, aged by the latest delivery marked (O35). Read from Orders' own tables."
            operationId: getOrdersBacklog
            parameters:
                - description: "json (the default) or csv: a semicolon-separated file, UTF-8 with a byte order mark, the decimal comma, guarded against formulas."
                  in: query
                  name: format
                  schema:
                      enum:
                          - json
                          - csv
                      type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrdersBacklog"
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: "OK — with format=csv, the table as a file served as an attachment, orders-backlog-<day>.csv."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Get the order backlog
            tags:
                - Orders
            x-vantigo-access: permission:orders:access+orders:analysis-view
    /api/v1/orders/analysis/hit-rate:
        get:
            description: "The quotes last sent in a period and how they were answered, counted and summed net per salesperson and currency (O35). Read from Orders' own tables."
            operationId: getOrdersHitRate
            parameters:
                - description: "The period's first day, in the business time zone."
                  in: query
                  name: from
                  required: true
                  schema:
                      format: date
                      type: string
                - description: "The period's last day, included."
                  in: query
                  name: to
                  required: true
                  schema:
                      format: date
                      type: string
                - description: "Only this salesperson's quotes."
                  in: query
                  name: salespersonId
                  schema:
                      format: uuid
                      type: string
                - description: "json (the default) or csv: a semicolon-separated file, UTF-8 with a byte order mark, the decimal comma, guarded against formulas."
                  in: query
                  name: format
                  schema:
                      enum:
                          - json
                          - csv
                      type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrdersHitRate"
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: "OK — with format=csv, the table as a file served as an attachment, orders-hit-rate-<from>-<to>.csv."
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/OrdersProblem"
                    description: "Bad Request — to before from, or a period longer than ten years."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
            summary: Get the quote hit rate
            tags:
                - Orders
            x-vantigo-access: permission:orders:access+orders:analysis-view
    /api/v1/orders/analysis/intake:
        get:
            description: "The net value of the orders confirmed in a period and not cancelled, by month, salesperson, customer, product or product category, per currency (O35). The category is read from the catalog for the period's variants."
            operationId: getOrdersIntake
            parameters:
                - description: "The period's first day, in the business time zone."
                  in: query
                  name: from
                  required: true
                  schema:
                      format: date
                      type: string
                - description: "The period's last day, included."
                  in: query
                  name: to
                  required: true
                  schema:
                      format: date
                      type: string
                - in: query
                  name: groupBy
                  schema:
                      enum:
                          - month
                          - salesperson
                          - customer
                          - product
                          - category
                      type: string
                - description: "json (the default) or csv: a semicolon-separated file, UTF-8 with a byte order mark, the decimal comma, guarded against formulas."
                  in: query
                  name: format
                  schema:
                      enum:
                          - json
                          - csv
                      type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/OrdersIntake"
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: "OK — with format=csv, the table as a file served as an attachment, orders-intake-<groupBy>-<from>-<to>.csv."
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/OrdersProblem"
                    description: "Bad Request — to before from, or a period longer than ten years."
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: "common.yaml#/components/schemas/AuthErrorResponse"
                    description: Forbidden
                "503":
