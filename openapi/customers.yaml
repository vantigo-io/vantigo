        PutCustomerGroupRequest:
            description: "PUT /customers/{id}/group's own request body (customer groups design D3): the customer is put into groupId, or taken out of every group when it is absent or null. The group must exist; an unknown id is a field error on groupId. revision is optional, as PUT /customers/{id}/owner's own is — omitted, the customer is read again whenever it changes under the request and the change then applies, with a 409 only for a customer that never settles; present and stale, a 409. Only this sub-resource sets a customer's group: POST /customers and PUT /customers/{id} do not take one."
            properties:
                groupId:
                    format: uuid
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the change applies whatever the revision is, the customer being read again whenever it changes under the request (a customer still changing after three reads answers 409); present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
            type: object
        PutCustomerOwnerRequest:
            description: "PUT /customers/{id}/owner's own request body (owner and tags design D1): the owner is set to ownerUserId, or cleared when it is absent or null. The user must exist and be active to be assigned. revision is optional, as PUT /customers/{id}/contact-info's own is."
            properties:
                ownerUserId:
                    format: uuid
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
            type: object
        PutCustomerTagsRequest:
            description: "PUT /customers/{id}/tags's own request body (owner and tags design D2): the customer's tag set is REPLACED by tagIds. There is no revision here and none is accepted — tags are off the customer row, so they bump nothing and two concurrent replaces are last-wins, which is what replacing a set means. Last-wins is a guarantee, not an accident: two replaces of one customer serialize through the customer row's own lock, so the later one's set is the set that stands. An empty array clears the customer's tags. An unknown id is a field error on tagIds."
            properties:
                tagIds:
                    items:
                        format: uuid
