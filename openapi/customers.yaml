                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    nullable: true
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
            required:
                - eventType
                - occurredOn
                - note
            type: object
        TimelineResponse:
            properties:
                actorDisplay:
                    nullable: true
                    type: string
                actorKind:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                currentRevision:
                    format: int32
                    type: integer
                eventType:
                    type: string
                followUp:
                    allOf:
                        - $ref: '#/components/schemas/TimelineFollowUp'
                    description: What happens next on this entry (follow-ups design D1). Absent when the entry carries none.
                    nullable: true
                id:
                    format: int32
                    type: integer
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - eventType
                - provenance
                - producer
                - occurredOn
                - currentRevision
                - state
                - actorKind
                - createdAt
                - updatedAt
            type: object
        TimelineRevisionListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineRevisionResponse'
                    type: array
            required:
                - data
            type: object
        TimelineRevisionResponse:
            properties:
                action:
                    type: string
                actorDisplayName:
                    type: string
                actorKind:
                    type: string
                changedAt:
                    format: date-time
                    type: string
                deletedAt:
                    format: date-time
                    nullable: true
                    type: string
                eventType:
                    type: string
                followUp:
                    allOf:
                        - $ref: '#/components/schemas/TimelineFollowUp'
                    description: The follow-up as it stood at this revision (follow-ups design D1) — a point-in-time snapshot like every other field here, so an entry whose follow-up was later moved or cleared still shows what it said then. Absent when the entry carried none at this revision.
                    nullable: true
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                revision:
                    format: int32
                    type: integer
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
            required:
                - revision
                - eventType
                - action
                - changedAt
                - provenance
                - producer
                - occurredOn
                - state
                - actorKind
                - actorDisplayName
            type: object
        UpdateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409. Only consulted when the request's identity differs from the one already on file.
                    nullable: true
                    type: boolean
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the update applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                status:
                    nullable: true
                    type: string
            required:
                - name
            type: object
info:
    title: Vantigo Customers API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/customers:
        get:
            operationId: getCustomers
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: sortBy
                  schema:
                    description: "'id', 'name', 'customerNumber', 'createdAt' or 'updatedAt'. Defaults to 'id'."
                    type: string
                - in: query
                  name: sortDirection
                  schema:
                    type: string
                - in: query
                  name: includeArchived
                  schema:
                    type: boolean
                - in: query
                  name: search
                  schema:
                    description: "Matches, case-insensitively, the name, customer number and, only for a caller who may see them, the legal name/id and any linked contact's name/email."
                    type: string
                - in: query
                  name: status
                  schema:
                    description: "'active', 'disabled' or 'archived', case-sensitive. Naming a status shows exactly that status, regardless of includeArchived."
                    type: string
                - in: query
                  name: type
                  schema:
                    description: "'business' or 'person', case-sensitive."
                    type: string
                - in: query
                  name: ownerId
                  schema:
                    description: "A user id, or the literal 'me' (the calling user) or 'none' (customers with no owner). Case-sensitive. 'me' is how the UI's My customers filter is expressed — the caller is resolved from the session, never sent."
                    type: string
                - in: query
                  name: tagId
                  schema:
                    description: "A tag id. A customer matches when it carries that tag. One tag only; multi-tag filtering is not built."
                    type: string
                - in: query
                  name: groupId
                  schema:
                    description: "A group id, or the literal 'none' (customers in no group). Case-sensitive. An id no group holds simply matches nothing."
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfSafeCustomerResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all customers
            tags:
                - Customers
            x-vantigo-access: permission:customers:view
        post:
            operationId: postCustomers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCustomerRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCustomerResponse'
                    description: Created
                    headers:
                        Location:
                            description: The path of the newly created customer, /api/v1/customers/{id}.
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — this server's validation problem (application/problem+json). The application/json branch, whose body carries code csrf_validation_failed, is pre-cutover .NET behaviour retained because the frozen exchange corpus (openapi/testdata/exchanges/customers.jsonl) still validates a recorded 400 of that shape against this contract; this server never emits it. An unsafe cookie-authenticated request whose Origin or Sec-Fetch-Site marks it cross-site is rejected with 403 application/problem+json instead. The check is on the request's origin; no antiforgery token is involved.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CustomerConflictProblem'
                    description: Conflict
            summary: Create a new customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:create
    /api/v1/customers/{id}:
        delete:
            operationId: deleteCustomersById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a customer (customers are never hard-deleted)
            tags:
                - Customers
            x-vantigo-access: permission:customers:delete
        get:
            operationId: getCustomer
            parameters:
                - in: path
                  name: id
                  required: true
