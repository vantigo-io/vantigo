        CustomerStatsAttentionItem:
            description: 'One thing the dashboard wants a human to look at. The shape is the dashboard''s, shared by every module''s /stats/attention. Four types, one per customer at most (a struck-off company reports only registryDeleted, its most useful single sentence), computed from the stored registry record against the current customer rather than from events, so the list needs no "dismiss" state: registryBankrupt when the record''s bankrupt flag is set; registryLiquidation when underLiquidation or underForcedLiquidation is set and the customer is not also bankrupt; registryDeleted when the record carries a deletion date, regardless of the other flags; registryRenamed when the record''s name differs (trimmed, case-sensitive) from the legal identity''s name and none of the other three apply. id is ''<type>/<customerId>''; title is the customer''s own name, not the registry''s; occurredAt is the day the thing itself happened — the registry''s bankruptcy, liquidation or deletion date — falling back to when the record was last fetched when the registry gives no date, and always the fetch time for registryRenamed, which has no date; entityId is the customer id. An item clears once the customer is archived, once a later refresh stores the flag as false (or, for registryDeleted, a 410 deletes the row entirely), once the customer''s identity is changed away from that company, or — for registryRenamed — once the legal identity''s name is updated to match the registry''s. Two further types come from follow-ups (follow-ups design D2) and are the first items here that depend on WHO is asking: followUpOverdue and followUpDue report open follow-ups on non-archived customers assigned to the caller or unassigned — an unassigned follow-up is everyone''s until somebody takes it — with dueOn before today (UTC) and dueOn equal to today respectively. For those two, id is ''<type>/<entryId>'', entityId is still the CUSTOMER id (the host links a customers item to /customers/{entityId}), title is still the customer''s name, and occurredAt is dueOn at midnight UTC — the day the thing is due, not the moment somebody wrote it down. Both clear when the follow-up is ticked done, reopened onto a later date, cleared, when its entry is deleted, or when the customer is archived. At most TWENTY follow-up items are reported: the twenty most overdue ones this caller may see, because the dashboard''s card is a short list rather than an inbox and GET /customers/follow-ups is where a whole backlog is read. The dashboard orders its card newest-first across modules, so among the twenty a follow-up due today shows above one ten days overdue. Those two are also the only items here that a caller may be shown none of while still being shown the others: this operation admits a caller on customers:view, a follow-up item names a timeline entry, and customers:timeline-view is what it takes to see one — so a caller without it is answered the registry items alone, exactly as the stats figures omit their identity-derived half. It is never a 403.'
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
