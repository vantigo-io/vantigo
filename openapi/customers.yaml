components:
    schemas:
        AttachCustomerContactRequest:
            properties:
                contactId:
                    format: int32
                    type: integer
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                roles:
                    description: The typed roles to give the contact (typed contact roles design D3). Omitted means none.
                    items:
                        $ref: '#/components/schemas/CustomerContactRoleRequest'
                    type: array
                title:
                    description: What this person is called at this customer — a job title, free text (typed contact roles design D1). At most 255 characters, trimmed. A request with neither a title nor at least one role is refused with a field error on title.
                    nullable: true
                    type: string
            required:
                - contactId
            type: object
        BrregLookupLookupResult:
            properties:
                legalId:
                    type: string
                legalName:
                    type: string
            required:
                - legalId
                - legalName
            type: object
        BrregLookupResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/BrregLookupLookupResult'
                    type: array
            required:
                - data
            type: object
        ContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - firstName
                - lastName
            type: object
        ContactResponse:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                id:
                    format: int32
                    type: integer
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - id
                - firstName
                - lastName
            type: object
        CreateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409.
                    nullable: true
                    type: boolean
                contactInfo:
                    allOf:
                        - $ref: '#/components/schemas/CustomerContactInfo'
                    description: When present, the customer is created with its own contact details already set (invoice-ready customer design D2) — the same validation PUT /customers/{id}/contact-info applies, nested under contactInfo.<field>.
                    nullable: true
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                status:
                    nullable: true
                    type: string
                type:
                    description: "'business' or 'person'. Defaults to 'business'. When an identity is supplied, its type must agree. Changed afterwards only through PUT /customers/{id}/type."
                    nullable: true
                    type: string
            required:
                - name
            type: object
        CustomerTypeRequest:
            properties:
                revision:
                    description: The revision the caller read the customer at. Optional (customers foundation design D5) — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                type:
                    description: "'business' or 'person', case-insensitive."
                    type: string
            required:
                - type
            type: object
        CreateCustomerResponse:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
            required:
                - id
                - customerNumber
            type: object
            x-vantigo-source: Vantigo.Customers
        CustomerAddress:
            description: One of a customer's typed addresses (invoice-ready customer design D3) — postal, invoice, delivery or visiting, any number of each, at most one primary per type. city/label/line2/postalCode/region are optional — unset, the response simply omits the key rather than sending it as null.
            properties:
                city:
                    nullable: true
                    type: string
                country:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int32
                    type: integer
                isPrimary:
                    type: boolean
                label:
                    nullable: true
                    type: string
                line1:
                    type: string
                line2:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                region:
                    nullable: true
                    type: string
                type:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - type
                - line1
                - country
                - isPrimary
                - createdAt
                - updatedAt
            type: object
        CustomerAddressRequest:
            description: "POST/PUT .../addresses(/{addressId})'s own request body (invoice-ready customer design D1, D3): a full replace of one address — every field present or null. isPrimary absent means false, which for a type's first (or otherwise-only-primary) address follows D3's own rules: the first address of a type is primary whatever the request says, and false on the address that is currently the only or primary one of its type is refused."
            properties:
                city:
                    nullable: true
                    type: string
                country:
                    type: string
                isPrimary:
                    nullable: true
                    type: boolean
                label:
                    nullable: true
                    type: string
                line1:
                    type: string
                line2:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                region:
                    nullable: true
                    type: string
                type:
                    type: string
            required:
                - type
                - line1
                - country
            type: object
        CustomerBillingGroupDefault:
            description: "What this customer's group would give it (customer groups design D4). Present whenever the customer belongs to a group, so a client can say \"inherits 30 days from Retail\" when the profile's own paymentTermsDays is absent, and \"group default 30 days, overridden\" when it is present. paymentTermsDays is absent when the group carries no default of its own — nothing to inherit, never a 0. The profile's own paymentTermsDays keeps meaning \"decided here\": the effective value is the profile's own, else this one, else nothing, which is the rule contracts.CustomerDirectory.BillingProfile already applies for every consumer."
            properties:
                group:
                    $ref: '#/components/schemas/CustomerGroupRef'
                paymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - group
            type: object
        CustomerBillingProfile:
            description: "A customer's billing profile (invoice-ready customer design D1, D4): payment terms, currency, document language, delivery methods and the identifiers used to send it invoices — every field optional, meaning \"not decided here, whoever invoices uses its own default\"; unset, a field is simply absent from the response rather than sent as null. warnings is computed at read time from the profile plus the customer's type, legal identity, contact email and addresses — never stored — in a fixed order: ehf_without_recipient, email_without_address, efaktura_for_business, no_invoice_address, ehf_recipient_not_registered, ehf_available (can-this-customer-receive-EHF design D4). peppolLookup is the last Peppol lookup on record (POST .../peppol-lookup), present only when it was made for the participant this profile would look up now — a stale answer (the org number or peppolId changed since) is omitted. groupDefault is the customer's group and the payment term that group would give it (customer groups design D4), computed at read time and absent for a customer in no group; the profile's own paymentTermsDays, when set, overrides it. defaultBillRate is the customer's default hourly bill rate (customers bill-rate design D1), quoted in this profile's own currency: the rate chain's customer step, which Time applies to this customer's projects that price their hours neither by a billing line nor by a default of their own. It is never set without a currency."
            properties:
                buyerReference:
                    nullable: true
                    type: string
                currency:
                    nullable: true
                    type: string
                defaultBillRate:
                    description: The customer's default hourly bill rate, in this profile's currency (customers bill-rate design D1). Greater than zero, at most two decimals; absent when the customer has none.
                    format: double
                    nullable: true
                    type: number
                gln:
                    nullable: true
                    type: string
                groupDefault:
                    allOf:
                        - $ref: '#/components/schemas/CustomerBillingGroupDefault'
                    description: The customer's group and the payment term it would give it (customer groups design D4). Absent when the customer belongs to no group.
                invoiceDelivery:
                    nullable: true
                    type: string
                invoiceEmail:
                    nullable: true
                    type: string
                language:
                    nullable: true
                    type: string
                paymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
                peppolId:
                    nullable: true
                    type: string
                peppolLookup:
                    $ref: '#/components/schemas/CustomerPeppolLookup'
                reminderDelivery:
                    nullable: true
                    type: string
                reminderEmail:
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - revision
                - warnings
            type: object
        CustomerAssignableUser:
            description: A user who may be made a customer's owner (owner and tags design D1) — the directory's active users, capped at 20. Enough to name them in a picker and nothing more, which is all contracts.UserDirectory publishes.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        CustomerConflictDuplicate:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - customerNumber
                - name
                - status
            type: object
        CustomerConflictProblem:
            description: ProblemDetails plus the customers module's own conflict detail (customers foundation design D5, D6). duplicates is populated only by the duplicate-legal-identity conflict, which also sets code; code alone (without duplicates) is also populated by the registry refresh's no_registry_identity and registry_identity_changed conflicts, the group vocabulary's group_exists and group_in_use, the tag vocabulary's tag_exists, and the merge's merge_self, merge_type_mismatch, merge_into_archived and merge_already_merged (customers merge design D2). A revision conflict carries neither.
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                duplicates:
                    items:
                        $ref: '#/components/schemas/CustomerConflictDuplicate'
                    nullable: true
                    type: array
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        CustomerContactInfo:
            description: A customer's own contact details (invoice-ready customer design D2) — what reaches the customer itself, not one of its contacts. Each field is optional; a blank value is stored as null, but the response never sends null back — a field with none is simply absent.
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                website:
                    nullable: true
                    type: string
            type: object
        CustomerContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                roles:
                    description: The complete set of typed roles the contact is to hold for this customer (typed contact roles design D3). Omitted leaves the roles unchanged; an empty array clears them. A role listed without a primary keeps the primary flag it already has, so replacing the set is not an accidental demotion.
                    items:
                        $ref: '#/components/schemas/CustomerContactRoleRequest'
                    type: array
                title:
                    description: What this person is called at this customer — a job title, free text (typed contact roles design D1). At most 255 characters, trimmed. A request that would leave the association with neither a title nor a role is refused with a field error on title.
                    nullable: true
                    type: string
            type: object
        CustomerContactResponse:
            properties:
                contact:
                    $ref: '#/components/schemas/ContactResponse'
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                roles:
                    description: Every typed role this contact holds for this customer, in the fixed order billing, project, decision_maker (typed contact roles design D3). Always present on responses from this version on — an empty array when the contact holds none — and optional here only because the recorded exchange corpus predates it.
                    items:
                        $ref: '#/components/schemas/CustomerContactRole'
                    type: array
                title:
                    description: What this person is called at this customer (typed contact roles design D1). Absent when the association has no title; the roles then say who the person is.
                    nullable: true
                    type: string
            required:
                - contact
            type: object
        CustomerContactRole:
            description: One typed role a contact holds for a customer (typed contact roles design D2). role is 'billing' (who gets the invoice and the reminder), 'project' (who is spoken to day to day) or 'decision_maker' (who approves). primary marks the one contact that holds the role for this customer — there is always exactly one while anyone holds the role at all.
            properties:
                primary:
                    type: boolean
                role:
                    type: string
            required:
                - role
                - primary
            type: object
        CustomerContactRoleRequest:
            description: "One typed role to give a contact for a customer (typed contact roles design D2, D3). primary is three-valued, and the three values mean different things: omitted on a role the contact ALREADY holds leaves its primary flag exactly as it is, so a request that replaces the role set without meaning to move anybody does not have to echo every flag back; omitted on a role the contact does NOT yet hold follows the first-holder rule (primary if nobody holds the role, otherwise not). true demotes whoever holds the role now. An explicit false on the contact that is the only or the primary holder is refused with a field error on roles — there is always a primary while anyone holds the role."
            properties:
                primary:
                    nullable: true
                    type: boolean
                role:
                    type: string
            required:
                - role
            type: object
        CustomerFollowUp:
            description: 'One row of the Follow-ups list (follow-ups design D3) — a manual timeline entry that carries a follow-up, with just enough of the entry and of its customer to show a line and link to it. note is the entry''s own note cut to its first 200 UTF-16 code units (the same unit the entry''s 500-character summary is cut in), absent when the entry has none. The customer is named here rather than fetched per row: the list is read across customers, so the one thing every row needs is whose follow-up it is.'
            properties:
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                entryId:
                    format: int32
                    type: integer
                eventType:
                    type: string
                followUp:
                    $ref: '#/components/schemas/TimelineFollowUp'
                note:
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
            required:
                - entryId
                - customerId
                - customerName
                - eventType
                - occurredOn
                - followUp
            type: object
        CustomerGroupRef:
            description: "The group a customer belongs to (customer groups design D3): its id and its name, and nothing else — a client that needs the group's default payment term reads it from GET /customers/groups or from the billing profile's own groupDefault, where it is already resolved against the customer."
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
        CustomerGroupRequest:
            description: "A customer group's name and default payment term (customer groups design D2). name is 1-100 characters, trimmed and NFC-normalised; a name another group already has, ignoring case, is a 409 with code group_exists. defaultPaymentTermsDays is 0-365 inclusive (the billing profile's own rule) and is the term every member inherits unless its own billing profile decides one. PUT is a FULL REPLACE of both fields: an omitted or null defaultPaymentTermsDays clears the group's default rather than leaving the one it had."
            properties:
                defaultPaymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
                name:
                    type: string
            required:
                - name
            type: object
        CustomerGroupSummary:
            description: "A group in the installation's vocabulary, with how many customers belong to it (customer groups design D2) — what the Manage groups modal needs in order to say why a delete is refused, on the same response that lists the groups. Every one of the vocabulary's three answering operations (list, create, update) answers this shape, so a client has one group type to hold."
            properties:
                customerCount:
                    format: int32
                    type: integer
                defaultPaymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
                - customerCount
            type: object
        CustomerImportError:
            description: One problem with one row of an import (customers import/export design D3). row is the 1-based data row — the first row under the header is 1, and a row whose every cell is blank is skipped and takes no number. column is the header of the offending cell for a field's error, as the file spells it, absent for a problem with the row as a whole. message is the module's own validation wording.
            properties:
                column:
                    type: string
                message:
                    type: string
                row:
                    format: int32
                    type: integer
            required:
                - message
                - row
            type: object
        CustomerImportResult:
            description: What an import did, or in a dry run would do (customers import/export design D3). rows counts the data rows read; created and updated the rows that succeeded (an update that changed nothing still counts); failed the rows that did not, each with at least one entry in errors, in row order.
            properties:
                created:
                    format: int32
                    type: integer
                dryRun:
                    type: boolean
                errors:
                    items:
                        $ref: '#/components/schemas/CustomerImportError'
                    type: array
                failed:
                    format: int32
                    type: integer
                rows:
                    format: int32
                    type: integer
                updated:
                    format: int32
                    type: integer
            required:
                - created
                - dryRun
                - errors
                - failed
                - rows
                - updated
            type: object
        CustomerMergeMove:
            description: "One kind of reference a merge moved to the surviving customer, and how many (customers merge design D3). This module's four kinds come first — customers.contacts (the absorbed customer's contact associations, a contact the survivor already had included), customers.addresses, customers.timelineEntries (its active entries) and customers.tags (its tags, one the survivor already carried included) — then each other module's, in the order the installation composes them: projects.projects, energy.supplyPeriods, communications.conversations, communications.conversationSuggestions and communications.conversationCandidates. A kind is listed with count 0 when there was nothing of it; a module that is not enabled lists nothing."
            properties:
                count:
                    format: int64
                    type: integer
                kind:
                    type: string
            required:
                - kind
                - count
            type: object
        CustomerMergeRequest:
            description: "POST /customers/{id}/merge's body (customers merge design D2): sourceId is the customer to absorb into the one in the path. revision is the path customer's, optional — omitted, the merge applies regardless; present and stale, a 409. The absorbed customer needs none: it is going away."
            properties:
                revision:
                    description: The revision the caller read the surviving customer at (customers foundation design D5).
                    format: int32
                    nullable: true
                    type: integer
                sourceId:
                    format: int32
                    type: integer
            required:
                - sourceId
            type: object
        CustomerMergeResult:
            description: "What a merge did (customers merge design D3): the surviving customer as GET /customers/{id} answers it, and every kind of reference that moved to it."
            properties:
                customer:
                    $ref: '#/components/schemas/SafeCustomerResponse'
                moved:
                    items:
                        $ref: '#/components/schemas/CustomerMergeMove'
                    type: array
            required:
                - customer
                - moved
            type: object
        CustomerOverviewAmount:
            description: One currency's amount on the customer overview. Nothing is ever converted, so money in two currencies is two entries and never a sum that is in neither.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - currency
                - amount
            type: object
        CustomerOverviewExpenses:
            description: "The customer's expenses that are ready to invoice (customer 360 design D2): approved, billable, priced and not yet invoiced — the expenses module's own definition — over the projects in the overview's projects section. Present only with the expenses module on and for projects:view-financials or projects:manage-all."
            properties:
                lastExpenseOn:
                    format: date
                    type: string
                readyAmounts:
                    description: What the ready lines bill, per currency, by ISO code; a currency with nothing ready is left out.
                    items:
                        $ref: '#/components/schemas/CustomerOverviewAmount'
                    type: array
                readyCount:
                    format: int32
                    type: integer
            required:
                - readyCount
                - readyAmounts
            type: object
        CustomerOverviewLastActivity:
            description: When anything last happened with this customer. Always present; each date is absent when it is unknown, or when the section it comes from is not in this response.
            properties:
                expenseOn:
                    format: date
                    type: string
                timelineOn:
                    description: The customer's own latest timeline date, as timelineSummary.latestOccurredOn reports it.
                    format: date
                    type: string
                workOn:
                    format: date
                    type: string
            type: object
        CustomerOverviewProject:
            description: One open project on the customer overview — enough to name it and link to it.
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
                lastWorkOn:
                    description: The date of the latest work logged on the project, when the time module is on and anything has been logged.
                    format: date
                    type: string
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - code
                - name
                - status
            type: object
        CustomerOverviewProjects:
            description: "The customer's projects the caller may see (customer 360 design D2): every one of them for projects:view-all or projects:manage-all, otherwise those the caller holds a role on. Every count is over that visible set."
            properties:
                open:
                    description: The open projects (status active), newest work first then by id, at most ten.
                    items:
                        $ref: '#/components/schemas/CustomerOverviewProject'
                    type: array
                openCount:
                    description: How many of the visible projects are open. Not cut at ten.
                    format: int32
                    type: integer
                totalCount:
                    format: int32
                    type: integer
                truncated:
                    description: True when the customer has at least as many projects as the project directory answers at once (2000); the counts are then over the caller's visible projects among the customer's oldest 2000. It describes the customer's own list, so for a caller who sees only the projects they hold a role on, a role project past the cut is missing without this saying so for their set.
                    type: boolean
            required:
                - openCount
                - totalCount
                - truncated
                - open
            type: object
        CustomerOverviewResponse:
            description: "What is going on with one customer across the modules that know (customer 360 design D1, D2). Every section but lastActivity may be absent, and absent means the module is off or the section is not for this caller — the response never says which, and never answers 403 for it."
            properties:
                expenses:
                    $ref: '#/components/schemas/CustomerOverviewExpenses'
                lastActivity:
                    $ref: '#/components/schemas/CustomerOverviewLastActivity'
                projects:
                    $ref: '#/components/schemas/CustomerOverviewProjects'
                work:
                    $ref: '#/components/schemas/CustomerOverviewWork'
            required:
                - lastActivity
            type: object
        CustomerOverviewWork:
            description: "The work logged on the projects in the projects section (customer 360 design D2), from the time module. Hours are hundredths of an hour (1.25 h is 125) and add up exactly. Present when the time module is on and projects is present."
            properties:
                approvedHoursHundredths:
                    description: Approved work, invoiced work included.
                    format: int64
                    type: integer
                draftHoursHundredths:
                    format: int64
                    type: integer
                lastWorkOn:
                    format: date
                    type: string
                submittedHoursHundredths:
                    format: int64
                    type: integer
                unbilledAmounts:
                    description: "What the unbilled work is worth at the rates it was logged at, per project currency, by ISO code; a currency with nothing unbilled is left out. Only priced billable work counts: billable work logged without a rate, or at a rate in another currency than the project's, counts in the hours and carries no amount (unpricedHoursHundredths says how much), and work on a project without a currency carries no amount at all. Only for projects:view-financials or projects:manage-all."
                    items:
                        $ref: '#/components/schemas/CustomerOverviewAmount'
                    type: array
                unbilledHoursHundredths:
                    description: Approved work that has not been invoiced yet, across the visible projects, billable or not — the time module's buckets are not split by billability, so an approved non-billable hour counts here although it will never be invoiced. unbilledAmounts counts only the priced billable part.
                    format: int64
                    type: integer
                unpricedHoursHundredths:
                    description: "Billable hours logged without a bill rate, or at a rate in another currency than the project's, summed over the visible projects — the actuals contract's unpriced hours. They cover draft, submitted and approved work alike, invoiced included; the approved ones not yet invoiced are inside unbilledHoursHundredths and absent from unbilledAmounts, which is short by exactly their worth. On a project without a currency every billable hour is unpriced. Hours, not money: present whenever work is."
                    format: int64
                    type: integer
            required:
                - unbilledHoursHundredths
                - approvedHoursHundredths
                - submittedHoursHundredths
                - draftHoursHundredths
            type: object
        CustomerOwner:
            description: The single user accountable for the customer relationship (owner and tags design D1). displayName is resolved from the user directory at read time, never stored on the customer; a user the directory no longer knows is reported as "Unknown user" with active false, and an owner disabled after being assigned keeps the customer and is reported with active false. Absent when the customer is unowned.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        CustomerPeppolLookup:
            description: "The last (or freshly checked, from POST /customers/{id}/peppol-lookup) answer the Peppol network gave about whether this customer can receive an EHF invoice (can-this-customer-receive-EHF design D3): status is 'registered', 'not_registered' or 'no_identifier' (no Peppol participant id could be derived and none is set, so nothing was looked up). participantId is present only when it is either an explicit peppolId or the caller holds customers:legal-identity-view (a derived id is that permission's to show); smpHost is always present when known. checkedAt is always present, even for no_identifier (the moment the check was made, nothing stored)."
            properties:
                canReceiveCreditNote:
                    type: boolean
                canReceiveInvoice:
                    type: boolean
                checkedAt:
                    format: date-time
