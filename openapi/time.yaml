components:
    schemas:
        PaginatedResponseOfTimeApprovalGroup:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimeApprovalGroup'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfTimeEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimeEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        TimeApprovalGroup:
            description: One person's submitted entries in one week that the caller may approve.
            properties:
                displayName:
                    description: The person's display name; 'Unknown user' when the directory no longer knows them.
                    type: string
                entries:
                    description: The entries, by date, then start time (entries without one last), then as created.
                    items:
                        $ref: '#/components/schemas/TimeEntryResponse'
                    type: array
                hours:
                    description: The entries' hours together.
                    format: double
                    type: number
                userId:
                    format: uuid
                    type: string
                weekStart:
                    description: The week's Monday.
                    format: date
                    type: string
            required:
                - userId
                - displayName
                - weekStart
                - hours
                - entries
            type: object
        TimeAssignableUser:
            description: One active user, named for a rate card's picker.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        TimeEntryApproveRequest:
            description: The entries to approve, each submitted, on a project the caller approves for (its manager, or time:approve), and not dated before the lock date unless the caller holds time:manage. All or nothing — one entry that may not be approved refuses the whole request and changes nothing.
            properties:
                ids:
                    items:
                        format: int64
                        type: integer
                    maxItems: 500
                    type: array
            required:
                - ids
            type: object
        TimeEntryApprover:
            description: The user who approved an entry, named for display. A user the directory no longer knows is named 'Unknown user'.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        TimeEntryBilling:
            description: The bill rate snapshotted on the entry (D3), present only when the caller may see it — the entry's owner, the project's managers, and callers with projects:view-financials or projects:manage-all (D8). Present with nothing in it when the entry resolved no bill rate.
            properties:
                billRate:
                    description: The hourly bill rate. Absent when the entry is not billable or no step of the rate chain resolved one.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: The bill rate's currency — the project's for a line or project rate, the person rate card's for a person rate.
                    nullable: true
                    type: string
            type: object
        TimeEntryCapabilities:
            description: What the calling user may do with this entry, so the frontend never re-derives the rules.
            properties:
                canApprove:
                    description: Whether the caller may approve or reject the entry — it is submitted, the caller manages its project or holds time:approve, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canEdit:
                    description: Whether the caller may change or delete the entry — they own it, it is a draft or rejected, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canSubmit:
                    description: Whether the caller may submit the entry — they own it, it is a draft, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canUnapprove:
                    description: Whether the caller may return the approved entry to draft — it is approved, the caller manages its project or holds time:approve or time:manage, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
            required:
                - canEdit
                - canSubmit
                - canApprove
                - canUnapprove
            type: object
        TimeEntryCost:
            description: The cost rate snapshotted on the entry, present only when the caller holds time:manage or time:view-all (D8). Present with nothing in it when the entry resolved no cost rate.
            properties:
                costRate:
                    description: The hourly cost rate. Absent when the person had no cost rate in effect on the entry date.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: The person rate card's currency.
                    nullable: true
                    type: string
            type: object
        TimeEntryRejectRequest:
            description: The entries to reject and why, under the rules an approval follows. All or nothing — one entry that may not be rejected refuses the whole request and changes nothing.
            properties:
                ids:
                    items:
                        format: int64
                        type: integer
                    maxItems: 500
                    type: array
                reason:
                    description: Why the entries are rejected, shown to their owner. Required; at most 1000 characters once trimmed.
                    type: string
            required:
                - ids
                - reason
            type: object
        TimeEntryRequest:
            description: A time entry as it should stand. hours is the truth; startTime and endTime are optional, given together or not at all, and when given hours must equal their difference to two decimals (D1).
            properties:
                billable:
                    description: Absent defaults from the project's billing type. Always false on a non-billable project, whatever is sent.
                    nullable: true
                    type: boolean
                billingLineId:
                    description: One of the project's active billing lines.
                    format: int32
                    nullable: true
                    type: integer
                endTime:
                    description: HH:MM on the entry date, after startTime. Required when startTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                entryDate:
                    description: The day worked. Not before the lock date, unless the caller holds time:manage.
                    format: date
                    type: string
                hours:
                    description: Greater than zero, at most 24, at most two decimals; the caller's entries on one day total at most 24.
                    format: double
                    type: number
                note:
                    description: At most 2000 characters once trimmed; a blank note is stored as none.
                    nullable: true
                    type: string
                projectId:
                    description: A project the caller may log time on — active, and the caller holds the member or manager role on it.
                    format: int32
                    type: integer
                startTime:
                    description: HH:MM on the entry date. Required when endTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                taskId:
                    description: A task on the project. Its title is snapshotted on the entry, so the entry stays readable after the task is deleted.
                    format: int32
                    nullable: true
                    type: integer
            required:
                - projectId
                - entryDate
                - hours
            type: object
        TimeEntryResponse:
            description: One time entry. The money on it is shaped per caller (D8) rather than refused — billing and cost are absent, not null, for a caller who may not see them.
            properties:
                approvedAt:
                    format: date-time
                    nullable: true
                    type: string
                approvedBy:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryApprover'
                    description: Absent until the entry is approved.
                billable:
                    type: boolean
                billing:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryBilling'
                    description: Absent — not null — when the caller may not see the entry's bill rate.
                billingLineCode:
                    nullable: true
                    type: string
                billingLineId:
                    format: int32
                    nullable: true
                    type: integer
                capabilities:
                    $ref: '#/components/schemas/TimeEntryCapabilities'
                cost:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryCost'
                    description: Absent — not null — when the caller may not see the entry's cost rate.
                createdAt:
                    format: date-time
                    type: string
                endTime:
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                entryDate:
                    format: date
                    type: string
                hours:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                invoicedAt:
                    format: date-time
                    nullable: true
                    type: string
                note:
                    nullable: true
                    type: string
                projectCode:
                    type: string
                projectId:
                    format: int32
                    type: integer
                projectName:
                    type: string
                rateSource:
                    description: "The step of the rate chain the bill rate came from: 'line', 'project', 'person' or 'none'."
                    type: string
                rejectionReason:
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                startTime:
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                status:
                    description: "'draft', 'submitted', 'approved', 'rejected' or 'invoiced'."
                    type: string
                submittedAt:
                    format: date-time
                    nullable: true
                    type: string
                taskId:
                    format: int32
                    nullable: true
                    type: integer
                taskTitle:
                    description: The task's title as it stood when the entry was saved.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the billing line's joined with a hyphen ('KVEM1000-PM'). Absent when the entry has no billing line.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                userDisplayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - id
                - userId
                - userDisplayName
                - projectId
                - projectCode
                - projectName
                - entryDate
                - hours
                - billable
                - rateSource
                - status
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        TimeEntrySubmitRequest:
            description: The entries to submit, each the caller's own draft. All or nothing — one entry that may not be submitted refuses the whole request and changes nothing.
            properties:
                ids:
                    items:
                        format: int64
                        type: integer
                    maxItems: 500
                    type: array
            required:
                - ids
            type: object
        TimeEntryUnapproveRequest:
            description: The approved entries to return to draft, each on a project the caller approves for (its manager, or time:approve) — or any, for time:manage. An invoiced entry never returns. All or nothing — one entry that may not be unapproved refuses the whole request and changes nothing.
            properties:
                ids:
                    items:
                        format: int64
                        type: integer
                    maxItems: 500
                    type: array
            required:
                - ids
            type: object
        TimeEntryUpdateRequest:
            description: Every field of the entry as it should stand after the update — a full replace — carrying the revision it was read at. A revision that has moved on answers 409. The rates are resolved again (D3), and a rejected entry returns to draft with its rejection reason cleared.
            properties:
                billable:
                    description: Absent defaults from the project's billing type. Always false on a non-billable project, whatever is sent.
                    nullable: true
                    type: boolean
                billingLineId:
                    description: One of the project's active billing lines.
                    format: int32
                    nullable: true
                    type: integer
                endTime:
                    description: HH:MM on the entry date, after startTime. Required when startTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                entryDate:
                    description: The day worked. Not before the lock date, unless the caller holds time:manage.
                    format: date
                    type: string
                hours:
                    description: Greater than zero, at most 24, at most two decimals; the caller's entries on one day total at most 24.
                    format: double
                    type: number
                note:
                    description: At most 2000 characters once trimmed; a blank note is stored as none.
                    nullable: true
                    type: string
                projectId:
                    description: A project the caller may log time on — active, and the caller holds the member or manager role on it.
                    format: int32
                    type: integer
                revision:
                    description: The revision the caller read the entry at. Revisions start at 1; an absent or smaller one is refused on revision.
                    format: int32
                    minimum: 1
                    type: integer
                startTime:
                    description: HH:MM on the entry date. Required when endTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                taskId:
                    description: A task on the project. Its title is snapshotted on the entry, so the entry stays readable after the task is deleted.
                    format: int32
                    nullable: true
                    type: integer
            required:
                - projectId
                - entryDate
                - hours
                - revision
            type: object
        TimePersonOverview:
            description: One person's recent weeks, for the people overview.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
                weeks:
                    description: One per week of the window, oldest first.
                    items:
                        $ref: '#/components/schemas/TimePersonWeek'
                    type: array
            required:
                - userId
                - displayName
                - weeks
            type: object
        TimePersonWeek:
            description: One person's week, whatever the entries' statuses.
            properties:
                approvedHours:
                    description: The hours approved — invoiced ones included, since they were approved before they were invoiced.
                    format: double
                    type: number
                hours:
                    description: Every entry's hours, whatever its status.
                    format: double
                    type: number
                rejectedCount:
                    description: How many of the week's entries stand rejected.
                    format: int32
                    type: integer
                submittedAt:
                    description: When the person last submitted the week as a whole. Absent when they never have.
                    format: date-time
                    nullable: true
                    type: string
                weekStart:
                    description: The week's Monday.
                    format: date
                    type: string
            required:
                - weekStart
                - hours
                - approvedHours
                - rejectedCount
            type: object
        TimeProjectBilling:
            description: The money in a project's time (D8), present only for callers who may see the project's financials — its managers, callers with projects:manage-all, and callers with projects:view-financials on a project they can otherwise see (a role on it, projects:view-all, or projects:manage-all). A time permission alone never adds it, even one that lets the caller read every entry's hours on this project.
            properties:
                amount:
                    description: The submitted, approved and invoiced billable hours at the bill rate each entry snapshotted, summed in the currency. Drafts are not counted until they are submitted, rejected entries never.
                    format: double
                    type: number
                currency:
                    description: The project's currency. Absent when the project has none and its priced entries do not share one currency either.
                    nullable: true
                    type: string
                unpricedHours:
                    description: The submitted, approved and invoiced billable hours that are not in amount — no step of the rate chain resolved a bill rate for them, or they are priced in another currency.
                    format: double
                    type: number
            required:
                - amount
                - unpricedHours
            type: object
        TimeProjectHours:
            description: A project's logged hours. total, byLine and byPerson count every entry but rejected ones — the hours that stand, drafts included; byStatus lists every status, rejected included.
            properties:
                byLine:
                    description: The hours per billing line, in the order of the lines' codes, then the hours on no line last (the one element without billingLineId).
                    items:
                        $ref: '#/components/schemas/TimeProjectLineHours'
                    type: array
                byPerson:
                    description: The hours per person, by display name. Every caller who sees the summary sees everyone's hours here — an aggregate, not their entries.
                    items:
                        $ref: '#/components/schemas/TimeProjectPersonHours'
                    type: array
                byStatus:
                    $ref: '#/components/schemas/TimeProjectHoursByStatus'
                total:
                    format: double
                    type: number
            required:
                - total
                - byStatus
                - byLine
                - byPerson
            type: object
        TimeProjectHoursByStatus:
            description: A project's hours in each status; a status with nothing in it answers 0.
            properties:
                approved:
                    format: double
                    type: number
                draft:
                    format: double
                    type: number
                invoiced:
                    format: double
                    type: number
                rejected:
                    format: double
                    type: number
                submitted:
                    format: double
                    type: number
            required:
                - draft
                - submitted
                - approved
                - rejected
                - invoiced
            type: object
        TimeProjectLineHours:
            description: The hours logged on one billing line of the project, or on none.
            properties:
                billingLineCode:
                    description: The line's code; absent for the hours on no line, and for a line the project directory no longer lists.
                    nullable: true
                    type: string
                billingLineId:
                    description: Absent for the hours logged on no line.
                    format: int32
                    nullable: true
                    type: integer
                hours:
                    format: double
                    type: number
                trackableCode:
                    description: The project's code and the line's, joined with a hyphen ('KVEM1000-PM'); absent whenever billingLineCode is.
                    nullable: true
                    type: string
            required:
                - hours
            type: object
        TimeProjectPersonHours:
            description: The hours one person logged on the project.
            properties:
                displayName:
                    description: The person's display name; 'Unknown user' when the directory no longer knows them.
                    type: string
                hours:
                    format: double
                    type: number
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - hours
            type: object
        TimeProjectSummaryResponse:
            description: A project's time at a glance, for the time panel on the project page.
            properties:
                billing:
                    $ref: '#/components/schemas/TimeProjectBilling'
                hours:
                    $ref: '#/components/schemas/TimeProjectHours'
                projectId:
                    format: int32
                    type: integer
            required:
                - projectId
                - hours
            type: object
        TimeRateRequest:
            description: A person rate card row (§4.3). At least one of billRate and costRate; the row is in effect from validFrom until the person's next row.
            properties:
                billRate:
                    description: The hourly bill rate, greater than zero. Used for an entry only when no billing line or project default prices it and the card's currency is the project's.
                    format: double
                    nullable: true
                    type: number
                costRate:
                    description: The hourly cost rate, greater than zero.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: A three-letter ISO 4217 code; upper-cased.
                    type: string
                userId:
                    description: The person. They must be known to the user directory; a disabled account's rates stay editable.
                    format: uuid
                    type: string
                validFrom:
                    description: The first day the row is in effect. One row per person and day.
                    format: date
                    type: string
            required:
                - userId
                - validFrom
                - currency
            type: object
        TimeRateResponse:
            description: A person rate card row.
            properties:
                billRate:
                    format: double
                    nullable: true
                    type: number
                costRate:
                    format: double
                    nullable: true
                    type: number
                currency:
                    type: string
                displayName:
                    description: The person's display name; 'Unknown user' when the directory no longer knows them.
                    type: string
                id:
                    format: int32
                    type: integer
                userId:
                    format: uuid
                    type: string
                validFrom:
                    format: date
                    type: string
            required:
                - id
                - userId
                - displayName
                - validFrom
                - currency
            type: object
        TimeRateUpdateRequest:
            description: A person rate card row as it should stand — a full replace. The person stays the row's own.
            properties:
                billRate:
                    description: The hourly bill rate, greater than zero.
                    format: double
                    nullable: true
                    type: number
                costRate:
                    description: The hourly cost rate, greater than zero.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: A three-letter ISO 4217 code; upper-cased.
                    type: string
                validFrom:
                    description: The first day the row is in effect. One row per person and day.
                    format: date
                    type: string
            required:
                - validFrom
                - currency
            type: object
        TimeSettingsRequest:
            description: The time settings as they should stand — a full replace.
            properties:
                lockedBefore:
                    description: The period lock (D9). Entries dated before it cannot be created, edited, submitted, approved or rejected by anyone but time:manage. Null or absent removes the lock.
                    format: date
                    nullable: true
                    type: string
            type: object
        TimeSettingsResponse:
            description: The installation's time settings.
            properties:
                lockedBefore:
                    description: The period lock (D9); absent when there is none.
                    format: date
                    nullable: true
                    type: string
            type: object
        TimeStatsAttentionItem:
            description: 'One thing the dashboard wants a human to look at. The shape is the dashboard''s, shared by every module''s /stats/attention. type ''weekUnsubmitted'': one of the caller''s own past weeks (before the current one) with draft entries in it; id and entityId are the week''s Monday (YYYY-MM-DD), for a link to that week in the time app, and occurredAt is the Monday after it, when the week ended. type ''approvalWaiting'': one person''s entries in one week that the caller may approve and that have waited more than seven days; id and entityId are ''<user id>/<Monday as YYYY-MM-DD>'', the approval queue''s group, and occurredAt is when the oldest of them was submitted.'
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        TimeStatsDailyBucket:
            description: One calendar day of entry dates in a time series. Days with nothing in them are absent, not zero — the dashboard's sparkline plots the points it is given.
            properties:
                date:
                    format: date
                    type: string
                value:
                    description: Hours.
                    format: double
                    type: number
            type: object
        TimeStatsSummaryResponse:
            description: The dashboard's time card, in the envelope every module's /stats/summary shares. Both figures are a state now rather than a count over the period, which only moves awaitingMyApprovalDelta.
            properties:
                awaitingMyApproval:
                    description: How many submitted entries the caller may approve — the approval queue's scope, counted in entries; 0 for a caller who approves nothing.
                    format: int32
                    type: integer
                awaitingMyApprovalDelta:
                    description: awaitingMyApproval against how many of the same entries were waiting when the period began — reconstructed from the entries' submission, approval and rejection times, so an entry since unapproved or edited back to draft no longer counts in it.
                    format: int32
                    type: integer
                from:
                    format: date-time
                    type: string
                hoursThisWeek:
                    description: The caller's own hours dated in the current week (Monday to Sunday, dates in UTC), whatever their status apart from rejected.
                    format: double
                    type: number
                hoursThisWeekDelta:
                    description: hoursThisWeek against the same hours of the week before.
                    format: double
                    type: number
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - hoursThisWeek
                - hoursThisWeekDelta
                - awaitingMyApproval
                - awaitingMyApprovalDelta
            type: object
        TimeWeekDay:
            description: One day of a week row.
            properties:
                date:
                    format: date
                    type: string
                entries:
                    description: The row's entries on the day, in start time order (entries without one last), then in the order they were created.
                    items:
                        $ref: '#/components/schemas/TimeEntryResponse'
                    type: array
            required:
                - date
                - entries
            type: object
        TimeWeekResponse:
            description: The caller's own week, Monday to Sunday, as timesheet rows.
            properties:
                hasUnsubmittedChanges:
                    description: True when the week has been submitted and holds a draft entry — one added or edited back to draft since.
                    type: boolean
                rows:
                    description: One row per project, billing line and task the caller logged time on in the week, ordered by project code, then line code (no line first), then task title (no task first).
                    items:
                        $ref: '#/components/schemas/TimeWeekRow'
                    type: array
                submittedAt:
                    description: When the week was last submitted as a whole. Absent when it never has been; submitting single entries does not submit the week.
                    format: date-time
                    nullable: true
                    type: string
                totals:
                    $ref: '#/components/schemas/TimeWeekTotals'
                weekStart:
                    description: The week's Monday.
                    format: date
                    type: string
            required:
                - weekStart
                - hasUnsubmittedChanges
                - rows
                - totals
            type: object
        TimeWeekRow:
            description: A project, billing line and task the caller logged time on in the week, with the week's seven days.
            properties:
                billingLineCode:
                    nullable: true
                    type: string
                billingLineId:
                    format: int32
                    nullable: true
                    type: integer
                days:
                    description: Seven days, Monday to Sunday.
                    items:
                        $ref: '#/components/schemas/TimeWeekDay'
                    type: array
                projectCode:
                    type: string
                projectId:
                    format: int32
                    type: integer
                projectName:
                    type: string
                taskId:
                    format: int32
                    nullable: true
                    type: integer
                taskTitle:
                    description: The task's title as the row's latest entry snapshotted it.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the billing line's joined with a hyphen ('KVEM1000-PM'). Absent when the row has no billing line.
                    nullable: true
                    type: string
            required:
                - projectId
                - projectCode
                - projectName
                - days
            type: object
        TimeWeekTotals:
            description: The week's hours, whatever the entries' statuses.
            properties:
                perDay:
                    description: Seven totals, Monday to Sunday.
                    items:
                        format: double
                        type: number
                    type: array
                week:
                    format: double
                    type: number
            required:
                - perDay
                - week
            type: object
info:
    title: Vantigo Time API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/time/approvals:
        get:
            description: The approval queue — the submitted entries the caller may approve (on the projects they manage, or on every project for time:approve; not those dated before the lock date unless the caller holds time:manage), grouped by person and week, the oldest week first and then by display name. Paged by group.
            operationId: getTimeApprovals
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfTimeApprovalGroup'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller holds neither time:approve nor the manager role on any project.
            summary: Get the approval queue
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries:
        get:
            description: Time entries, newest first — one person's (the caller's own unless userId names someone else), or, with projectId and no userId, every entry on that project the caller may see. Entries are listed only where the caller may see them (the same rule a single read applies), so the list never holds an entry its own read would answer 404 for.
            operationId: getTimeEntries
            parameters:
                - description: Whose entries. Absent means the caller's own — unless projectId is given, and then everyone's on that project that the caller may see. Another person's needs time:view-all, time:approve or time:manage, or the manager role on at least one project (then only the entries on the projects the caller manages are listed) — otherwise 403.
                  in: query
                  name: userId
                  schema:
                    format: uuid
                    type: string
                - description: A Monday; narrows the list to that week, Monday to Sunday.
                  in: query
                  name: weekStart
                  schema:
                    format: date
                    type: string
                - description: Narrows the list to one project. Without userId, the list is every entry on it the caller may see — everyone's for its managers and for time:view-all, time:approve and time:manage, the caller's own for anyone else. With someone else's userId, the caller must manage this project or hold time:view-all, time:approve or time:manage — otherwise 403.
                  in: query
                  name: projectId
                  schema:
                    format: int32
                    type: integer
                - description: "'draft', 'submitted', 'approved', 'rejected' or 'invoiced'."
                  in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfTimeEntryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, a weekStart that is not a Monday, or an unknown status.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — userId names someone whose entries the caller may not see.
            summary: List time entries
            tags:
                - Time
            x-vantigo-access: permission:time:access
        post:
            operationId: postTimeEntries
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeEntryResponse'
                    description: Created — a draft entry owned by the caller, with its rates resolved and snapshotted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Log time
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/approve:
        post:
            description: Approves submitted entries (D2), recording the approver and the time. Each must be submitted, on a project the caller approves for (its manager, or time:approve), and not dated before the lock date unless the caller holds time:manage.
            operationId: postTimeEntriesApprove
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryApproveRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TimeEntryResponse'
                                type: array
                    description: OK — the approved entries, in the order their ids were given.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — no ids, or at least one entry that may not be approved; the errors on ids name each offending id (an entry the caller may not see reads as not found), and nothing was approved.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller approves for no project at all — they hold neither time:approve nor the manager role on any project.
            summary: Approve time entries
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/reject:
        post:
            description: Rejects submitted entries with a reason their owner sees, under the rules an approval follows. A rejected entry is its owner's to edit again, which returns it to draft.
            operationId: postTimeEntriesReject
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryRejectRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TimeEntryResponse'
                                type: array
                    description: OK — the rejected entries, in the order their ids were given.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — no ids, no reason or one too long, or at least one entry that may not be rejected; the errors on ids name each offending id, and nothing was rejected.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller approves for no project at all — they hold neither time:approve nor the manager role on any project.
            summary: Reject time entries
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/submit:
        post:
            description: Submits single entries (D2). Each must be the caller's own draft, not dated before the lock date unless the caller holds time:manage. The rates snapshotted on them are frozen from here on (D3).
            operationId: postTimeEntriesSubmit
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntrySubmitRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TimeEntryResponse'
                                type: array
                    description: OK — the submitted entries, in the order their ids were given.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — no ids, or at least one entry that may not be submitted; the errors on ids name each offending id, and nothing was submitted.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Submit time entries
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/unapprove:
        post:
            description: Returns approved entries to draft, clearing the approval and the submission, so their owner sees them as fresh drafts. Each must be approved — never invoiced — and on a project the caller approves for, or the caller holds time:manage; an entry dated before the lock date only for time:manage.
            operationId: postTimeEntriesUnapprove
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryUnapproveRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TimeEntryResponse'
                                type: array
                    description: OK — the entries, now drafts, in the order their ids were given.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — no ids, or at least one entry that may not be unapproved; the errors on ids name each offending id, and nothing changed.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller approves for no project at all — they hold neither time:approve nor the manager role on any project, nor time:manage.
            summary: Unapprove time entries
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/{id}:
        delete:
            operationId: deleteTimeEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content — the entry is gone.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the entry but may not delete it, because it is not theirs, it is past draft or rejected, or it is dated before the lock date.
                "404":
                    description: Not Found — the entry does not exist, or the caller may not see it.
            summary: Delete a time entry
            tags:
                - Time
            x-vantigo-access: permission:time:access
        get:
            operationId: getTimeEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeEntryResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the entry does not exist, or the caller may not see it. Its owner sees it; so does a manager of its project and anyone holding time:view-all, time:approve or time:manage.
            summary: Get a time entry by id
            tags:
                - Time
            x-vantigo-access: permission:time:access
        put:
            operationId: putTimeEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeEntryResponse'
                    description: OK — the entry as it now stands, a draft, with its rates resolved again.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the entry but may not change it, because it is not theirs, it is past draft or rejected, or it is dated before the lock date.
                "404":
                    description: Not Found — the entry does not exist, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the entry has moved on from the revision the caller read.
            summary: Update a time entry
            tags:
                - Time
            x-vantigo-access: permission:time:access
