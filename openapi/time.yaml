    /api/v1/time/stats/timeseries:
        get:
            description: The caller's own hours per entry date inside the period, rejected ones left out — every entry for metric 'hours', billable ones only for 'billableHours'.
            operationId: getTimeStatsTimeseries
            parameters:
                - in: query
                  name: metric
                  schema:
                    type: string
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TimeStatsDailyBucket'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get time dashboard time series
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/weeks/{weekStart}:
        get:
            description: The caller's own week as timesheet rows (project, billing line, task), with the week's submission state.
            operationId: getTimeWeeksByWeekStart
            parameters:
                - description: The week's Monday.
                  in: path
                  name: weekStart
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeWeekResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — weekStart is not a Monday.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get my week
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/weeks/{weekStart}/submit:
        post:
            description: Submits the caller's week (D2) — every one of their draft entries in it — and records the week as submitted. A week with no drafts submits as empty ("nothing to report"). Draft entries dated before the lock date refuse the whole submit unless the caller holds time:manage.
            operationId: postTimeWeeksByWeekStartSubmit
            parameters:
                - description: The week's Monday.
                  in: path
                  name: weekStart
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeWeekResponse'
                    description: OK — the week as it now stands.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — weekStart is not a Monday, or the week holds draft entries dated before the lock date; nothing was submitted.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Submit my week
            tags:
                - Time
            x-vantigo-access: permission:time:access
