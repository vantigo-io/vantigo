                    type: integer
                selfCertAfterMonths:
                    description: 0 to 2. Left out, it keeps its value.
                    format: int32
                    type: integer
                selfCertDaysPerOccurrence:
                    description: 3 (the statutory minimum, ftrl. § 8-23) to 16. Read under custom only — a preset writes its own; left out, it keeps its value.
                    format: int32
