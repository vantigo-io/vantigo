                    $ref: '#/components/schemas/StaffTemporaryGround'
                title:
                    description: Absent when not set.
                    type: string
                validFrom:
                    description: The day the row takes effect.
                    format: date
                    type: string
                validTo:
                    description: 'The last day the row is in force: the day before the next row''s validFrom. Absent on the latest row.'
                    format: date
                    type: string
                workingHoursScheme:
                    $ref: '#/components/schemas/StaffWorkingHoursScheme'
                workingTimeText:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employmentId
                - validFrom
                - employmentType
                - ftePercent
                - revision
            type: object
        StaffTermsRequest:
            description: A terms row (design §3.3, S5). On POST /employments/{id}/terms a field left out takes the previous row's value and one sent as null is cleared; on an employment's first row and on PUT /terms/{id} a field left out is empty.
            properties:
                appointmentForm:
                    allOf:
                        - $ref: '#/components/schemas/StaffAppointmentForm'
                    description: Must agree with employmentType. Left out on the first row — or when the previous row's does not agree with this row's type — it is the type's own (fast or midlertidig).
                    nullable: true
                breakMinutes:
                    description: § 14-6 k. 0 to 1440.
                    format: int32
                    nullable: true
                    type: integer
                competenceDevelopmentText:
                    description: § 14-6 p. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                correction:
                    description: 'PUT /terms/{id} only: true replaces a row that is not the latest, as HR''s correction of a past row.'
                    type: boolean
                costCentre:
                    description: Up to 40 characters.
                    maxLength: 40
                    nullable: true
                    type: string
                departmentId:
                    description: An existing department; archived only when the previous row (or, on a change, the row) already names it.
                    format: int64
                    nullable: true
                    type: integer
                division:
                    description: Up to 100 characters.
                    maxLength: 100
                    nullable: true
                    type: string
                employeeType:
                    allOf:
                        - $ref: '#/components/schemas/StaffEmployeeType'
                    description: For an identity provider.
                    nullable: true
                employmentType:
                    allOf:
                        - $ref: '#/components/schemas/StaffEmploymentType'
                    description: 'Required on every row (the law presumes the employee''s claim when it is missing): given, or the previous row''s.'
                    nullable: true
                expectedEndDate:
                    description: A temporary employment's expected end. Dropped when the row is fast and it is not given.
                    format: date
                    nullable: true
                    type: string
                ftePercent:
                    description: 'Stillingsprosent: more than 0 and at most 100, at most two decimals. Required on every row: given, or the previous row''s.'
                    format: double
                    nullable: true
                    type: number
                fullTimeHoursPerWeek:
                    description: 'Hours per week for a full position, at most two decimals. Left out, the scheme''s: 37.5 not_shift and other_shift, 36.5 shift_365, 33.6 offshore_336 and continuous_336, 35.5 round_the_clock_355. Refused full_time_hours_mismatch unless exactly 36.5 for shift_365, exactly 35.5 for round_the_clock_355, 28 to 33.6 for the two 336 schemes; free otherwise (more than 0, at most 168).'
                    format: double
                    nullable: true
                    type: number
                hiredOutTo:
                    description: The innleier, when hired out (§ 14-6 o). Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                holidayTermsText:
                    description: § 14-6 g. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                locationId:
                    description: An existing location, the workplace (§ 14-6 b); archived only as for departmentId.
                    format: int64
                    nullable: true
                    type: integer
                managerPersonId:
                    description: The direct manager, never the person. Left empty, the department's manager is the person's manager.
                    format: int64
                    nullable: true
                    type: integer
                note:
                    description: HR's note on the row — staff:manage and staff:personal-data only. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                noticeEmployee:
                    description: '§ 14-6 h: the employee''s notice, in noticeUnit. 0 to 999.'
                    format: int32
                    nullable: true
                    type: integer
                noticeEmployer:
                    description: '§ 14-6 h: the employer''s notice, in noticeUnit. 0 to 999.'
                    format: int32
                    nullable: true
                    type: integer
                noticeUnit:
                    allOf:
                        - $ref: '#/components/schemas/StaffNoticeUnit'
                    description: Required with a notice.
                    nullable: true
                occupationCode:
                    description: 'The STYRK-08 yrkeskode: seven digits.'
                    nullable: true
                    type: string
                overtimeRuleText:
                    description: § 14-6 m. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                payComponents:
                    description: Pay group. Up to 20 components.
                    items:
                        $ref: '#/components/schemas/StaffPayComponent'
                    nullable: true
                    type: array
                payGrade:
                    description: Pay group. Up to 20 characters.
                    maxLength: 20
                    nullable: true
                    type: string
                payMethod:
                    description: Pay group (§ 14-6 i). Up to 40 characters.
                    maxLength: 40
                    nullable: true
                    type: string
                paydayText:
                    description: Pay group (§ 14-6 i). Up to 100 characters.
                    maxLength: 100
                    nullable: true
                    type: string
                probationEndDate:
                    description: 'The probation''s last day: at most six months after the employment''s start, and for a temporary employment at most half its expected term.'
                    format: date
                    nullable: true
                    type: string
                probationExtendedTo:
                    description: 'The extended probation''s last day: needs the extension agreed, a reason and a probationEndDate, and lies after it by at most the probation''s own length.'
                    format: date
                    nullable: true
                    type: string
                probationExtensionAgreed:
                    description: Whether an extension of the probation was agreed in writing (aml. § 15-6 (4)).
                    nullable: true
                    type: boolean
                probationExtensionReason:
                    description: Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                remunerationType:
                    allOf:
                        - $ref: '#/components/schemas/StaffRemunerationType'
                    description: Pay group. Optional.
                    nullable: true
                seniorityDate:
                    description: Pay group. Lønnsansiennitet.
                    format: date
                    nullable: true
                    type: string
                socialSecurityText:
                    description: § 14-6 q. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                specialHoursText:
                    description: § 14-6 l. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                tariffReference:
                    description: § 14-6 n. Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                temporaryGround:
                    allOf:
                        - $ref: '#/components/schemas/StaffTemporaryGround'
                    description: Required when midlertidig. Dropped when the row is fast and it is not given.
                    nullable: true
                title:
                    description: Up to 120 characters.
                    maxLength: 120
                    nullable: true
                    type: string
                validFrom:
                    description: The day the row takes effect. Required on POST /employments/{id}/terms; on an employment's first row it is the start, and may be left out.
                    format: date
                    nullable: true
                    type: string
                workingHoursScheme:
                    allOf:
                        - $ref: '#/components/schemas/StaffWorkingHoursScheme'
                    description: Left out on the first row, not_shift.
                    nullable: true
                workingTimeText:
                    description: § 14-6 j. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
            type: object
        StaffThresholdsAcknowledged:
            description: When each threshold was acknowledged (design S20) — once and permanently, by staff:manage; a threshold not yet acknowledged is absent. Who acknowledged it is in the threshold_acknowledged event.
            properties:
                "5":
                    format: date-time
                    type: string
                "30":
                    format: date-time
                    type: string
                "50":
                    format: date-time
                    type: string
                otp:
                    format: date-time
                    type: string
            type: object
        StaffWishesSeen:
            description: What a Seen stamped (staff competence design S8) — the rows of each list that carried no stamp, all stamped at seenAt. Zero everywhere when everything had been seen.
            properties:
                competences:
                    description: The person's current competence rows stamped.
                    format: int32
                    type: integer
                declarations:
                    description: The availability declaration's rows stamped.
                    format: int32
                    type: integer
                interests:
                    description: The interests stamped.
                    format: int32
                    type: integer
                preferences:
                    description: The preferences stamped.
                    format: int32
                    type: integer
                seenAt:
                    format: date-time
                    type: string
            required:
                - seenAt
                - interests
                - preferences
                - declarations
                - competences
            type: object
        StaffWorkingHoursScheme:
            description: 'The a-melding''s arbeidstidsordning: not_shift (ikkeSkift), shift_365 (skift365), offshore_336 (offshore336), continuous_336 (helkontinuerligSkiftOgAndreOrdninger336), round_the_clock_355 (doegnkontinuerligSkiftOgTurnus355), other_shift (andreSkift).'
            enum:
                - not_shift
                - shift_365
                - offshore_336
                - continuous_336
                - round_the_clock_355
                - other_shift
            type: string
info:
    title: Vantigo Staff API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/staff/absence-types:
        get:
            description: The absence types in their order — every caller reads every type that is not hidden, hr_only ones included (the type is public, who takes it is not); staff:manage reads the hidden ones too, the reserved types among them.
            operationId: getStaffAbsenceTypes
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffAbsenceType'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List absence types
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a company absence type, recorded as the installation event absence_type_created. A reserved type's key (absent, absent_hours, absent_hr_only, absent_hr_only_hours) is refused on key. Its kind and unit are fixed from now on.
            operationId: postStaffAbsenceTypes
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffAbsenceTypeRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsenceType'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, a key another type has or a sick kind among them.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Add an absence type
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/absence-types/{id}:
        put:
            description: Replaces an absence type but for its key, kind and unit, recorded as the installation event absence_type_updated. A seed changes its names, sort, hidden and paid alone; anything else, setting ammefri unpaid (aml. § 12-8 (2) pays it) or svangerskapskontroll unpaid (aml. § 12-1 pays it), and showing a reserved type, is refused seed_immutable.
            operationId: putStaffAbsenceTypesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the type was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffAbsenceTypeChangeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsenceType'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or If-Match is not a revision.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such type. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, seed_immutable, or absence_type_in_use (widening a type's visibility from hr_only to absent once an absence names it, or narrowing it from absent to hr_only while an absence of it approved by its own person has not ended).
            summary: Change an absence type
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/absences:
        get:
            description: 'The absences the caller may see, newest first: their own, their reports'' today (a manager by the one manager rule), every active person''s approved and registered rows to staff:view — shaped as "absent", the dates alone, never matched by a status filter — and everyone''s to staff:manage and staff:personal-data. A row the caller may not see is left out. personId narrows to one person; from and to to the rows that touch the range.'
            operationId: getStaffAbsences
            parameters:
                - description: 'Only this person''s rows.'
                  in: query
                  name: personId
                  schema:
                    format: int64
                    type: integer
                - description: 'Rows that end on or after this day.'
                  in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - description: 'Rows that start on or before this day.'
                  in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - description: 'Only rows in this status.'
                  in: query
                  name: status
                  schema:
                    $ref: '#/components/schemas/StaffAbsenceStatus'
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfStaffAbsence'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a filter or paging out of range.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List absences
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: 'Requests an absence of a type that needs a decision (status requested) or registers one that is a notification (status registered), for the caller''s own person or — staff:manage — anyone''s; nobody else, a manager included, gets the uniform 403. Judged under the person''s lock: the type visible and not the reserved absent, the days within one of the person''s employments, percent only on a type that allows it (percent_not_allowed), hours on an hour type and only there (hours_on_day_type), no note on a sick or child-sick type (absence_note_on_sick), the degree on a sykmelding only, and no overlap with the person''s requested, approved or registered rows (absence_overlap) — but a sykmelding over approved ferie, which a 100 % one splits around itself (absence_split) and a graded one stands beside, over an egenmelding, which it trims, and a graded sykmelding beside a leave allowing a percentage when the degree and the percent sum to at most 100. An egenmelding is judged against the self-certification policy: an occurrence — contiguous days, weekends and public holidays between included — at most the policy''s calendar days, the rolling year''s occurrences or days, never past its sick-leave case''s sixteenth day, after the policy''s months of employment, and not while HR has withdrawn the right. A sick row joins the person''s sick-leave case or opens one (GET /cases). A type drawing on the holiday account answers the account of each year the row touches after it, and overdrawn when taking every requested day would overdraw one — a warning, never a refusal. Recorded as absence_requested or absence_registered. After it has committed, a request is mailed to the person''s manager-deciders — and only when none of them has an active user, to every active holder of staff:approve or staff:manage, Owners included, at the address identity holds — naming the type only when it is neither a sick kind nor HR-only; a request of an HR-only type is mailed to no manager and no holder of either, but neutrally (no type, no dates) to the other active holders of staff:personal-data; a registration to the manager-deciders alone, never for an HR-only type. A mail that cannot be sent never fails the write.'
            operationId: postStaffAbsences
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffAbsenceRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsence'
                    description: 'Created'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a field did not pass: percent_not_allowed, hours_on_day_type, absence_note_on_sick, or a plain field error.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such person. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — absence_overlap; for an egenmelding self_certification_exhausted, self_certification_too_early or self_certification_withdrawn, each telling the person to register a sykmelding; or person_erased.'
            summary: Request or register an absence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/absences/{id}:
        delete:
            description: 'Removes an absence that was never decided (reading 16): a requested row, by the person or staff:manage, or a registered one, by staff:manage alone (an HR-only row: with staff:personal-data); anyone else gets the 404 of a row they cannot write. A decided row is cancelled, never deleted: absence_not_requested. Recorded as absence_deleted.'
            operationId: deleteStaffAbsencesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: 'No Content'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — absence_not_requested, or person_erased.'
            summary: Delete an absence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        get:
            description: 'One absence, shaped as GET /absences shapes it. One the caller may not see is a 404 identical to an unknown id.'
            operationId: getStaffAbsencesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsence'
                    description: 'OK'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
            summary: Get an absence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: 'Replaces an absence''s type, days, percent, hours, degree and note, judged as a new one is (the row itself left out of the overlap): the person''s while it is requested; a registered row — a sick one included — staff:manage''s alone, since ending a sykmelding early or fixing its days is HR''s (the person asks). A change never moves a row between a type that needs a decision and one that is a notification (absence_status_change), nor between an HR-only type and any other (absence_visibility_change, 409): the row is removed and the other entered. Anything else answers absence_not_requested; anyone but the person and staff:manage — for an HR-only row staff:manage with staff:personal-data — the 404 of a row they cannot write, whatever its status. Recorded as absence_updated with each field''s before and after.'
            operationId: putStaffAbsencesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the absence was read at, bare (3) or quoted ("3") — or, for staff:manage without staff:personal-data, the etag it was read with, quoted. A revision or an etag that has moved on, or a bare revision from a caller who is sent etags, is a 409 revision_conflict that names no revision.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffAbsenceChangeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsence'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a field did not pass, or If-Match is not a revision.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — revision_conflict, absence_not_requested, absence_status_change (a change between a type that needs a decision and one that is a notification), absence_visibility_change (a change between an HR-only type and any other: remove the absence and enter the other), absence_overlap, an egenmelding''s self_certification_exhausted, self_certification_too_early or self_certification_withdrawn, or person_erased.'
            summary: Change an absence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/absences/{id}/approve:
        post:
            description: 'Approves a request (design S12): by a decider of the person today — a manager of theirs by the one manager rule, staff:approve or staff:manage; for an HR-only type staff:personal-data alone (interim, plan reading 33) — never the caller''s own (own_request), except for a holder of staff:approve or staff:manage who heads the structure and has no manager with an active user, who approves their own, recorded absence_self_approved and listed to staff:manage as the attention item selfApproved (provisional, plan reading 1); and for an HR-only type the sole active holder of staff:personal-data — the one user identity names as holding it, an Owner counting by the wildcard; a directory that cannot answer makes nobody sole — who approves their own, recorded absence_self_approved, listed and shaped as every HR-only row''s events, and raised to staff:personal-data alone as hrOnlySelfApproved. Judged under the person''s lock: a row that is no longer requested — another decider was quicker, or the person cancelled — is absence_not_requested; overlap is judged again. The person is told by mail, naming the type only when it is neither a sick kind nor HR-only and never a note. A type drawing on the holiday account answers the accounts after it. A caller who is neither the person nor a decider gets the 404 of a row they cannot write, whatever its status. Recorded as absence_approved.'
            operationId: postStaffAbsencesByIdApprove
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffAbsenceDecisionRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffAbsence'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a note over 500 characters, or a property the request does not name.'
                "401":
                    content:
