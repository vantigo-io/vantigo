            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/self-certification:
        get:
            description: 'A person''s standing under the self-certification policy today: the policy''s limits, the occurrences and days used in the rolling year, and the day the months of employment allow it from. The withdrawal is shown to the readers of the care-day fields alone — the person, staff:manage, staff:personal-data. The person, a manager of theirs today, staff:approve and HR read it; anyone else gets a 404 identical to an unknown id.'
            operationId: getStaffPeopleByIdSelfCertification
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSelfCertification'
                    description: 'OK'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such person, or one whose standing the caller may not read. The body is empty.'
            summary: Get a person's egenmelding standing
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/people/{id}/self-certification/withdrawal:
        put:
            description: 'Withdraws the person''s right to egenmelding until a day (ftrl. § 8-27) — after today, at most a year ahead — with the reason, 1 to 500 characters; until null lifts it. From the day it is decided (withdrawnFrom; re-issuing a withdrawal still in force keeps that day) until that day, an egenmelding with any day in between is refused self_certification_withdrawn — one that begins before the decision and runs into the withdrawal is refused whole; days before the decision stand as a row of their own. The write moves the person''s revision. Recorded as self_cert_withdrawn or self_cert_restored, class E, listed only to the readers of the care-day fields.'
            operationId: putStaffPeopleByIdSelfCertificationWithdrawal
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffSelfCertWithdrawalRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSelfCertification'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a field did not pass.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such person. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — person_erased.'
            summary: Withdraw or restore egenmelding
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/user:
        get:
            description: 'A person''s self-service link and the linked user as the user directory names them — the person themselves, staff:manage and staff:personal-data read it; anyone else gets a 404 identical to an unknown id.'
            operationId: getStaffPeopleByIdUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonLink'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one whose link the caller may read. The body is empty.
            summary: Get a person's self-service link
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: 'Links the person to an existing, active user for self-service (design S24 as amended), or unlinks them with null. The link makes the user the person themselves — My page, the Self audience — and nothing else; it never makes the user managed. The user is read from the user directory, and whether Staff manages them from identity, before anything is written. A change is a user_linked event, an unlink a user_unlinked one; linking the person to the user they are already linked to changes nothing.'
            operationId: putStaffPeopleByIdUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonLinkRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonLink'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field error on userId when no user has the id; user_inactive when the user is disabled; user_linked_elsewhere when the user is linked to another person.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire); an unlink (userId null) is allowed. link_managed when the user to link, or the user linked now, is Staff-managed, or when the person's link is the accounts worker's (preparing, pending, active, disabled, failed or blocked) — a managed account is reached only through the accounts worker.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Service Unavailable — accounts_unavailable when identity could not say whether the user is Staff-managed. Nothing was changed.
            summary: Link a person to a user
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/retention/run:
        post:
            description: |-
                Runs the staff-retention worker's two steps once, now (design S15): an erase cycle — at most fifty people, under the worker's lease, each person's erases in one transaction with one erased event naming the caller as its actor — and one pass over the deletion ledger, at most a hundred objects and at most thirty seconds in all — what it does not reach, the worker finishes. Exactly what the worker does every poll, by the same code.

                The erase cycle takes what is due today in the settings' time zone and not under a legal hold: D — a person not yet erased, with at least one employment and every one ended more than retentionGraceDays ago, loses the personnel administration (contact and address, the sealed identifiers, the care-day fields, HR's notes, the terms' notes, the next of kin, the documents of class D, and those values in the history's payloads) and is marked erased; health — a person whose last employment ended more than healthRetentionDays ago loses the documents in restricted categories; A — an employment that ended in a year more than five years past loses its pay terms, its documents of class A and the pay in its events. Delivery B's health schedules (cases, childSick, withdrawal) and — when its setting is on — pregnancyHealth run in the same transaction; StaffErasedKind says what each removes, and the settings erasePregnancyHealthTypes and eraseSickCaseDates what they add. What remains — the names, the birth date, the employee number, the employments and their other terms, the roles, the link, the history's kinds and dates — stays.
            operationId: postStaffRetentionRun
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffRetentionRun'
                    description: OK — what the cycle erased and what the ledger pass attempted; a run that found nothing due answers no kinds.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — retention_busy: the worker, on this replica or another, is running an erase cycle now; nothing was run.'
            summary: Run retention now
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/settings:
        get:
            description: 'The installation''s Staff settings: the business time zone, the employee number sequence, the pension provider, the occupational injury insurer and the two retention periods — and the retention run''s state, derived from the deletion ledger and the history.'
            operationId: getStaffSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSettings'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Staff settings
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
        put:
            description: Replaces the settings; pensionProvider and injuryInsurer left out are cleared, retentionGraceDays and healthRetentionDays — and the policy, the carry-over, the account and the erase settings — left out keep their values; a null erasePregnancyHealthTypes or eraseSickCaseDates is refused on the field. The time zone must be an IANA name both this server and its database read the same way. The prefix and the next number must together make an employee number of at most 16 characters. retentionGraceDays is 0 to 3650 days, healthRetentionDays 30 to 3650. Turning erasePregnancyHealthTypes or eraseSickCaseDates on or off records the installation event settings_updated, naming the field from and to, the caller its actor; a replace that changes neither records nothing.
            operationId: putStaffSettings
            parameters:
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSettings'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass (a retention period out of its bounds among them); employee_number_too_long when the prefix and the next number make a number longer than 16 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — revision_conflict: the settings were changed since the revision If-Match names.'
            summary: Change the Staff settings
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/stats:
        get:
            description: The dashboard's figures for the register, judged on today in the settings' time zone and read in one snapshot. staff:view or staff:manage, judged in the module; anyone else is the uniform 403.
            operationId: getStaffStats
