components:
    schemas:
        PaginatedResponseOfStaffAbsence:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffAbsence'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffApproval:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffApproval'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffCase:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffCase'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffEvent:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffPersonListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffPersonListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        StaffAbsence:
            description: 'An absence as the caller may read it (design §5). A colleague (staff:view alone) reads spans of dates and nothing else — no row id, no status, no working days, no type (shownAs absent), no hour row, a person''s approved and registered day rows coalesced — so a sickness looks like any other absence. An hour row is read by the person, staff:personal-data and, for a type that is not HR-only, the readers of the type; never as leave. The person, their manager and HR read the status, the working days, the type and the detail; an HR-only type is shown as leave (shownAs leave, no typeId) to all but the person and staff:personal-data, and such a row then looks like any other leave: no hours, no note, the working days of its days, a registered row as approved (a status filter matches it so too), no revision, only while approved or registered — staff:personal-data alone decides it, so a request, a refusal or a cancel is not shown to them — and none of its events listed to them — they read its dates already, and the events'' count and kinds would tell a notification from a request. A write of a type drawing on the holiday account answers the accounts of the years it touches after it.'
            properties:
                id:
                    description: 'The row. Absent from a colleague''s span, which is no row: a colleague (staff:view alone) reads a person''s approved and registered days coalesced into spans, so a sykmelding over ferie or a row registered afterwards beside another reads as one span, and no hour row.'
                    format: int64
                    type: integer
                    x-go-type-skip-optional-pointer: true
                personId:
                    description: 'The person.'
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/StaffAbsenceStatus'
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day.'
                    format: date
                    type: string
                workingDays:
                    description: 'The working days from the first to the last day — Monday to Friday without public holidays — whatever the share; an hour row counts none, but one shown as leave counts its day. Absent to a colleague.'
                    format: int32
                    type: integer
                shownAs:
                    $ref: '#/components/schemas/StaffAbsenceShownAs'
                typeId:
                    description: 'The type, when the caller may read it (shownAs type).'
                    format: int64
                    type: integer
                percent:
                    description: 'The percentage of each day, to the person, their manager and HR.'
                    format: double
                    type: number
                hours:
                    description: 'The hours of an hour type''s one day.'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree.'
                    format: double
                    type: number
                note:
                    description: 'The note.'
                    type: string
                accounts:
                    description: 'On a write of a type drawing on the holiday account: the account of each year the row touches, after the write.'
                    items:
                        $ref: '#/components/schemas/StaffHolidayAccount'
                    type: array
                overdrawn:
                    description: 'On a write of a type drawing on the holiday account: whether taking every requested day would overdraw one of the accounts — a warning, never a refusal.'
                    type: boolean
                decisionNote:
                    description: 'The decider''s note on an approval or the reason for a rejection, with the detail — never on a row shown as leave, which carries no decision field.'
                    type: string
                revision:
                    description: 'The revision a change sends back in If-Match — to the person and to staff:manage with staff:personal-data only, who write the row and read it as it is. Nobody else is sent it: a registration stays at revision 1 and a decided request moves past it, so the number would tell which rows are notifications.'
                    format: int32
                    type: integer
                etag:
                    description: 'In place of the revision, to staff:manage without staff:personal-data — who writes every row but reads an HR-only one as leave — on every row alike: an opaque tag, sent back quoted in If-Match, that changes with the row and tells nothing of how often it has.'
                    type: string
            required:
                - personId
                - firstDay
                - lastDay
                - shownAs
            type: object
        StaffAbsenceDecisionRequest:
            additionalProperties: false
            description: 'A decision''s note: optional on an approval, the reason a rejection requires. At most 500 characters, class D; read with the row''s detail, never on a row shown as leave, and never in a mail.'
            properties:
                note:
                    type: string
            type: object
        StaffAbsenceChangeRequest:
            additionalProperties: false
            description: 'An absence''s fields, for a change (a full replace) and for one''s own new absence. A property this request does not name is refused, so the person learns it was not written.'
            properties:
                typeId:
                    description: 'The absence type.'
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day, the first day itself when left out; an hour type''s is its first day.'
                    format: date
                    type: string
                percent:
                    description: '1 to 100, two decimals, only on a type that allows a percentage (percent_not_allowed); 100 when left out.'
                    format: double
                    type: number
                hours:
                    description: '0.25 to 24 in quarter hours, only on a type counted in hours, which also needs it (hours_on_day_type).'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree, 1 to 100, two decimals — its share of each day; 100 when left out. Only on a sykmelding.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; never on a sick or child-sick type (absence_note_on_sick).'
                    type: string
            required:
                - typeId
                - firstDay
            type: object
        StaffAbsenceKind:
            description: What the rules key an absence type on (design §3.5). holiday draws on the holiday account; sick_self is egenmelding, sick_certified sykmelding, child_sick a sick child (omsorgsdager); leave, time_off and other are the rest. A company type is holiday, leave, time_off or other; the sick kinds are the seeds'.
            enum:
                - holiday
                - sick_self
                - sick_certified
                - child_sick
                - leave
                - time_off
                - other
            type: string
        StaffAbsenceRequest:
            additionalProperties: false
            description: 'A new absence for a person: the caller''s own, or — staff:manage — anyone''s. A property this request does not name is refused.'
            properties:
                personId:
                    description: 'The person it is for.'
                    format: int64
                    type: integer
                typeId:
                    description: 'The absence type.'
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day, the first day itself when left out; an hour type''s is its first day.'
                    format: date
                    type: string
                percent:
                    description: '1 to 100, two decimals, only on a type that allows a percentage (percent_not_allowed); 100 when left out.'
                    format: double
                    type: number
                hours:
                    description: '0.25 to 24 in quarter hours, only on a type counted in hours, which also needs it (hours_on_day_type).'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree, 1 to 100, two decimals — its share of each day; 100 when left out. Only on a sykmelding.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; never on a sick or child-sick type (absence_note_on_sick).'
                    type: string
            required:
                - personId
                - typeId
                - firstDay
            type: object
        StaffAbsenceShownAs:
            description: 'How the caller is shown the row''s type: type (typeId names it), leave (an HR-only type to a manager or HR without staff:personal-data), or absent (a colleague, who reads no type).'
            enum:
                - type
                - leave
                - absent
            type: string
        StaffAbsenceStatus:
            description: 'requested (waiting for a decision), approved, rejected, cancelled, or registered (a notification, needing none).'
            enum:
                - requested
                - approved
                - rejected
                - cancelled
                - registered
            type: string
        StaffAbsenceType:
            description: An absence type (design S8, §3.5) — one of the seeds, the statutory vocabulary, or the company's own. key, kind and unit never change. A seed changes only its names, its order, whether it is hidden and whether it is paid (seed_immutable otherwise) — ammefri never unpaid — paid within aml. § 12-8 (2)'s limits, up to one hour a day in the child's first year on a working day of seven hours or more, nursing time beyond that unpaid by law unless agreed and registered with a company type of its own — nor svangerskapskontroll, paid time off for antenatal check-ups by aml. § 12-1; the reserved types are never shown and never offered.
            properties:
                allowsPercent:
                    description: Whether an absence of the type may be a percentage of each day. Never on a sick kind, whose share is the sykmelding's degree.
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    description: Whether its approved days are taken from the holiday account.
                    type: boolean
                hidden:
                    description: Not offered for a new absence, and listed to staff:manage alone.
                    type: boolean
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffAbsenceKind'
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    description: true — requested and decided (approved or rejected); false — a notification, registered when entered.
                    type: boolean
                paid:
                    description: Whether the absence is paid. Informational — no figure, the payroll export included, reads it. A seed's is HR's to change but ammefri's and svangerskapskontroll's, paid by law.
                    type: boolean
                reserved:
                    description: One of the four reserved types the erases write — absent in place of a sick or child-sick type; absent_hours in place of helse, counted in hours; absent_hr_only and absent_hr_only_hours (visibility hr_only) in place of an HR-only pregnancy type, days or hours, so the row reads as before to everyone who read it as leave. Always hidden.
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /absence-types/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the types every installation starts with.
                    type: boolean
                sort:
                    format: int32
                    type: integer
                unit:
                    $ref: '#/components/schemas/StaffAbsenceUnit'
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - id
                - key
                - names
                - kind
                - unit
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
                - seeded
                - hidden
                - reserved
                - sort
                - revision
            type: object
        StaffAbsenceTypeChangeRequest:
            additionalProperties: false
            description: A type replaced as a whole but for its key, kind and unit, which never change; its visibility widened from hr_only to absent only while no absence names it, and narrowed from absent to hr_only only while no absence of it approved by its own person has not ended (absence_type_in_use), and a property this schema does not name — key, kind or unit among them — is refused as a 400 naming it. A seed may change its names, sort, hidden and paid alone — every other value as it is, else seed_immutable — ammefri stays paid (aml. § 12-8 (2)), as does svangerskapskontroll (aml. § 12-1), and the reserved types stay hidden and unpaid.
            properties:
                allowsPercent:
                    description: Only on a type counted in days.
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    description: Only on a type counted in days.
                    type: boolean
                hidden:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    type: boolean
                paid:
                    type: boolean
                sort:
                    description: 1 to 1000.
                    format: int32
                    type: integer
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - names
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
                - hidden
                - sort
            type: object
        StaffAbsenceTypeNames:
            description: A type's name in English and in Norwegian bokmål, each 1 to 100 characters.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
                - nb
            type: object
        StaffAbsenceTypeRequest:
            description: A company type. The key is 1 to 40 characters of a–z, 0–9 and underscores, unique; the kind is holiday, leave, time_off or other (the sick kinds are the seeds'); kind and unit are fixed from now on. A percentage and drawing on the holiday account are for a type counted in days.
            properties:
                allowsPercent:
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    type: boolean
                hidden:
                    description: Left out, false.
                    type: boolean
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffAbsenceKind'
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    type: boolean
                paid:
                    type: boolean
                sort:
                    description: 1 to 1000. Left out, after every type there is.
                    format: int32
                    type: integer
                unit:
                    $ref: '#/components/schemas/StaffAbsenceUnit'
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - key
                - names
                - kind
                - unit
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
            type: object
        StaffAbsenceUnit:
            description: days, or hours for a registration of part of one day.
            enum:
                - days
                - hours
            type: string
        StaffAbsenceVisibility:
            description: absent — colleagues see "absent", the manager and HR the type; hr_only — the manager sees "leave", the type is staff:personal-data's (and the person's own).
            enum:
                - absent
                - hr_only
            type: string
        StaffAccountEmailKind:
            description: 'Which of the person''s addresses Staff gives identity for their account: work (the work email) or private (the private email).'
            enum:
                - work
                - private
            type: string
        StaffAccountInvitation:
            description: A pending account's invitation to choose a password, as identity reports it.
            properties:
                issued:
                    description: The invitations delivered in the account's current pending spell.
                    format: int32
                    type: integer
                state:
                    description: 'none — none, or none needed; active — one can be accepted; expired — the latest lapsed unanswered; revoked_by_owner — an Owner revoked it, and only Run now issues another; exhausted — three went unanswered, and only Run now issues another.'
                    enum:
                        - none
                        - active
                        - expired
                        - revoked_by_owner
                        - exhausted
                    type: string
            required:
                - state
                - issued
            type: object
        StaffAccountLink:
            description: 'The person''s link to a user under the identity provider, as the accounts worker and HR left it (design S27, §3.6). Codes only: the reason and the invitation never carry an address or a driver''s words.'
            properties:
                attempts:
                    description: The worker's failed attempts at its last step; 0 after a success.
                    format: int32
                    type: integer
                invitation:
                    $ref: '#/components/schemas/StaffAccountInvitation'
                lastSyncedAt:
                    description: When the worker last brought the account in line with the record. Absent when it never has.
                    format: date-time
                    type: string
                managed:
                    description: Whether Staff manages the user (the accounts worker's link), as opposed to HR's self-service link to an existing user.
                    type: boolean
                nextAttemptAt:
                    description: When the worker next looks at the link. Absent when it has no attempt planned.
                    format: date-time
                    type: string
                reason:
                    description: 'Why the worker is blocked on the link, a code (blocked_reason), absent when it is not: no_employment, account_email_missing, blocked_by_owner, disabled_by_owner, user_gone, mismatch, mode_changed, email_differs, invitation_revoked, invitation_unanswered, account_not_managed, account_privileged (from the decision table); not_found, employee_role_missing, employee_role_unsafe, account_email_taken, employee_number_taken, mode_mismatch, invalid_actor (from identity''s answer, or the mode).'
                    type: string
                state:
                    description: 'preparing (the worker is creating or finding the user — no user yet), linked (HR''s self-service link), pending, active, disabled, failed or blocked.'
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
            required:
                - state
                - managed
                - attempts
            type: object
        StaffAccountMode:
            description: 'The installation''s authority mode as identity records it: local (identity holds the passwords, so Staff creates and invites) or federated (an identity provider owns the accounts, so Staff only finds, re-enables what it disabled and disables).'
            enum:
                - local
                - federated
            type: string
        StaffAccountsRun:
            description: 'What one accounts cycle run by hand did (POST /accounts/run): the links it claimed, those whose step identity answered — carried out, or refused with a reason the link now records — those that failed to be called and are retried, and the due links it did not reach.'
            properties:
                attempted:
                    description: The links the run claimed and worked.
                    format: int32
                    type: integer
                done:
                    description: Of those, the links whose step was carried out, or answered with a reason (blocked) — none to retry.
                    format: int32
                    type: integer
                failed:
                    description: Of those, the links whose call could not be made (identity unreachable or timed out); last_error is set and the worker retries them.
                    format: int32
                    type: integer
                remaining:
                    description: The due links left when the run ended — its budget of sixty seconds or fifty links spent, or claimed meanwhile by the worker — which the worker's next cycle takes.
                    format: int32
                    type: integer
            required:
                - attempted
                - done
                - failed
                - remaining
            type: object
        StaffAmeldingLeave:
            description: The a-melding's permisjonsOgPermitteringsBeskrivelse a leave of the type is reported as — the six leave descriptions and permittering, in NAV's spellings. Absent when the type is not reported as leave. The codes velferdspermisjon and utdanningspermisjon expired on 31 December 2022 and are not among them.
            enum:
                - permisjonMedForeldrepenger
                - permisjonVedMilitaertjeneste
                - utdanningspermisjonLovfestet
                - utdanningspermisjonIkkeLovfestet
                - andreLovfestedePermisjoner
                - andreIkkeLovfestedePermisjoner
                - permittering
            type: string
        StaffAppointmentForm:
            description: The a-melding's ansettelsesform. fast and fast_utleid go with a permanent employment, the other three with a temporary one.
            enum:
                - fast
                - midlertidig
                - fast_utleid
                - midlertidig_utleid
                - midlertidig_tilkallingsvikar
            type: string
        StaffAssignableUser:
            description: An active user HR may link a person to, as the user directory names them.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        StaffBankAccountKind:
            enum:
                - bban
                - iban
            type: string
        StaffBankAccountRequest:
            description: 'A bank account to seal on the person (design S4): a Norwegian kontonummer (bban, eleven digits with a valid MOD11 control digit; spaces and full stops are dropped) or an IBAN (spaces dropped; the ISO 13616 check digits, and for a Norwegian IBAN the embedded account''s MOD11). The value is sealed; only its kind and last four digits are kept in clear, and no refusal echoes it.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBankAccountReveal:
            description: The bank account on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a bank_account_revealed event naming the viewer.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number as it was sealed — normalised, without spaces.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitSummary:
            description: A business unit as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canDecide:
                    description: 'staff:approve or staff:manage, or managing anyone today — decides absence requests (delivery B).'
                    type: boolean
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: staff:personal-data — everyone's health documents. The person reads their own whatever this says.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
                managesAnyone:
                    description: The caller's linked person manages anyone today by the one manager rule — a manager who has left manages nobody. Drives My team.
                    type: boolean
                canRunAccounts:
                    description: staff:manage — runs the accounts worker by hand and disables an account now (delivery C).
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canSeeHealth
                - canDecide
                - managesAnyone
                - canRunAccounts
            type: object
        StaffCareDays:
            description: 'A person''s care days (omsorgsdager) for a year (design S11, ftrl. § 9-6 and § 9-8). Using more than the entitlement is shown (exceeded), never refused.'
            properties:
                personId:
                    format: int64
                    type: integer
                year:
                    format: int32
                    type: integer
                recorded:
                    description: 'Whether the care-day fields are recorded on the person; the entitlement is 0 while they are not.'
                    type: boolean
                childrenCounted:
                    description: 'childrenUnder12 + chronicallyIllChildren.'
                    format: int32
                    type: integer
                entitlement:
                    description: '10 for one or two children, 15 for three or more, doubled for a sole carer; plus 10 per chronically ill or disabled child, 20 for a sole carer.'
                    format: int32
                    type: integer
                used:
                    description: 'The year''s registered child-sick working days on which the person had the right — four weeks into an unbroken employment.'
                    format: int32
                    type: integer
                ineligibleDays:
                    description: 'The year''s child-sick working days before the right: not care days, not counted in used.'
                    format: int32
                    type: integer
                remaining:
                    description: 'entitlement − used; below zero when exceeded.'
                    format: int32
                    type: integer
                exceeded:
                    type: boolean
                employerPaid:
                    description: 'The used days the employer bears itself: the first ten.'
                    format: int32
                    type: integer
                beyondEmployer:
                    description: 'The used days beyond the first ten, which NAV refunds.'
                    format: int32
                    type: integer
                eligible:
                    description: 'Whether four weeks'' employment has given the right today (ftrl. § 9-8).'
                    type: boolean
                eligibleFrom:
                    description: 'The day the right starts: four weeks after the start of the unbroken employment in force today — an employment beginning the day after another ended continues it. Absent when no employment is in force today.'
                    format: date
                    type: string
            required:
                - personId
                - year
                - recorded
                - childrenCounted
                - entitlement
                - used
                - ineligibleDays
                - remaining
                - exceeded
                - employerPaid
                - beyondEmployer
                - eligible
            type: object
        StaffCarryOverRequest:
            description: 'A carry-over of fromYear''s untaken holiday into the year after.'
            properties:
                fromYear:
                    description: 'The year the days come from.'
                    format: int32
                    type: integer
                kind:
                    description: agreed (capped by the scheme) or forced (uncapped, with a note).
                    enum:
                        - agreed
                        - forced
                    type: string
                    x-enum-varnames:
                        - StaffCarryOverKindAgreed
                        - StaffCarryOverKindForced
                days:
                    description: 'Working days, one decimal, above zero; the year''s remaining rounded down to a tenth when left out.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; required for forced.'
                    type: string
            required:
                - fromYear
                - kind
            type: object
        StaffCase:
            description: 'A sick-leave case (design S10, §3.5): the sickness its egenmelding and sykmelding rows gather under, its follow-up milestones and its notes; there is no field for a diagnosis. Class E whole. Optional fields are absent when not recorded or not the caller''s to read.'
            properties:
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day of its first row.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day of its last row.'
                    format: date
                    type: string
                open:
                    description: 'HR has not closed it and its last day is at most sixteen days ago: a sick row from today would join it.'
                    type: boolean
                closedAt:
                    description: 'When HR closed it. Absent when HR has not.'
                    format: date-time
                    type: string
                maxBenefitEstimate:
                    description: 'The 52-week end, an estimate NAV may correct: first day + 364 unless HR edited it.'
                    format: date
                    type: string
                maxBenefitEstimateEdited:
                    description: 'Whether HR set the estimate.'
                    type: boolean
                accommodationNote:
                    description: 'Functional notes about tilrettelegging — to the person, their manager and HR; never the Approver.'
                    type: string
                milestones:
                    items:
                        $ref: '#/components/schemas/StaffCaseMilestone'
                    type: array
                etag:
                    description: 'In place of the revision, to a reader who writes the case but does not read its health group (the manager, staff:manage without staff:personal-data): an opaque tag that changes with every write, sent back as If-Match (quoted) on PUT /cases/{id}. A bare revision from such a reader is revision_conflict.'
                    type: string
                revision:
                    description: 'Send it back as If-Match on PUT /cases/{id}. Read by the health group alone — the person and staff:personal-data — since it moves with the accommodation note; the Approver, who writes no note, reads neither it nor etag.'
                    format: int32
                    type: integer
                    x-go-type-skip-optional-pointer: true
            required:
                - id
                - personId
                - firstDay
                - lastDay
                - open
                - maxBenefitEstimate
                - maxBenefitEstimateEdited
                - milestones
            type: object
        StaffCaseChangeRequest:
            description: 'A case''s notes: a field left out is kept, one sent is written, null clearing it — the accommodation note by the manager and HR, the estimate by staff:manage alone (sent by anyone else, a 400), null returning it to the derived first day + 364.'
            properties:
                accommodationNote:
                    description: 'At most 2000 characters; null or empty clears it, left out keeps it.'
                    nullable: true
                    type: string
                maxBenefitEstimate:
                    description: 'staff:manage''s; null returns it to first day + 364, left out keeps it.'
                    format: date
                    nullable: true
                    type: string
            type: object
        StaffCaseMilestone:
            description: 'One of a case''s follow-up milestones, dated from its first day — the end of the arbeidsgiverperiode on its sixteenth sick day.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffMilestoneKind'
                dueDate:
                    description: 'Its date. Absent for employer_period_end until the case reaches its sixteenth sick day.'
                    format: date
                    type: string
                due:
                    description: 'Whether it applies: not done or waived, the case open and lasted to within a week of its date (a three-day case has none due).'
                    type: boolean
                doneAt:
                    description: 'The day it was marked done. Absent when not.'
                    format: date
                    type: string
                waived:
                    type: boolean
                waivedReason:
                    description: 'Why it was waived as plainly unnecessary — never a diagnosis; class E, to the person and staff:personal-data only. Absent when not waived.'
                    type: string
                note:
                    description: 'Its note, class E: to the person and staff:personal-data only.'
                    type: string
                revision:
                    description: 'Send it back as If-Match on PUT /cases/{id}/milestones/{kind}/note. Read by the health group alone — the person and staff:personal-data — since it moves with the note.'
                    format: int32
                    type: integer
                    x-go-type-skip-optional-pointer: true
            required:
                - kind
                - due
                - waived
            type: object
        StaffCaseStatus:
            description: 'Which cases a list answers: open, closed, or all.'
            enum:
                - open
                - closed
                - all
            type: string
        StaffContractCheck:
            description: The § 14-6 check of one employment (design S5).
            properties:
                contractSigned:
                    description: Whether the employment records a signed contract (contractSignedAt).
                    type: boolean
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentId:
                    format: int64
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/StaffContractCheckItem'
                    type: array
                termsId:
                    description: The terms row judged. Absent when the employment has none.
                    format: int64
                    type: integer
            required:
                - employmentId
                - items
                - contractSigned
            type: object
        StaffContractCheckItem:
            properties:
                item:
                    description: The letter of aml. § 14-6 (1), a to q.
                    type: string
                source:
                    description: Where the item is read from, as the contract names the fields (terms.locationId, employment.startDate, settings.pensionProvider …).
                    type: string
                state:
                    description: present, missing, or not_applicable when the item does not apply to this employment (e when permanent, f without a probation, l without a special arrangement, n without a tariff when not hired out, o when not hired out).
                    enum:
                        - present
                        - missing
                        - not_applicable
                    type: string
            required:
                - item
                - state
                - source
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffDepartmentSummary:
            description: A department as the work group names it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
            type: object
        StaffDocument:
            description: 'One document in a person''s archive (design S14, §3.6). The bytes are never in a JSON body: they are read from GET /documents/{id}, with the document''s own visibility. Optional fields are absent when not recorded.'
            properties:
                category:
                    $ref: '#/components/schemas/StaffDocumentCategorySummary'
                caseId:
                    description: The sick-leave case a health document belongs to, whose erase reaches it (S15). Only a document in a restricted category names one.
                    format: int64
                    type: integer
                contentType:
                    description: The type the file's own bytes were sniffed as on upload — application/pdf, image/jpeg, image/png or image/heic.
                    type: string
                employmentId:
                    description: The employment the document belongs to — the one covering signedAt, else the upload day, when exactly one does; HR may set it. It is what the erase of class A documents goes by. Absent when none.
                    format: int64
                    type: integer
                fileName:
                    description: The name the file was uploaded under, without any path, at most 255 characters.
                    type: string
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /documents/{id}.
                    format: int32
                    type: integer
                signedAt:
                    description: The day the document was signed. Absent when not recorded.
                    format: date
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
                validTo:
                    description: The last day the document is valid — a certificate's expiry. Absent when not recorded.
                    format: date
                    type: string
            required:
                - id
                - personId
                - category
                - fileName
                - contentType
                - sizeBytes
                - uploadedAt
                - revision
            type: object
        StaffDocumentCategory:
            description: A document category (design S14) — one of the six seeds or the company's own. Its retention class is fixed when it is created; restricted (a health category, readable only by the person and staff:personal-data) is true exactly when the class is E. A seeded category never changes; an archived one is offered for no new document, and only a category no document is filed under is archived.
            properties:
                archivedAt:
                    description: When the category was archived. Absent while it is in use.
                    format: date-time
                    type: string
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
                restricted:
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /document-categories/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the six categories every installation starts with — contract, attest, certificate, correspondence, health, other.
                    type: boolean
                sort:
                    format: int32
                    type: integer
            required:
                - id
                - key
                - names
                - class
                - restricted
                - seeded
                - sort
                - revision
            type: object
        StaffDocumentCategoryChangeRequest:
            description: A category's names and whether it is archived. Its key and class never change. A seeded category is refused seed_immutable; archiving a category documents are still filed under is refused category_in_use.
            properties:
                archived:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
            required:
