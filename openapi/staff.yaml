                - nextOfKin
                - roles
                - employments
                - link
                - account
                - documents
                - competences
                - interests
                - preferences
                - availability
                - competenceReviews
                - absences
                - holidayAdjustments
                - cases
                - careDays
                - selfCertification
                - events
            type: object
        StaffPersonalDataBankAccount:
