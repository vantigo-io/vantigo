            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                last4:
                    type: string
            required:
                - kind
                - last4
            type: object
        StaffPersonCapabilities:
            description: What the caller may do with this person. The access layer still decides every request.
            properties:
                canDecide:
                    description: 'The caller decides the person''s absence requests today (design S12): a manager of theirs by the one manager rule, staff:approve or staff:manage — on oneself only for the self-approver (POST /absences/{id}/approve).'
                    type: boolean
                canEdit:
                    description: staff:manage — change the record, the next of kin and the roles, and delete a person created in error.
                    type: boolean
                canHold:
                    description: staff:personal-data — set and lift the legal hold, record a reassessment and export the person's data.
                    type: boolean
                canManageAccount:
                    description: staff:manage — the self-service link to a user and the account flag (PUT /people/{id}/account).
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: The person themselves or staff:personal-data — the person's health documents.
                    type: boolean
                canSeePay:
                    description: The person themselves, staff:manage or staff:personal-data — the pay terms of the person's employments.
                    type: boolean
                isManager:
                    description: The caller manages the person today by the one manager rule — a manager of theirs, who decides their absence, ticks their sick-leave case's milestones and writes its accommodation note. False for oneself.
                    type: boolean
                self:
                    description: The caller's self-service link names the person — the person themselves.
                    type: boolean
