                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — field errors keyed by the trait (values.<key>), each with its code: trait_required, trait_invalid; a key the provider does not declare is a field error too.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such group, or no such provider in the slot. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — group_archived.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Service Unavailable — provider_unavailable: the request turns the provider on and the provider could not declare its traits, so the values cannot be checked. Nothing was written; try again.'
            summary: Set a group's provider
            tags:
