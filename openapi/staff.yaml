        StaffPreferenceKind:
            description: What a preference is about (staff competence design S9) — the weekdays, the time of day, the locations, how far the person travels, how much of the work is remote, the most consecutive working days and the most hours a week. An unknown kind is a field error.
            enum:
                - weekdays
                - time_of_day
                - location
                - travel
                - remote
                - max_consecutive_days
                - max_hours_per_week
            type: string
            x-enum-varnames:
                - StaffPreferenceKindWeekdays
                - StaffPreferenceKindTimeOfDay
                - StaffPreferenceKindLocation
                - StaffPreferenceKindTravel
                - StaffPreferenceKindRemote
                - StaffPreferenceKindMaxConsecutiveDays
                - StaffPreferenceKindMaxHoursPerWeek
        StaffProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: in this delivery org_number_invalid, employee_number_too_long, employee_number_taken, work_email_taken, person_in_use, structure_archived, structure_default, department_cycle, revision_conflict, national_id_invalid, national_id_duplicate, national_id_birth_date_mismatch, bank_account_invalid, user_inactive, user_linked_elsewhere, no_person, employment_number_taken, end_reason_required, terms_required_fields, temporary_ground_required, appointment_form_mismatch, probation_too_long, full_time_hours_mismatch, terms_valid_from_taken, terms_before_start, terms_after_end, terms_first_row_start, terms_not_latest, self_manager, manager_cycle, document_type_unsupported, document_too_large, document_count_exceeded, category_restricted, category_in_use, seed_immutable, holiday_scheme_in_use, absence_type_in_use, absence_overlap, absence_note_on_sick, self_certification_exhausted, self_certification_too_early, self_certification_withdrawn, holiday_postponement_not_applicable, holiday_postponement_too_late, percent_not_allowed, hours_on_day_type, absence_not_requested, absence_not_cancellable, absence_status_change, absence_visibility_change (409: a change between an HR-only type and any other), carry_over_recorded, own_request, person_erased, storage_unavailable, legal_hold, reassessment_not_due, retention_busy, threshold_unknown, accounts_unavailable (503: no module provides accounts, or identity could not be reached), account_not_managed (409: Disable now on a user Staff does not manage), account_privileged (409: Disable now on an Owner, a SystemAdmin or the last active Owner), account_mismatch (409: Disable now on a user carrying another employee number), link_managed (409: the user is Staff-managed, or the link is the accounts worker''s), accounts_busy (409: the accounts worker holds the person''s link right now), account_kind_locked (409: a change of kind away from entra while the person''s entra link is enabled or disabled), provider_missing (400, a field error on accountKind or defaultAccountKind: no enabled module offers that provider), pass_gone (409: the pass was shown already, has expired, or none was issued), provider_refused (409: the provider refused Run now or Disable now; detail carries its code, never its words), group_synced (409: a delete of a group a provider has in its directory, is being sent, or is turned on for; archive it instead), group_derived (409: the members of a derived group are its rule''s), group_archived (409: a change of an archived group, its members, owners or providers), provider_unavailable (503: a provider turned on for a group could not declare its traits), competence_held (409: the person holds a current row of the competence), competence_unavailable (400, a field error on competenceId: an unknown, hidden or archived competence), competence_in_use (409: hasLevel changed on a competence a person''s row names), verified_row (409: the person changing or removing their own verified row), superseded (409: a write of a superseded row), own_record (403: the person verifying their own competence row), skill_no_validity (400, a field error on validTo: an end on a row of a skill; 409: a renewal of a skill''s row), level_not_allowed (400, a field error on level: a level on a competence without one) and level_required (400, a field error on level: none on a competence with one). errors carries the field errors of a 400, keyed by the request''s camelCase field (an element of a list as nextOfKin[0].name, a nested one as terms.ftePercent); a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        StaffProviderLink:
            description: 'The person''s link to their account in an external provider''s directory (Entra design D7) — the provider link, which the accounts worker drives under the claim it holds on the identity link, provider first, identity second. Codes only: the reason and the reported codes never carry an address or the provider''s words.'
            properties:
                announcedAt:
                    description: When Staff announced the account to identity (Expect), so the user the provider creates is adopted with no Owner in between. Absent until it has; an announcement older than ninety days that no user fulfilled raises accountNotArrived.
                    format: date-time
                    type: string
                attempts:
                    description: The worker's failed attempts at its last provider step; 0 after a success.
                    format: int32
                    type: integer
                externalUpn:
                    description: The user principal name the provider answered for the account. Absent until the provider has prepared it.
                    type: string
                hasPass:
                    description: Whether the provider issued a pass for the account that nobody has revealed yet (POST /people/{id}/account/pass).
                    type: boolean
                lastSyncedAt:
                    description: When the worker last brought the external account in line with the record. Absent when it never has.
                    format: date-time
                    type: string
                nextAttemptAt:
                    description: When the worker next looks at the person's links. Absent when it has no attempt planned.
                    format: date-time
                    type: string
                passIssuedAt:
                    description: When the provider issued the pass not yet revealed. Absent when there is none; one unrevealed for a day raises passUnrevealed.
                    format: date-time
                    type: string
                provider:
                    description: The provider's key, entra.
                    type: string
                reason:
                    description: 'Why the worker is blocked on the link, a code, absent when it is not: external_ambiguous (two accounts in the directory hold the employee number), external_address_taken (the work email is another account''s), external_synced_on_premises, external_privileged, external_unconfirmed (the directory holds an account under the employee number that Vantigo did not create, and no holder of entra:manage has confirmed its adoption; nothing is written to it until one does), external_enabled (a delete of an account still enabled), provider_unavailable, user_gone (the account is gone from the directory; the worker never creates a second), invalid_actor, manager_not_in_entra.'
                    type: string
                reportedCodes:
                    description: 'The facts the provider reported about the account and could not act on, verbatim: hire_date_not_written, privileged, pass_not_allowed, licence_unavailable:<SKU part number>, manager_not_found; and Staff''s own manager_not_in_entra (the manager has no account in the directory). Empty when there are none.'
                    items:
                        type: string
                    type: array
                state:
                    description: 'preparing (the worker asked the provider to create or find the account — none yet), enabled, disabled, deleted (soft-deleted in the directory, delete_external_after_days after the last employment ended), failed or blocked.'
                    type: string
            required:
                - provider
                - state
                - reportedCodes
                - hasPass
                - attempts
            type: object
        StaffRelationshipType:
            description: The a-melding's kind of arbeidsforhold.
            enum:
                - ordinary
                - maritime
                - freelancer
                - pension_or_other
            type: string
        StaffRemunerationType:
            enum:
                - monthly
                - hourly
                - commission
                - fee
                - piecework
            type: string
        StaffErasedKind:
            description: What one kind of erase removed (design S15). count is the number of items it removed — each column value nulled, each row deleted (a next of kin, a document) and each event payload rewritten.
            properties:
                count:
                    format: int64
                    type: integer
                kind:
                    description: 'D — the personnel administration, a grace period after the last employment ended; health — the health documents not filed under a sick-leave case and the health content of the history no case owns, healthRetentionDays after it; A — one employment''s pay terms, its contract and attest documents and the pay in its events, five years after the year it ended; cases — a closed sick-leave case''s health content (its notes, its milestones'' facts, its rows'' sick type and degree, its documents and its events'' health fields), healthRetentionDays after the case closed, whatever the employment — and with eraseSickCaseDates on, the case itself: its milestones and the case row deleted, its rows unlinked keeping their days as absent, its events blanked to their kind; childSick — a year''s child-sick rows'' type and their events'' health fields, healthRetentionDays after the year ended; withdrawal — a withdrawal of egenmelding and its events, healthRetentionDays after it lapsed; pregnancyHealth — with erasePregnancyHealthTypes on, a year''s rows of svangerskapskontroll, svangerskapspermisjon, fødselspermisjon and helse given a reserved type — the HR-only pair for an HR-only type, absent_hours for helse, by unit — and their events'' type values replaced, healthRetentionDays after the year ended.'
                    enum:
                        - D
                        - health
                        - A
                        - cases
                        - childSick
                        - withdrawal
                        - pregnancyHealth
                    type: string
            required:
                - kind
                - count
            type: object
        StaffRetentionDeletions:
            description: One pass over the deletion ledger — the objects the erases and the document deletes queued for removal from the object store.
            properties:
                attempted:
                    description: The ledger rows due and claimed, each one attempt at its object.
                    format: int32
                    type: integer
                succeeded:
                    description: The attempts the store confirmed; each such row is gone from the ledger.
                    format: int32
                    type: integer
            required:
                - attempted
                - succeeded
            type: object
        StaffRetentionErased:
            description: What one erase cycle removed, per kind, summed over the people it erased; a kind no erase ran for is absent. The health kinds (health, cases, childSick, withdrawal, pregnancyHealth) are answered to a caller holding staff:personal-data alone.
            properties:
                kinds:
                    items:
                        $ref: '#/components/schemas/StaffErasedKind'
                    type: array
            required:
                - kinds
            type: object
        StaffRetentionRun:
            description: One run of the retention worker's two steps — an erase cycle and a pass over the deletion ledger — made by hand.
            properties:
                deletions:
                    $ref: '#/components/schemas/StaffRetentionDeletions'
                erased:
                    $ref: '#/components/schemas/StaffRetentionErased'
            required:
                - erased
                - deletions
            type: object
        StaffRetentionState:
            description: The retention run's state, derived from the deletion ledger and the history (no column of its own).
            properties:
                failingDeletions:
                    description: Ledger rows whose object the store has refused at least once; each is retried with a growing wait, without end, until the store confirms.
                    format: int64
                    type: integer
                lastErasedAt:
                    description: When the retention run last erased anything — the latest erased event; to a caller without staff:personal-data, the latest that erased something other than health content. Absent when it never has.
                    format: date-time
                    type: string
                oldestPendingSince:
                    description: When the oldest object still in the ledger was queued. Absent when the ledger is empty.
                    format: date-time
                    type: string
                pendingDeletions:
                    description: Objects queued for removal from the object store and not yet confirmed gone.
                    format: int64
                    type: integer
            required:
                - pendingDeletions
                - failingDeletions
            type: object
        StaffSelfCertPolicy:
            description: 'The self-certification (egenmelding) policy (design S10): minimum — the statutory one, 3 calendar days an occurrence and 4 occurrences in a rolling year; extended — 8 days an occurrence and 24 days in a rolling year; custom — the numbers as set.'
            enum:
                - minimum
                - extended
                - custom
            type: string
        StaffSelfCertWithdrawalRequest:
            description: 'A withdrawal of the right to egenmelding: until — after today, at most a year ahead — and the reason; until null lifts it.'
            properties:
                until:
                    format: date
                    nullable: true
                    type: string
                reason:
                    description: '1 to 500 characters; required with until.'
                    type: string
            type: object
        StaffSelfCertification:
            description: 'A person''s standing under the self-certification policy today (design S10, §4 Egenmelding): the limits by the policy''s name, the occurrences and calendar days used in the rolling year ending today — a run of contiguous egenmelding days, days off between included, being one occurrence — and the withdrawal.'
            properties:
                personId:
                    format: int64
                    type: integer
                policy:
                    $ref: '#/components/schemas/StaffSelfCertPolicy'
                daysPerOccurrence:
                    format: int32
                    type: integer
                occurrencesPerYear:
                    description: 'Absent under extended, which counts days.'
                    format: int32
                    type: integer
                daysPerYear:
                    description: 'Absent under minimum, which counts occurrences.'
                    format: int32
                    type: integer
                occurrencesUsed:
                    format: int32
                    type: integer
                daysUsed:
                    format: int32
                    type: integer
                eligibleFrom:
                    description: 'The first day the months of employment allow egenmelding. Absent when the person has no employment.'
                    format: date
                    type: string
                withdrawnUntil:
                    description: 'The last day of a withdrawal of the right (ftrl. § 8-27), to the readers of the care-day fields alone. Absent when none.'
                    format: date
                    type: string
                withdrawnReason:
                    description: 'Its reason, to the same readers.'
                    type: string
                withdrawnFrom:
                    description: 'The day HR decided the withdrawal, from which it applies; to the same readers.'
                    format: date
                    type: string
            required:
                - personId
                - policy
                - daysPerOccurrence
                - occurrencesUsed
                - daysUsed
            type: object
        StaffSettings:
            description: The Staff settings (design §3.6) as far as the deliveries so far expose them, the retention run's state, derived, and when each threshold was acknowledged, read-only. The other columns of the settings row reach the contract with the deliveries that use them. defaultAccountKind is the account kind a new person takes (Entra design D5), seeded once from the authority mode identity records — local from local, external from federated.
            properties:
                autoCarryOver:
                    description: Whether holiday left at a year's end is carried into the next as forced, without HR's action (design S9). false by default.
                    type: boolean
                autoCarryOverSince:
                    description: The day autoCarryOver was last turned on; the derived carry-over reaches no year before it. Absent when it never was.
                    format: date
                    type: string
                competenceReviewIntervalMonths:
                    description: The months after which a person in employment today is review-overdue (staff competence design S11) — counted from their latest competence review, or from the start of their current unbroken employment run when that is later; 0 to 60, 12 by default; 0 turns the overdue item off.
                    format: int32
                    type: integer
                createBeforeDays:
                    description: How many days before the account's effective date the accounts worker prepares it, disabled (design S22); 0 to 90, 14 by default.
                    format: int32
                    type: integer
                defaultAccountKind:
                    $ref: '#/components/schemas/StaffAccountKind'
                deleteExternalAfterDays:
                    description: 'How many days after a person''s last employment ended their external account in a provider''s directory is deleted — soft-deleted, restorable there for thirty days — once it is disabled and no legal hold is on the person; 1 to 3650, or absent for never.'
                    format: int32
                    type: integer
                directoryFields:
                    additionalProperties:
                        type: boolean
                    description: 'Which switchable fields of the directory profile (Entra design D8) a provider writes on a person''s external account, by key — employeeHireDate, employeeLeaveDateTime, employeeType, jobTitle, department, companyName, employeeOrgData, officeLocation, workAddress, phones, preferredLanguage, manager. By default every one but workAddress and phones. A field switched off is cleared in the directory on the next update.'
                    type: object
                employeeNumberPrefix:
                    description: What a generated employee number starts with, up to eight letters, digits or hyphens; empty for none.
                    type: string
                erasePregnancyHealthTypes:
                    description: 'Whether the retention run erases the pregnancy and health-appointment rows — svangerskapskontroll, svangerskapspermisjon, fødselspermisjon and helse — on the health schedule (B''s open question 11, decided by the owner): healthRetentionDays after the year a row ended, its type becomes a reserved one — absent_hr_only or absent_hr_only_hours for an HR-only type, so it still reads as leave to everyone who read it so, absent_hours for helse, an hour row keeping its hours — and every type value of its events is replaced, whatever class they were written in; the days stay. false by default. Turned on, it applies from the next retention cycle to every row already due; turned off, it restores nothing.'
                    type: boolean
                eraseSickCaseDates:
                    description: 'Whether a closed sick-leave case''s erase also removes the case itself (B''s open question 12, decided by the owner): its milestones and the case row are deleted, its rows unlinked — they keep their days as the reserved absent — and its events blanked to their kind. false by default: the case keeps its dates and its milestones'' kinds and dates. Turned on, it applies from the next retention cycle to every case already due, those erased before included; turned off, it restores nothing.'
                    type: boolean
                healthRetentionDays:
                    description: How many days after a person's last employment ended their health documents (those in a restricted category) are deleted by the retention run (design S15); 30 to 3650, 365 by default.
                    format: int32
                    type: integer
                injuryInsurer:
                    description: The occupational injury (yrkesskade) insurer. Absent when not set.
                    type: string
                nextEmployeeNumber:
                    description: The number the next generated employee number carries after the prefix, unpadded.
                    format: int64
                    type: integer
                pensionProvider:
                    description: The occupational pension (OTP) provider, which the § 14-6 check reads when a term names no social-security reference. Absent when not set.
                    type: string
                retention:
                    $ref: '#/components/schemas/StaffRetentionState'
                retentionGraceDays:
