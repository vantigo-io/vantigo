                mainPeriodVirkedager:
                    description: 18 (ferieloven § 7 (1)) to the entitlement. Left out, 18.
                    format: int32
                    type: integer
                maxCarryOverVirkedager:
                    description: 0 to 12 plus the entitlement's days above 25 (ferieloven § 7 (3)). Left out, 12.
                    format: int32
                    type: integer
                name:
                    description: 1 to 100 characters, unique however it is cased.
                    type: string
            required:
                - name
                - entitlementVirkedager
                - extraFrom60Virkedager
                - archived
            type: object
        StaffHolidaySchemeConverted:
            description: A scheme's figures in working days of a five-day week.
            properties:
                afterSeptember:
                    format: int32
                    type: integer
                entitlement:
                    format: int32
                    type: integer
                extraFrom60:
                    format: int32
                    type: integer
                mainPeriod:
                    format: int32
                    type: integer
                maxCarryOver:
                    format: int32
                    type: integer
            required:
                - entitlement
                - extraFrom60
                - mainPeriod
                - afterSeptember
                - maxCarryOver
            type: object
        StaffHolidaySchemeRequest:
            description: A new scheme. isDefault true makes it the default in place of the one there is.
            properties:
                afterSeptemberVirkedager:
                    description: 6 (ferieloven § 5 nr. 3) to the entitlement. Left out, 6.
                    format: int32
                    type: integer
                entitlementVirkedager:
                    description: 25 to 60.
                    format: int32
                    type: integer
                extraFrom60Virkedager:
                    description: 6 to 30.
                    format: int32
                    type: integer
                isDefault:
                    type: boolean
                mainPeriodVirkedager:
                    description: 18 (ferieloven § 7 (1)) to the entitlement. Left out, 18.
                    format: int32
                    type: integer
                maxCarryOverVirkedager:
                    description: 0 to 12 plus the entitlement's days above 25 (ferieloven § 7 (3)). Left out, 12.
                    format: int32
                    type: integer
                name:
                    description: 1 to 100 characters, unique however it is cased.
                    type: string
            required:
                - name
                - entitlementVirkedager
                - extraFrom60Virkedager
            type: object
        StaffLanguage:
