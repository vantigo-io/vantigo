components:
    schemas:
        PaginatedResponseOfStaffAbsence:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffAbsence'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffApproval:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffApproval'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffCase:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffCase'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffEvent:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffPersonListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffPersonListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        StaffAbsence:
            description: 'An absence as the caller may read it (design §5). A colleague (staff:view alone) reads spans of dates and nothing else — no row id, no status, no working days, no type (shownAs absent), no hour row, a person''s approved and registered day rows coalesced — so a sickness looks like any other absence. An hour row is read by the person, staff:personal-data and, for a type that is not HR-only, the readers of the type; never as leave. The person, their manager and HR read the status, the working days, the type and the detail; an HR-only type is shown as leave (shownAs leave, no typeId) to all but the person and staff:personal-data, and such a row then looks like any other leave: no hours, no note, the working days of its days, a registered row as approved (a status filter matches it so too), no revision, only while approved or registered — staff:personal-data alone decides it, so a request, a refusal or a cancel is not shown to them — and none of its events listed to them — they read its dates already, and the events'' count and kinds would tell a notification from a request. A write of a type drawing on the holiday account answers the accounts of the years it touches after it.'
            properties:
                id:
                    description: 'The row. Absent from a colleague''s span, which is no row: a colleague (staff:view alone) reads a person''s approved and registered days coalesced into spans, so a sykmelding over ferie or a row registered afterwards beside another reads as one span, and no hour row.'
                    format: int64
                    type: integer
                    x-go-type-skip-optional-pointer: true
                personId:
                    description: 'The person.'
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/StaffAbsenceStatus'
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day.'
                    format: date
                    type: string
                workingDays:
                    description: 'The working days from the first to the last day — Monday to Friday without public holidays — whatever the share; an hour row counts none, but one shown as leave counts its day. Absent to a colleague.'
                    format: int32
                    type: integer
                shownAs:
                    $ref: '#/components/schemas/StaffAbsenceShownAs'
                typeId:
                    description: 'The type, when the caller may read it (shownAs type).'
                    format: int64
                    type: integer
                percent:
                    description: 'The percentage of each day, to the person, their manager and HR.'
                    format: double
                    type: number
                hours:
                    description: 'The hours of an hour type''s one day.'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree.'
                    format: double
                    type: number
                note:
                    description: 'The note.'
                    type: string
                accounts:
                    description: 'On a write of a type drawing on the holiday account: the account of each year the row touches, after the write.'
                    items:
                        $ref: '#/components/schemas/StaffHolidayAccount'
                    type: array
                overdrawn:
                    description: 'On a write of a type drawing on the holiday account: whether taking every requested day would overdraw one of the accounts — a warning, never a refusal.'
                    type: boolean
                decisionNote:
                    description: 'The decider''s note on an approval or the reason for a rejection, with the detail — never on a row shown as leave, which carries no decision field.'
                    type: string
                revision:
                    description: 'The revision a change sends back in If-Match — to the person and to staff:manage with staff:personal-data only, who write the row and read it as it is. Nobody else is sent it: a registration stays at revision 1 and a decided request moves past it, so the number would tell which rows are notifications.'
                    format: int32
                    type: integer
                etag:
                    description: 'In place of the revision, to staff:manage without staff:personal-data — who writes every row but reads an HR-only one as leave — on every row alike: an opaque tag, sent back quoted in If-Match, that changes with the row and tells nothing of how often it has.'
                    type: string
            required:
                - personId
                - firstDay
                - lastDay
                - shownAs
            type: object
        StaffAbsenceDecisionRequest:
            additionalProperties: false
            description: 'A decision''s note: optional on an approval, the reason a rejection requires. At most 500 characters, class D; read with the row''s detail, never on a row shown as leave, and never in a mail.'
            properties:
                note:
                    type: string
            type: object
        StaffAbsenceChangeRequest:
            additionalProperties: false
            description: 'An absence''s fields, for a change (a full replace) and for one''s own new absence. A property this request does not name is refused, so the person learns it was not written.'
            properties:
                typeId:
                    description: 'The absence type.'
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day, the first day itself when left out; an hour type''s is its first day.'
                    format: date
                    type: string
                percent:
                    description: '1 to 100, two decimals, only on a type that allows a percentage (percent_not_allowed); 100 when left out.'
                    format: double
                    type: number
                hours:
                    description: '0.25 to 24 in quarter hours, only on a type counted in hours, which also needs it (hours_on_day_type).'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree, 1 to 100, two decimals — its share of each day; 100 when left out. Only on a sykmelding.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; never on a sick or child-sick type (absence_note_on_sick).'
                    type: string
            required:
                - typeId
                - firstDay
            type: object
        StaffAbsenceKind:
            description: What the rules key an absence type on (design §3.5). holiday draws on the holiday account; sick_self is egenmelding, sick_certified sykmelding, child_sick a sick child (omsorgsdager); leave, time_off and other are the rest. A company type is holiday, leave, time_off or other; the sick kinds are the seeds'.
            enum:
                - holiday
                - sick_self
                - sick_certified
                - child_sick
                - leave
                - time_off
                - other
            type: string
        StaffAbsenceRequest:
            additionalProperties: false
            description: 'A new absence for a person: the caller''s own, or — staff:manage — anyone''s. A property this request does not name is refused.'
            properties:
                personId:
                    description: 'The person it is for.'
                    format: int64
                    type: integer
                typeId:
                    description: 'The absence type.'
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day, the first day itself when left out; an hour type''s is its first day.'
                    format: date
                    type: string
                percent:
                    description: '1 to 100, two decimals, only on a type that allows a percentage (percent_not_allowed); 100 when left out.'
                    format: double
                    type: number
                hours:
                    description: '0.25 to 24 in quarter hours, only on a type counted in hours, which also needs it (hours_on_day_type).'
                    format: double
                    type: number
                degreePercent:
                    description: 'A sykmelding''s degree, 1 to 100, two decimals — its share of each day; 100 when left out. Only on a sykmelding.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; never on a sick or child-sick type (absence_note_on_sick).'
                    type: string
            required:
                - personId
                - typeId
                - firstDay
            type: object
        StaffAbsenceShownAs:
            description: 'How the caller is shown the row''s type: type (typeId names it), leave (an HR-only type to a manager or HR without staff:personal-data), or absent (a colleague, who reads no type).'
            enum:
                - type
                - leave
                - absent
            type: string
        StaffAbsenceStatus:
            description: 'requested (waiting for a decision), approved, rejected, cancelled, or registered (a notification, needing none).'
            enum:
                - requested
                - approved
                - rejected
                - cancelled
                - registered
            type: string
        StaffAbsenceType:
            description: An absence type (design S8, §3.5) — one of the seeds, the statutory vocabulary, or the company's own. key, kind and unit never change. A seed changes only its names, its order, whether it is hidden and whether it is paid (seed_immutable otherwise) — ammefri never unpaid — paid within aml. § 12-8 (2)'s limits, up to one hour a day in the child's first year on a working day of seven hours or more, nursing time beyond that unpaid by law unless agreed and registered with a company type of its own — nor svangerskapskontroll, paid time off for antenatal check-ups by aml. § 12-1; the reserved types are never shown and never offered.
            properties:
                allowsPercent:
                    description: Whether an absence of the type may be a percentage of each day. Never on a sick kind, whose share is the sykmelding's degree.
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    description: Whether its approved days are taken from the holiday account.
                    type: boolean
                hidden:
                    description: Not offered for a new absence, and listed to staff:manage alone.
                    type: boolean
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffAbsenceKind'
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    description: true — requested and decided (approved or rejected); false — a notification, registered when entered.
                    type: boolean
                paid:
                    description: Whether the absence is paid. Informational — no figure, the payroll export included, reads it. A seed's is HR's to change but ammefri's and svangerskapskontroll's, paid by law.
                    type: boolean
                reserved:
                    description: One of the four reserved types the erases write — absent in place of a sick or child-sick type; absent_hours in place of helse, counted in hours; absent_hr_only and absent_hr_only_hours (visibility hr_only) in place of an HR-only pregnancy type, days or hours, so the row reads as before to everyone who read it as leave. Always hidden.
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /absence-types/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the types every installation starts with.
                    type: boolean
                sort:
                    format: int32
                    type: integer
                unit:
                    $ref: '#/components/schemas/StaffAbsenceUnit'
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - id
                - key
                - names
                - kind
                - unit
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
                - seeded
                - hidden
                - reserved
                - sort
                - revision
            type: object
        StaffAbsenceTypeChangeRequest:
            additionalProperties: false
            description: A type replaced as a whole but for its key, kind and unit, which never change; its visibility widened from hr_only to absent only while no absence names it, and narrowed from absent to hr_only only while no absence of it approved by its own person has not ended (absence_type_in_use), and a property this schema does not name — key, kind or unit among them — is refused as a 400 naming it. A seed may change its names, sort, hidden and paid alone — every other value as it is, else seed_immutable — ammefri stays paid (aml. § 12-8 (2)), as does svangerskapskontroll (aml. § 12-1), and the reserved types stay hidden and unpaid.
            properties:
                allowsPercent:
                    description: Only on a type counted in days.
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    description: Only on a type counted in days.
                    type: boolean
                hidden:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    type: boolean
                paid:
                    type: boolean
                sort:
                    description: 1 to 1000.
                    format: int32
                    type: integer
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - names
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
                - hidden
                - sort
            type: object
        StaffAbsenceTypeNames:
            description: A type's name in English and in Norwegian bokmål, each 1 to 100 characters.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
                - nb
            type: object
        StaffAbsenceTypeRequest:
            description: A company type. The key is 1 to 40 characters of a–z, 0–9 and underscores, unique; the kind is holiday, leave, time_off or other (the sick kinds are the seeds'); kind and unit are fixed from now on. A percentage and drawing on the holiday account are for a type counted in days.
            properties:
                allowsPercent:
                    type: boolean
                ameldingLeave:
                    $ref: '#/components/schemas/StaffAmeldingLeave'
                drawsHoliday:
                    type: boolean
                hidden:
                    description: Left out, false.
                    type: boolean
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffAbsenceKind'
                names:
                    $ref: '#/components/schemas/StaffAbsenceTypeNames'
                needsDecision:
                    type: boolean
                paid:
                    type: boolean
                sort:
                    description: 1 to 1000. Left out, after every type there is.
                    format: int32
                    type: integer
                unit:
                    $ref: '#/components/schemas/StaffAbsenceUnit'
                visibility:
                    $ref: '#/components/schemas/StaffAbsenceVisibility'
            required:
                - key
                - names
                - kind
                - unit
                - paid
                - drawsHoliday
                - allowsPercent
                - needsDecision
                - visibility
            type: object
        StaffAbsenceUnit:
            description: days, or hours for a registration of part of one day.
            enum:
                - days
                - hours
            type: string
        StaffAbsenceVisibility:
            description: absent — colleagues see "absent", the manager and HR the type; hr_only — the manager sees "leave", the type is staff:personal-data's (and the person's own).
            enum:
                - absent
                - hr_only
            type: string
        StaffAccountEmailKind:
            description: 'Which of the person''s addresses Staff gives identity for their account: work (the work email) or private (the private email).'
            enum:
                - work
                - private
            type: string
        StaffAccountInvitation:
            description: A pending account's invitation to choose a password, as identity reports it.
            properties:
                issued:
                    description: The invitations delivered in the account's current pending spell.
                    format: int32
                    type: integer
                state:
                    description: 'none — none, or none needed; active — one can be accepted; expired — the latest lapsed unanswered; revoked_by_owner — an Owner revoked it, and only Run now issues another; exhausted — three went unanswered, and only Run now issues another.'
                    enum:
                        - none
                        - active
                        - expired
                        - revoked_by_owner
                        - exhausted
                    type: string
            required:
                - state
                - issued
            type: object
        StaffAccountKind:
            description: 'Who holds a person''s account authority (Entra design D5): local — identity holds the credentials, so Staff creates the user, invites them and gives the provisioning roles; external — an identity provider owns the account, so Staff only finds the user it created (an Owner adopts it), re-enables what Staff disabled and disables; entra — the provider in the IdentityProvisioner slot keyed entra holds the account, which Staff has it create, enable, update and disable, and announces to identity so the user it creates is adopted with no Owner in between, the provisioning roles given once. The kind travels on every call to identity, in place of the installation''s authority mode.'
            enum:
                - local
                - external
                - entra
            type: string
        StaffAccountLink:
            description: 'The person''s link to a user under the identity provider, as the accounts worker and HR left it (design S27, §3.6). Codes only: the reason and the invitation never carry an address or a driver''s words.'
            properties:
                attempts:
                    description: The worker's failed attempts at its last step; 0 after a success.
                    format: int32
                    type: integer
                invitation:
                    $ref: '#/components/schemas/StaffAccountInvitation'
                lastSyncedAt:
                    description: When the worker last brought the account in line with the record. Absent when it never has.
                    format: date-time
                    type: string
                managed:
                    description: Whether Staff manages the user (the accounts worker's link), as opposed to HR's self-service link to an existing user.
                    type: boolean
                nextAttemptAt:
                    description: When the worker next looks at the link. Absent when it has no attempt planned.
                    format: date-time
                    type: string
                reason:
                    description: 'Why the worker is blocked on the link, a code (blocked_reason), absent when it is not: no_employment, account_email_missing, blocked_by_owner, disabled_by_owner, user_gone, mismatch, mode_changed, email_differs, invitation_revoked, invitation_unanswered, account_not_managed, account_privileged (from the decision table); not_found, employee_role_missing, employee_role_unsafe, account_email_taken, employee_number_taken, mode_mismatch, invalid_actor (from identity''s answer, or the mode).'
                    type: string
                state:
                    description: 'preparing (the worker is creating or finding the user — no user yet), linked (HR''s self-service link), pending, active, disabled, failed or blocked.'
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
            required:
                - state
                - managed
                - attempts
            type: object
        StaffAccountPass:
            description: The Temporary Access Pass the provider issued for the person's external account, answered once (POST /people/{id}/account/pass) with Cache-Control no-store and never again — the provider keeps it sealed until then. Each reveal is a pass_revealed event naming the viewer and never the pass.
            properties:
                expiresAt:
                    description: When the pass stops working, as the provider says.
                    format: date-time
                    type: string
                pass:
                    description: The pass itself, as the person types it at their first sign-in.
                    type: string
            required:
                - pass
                - expiresAt
            type: object
        StaffAccountsRun:
            description: 'What one accounts cycle run by hand did (POST /accounts/run): the links it claimed, those whose step identity answered — carried out, or refused with a reason the link now records — those that failed to be called and are retried, and the due links it did not reach.'
            properties:
                attempted:
                    description: The links the run claimed and worked.
                    format: int32
                    type: integer
                done:
                    description: Of those, the links whose step was carried out, or answered with a reason (blocked) — none to retry.
                    format: int32
                    type: integer
                failed:
                    description: Of those, the links whose call could not be made (identity unreachable or timed out); last_error is set and the worker retries them.
                    format: int32
                    type: integer
                remaining:
                    description: The due links left when the run ended — its budget of sixty seconds or fifty links spent, or claimed meanwhile by the worker — which the worker's next cycle takes.
                    format: int32
                    type: integer
            required:
                - attempted
                - done
                - failed
                - remaining
            type: object
        StaffAmeldingLeave:
            description: The a-melding's permisjonsOgPermitteringsBeskrivelse a leave of the type is reported as — the six leave descriptions and permittering, in NAV's spellings. Absent when the type is not reported as leave. The codes velferdspermisjon and utdanningspermisjon expired on 31 December 2022 and are not among them.
            enum:
                - permisjonMedForeldrepenger
                - permisjonVedMilitaertjeneste
                - utdanningspermisjonLovfestet
                - utdanningspermisjonIkkeLovfestet
                - andreLovfestedePermisjoner
                - andreIkkeLovfestedePermisjoner
                - permittering
            type: string
        StaffAppointmentForm:
            description: The a-melding's ansettelsesform. fast and fast_utleid go with a permanent employment, the other three with a temporary one.
            enum:
                - fast
                - midlertidig
                - fast_utleid
                - midlertidig_utleid
                - midlertidig_tilkallingsvikar
            type: string
        StaffAssignableUser:
            description: An active user HR may link a person to, as the user directory names them.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        StaffAvailabilityDeclaration:
            description: One row of a person's availability declaration (staff competence design S10) — recurring, on a weekday, between optional first and last days, or dated, from fromDate to toDate (fromDate alone without toDate); the whole day, or from startMinute to endMinute. Data only — nothing in Staff enforces or sums it. Read by the person, their managers today, staff:manage and staff:personal-data.
            properties:
                endMinute:
                    description: The minute of the day the row ends, 0 to 1440, after startMinute. Absent, with startMinute, for the whole day.
                    format: int32
                    type: integer
                fromDate:
                    description: A dated row's day, or its first day; a recurring row's first day, when bounded. Absent on a recurring row without a first day.
                    format: date
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffAvailabilityKind'
                seenAt:
                    description: When the person's manager or HR stamped the row Seen. Absent when it has not been seen since it was written.
                    format: date-time
                    type: string
                startMinute:
                    description: The minute of the day the row starts, 0 to 1440, before endMinute. Absent, with endMinute, for the whole day.
                    format: int32
                    type: integer
                toDate:
                    description: The last day, on or after fromDate. Absent on a dated row of one day and on a recurring row without a last day.
                    format: date
                    type: string
                weekday:
                    description: A recurring row's ISO weekday, 1 (Monday) to 7 (Sunday). Absent on a dated row.
                    format: int32
                    type: integer
            required:
                - kind
            type: object
        StaffAvailabilityKind:
            description: What the person declares for the row's days and hours — available, unavailable or preferred.
            enum:
                - available
                - unavailable
                - preferred
            type: string
        StaffAvailabilityList:
            description: A person's availability declaration, every row — the recurring rows by weekday first, then the dated ones by day, each by its start.
            properties:
                declarations:
                    items:
                        $ref: '#/components/schemas/StaffAvailabilityDeclaration'
                    type: array
            required:
                - declarations
            type: object
        StaffAvailabilityRequest:
            additionalProperties: false
            description: 'A person''s availability declaration, every row — a full replace, by the person alone; an empty list removes it. At most fifty rows, each keyed by its index when a field does not pass (declarations[0].fromDate): weekday 1 to 7 or absent; without a weekday, fromDate is required; toDate on or after fromDate; startMinute and endMinute both or neither, 0 to 1440, endMinute after startMinute; a row equal in every field to another sent is refused on the later index. A property a row does not name is refused.'
            properties:
                declarations:
                    items:
                        additionalProperties: false
                        properties:
                            endMinute:
                                description: The minute of the day the row ends, 0 to 1440, after startMinute. Absent, with startMinute, for the whole day.
                                format: int32
                                type: integer
                            fromDate:
                                description: A dated row's day, or its first day; a recurring row's first day, when bounded. Absent on a recurring row without a first day.
                                format: date
                                type: string
                            kind:
                                $ref: '#/components/schemas/StaffAvailabilityKind'
                            startMinute:
                                description: The minute of the day the row starts, 0 to 1440, before endMinute. Absent, with endMinute, for the whole day.
                                format: int32
                                type: integer
                            toDate:
                                description: The last day, on or after fromDate. Absent on a dated row of one day and on a recurring row without a last day.
                                format: date
                                type: string
                            weekday:
                                description: A recurring row's ISO weekday, 1 (Monday) to 7 (Sunday). Absent on a dated row.
                                format: int32
                                type: integer
                        required:
                            - kind
                        type: object
                    maxItems: 50
                    type: array
            required:
                - declarations
            type: object
        StaffBankAccountKind:
            enum:
                - bban
                - iban
            type: string
        StaffBankAccountRequest:
            description: 'A bank account to seal on the person (design S4): a Norwegian kontonummer (bban, eleven digits with a valid MOD11 control digit; spaces and full stops are dropped) or an IBAN (spaces dropped; the ISO 13616 check digits, and for a Norwegian IBAN the embedded account''s MOD11). The value is sealed; only its kind and last four digits are kept in clear, and no refusal echoes it.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBankAccountReveal:
            description: The bank account on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a bank_account_revealed event naming the viewer.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number as it was sealed — normalised, without spaces.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitSummary:
            description: A business unit as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canDecide:
                    description: 'staff:approve or staff:manage, or managing anyone today — decides absence requests (delivery B).'
                    type: boolean
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: staff:personal-data — everyone's health documents. The person reads their own whatever this says.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
                managesAnyone:
                    description: The caller's linked person manages anyone today by the one manager rule — a manager who has left manages nobody. Drives My team.
                    type: boolean
                canRunAccounts:
                    description: staff:manage — runs the accounts worker by hand and disables an account now (delivery C).
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canSeeHealth
                - canDecide
                - managesAnyone
                - canRunAccounts
            type: object
        StaffCareDays:
            description: 'A person''s care days (omsorgsdager) for a year (design S11, ftrl. § 9-6 and § 9-8). Using more than the entitlement is shown (exceeded), never refused.'
            properties:
                personId:
                    format: int64
                    type: integer
                year:
                    format: int32
                    type: integer
                recorded:
                    description: 'Whether the care-day fields are recorded on the person; the entitlement is 0 while they are not.'
                    type: boolean
                childrenCounted:
                    description: 'childrenUnder12 + chronicallyIllChildren.'
                    format: int32
                    type: integer
                entitlement:
                    description: '10 for one or two children, 15 for three or more, doubled for a sole carer; plus 10 per chronically ill or disabled child, 20 for a sole carer.'
                    format: int32
                    type: integer
                used:
                    description: 'The year''s registered child-sick working days on which the person had the right — four weeks into an unbroken employment.'
                    format: int32
                    type: integer
                ineligibleDays:
                    description: 'The year''s child-sick working days before the right: not care days, not counted in used.'
                    format: int32
                    type: integer
                remaining:
                    description: 'entitlement − used; below zero when exceeded.'
                    format: int32
                    type: integer
                exceeded:
                    type: boolean
                employerPaid:
                    description: 'The used days the employer bears itself: the first ten.'
                    format: int32
                    type: integer
                beyondEmployer:
                    description: 'The used days beyond the first ten, which NAV refunds.'
                    format: int32
                    type: integer
                eligible:
                    description: 'Whether four weeks'' employment has given the right today (ftrl. § 9-8).'
                    type: boolean
                eligibleFrom:
                    description: 'The day the right starts: four weeks after the start of the unbroken employment in force today — an employment beginning the day after another ended continues it. Absent when no employment is in force today.'
                    format: date
                    type: string
            required:
                - personId
                - year
                - recorded
                - childrenCounted
                - entitlement
                - used
                - ineligibleDays
                - remaining
                - exceeded
                - employerPaid
                - beyondEmployer
                - eligible
            type: object
        StaffCarryOverRequest:
            description: 'A carry-over of fromYear''s untaken holiday into the year after.'
            properties:
                fromYear:
                    description: 'The year the days come from.'
                    format: int32
                    type: integer
                kind:
                    description: agreed (capped by the scheme) or forced (uncapped, with a note).
                    enum:
                        - agreed
                        - forced
                    type: string
                    x-enum-varnames:
                        - StaffCarryOverKindAgreed
                        - StaffCarryOverKindForced
                days:
                    description: 'Working days, one decimal, above zero; the year''s remaining rounded down to a tenth when left out.'
                    format: double
                    type: number
                note:
                    description: 'At most 500 characters; required for forced.'
                    type: string
            required:
                - fromYear
                - kind
            type: object
        StaffCase:
            description: 'A sick-leave case (design S10, §3.5): the sickness its egenmelding and sykmelding rows gather under, its follow-up milestones and its notes; there is no field for a diagnosis. Class E whole. Optional fields are absent when not recorded or not the caller''s to read.'
            properties:
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                firstDay:
                    description: 'The first day of its first row.'
                    format: date
                    type: string
                lastDay:
                    description: 'The last day of its last row.'
                    format: date
                    type: string
                open:
                    description: 'HR has not closed it and its last day is at most sixteen days ago: a sick row from today would join it.'
                    type: boolean
                closedAt:
                    description: 'When HR closed it. Absent when HR has not.'
                    format: date-time
                    type: string
                maxBenefitEstimate:
                    description: 'The 52-week end, an estimate NAV may correct: first day + 364 unless HR edited it.'
                    format: date
                    type: string
                maxBenefitEstimateEdited:
                    description: 'Whether HR set the estimate.'
                    type: boolean
                accommodationNote:
                    description: 'Functional notes about tilrettelegging — to the person, their manager and HR; never the Approver.'
                    type: string
                milestones:
                    items:
                        $ref: '#/components/schemas/StaffCaseMilestone'
                    type: array
                etag:
                    description: 'In place of the revision, to a reader who writes the case but does not read its health group (the manager, staff:manage without staff:personal-data): an opaque tag that changes with every write, sent back as If-Match (quoted) on PUT /cases/{id}. A bare revision from such a reader is revision_conflict.'
                    type: string
                revision:
                    description: 'Send it back as If-Match on PUT /cases/{id}. Read by the health group alone — the person and staff:personal-data — since it moves with the accommodation note; the Approver, who writes no note, reads neither it nor etag.'
                    format: int32
                    type: integer
                    x-go-type-skip-optional-pointer: true
            required:
                - id
                - personId
                - firstDay
                - lastDay
                - open
                - maxBenefitEstimate
                - maxBenefitEstimateEdited
                - milestones
            type: object
        StaffCaseChangeRequest:
            description: 'A case''s notes: a field left out is kept, one sent is written, null clearing it — the accommodation note by the manager and HR, the estimate by staff:manage alone (sent by anyone else, a 400), null returning it to the derived first day + 364.'
            properties:
                accommodationNote:
                    description: 'At most 2000 characters; null or empty clears it, left out keeps it.'
                    nullable: true
                    type: string
                maxBenefitEstimate:
                    description: 'staff:manage''s; null returns it to first day + 364, left out keeps it.'
                    format: date
                    nullable: true
                    type: string
            type: object
        StaffCaseMilestone:
            description: 'One of a case''s follow-up milestones, dated from its first day — the end of the arbeidsgiverperiode on its sixteenth sick day.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffMilestoneKind'
                dueDate:
                    description: 'Its date. Absent for employer_period_end until the case reaches its sixteenth sick day.'
                    format: date
                    type: string
                due:
                    description: 'Whether it applies: not done or waived, the case open and lasted to within a week of its date (a three-day case has none due).'
                    type: boolean
                doneAt:
                    description: 'The day it was marked done. Absent when not.'
                    format: date
                    type: string
                waived:
                    type: boolean
                waivedReason:
                    description: 'Why it was waived as plainly unnecessary — never a diagnosis; class E, to the person and staff:personal-data only. Absent when not waived.'
                    type: string
                note:
                    description: 'Its note, class E: to the person and staff:personal-data only.'
                    type: string
                revision:
                    description: 'Send it back as If-Match on PUT /cases/{id}/milestones/{kind}/note. Read by the health group alone — the person and staff:personal-data — since it moves with the note.'
                    format: int32
                    type: integer
                    x-go-type-skip-optional-pointer: true
            required:
                - kind
                - due
                - waived
            type: object
        StaffCaseStatus:
            description: 'Which cases a list answers: open, closed, or all.'
            enum:
                - open
                - closed
                - all
            type: string
        StaffCompetence:
            description: A competence in the catalogue (staff competence design S1) — a skill, a proficiency with a level of 0 to 4 when hasLevel and never a validity, or a certificate, issued by someone and valid for validityMonths or without end. One of the fifteen Norwegian certificates every installation starts with (seeded) keeps its key, kind, hasLevel and validityMonths; its names, reminderLeadDays, issuerHint and hidden change. A hidden or archived competence is offered for no new row and keeps every row that names it.
            properties:
                archivedAt:
                    description: When the competence was archived. Absent while it is in use.
                    format: date-time
                    type: string
                basis:
                    description: The regulation a seeded certificate rests on. Absent on the company's own.
                    type: string
                categoryId:
                    format: int64
                    type: integer
                hasLevel:
                    description: Every row of the competence carries a level of 0 to 4, and none without.
                    type: boolean
                hidden:
                    description: Offered for no new row; a seed is hidden rather than archived.
                    type: boolean
                id:
                    format: int64
                    type: integer
                issuerHint:
                    description: The issuer the law names, offered when a row is entered.
                    type: string
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffCompetenceKind'
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
                reminderLeadDays:
                    description: How many days before a row's validTo it is reminded of and shown as expiring, 0 to 365. Absent without a validity.
                    format: int32
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /competences/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the fifteen certificates every installation starts with.
                    type: boolean
                sort:
                    format: int32
                    type: integer
                validityMonths:
                    description: How long a certificate is valid from its issue, 1 to 240 months. Absent on a skill and on a certificate without end.
                    format: int32
                    type: integer
            required:
                - id
                - categoryId
                - key
                - names
                - kind
                - hasLevel
                - seeded
                - hidden
                - sort
                - revision
            type: object
        StaffCompetenceCategory:
            description: A competence category (staff competence design S1) — one of the five seeds (fag, sertifikat, sprak, verktoy, domene) or the company's own. A seeded category never changes; an archived one is offered for no new competence, and only a category no competence in use is filed under is archived.
            properties:
                archivedAt:
                    description: When the category was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
                revision:
                    description: Send it back as If-Match on PUT /competence-categories/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the five categories every installation starts with.
                    type: boolean
                sort:
                    format: int32
                    type: integer
            required:
                - id
                - key
                - names
                - seeded
                - sort
                - revision
            type: object
        StaffCompetenceCategoryChangeRequest:
            description: A category's names and whether it is archived. Its key never changes. A seeded category is refused seed_immutable; archiving a category a competence not archived is filed under is refused category_in_use.
            properties:
                archived:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
            required:
                - names
                - archived
            type: object
        StaffCompetenceCategoryRequest:
            description: A company category. The key is 1 to 40 characters of a–z, 0–9 and hyphens, unique, and fixed from now on.
            properties:
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
            required:
                - key
                - names
            type: object
        StaffCompetenceChangeRequest:
            additionalProperties: false
            description: A competence replaced as a whole but for its key and kind, which never change here, and a property this schema does not name — key or kind among them — is refused as a 400 naming it. A seed may change its names, reminderLeadDays, issuerHint and hidden alone — every other value as it is, else seed_immutable; a company competence's hasLevel is fixed once a person's row names it (competence_in_use). validityMonths only on a certificate, reminderLeadDays only with a validity, and given a validity without a lead the lead is 30 days for a validity of up to 12 months, 60 up to 24 and 180 beyond.
            properties:
                archived:
                    type: boolean
                categoryId:
                    description: A category not archived.
                    format: int64
                    type: integer
                hasLevel:
                    type: boolean
                hidden:
                    type: boolean
                issuerHint:
                    description: At most 200 characters. Left out, cleared.
                    type: string
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
                reminderLeadDays:
                    description: 0 to 365, only with a validity. Left out, the default for the validity.
                    format: int32
                    type: integer
                validityMonths:
                    description: 1 to 240, only on a certificate. Left out, without end.
                    format: int32
                    type: integer
            required:
                - categoryId
                - names
                - hasLevel
                - hidden
                - archived
            type: object
        StaffCompetenceEvidence:
            description: The document a row's evidence is, filed in the person's archive under the certificate category; downloaded through GET /person-competences/{id}/evidence by everyone who reads the row's detail — the person, their manager, staff:approve and HR — and through the document's own download by those who read the person's documents.
            properties:
                contentType:
                    type: string
                documentId:
                    format: int64
                    type: integer
                fileName:
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
            required:
                - documentId
                - fileName
                - contentType
                - sizeBytes
            type: object
        StaffCompetenceKind:
            description: skill, a proficiency with a level and never a validity, or certificate, issued by someone, with evidence and a validity or none.
            enum:
                - skill
                - certificate
            type: string
        StaffCompetenceNames:
            description: A competence's or a category's name in English and in Norwegian bokmål, each 1 to 100 characters.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
                - nb
            type: object
        StaffCompetenceRenewRequest:
            description: The renewed certificate or skill, written as a new row that supersedes the current one; the old row keeps its dates and evidence, and the new row keeps its level. validFrom left out is issuedOn, else today; validTo left out is issuedOn plus the competence's validityMonths when both are known, else without end; validTo before validFrom is a field error. issuer at most 200 characters, reference at most 100.
            properties:
                issuedOn:
                    format: date
                    type: string
                issuer:
                    type: string
                reference:
                    type: string
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    type: string
            type: object
        StaffCompetenceRequest:
            description: A company competence. The key is 1 to 60 characters of a–z, 0–9 and hyphens, unique; the key and the kind are fixed from now on. validityMonths (1 to 240) only on a certificate, reminderLeadDays (0 to 365) only with a validity, and given a validity without a lead the lead is 30 days for a validity of up to 12 months, 60 up to 24 and 180 beyond. issuerHint at most 200 characters.
            properties:
                categoryId:
                    description: A category not archived.
                    format: int64
                    type: integer
                hasLevel:
                    type: boolean
                issuerHint:
                    type: string
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffCompetenceKind'
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
                reminderLeadDays:
                    format: int32
                    type: integer
                validityMonths:
                    format: int32
                    type: integer
            required:
                - categoryId
                - key
                - names
                - kind
                - hasLevel
            type: object
        StaffCompetenceReview:
            description: A competence review (staff competence design S11) — the day the person and whoever may verify their competences went through the person's Competence tab together. No notes and no goals.
            properties:
                id:
                    format: int64
                    type: integer
                recordedAt:
                    description: When the review was recorded.
                    format: date-time
                    type: string
                reviewedOn:
                    format: date
                    type: string
                reviewer:
                    description: The reviewer's name, as the user directory names them.
                    type: string
            required:
                - id
                - reviewedOn
                - reviewer
                - recordedAt
            type: object
        StaffCompetenceReviewRequest:
            additionalProperties: false
            description: A competence review being recorded. reviewedOn left out is today; a day after today is refused on reviewedOn. The body may be left out altogether.
            properties:
                reviewedOn:
                    format: date
                    type: string
            type: object
        StaffCompetenceSummary:
            description: The competence a person's row names, as every row carries it, archived or not.
            properties:
                archived:
                    description: The competence is archived; the row keeps it.
                    type: boolean
                categoryId:
                    format: int64
                    type: integer
                hasLevel:
                    type: boolean
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffCompetenceKind'
                names:
                    $ref: '#/components/schemas/StaffCompetenceNames'
            required:
                - id
                - key
                - names
                - kind
                - hasLevel
                - categoryId
                - archived
            type: object
        StaffCompetenceVerifyRequest:
            description: The verifier's stamp on a row. level is the level the verifier agrees to, which may lower or raise the person's — required on a competence with a level (level_required) and refused on one without (level_not_allowed); note at most 200 characters, never in an event.
            properties:
                basis:
                    description: evidence (the verifier has seen the evidence) or observed (the verifier has seen the work).
                    enum:
                        - evidence
                        - observed
                    type: string
                level:
                    description: 0 to 4.
                    format: int32
                    type: integer
                note:
                    type: string
            required:
                - basis
            type: object
        StaffContractCheck:
            description: The § 14-6 check of one employment (design S5).
            properties:
                contractSigned:
                    description: Whether the employment records a signed contract (contractSignedAt).
                    type: boolean
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentId:
                    format: int64
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/StaffContractCheckItem'
                    type: array
                termsId:
                    description: The terms row judged. Absent when the employment has none.
                    format: int64
                    type: integer
            required:
                - employmentId
                - items
                - contractSigned
            type: object
        StaffContractCheckItem:
            properties:
                item:
                    description: The letter of aml. § 14-6 (1), a to q.
                    type: string
                source:
                    description: Where the item is read from, as the contract names the fields (terms.locationId, employment.startDate, settings.pensionProvider …).
                    type: string
                state:
                    description: present, missing, or not_applicable when the item does not apply to this employment (e when permanent, f without a probation, l without a special arrangement, n without a tariff when not hired out, o when not hired out).
                    enum:
                        - present
                        - missing
                        - not_applicable
                    type: string
            required:
                - item
                - state
                - source
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffDepartmentSummary:
            description: A department as the work group names it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
            type: object
        StaffDirectoryField:
            description: 'One row of the directory profile (Entra design D8): a field the provider writes on the person''s external account, whether the installation writes it, and the value it would carry today. The non-switchable rows — givenName, familyName, displayName, employeeId, userPrincipalName, usageLocation — are always written and listed greyed; the switchable ones — employeeHireDate, employeeLeaveDateTime, employeeType, jobTitle, department, companyName, employeeOrgData, officeLocation, workAddress, phones, preferredLanguage, manager — follow the settings'' directoryFields.'
            properties:
                key:
                    description: The row's key, one of the eighteen above.
                    type: string
                "on":
                    description: Whether the provider writes it — always true for a row that is not switchable. A row switched off is cleared in the directory on the next update.
                    type: boolean
                switchable:
                    description: Whether the installation may switch it off (Settings, directoryFields).
                    type: boolean
                value:
                    description: 'The value the row would carry today, from the register: the terms'' title for jobTitle, the department''s name, the legal entity''s name for companyName, the terms'' employee type, the cost centre and division for employeeOrgData, the location''s name for officeLocation and its street, postal code, city and country for workAddress, the work and mobile phones, nb-NO or en-GB for preferredLanguage, the manager''s display name. Absent when the register holds none — the provider then clears the field.'
                    type: string
            required:
                - key
                - "on"
                - switchable
            type: object
        StaffDocument:
            description: 'One document in a person''s archive (design S14, §3.6). The bytes are never in a JSON body: they are read from GET /documents/{id}, with the document''s own visibility. Optional fields are absent when not recorded.'
            properties:
                category:
                    $ref: '#/components/schemas/StaffDocumentCategorySummary'
                caseId:
                    description: The sick-leave case a health document belongs to, whose erase reaches it (S15). Only a document in a restricted category names one.
                    format: int64
                    type: integer
                contentType:
                    description: The type the file's own bytes were sniffed as on upload — application/pdf, image/jpeg, image/png or image/heic.
                    type: string
                employmentId:
                    description: The employment the document belongs to — the one covering signedAt, else the upload day, when exactly one does; HR may set it. It is what the erase of class A documents goes by. Absent when none.
                    format: int64
                    type: integer
                fileName:
                    description: The name the file was uploaded under, without any path, at most 255 characters.
                    type: string
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /documents/{id}.
                    format: int32
                    type: integer
                signedAt:
                    description: The day the document was signed. Absent when not recorded.
                    format: date
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
                validTo:
                    description: The last day the document is valid — a certificate's expiry. Absent when not recorded.
                    format: date
                    type: string
            required:
                - id
                - personId
                - category
                - fileName
                - contentType
                - sizeBytes
                - uploadedAt
                - revision
            type: object
        StaffDocumentCategory:
            description: A document category (design S14) — one of the six seeds or the company's own. Its retention class is fixed when it is created; restricted (a health category, readable only by the person and staff:personal-data) is true exactly when the class is E. A seeded category never changes; an archived one is offered for no new document, and only a category no document is filed under is archived.
            properties:
                archivedAt:
                    description: When the category was archived. Absent while it is in use.
                    format: date-time
                    type: string
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
                restricted:
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /document-categories/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the six categories every installation starts with — contract, attest, certificate, correspondence, health, other.
                    type: boolean
                sort:
                    format: int32
                    type: integer
            required:
                - id
                - key
                - names
                - class
                - restricted
                - seeded
                - sort
                - revision
            type: object
        StaffDocumentCategoryChangeRequest:
            description: A category's names and whether it is archived. Its key and class never change. A seeded category is refused seed_immutable; archiving a category documents are still filed under is refused category_in_use.
            properties:
                archived:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
            required:
                - names
                - archived
            type: object
        StaffDocumentCategoryNames:
            description: A category's name in English and in Norwegian bokmål, each 1 to 100 characters.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
                - nb
            type: object
        StaffDocumentCategoryRequest:
            description: A company category. The key is 1 to 40 characters of a–z, 0–9 and hyphens, unique; the class is A (five years after the employment's end year), D (with the personnel record, after the grace) or E (health), and is fixed from now on; restricted follows from it.
            properties:
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
            required:
                - key
                - names
                - class
            type: object
        StaffDocumentCategorySummary:
            description: The category a document is filed under, as every document carries it.
            properties:
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
                restricted:
                    type: boolean
            required:
                - id
                - key
                - names
                - class
                - restricted
            type: object
        StaffDocumentChangeRequest:
            description: A document's category and dates, replaced whole — a date left out is cleared. employmentId is replaced only when the body names it — null clears it, and left out it stays as it is — since the upload derived it. Moving a document into or out of a restricted category needs staff:personal-data (category_restricted). employmentId must name one of the person's employments. caseId, likewise replaced only when named, files a document of a restricted category under one of the person's sick-leave cases (staff:personal-data); a document moved out of a restricted category leaves its case.
            properties:
                caseId:
                    description: One of the person's sick-leave cases, for a document of a restricted category; null clears it; left out, the document keeps its own.
                    format: int64
                    nullable: true
                    type: integer
                categoryId:
                    format: int64
                    type: integer
                employmentId:
                    description: One of the person's employments; null clears it; left out, the document keeps its own.
                    format: int64
                    nullable: true
                    type: integer
                signedAt:
                    format: date
                    type: string
                validTo:
                    format: date
                    type: string
            required:
                - categoryId
            type: object
        StaffDocumentClass:
            description: A document category's retention class (design S15) — A pay and contract documentation, five years after the year the employment ended; D personnel administration, with the record after the grace; E health.
            enum:
                - A
                - D
                - E
            type: string
        StaffEmployeeType:
            description: The kind of worker, for an identity provider.
            enum:
                - employee
                - contractor
                - consultant
                - intern
            type: string
        StaffEmployment:
            description: 'An employment (design §3.2), shaped by who is asking (§5): the dates are everyone''s who may see the person; the other fields are the employment group''s — the person themselves, a manager of theirs and HR; salaryChangedAt is the pay group''s — the person and HR. A field the caller may not read is absent, never null.'
            properties:
                businessUnitId:
                    format: int64
                    type: integer
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentNumber:
                    description: The a-melding's arbeidsforholdID. Never changes.
                    type: string
                endDate:
                    description: The last day worked. Absent while open-ended.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
                fteChangedAt:
                    description: 'The date the stillingsprosent in force today (or at the start, before it; at the end, after it) took effect: the earliest row of the unbroken run of rows with that percentage. Derived, never typed.'
                    format: date
                    type: string
                holidaySchemeId:
                    description: The holiday scheme the employment follows — the employment group's. Absent when it follows the default.
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                salaryChangedAt:
                    description: The date the pay in force today took effect, judged on the pay components as a list sorted by name and amount and compared on those two alone. Derived, never typed.
                    format: date
                    type: string
                startDate:
                    format: date
                    type: string
            required:
                - id
                - personId
                - startDate
                - revision
            type: object
        StaffEmploymentChangeRequest:
            description: An employment's own fields, replaced as a whole. The end is written through POST /employments/{id}/end.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived unless the employment is already in it.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed. Left out, it is cleared.
                    format: date
                    type: string
                employmentNumber:
                    description: 'Never changes: left out, or the employment''s own.'
                    type: string
                holidaySchemeId:
                    description: A holiday scheme, not archived unless the employment already follows it. Left out, the default.
                    format: int64
                    type: integer
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                startDate:
                    description: The first day of the employment; the first terms row moves with it.
                    format: date
                    type: string
            required:
                - startDate
                - relationshipType
                - businessUnitId
            type: object
        StaffEmploymentEndRequest:
            properties:
                endDate:
                    description: The last day worked, on or after the start; it may lie in the future.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
            type: object
        StaffEmploymentRequest:
            description: A new employment and its first terms row.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived. Left out, the default one.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed.
                    format: date
                    type: string
                employmentNumber:
                    description: 1 to 40 letters, digits or hyphens, unique however cased. Left out, it is generated as <employee number>-<n>.
                    maxLength: 40
                    type: string
                holidaySchemeId:
                    description: A holiday scheme, not archived. Left out, the default.
                    format: int64
                    type: integer
                relationshipType:
                    allOf:
                        - $ref: '#/components/schemas/StaffRelationshipType'
                    description: Left out, ordinary.
                startDate:
                    description: The first day of the employment.
                    format: date
                    type: string
                terms:
                    $ref: '#/components/schemas/StaffTermsRequest'
            required:
                - startDate
                - terms
            type: object
        StaffEmploymentType:
            description: fast (permanent) or midlertidig (temporary).
            enum:
                - fast
                - midlertidig
            type: string
        StaffEndReason:
            description: 'The a-melding''s six end reasons (sluttårsak): employee_resigned, employer_terminated, contract_ended (a contract, engagement or temporary employment ran out), wrongly_reported (the employment should never have been reported), internal_change (a change in the organisation or an internal move), payroll_system_change (a change of payroll system or accountant).'
            enum:
                - employee_resigned
                - employer_terminated
                - contract_ended
                - wrongly_reported
                - internal_change
                - payroll_system_change
            type: string
        StaffErasedPerson:
            description: An erased person whose names and birth date match a new person's (POST /people/similar-erased), so a rehire is a choice rather than a duplicate made by accident.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - employeeNumber
                - displayName
                - erasedAt
            type: object
        StaffEvent:
            description: One change in a person's history (design S21). payload.fields names each field the change touched, with its value before (from) and after (to) — either absent when the field was empty — or, for a field of a group the caller may not read, the string "changed" in place of the values; a field of the pay or of HR's notes the caller may not read is left out altogether, since even the day it changed is not theirs to know. A sealed value is never in a payload.
            properties:
                actor:
                    $ref: '#/components/schemas/StaffEventActor'
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: person_created, person_updated, next_of_kin_updated, roles_updated, national_id_set, national_id_revealed, bank_account_set, bank_account_revealed, user_linked, user_unlinked, employment_created, employment_updated, employment_ended, employment_reopened, terms_added, terms_corrected, terms_deleted, document_added, document_updated, document_removed, personal_data_exported, legal_hold_set, legal_hold_lifted, reassessed, person_rehired or erased; and absence's — absence_requested, absence_registered, absence_updated, absence_deleted, absence_cancelled, absence_approved, absence_self_approved, absence_rejected, absence_corrected, absence_split (absence_changed the neutral kind a row shown as leave would be listed as), holiday_adjusted, holiday_adjustment_deleted, carry_over_recorded, case_opened, case_updated, case_closed, case_merged, milestone_done, milestone_waived, milestone_note_updated, self_cert_withdrawn and self_cert_restored; the accounts' — account_flag_updated, account_prepared, account_activated, account_deactivated, account_updated, account_blocked, account_failed, account_mismatched and identity_erased for the identity link, and for the provider link account_announced (the external account announced to identity), account_external_prepared, account_external_activated, account_external_deactivated, account_external_updated, account_external_deleted, account_external_blocked, account_external_failed, work_email_set_by_provider (the address the provider made, written to a person who had none) and pass_revealed (naming the viewer, never the pass) — each with codes only, never an address; the groups' — group_joined and group_left, naming the group (groupId, groupName, groupKey) and how the person came in or went (source, listed or derived); the competences' — competence_declared, competence_changed, competence_verified, competence_renewed, competence_removed and competence_evidence_added, naming the competence by its key, with its level, and never the verifier's note (competence_created and competence_updated are the catalogue's installation events, never a person's); the one-to-one's — interests_changed and availability_changed with the count before and after, preferences_changed with the kinds added, changed or removed and never a value, wishes_seen with the rows stamped and competence_reviewed with the review's day; the kinds grow with the module.
                    type: string
                payload:
                    additionalProperties: true
                    description: 'The change, shaped by the caller''s field groups: {"fields": {"<field>": {"from": …, "to": …} | "changed"}}; an employment''s and a terms row''s events also carry employmentId, and a terms row''s termsId. An absence, adjustment, case or withdrawal event names its row (absenceId, adjustmentId, caseId; a row''s case as rowCaseId) and carries each field''s retention class (classes) and the row''s types (typeIds, typeClasses), shaped field by field by the absence groups. An erased event carries no fields but {"kinds": [{"kind": "D" | "health" | "A" | "cases" | "childSick" | "withdrawal" | "pregnancyHealth", "count": n}]}. An erase records up to two: the health kinds (health, cases, childSick, withdrawal, pregnancyHealth) in one of class E, listed to the person and staff:personal-data alone, and D and A in one read by HR and listed as the hold''s kinds are — not to a manager, to the person with an empty payload. A value the retention run erased reads "changed" to everyone.'
                    type: object
            required:
                - id
                - kind
                - at
                - actor
                - payload
            type: object
        StaffEventActor:
            description: Who made the change, as the user directory named them at the time.
            properties:
                displayName:
                    type: string
                kind:
                    description: user, or system for a change no user made.
                    type: string
                userId:
                    description: Absent for a system change.
                    format: uuid
                    type: string
            required:
                - kind
                - displayName
            type: object
        StaffGender:
            description: female, male, other or unspecified — what the equality report (ARP) counts.
            enum:
                - female
                - male
                - other
                - unspecified
            type: string
        StaffGroup:
            description: 'A group in Staff (Entra design D9): listed — HR names the members — or derived, its members the people its rule yields on the business day, which the accounts worker materialises before it works the links. Its key is the providers'' reference to it and never changes. members and owners are answered by GET /groups/{id} and the writes of one group, never by the list. groups are staff:manage''s alone.'
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use. An archived group is read-only; its sections are retired in each provider as the settings' deleteExternalAfterDays says.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                description:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                key:
                    description: Lower-case letters, digits and hyphens, unique, set on create and never changed — the reference a provider keeps the group by (its mail nickname in Microsoft Entra ID, unless a trait says otherwise).
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffGroupKind'
                memberCount:
                    format: int32
                    type: integer
                members:
                    description: The members by name, how each came in and since when. Only on one group's own answers.
                    items:
                        $ref: '#/components/schemas/StaffGroupMember'
                    type: array
                name:
                    type: string
                ownerCount:
                    format: int32
                    type: integer
                owners:
                    description: The owners by name — the people who own the group in each provider's directory beside the provider itself. Only on one group's own answers.
                    items:
                        $ref: '#/components/schemas/StaffGroupOwner'
                    type: array
                providers:
                    description: Each provider HR has turned on for the group, or had, with where its sync stands. Empty when none.
                    items:
                        $ref: '#/components/schemas/StaffGroupProviderState'
                    type: array
                revision:
                    description: Send it back as If-Match on PUT /groups/{id}.
                    format: int32
                    type: integer
                rule:
                    $ref: '#/components/schemas/StaffGroupRule'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - key
                - name
                - kind
                - memberCount
                - ownerCount
                - providers
                - revision
                - createdAt
                - updatedAt
            type: object
        StaffGroupKind:
            description: listed — HR names the members — or derived — the rule does, daily.
            enum:
                - listed
                - derived
            type: string
        StaffGroupMember:
            description: One member of a group.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                personId:
                    format: int64
                    type: integer
                since:
                    description: The day the person joined the group.
                    format: date
                    type: string
                source:
                    $ref: '#/components/schemas/StaffGroupKind'
            required:
                - personId
                - displayName
                - employeeNumber
                - source
                - since
            type: object
        StaffGroupMembersRequest:
            description: A listed group's members, exactly; the people not named leave it, each change an event on the person (group_joined, group_left).
            properties:
                personIds:
                    description: Existing people, not erased; a duplicate counts once.
                    items:
                        format: int64
                        type: integer
                    type: array
            required:
                - personIds
            type: object
        StaffGroupOwner:
            description: One owner of a group.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                personId:
                    format: int64
                    type: integer
            required:
                - personId
                - displayName
                - employeeNumber
            type: object
        StaffGroupOwnersRequest:
            description: A group's owners, exactly. No event is recorded.
            properties:
                personIds:
                    description: Existing people, not erased; a duplicate counts once.
                    items:
                        format: int64
                        type: integer
                    type: array
            required:
                - personIds
            type: object
        StaffGroupProvider:
            description: 'A group''s section under one provider in the IdentityProvisioner slot (Entra design D10): the traits the provider declares — the page renders them as a form from this description alone — the values Staff stores for the group, whether HR has the provider on for it, and where the accounts worker''s sync stands. Codes only: lastError never carries the directory''s words.'
            properties:
                enabled:
                    description: Whether HR has the provider on for the group. False when it never was.
                    type: boolean
                externalId:
                    description: The group's id in the provider's directory. Absent until the provider made or found it.
                    type: string
                key:
                    description: The provider's key, entra.
                    type: string
                lastError:
                    description: 'The code of the last sync''s failure, absent when it did not fail: a trait''s code (trait_required, trait_invalid, trait_immutable, trait_needs_owner — lastErrorField names the trait; the members are kept in step all the same while it stands), group_not_manageable (the provider may not write the group its directory holds for this one: dynamic, role-assignable, a list or a mail-enabled security group Exchange keeps, another Staff group''s, or one of two groups holding the nickname — or the group is gone from the directory and SetMembers has nothing to write to), group_unconfirmed (the provider found a group holding the nickname and adopted it, and waits for a holder of its permission to confirm it — for Entra, Confirm on the Microsoft Entra ID page; the section stays pending and the worker asks again at every poll, nothing counted), call_failed, or members_failed:<n> (n members the provider could not change, tried again at the next sync).'
                    type: string
                lastErrorField:
                    description: The trait lastError names, absent when it names none.
                    type: string
                name:
                    description: The provider's display name, Microsoft Entra ID.
                    type: string
                retiredAt:
                    description: When the group was renamed "… (archived)" and kept in the provider's directory, the settings' deleteExternalAfterDays being never. Absent when it was not.
                    format: date-time
                    type: string
                state:
                    $ref: '#/components/schemas/StaffGroupSyncState'
                status:
                    description: The provider's status as it answers it, as StaffIdentityProvider's — unconfigured, connected or failing; failing too when its traits could not be read, and traits is then empty.
                    type: string
                syncedAt:
                    description: When the worker last brought the group in the provider's directory in line. Absent when it never has.
                    format: date-time
                    type: string
                traits:
                    description: The traits the provider declares, in its order.
                    items:
                        $ref: '#/components/schemas/StaffGroupTraitDeclaration'
                    type: array
                values:
                    additionalProperties: true
                    description: The values Staff stores for the group under the provider, by trait key. Empty when it stores none.
                    type: object
            required:
                - key
                - name
                - status
                - enabled
                - traits
                - values
            type: object
        StaffGroupProviderState:
            description: A provider HR has turned on for a group, or had, as the list shows it.
            properties:
                enabled:
                    type: boolean
                key:
                    description: The provider's key, entra.
                    type: string
                state:
                    $ref: '#/components/schemas/StaffGroupSyncState'
            required:
                - key
                - enabled
                - state
            type: object
        StaffGroupRequest:
            description: A group's fields. The key is set on create and never changed.
            properties:
                description:
                    description: Up to 500 characters. Left out, it is cleared.
                    maxLength: 500
                    type: string
                key:
                    description: 'On create: 1 to 60 lower-case letters, digits or hyphens, starting with a letter or a digit, unique. On a change it is left out or the group''s own; another is a field error.'
                    maxLength: 60
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffGroupKind'
                name:
                    description: 1 to 120 characters.
                    maxLength: 120
                    type: string
                rule:
                    $ref: '#/components/schemas/StaffGroupRule'
            required:
                - name
                - kind
            type: object
        StaffGroupRule:
            description: 'A derived group''s rule: one predicate over the register, judged on the business day against the employments and terms in force. A person not erased is judged on one employment in force that day — started, and not ended before it — the earliest by start when they have several, and its terms in force. employed (everyone with an employment in force), department (the terms name the department id, or, with includeBelow, one beneath it, the departments'' parent chain read with archived departments included), businessUnit (the employment''s unit is id), location (the terms name location id), employeeType (the terms'' employee type is value), reportsTo (the person id is their manager today, one level: the manager the terms name, else — when there is none, or that manager is not in employment that day — the manager of the first department up from the terms'' whose manager is someone else in employment, as every manager rule in Staff reads it). Required for a derived group, refused for a listed one.'
            properties:
                id:
                    description: The department, business unit, location or person the rule names; required for those four kinds, refused for the others. An archived one is admitted.
                    format: int64
                    type: integer
                includeBelow:
                    description: department only — the departments beneath it too, archived ones included.
                    type: boolean
                kind:
                    enum:
                        - employed
                        - department
                        - businessUnit
                        - location
                        - employeeType
                        - reportsTo
                    type: string
                value:
                    description: employeeType only — the employee type, one of the terms' values.
                    type: string
            required:
                - kind
            type: object
        StaffGroupSyncState:
            description: 'Where a group''s sync with a provider stands: pending (the worker has yet to send what HR saved), synced, failed (lastError says why), retired (renamed "… (archived)" and kept in the directory) or deleted (deleted in the directory). A retired or deleted section is never synced again until HR turns the provider on anew.'
            enum:
                - pending
                - synced
                - failed
                - retired
                - deleted
            type: string
        StaffGroupTraitChoice:
            description: One value a choice or list trait admits.
            properties:
                label:
                    $ref: '#/components/schemas/StaffGroupTraitText'
                value:
                    type: string
            required:
                - value
                - label
            type: object
        StaffGroupTraitDeclaration:
            description: 'One trait a group may carry for a provider, as the provider declares it (Entra design D10): Staff renders it as a form field from this alone — bool a switch, string a text field of at most maxLength characters, choice one of choices, list any of choices — and checks a value against it when it is saved.'
            properties:
                choices:
                    description: For choice and list, the values admitted. Absent for the others.
                    items:
                        $ref: '#/components/schemas/StaffGroupTraitChoice'
                    type: array
                default:
                    description: The value an empty form starts with, of the trait's type. Absent when there is none.
                description:
                    $ref: '#/components/schemas/StaffGroupTraitText'
                docUrl:
                    description: The provider's page about the setting. Absent when there is none.
                    type: string
                key:
                    description: The trait's key, which values are keyed by and a field error names.
                    type: string
                label:
                    $ref: '#/components/schemas/StaffGroupTraitText'
                maxLength:
                    description: For string, the longest value admitted, in characters. Absent when unbounded.
                    format: int32
                    type: integer
                required:
                    description: Whether turning the provider on needs a value.
                    type: boolean
                type:
                    enum:
                        - bool
                        - string
                        - choice
                        - list
                    type: string
            required:
                - key
                - type
                - label
                - required
            type: object
        StaffGroupTraitText:
            description: A text the provider gives in each language; nb absent when it gave none, and English is shown instead.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
            type: object
        StaffGroupTraits:
            description: A group's sections, one for every provider in the IdentityProvisioner slot, in the slot's order — whether HR has turned it on for the group or not.
            properties:
                providers:
                    items:
                        $ref: '#/components/schemas/StaffGroupProvider'
                    type: array
            required:
                - providers
            type: object
        StaffGroupTraitsRequest:
            description: Turns a provider on for a group with the trait values, or off.
            properties:
                enabled:
                    description: 'True turns the provider on: the values are checked against the provider''s declaration and the worker sends them at its next cycle. False turns it off: the values are kept and the worker retires the group in the provider''s directory as the settings'' deleteExternalAfterDays says — deleted after that many days, or renamed "… (archived)" and kept when it is never.'
                    type: boolean
                values:
                    additionalProperties: true
                    description: 'The values by trait key: a bool for bool, a string for string and choice, an array of strings for list. A key the provider does not declare, a required trait left out, a value not among its choices or longer than its maxLength is a field error keyed by the trait. Ignored when enabled is false.'
                    type: object
            required:
                - enabled
            type: object
        StaffHolidayAccount:
