    /api/v1/staff/people/export.csv:
        get:
            description: |-
                The register as the register's file (design S19): UTF-8 with a byte order mark, semicolon-separated, CRLF line ends, a header row, ISO dates and the decimal comma — the Expenses and Customers form, which a Norwegian Excel opens without an import dialog. Quoting is RFC 4180's with the semicolon as the separator, and a cell beginning with '=', '+', '-', '@', a tab or a carriage return is prefixed with an apostrophe, so nothing a person typed becomes a formula; the import takes that apostrophe off again.

                The columns, in this order: employeeNumber; the work group — givenName, familyName, displayName, workEmail, phoneWork, workCountry, preferredLanguage; the private group — birthDate, gender, phoneMobile, phonePrivate, privateEmail, street, postalCode, city, country; then where the person stands today, in the business time zone — status, currentTitle, currentDepartment (its code), currentBusinessUnit (its name), currentLocation (its name), currentManagerEmployeeNumber, currentFtePercent (the percentages of the employments in force today, added up) — and nationalIdOnFile (yes or no). The sealed values are never in it: neither a national identity number nor anything of a bank account. The columns after country are export-only and an import ignores them, so the file re-imports unchanged.

                Every person, erased ones included, oldest first; more than STAFF_IMPORT_MAX_ROWS people (5000 unless the operator raised it) is refused export_too_many. Every export is recorded as a people_exported event of the installation naming the exporter and the number of rows; a file whose export could not be recorded is not answered.
            operationId: getStaffPeopleExportCsv
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named staff-people-YYYY-MM-DD.csv (the day in the business time zone), and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — export_too_many, the register holds more people than one file may.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export the register as CSV
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/import:
        post:
            description: |-
                Creates and updates people from the register's file (design S19) — the columns GET /people/export.csv writes and GET /people/import-template.csv starts, read with the same format rules (a byte order mark tolerated, UTF-8, semicolons, CRLF or LF). The export-only columns (status, the current… summary, nationalIdOnFile) and a column named error are ignored, so an export and a failed-rows file import as they are. At most 5 MiB and STAFF_IMPORT_MAX_ROWS data rows (5000 unless the operator raised it).

                The header is judged before any row: a column the table does not know is refused by name (a misspelt header is never a silently ignored one), and so is a repeated one; employeeNumber is required; nationalId and nationalIdKind come together, nationalIdCountry only with them, bankAccount and bankAccountKind together. The sealed columns — nationalIdKind, nationalIdCountry, nationalId, bankAccountKind, bankAccount — need staff:personal-data as well: a file carrying any of them from a caller without it is refused whole, import_sealed_columns, rather than imported without them.

                Each row, in file order, is keyed on employeeNumber, which every row needs. A number no person has (however it is cased) creates the person — the row's person columns as POST /people takes them — and, when startDate is filled in, their first employment with its first terms row from the first-employment columns (startDate, businessUnit by name or org number — the default unit when blank, employmentType, temporaryGround, expectedEndDate, ftePercent, appointmentForm, workingHoursScheme, fullTimeHoursPerWeek, occupationCode, title, department by code, location by name, managerEmployeeNumber), as POST /people/{id}/employments takes them, in the row's one transaction. A number a person has updates that person's own columns, and only those the file carries — a blank cell clears an optional field, a column not in the file is left alone — as PUT /people/{id} would, without a revision; an update never touches employments, so the first-employment cells of such a row are not read. A filled sealed cell sets the value as PUT /people/{id}/national-id or /bank-account does (a blank one changes nothing); a bank account that changes mails the person once that row has committed, never in a dry run. Each row is its own transaction through the endpoints' own validation, statements and events, the caller as actor, and an erased person's row is refused person_erased; a row that fails writes nothing and does not stop the file. Two rows with the same employee number or the same work email (however cased) refuse the second, in both runs.

                dryRun defaults to true: every row runs exactly as in a real run and is rolled back instead of committed — no person, no employee number, no event and no mail is kept. A dry run cannot see an earlier row's effect on a later one, with one exception made for it: a managerEmployeeNumber naming a person an earlier row of the file creates is taken as found. A real run is recorded as a people_imported event of the installation carrying the four counts.
            operationId: postStaffPeopleImport
            parameters:
                - description: "'true' (the default) checks the file and keeps nothing; 'false' imports it."
                  in: query
                  name: dryRun
                  schema:
                    type: string
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffImportResult'
                    description: OK — what the rows did, or would do in a dry run.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — on file, for the file itself, every refusal of its header at once — import_too_large (over 5 MiB), import_not_semicolon (comma-separated), import_too_many_rows (more data rows than the bound), import_sealed_columns (a sealed column without staff:personal-data), and plain field errors for a missing, repeated or empty part, a file that is not UTF-8 or not a CSV file, and a header with an unknown, repeated or nameless column, no employeeNumber column or half of a sealed pair; or on dryRun, a value that is neither 'true' nor 'false'.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Import people from CSV
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/import-template.csv:
        get:
            description: The register's file's header row alone (design S19), with every column the caller's import can write — employeeNumber, the person's columns, the sealed columns (nationalIdKind, nationalIdCountry, nationalId, bankAccountKind, bankAccount) only for a caller holding staff:personal-data, and the first employment's columns — so a template filled in and imported by the one who downloaded it is never refused for its header. The starting point for a file made by hand.
            operationId: getStaffPeopleImportTemplateCsv
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named staff-people-import-template.csv.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Download the register's import template
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/similar-erased:
        post:
            description: 'The erased people whose given and family names (however cased) and birth date match the ones sent — the warning HR''s creation form shows before a person is added who may be an erased person coming back (design S15). Because the erase removed the national identity number, the module cannot tell them apart; a rehire is POST /people/{id}/employments on the erased record. A body rather than a query, so the names stay out of access logs.'
            operationId: postStaffPeopleSimilarErased
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffSimilarErasedRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffErasedPerson'
                                type: array
                    description: OK — the matches, most recently erased first; [] when there are none.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a name or the birth date is missing or empty.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Find erased people with the same names and birth date
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}:
        delete:
            description: Deletes a person created in error, with their next of kin, their roles and their history, and records an installation-level person_deleted event carrying the employee number only. A person with an employment or a user link, or named as a department's manager or as the manager on anyone's terms, is in use and is never deleted.
            operationId: deleteStaffPeopleById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — person_erased; legal_hold when the person is under a legal hold (judged before anything else names them); person_in_use (a link naming a user is a use; the accounts worker's preparing link, naming none, is deleted with the person); accounts_busy while the accounts worker holds that preparing link.
            summary: Delete a person created in error
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
        get:
            description: 'One person, shaped by who is asking (design §5): the person themselves through their self-service link, a manager of theirs today (a person linked to the caller is the manager of one of their employments in force today — the manager its terms name when they are employed today, else the department''s manager climbing the parents, a manager who has left skipped), staff:view for a person active today (an employment that has started and not ended), staff:manage and staff:personal-data each see the field groups theirs to read. Anyone else — staff:view alone for a person not active today included — gets a 404 identical to an unknown id.'
            operationId: getStaffPeopleById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPerson'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one the caller may see. The body is empty.
            summary: Get a person
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: Replaces a person's editable fields — the work group, the private group and HR's notes. The employee number never changes; the display name stays when left out. The change is a person_updated event naming each field with its value before and after; a replace that changes nothing writes nothing.
            operationId: putStaffPeopleById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the person was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPerson'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or a property the request does not name; a field error when the employee number differs from the person's; work_email_taken when another person has the work email; national_id_birth_date_mismatch on birthDate when the person's fødselsnummer or d-nummer encodes another birth date.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Change a person
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/account:
        get:
            description: 'A person''s account flag, the dates it derives, the address it would use and the link it drives, with the authority mode and the pending account''s invitation as identity reports them (design S22, S27). The person themselves, staff:manage and staff:personal-data read it; anyone else gets a 404 identical to an unknown id. identity is asked before the person is read, never while their record is held: mode is absent when accounts are unavailable or this process''s configuration disagrees with the recorded mode, and the invitation when identity knows no such user.'
            operationId: getStaffPeopleByIdAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonAccount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one whose account the caller may read. The body is empty.
            summary: Get a person's account flag
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: 'Replaces the account flag''s three fields (design S22): provisionAccount, provisionFrom and accountEmailKind, guarded by the flag''s own revision (StaffPersonAccount.revision), never the person''s, which this write does not move. A change is one account_flag_updated event naming each field that changed; a replace that changes nothing writes nothing. Turning the flag on for a person without the chosen address is accepted — the worker waits, and HR is told (accountEmailMissing). Nothing is asked of identity until the accounts worker acts.'
            operationId: putStaffPeopleByIdAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The account flag's revision, as GET /people/{id}/account's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonAccount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or a property the request does not name.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; person_erased when the person has been erased.
            summary: Change a person's account flag
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/account/disable:
        post:
            description: 'Disable now (the owner''s answer 2): turns the person''s account flag off — one account_flag_updated event, the flag''s own revision moved, never the person''s — and commits that first, then claims the person''s link and asks identity to disable its user with the caller as the actor, writing the result on the link (account_deactivated). The flag off is what keeps the account disabled: the worker leaves it alone until HR turns the flag on again. The disable asked for is recorded on the link with the flag (disable_requested_at), and the work after the commit goes on if the client goes away; whatever does not reach identity — the client gone, identity down, the link claimed meanwhile — the accounts worker finishes at its next polls, and accountFailing is raised while it waits. A person with no link, or a link naming no user yet, has the flag turned off and nothing more. Allowed on an erased person, whose access must end too.'
            operationId: postStaffPeopleByIdAccountDisable
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonAccount'
                    description: OK — the flag is off and the user, if there is one, disabled.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — accounts_busy while the accounts worker holds the person''s link (nothing was changed, unless the worker took the link between the flag''s write and the claim: then the flag is off and the user not yet disabled — try again); account_not_managed on HR''s self-service link — Disable now acts only on accounts Staff manages: the flag is turned off and nothing else is recorded, called or tried again; unlink the person, or an Owner disables the user in identity — or when the worker''s link names a user no longer managed by Staff, and account_privileged when the user is an Owner or a SystemAdmin, or the last active Owner — an Owner disables them in identity. In the last two the flag is off and the refusal stays the link''s reason and raises its attention item; the disable is tried again daily, so it runs once an Owner has adopted the user again or demoted them. account_mismatch when the user carries another employee number — someone else''s account, left alone; the disable runs once the number is right.'
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 120 of a person's Run now and Disable now together an hour from one client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Service Unavailable — accounts_unavailable: identity could not be reached. The flag is already off; the link records the error (last_error) and the disable asked for, which the accounts worker retries at every poll, and accountFailing is raised meanwhile.'
            summary: Disable a person's account now
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/account/run:
        post:
            description: 'Run now for one person (design S27), the caller as the actor: their preparing link written when the account is due and they have none, then their link claimed whatever its next attempt and worked as the worker works it — with a fresh invitation (identity''s ActivateOpts.FreshInvitation) on the run''s first step only, which starts a new invitation spell for a pending user whose last invitation an Owner revoked or three went unanswered. Identity never re-sends an invitation that can still be accepted and sends none within ten minutes of the last; the run is done all the same, and invitationSent says whether one went. A person whose flag is off has nothing run. A step identity refuses is done, its reason on the link. The run goes on if the client goes away.'
            operationId: postStaffPeopleByIdAccountRun
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonAccountRun'
                    description: OK — the run is done; the account as it stands after it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — person_erased when the person has been erased; accounts_busy while the accounts worker holds the person's link. Nothing was run.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 120 of a person's Run now and Disable now together an hour from one client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Service Unavailable — accounts_unavailable: no module provides accounts, or identity could not be reached; a call that failed is recorded on the link (last_error) and retried by the worker.'
            summary: Run a person's account now
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/bank-account:
        put:
            description: Seals a bank account on the person (design S4) — staff:personal-data only, never staff:manage alone and never the person. Its kind and last four digits are kept in clear. The account already on file changes nothing — no event, no mail. A change is a bank_account_set event carrying the kind and the last four digits, and after it has committed the person is mailed — at their private email, else their work email, in their preferred language, naming at most the last four digits; with neither address, or a mail driver other than smtp, the mail is skipped with a log line.
            operationId: putStaffPeopleByIdBankAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBankAccountRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPerson'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — bank_account_invalid. The refusal never echoes the number.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Set a person's bank account
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:personal-data
    /api/v1/staff/people/{id}/bank-account/reveal:
        post:
            description: Opens the person's sealed bank account and answers it once, with Cache-Control no-store. Each reveal is a bank_account_revealed event naming the viewer.
            operationId: postStaffPeopleByIdBankAccountReveal
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBankAccountReveal'
                    description: OK
                    headers:
                        Cache-Control:
                            description: no-store — the value is never kept by a cache.
                            schema:
                                type: string
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or no bank account on file. The body is empty.
            summary: Reveal a person's bank account
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:personal-data
    /api/v1/staff/people/{id}/care-days:
        get:
            description: 'A person''s care days for a year (ftrl. § 9-6): the entitlement derived from the care-day fields, the year''s child-sick working days, the ten the employer bears and those beyond, and whether four weeks'' employment has given the right. The readers of the care-day fields — the person, staff:manage and staff:personal-data — read it; the entitlement says what the fields do, so to anyone else it is the 404 an unknown person is.'
            operationId: getStaffPeopleByIdCareDays
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: 'The year, 2000 to 2100; this year in the business time zone when left out.'
                  in: query
                  name: year
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffCareDays'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — the year is out of range.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such person, or one whose care days the caller may not read. The body is empty.'
            summary: Get a person's care days
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/people/{id}/carry-over:
        post:
            description: 'Records the carry-over of a year''s untaken holiday into the next: agreed — capped at the scheme''s maximum, converted — or forced, uncapped and with a note. days defaults to the year''s remaining, rounded down to a tenth. At most one carry-over per person and year it comes from, judged under the person''s lock and held by a unique index: a second answers carry_over_recorded. Recorded as carry_over_recorded.'
            operationId: postStaffPeopleByIdCarryOver
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffCarryOverRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffHolidayAdjustment'
                    description: 'Created'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — a field did not pass, nothing remains to carry over, or an agreed carry-over above the cap.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such person. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
