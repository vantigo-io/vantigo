    /api/v1/staff/employments/{id}/end:
        post:
            description: Ends an employment on endDate — which may lie in the future — for one of the a-melding's six reasons. A terms row dated after the end is refused. Ending one already ended moves its end; a later end brings terms back into force and is judged on the manager graph from the day after the old end. The change is an employment_ended event.
            operationId: postStaffEmploymentsByIdEnd
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffEmploymentEndRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — end_reason_required when endReason is missing; a field error when endDate is missing or before the start.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_after_end when a terms row is dated after endDate; manager_cycle when a later end brings back terms that close a loop in the manager graph; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: End an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}/reopen:
        post:
            description: Takes an employment's end and its reason away, for an end recorded in error. The change is an employment_reopened event; reopening an employment that has no end changes nothing.
            operationId: postStaffEmploymentsByIdReopen
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — manager_cycle when the terms the reopening brings back into force close a loop in the manager graph; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Reopen an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}/terms:
        get:
            description: 'An employment''s terms rows by validFrom, each in force from its validFrom until the next row''s (validTo, the day before, is absent on the latest). Shaped by who is asking (design §5): the person themselves and HR read every field; a manager of theirs reads every field but the pay group; a colleague holding staff:view reads the dates, employmentType and ftePercent only.'
            operationId: getStaffEmploymentsByIdTerms
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffTerms'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment, or not one the caller may see. The body is empty.
            summary: List an employment's terms
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a terms row in force from validFrom (design S5, §4 Terms). A field left out takes its value from the row in force before validFrom; a field sent as null is cleared; the hours for a full position follow the scheme when the scheme changes and the hours are left out. The row is a terms_added event.
            operationId: postStaffEmploymentsByIdTerms
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffTermsRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffTerms'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or validFrom is missing; terms_required_fields when employmentType or ftePercent is missing (errors names each); temporary_ground_required when the row is midlertidig without a ground; appointment_form_mismatch when the appointment form does not agree with the employment type; probation_too_long when the probation ends more than six months after the start, or more than half the expected term of a temporary employment, or an extension is not agreed, has no reason or is longer than the probation itself; full_time_hours_mismatch when the hours for a full position break the a-melding's rule for the working-hours scheme.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_valid_from_taken when the employment has a row on that date; terms_before_start before the employment's start; terms_after_end after its end; terms_first_row_start when the first row would not be dated the start; self_manager when the manager is the person; manager_cycle when the manager — named on the row, or the department's — would close a loop in the manager graph on the row's date or any later date the graph changes; structure_archived when a department or location newly named is archived; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Add a terms row
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
