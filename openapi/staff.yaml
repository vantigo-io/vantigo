                    type: integer
                days:
                    description: '-366 to 366, one decimal, not zero.'
                    format: double
                    type: number
                reason:
                    $ref: '#/components/schemas/StaffHolidayAdjustmentReason'
                fromYear:
                    description: 'A carry-over''s year it comes from, before year; none on a correction.'
                    format: int32
                    type: integer
                note:
                    description: 'At most 500 characters; required with forced_carry_over and correction.'
                    type: string
            required:
                - year
                - days
                - reason
            type: object
        StaffHolidayPostponement:
            description: 'The ferie rows a demand to postpone holiday for sickness split (ferieloven § 9), as they stand after it.'
            properties:
                demandedOn:
                    format: date
                    type: string
                absences:
                    items:
                        $ref: '#/components/schemas/StaffAbsence'
                    type: array
            required:
                - demandedOn
                - absences
            type: object
        StaffHolidayPostponementRequest:
            properties:
                demandedOn:
                    description: 'The day the employee demanded it; today when left out. Never after today.'
                    format: date
                    type: string
            type: object
        StaffIdentityProvider:
            description: An external identity provider in the IdentityProvisioner slot (Entra design D6), as the accounts worker and GET /meta see it. Codes only — the reason never carries an address or the provider's words.
            properties:
                key:
                    description: The provider's key, the account kind that names it and the provider link's provider — entra.
                    type: string
                name:
                    description: The provider's display name, Microsoft Entra ID.
                    type: string
                reason:
                    description: 'A code for a failing status — unreachable (the provider could not be asked), credential_invalid, secret_expired — or a fact about a connected one, secret_expiring. Absent when there is none.'
                    type: string
                status:
                    description: 'unconfigured — the provider has no connection yet; connected — its last check succeeded; failing — its last check failed, the reason says why. Only a connected provider is written to, but for a deactivation.'
                    enum:
                        - unconfigured
                        - connected
                        - failing
                    type: string
            required:
                - key
                - name
                - status
            type: object
        StaffImportError:
            description: One problem with one row of an import. No message carries a digit of a national identity number or a bank account.
            properties:
                column:
                    description: The column the problem is in, as the file's header spells it; absent for a problem with the row as a whole.
                    type: string
                message:
