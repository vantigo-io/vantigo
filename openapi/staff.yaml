                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — demandedOn is after today, or before the sykmelding''s first day: a demand follows the sickness.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — holiday_postponement_not_applicable, holiday_postponement_too_late, or person_erased.'
            summary: Postpone holiday for sickness
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
