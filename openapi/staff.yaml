    /api/v1/staff/retention/run:
        post:
            description: |-
                Runs the staff-retention worker's two steps once, now (design S15): an erase cycle — at most fifty people, under the worker's lease, each person's erases in one transaction with one erased event naming the caller as its actor — and one pass over the deletion ledger, at most a hundred objects and at most thirty seconds in all — what it does not reach, the worker finishes. Exactly what the worker does every poll, by the same code.

                The erase cycle takes what is due today in the settings' time zone and not under a legal hold: D — a person not yet erased, with at least one employment and every one ended more than retentionGraceDays ago, loses the personnel administration (contact and address, the sealed identifiers, the care-day fields, HR's notes, the terms' notes, the next of kin, the documents of class D, and those values in the history's payloads) and is marked erased; health — a person whose last employment ended more than healthRetentionDays ago loses the documents in restricted categories; A — an employment that ended in a year more than five years past loses its pay terms, its documents of class A and the pay in its events. Delivery B's health schedules (cases, childSick, withdrawal) and — when its setting is on — pregnancyHealth run in the same transaction; StaffErasedKind says what each removes, and the settings erasePregnancyHealthTypes and eraseSickCaseDates what they add. What remains — the names, the birth date, the employee number, the employments and their other terms, the roles, the link, the history's kinds and dates — stays.
            operationId: postStaffRetentionRun
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffRetentionRun'
                    description: OK — what the cycle erased and what the ledger pass attempted; a run that found nothing due answers no kinds.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — retention_busy: the worker, on this replica or another, is running an erase cycle now; nothing was run.'
            summary: Run retention now
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/settings:
        get:
            description: 'The installation''s Staff settings: the business time zone, the employee number sequence, the pension provider, the occupational injury insurer and the two retention periods — and the retention run''s state, derived from the deletion ledger and the history.'
            operationId: getStaffSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSettings'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Staff settings
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
        put:
            description: Replaces the settings; pensionProvider and injuryInsurer left out are cleared, retentionGraceDays and healthRetentionDays — and the policy, the carry-over, the account and the erase settings — left out keep their values; a null erasePregnancyHealthTypes or eraseSickCaseDates is refused on the field. The time zone must be an IANA name both this server and its database read the same way. The prefix and the next number must together make an employee number of at most 16 characters. retentionGraceDays is 0 to 3650 days, healthRetentionDays 30 to 3650. Turning erasePregnancyHealthTypes or eraseSickCaseDates on or off records the installation event settings_updated, naming the field from and to, the caller its actor; a replace that changes neither records nothing.
            operationId: putStaffSettings
            parameters:
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffSettings'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass (a retention period out of its bounds among them); employee_number_too_long when the prefix and the next number make a number longer than 16 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — revision_conflict: the settings were changed since the revision If-Match names.'
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Service Unavailable — accounts_unavailable: the request changes defaultAccountKind while the account kinds are not yet seeded from identity''s authority mode (identity could not say it). Nothing was changed.'
            summary: Change the Staff settings
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
