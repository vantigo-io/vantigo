                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no person has that id, or the caller may not see them. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Replace a person's availability declaration
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/people/{id}/bank-account:
        put:
            description: Seals a bank account on the person (design S4) — staff:personal-data only, never staff:manage alone and never the person. Its kind and last four digits are kept in clear. The account already on file changes nothing — no event, no mail. A change is a bank_account_set event carrying the kind and the last four digits, and after it has committed the person is mailed — at their private email, else their work email, in their preferred language, naming at most the last four digits; with neither address, or a mail driver other than smtp, the mail is skipped with a log line.
