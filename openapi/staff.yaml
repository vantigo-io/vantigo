            description: What Run now did for one person (POST /people/{id}/account/run), and their account after it.
            properties:
                account:
                    $ref: '#/components/schemas/StaffPersonAccount'
                invitationSent:
                    description: Whether identity sent the person a new invitation to choose a password. False when none was due, when one that can still be accepted is open, and when the last was made less than ten minutes ago — identity sends nothing then, and the run is still done.
                    type: boolean
            required:
                - invitationSent
                - account
            type: object
        StaffPersonAccountAddress:
            description: The address the account would be given — never the address itself, only which and whether the person has it.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffAccountEmailKind'
                present:
                    description: Whether the person has that address on file. A flag turned on without it waits (accountEmailMissing).
                    type: boolean
            required:
                - kind
                - present
            type: object
        StaffPersonAccountRequest:
            additionalProperties: false
            description: 'A full replace of the account flag''s three fields: what is left out is cleared — provisionFrom to none, accountEmailKind to work.'
            properties:
                accountEmailKind:
                    description: 'work or private; null or left out reads work.'
                    enum:
                        - work
                        - private
                    nullable: true
                    type: string
                provisionAccount:
                    type: boolean
                provisionFrom:
                    description: 'The day to enable the account from; null or left out derives it from the employments.'
                    format: date
                    nullable: true
                    type: string
            required:
                - provisionAccount
            type: object
        StaffPersonLink:
            description: A person's self-service link to a user (design S24, §3.6) — the link that makes the user the person themselves to this module, and nothing else. linked is false, and every other field absent, when the person is linked to nobody.
            properties:
                linked:
                    type: boolean
                managed:
                    description: Whether identity reports the user as managed by Staff — false for every self-service link.
                    type: boolean
                state:
                    description: The link's state; linked for a self-service link.
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
            required:
                - linked
            type: object
        StaffPersonLinkRequest:
            description: The user to link the person to, or null to unlink them.
            properties:
                userId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - userId
            type: object
        StaffPersonListItem:
            description: A person in the directory — the work group, with the manager, the department, the title and the location from the terms in force today and the business unit of their employment (each absent when there is none; the manager is the one who manages them today — the manager the terms name when they are employed today, else the department's manager climbing the parents, a manager who has left skipped), and where the person stands today.
            properties:
                businessUnit:
                    $ref: '#/components/schemas/StaffBusinessUnitSummary'
                department:
                    $ref: '#/components/schemas/StaffDepartmentSummary'
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person, for staff:manage; absent otherwise. An erased person is listed under status ended or all, their state ended.
                    format: date-time
                    type: string
                familyName:
                    type: string
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/StaffLocationSummary'
                manager:
                    $ref: '#/components/schemas/StaffPersonSummary'
                onLeaveToday:
                    description: 'Whether an approved or registered absence of a whole or part day, of any type, covers today (design §7, "on leave today") — the same to every reader of the list, a colleague included, and never naming the type: it says no more than the calendar''s "absent" bar. A request does not count, nor an hour registration.'
                    type: boolean
                phoneWork:
                    description: Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                status:
                    $ref: '#/components/schemas/StaffPersonStatus'
                title:
                    description: The job title of the terms in force today. Absent when there is none.
                    type: string
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - status
                - onLeaveToday
            type: object
        StaffPersonNationalId:
            description: Whether a national identity number is on file, and its kind — never a digit of it. Present for the person themselves, staff:manage and staff:personal-data.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                onFile:
                    type: boolean
            required:
                - onFile
            type: object
        StaffPersonRequest:
            additionalProperties: false
            description: 'A person''s editable fields, the whole record as staff:manage replaces it (design §3.1, §5): the work group, the private group and HR''s notes. The national identity number and the bank account are written through their own operations under staff:personal-data, and the self-service link through its own; a property this schema does not name — one of those among them — is refused as a 400 naming it. On a change every optional field left out is cleared, except displayName, which stays.'
            properties:
                birthDate:
                    description: A calendar date. Private.
                    format: date
                    type: string
                childrenUnder12:
                    description: 0 to 20 — the children through the year they turn twelve without NAV's extra-days decision. A care-day field; left out, it is cleared.
                    format: int32
                    type: integer
                chronicallyIllChildren:
                    description: 0 to 20 — the children with NAV's extra-days decision, through the year they turn eighteen. A care-day field; left out, it is cleared.
                    format: int32
                    type: integer
                city:
                    description: Up to 100 characters. Private (the home address).
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Private (the home address).
                    type: string
                displayName:
                    description: 1 to 200 characters, the name the person is shown by. Left out on a create, it is the given name and the family name; left out on a change, it stays as it is — it is set once from the names and then HR's to edit.
                    maxLength: 200
                    type: string
                employeeNumber:
                    description: 1 to 16 letters, digits or hyphens, unique however it is cased; employee_number_too_long when longer, employee_number_taken when another person has it. Left out on a create, it is generated as the settings' prefix and next number, skipping past any number already taken. It never changes after the create, so on a change it is left out or sent as it is.
                    maxLength: 16
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                familyName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                notes:
                    description: HR's notes, up to 2000 characters. Read by staff:manage and staff:personal-data only — never by the person.
                    maxLength: 2000
                    type: string
                phoneMobile:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phonePrivate:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phoneWork:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                postalCode:
                    description: Up to 16 characters. Private (the home address).
                    maxLength: 16
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: An email address of up to 254 characters, stored lower-cased. Private.
                    maxLength: 254
                    type: string
                soleCarer:
                    description: Whether the person cares for the children alone. A care-day field; left out, it is cleared.
                    type: boolean
                street:
                    description: Up to 200 characters. Private (the home address).
                    maxLength: 200
                    type: string
                workCountry:
                    description: Where the person works from (the usage location), an ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                workEmail:
                    description: An email address of up to 254 characters, stored lower-cased, unique however it is cased (work_email_taken).
                    maxLength: 254
                    type: string
            required:
                - givenName
                - familyName
            type: object
        StaffPersonRole:
            description: A role a person holds for the company (design S6), with the dates they were elected for.
            properties:
                fromDate:
                    description: Absent when not set.
                    format: date
                    type: string
                role:
                    $ref: '#/components/schemas/StaffPersonRoleKind'
                toDate:
                    description: On or after fromDate. Absent when not set.
                    format: date
                    type: string
            required:
                - role
            type: object
        StaffPersonRoleKind:
            description: verneombud (the safety representative), amu_member (a member of the working environment committee) or hms_responsible.
            enum:
                - verneombud
                - amu_member
                - hms_responsible
            type: string
        StaffPersonRoleList:
            description: A person's roles, with the person's revision — the one a replace sends back in If-Match.
            properties:
                revision:
                    description: The person's revision.
                    format: int32
                    type: integer
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    type: array
            required:
                - roles
                - revision
            type: object
        StaffPersonRolesRequest:
            description: A person's roles, all of them, at most twenty — a full replace. An empty list removes them all.
            properties:
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    maxItems: 20
                    type: array
            required:
                - roles
            type: object
        StaffPersonStatus:
            description: 'Where the person stands today, in the business time zone: active (an employment has started and not ended — the end day itself is still worked), upcoming (none active, one starting later; date is the earliest such start), ended (every employment ended before today; date is the latest end) or none (no employment yet).'
            properties:
                date:
                    description: The start for upcoming, the end for ended; absent otherwise.
                    format: date
                    type: string
                state:
                    enum:
                        - active
                        - upcoming
                        - ended
                        - none
                    type: string
            required:
                - state
            type: object
        StaffPersonSummary:
            description: A person as the work group names them.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - displayName
                - employeeNumber
            type: object
        StaffApproval:
            description: A request the caller decides, with its person.
            properties:
                absence:
                    $ref: '#/components/schemas/StaffAbsence'
                person:
                    $ref: '#/components/schemas/StaffPersonSummary'
            required:
                - absence
                - person
            type: object
        StaffCalendar:
            description: The absence calendar of a range.
            properties:
                from:
                    format: date
                    type: string
                to:
                    format: date
                    type: string
                publicHolidays:
                    description: The public holidays in the range, from the platform calendar.
                    items:
                        format: date
                        type: string
                    type: array
                people:
                    items:
                        $ref: '#/components/schemas/StaffCalendarPerson'
                    type: array
            required:
                - from
                - to
                - publicHolidays
                - people
            type: object
        StaffCalendarPerson:
            description: One person's row of the calendar, their absences in the range as bars, each shaped as GET /absences shapes it for the caller.
            properties:
                person:
                    $ref: '#/components/schemas/StaffPersonSummary'
                absences:
                    items:
                        $ref: '#/components/schemas/StaffAbsence'
                    type: array
            required:
                - person
                - absences
            type: object
        StaffPersonUser:
            description: The user the person is linked to for self-service, as the user directory names them. Present for the person themselves, staff:manage and staff:personal-data, when a link exists. A user the directory no longer knows is "Unknown user", not active.
            properties:
                active:
                    description: False when the account is disabled.
                    type: boolean
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
                - active
            type: object
        StaffPersonalData:
            description: 'A person''s data in one file (design S16): the record, the next of kin, the roles, every employment with its terms, the self-service link, the documents'' metadata (the files themselves are read through the documents'' own downloads), every absence, the holiday adjustments, every sick-leave case with its milestones, this year''s care days, the standing of egenmelding today and every event, read in one snapshot. exportedAt is when it was made. GET /people/{id}/personal-data''s is the complete file, the sealed values opened and the events whole; GET /me/export''s is the person''s own, without the sealed values, HR''s notes and the terms'' notes, its events shaped as the person reads their history and its absence, cases and care days as the person reads them.'
            properties:
                absences:
                    description: Every absence of the person, in any status, newest first.
                    items:
                        $ref: '#/components/schemas/StaffAbsence'
                    type: array
                account:
                    $ref: '#/components/schemas/StaffPersonalDataAccount'
                careDays:
                    $ref: '#/components/schemas/StaffCareDays'
                cases:
                    description: Every sick-leave case of the person with its milestones, newest first.
                    items:
                        $ref: '#/components/schemas/StaffCase'
                    type: array
                documents:
                    items:
                        $ref: '#/components/schemas/StaffDocument'
                    type: array
                employments:
                    items:
                        $ref: '#/components/schemas/StaffPersonalDataEmployment'
                    type: array
                events:
                    description: Every event of the person, oldest first.
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                exportedAt:
                    format: date-time
                    type: string
                holidayAdjustments:
                    description: Every adjustment of the person's holiday account, newest year first.
                    items:
                        $ref: '#/components/schemas/StaffHolidayAdjustment'
                    type: array
                link:
                    $ref: '#/components/schemas/StaffPersonLink'
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    type: array
                person:
                    $ref: '#/components/schemas/StaffPersonalDataPerson'
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    type: array
                selfCertification:
                    $ref: '#/components/schemas/StaffSelfCertification'
            required:
                - exportedAt
                - person
                - nextOfKin
                - roles
                - employments
                - link
                - account
                - documents
                - absences
                - holidayAdjustments
                - cases
                - careDays
                - selfCertification
                - events
            type: object
        StaffPersonalDataBankAccount:
            description: The bank account on file. value, the whole number, is in the complete file only.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                last4:
                    type: string
                value:
                    type: string
            required:
                - kind
                - last4
            type: object
        StaffPersonalDataAccount:
            description: The account flag and the link's state, as the person's file carries them.
            properties:
                accountEmailKind:
                    $ref: '#/components/schemas/StaffAccountEmailKind'
                linkState:
                    description: The link's state (StaffAccountLink's). Absent when the person has no link.
                    type: string
                provisionAccount:
                    type: boolean
                provisionFrom:
                    format: date
                    type: string
            required:
                - provisionAccount
                - accountEmailKind
            type: object
        StaffPersonalDataEmployment:
            description: One employment and its terms, oldest first.
            properties:
                employment:
                    $ref: '#/components/schemas/StaffEmployment'
                terms:
                    items:
                        $ref: '#/components/schemas/StaffTerms'
                    type: array
            required:
                - employment
                - terms
            type: object
        StaffPersonalDataNationalId:
            description: Whether a national identity number is on file, and its kind. country (a foreign id's) and value, the whole number, are in the complete file only.
            properties:
                country:
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                onFile:
                    type: boolean
                value:
                    type: string
            required:
                - onFile
            type: object
        StaffPersonalDataPerson:
            description: The person's record in a personal-data file — every field of theirs, each absent when not set, the care-day fields included. notes, erasedAt, legalHold and reassessedAt are in the complete file only.
            properties:
                bankAccount:
                    $ref: '#/components/schemas/StaffPersonalDataBankAccount'
                birthDate:
                    format: date
                    type: string
                childrenUnder12:
                    description: The children the person cares for through the year they turn twelve, as HR typed it (plan reading 29).
                    format: int32
                    type: integer
                chronicallyIllChildren:
                    description: The chronically ill or disabled children with NAV's extra-days decision, through the year they turn eighteen.
                    format: int32
                    type: integer
                city:
                    type: string
                country:
                    type: string
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    format: date-time
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                legalHold:
                    $ref: '#/components/schemas/StaffLegalHold'
                nationalId:
                    $ref: '#/components/schemas/StaffPersonalDataNationalId'
                notes:
                    type: string
                phoneMobile:
                    type: string
                phonePrivate:
                    type: string
                phoneWork:
                    type: string
                postalCode:
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    type: string
                reassessedAt:
                    format: date-time
                    type: string
                soleCarer:
                    description: Whether the person is alone in caring for the children (ftrl. § 9-6).
                    type: boolean
                status:
                    $ref: '#/components/schemas/StaffPersonStatus'
                street:
                    type: string
                workCountry:
                    type: string
                workEmail:
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - status
                - nationalId
            type: object
        StaffProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: in this delivery org_number_invalid, employee_number_too_long, employee_number_taken, work_email_taken, person_in_use, structure_archived, structure_default, department_cycle, revision_conflict, national_id_invalid, national_id_duplicate, national_id_birth_date_mismatch, bank_account_invalid, user_inactive, user_linked_elsewhere, no_person, employment_number_taken, end_reason_required, terms_required_fields, temporary_ground_required, appointment_form_mismatch, probation_too_long, full_time_hours_mismatch, terms_valid_from_taken, terms_before_start, terms_after_end, terms_first_row_start, terms_not_latest, self_manager, manager_cycle, document_type_unsupported, document_too_large, document_count_exceeded, category_restricted, category_in_use, seed_immutable, holiday_scheme_in_use, absence_type_in_use, absence_overlap, absence_note_on_sick, self_certification_exhausted, self_certification_too_early, self_certification_withdrawn, holiday_postponement_not_applicable, holiday_postponement_too_late, percent_not_allowed, hours_on_day_type, absence_not_requested, absence_not_cancellable, absence_status_change, absence_visibility_change (409: a change between an HR-only type and any other), carry_over_recorded, own_request, person_erased, storage_unavailable, legal_hold, reassessment_not_due, retention_busy, threshold_unknown, accounts_unavailable (503: no module provides accounts, or identity could not be reached), account_not_managed (409: Disable now on a user Staff does not manage), account_privileged (409: Disable now on an Owner, a SystemAdmin or the last active Owner), account_mismatch (409: Disable now on a user carrying another employee number), link_managed (409: the user is Staff-managed, or the link is the accounts worker''s) and accounts_busy (409: the accounts worker holds the person''s link right now). errors carries the field errors of a 400, keyed by the request''s camelCase field (an element of a list as nextOfKin[0].name, a nested one as terms.ftePercent); a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        StaffRelationshipType:
            description: The a-melding's kind of arbeidsforhold.
            enum:
                - ordinary
                - maritime
                - freelancer
                - pension_or_other
            type: string
        StaffRemunerationType:
            enum:
                - monthly
                - hourly
                - commission
                - fee
                - piecework
            type: string
        StaffErasedKind:
            description: What one kind of erase removed (design S15). count is the number of items it removed — each column value nulled, each row deleted (a next of kin, a document) and each event payload rewritten.
            properties:
                count:
                    format: int64
                    type: integer
                kind:
                    description: 'D — the personnel administration, a grace period after the last employment ended; health — the health documents not filed under a sick-leave case and the health content of the history no case owns, healthRetentionDays after it; A — one employment''s pay terms, its contract and attest documents and the pay in its events, five years after the year it ended; cases — a closed sick-leave case''s health content (its notes, its milestones'' facts, its rows'' sick type and degree, its documents and its events'' health fields), healthRetentionDays after the case closed, whatever the employment — and with eraseSickCaseDates on, the case itself: its milestones and the case row deleted, its rows unlinked keeping their days as absent, its events blanked to their kind; childSick — a year''s child-sick rows'' type and their events'' health fields, healthRetentionDays after the year ended; withdrawal — a withdrawal of egenmelding and its events, healthRetentionDays after it lapsed; pregnancyHealth — with erasePregnancyHealthTypes on, a year''s rows of svangerskapskontroll, svangerskapspermisjon, fødselspermisjon and helse given a reserved type — the HR-only pair for an HR-only type, absent_hours for helse, by unit — and their events'' type values replaced, healthRetentionDays after the year ended.'
                    enum:
                        - D
                        - health
                        - A
                        - cases
                        - childSick
                        - withdrawal
                        - pregnancyHealth
                    type: string
            required:
                - kind
                - count
            type: object
        StaffRetentionDeletions:
            description: One pass over the deletion ledger — the objects the erases and the document deletes queued for removal from the object store.
            properties:
                attempted:
                    description: The ledger rows due and claimed, each one attempt at its object.
                    format: int32
                    type: integer
                succeeded:
                    description: The attempts the store confirmed; each such row is gone from the ledger.
                    format: int32
                    type: integer
            required:
                - attempted
                - succeeded
            type: object
        StaffRetentionErased:
            description: What one erase cycle removed, per kind, summed over the people it erased; a kind no erase ran for is absent. The health kinds (health, cases, childSick, withdrawal, pregnancyHealth) are answered to a caller holding staff:personal-data alone.
            properties:
                kinds:
                    items:
                        $ref: '#/components/schemas/StaffErasedKind'
                    type: array
            required:
                - kinds
            type: object
        StaffRetentionRun:
            description: One run of the retention worker's two steps — an erase cycle and a pass over the deletion ledger — made by hand.
            properties:
                deletions:
                    $ref: '#/components/schemas/StaffRetentionDeletions'
                erased:
                    $ref: '#/components/schemas/StaffRetentionErased'
            required:
                - erased
                - deletions
            type: object
        StaffRetentionState:
            description: The retention run's state, derived from the deletion ledger and the history (no column of its own).
            properties:
                failingDeletions:
                    description: Ledger rows whose object the store has refused at least once; each is retried with a growing wait, without end, until the store confirms.
                    format: int64
                    type: integer
                lastErasedAt:
                    description: When the retention run last erased anything — the latest erased event; to a caller without staff:personal-data, the latest that erased something other than health content. Absent when it never has.
                    format: date-time
                    type: string
                oldestPendingSince:
                    description: When the oldest object still in the ledger was queued. Absent when the ledger is empty.
                    format: date-time
                    type: string
                pendingDeletions:
                    description: Objects queued for removal from the object store and not yet confirmed gone.
                    format: int64
                    type: integer
            required:
                - pendingDeletions
                - failingDeletions
            type: object
        StaffSelfCertPolicy:
            description: 'The self-certification (egenmelding) policy (design S10): minimum — the statutory one, 3 calendar days an occurrence and 4 occurrences in a rolling year; extended — 8 days an occurrence and 24 days in a rolling year; custom — the numbers as set.'
            enum:
                - minimum
                - extended
                - custom
            type: string
        StaffSelfCertWithdrawalRequest:
            description: 'A withdrawal of the right to egenmelding: until — after today, at most a year ahead — and the reason; until null lifts it.'
            properties:
                until:
                    format: date
                    nullable: true
                    type: string
                reason:
                    description: '1 to 500 characters; required with until.'
                    type: string
            type: object
        StaffSelfCertification:
            description: 'A person''s standing under the self-certification policy today (design S10, §4 Egenmelding): the limits by the policy''s name, the occurrences and calendar days used in the rolling year ending today — a run of contiguous egenmelding days, days off between included, being one occurrence — and the withdrawal.'
            properties:
                personId:
                    format: int64
                    type: integer
                policy:
                    $ref: '#/components/schemas/StaffSelfCertPolicy'
                daysPerOccurrence:
                    format: int32
                    type: integer
                occurrencesPerYear:
                    description: 'Absent under extended, which counts days.'
                    format: int32
                    type: integer
                daysPerYear:
                    description: 'Absent under minimum, which counts occurrences.'
                    format: int32
                    type: integer
                occurrencesUsed:
                    format: int32
                    type: integer
                daysUsed:
                    format: int32
                    type: integer
                eligibleFrom:
                    description: 'The first day the months of employment allow egenmelding. Absent when the person has no employment.'
                    format: date
                    type: string
