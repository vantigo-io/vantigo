        StaffMeta:
            description: What the Staff app needs before it draws anything. defaultAccountKind — the kind a new person takes, as the settings hold it — and providers are staff:manage's and absent to anyone else; defaultAccountKind is absent too when no module provides accounts.
            properties:
                absenceTypes:
                    description: The absence types that are not hidden, in their order, names in both languages — every caller's.
                    items:
                        $ref: '#/components/schemas/StaffAbsenceType'
                    type: array
                capabilities:
                    $ref: '#/components/schemas/StaffCapabilities'
                holidaySchemes:
                    description: Every holiday scheme, archived ones included, with its figures converted to working days.
                    items:
                        $ref: '#/components/schemas/StaffHolidayScheme'
                    type: array
                defaultAccountKind:
                    $ref: '#/components/schemas/StaffAccountKind'
                locations:
                    description: The locations not archived, by name — every caller's, so the person's location preference (staff competence design S9) is picked from the company's places without the directory; the structure's list, archived ones included, stays staff:view's and staff:manage's.
                    items:
                        $ref: '#/components/schemas/StaffLocation'
                    type: array
                providers:
                    description: staff:manage only — every external identity provider an enabled module offers (the IdentityProvisioner slot), each with the status the provider answers now, asked before any snapshot; a provider that could not be asked reads failing, unreachable. The entra kind is offered only when its provider is among them. Empty when no enabled module offers one; absent to anyone else.
                    items:
                        $ref: '#/components/schemas/StaffIdentityProvider'
                    type: array
                provisioningRolesSet:
                    description: staff:manage only — whether an Owner has named the roles Staff may give (identity's employee roles), without which a local account cannot be enabled. Absent to anyone else, and when accounts are unavailable.
                    type: boolean
                structure:
                    $ref: '#/components/schemas/StaffStructure'
                timeZone:
                    description: The workspace's business time zone, an IANA name, set under Workspace administration. Every date of this module — a start, an end, "today" — is a calendar day in it.
                    type: string
                today:
                    description: Today's calendar day in the business time zone, as the server judges it — the day a form should start from, so the app and the server never disagree about which day it is around midnight.
                    format: date
                    type: string
            required:
