    /api/v1/staff/absences/{id}/postpone-holiday:
        post:
            description: 'Records the employee''s demand to postpone approved ferie for a 100 % sykmelding (ferieloven § 9), by staff:manage, and splits each approved ferie row the sykmelding lies over around it — the part before stays, the part after becomes a new approved row, ferie it covers whole is cancelled — so the days return to the holiday account. A sykmelding never splits ferie by itself: until the demand is recorded the two stand side by side and the attention item holidayAffectedBySickness names the ferie. demandedOn (today when left out, never after today) is the day the employee made the demand, with a legeerklæring. Sickness that began before the holiday (§ 9 (1)) must have been demanded by the last working day before the holiday''s first day — otherwise holiday_postponement_too_late; sickness during the holiday (§ 9 (2)) gives replacement days, the demand to come without undue delay once the work is resumed, which HR judges. A demand is never dated before the sykmelding''s first day (400). § 9 sets no least number of sick days. A graded sykmelding, a row that is no sykmelding, or one over no approved ferie is holiday_postponement_not_applicable. Each split is an absence_split event carrying demandedOn and postponedUnder (class E).'
            operationId: postStaffAbsencesByIdPostponeHoliday
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffHolidayPostponementRequest'
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffHolidayPostponement'
                    description: 'OK'
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Bad Request — demandedOn is after today, or before the sykmelding''s first day: a demand follows the sickness.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — holiday_postponement_not_applicable, holiday_postponement_too_late, or person_erased.'
            summary: Postpone holiday for sickness
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
