                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Forbidden — own_request (the caller''s own, which another decider decides); without a code, the uniform 403.'
                "404":
                    description: 'Not Found — no such absence, or one the caller may not see. The body is empty.'
                "409":
