            operationId: deleteStaffPersonCompetencesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: Remove the superseded rows of the competence with it (staff:manage).
                  in: query
                  name: chain
                  schema:
                    type: boolean
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no row has that id, or the caller may not see its person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — verified_row (the person removing their own verified row), superseded (a superseded row, which goes only with its chain); person_erased when the person has been erased.
            summary: Remove a competence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: 'Changes a current row''s level, dates, issuer and reference, recorded as competence_changed: the person their own declared row, a manager of theirs today, staff:approve or staff:manage any current row. A verifier who changes a verified row''s level verifies it anew — the stamp''s instant and verifier theirs, its basis and note kept; a new validTo clears the expiry reminders already sent, so the row is reminded of again ahead of its new end. Anyone else who sees the person gets the uniform 403; a row the caller may not see is the bare 404.'
            operationId: putStaffPersonCompetencesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonCompetenceChangeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonCompetence'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, level_required or level_not_allowed on level, skill_no_validity on validTo (an end on a skill), or If-Match is not a revision.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no row has that id, or the caller may not see its person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, verified_row (the person changing their own verified row; they renew it instead), superseded (a superseded row); person_erased when the person has been erased.
            summary: Change a competence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/person-competences/{id}/evidence:
        get:
            description: 'Streams the evidence document of a row as GET /documents/{id} streams a document — the type it was sniffed as on upload, named as uploaded (RFC 5987), inline except HEIC, never cached and never sniffed — to everyone who reads the row''s detail: the person, a manager of theirs today, staff:approve, staff:manage and staff:personal-data. A document moved since into a restricted category is read only by the health group''s readers. To anyone else — a colleague included — for a row the caller may not see and for a row with no evidence, it is the bare 404 an unknown id is.'
            operationId: getStaffPersonCompetencesByIdEvidence
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no row has that id, the caller may not read its detail, or it has no evidence. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Service Unavailable — storage_unavailable, the object store could not be read.
            summary: Download a competence's evidence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: 'Files the evidence of a current row in the person''s archive, under the seeded certificate category, and names it on the row; an earlier evidence document stays in the archive. One PDF, JPEG, PNG or HEIC file of at most 10 MiB in the multipart field file, whose own bytes decide its type and must agree with the type and extension it is sent under. Allowed to the row''s person for their own current row and to staff:manage or staff:personal-data, as any document; anyone else who sees the person gets the uniform 403. At most 200 documents per person. Recorded as document_added and competence_evidence_added.'
            operationId: postStaffPersonCompetencesByIdEvidence
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonCompetence'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — on file, document_type_unsupported (not one of the four types, or its bytes disagree with its declared type or extension) or document_too_large (over 10 MiB), and a plain field error when it is missing or empty.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Forbidden — the uniform 403.
                "404":
                    description: Not Found — no row has that id, or the caller may not see its person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — superseded (a superseded row), document_count_exceeded (the person has 200 documents); person_erased when the person has been erased.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 600 document uploads an hour from one client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Service Unavailable — storage_unavailable, the object store could not be written to; nothing was recorded.
            summary: Add a competence's evidence
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
