                bankAccount:
                    $ref: '#/components/schemas/StaffPersonBankAccount'
                birthDate:
                    description: Private. Absent when not set.
                    format: date
                    type: string
                businessUnit:
                    $ref: '#/components/schemas/StaffBusinessUnitSummary'
                capabilities:
                    $ref: '#/components/schemas/StaffPersonCapabilities'
                childrenUnder12:
                    description: 'The care-day fields (design S11): the children through the year they turn twelve without NAV''s extra-days decision, 0 to 20. The person''s own, staff:manage''s and staff:personal-data''s. Absent when not recorded.'
                    format: int32
                    type: integer
                chronicallyIllChildren:
                    description: The children with NAV's decision of extra care days for a chronic illness or disability, through the year they turn eighteen, 0 to 20. A care-day field. Absent when not recorded.
                    format: int32
                    type: integer
                city:
                    description: Private. Absent when not set.
                    type: string
                country:
                    description: Private. Absent when not set.
                    type: string
                department:
                    $ref: '#/components/schemas/StaffDepartmentSummary'
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person — staff:manage and staff:personal-data only (the hold group). Absent when not erased. An erased person is read-only but for the legal hold, the reassessment, an unlink and a rehire.
                    format: date-time
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                lastCompetenceReview:
                    $ref: '#/components/schemas/StaffLastCompetenceReview'
                legalHold:
                    $ref: '#/components/schemas/StaffLegalHold'
                location:
                    $ref: '#/components/schemas/StaffLocationSummary'
                manager:
                    $ref: '#/components/schemas/StaffPersonSummary'
                nationalId:
                    $ref: '#/components/schemas/StaffPersonNationalId'
                notes:
                    description: HR's notes — staff:manage and staff:personal-data only. Absent when not set.
                    type: string
                phoneMobile:
                    description: Private. Absent when not set.
                    type: string
                phonePrivate:
                    description: Private. Absent when not set.
                    type: string
                phoneWork:
                    description: Absent when not set.
                    type: string
                postalCode:
                    description: Private. Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: Private. Absent when not set.
                    type: string
                reassessedAt:
                    description: When staff:personal-data recorded the reassessment of an erased person — the hold group. Absent when not reassessed.
                    format: date-time
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                soleCarer:
                    description: Whether the person cares for the children alone (aleneomsorg). A care-day field. Absent when not recorded.
                    type: boolean
                status:
                    $ref: '#/components/schemas/StaffPersonStatus'
                street:
                    description: Private. Absent when not set.
                    type: string
                title:
                    description: The job title of the terms in force today. Absent when there is none.
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - capabilities
                - revision
                - status
            type: object
        StaffPersonBankAccount:
            description: The bank account on file, as its kind and its last four digits. Present for the person themselves, staff:manage and staff:personal-data, when one is on file.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                last4:
                    type: string
            required:
                - kind
                - last4
            type: object
        StaffPersonCapabilities:
            description: What the caller may do with this person. The access layer still decides every request.
            properties:
                canDecide:
                    description: 'The caller decides the person''s absence requests today (design S12): a manager of theirs by the one manager rule, staff:approve or staff:manage — on oneself only for the self-approver (POST /absences/{id}/approve).'
                    type: boolean
                canEdit:
                    description: staff:manage — change the record, the next of kin and the roles, and delete a person created in error.
                    type: boolean
                canHold:
                    description: staff:personal-data — set and lift the legal hold, record a reassessment and export the person's data.
                    type: boolean
                canManageAccount:
                    description: staff:manage — the self-service link to a user and the account flag (PUT /people/{id}/account).
                    type: boolean
                canReadWishes:
                    description: The caller reads what the person wants — their interests, preferences and availability declaration (staff competence design S18) — the person, their managers today, staff:manage and staff:personal-data; never staff:approve alone (GET /people/{id}/interests).
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: The person themselves or staff:personal-data — the person's health documents.
                    type: boolean
                canSeePay:
                    description: The person themselves, staff:manage or staff:personal-data — the pay terms of the person's employments.
                    type: boolean
                canStampWishesSeen:
                    description: The caller stamps what the person wants Seen — the person's manager today or staff:manage, never the person and never staff:approve alone (POST /people/{id}/wishes/seen).
                    type: boolean
                canVerifyCompetence:
                    description: The caller verifies the person's competences (staff competence design S4) — the person's manager today, staff:approve or staff:manage, never the person (POST /person-competences/{id}/verify).
                    type: boolean
                isManager:
                    description: The caller manages the person today by the one manager rule — a manager of theirs, who decides their absence, ticks their sick-leave case's milestones and writes its accommodation note. False for oneself.
                    type: boolean
                self:
                    description: The caller's self-service link names the person — the person themselves.
                    type: boolean
            required:
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canManageAccount
                - canSeeHealth
                - canHold
                - canDecide
                - self
                - isManager
                - canVerifyCompetence
                - canReadWishes
                - canStampWishesSeen
            type: object
        StaffPersonCompetence:
            description: A person's competence row (staff competence design S3–S6) — current, or superseded by its renewal. A row is declared until it is verified. The detail fields (issuedOn, issuer, reference, evidence, source, the verification's and seenAt) are absent to a colleague, who reads the competence, its level and its validity alone.
            properties:
                competence:
                    $ref: '#/components/schemas/StaffCompetenceSummary'
                declaredAt:
                    description: When the row was entered.
                    format: date-time
                    type: string
                evidence:
                    $ref: '#/components/schemas/StaffCompetenceEvidence'
                expired:
                    description: A current row whose validTo has passed today.
                    type: boolean
                expiring:
                    description: A current row whose validTo is within the competence's reminderLeadDays of today and has not passed. False without a lead.
                    type: boolean
                id:
                    format: int64
                    type: integer
                issuedOn:
                    format: date
                    type: string
                issuer:
                    type: string
                level:
                    description: 0 to 4, on a competence with a level.
                    format: int32
                    type: integer
                personId:
                    format: int64
                    type: integer
                reference:
                    description: The certificate's number, or what tells it apart — a scaffolding height.
                    type: string
                revision:
                    description: Send it back as If-Match on PUT /person-competences/{id}.
                    format: int32
                    type: integer
                seenAt:
                    description: When the person's manager or HR stamped a current row Seen (POST /people/{id}/wishes/seen). Absent when it has not been seen.
                    format: date-time
                    type: string
                source:
                    description: Who entered the row — self (the person declared it), manager (a manager of theirs or staff:approve) or hr (staff:manage).
                    type: string
                superseded:
                    description: The row was renewed by a newer one, and is valid on no day.
                    type: boolean
                validFrom:
                    format: date
                    type: string
                validTo:
                    description: Absent without end.
                    format: date
                    type: string
                verified:
                    type: boolean
                verifiedAt:
                    format: date-time
                    type: string
                verifiedBasis:
                    description: evidence or observed.
                    type: string
                verifiedBy:
                    description: The verifier's name, as the user directory names them.
                    type: string
                verifiedNote:
                    type: string
            required:
                - id
                - personId
                - competence
                - validFrom
                - verified
                - superseded
                - expiring
                - expired
                - revision
                - declaredAt
            type: object
        StaffPersonCompetenceChangeRequest:
            description: A row's level, dates, issuer and reference, replaced as a whole — a field left out is cleared, but validFrom, which left out keeps its value. The level is required on a competence with one (level_required) and refused on one without (level_not_allowed), 0 to 4; validTo before validFrom is a field error; issuer at most 200 characters, reference at most 100.
            properties:
                issuedOn:
                    format: date
                    type: string
                issuer:
                    type: string
                level:
                    format: int32
                    type: integer
                reference:
                    type: string
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    type: string
            type: object
        StaffPersonCompetenceRequest:
            description: A competence declared by the person or added by a verifier or HR. The competence must be neither hidden nor archived (competence_unavailable on competenceId); the level is required on a competence with one (level_required) and refused on one without (level_not_allowed), 0 to 4; validFrom left out is issuedOn, else today; validTo before validFrom is a field error; issuer at most 200 characters, reference at most 100.
            properties:
                competenceId:
                    format: int64
                    type: integer
                issuedOn:
                    format: date
                    type: string
                issuer:
                    type: string
                level:
                    format: int32
                    type: integer
                reference:
                    type: string
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    type: string
            required:
                - competenceId
            type: object
        StaffPersonAccount:
            description: 'A person''s account flag (design S22) with the dates it derives and the links it drives: whether Staff provides the person with a user, from when, at which of their addresses, under which account kind — which carries the rule the installation''s authority mode did — the identity link''s state and, for a kind a provider holds, the provider link''s and the directory profile. The person themselves, staff:manage and staff:personal-data read it (the links group); anyone else gets the unknown id''s 404.'
            properties:
                accountEmailKind:
                    $ref: '#/components/schemas/StaffAccountEmailKind'
                accountKind:
                    $ref: '#/components/schemas/StaffAccountKind'
                address:
                    $ref: '#/components/schemas/StaffPersonAccountAddress'
                directoryProfile:
                    description: 'The directory profile (Entra design D8): every field the provider writes on the person''s external account, in its order, with whether the installation writes it and the value it would carry today — the person''s own data as the directory would see it. Absent when the person''s kind names no provider.'
                    items:
                        $ref: '#/components/schemas/StaffDirectoryField'
                    type: array
                groups:
                    description: 'The groups the person is in, archived groups aside, by name, with how each came in and since when (Entra design D9) — the groups a provider makes them a member of, and whose licences they get.'
                    items:
                        $ref: '#/components/schemas/StaffPersonGroup'
                    type: array
                link:
                    $ref: '#/components/schemas/StaffAccountLink'
                providerLink:
                    $ref: '#/components/schemas/StaffProviderLink'
                provisionAccount:
                    description: Whether Staff provides the person with a user.
                    type: boolean
                provisionFrom:
                    description: The day the account is to be enabled, as HR set it. Absent when HR set none.
                    format: date
                    type: string
                provisionFromEffective:
                    description: 'The day the account is enabled: provisionFrom when set, else the first day of the earliest employment that has not ended by today. Absent when there is neither. The account is prepared, disabled, createBeforeDays before it.'
                    format: date
                    type: string
                revision:
                    description: The account flag's own revision, which a change of the flag sends back in If-Match. Never the person's — no account write moves the person's revision, which a manager, an Approver and a colleague read.
                    format: int32
                    type: integer
            required:
                - provisionAccount
                - accountEmailKind
                - accountKind
                - address
                - revision
            type: object
        StaffPersonAccountRun:
            description: What Run now did for one person (POST /people/{id}/account/run), and their account after it.
            properties:
                account:
                    $ref: '#/components/schemas/StaffPersonAccount'
                invitationSent:
                    description: Whether identity sent the person a new invitation to choose a password. False when none was due, when one that can still be accepted is open, and when the last was made less than ten minutes ago — identity sends nothing then, and the run is still done.
                    type: boolean
            required:
                - invitationSent
                - account
            type: object
        StaffPersonAccountAddress:
            description: The address the account would be given — never the address itself, only which and whether the person has it.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffAccountEmailKind'
                present:
                    description: Whether the person has that address on file. A flag turned on without it waits (accountEmailMissing).
                    type: boolean
            required:
                - kind
                - present
            type: object
        StaffPersonAccountRequest:
            additionalProperties: false
            description: 'A full replace of the account flag''s three fields: what is left out is cleared — provisionFrom to none, accountEmailKind to work. accountKind is the one field the replace keeps when it is left out.'
            properties:
                accountEmailKind:
                    description: 'work or private; null or left out reads work.'
                    enum:
                        - work
                        - private
                    nullable: true
                    type: string
                accountKind:
                    description: 'The person''s account kind; left out, it keeps the kind they have. entra — or any provider''s key — is a provider_missing field error unless an enabled module offers that provider; a change from entra to local or external is account_kind_locked (409) while the person''s entra link is enabled or disabled — a person leaves the directory by Disable now or by the end of their employment, never by a change of kind. A change from local to entra while the person''s user is pending and has no credential completes that user when the external account arrives.'
                    enum:
                        - local
                        - external
                        - entra
                    type: string
                provisionAccount:
                    type: boolean
                provisionFrom:
                    description: 'The day to enable the account from; null or left out derives it from the employments.'
                    format: date
                    nullable: true
                    type: string
            required:
                - provisionAccount
            type: object
        StaffPersonGroup:
            description: A group a person is in, archived groups aside.
            properties:
                id:
                    format: int64
                    type: integer
                key:
                    description: Absent on My page's list, which names the groups only.
                    type: string
                name:
                    type: string
                since:
                    description: The day the person joined it. Absent on My page's list.
                    format: date
                    type: string
                source:
                    $ref: '#/components/schemas/StaffGroupKind'
            required:
                - id
                - name
            type: object
        StaffPersonInterest:
            description: One of a person's interests in a competence (staff competence design S8). Read by the person, their managers today, staff:manage and staff:personal-data.
            properties:
                competence:
                    $ref: '#/components/schemas/StaffCompetenceSummary'
                competenceId:
                    format: int64
                    type: integer
                held:
                    description: The person holds a current row of the competence, declared or verified — they want to use it more; otherwise they want to learn it.
                    type: boolean
                seenAt:
                    description: When the person's manager or HR stamped the interest Seen. Absent when it has not been seen since it was written.
                    format: date-time
                    type: string
            required:
                - competenceId
                - competence
                - held
            type: object
        StaffPersonInterestList:
            description: A person's interests, in the catalogue's order.
            properties:
                interests:
                    items:
                        $ref: '#/components/schemas/StaffPersonInterest'
                    type: array
            required:
                - interests
            type: object
        StaffPersonInterestsRequest:
            additionalProperties: false
            description: 'A person''s interests, all of them — a full replace, by the person alone; an empty list removes them. At most twenty; a competence named twice is refused on the later index (interests[3].competenceId), and a new interest in an unknown, hidden or archived competence is competence_unavailable on its competenceId — one already on file is kept as it is. A property a row does not name is refused.'
            properties:
                interests:
                    items:
                        additionalProperties: false
                        properties:
                            competenceId:
                                format: int64
                                type: integer
                        required:
                            - competenceId
                        type: object
                    maxItems: 20
                    type: array
            required:
                - interests
            type: object
        StaffPersonLink:
            description: A person's self-service link to a user (design S24, §3.6) — the link that makes the user the person themselves to this module, and nothing else. linked is false, and every other field absent, when the person is linked to nobody.
            properties:
                linked:
                    type: boolean
                managed:
                    description: Whether identity reports the user as managed by Staff — false for every self-service link.
                    type: boolean
                state:
                    description: The link's state; linked for a self-service link.
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
            required:
                - linked
            type: object
        StaffPersonLinkRequest:
            description: The user to link the person to, or null to unlink them.
            properties:
                userId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - userId
            type: object
        StaffPersonListItem:
            description: A person in the directory — the work group, with the manager, the department, the title and the location from the terms in force today and the business unit of their employment (each absent when there is none; the manager is the one who manages them today — the manager the terms name when they are employed today, else the department's manager climbing the parents, a manager who has left skipped), and where the person stands today.
            properties:
                businessUnit:
                    $ref: '#/components/schemas/StaffBusinessUnitSummary'
                department:
                    $ref: '#/components/schemas/StaffDepartmentSummary'
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person, for staff:manage; absent otherwise. An erased person is listed under status ended or all, their state ended.
                    format: date-time
                    type: string
                familyName:
                    type: string
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/StaffLocationSummary'
                manager:
                    $ref: '#/components/schemas/StaffPersonSummary'
                onLeaveToday:
                    description: 'Whether an approved or registered absence of a whole or part day, of any type, covers today (design §7, "on leave today") — the same to every reader of the list, a colleague included, and never naming the type: it says no more than the calendar''s "absent" bar. A request does not count, nor an hour registration.'
                    type: boolean
                phoneWork:
                    description: Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                status:
                    $ref: '#/components/schemas/StaffPersonStatus'
                title:
                    description: The job title of the terms in force today. Absent when there is none.
                    type: string
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - status
                - onLeaveToday
            type: object
        StaffPersonNationalId:
            description: Whether a national identity number is on file, and its kind — never a digit of it. Present for the person themselves, staff:manage and staff:personal-data.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                onFile:
                    type: boolean
            required:
                - onFile
            type: object
        StaffPersonPreference:
            description: One of a person's preferences (staff competence design S9), one per kind. Read by the person, their managers today, staff:manage and staff:personal-data.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffPreferenceKind'
                seenAt:
                    description: When the person's manager or HR stamped the preference Seen. Absent when it has not been seen since it was written.
                    format: date-time
                    type: string
                value:
                    additionalProperties: true
                    description: 'The preference, its shape by kind — weekdays {"days": [1..7]}, ISO weekdays, 1 to 7 distinct; time_of_day {"parts": ["morning" | "day" | "evening" | "night"]}, 1 to 4 distinct; location {"locationIds": [...]}, 1 to 10 distinct ids of locations not archived; travel {"extent": "none" | "regional" | "national" | "international"}; remote {"share": "never" | "some" | "mostly" | "only"}; max_consecutive_days {"days": 1..14}; max_hours_per_week {"hours": 1..60}. No kind carries free text. Answered in its canonical form, the days and parts sorted.'
                    type: object
                weight:
                    description: 1 (nice to have), 2 (matters) or 3 (important).
                    format: int32
                    type: integer
            required:
                - kind
                - value
                - weight
            type: object
        StaffPersonPreferenceList:
            description: A person's preferences, by kind.
            properties:
                preferences:
                    items:
                        $ref: '#/components/schemas/StaffPersonPreference'
                    type: array
            required:
                - preferences
            type: object
        StaffPersonPreferencesRequest:
            additionalProperties: false
            description: 'A person''s preferences, all of them — a full replace, by the person alone; an empty list removes them. At most seven, one per kind (a kind sent again is refused on the later index, preferences[1].kind); weight 1 to 3 (preferences[0].weight); the value as StaffPersonPreference describes it, a key the kind does not take refused (preferences[0].value), and an unknown or archived location in a new or changed preference refused on its value. A property a row does not name is refused.'
            properties:
                preferences:
                    items:
                        additionalProperties: false
                        properties:
                            kind:
                                $ref: '#/components/schemas/StaffPreferenceKind'
                            value:
                                additionalProperties: true
                                description: The kind's object, as StaffPersonPreference's value describes it.
                                type: object
                            weight:
                                description: 1 to 3.
                                format: int32
                                type: integer
                        required:
                            - kind
                            - value
                            - weight
                        type: object
                    maxItems: 7
                    type: array
            required:
                - preferences
            type: object
        StaffPersonRequest:
            additionalProperties: false
            description: 'A person''s editable fields, the whole record as staff:manage replaces it (design §3.1, §5): the work group, the private group and HR''s notes. The national identity number and the bank account are written through their own operations under staff:personal-data, and the self-service link through its own; a property this schema does not name — one of those among them — is refused as a 400 naming it. On a change every optional field left out is cleared, except displayName, which stays.'
            properties:
                birthDate:
                    description: A calendar date. Private.
                    format: date
                    type: string
                childrenUnder12:
                    description: 0 to 20 — the children through the year they turn twelve without NAV's extra-days decision. A care-day field; left out, it is cleared.
                    format: int32
                    type: integer
                chronicallyIllChildren:
                    description: 0 to 20 — the children with NAV's extra-days decision, through the year they turn eighteen. A care-day field; left out, it is cleared.
                    format: int32
                    type: integer
                city:
                    description: Up to 100 characters. Private (the home address).
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Private (the home address).
                    type: string
                displayName:
                    description: 1 to 200 characters, the name the person is shown by. Left out on a create, it is the given name and the family name; left out on a change, it stays as it is — it is set once from the names and then HR's to edit.
                    maxLength: 200
                    type: string
                employeeNumber:
                    description: 1 to 16 letters, digits or hyphens, unique however it is cased; employee_number_too_long when longer, employee_number_taken when another person has it. Left out on a create, it is generated as the settings' prefix and next number, skipping past any number already taken. It never changes after the create, so on a change it is left out or sent as it is.
                    maxLength: 16
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                familyName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                notes:
                    description: HR's notes, up to 2000 characters. Read by staff:manage and staff:personal-data only — never by the person.
                    maxLength: 2000
                    type: string
                phoneMobile:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phonePrivate:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phoneWork:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                postalCode:
                    description: Up to 16 characters. Private (the home address).
                    maxLength: 16
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: An email address of up to 254 characters, stored lower-cased. Private.
                    maxLength: 254
                    type: string
                soleCarer:
                    description: Whether the person cares for the children alone. A care-day field; left out, it is cleared.
                    type: boolean
                street:
                    description: Up to 200 characters. Private (the home address).
                    maxLength: 200
                    type: string
                workCountry:
                    description: Where the person works from (the usage location), an ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                workEmail:
                    description: An email address of up to 254 characters, stored lower-cased, unique however it is cased (work_email_taken).
                    maxLength: 254
                    type: string
            required:
                - givenName
                - familyName
            type: object
        StaffPersonRole:
            description: A role a person holds for the company (design S6), with the dates they were elected for.
            properties:
                fromDate:
                    description: Absent when not set.
                    format: date
                    type: string
                role:
                    $ref: '#/components/schemas/StaffPersonRoleKind'
                toDate:
                    description: On or after fromDate. Absent when not set.
                    format: date
                    type: string
            required:
                - role
            type: object
        StaffPersonRoleKind:
            description: verneombud (the safety representative), amu_member (a member of the working environment committee) or hms_responsible.
            enum:
                - verneombud
                - amu_member
                - hms_responsible
            type: string
        StaffPersonRoleList:
            description: A person's roles, with the person's revision — the one a replace sends back in If-Match.
            properties:
                revision:
                    description: The person's revision.
                    format: int32
                    type: integer
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    type: array
            required:
                - roles
                - revision
            type: object
        StaffPersonRolesRequest:
            description: A person's roles, all of them, at most twenty — a full replace. An empty list removes them all.
            properties:
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    maxItems: 20
                    type: array
            required:
                - roles
            type: object
        StaffPersonStatus:
            description: 'Where the person stands today, in the business time zone: active (an employment has started and not ended — the end day itself is still worked), upcoming (none active, one starting later; date is the earliest such start), ended (every employment ended before today; date is the latest end) or none (no employment yet).'
            properties:
                date:
                    description: The start for upcoming, the end for ended; absent otherwise.
                    format: date
                    type: string
                state:
                    enum:
                        - active
                        - upcoming
                        - ended
                        - none
                    type: string
            required:
                - state
            type: object
        StaffPersonSummary:
            description: A person as the work group names them.
