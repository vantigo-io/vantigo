            summary: Get the register's figures
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/stats/attention:
        get:
            description: The dashboard's attention items for the caller (StaffStatsAttentionItem names each type, its trigger and its audience) — staff:manage's, staff:personal-data's, and a manager's for the people they manage today — read in one snapshot. A caller with none of these gets an empty list, never a 403.
            operationId: getStaffStatsAttention
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffStatsAttentionItem'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the register's attention items
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/terms/{id}:
        delete:
            description: Deletes an employment's latest terms row, so the one before it is in force again. The first row is never deleted. The deletion is a terms_deleted event naming the row's values.
            operationId: deleteStaffTermsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such terms row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_not_latest when a later row exists; terms_first_row_start for the first row; manager_cycle when the row in force again closes a loop in the manager graph; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Delete the latest terms row
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
        put:
            description: 'Replaces a terms row: the latest one, or any one with correction true — HR''s correction of a past row (design reading 11). A field left out is cleared. The first row stays dated the employment''s start. The change is a terms_corrected event naming each field with its value before and after.'
            operationId: putStaffTermsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the terms row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffTermsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffTerms'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or validFrom is missing; terms_required_fields when employmentType or ftePercent is missing (errors names each); temporary_ground_required when the row is midlertidig without a ground; appointment_form_mismatch when the appointment form does not agree with the employment type; probation_too_long when the probation ends more than six months after the start, or more than half the expected term of a temporary employment, or an extension is not agreed, has no reason or is longer than the probation itself; full_time_hours_mismatch when the hours for a full position break the a-melding's rule for the working-hours scheme.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such terms row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; terms_not_latest when the row is not the latest and correction is not true; terms_valid_from_taken when the employment has a row on that date; terms_before_start before the employment's start; terms_after_end after its end; terms_first_row_start when the first row would not be dated the start; self_manager when the manager is the person; manager_cycle when the manager — named on the row, or the department's — would close a loop in the manager graph on the row's date or any later date the graph changes; structure_archived when a department or location newly named is archived; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Change a terms row
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/thresholds/{key}/acknowledge:
        post:
            description: |-
                Acknowledges a threshold (design S20) — 5, 30 or 50 people, or otp — once and permanently, in one transaction under the settings row's lock: the settings record when, and a threshold_acknowledged event of the installation names the caller and the key. Its attention item is not shown again, whatever the headcount does. Acknowledging a threshold already acknowledged changes nothing, records no event and answers the same. A threshold need not be crossed to be acknowledged. Any other key is 404 threshold_unknown.
            operationId: postStaffThresholdsByKeyAcknowledge
            parameters:
                - in: path
                  name: key
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffThresholdsAcknowledged'
                    description: OK — when each threshold was acknowledged, this one included.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Not Found — threshold_unknown: the key is none of 5, 30, 50 and otp.'
            summary: Acknowledge a threshold
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
