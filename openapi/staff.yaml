    /api/v1/staff/payroll/export:
        get:
            description: |-
                A month's employments as payroll reads them (design S18), behind the module's payroll port, whose one format is csv: UTF-8 with a byte order mark, semicolon-separated, CRLF line ends, a header row, ISO dates and the decimal comma — the Expenses form — each cell guarded against a spreadsheet formula as the register's file is.

                One row per employment in the month — started on or before its last day, and open-ended or ended on or after its first — erased people's included, ordered by employee number and then employment number, with the terms in force on the month's last day, or on the end day when the employment ends earlier. The columns, in this order, with sentence-case English headers: Employee number; Name (given and family name); Employment number; Business unit org number; Start; End and End reason — filled only in the month the employment ends, the reason as Skatteetaten's sluttårsak code; Occupation code; Full-time hours; FTE percent; FTE changed; Working hours scheme (Skatteetaten's arbeidstidsordning code); Appointment form (Skatteetaten's ansettelsesform code — the three 2025 forms' strings are unverified against Skatteetaten's kodeliste); Remuneration type (as stored — the a-melding has not carried one since 2019); Salary changed; Department (its code); Cost centre (the terms' own, else the department's); Seniority date; Pay grade; then, to the right, Leave ID, Leave start, Leave end, Leave description and Leave percent — filled on a leave row of its own — and the month's totals per kind on the employment's row: Holiday days, Self-certified sick days, Certified sick days, Child sick days, Child sick days beyond employer, Leave days, Time off hours and Other days, in working days by each row's share (a sykmelding by its degree, beside a percentage leave degree × (100 − leave %) / 100; a ferie day a holiday day under any sickness until a recorded postponement splits the ferie) and time off in hours. A leave row follows its employment's, repeating its keys, for each chain of contiguous rows of one leave type with an a-melding description — the next day, or across a weekend or public holiday — over fourteen days, or shorter when the person's such leaves in the twelve months to the month's end pass fourteen days together; permittering whatever its length; never a child-sick or an hour row. Its Leave ID is a stable surrogate of the chain ("L-" and twelve hex digits, a keyed MAC of its first row), never a row's id; the description is NAV's spelling of the kodeverk PermisjonsOgPermitteringsBeskrivelse, to be checked against the kodeliste the payroll system validates with. An employment with no terms row in force that day keeps its row with the terms cells blank. The sealed identifiers are never read: payroll already holds the national identity number and the bank account.

                The export is staff:manage's with staff:personal-data (interim, an open question with the owner): its leave rows name HR-only leave by its description.

                Read in one snapshot. Every export is recorded as a payroll_exported event of the installation naming the exporter, with the month, the format, the number of rows and the SHA-256 of the file answered (hex); a file whose export could not be recorded is not answered.
            operationId: getStaffPayrollExport
            parameters:
                - description: The month, as YYYY-MM — required; a request without one, an empty one or anything else is payroll_month_invalid.
                  in: query
                  name: month
                  schema:
                    type: string
                - description: The file's format; csv, the default, is the one there is. Anything else is payroll_format_unsupported.
                  in: query
                  name: format
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named staff-payroll-YYYY-MM.csv, and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — payroll_month_invalid on month, a month that is not YYYY-MM with a month from 01 to 12; payroll_format_unsupported on format, a format other than csv.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export a month for payroll
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage+staff:personal-data
    /api/v1/staff/people:
