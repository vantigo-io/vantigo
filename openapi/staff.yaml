components:
    schemas:
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffLegalEntity:
            description: A legal entity, the juridisk enhet (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: Exactly one legal entity is the default.
                    type: boolean
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - isDefault
                - revision
            type: object
        StaffLegalEntityRequest:
            properties:
                isDefault:
                    description: True makes this the default legal entity. False is refused on the default; left out, nothing changes.
                    type: boolean
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among legal entities. Left out, it is cleared.
                    type: string
            required:
                - name
            type: object
        StaffLocation:
            description: A location, the arbeidssted (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                city:
                    description: Absent when not set.
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code, upper-case.
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                postalCode:
                    description: Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
                street:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - name
                - country
                - revision
            type: object
        StaffLocationRequest:
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - name
            type: object
        StaffMeta:
            description: What the Staff app needs before it draws anything.
            properties:
                capabilities:
                    $ref: '#/components/schemas/StaffCapabilities'
                structure:
                    $ref: '#/components/schemas/StaffStructure'
                timeZone:
                    description: The installation's business time zone, an IANA name. Every date of this module — a start, an end, "today" — is a calendar day in it.
                    type: string
                today:
                    description: Today's calendar day in the business time zone, as the server judges it — the day a form should start from, so the app and the server never disagree about which day it is around midnight.
                    format: date
                    type: string
            required:
                - timeZone
                - today
                - capabilities
            type: object
        StaffProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: in this delivery org_number_invalid, employee_number_too_long, structure_archived, structure_default, department_cycle and revision_conflict. errors carries the field errors of a 400, keyed by the request''s camelCase field; a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        StaffSettings:
            description: The Staff settings delivery A1 exposes (design §3.6). The other columns of the settings row reach the contract with the deliveries that use them.
            properties:
                employeeNumberPrefix:
                    description: What a generated employee number starts with, up to eight letters, digits or hyphens; empty for none.
                    type: string
                injuryInsurer:
                    description: The occupational injury (yrkesskade) insurer. Absent when not set.
                    type: string
                nextEmployeeNumber:
                    description: The number the next generated employee number carries after the prefix, unpadded.
                    format: int64
                    type: integer
                pensionProvider:
                    description: The occupational pension (OTP) provider, which the § 14-6 check reads when a term names no social-security reference. Absent when not set.
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                timeZone:
                    description: The business time zone, an IANA name.
                    type: string
            required:
                - timeZone
                - employeeNumberPrefix
                - nextEmployeeNumber
                - revision
            type: object
        StaffSettingsRequest:
            description: A full replace of the settings delivery A1 exposes.
            properties:
                employeeNumberPrefix:
                    description: Up to eight letters, digits or hyphens. Left out, there is none.
                    maxLength: 8
                    type: string
                injuryInsurer:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                nextEmployeeNumber:
                    description: 1 or more. With the prefix it must make a number of at most 16 characters.
                    format: int64
                    type: integer
                pensionProvider:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                timeZone:
                    description: An IANA name such as Europe/Oslo, which this server and its database must read the same way.
                    maxLength: 64
                    type: string
            required:
                - timeZone
                - nextEmployeeNumber
            type: object
        StaffStructure:
            description: The company's structure, present on GET /meta only for a caller holding staff:view. Archived rows are included so a stored reference can still be named; the pickers leave them out.
            properties:
                businessUnits:
                    items:
                        $ref: '#/components/schemas/StaffBusinessUnit'
                    type: array
                departments:
                    items:
                        $ref: '#/components/schemas/StaffDepartment'
                    type: array
                legalEntities:
                    items:
                        $ref: '#/components/schemas/StaffLegalEntity'
                    type: array
                locations:
                    items:
                        $ref: '#/components/schemas/StaffLocation'
                    type: array
            required:
                - legalEntities
                - businessUnits
                - departments
                - locations
            type: object
info:
    title: Vantigo Staff API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/staff/business-units:
        get:
            description: Every business unit, archived ones included, by name.
            operationId: getStaffBusinessUnits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffBusinessUnit'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List business units
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:view
        post:
            description: Adds a business unit (the virksomhet or underenhet the a-melding reports per) under a legal entity. The first one becomes the default; isDefault true makes the new one the default instead.
            operationId: postStaffBusinessUnits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Add a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}:
        put:
            description: Replaces a business unit's legal entity, name and organisation number. isDefault true makes it the default; isDefault false on the default is refused; leaving it out changes nothing about it. Moving it under an archived legal entity is refused, keeping one it already has is not.
            operationId: putStaffBusinessUnitsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, or structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Change a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}/archive:
        post:
            description: 'Archives a business unit: it stays on every employment that names it and leaves the pickers.'
            operationId: postStaffBusinessUnitsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_default: the default row is never archived; make another row the default first.'
            summary: Archive a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments:
        get:
            description: Every department, archived ones included, by code.
            operationId: getStaffDepartments
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffDepartment'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List departments
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:view
        post:
            description: Adds a department with its code, name and, optionally, a manager, a parent, a cost centre and a division.
            operationId: postStaffDepartments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_archived: the parent is archived.'
            summary: Add a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}:
        put:
            description: Replaces a department. A parent that is the department itself or one of its own descendants is refused department_cycle; a parent it did not have before that is archived is refused structure_archived.
            operationId: putStaffDepartmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, or structure_archived (the parent is archived) or department_cycle (the parent is the department itself or below it).
            summary: Change a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}/archive:
        post:
            description: 'Archives a department: it stays on every row that names it — its children''s parent included — and leaves the pickers.'
            operationId: postStaffDepartmentsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
            summary: Archive a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/legal-entities:
        get:
            description: Every legal entity, archived ones included (so a stored reference can still be named), by name.
            operationId: getStaffLegalEntities
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffLegalEntity'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List legal entities
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:view
        post:
            description: Adds a legal entity (the juridisk enhet). The first one becomes the default; isDefault true makes the new one the default instead, and the previous default stops being it.
            operationId: postStaffLegalEntities
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffLegalEntityRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffLegalEntity'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, and a field error when another legal entity has it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Add a legal entity
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/legal-entities/{id}:
        put:
            description: Replaces a legal entity's name and organisation number. isDefault true makes it the default (the previous default stops being it); isDefault false on the default is refused, since there is always exactly one — move it by making another row the default. Leaving isDefault out changes nothing about it.
            operationId: putStaffLegalEntitiesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffLegalEntityRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffLegalEntity'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, and a field error when another legal entity has it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, or structure_archived (an archived row cannot be made the default) or structure_default (isDefault false on the default).
            summary: Change a legal entity
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/legal-entities/{id}/archive:
        post:
            description: 'Archives a legal entity: it stays on every row that names it and leaves the pickers. Archiving an archived one changes nothing.'
            operationId: postStaffLegalEntitiesByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffLegalEntity'
                    description: OK
                "401":
