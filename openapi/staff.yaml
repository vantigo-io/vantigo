                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such group. The body is empty.
            summary: Get a group's providers
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/groups/{id}/traits/{provider}:
        put:
            description: 'Turns a provider on for the group with the trait values, checked against the provider''s declaration — the worker then makes or updates the group in the provider''s directory at its next cycle — or off, which retires it there as the settings'' deleteExternalAfterDays says. Turning off a provider never turned on writes nothing. The provider''s own rules (a type that cannot change, a team without a person as owner) are judged when the worker sends the values, and land on the section as lastError beside the trait. Turning a provider on asks it for its declaration, from its own state and never its directory; when it cannot answer, the request is refused 503 provider_unavailable and nothing is written.'
            operationId: putStaffGroupsByIdTraitsByProvider
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The provider's key, entra.
                  in: path
                  name: provider
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
