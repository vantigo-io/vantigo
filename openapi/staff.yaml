    /api/v1/staff/accounts/run:
        post:
            description: 'Runs one cycle of the staff-accounts worker now, with the caller as the actor identity audits and the account events name (design S27): the preparing links of the people now due, then the due links claimed one at a time — at most fifty, and none begun after sixty seconds; a claim begun finishes — each worked as the worker works it, by the same code. It runs beside the worker''s own cycles: a link either holds is skipped by the other (per-link claims, never a cycle-wide lock), so the counts are this run''s alone. The run goes on if the client goes away, so a request can take minutes when identity or the mail server is slow. A step identity refuses is done, its reason on the link; a call that could not be made is failed and retried by the worker.'
            operationId: postStaffAccountsRun
