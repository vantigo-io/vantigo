components:
    schemas:
        ManufacturingAvailability:
            description: 'An order''s component status (M21, M21a), computed live: every line covered by its reservation and the site''s available, some, or none.'
            enum:
                - ready
                - partly_available
                - waiting
            type: string
        ManufacturingBlockInput:
            additionalProperties: false
            description: Blocking a work center (M30).
            properties:
                note:
                    description: At most 2000 characters.
                    type: string
                reason:
                    $ref: '#/components/schemas/ManufacturingDowntimeReason'
            required:
                - reason
            type: object
        ManufacturingBom:
            additionalProperties: false
            description: A bill of materials (M10) with its operations and lines.
            properties:
                code:
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    type: boolean
                leadTimeDays:
                    format: int32
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLine'
                    type: array
                makeToOrder:
                    type: boolean
                note:
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperation'
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                siteId:
                    description: The site of its operations' work centers, null when it has none.
                    format: int64
                    nullable: true
                    type: integer
                status:
                    $ref: '#/components/schemas/ManufacturingStatus'
                updatedAt:
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - code
                - outputQuantity
                - isDefault
                - makeToOrder
                - leadTimeDays
                - note
                - status
                - revision
                - siteId
                - operations
                - lines
                - createdAt
                - updatedAt
            type: object
        ManufacturingBomInput:
            additionalProperties: false
            description: A new BoM with its operations and lines. The variant's first active BoM becomes its default.
            properties:
                code:
                    description: 1–32 characters, unique among BoMs (bom_code_taken); null for none.
                    maxLength: 32
                    minLength: 1
                    nullable: true
                    type: string
                isDefault:
                    description: Make it the variant's default, unmarking the old one.
                    type: boolean
                leadTimeDays:
                    description: 0 or more; default 0.
                    format: int32
                    minimum: 0
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLineInput'
                    maxItems: 200
                    type: array
                makeToOrder:
                    description: Default false.
                    type: boolean
                note:
                    maxLength: 2000
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperationInput'
                    maxItems: 50
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                variantId:
                    description: A goods variant (variant_not_goods), never changed after.
                    format: int32
                    type: integer
            required:
                - variantId
                - outputQuantity
                - operations
                - lines
            type: object
        ManufacturingBomLine:
            additionalProperties: false
            description: A component line of a BoM (M11), per the BoM's outputQuantity.
            properties:
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                operationId:
                    format: int64
                    nullable: true
                    type: integer
                operationKey:
                    description: The consuming operation's key, null when none.
                    nullable: true
                    type: string
                quantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                scrapPercent:
                    description: Exact decimal, 0 to 99.99.
                    type: string
                sortOrder:
                    format: int32
                    type: integer
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - quantity
                - scrapPercent
                - operationId
                - operationKey
                - sortOrder
                - note
            type: object
        ManufacturingBomLineInput:
            additionalProperties: false
            description: A component line as the editor sends it.
            properties:
                note:
                    maxLength: 2000
                    type: string
                operationKey:
                    description: The key of an operation in the same request (operation_key_unknown).
                    nullable: true
                    type: string
                quantity:
                    description: Exact decimal, more than 0, at most three decimals (quantity_invalid).
                    type: string
                scrapPercent:
                    description: Exact decimal, 0 to 99.99; default 0.
                    type: string
                sortOrder:
                    format: int32
                    type: integer
                variantId:
                    description: A goods variant (variant_not_found, variant_not_goods).
                    format: int32
                    type: integer
            required:
                - variantId
                - quantity
            type: object
        ManufacturingBomList:
            additionalProperties: false
            description: A page of BoMs and the total matching.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomSummary'
                    type: array
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        ManufacturingBomOperation:
            additionalProperties: false
            description: An operation of a BoM (M12), run in sequence order.
            properties:
                id:
                    format: int64
                    type: integer
                instructions:
                    description: Markdown.
                    type: string
                key:
                    description: The id as text, the editor's key for the operation.
                    type: string
                minutesPerCycle:
                    description: Exact decimal, more than 0.
                    type: string
                name:
                    type: string
                sequence:
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal; null when the work center's setup applies.
                    nullable: true
                    type: string
                workCenterCode:
                    type: string
                workCenterId:
                    format: int64
                    type: integer
                workCenterName:
                    type: string
            required:
                - id
                - key
                - sequence
                - name
                - workCenterId
                - workCenterCode
                - workCenterName
                - setupMinutes
                - minutesPerCycle
                - instructions
            type: object
        ManufacturingBomOperationInput:
            additionalProperties: false
            description: An operation as the editor sends it.
            properties:
                id:
                    description: An existing operation of this BoM to keep; absent for a new one.
                    format: int64
                    type: integer
                instructions:
                    description: Markdown.
                    maxLength: 20000
                    type: string
                key:
                    description: 1–40 characters, unique in the request; lines name it in operationKey.
                    maxLength: 40
                    minLength: 1
                    type: string
                minutesPerCycle:
                    description: Exact decimal, more than 0.
                    type: string
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                sequence:
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal, 0 or more; null or absent for the work center's setup.
                    nullable: true
                    type: string
                workCenterId:
                    description: An active work center (work_center_unknown).
                    format: int64
                    type: integer
            required:
                - key
                - sequence
                - name
                - workCenterId
                - minutesPerCycle
            type: object
        ManufacturingBomOverview:
            additionalProperties: false
            description: A BoM exploded at a quantity, up to 10 levels and 2000 nodes.
            properties:
                bomId:
                    format: int64
                    type: integer
                costIncomplete:
                    description: A bought component has no standard cost and counted 0. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    type: boolean
                nodeCount:
                    format: int32
                    type: integer
                quantity:
                    description: Exact decimal.
                    type: string
                rolledUpCost:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingRolledUpCost'
                    description: Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                root:
                    $ref: '#/components/schemas/ManufacturingOverviewNode'
                siteId:
                    format: int64
                    nullable: true
                    type: integer
            required:
                - bomId
                - quantity
                - siteId
                - nodeCount
                - root
            type: object
        ManufacturingBomSummary:
            additionalProperties: false
            description: A BoM as the list shows it.
            properties:
                code:
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    type: boolean
                lineCount:
                    format: int32
                    type: integer
                makeToOrder:
                    type: boolean
                operationCount:
                    format: int32
                    type: integer
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/ManufacturingStatus'
                updatedAt:
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - code
                - outputQuantity
                - isDefault
                - makeToOrder
                - status
                - revision
                - lineCount
                - operationCount
                - updatedAt
            type: object
        ManufacturingBomUpdate:
            additionalProperties: false
            description: A BoM's fields, operations and lines, replacing what it has, under its revision (M13).
            properties:
                code:
                    description: 1–32 characters, unique among BoMs (bom_code_taken); null for none.
                    maxLength: 32
                    minLength: 1
                    nullable: true
                    type: string
                leadTimeDays:
                    description: 0 or more; default 0.
                    format: int32
                    minimum: 0
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLineInput'
                    maxItems: 200
                    type: array
                makeToOrder:
                    description: Default false.
                    type: boolean
                note:
                    maxLength: 2000
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperationInput'
                    maxItems: 50
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    description: The revision the client read (revision_conflict).
                    format: int32
                    type: integer
            required:
                - outputQuantity
                - operations
                - lines
                - revision
            type: object
        ManufacturingCloseInput:
            additionalProperties: false
            description: Closing an order (M23).
            properties:
                backorder:
                    description: 'When less than the quantity was produced: true creates a backorder for the rest, false closes short; absent is quantity_short (409).'
                    nullable: true
                    type: boolean
                revision:
                    format: int32
                    type: integer
            required:
                - revision
            type: object
        ManufacturingCloseResult:
            additionalProperties: false
            description: A closed order and the backorder made for its rest.
            properties:
                backorder:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingOrder'
                    nullable: true
                order:
                    $ref: '#/components/schemas/ManufacturingOrder'
                shortLines:
                    description: The backorder's lines left unreserved when it was confirmed.
                    items:
                        $ref: '#/components/schemas/ManufacturingShortLine'
                    type: array
            required:
                - order
                - backorder
                - shortLines
            type: object
        ManufacturingClosure:
            additionalProperties: false
            description: A range of days a work center is closed, both included (M9).
            properties:
                fromDate:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                toDate:
                    format: date
                    type: string
                workCenterId:
                    format: int64
                    type: integer
            required:
                - id
                - workCenterId
                - fromDate
                - toDate
                - note
            type: object
        ManufacturingClosureInput:
            additionalProperties: false
            description: 'A closure: at most 100 per work center (closures_too_many).'
            properties:
                fromDate:
                    format: date
                    type: string
                note:
                    maxLength: 500
                    type: string
                toDate:
                    description: On or after fromDate.
                    format: date
                    type: string
            required:
                - fromDate
                - toDate
            type: object
        ManufacturingClosureList:
            additionalProperties: false
            description: A work center's closures, by fromDate.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingClosure'
                    type: array
            required:
                - items
            type: object
        ManufacturingComponentInput:
            additionalProperties: false
            description: A component added to a confirmed or in-progress order (M18).
            properties:
                note:
                    maxLength: 2000
                    type: string
                operationId:
                    description: The BoM operation that consumes it.
                    format: int64
                    nullable: true
                    type: integer
                required:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                variantId:
                    description: A goods variant.
                    format: int32
                    type: integer
            required:
                - revision
                - variantId
                - required
            type: object
        ManufacturingComponentUpdate:
            additionalProperties: false
            description: A component line's new requirement (M18, M18a).
            properties:
                note:
                    description: Absent keeps the note.
                    maxLength: 2000
                    type: string
                required:
                    description: Exact decimal, 0 or more, never below consumed + scrapped (required_below_used).
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - revision
                - required
            type: object
        ManufacturingDeviation:
            additionalProperties: false
            description: A consumed quantity more than 10 % off its proportional figure (M22).
            properties:
                componentId:
                    format: int64
                    type: integer
                consumed:
                    description: What the request sent.
                    type: string
                expected:
                    description: The proportional figure.
                    type: string
                sku:
                    type: string
            required:
                - componentId
                - sku
                - expected
                - consumed
            type: object
        ManufacturingDowntimeReason:
            description: Why a work center stopped (M29, M30).
            enum:
                - breakdown
                - material_missing
                - setup
                - waiting_for_operator
                - quality
                - other
            type: string
        ManufacturingFinishInput:
            additionalProperties: false
            description: Finishing a work order (M29).
            properties:
                production:
                    $ref: '#/components/schemas/ManufacturingProductionInput'
                    description: A production registered in the same transaction (M22), as the order's productions take one.
                quantity:
                    description: What the caller made at this operation, exact decimal, kept on the caller's log.
                    type: string
            type: object
        ManufacturingInterval:
            additionalProperties: false
            description: 'One open interval of a day, local times in the workspace zone on a 15-minute grid: start before end; 24:00 is allowed as an end.'
            properties:
                end:
                    description: HH:MM.
                    pattern: ^[0-9]{2}:[0-9]{2}$
                    type: string
                start:
                    description: HH:MM.
                    pattern: ^[0-9]{2}:[0-9]{2}$
                    type: string
            required:
                - start
                - end
            type: object
        ManufacturingLocation:
            additionalProperties: false
            description: One location of an Inventory site (M4a).
            properties:
                active:
                    description: An archived location takes no stock.
                    type: boolean
                fullCode:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                parentId:
                    description: Null for the site's root.
                    format: int64
                    nullable: true
                    type: integer
                root:
                    description: The site's root location, where stock lies when it has no place.
                    type: boolean
            required:
                - id
                - parentId
                - kind
                - fullCode
                - active
                - root
            type: object
        ManufacturingLocationList:
            additionalProperties: false
            description: Every location of a site, archived ones too, by full code.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingLocation'
                    type: array
            required:
                - items
            type: object
        ManufacturingMeta:
            additionalProperties: false
            description: What the caller may do in Manufacturing, for the screens to offer.
            properties:
                canManageBoms:
                    description: Holds manufacturing:boms-manage.
                    type: boolean
                canManageOrders:
                    description: Holds manufacturing:orders-manage.
                    type: boolean
                canSeeCosts:
                    description: 'Holds manufacturing:costs-view: cost fields are answered.'
                    type: boolean
                canWorkShopFloor:
                    description: Holds manufacturing:shop-floor.
                    type: boolean
                currency:
                    description: 'The workspace currency every amount is in: NOK.'
                    type: string
            required:
                - canManageBoms
                - canSeeCosts
                - canManageOrders
                - canWorkShopFloor
                - currency
            type: object
        ManufacturingMyWork:
            additionalProperties: false
            description: 'My work (M31): the caller''s open log and the work orders they logged time on today, in the business calendar''s day.'
            properties:
                openLog:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingTimeLog'
                    nullable: true
                openWorkOrder:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingWorkOrder'
                    nullable: true
                today:
                    description: Work orders the caller logged time on today or still runs, the latest first.
                    items:
                        $ref: '#/components/schemas/ManufacturingWorkOrder'
                    type: array
            required:
                - openLog
                - openWorkOrder
                - today
            type: object
        ManufacturingOrder:
            additionalProperties: false
            description: A manufacturing order (M17) with its component lines and their availability.
            properties:
                availability:
                    $ref: '#/components/schemas/ManufacturingAvailability'
                backorderOf:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingOrderLink'
                    nullable: true
                backorderOfId:
                    description: The order this one is the backorder of (M23).
                    format: int64
                    nullable: true
                    type: integer
                backorders:
                    description: The backorders of this order's chain made from it.
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderLink'
                    type: array
                bomCode:
                    nullable: true
                    type: string
                bomId:
                    format: int64
                    type: integer
                bomOutputQuantity:
                    description: The BoM's output quantity.
                    type: string
                children:
                    description: Sub-assembly orders (delivery E).
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderLink'
                    type: array
                closedAt:
                    description: When it was closed.
                    format: date-time
                    nullable: true
                    type: string
                componentLocationId:
                    description: Where components are taken from; null takes each from its primary location, then where it lies (M22a).
                    format: int64
                    nullable: true
                    type: integer
                components:
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderComponent'
                    type: array
                confirmedAt:
                    description: When it was confirmed.
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                dueDate:
                    description: The day the finished goods must be ready.
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                late:
                    description: Due before today and not done or cancelled (M24).
                    type: boolean
                note:
                    type: string
                number:
                    description: MO-<n>, or MO-<n>-<suffix> for a backorder (M17b).
                    type: string
                origin:
                    $ref: '#/components/schemas/ManufacturingOrderOriginInfo'
                outputLocationId:
                    format: int64
                    type: integer
                outputScrap:
                    description: Finished units produced and discarded (M22a).
                    type: string
                overrun:
                    description: produced − quantity when more was produced, else 0 (M23).
                    type: string
                parent:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingOrderLink'
                    nullable: true
                plannedFinish:
                    description: Set by hand or by planning (delivery D).
                    format: date-time
                    nullable: true
                    type: string
                plannedStart:
                    description: Set by hand or by planning (delivery D).
                    format: date-time
                    nullable: true
                    type: string
                priority:
                    $ref: '#/components/schemas/ManufacturingPriority'
                produced:
                    description: Good output posted so far, exact decimal (M22a); more than quantity is an overrun.
                    type: string
                quantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                reservationStatus:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingReservationStatus'
                    description: From the stored copies (M21a); null unless the order is confirmed or in progress.
                    nullable: true
                responsible:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingPerson'
                    nullable: true
                revision:
                    format: int32
                    type: integer
                siteId:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/ManufacturingOrderStatus'
                updatedAt:
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
                warnings:
                    description: 'What the order is allowed with but should be looked at, while it is not done or cancelled: variant_discontinued when its product or a component line''s variant is of a Discontinued product (a new MO warns but is allowed). Empty otherwise.'
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderWarning'
                    type: array
            required:
                - id
                - number
                - variant
                - bomId
                - quantity
                - produced
                - status
                - siteId
                - dueDate
                - plannedStart
                - plannedFinish
                - priority
                - responsible
                - origin
                - reservationStatus
                - late
                - backorderOfId
                - createdAt
                - bomCode
                - bomOutputQuantity
                - outputScrap
                - componentLocationId
                - outputLocationId
                - note
                - parent
                - backorderOf
                - backorders
                - children
                - components
                - availability
                - overrun
                - confirmedAt
                - closedAt
                - revision
                - updatedAt
                - warnings
            type: object
        ManufacturingOrderComponent:
            additionalProperties: false
            description: A component line of an order (M18) with its live availability (M21, M21a). On a draft the lines follow the BoM and have no id.
            properties:
                added:
                    description: Added to the order after confirm (M18).
                    type: boolean
                available:
                    description: The variant's available quantity at the order's site, read live (M21a).
                    type: string
                consumed:
                    description: Consumed by productions so far.
                    type: string
                covered:
                    description: reserved + available ≥ remaining (M21a).
                    type: boolean
                id:
                    description: Null on a draft, whose lines follow its BoM until it is confirmed.
                    format: int64
                    nullable: true
                    type: integer
                missing:
                    description: What neither the reservation nor the site's available covers, the site's available shared across the lines of one variant (M21a).
                    type: string
                note:
                    type: string
                operationId:
                    description: The BoM operation that consumes it.
                    format: int64
                    nullable: true
                    type: integer
                remaining:
                    description: required − consumed − scrapped, at least 0.
                    type: string
                required:
                    description: line quantity × order quantity / output quantity × (1 + scrap/100), rounded up to three decimals (M18), or as edited.
                    type: string
                reserved:
                    description: What the line holds reserved at the order's site (Manufacturing's copy, M20a).
                    type: string
                scrapped:
                    description: Scrapped by productions so far.
                    type: string
                sortOrder:
                    format: int32
                    type: integer
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - required
                - reserved
                - available
                - consumed
                - scrapped
                - remaining
                - missing
                - covered
                - operationId
                - added
                - note
                - sortOrder
            type: object
        ManufacturingOrderEvent:
            additionalProperties: false
            description: One event of an order's timeline (M26).
            properties:
                actorDisplay:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/ManufacturingOrderEventKind'
                payload:
                    additionalProperties: true
                    description: 'The event''s figures: quantities as exact decimal text, ids, numbers.'
                    type: object
            required:
                - id
                - kind
                - payload
                - actorUserId
                - actorDisplay
                - at
            type: object
        ManufacturingOrderEventKind:
            description: What an event of the timeline records (M26); time_log_corrected and time_log_added are a supervisor's corrections (M29).
            enum:
                - created
                - updated
                - confirmed
                - reserved
                - production_posted
                - line_added
                - line_changed
                - closed
                - cancelled
                - backorder_created
                - time_log_corrected
                - time_log_added
            type: string
        ManufacturingOrderEventList:
            additionalProperties: false
            description: An order's timeline, oldest first.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderEvent'
                    type: array
            required:
                - items
            type: object
        ManufacturingOrderInput:
            additionalProperties: false
            description: A new manufacturing order (M17), created as a draft.
            properties:
                bomId:
