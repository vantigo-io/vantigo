                    description: Active work centers whose working state is blocked.
                    format: int32
                    type: integer
                ordersInProgress:
                    description: Orders in progress.
                    format: int32
                    type: integer
                ordersLate:
                    description: Open orders due before today (M24).
                    format: int32
                    type: integer
                ordersToStartToday:
                    description: Confirmed orders not started whose planned start is today or earlier.
                    format: int32
                    type: integer
                today:
                    description: Today in the business calendar's zone, the day the counts are of; the overview's week ends on the Sunday after it.
                    format: date
                    type: string
            required:
                - activeWorkCenters
                - blockedWorkCenters
                - activeBoms
                - ordersToStartToday
                - ordersInProgress
                - ordersLate
                - today
            type: object
        ManufacturingStatus:
            description: A work center's or a BoM's status.
            enum:
                - active
                - archived
            type: string
        ManufacturingStatusFilter:
            description: Which statuses a list answers.
            enum:
                - active
                - archived
                - all
            type: string
        ManufacturingTimeLog:
            additionalProperties: false
            description: A time log (M29, M30). A log with neither a user nor a work order is the work center's own downtime while it is blocked.
            properties:
                correctedAt:
                    format: date-time
                    nullable: true
                    type: string
                correctedBy:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingPerson'
                    nullable: true
                endedAt:
                    description: Null while the log runs.
                    format: date-time
                    nullable: true
                    type: string
                forced:
                    description: Started out of sequence with force (M27).
                    type: boolean
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/ManufacturingTimeLogKind'
                longRunning:
                    description: 'Open for more than 12 hours: the shop floor warns, and nothing closes it automatically (M29).'
                    type: boolean
                note:
                    type: string
                quantity:
                    description: What the operator registered at finish, exact decimal; null when none.
                    nullable: true
                    type: string
                reason:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingDowntimeReason'
                    nullable: true
                startedAt:
                    format: date-time
                    type: string
                user:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingPerson'
                    nullable: true
                workCenterId:
                    format: int64
                    type: integer
                workOrderId:
                    format: int64
                    nullable: true
                    type: integer
            required:
                - id
                - workOrderId
                - workCenterId
                - user
                - kind
                - reason
                - note
                - startedAt
                - endedAt
                - quantity
                - forced
                - correctedBy
                - correctedAt
                - longRunning
            type: object
        ManufacturingTimeLogCorrection:
            additionalProperties: false
            description: 'A supervisor''s correction of a log (M29): its times, its quantity and a note. A log still open is closed at endedAt.'
            properties:
                endedAt:
                    format: date-time
                    type: string
                note:
                    description: Why, 1–2000 characters.
                    type: string
                quantity:
                    description: Exact decimal; null clears it.
                    nullable: true
                    type: string
                startedAt:
                    format: date-time
                    type: string
            required:
                - startedAt
                - endedAt
                - note
            type: object
        ManufacturingTimeLogInput:
            additionalProperties: false
            description: A missing log added by a supervisor (M29).
            properties:
                endedAt:
                    format: date-time
                    type: string
                kind:
                    $ref: '#/components/schemas/ManufacturingTimeLogKind'
                note:
                    description: Why, 1–2000 characters.
                    type: string
                quantity:
                    nullable: true
                    type: string
                reason:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingDowntimeReason'
                    description: Required for downtime, absent for productive time.
                    nullable: true
                startedAt:
                    format: date-time
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - startedAt
                - endedAt
                - note
            type: object
        ManufacturingTimeLogKind:
            description: 'A time log''s kind (M29): an operator''s productive time, or downtime with a reason.'
            enum:
                - productive
                - downtime
            type: string
        ManufacturingTimeLogList:
            additionalProperties: false
            description: Time logs, by start.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingTimeLog'
                    type: array
            required:
                - items
            type: object
        ManufacturingVariantRef:
            additionalProperties: false
            description: A catalog variant as Manufacturing names it.
            properties:
                id:
                    description: The catalog's variant id.
                    format: int32
                    type: integer
                productName:
                    type: string
                productStatus:
                    description: The product's status in the catalog.
                    type: string
                productType:
                    description: Goods or Service.
                    type: string
                sku:
                    type: string
                standardCost:
                    description: The catalog's standard cost (M4), exact decimal text in NOK; null when it has none. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                unit:
                    description: The variant's unit.
                    type: string
            required:
                - id
                - sku
                - productName
                - unit
                - productType
                - productStatus
            type: object
        ManufacturingVariantSearchItem:
            additionalProperties: false
            description: A goods variant of an active product, and whether it has an active BoM.
            properties:
                hasBom:
                    description: The variant has at least one active BoM.
                    type: boolean
                id:
                    description: The catalog's variant id.
                    format: int32
                    type: integer
                productName:
                    type: string
                productStatus:
                    description: The product's status in the catalog.
                    type: string
                productType:
                    description: Goods or Service.
                    type: string
                sku:
                    type: string
                standardCost:
                    description: The catalog's standard cost (M4), exact decimal text in NOK; null when it has none. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                unit:
                    description: The variant's unit.
                    type: string
            required:
                - id
                - sku
                - productName
                - unit
                - productType
                - productStatus
                - hasBom
            type: object
        ManufacturingVariantSearchList:
            additionalProperties: false
            description: The search's goods variants, by SKU.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingVariantSearchItem'
                    type: array
            required:
                - items
            type: object
        ManufacturingWeekPattern:
            additionalProperties: false
            description: 'A work center''s weekly working pattern (M9): at most two non-overlapping intervals per weekday. The default is Monday to Friday 07:00–15:00, the weekend closed.'
            properties:
                friday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                monday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                saturday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                sunday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                thursday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                tuesday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
                wednesday:
                    items:
                        $ref: '#/components/schemas/ManufacturingInterval'
                    maxItems: 2
                    type: array
            required:
                - monday
                - tuesday
                - wednesday
                - thursday
                - friday
                - saturday
                - sunday
            type: object
        ManufacturingWorkCenter:
            additionalProperties: false
            description: 'A work center (M8): a machine, a cell or a team at one Inventory site.'
            properties:
                capacity:
                    description: Units processed in parallel per cycle, 1 or more.
                    format: int32
                    type: integer
                cleanupMinutes:
                    description: Exact decimal, 0 or more, once per work order.
                    type: string
                code:
                    description: 1–16 characters A–Z and 0–9, unique.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                labourCostPerHour:
                    description: NOK per hour, null when unset. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                machineCostPerHour:
                    description: NOK per hour, null when unset. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                name:
                    type: string
                pattern:
                    $ref: '#/components/schemas/ManufacturingWeekPattern'
                revision:
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal, 0 or more, once per work order.
                    type: string
                siteCode:
                    type: string
                siteId:
                    format: int64
                    type: integer
                siteName:
                    type: string
                status:
                    $ref: '#/components/schemas/ManufacturingStatus'
                timeEfficiency:
                    description: 'A percentage from 1 to 500: at 50 the work takes twice as long.'
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                workingState:
                    $ref: '#/components/schemas/ManufacturingWorkingState'
            required:
                - id
                - code
                - name
                - siteId
                - siteCode
                - siteName
                - capacity
                - timeEfficiency
                - setupMinutes
                - cleanupMinutes
                - pattern
                - workingState
                - status
                - revision
                - createdAt
                - updatedAt
            type: object
        ManufacturingWorkCenterBlock:
            additionalProperties: false
            description: 'A work center''s block (M30): the reason, the note and when it began, from the center''s own downtime log.'
            properties:
                note:
                    type: string
                reason:
                    $ref: '#/components/schemas/ManufacturingDowntimeReason'
                since:
                    format: date-time
                    type: string
            required:
                - reason
                - note
                - since
            type: object
        ManufacturingWorkCenterInput:
            additionalProperties: false
            description: A new work center. A field left out takes its default.
            properties:
                capacity:
                    description: 1 or more; default 1.
                    format: int32
                    minimum: 1
                    type: integer
                cleanupMinutes:
                    description: Exact decimal, 0 or more; default 0.
                    type: string
                code:
                    description: 1–16 characters A–Z and 0–9 after upper-casing, unique (work_center_code_taken).
                    maxLength: 16
                    minLength: 1
                    type: string
                labourCostPerHour:
                    description: NOK per hour, 0 or more. Absent keeps the stored value on an update; null clears it. Sending it without manufacturing:costs-view is refused (costs_view_required).
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                machineCostPerHour:
                    description: NOK per hour, 0 or more. Absent keeps the stored value on an update; null clears it. Sending it without manufacturing:costs-view is refused (costs_view_required).
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                pattern:
                    $ref: '#/components/schemas/ManufacturingWeekPattern'
                setupMinutes:
                    description: Exact decimal, 0 or more; default 0.
                    type: string
                siteId:
                    description: An active Inventory site (site_unknown).
                    format: int64
                    type: integer
                timeEfficiency:
                    description: 1 to 500; default 100.
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
            required:
                - code
                - name
                - siteId
            type: object
        ManufacturingWorkCenterList:
            additionalProperties: false
            description: Work centers, by code.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingWorkCenter'
                    type: array
            required:
                - items
            type: object
        ManufacturingWorkCenterQueue:
            additionalProperties: false
            description: 'A work center''s queue (M31): its ready, in-progress and paused work orders of open orders, by planned start, then the order''s priority, then its due date.'
            properties:
                block:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingWorkCenterBlock'
                    nullable: true
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingWorkOrder'
                    type: array
                workCenter:
                    $ref: '#/components/schemas/ManufacturingWorkCenterRef'
            required:
                - workCenter
                - block
                - items
            type: object
        ManufacturingWorkCenterRef:
            additionalProperties: false
            description: A work center as a work order names it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                siteId:
                    format: int64
                    type: integer
                workingState:
                    $ref: '#/components/schemas/ManufacturingWorkingState'
            required:
                - id
                - code
                - name
                - siteId
                - workingState
            type: object
        ManufacturingWorkCenterUpdate:
            additionalProperties: false
            description: A work center's fields, under its revision. A field left out takes its default, but for the cost rates, which an absent field keeps.
            properties:
                capacity:
                    description: 1 or more; default 1.
                    format: int32
                    minimum: 1
                    type: integer
                cleanupMinutes:
                    description: Exact decimal, 0 or more; default 0.
                    type: string
                code:
                    description: 1–16 characters A–Z and 0–9 after upper-casing, unique (work_center_code_taken).
                    maxLength: 16
                    minLength: 1
                    type: string
                labourCostPerHour:
                    description: NOK per hour, 0 or more. Absent keeps the stored value on an update; null clears it. Sending it without manufacturing:costs-view is refused (costs_view_required).
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                machineCostPerHour:
                    description: NOK per hour, 0 or more. Absent keeps the stored value on an update; null clears it. Sending it without manufacturing:costs-view is refused (costs_view_required).
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                pattern:
                    $ref: '#/components/schemas/ManufacturingWeekPattern'
                revision:
                    description: The revision the client read (revision_conflict).
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal, 0 or more; default 0.
                    type: string
                siteId:
                    description: An active Inventory site (site_unknown).
                    format: int64
                    type: integer
                timeEfficiency:
                    description: 1 to 500; default 100.
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
            required:
                - code
                - name
                - siteId
                - revision
            type: object
        ManufacturingWorkOrder:
            additionalProperties: false
            description: 'A work order (M27, M27a): an operation of the order''s BoM as it was at confirm, at one work center.'
            properties:
                capacity:
                    description: The work center's capacity at confirm (M27a).
                    format: int32
                    type: integer
                cleanupMinutes:
                    description: Exact decimal, as at confirm.
                    type: string
                expectedMinutes:
                    description: setup + cleanup + cycles × minutesPerCycle × 100 / timeEfficiency, cycles = ⌈(order quantity / output quantity) / capacity⌉, half-up to the minute; computed at confirm and never recomputed (M28a).
                    format: int64
                    type: integer
                finishedAt:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                last:
                    description: 'The order''s last work order that is not cancelled: its finish offers to register the production (M29).'
                    type: boolean
                loggedMinutes:
                    description: Productive minutes logged on it, open logs counted to now, rounded down.
                    format: int64
                    type: integer
                minutesPerCycle:
                    description: 'Exact decimal: the time for one cycle (M28a).'
                    type: string
                name:
                    type: string
                operators:
                    description: Who has an open log on it, by start.
                    items:
                        $ref: '#/components/schemas/ManufacturingWorkOrderOperator'
                    type: array
                order:
                    $ref: '#/components/schemas/ManufacturingWorkOrderOrder'
                orderId:
                    format: int64
                    type: integer
                plannedFinish:
                    format: date-time
                    nullable: true
                    type: string
                plannedStart:
                    format: date-time
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                sequence:
                    format: int32
                    type: integer
                setupMinutes:
                    description: 'Exact decimal: the operation''s setup, else the work center''s, as at confirm.'
                    type: string
                startedAt:
                    format: date-time
                    nullable: true
                    type: string
                status:
                    $ref: '#/components/schemas/ManufacturingWorkOrderStatus'
                timeEfficiency:
                    description: The work center's efficiency in per cent at confirm (M27a).
                    format: int32
                    type: integer
                workCenter:
                    $ref: '#/components/schemas/ManufacturingWorkCenterRef'
            required:
                - id
                - orderId
                - order
                - sequence
                - name
                - workCenter
                - setupMinutes
                - cleanupMinutes
                - minutesPerCycle
                - capacity
                - timeEfficiency
                - expectedMinutes
                - loggedMinutes
                - plannedStart
                - plannedFinish
                - status
                - startedAt
                - finishedAt
                - last
                - operators
                - revision
            type: object
        ManufacturingWorkOrderList:
            additionalProperties: false
            description: Work orders, by sequence.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingWorkOrder'
                    type: array
            required:
                - items
            type: object
        ManufacturingWorkOrderOperator:
            additionalProperties: false
            description: 'Someone with an open log on a work order: who runs it.'
            properties:
                kind:
                    $ref: '#/components/schemas/ManufacturingTimeLogKind'
                startedAt:
                    format: date-time
                    type: string
                user:
                    $ref: '#/components/schemas/ManufacturingPerson'
            required:
                - user
                - kind
                - startedAt
            type: object
        ManufacturingWorkOrderOrder:
            additionalProperties: false
            description: The order a work order belongs to, as the shop floor shows it (M31).
            properties:
                dueDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                number:
                    description: MO-<n>, or MO-<n>-<suffix> for a backorder (M17b).
                    type: string
                priority:
                    $ref: '#/components/schemas/ManufacturingPriority'
                produced:
                    description: Good output so far, exact decimal.
                    type: string
                quantity:
                    description: The order's quantity, exact decimal.
                    type: string
                remaining:
                    description: quantity − produced, at least 0.
                    type: string
                reservationStatus:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingReservationStatus'
                    nullable: true
                status:
                    $ref: '#/components/schemas/ManufacturingOrderStatus'
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - number
                - variant
                - quantity
                - produced
                - remaining
                - dueDate
                - priority
                - status
                - reservationStatus
            type: object
        ManufacturingWorkOrderStatus:
            description: 'A work order''s state (M27): pending while an earlier work order is not done, ready, in_progress while a productive log is open, paused when started before with none open (a block''s downtime logs leave it paused, M29a), done, cancelled.'
            enum:
                - pending
                - ready
                - in_progress
                - paused
                - done
                - cancelled
            type: string
        ManufacturingWorkOrderView:
            additionalProperties: false
            description: A work order as the shop floor's work order view shows it (M31).
            properties:
                block:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingWorkCenterBlock'
                    description: The work center's block while it is blocked; null otherwise.
                    nullable: true
                components:
                    description: The order's component lines consumed at this operation (M11), with their live availability (M21a).
                    items:
                        $ref: '#/components/schemas/ManufacturingOrderComponent'
                    type: array
                instructions:
                    description: The operation's instructions as at confirm, Markdown.
                    type: string
                myOpenLog:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingTimeLog'
                    description: 'The caller''s one open log, wherever it is (M29): starting here closes it when it is elsewhere.'
                    nullable: true
                openLogs:
                    description: Every open log on the work order, by start.
                    items:
                        $ref: '#/components/schemas/ManufacturingTimeLog'
                    type: array
                workOrder:
                    $ref: '#/components/schemas/ManufacturingWorkOrder'
            required:
                - workOrder
                - instructions
                - components
                - openLogs
                - myOpenLog
                - block
            type: object
        ManufacturingWorkingState:
            description: 'A work center''s working state (M30): changed only through block and unblock, never through an edit.'
            enum:
                - normal
                - blocked
            type: string
info:
    title: Vantigo Manufacturing API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/manufacturing/boms:
        get:
            operationId: listManufacturingBoms
            parameters:
                - in: query
                  name: variantId
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: Default active.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/ManufacturingStatusFilter'
                - description: Matched against the BoM's code and the variant's SKU and product name.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
                - description: At most 200; default 50.
                  in: query
                  name: limit
                  required: false
                  schema:
                    format: int32
                    maximum: 200
                    minimum: 1
                    type: integer
                - in: query
                  name: offset
                  required: false
                  schema:
                    format: int32
                    minimum: 0
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingBomList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: 'Service Unavailable — dependency_unavailable: the catalog or Inventory is not composed. Nothing was changed.'
            summary: List bills of materials
            tags:
                - Manufacturing
            x-vantigo-access: permission:manufacturing:access
        post:
            operationId: createManufacturingBom
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ManufacturingBomInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingBom'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: Bad Request — field errors; lines name every failing line (variant_not_found, variant_not_goods, operation_key_unknown, quantity_invalid); too_many_lines, too_many_operations, work_center_unknown, work_center_other_site, bom_cycle (path names the cycle), bom_too_deep.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: Conflict — bom_code_taken, revision_conflict.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: 'Service Unavailable — dependency_unavailable: the catalog or Inventory is not composed. Nothing was changed.'
            summary: Create a bill of materials
            tags:
                - Manufacturing
            x-vantigo-access: permission:manufacturing:access+manufacturing:boms-manage
    /api/v1/manufacturing/boms/{id}:
        get:
            operationId: getManufacturingBom
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
