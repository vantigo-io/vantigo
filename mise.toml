# Single source of truth for the toolchain, used identically by developers and CI.
# Keep in sync with global.json (dotnet) and .bun-version (bun) — enforced by
# `bun run toolchain:check`, which runs in the pre-commit hook and in CI.
[tools]
dotnet = "10.0.302"
bun = "1.3.14"
# Used by CI to scan the published container image and generate its SBOM.
trivy = "0.74.0"
