        test-fakes:
          # A package that fakes a provider for tests is an ordinary package,
          # so other packages' tests can import it; production code never
          # may. Every non-test file, everywhere.
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: github.com/vantigo-io/vantigo/server/internal/payments/vipps/vippstest
              desc: "vippstest is a test fake: only _test.go files may import it"
            - pkg: github.com/vantigo-io/vantigo/server/internal/shipping/bring/bringtest
              desc: "bringtest is a test fake: only _test.go files may import it"
            - pkg: github.com/vantigo-io/vantigo/server/internal/entra/graphtest
              desc: "graphtest is a test fake: only _test.go files may import it"
            - pkg: github.com/vantigo-io/vantigo/server/internal/google/googletest
              desc: "googletest is a test fake: only _test.go files may import it"
            - pkg: github.com/vantigo-io/vantigo/server/internal/meta/metatest
              desc: "metatest is a test fake: only _test.go files may import it"
        operations:
          # The dispatcher calls any operation of the merged contract
          # in-process, through the router, as the assistant's person or as an
          # agent (module boundaries rule 18). Only the assistant and the agents
          # modules hold it, and the model loop they run on (internal/agentloop). Compose
          # (internal/module) builds and binds it, internal/server composes the
          # API, and the internal/modtest harness builds one over a harness's API
          # for the tests; internal/integration is the test-only package that
          # composes every real module (it has no production code); the package's
          # own files are the rest. Nothing else may import it, so no module can
          # reach the router this way.
          files:
            - "$all"
            - "!**/internal/assistant/**"
            - "!**/internal/agents/**"
            - "!**/internal/agentloop/**"
            - "!**/internal/module/**"
            - "!**/internal/server/**"
            - "!**/internal/modtest/**"
            - "!**/internal/integration/**"
            - "!**/internal/operations/**"
          deny:
            - pkg: github.com/vantigo-io/vantigo/server/internal/operations$
              desc: "only internal/assistant, internal/agents, internal/agentloop, internal/module, internal/server and the test harnesses (internal/modtest, internal/integration) may import internal/operations"
            - pkg: github.com/vantigo-io/vantigo/server/internal/operations/
              desc: "only internal/assistant, internal/agents, internal/agentloop, internal/module, internal/server and the test harnesses (internal/modtest, internal/integration) may import internal/operations"
        platform:
          # Every platform package, not only the two the modules mount
          # through: nothing below cmd/vantigo may know a business module
          # exists. internal/modtest is the deliberate exception — it composes
          # identity beside the module under test — and so is not listed.
          #
          # internal/integration is the second deliberate exception, and is
          # likewise absent from every rule here: it is test-only (no
          # production code, nothing imports it) and exists to compose several
          # real modules together, which is the one thing the island rule
          # makes impossible anywhere else. See its doc.go — if anything
          # non-test is ever added there, it needs a rule of its own.
          files:
            - "**/internal/agentloop/**"
            - "**/internal/ai/**"
            - "**/internal/module/**"
