# golangci-lint for the Go server. Run from apps/server:
#
#   golangci-lint run
#
# The standard linter set (errcheck, govet, ineffassign, staticcheck, unused)
# plus gofmt: a gate that is green the day it lands is one that stays on.
# Adding a linter is its own change with its own diff.
version: "2"

linters:
  default: standard
  enable:
    # bodyclose: an unclosed response body leaks a connection; errorlint:
    # comparing wrapped errors with == or a type assertion silently stops
    # matching once anything in the chain wraps them.
    - bodyclose
    - depguard
    - errorlint
  settings:
    depguard:
      # Each business module is an island: internal/<module>/... (every
      # subpackage included, gen and otherwise) may import platform packages
      # and its own subpackages, never another module's. internal/module and
      # internal/contracts are the platform the modules mount through, so
      # they may not import any module either. One rule set per boundary,
      # scoped to its directory with `files`, denying every other module's
      # import path.
      #
      # Each forbidden module gets exactly two deny entries: "…/<mod>$" (an
      # exact match, `$`-anchored so it can never prefix-match a sibling like
      # "…/identityx") and "…/<mod>/" (every subpackage, gen included, since
      # depguard v2's list-mode matches only the single closest entry — a
      # dedicated "…/<mod>/gen" entry would shadow the "…/<mod>/" entry for
      # any other subpackage, such as "…/identity/store", that sorts after
      # "gen").
      rules:
        identity:
          files:
            - "**/internal/identity/**"
          deny:
            - pkg: github.com/vantigo-io/vantigo/server/internal/customers$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/customers/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/products$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/products/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/energy$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/energy/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/communications$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/communications/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/projects$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/projects/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/time$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/time/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/expenses$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/expenses/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/invoices$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/invoices/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/staff$
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/staff/
              desc: "internal/identity may not import another business module"
            - pkg: github.com/vantigo-io/vantigo/server/internal/calendar$
