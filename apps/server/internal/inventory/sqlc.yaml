# sqlc: inventory's typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/inventory/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00108_inventory_baseline.sql
      - ../db/migrations/00110_inventory_counts.sql
      - ../db/migrations/00125_inventory_reservations.sql
      - ../db/migrations/00152_inventory_transfers.sql
      - ../db/migrations/00155_inventory_placements.sql
      - ../db/migrations/00163_inventory_lots.sql
      - ../db/migrations/00164_inventory_lot_attachments.sql
      - ../db/migrations/00165_inventory_lot_counts_transfers.sql
      - ../db/migrations/00169_inventory_variant_rules.sql
      - ../db/migrations/00170_inventory_placement_multiple.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
