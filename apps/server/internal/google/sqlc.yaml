# sqlc: google's typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/google/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00114_google_baseline.sql
      - ../db/migrations/00115_google_accounts.sql
      - ../db/migrations/00116_google_connections.sql
      - ../db/migrations/00128_google_calendar.sql
      - ../db/migrations/00129_google_mail_channels.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        # google.connections (the people's) would singularise onto
        # google.connection (the installation's): it keeps its plural and is
        # named for what it holds.
        inflection_exclude_table_names:
          - google_connections
        rename:
          google_connections: GooglePersonalConnection
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
