components:
    schemas:
        PaginatedResponseOfProjectSummaryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProjectSummaryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfTimelineEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProjectCapabilities:
            description: What the calling user may do with this project, so the frontend never re-derives authorization.
            properties:
                canManage:
                    type: boolean
                canSeeFinancials:
                    type: boolean
            required:
                - canManage
                - canSeeFinancials
            type: object
        ProjectCodeSuggestionResponse:
            description: A project code nobody has used yet, derived from the customer and project names (design §4.2). The caller may type anything valid instead.
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        ProjectCreateRequest:
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
            type: object
        ProjectFinancials:
            description: The project's financial fields, present only when the caller may see them (capabilities.canSeeFinancials) and then always present, possibly with no fields inside, so a client can tell "may see, nothing entered" from "may not see".
            properties:
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                currency:
                    nullable: true
                    type: string
                fixedPriceAmount:
                    format: double
                    nullable: true
                    type: number
            type: object
        ProjectPersonSummary:
            description: One user on a project, named for display.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        ProjectResponse:
            properties:
                billingLinesAvailable:
                    description: Whether the products module is enabled, and so whether this project can carry priced billing lines.
                    type: boolean
                billingType:
                    type: string
                budgetHours:
                    description: Planning data, visible to everyone who can see the project — unlike the amounts under financials.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/ProjectCapabilities'
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                financials:
                    allOf:
                        - $ref: '#/components/schemas/ProjectFinancials'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
                - capabilities
                - billingLinesAvailable
            type: object
        ProjectStatusChangeRequest:
            properties:
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'. Any transition is allowed, reopening a completed project included."
                    type: string
            required:
                - status
            type: object
        ProjectSummaryResponse:
            description: One project as a list row. It carries no financial fields at all — not shaped out, absent from the schema — so no caller ever sees a price in a list.
            properties:
                billingType:
                    type: string
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
            type: object
        ProjectUpdateRequest:
            description: Every field of the project as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409.
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                revision:
                    description: The revision the caller read the project at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
                - revision
            type: object
        TimelineEntryResponse:
            description: One generated event on a project's timeline. The actor's display name is the one captured when the change happened, not a name resolved on read.
            properties:
                actorDisplay:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                eventType:
                    type: string
                id:
                    format: int64
                    type: integer
                occurredAt:
                    format: date-time
                    type: string
                payload:
                    description: The event's own fields. Billing events name which fields changed and never their amounts, so a timeline needs no financial shaping.
                    type: object
            required:
                - id
                - eventType
                - payload
                - actorDisplay
                - occurredAt
            type: object
info:
    title: Vantigo Projects API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/projects:
        get:
            operationId: getProjects
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - description: Matches the project code or name, case-insensitively. '%' and '_' are literal characters, not wildcards.
                  in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: true for projects with no customer, false for projects with one.
                  in: query
                  name: internal
                  schema:
                    type: boolean
                - description: Narrows the list to projects the caller holds a role on.
                  in: query
                  name: mine
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProjectSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List projects
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        post:
            operationId: postProjects
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access+projects:create
    /api/v1/projects/code-suggestion:
        get:
            operationId: getProjectsCodeSuggestion
            parameters:
                - description: The customer the project bills to. Absent means an internal project, prefixed 'INT'.
                  in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: The project's working name, whose letters follow the customer prefix. Absent or empty contributes no letters.
                  in: query
                  name: name
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectCodeSuggestionResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — customerId was given but does not resolve to a customer.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Suggest a project code
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}:
        get:
            operationId: getProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: Get a project by id
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        put:
            operationId: putProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the supplied revision is not the project's current one.
            summary: Update a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}/status:
        put:
            operationId: putProjectsByIdStatus
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectStatusChangeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: Change a project's status
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}/timeline:
        get:
            operationId: getProjectsByIdTimeline
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfTimelineEntryResponse'
                    description: OK — newest first.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: List a project's timeline
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
servers:
    - url: /
