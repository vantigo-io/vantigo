components:
    schemas:
        BillingLineListPrice:
            description: The variant's list price in the project's currency at the moment of the read, resolved through the products catalog. Absent when the project has no currency or the variant has no price in it.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - amount
                - currency
            type: object
        BillingLinePricing:
            description: What this line bills by, present only when the caller may see the project's financial fields (capabilities.canSeeFinancials). Projects stores the rule and never calculates money; whoever invoices resolves the amount.
            properties:
                discountPercent:
                    description: Set exactly when mode is 'discount'; greater than zero and at most 100.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Set exactly when mode is 'fixed'; an amount in the project's currency.
                    format: double
                    nullable: true
                    type: number
                listPrice:
                    allOf:
                        - $ref: '#/components/schemas/BillingLineListPrice'
                    description: Absent when the project has no currency, or the variant has no list price in it.
                mode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
            required:
                - mode
            type: object
        BillingLineRequest:
            description: A billing line as it should stand. The line's variant and pricing rule are always carried in full; active is the one field a PUT may leave out, which leaves the line as it stands.
            properties:
                active:
                    description: PUT only. Absent leaves the line as it stands. There is no DELETE — a line other modules may have billed against is deactivated, never removed.
                    nullable: true
                    type: boolean
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{1,10}$ and be unique within the project.
                    type: string
                discountPercent:
                    description: Required and in (0, 100] when pricingMode is 'discount', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                fixedAmount:
                    description: Required and greater than zero when pricingMode is 'fixed', absent otherwise. A 'fixed' line needs the project to have a currency.
                    format: double
                    nullable: true
                    type: number
                pricingMode:
                    description: "'list', 'fixed' or 'discount'."
                    type: string
                variantId:
                    description: The product variant this line is pinned to; it must resolve through the products catalog.
                    format: int32
                    type: integer
            required:
                - code
                - variantId
                - pricingMode
            type: object
        BillingLineResponse:
            description: One billing line — a product variant plus a pricing rule (D9). The variant's product name, SKU and unit are embedded so a reader needs no products permission to render the line.
            properties:
                active:
                    type: boolean
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int32
                    type: integer
                pricing:
                    allOf:
                        - $ref: '#/components/schemas/BillingLinePricing'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                productName:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                sku:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the line's code joined with a hyphen, as later modules quote it ('KVEM1000-PM'). It follows the project's code when that is changed.
                    type: string
                unit:
                    description: Absent when the catalog no longer knows the variant.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variantId:
                    format: int32
                    type: integer
                variantMissing:
                    description: Whether the products catalog no longer knows this line's variant. The line still resolves, so work already billed against it stays priced.
                    type: boolean
            required:
                - id
                - code
                - trackableCode
                - variantId
                - variantMissing
                - active
                - createdAt
                - updatedAt
            type: object
        GetProjectStatsResponse:
            description: How many of the projects the caller may see stand in each status, for the list page's key-figure row. Every status is always present, 0 included.
            properties:
                active:
                    format: int32
                    type: integer
                cancelled:
                    format: int32
                    type: integer
                completed:
                    format: int32
                    type: integer
                onHold:
                    format: int32
                    type: integer
                planned:
                    format: int32
                    type: integer
            required:
                - planned
                - active
                - onHold
                - completed
                - cancelled
            type: object
        PaginatedResponseOfProjectSummaryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProjectSummaryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfTimelineEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProjectCapabilities:
            description: What the calling user may do with this project, so the frontend never re-derives authorization.
            properties:
                canManage:
                    type: boolean
                canSeeFinancials:
                    type: boolean
            required:
                - canManage
                - canSeeFinancials
            type: object
        ProjectCodeSuggestionResponse:
            description: A project code nobody has used yet, derived from the customer and project names (design §4.2). The caller may type anything valid instead.
            properties:
                code:
                    type: string
            required:
                - code
            type: object
        ProjectCreateRequest:
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
            type: object
        ProjectFinancials:
            description: The project's financial fields, present only when the caller may see them (capabilities.canSeeFinancials) and then always present, possibly with no fields inside, so a client can tell "may see, nothing entered" from "may not see".
            properties:
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                currency:
                    nullable: true
                    type: string
                fixedPriceAmount:
                    format: double
                    nullable: true
                    type: number
            type: object
        ProjectPersonSummary:
            description: One user on a project, named for display.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        ProjectResponse:
            properties:
                billingLinesAvailable:
                    description: Whether the products module is enabled, and so whether this project can carry priced billing lines.
                    type: boolean
                billingType:
                    type: string
                budgetHours:
                    description: Planning data, visible to everyone who can see the project — unlike the amounts under financials.
                    format: double
                    nullable: true
                    type: number
                capabilities:
                    $ref: '#/components/schemas/ProjectCapabilities'
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                financials:
                    allOf:
                        - $ref: '#/components/schemas/ProjectFinancials'
                    description: Absent — not null — when the caller may not see the project's financial fields.
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    description: The revision an update must carry to be applied.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
                - capabilities
                - billingLinesAvailable
            type: object
        ProjectRoleAssignmentRequest:
            properties:
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
            required:
                - role
            type: object
        ProjectRoleResponse:
            description: One user's role on one project. active is the user directory's answer, not the assignment's — a disabled account keeps the role it was given and is reported inactive.
            properties:
                active:
                    description: Whether the user can still act. A user the directory no longer knows is reported inactive and named 'Unknown user'.
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                role:
                    description: "'manager', 'member' or 'viewer'."
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
                - role
                - createdAt
            type: object
        ProjectStatsAttentionItem:
            description: One project the dashboard wants a human to look at. The shape is the dashboard's, shared by every module's /stats/attention; entityId is the project id, which the dashboard turns into a link to /projects/{id}.
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ProjectStatsDailyBucket:
            description: One UTC calendar day of a time series. Days with nothing in them are absent, not zero — the dashboard's sparkline plots the points it is given.
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        ProjectStatsSummaryResponse:
            description: The dashboard's projects card over one period, in the envelope every module's /stats/summary shares. Only the two figures and their deltas differ.
            properties:
                activeProjects:
                    format: int32
                    type: integer
                activeProjectsDelta:
                    format: int32
                    type: integer
                from:
                    format: date-time
                    type: string
                newProjects:
                    format: int32
                    type: integer
                newProjectsDelta:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - activeProjects
                - activeProjectsDelta
                - newProjects
                - newProjectsDelta
            type: object
        ProjectStatusChangeRequest:
            properties:
                status:
                    description: "'planned', 'active', 'on-hold', 'completed' or 'cancelled'. Any transition is allowed, reopening a completed project included."
                    type: string
            required:
                - status
            type: object
        ProjectSummaryResponse:
            description: One project as a list row. It carries no financial fields at all — not shaped out, absent from the schema — so no caller ever sees a price in a list.
            properties:
                billingType:
                    type: string
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                internal:
                    description: Whether the project has no customer.
                    type: boolean
                managers:
                    items:
                        $ref: '#/components/schemas/ProjectPersonSummary'
                    type: array
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
                status:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - internal
                - status
                - billingType
                - revision
                - createdAt
                - updatedAt
                - managers
            type: object
        ProjectUpdateRequest:
            description: Every field of the project as it should stand after the update, carrying the revision it was read at. A revision that has moved on answers 409.
            properties:
                billingType:
                    description: "'time-and-materials', 'fixed-price' or 'non-billable'. An internal project (no customerId) must be 'non-billable'."
                    type: string
                budgetAmount:
                    format: double
                    nullable: true
                    type: number
                budgetHours:
                    format: double
                    nullable: true
                    type: number
                code:
                    description: Trimmed and upper-cased before validation and storage; must then match ^[A-Z0-9]{2,20}$ and be unique.
                    type: string
                currency:
                    description: ISO-4217 alphabetic code, upper-cased. Required as soon as any amount is set.
                    nullable: true
                    type: string
                customerId:
                    description: The customer this project bills to. Absent means an internal project.
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                endDate:
                    format: date
                    nullable: true
                    type: string
                fixedPriceAmount:
                    description: Required and greater than zero when billingType is 'fixed-price', absent otherwise.
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                revision:
                    description: The revision the caller read the project at.
                    format: int32
                    type: integer
                startDate:
                    format: date
                    nullable: true
                    type: string
            required:
                - code
                - name
                - billingType
                - revision
            type: object
        TimelineEntryResponse:
            description: One generated event on a project's timeline. The actor's display name is the one captured when the change happened, not a name resolved on read.
            properties:
                actorDisplay:
                    type: string
                actorUserId:
                    format: uuid
                    nullable: true
                    type: string
                eventType:
                    type: string
                id:
                    format: int64
                    type: integer
                occurredAt:
                    format: date-time
                    type: string
                payload:
                    description: The event's own fields. Billing events name which fields changed and never their amounts, so a timeline needs no financial shaping.
                    type: object
            required:
                - id
                - eventType
                - payload
                - actorDisplay
                - occurredAt
            type: object
info:
    title: Vantigo Projects API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/projects:
        get:
            operationId: getProjects
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - description: Matches the project code or name, case-insensitively. '%' and '_' are literal characters, not wildcards.
                  in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: true for projects with no customer, false for projects with one.
                  in: query
                  name: internal
                  schema:
                    type: boolean
                - description: Narrows the list to projects the caller holds a role on.
                  in: query
                  name: mine
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProjectSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List projects
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        post:
            operationId: postProjects
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access+projects:create
    /api/v1/projects/code-suggestion:
        get:
            operationId: getProjectsCodeSuggestion
            parameters:
                - description: The customer the project bills to. Absent means an internal project, prefixed 'INT'. A customer that does not exist contributes no letters rather than an error.
                  in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: The project's working name, whose letters follow the customer prefix. Absent or empty contributes no letters.
                  in: query
                  name: name
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectCodeSuggestionResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Suggest a project code
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}:
        get:
            operationId: getProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: Get a project by id
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        put:
            operationId: putProjectsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProjectUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProjectResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the supplied revision is not the project's current one.
            summary: Update a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}/assignable-users:
        get:
            operationId: getProjectsByIdAssignableUsers
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - description: Matches the user's display name, case-insensitively. Absent or empty answers the first users assignable to this project.
                  in: query
                  name: search
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ProjectPersonSummary'
                                type: array
                    description: OK — at most 20 active users, none of whom already holds a role on this project.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
            summary: Search users assignable to a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}/billing-lines:
        get:
            operationId: getProjectsByIdBillingLines
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BillingLineResponse'
                                type: array
                    description: OK — every line of the project, deactivated ones included, by code. Pricing is shaped out for a caller who may not see financials.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the products module is not enabled, so this installation has no billing lines.
            summary: List a project's billing lines
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
        post:
            operationId: postProjectsByIdBillingLines
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillingLineRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BillingLineResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the project does not exist, or the caller holds no role on it and no view-all/manage-all permission.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the products module is not enabled, so this installation has no billing lines.
            summary: Add a billing line to a project
            tags:
                - Projects
            x-vantigo-access: permission:projects:access
    /api/v1/projects/{id}/billing-lines/{lineId}:
        put:
