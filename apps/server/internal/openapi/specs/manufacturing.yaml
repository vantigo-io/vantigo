            tags:
                - Manufacturing
            x-vantigo-access: permission:manufacturing:access
    /api/v1/manufacturing/work-centers:
        get:
            operationId: listManufacturingWorkCenters
            parameters:
                - description: Default active.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/ManufacturingStatusFilter'
                - in: query
                  name: siteId
                  required: false
                  schema:
                    format: int64
                    type: integer
                - description: Matched against code and name.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingWorkCenterList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: 'Service Unavailable — dependency_unavailable: the catalog or Inventory is not composed. Nothing was changed.'
            summary: List work centers
            tags:
                - Manufacturing
            x-vantigo-access: permission:manufacturing:access
        post:
            operationId: createManufacturingWorkCenter
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ManufacturingWorkCenterInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingWorkCenter'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: Bad Request — field errors; site_unknown.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: Forbidden — the caller lacks the permission, or (costs_view_required, a problem) sent a cost rate without manufacturing:costs-view.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: Conflict — work_center_code_taken.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
                    description: 'Service Unavailable — dependency_unavailable: the catalog or Inventory is not composed. Nothing was changed.'
            summary: Create a work center
            tags:
                - Manufacturing
            x-vantigo-access: permission:manufacturing:access+manufacturing:boms-manage
    /api/v1/manufacturing/work-centers/{id}:
        delete:
            operationId: deleteManufacturingWorkCenter
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the client read.
                  in: query
                  name: revision
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such work center. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/ManufacturingProblem'
