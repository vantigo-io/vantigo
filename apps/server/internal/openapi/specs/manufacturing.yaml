components:
    schemas:
        ManufacturingAvailability:
            description: 'An order''s component status (M21, M21a), computed live: every line covered by its reservation and the site''s available, some, or none.'
            enum:
                - ready
                - partly_available
                - waiting
            type: string
        ManufacturingBlockInput:
            additionalProperties: false
            description: Blocking a work center (M30).
            properties:
                note:
                    description: At most 2000 characters.
                    type: string
                reason:
                    $ref: '#/components/schemas/ManufacturingDowntimeReason'
            required:
                - reason
            type: object
        ManufacturingBom:
            additionalProperties: false
            description: A bill of materials (M10) with its operations and lines.
            properties:
                code:
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    type: boolean
                leadTimeDays:
                    format: int32
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLine'
                    type: array
                lotPattern:
                    description: The pattern the number of the lot its productions make is rendered from (manufacturing phase 2 M80).
                    type: string
                makeToOrder:
                    type: boolean
                note:
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperation'
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                siteId:
                    description: The site of its operations' work centers, null when it has none.
                    format: int64
                    nullable: true
                    type: integer
                status:
                    $ref: '#/components/schemas/ManufacturingStatus'
                updatedAt:
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - code
                - outputQuantity
                - isDefault
                - makeToOrder
                - leadTimeDays
                - note
                - status
                - revision
                - siteId
                - operations
                - lines
                - createdAt
                - updatedAt
                - lotPattern
            type: object
        ManufacturingBomInput:
            additionalProperties: false
            description: A new BoM with its operations and lines. The variant's first active BoM becomes its default.
            properties:
                code:
                    description: 1–32 characters, unique among BoMs (bom_code_taken); null for none.
                    maxLength: 32
                    minLength: 1
                    nullable: true
                    type: string
                isDefault:
                    description: Make it the variant's default, unmarking the old one.
                    type: boolean
                leadTimeDays:
                    description: 0 or more; default 0.
                    format: int32
                    minimum: 0
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLineInput'
                    maxItems: 200
                    type: array
                lotPattern:
                    description: "The number of the lot its productions make, 1–40 characters (manufacturing phase 2 M80): {MO} the order's number, {YYYY} {YY} {MM} {DD} and {YYMMDD} the production date, {SKU} the product's SKU, {N} a counter per rendered prefix; anything else is literal. A sample render must be a lot number — 1–20 characters A–Z, a–z, 0–9 and . _ / - (lot_pattern_invalid). Default {MO}: every production of an order adds to one lot; L{YYMMDD}-{N} makes a lot per production. An update that leaves it out keeps the stored pattern."
                    maxLength: 40
                    minLength: 1
                    type: string
                makeToOrder:
                    description: Default false.
                    type: boolean
                note:
                    maxLength: 2000
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperationInput'
                    maxItems: 50
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                variantId:
                    description: A goods variant (variant_not_goods), never changed after.
                    format: int32
                    type: integer
            required:
                - variantId
                - outputQuantity
                - operations
                - lines
            type: object
        ManufacturingBomLine:
            additionalProperties: false
            description: A component line of a BoM (M11), per the BoM's outputQuantity.
            properties:
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                operationId:
                    format: int64
                    nullable: true
                    type: integer
                operationKey:
                    description: The consuming operation's key, null when none.
                    nullable: true
                    type: string
                quantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                scrapPercent:
                    description: Exact decimal, 0 to 99.99.
                    type: string
                sortOrder:
                    format: int32
                    type: integer
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - quantity
                - scrapPercent
                - operationId
                - operationKey
                - sortOrder
                - note
            type: object
        ManufacturingBomLineInput:
            additionalProperties: false
            description: A component line as the editor sends it.
            properties:
                note:
                    maxLength: 2000
                    type: string
                operationKey:
                    description: The key of an operation in the same request (operation_key_unknown).
                    nullable: true
                    type: string
                quantity:
                    description: Exact decimal, more than 0, at most three decimals (quantity_invalid).
                    type: string
                scrapPercent:
                    description: Exact decimal, 0 to 99.99; default 0.
                    type: string
                sortOrder:
                    format: int32
                    type: integer
                variantId:
                    description: A goods variant (variant_not_found, variant_not_goods).
                    format: int32
                    type: integer
            required:
                - variantId
                - quantity
            type: object
        ManufacturingBomList:
            additionalProperties: false
            description: A page of BoMs and the total matching.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomSummary'
                    type: array
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        ManufacturingBomOperation:
            additionalProperties: false
            description: An operation of a BoM (M12), after the operations it depends on (manufacturing phase 2 M112), at a work center or a work center group (M118).
            properties:
                checks:
                    description: Its quality checks, by sequence (manufacturing phase 2 M95).
                    items:
                        $ref: '#/components/schemas/ManufacturingCheckTemplate'
                    type: array
                dependsOn:
                    description: The keys of the operations it runs after (M112); empty when it can start at once.
                    items:
                        type: string
                    type: array
                id:
                    format: int64
                    type: integer
                instructions:
                    description: Markdown.
                    type: string
                key:
                    description: The id as text, the editor's key for the operation.
                    type: string
                minutesPerCycle:
                    description: Exact decimal, more than 0.
                    type: string
                name:
                    type: string
                sendAheadQuantity:
                    description: Exact decimal; the good units it passes on before its successors may start (M116), null for none.
                    nullable: true
                    type: string
                sequence:
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal; null when the work center's setup applies.
                    nullable: true
                    type: string
                workCenterCode:
                    description: The work center's code, or the group's for an operation that targets a group.
                    type: string
                workCenterGroupId:
                    description: The work center group it targets (M118); null when it targets one work center.
                    format: int64
                    nullable: true
                    type: integer
                workCenterId:
                    description: The work center it targets; null when it targets a group.
                    format: int64
                    nullable: true
                    type: integer
                workCenterName:
                    description: The work center's name, or the group's.
                    type: string
            required:
                - id
                - key
                - sequence
                - name
                - workCenterId
                - workCenterCode
                - workCenterName
                - workCenterGroupId
                - setupMinutes
                - minutesPerCycle
                - instructions
                - checks
                - dependsOn
                - sendAheadQuantity
            type: object
        ManufacturingBomOperationInput:
            additionalProperties: false
            description: An operation as the editor sends it.
            properties:
                checks:
                    description: 'Its quality checks, in order (M95): at most 20; absent or empty for none. They replace the operation''s checks.'
                    items:
                        $ref: '#/components/schemas/ManufacturingCheckTemplateInput'
                    maxItems: 20
                    type: array
                dependsOn:
                    description: 'The keys of the operations of this request it runs after (M112): absent for the operation before it by sequence, empty to start at once. Only operations earlier by sequence: a key no operation has is operation_unknown, one of an operation not before it operation_order; and every operation but the last must have one that runs after it, else operation_unjoined.'
                    items:
                        type: string
                    maxItems: 50
                    type: array
                id:
                    description: An existing operation of this BoM to keep; absent for a new one.
                    format: int64
                    type: integer
                instructions:
                    description: Markdown.
                    maxLength: 20000
                    type: string
                key:
                    description: 1–40 characters, unique in the request; lines name it in operationKey.
                    maxLength: 40
                    minLength: 1
                    type: string
                minutesPerCycle:
                    description: Exact decimal, more than 0.
                    type: string
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                sendAheadQuantity:
                    description: Exact decimal, more than 0; the good units it passes on before its successors may start (M116). Null or absent for none.
                    nullable: true
                    type: string
                sequence:
                    format: int32
                    type: integer
                setupMinutes:
                    description: Exact decimal, 0 or more; null or absent for the work center's setup.
                    nullable: true
                    type: string
                workCenterGroupId:
                    description: An active work center group with an active member (work_center_unknown), instead of workCenterId (M118).
                    format: int64
                    type: integer
                workCenterId:
                    description: An active work center (work_center_unknown). Exactly one of workCenterId and workCenterGroupId.
                    format: int64
                    type: integer
            required:
                - key
                - sequence
                - name
                - minutesPerCycle
            type: object
        ManufacturingBomOverview:
            additionalProperties: false
            description: A BoM exploded at a quantity, up to 10 levels and 2000 nodes.
            properties:
                bomId:
                    format: int64
                    type: integer
                costIncomplete:
                    description: A bought component has no standard cost and counted 0. Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                    type: boolean
                nodeCount:
                    format: int32
                    type: integer
                quantity:
                    description: Exact decimal.
                    type: string
                rolledUpCost:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingRolledUpCost'
                    description: Present only when the caller holds manufacturing:costs-view (M38); absent otherwise.
                root:
                    $ref: '#/components/schemas/ManufacturingOverviewNode'
                siteId:
                    format: int64
                    nullable: true
                    type: integer
            required:
                - bomId
                - quantity
                - siteId
                - nodeCount
                - root
            type: object
        ManufacturingBomSummary:
            additionalProperties: false
            description: A BoM as the list shows it.
            properties:
                code:
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    type: boolean
                lineCount:
                    format: int32
                    type: integer
                makeToOrder:
                    type: boolean
                operationCount:
                    format: int32
                    type: integer
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/ManufacturingStatus'
                updatedAt:
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/ManufacturingVariantRef'
            required:
                - id
                - variant
                - code
                - outputQuantity
                - isDefault
                - makeToOrder
                - status
                - revision
                - lineCount
                - operationCount
                - updatedAt
            type: object
        ManufacturingBomUpdate:
            additionalProperties: false
            description: A BoM's fields, operations and lines, replacing what it has, under its revision (M13).
            properties:
                code:
                    description: 1–32 characters, unique among BoMs (bom_code_taken); null for none.
                    maxLength: 32
                    minLength: 1
                    nullable: true
                    type: string
                leadTimeDays:
                    description: 0 or more; default 0.
                    format: int32
                    minimum: 0
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomLineInput'
                    maxItems: 200
                    type: array
                lotPattern:
                    description: "The number of the lot its productions make, 1–40 characters (manufacturing phase 2 M80): {MO} the order's number, {YYYY} {YY} {MM} {DD} and {YYMMDD} the production date, {SKU} the product's SKU, {N} a counter per rendered prefix; anything else is literal. A sample render must be a lot number — 1–20 characters A–Z, a–z, 0–9 and . _ / - (lot_pattern_invalid). Default {MO}: every production of an order adds to one lot; L{YYMMDD}-{N} makes a lot per production. An update that leaves it out keeps the stored pattern."
                    maxLength: 40
                    minLength: 1
                    type: string
                makeToOrder:
                    description: Default false.
                    type: boolean
                note:
                    maxLength: 2000
                    type: string
                operations:
                    items:
                        $ref: '#/components/schemas/ManufacturingBomOperationInput'
                    maxItems: 50
                    type: array
                outputQuantity:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    description: The revision the client read (revision_conflict).
                    format: int32
                    type: integer
            required:
                - outputQuantity
                - operations
                - lines
                - revision
            type: object
        ManufacturingCheckFrequency:
            description: 'When a check is recorded (manufacturing phase 2 M95): each_work_order, once before the work order finishes; first_piece, before any output is registered past the work order, shown first at Start.'
            enum:
                - each_work_order
                - first_piece
            type: string
        ManufacturingCheckKind:
            description: 'What a check asks (M95): instruction, read and acknowledged (done); pass_fail; measure, a value the server judges against min and max; photo, a picture taken at the station.'
            enum:
                - instruction
                - pass_fail
                - measure
                - photo
            type: string
        ManufacturingCheckPhoto:
            additionalProperties: false
            description: 'A check''s photo, uploaded before the result that names it (M97). One no result names 24 hours after its upload is removed.'
            properties:
                contentType:
                    type: string
                id:
                    format: int64
                    type: integer
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
                workOrderId:
                    format: int64
                    type: integer
            required:
                - id
                - workOrderId
                - contentType
                - sizeBytes
                - uploadedAt
            type: object
        ManufacturingCheckResult:
            additionalProperties: false
            description: 'A check''s result in force (M97): the latest recorded; an earlier one is kept, superseded.'
            properties:
                deviationId:
                    description: The deviation the result opened when it failed (M99).
                    format: int64
                    nullable: true
                    type: integer
                deviationNumber:
                    description: DEV-<n>.
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    nullable: true
                    type: string
                photoId:
                    format: int64
                    nullable: true
                    type: integer
                recordedAt:
                    format: date-time
                    type: string
                recordedBy:
                    $ref: '#/components/schemas/ManufacturingDeviationActor'
                result:
                    $ref: '#/components/schemas/ManufacturingCheckResultValue'
                value:
                    description: 'A measure''s value, exact decimal with at most four decimals.'
                    nullable: true
                    type: string
            required:
                - id
                - result
                - value
                - note
                - photoId
                - recordedBy
                - recordedAt
                - deviationId
                - deviationNumber
            type: object
        ManufacturingCheckResultInput:
            additionalProperties: false
            description: 'A check''s result as the station sends it (M97): result for an instruction (done) or a pass/fail check (pass, fail); value for a measure, judged by the server; photoId for a photo, optional on the others. A photo check without a photo is photo_required.'
            properties:
                note:
                    maxLength: 1000
                    type: string
                photoId:
                    description: A photo uploaded to this work order.
                    format: int64
                    type: integer
                result:
                    $ref: '#/components/schemas/ManufacturingCheckResultValue'
                value:
                    description: 'A measure''s value: exact decimal, at most four decimals.'
                    type: string
            type: object
        ManufacturingCheckResultValue:
            enum:
                - done
                - pass
                - fail
            type: string
        ManufacturingCheckTemplate:
            additionalProperties: false
            description: A check of a BoM operation (M95), copied onto the work order at confirm (M96).
            properties:
                frequency:
                    $ref: '#/components/schemas/ManufacturingCheckFrequency'
                id:
                    format: int64
                    type: integer
                instructions:
                    description: Markdown.
                    type: string
                kind:
                    $ref: '#/components/schemas/ManufacturingCheckKind'
                max:
                    description: Exact decimal, at most four decimals; a measure's upper limit.
                    nullable: true
                    type: string
                min:
                    description: Exact decimal, at most four decimals; a measure's lower limit.
                    nullable: true
                    type: string
                nominal:
                    description: Exact decimal, at most four decimals; a measure's target.
                    nullable: true
                    type: string
                quarantineOnFail:
                    description: A failed result's deviation puts the order's output in quarantine (M99).
                    type: boolean
                sequence:
                    format: int32
                    type: integer
                title:
                    type: string
                unit:
                    nullable: true
                    type: string
            required:
                - id
                - sequence
                - kind
                - title
                - instructions
                - nominal
                - min
                - max
                - unit
                - frequency
                - quarantineOnFail
            type: object
        ManufacturingCheckTemplateInput:
            additionalProperties: false
            description: 'A check as the BoM editor sends it (M95). A measure needs min or max, and min ≤ nominal ≤ max where given (check_limits_invalid). At most 20 an operation.'
            properties:
                frequency:
                    $ref: '#/components/schemas/ManufacturingCheckFrequency'
                instructions:
                    description: Markdown.
                    maxLength: 5000
                    type: string
                kind:
                    $ref: '#/components/schemas/ManufacturingCheckKind'
                max:
                    nullable: true
                    type: string
                min:
                    nullable: true
                    type: string
                nominal:
                    nullable: true
                    type: string
                quarantineOnFail:
                    type: boolean
                title:
                    maxLength: 200
                    minLength: 1
                    type: string
                unit:
                    maxLength: 20
                    nullable: true
                    type: string
            required:
                - kind
                - title
                - frequency
            type: object
        ManufacturingCloseInput:
            additionalProperties: false
            description: Closing an order (M23).
            properties:
                backorder:
                    description: 'When less than the quantity was produced: true creates a backorder for the rest, false closes short; absent is quantity_short (409).'
                    nullable: true
                    type: boolean
                revision:
                    format: int32
                    type: integer
            required:
                - revision
            type: object
        ManufacturingCloseResult:
            additionalProperties: false
            description: A closed order and the backorder made for its rest.
            properties:
                backorder:
                    allOf:
                        - $ref: '#/components/schemas/ManufacturingOrder'
                    nullable: true
                order:
                    $ref: '#/components/schemas/ManufacturingOrder'
                shortLines:
                    description: The backorder's lines left unreserved when it was confirmed.
                    items:
                        $ref: '#/components/schemas/ManufacturingShortLine'
                    type: array
            required:
                - order
                - backorder
                - shortLines
            type: object
        ManufacturingClosure:
            additionalProperties: false
            description: A range of days a work center is closed, both included (M9).
            properties:
                fromDate:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                toDate:
                    format: date
                    type: string
                workCenterId:
                    format: int64
                    type: integer
            required:
                - id
                - workCenterId
                - fromDate
                - toDate
                - note
            type: object
        ManufacturingClosureInput:
            additionalProperties: false
            description: 'A closure: at most 100 per work center (closures_too_many).'
            properties:
                fromDate:
                    format: date
                    type: string
                note:
                    maxLength: 500
                    type: string
                toDate:
                    description: On or after fromDate.
                    format: date
                    type: string
            required:
                - fromDate
                - toDate
            type: object
        ManufacturingClosureList:
            additionalProperties: false
            description: A work center's closures, by fromDate.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/ManufacturingClosure'
                    type: array
            required:
                - items
            type: object
        ManufacturingComponentInput:
            additionalProperties: false
            description: A component added to a confirmed or in-progress order (M18).
            properties:
                note:
                    maxLength: 2000
                    type: string
                operationId:
                    description: The BoM operation that consumes it.
                    format: int64
                    nullable: true
                    type: integer
                required:
                    description: Exact decimal, more than 0, at most three decimals.
                    type: string
                revision:
                    format: int32
                    type: integer
                variantId:
                    description: A goods variant.
                    format: int32
                    type: integer
            required:
                - revision
                - variantId
                - required
            type: object
        ManufacturingComponentUpdate:
            additionalProperties: false
            description: A component line's new requirement (M18, M18a).
            properties:
                note:
                    description: Absent keeps the note.
                    maxLength: 2000
                    type: string
                required:
                    description: Exact decimal, 0 or more, never below consumed + scrapped (required_below_used).
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - revision
                - required
            type: object
        ManufacturingCostDeviation:
            additionalProperties: false
            description: 'The actual against the estimate, per part (M41): amount = actual − estimate, both as rounded; percent of the estimate, half-up to one decimal, null when the estimate is 0.'
            properties:
                components:
                    $ref: '#/components/schemas/ManufacturingCostDeviationPart'
                labour:
                    $ref: '#/components/schemas/ManufacturingCostDeviationPart'
                machine:
                    $ref: '#/components/schemas/ManufacturingCostDeviationPart'
                total:
                    $ref: '#/components/schemas/ManufacturingCostDeviationPart'
            required:
                - components
                - machine
                - labour
                - total
            type: object
        ManufacturingCostDeviationPart:
            additionalProperties: false
            description: One part's deviation.
            properties:
                amount:
                    description: Exact decimal text in NOK, two decimals; negative when under the estimate.
                    type: string
                percent:
                    description: Of the estimate, half-up to one decimal; null when the estimate is 0.
                    nullable: true
                    type: string
            required:
                - amount
                - percent
            type: object
        ManufacturingCostParts:
            additionalProperties: false
            description: 'A cost in its three parts (M39, M40), each exact decimal text in NOK rounded half-up to two decimals once; total is the exact sum rounded once. incomplete when a component had no standard cost or a work order no rate, counted as 0.'
            properties:
                components:
                    type: string
                incomplete:
                    type: boolean
                labour:
                    type: string
                machine:
                    type: string
                total:
                    type: string
            required:
                - components
                - machine
                - labour
                - total
                - incomplete
            type: object
        ManufacturingDeviation:
            additionalProperties: false
            description: A consumed quantity more than 10 % off its proportional figure (M22).
            properties:
                componentId:
                    format: int64
                    type: integer
                consumed:
                    description: What the request sent.
                    type: string
                expected:
                    description: The proportional figure.
                    type: string
                sku:
                    type: string
            required:
                - componentId
                - sku
                - expected
                - consumed
            type: object
        ManufacturingDeviationActor:
            additionalProperties: false
            description: Who did something, as it was recorded; the user id stays after the person is erased (rule 19).
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - userId
                - displayName
            type: object
        ManufacturingDeviationCloseInput:
            additionalProperties: false
            description: 'Closing a deviation (M99): the disposition and a closing note. use_as_is and rework release its own holds; scrap and return keep them.'
            properties:
                closingNote:
                    maxLength: 2000
                    minLength: 1
                    type: string
                disposition:
                    $ref: '#/components/schemas/ManufacturingDeviationDisposition'
                revision:
                    format: int32
                    type: integer
            required:
                - disposition
                - closingNote
                - revision
            type: object
        ManufacturingDeviationDisposition:
            enum:
                - use_as_is
                - rework
                - scrap
                - return
            type: string
        ManufacturingDeviationLot:
            additionalProperties: false
            description: A lot the deviation put a quarantine hold on.
            properties:
                heldAt:
                    format: date-time
                    type: string
                lotId:
                    format: int64
                    type: integer
                lotNumber:
                    type: string
            required:
                - lotId
                - lotNumber
                - heldAt
            type: object
        ManufacturingDowntimeMinutes:
            additionalProperties: false
