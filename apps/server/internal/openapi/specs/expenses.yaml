                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — refused on 'file' for what was uploaded (missing, empty, too large, or not one of the four types), and on 'entryId' for what it was uploaded onto (a mileage line, an expense that has been submitted or approved, one dated before the period lock, or one that already carries ten receipts).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
