            x-vantigo-access: permission:expenses:access
        post:
            description: Records one expense as a draft. A mileage line is priced from the dated rate table for its own date; an outlay is entered as it stands.
            operationId: postExpensesEntries
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesEntryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: Created — a draft owned by the caller, or by the person userId names.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Record an expense
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}:
        delete:
            description: 'Deletes an expense while it is still its owner''s to change — a draft or a rejected line, by its owner or by expenses:manage, and not before the period lock. The two refusals are told apart on purpose: who is asking is a 403, what the expense is right now is a 400 naming the reason.'
            operationId: deleteExpensesEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the expense has moved past being editable (on status) or is dated before the period lock (on entryDate).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the expense is not the caller's to change; they are neither its owner nor a holder of expenses:manage.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
            summary: Delete an expense
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        get:
            description: One expense, shaped for the caller. An expense the caller may not see answers the same bare 404 an unknown id does.
            operationId: getExpensesEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
            summary: Get an expense by id
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        put:
            description: Replaces an expense, guarded by the revision it was read at. A mileage line is priced again from the rate table, so a draft always shows what it is worth today.
            operationId: putExpensesEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesEntryUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, or the expense has moved past being editable (on status) or is dated before the period lock (on entryDate).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the expense is not the caller's to change; they are neither its owner nor a holder of expenses:manage.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the expense has moved on from the revision supplied.
            summary: Change an expense
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/attachments:
        post:
            description: 'Attaches one receipt to an outlay: a JPEG, PNG, HEIC or PDF of at most 10 MB, and at most ten per expense. The type is read from the file''s own bytes and has to agree with what the client called it. Only whoever may change the expense may attach to it, and only while it is a draft or rejected.'
            operationId: postExpensesEntriesByIdAttachments
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesAttachmentResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — refused on 'file' for what was uploaded (missing, empty, too large, or not one of the four types), and on 'entryId' for what it was uploaded onto (a mileage line, an expense that has been submitted or approved, one dated before the period lock, or one that already carries ten receipts).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the expense but it is not theirs to change.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 600 receipt uploads an hour from one client address, which a whole office behind one address shares.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Service Unavailable — the receipt store could not be written to; nothing was recorded.
            summary: Attach a receipt to an expense
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/billing-lines:
        get:
            description: 'The billing lines of the expense''s own project, for the caller who prices it. GET /api/v1/expenses/projects cannot serve the pricing dialog: it answers the projects the *caller* may book an expense on, which is the member-or-manager right on a project still open for work, while pricing belongs to whoever may see the project''s money — its manager, projects:manage-all, or projects:view-financials on a project they can see. A finance person on no project team, and anybody pricing a line on a project that has been completed, would be offered nothing at all by that list. This one is keyed on the expense instead and judged by exactly the rule PUT /entries/{id}/billing is judged by, so the dialog can never offer a line the save then refuses. Active lines, ordered by code, plus the expense''s own current line even if the project has since stopped using it.'
            operationId: getExpensesEntriesByIdBillingLines
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ExpensesBillingLineOption'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on projectId, because the expense is booked on no project and so has nothing to bill a customer for.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the expense but not the money its project makes on it.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Not Found — no expense has that id, or the caller may not see it, in which case the body is empty and identical to an unknown id's; with a problem body, this installation has no projects module, the same answer GET /api/v1/expenses/projects gives.
            summary: List the billing lines an expense may be priced against
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/billing:
        put:
            description: 'Prices one expense from its project''s side: what it bills the customer, and which billing line it is booked against. This is a door of its own because expenses:manage does not imply financial rights on a project and an employee''s expense form never carries a markup — the project''s manager prices the line when they approve it, whatever status it has reached. It changes nothing else about the expense.'
            operationId: putExpensesEntriesByIdBilling
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesBillingRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on projectId when the expense is on no project or this installation has no projects module, on status when it has been invoiced, and on the figures' own fields otherwise, including a markup or a customer rate named for a project that bills nothing.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the expense but not the money its project makes on it.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the expense's revision has moved on.
            summary: Price an expense from its project
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/invoiced:
        post:
            description: 'Marks one approved, billable line as billed on to the customer (decision X5). The caller needs financial rights on the line''s project — its managers, projects:manage-all, or projects:view-financials on a project they can see — and expenses:manage is not it: paying the employee and charging the customer are different jobs. The line must be approved, billable and carry an amount to bill: a billable mileage line saved while no customer rate was in force carries none and has to be priced first. The period lock does not hold it back — the lock protects what the employee submitted and what was approved, and invoicing is bookkeeping done after the period closes. The two tracks are independent: a line that has been reimbursed is still invoiceable, and the other way round.'
            operationId: postExpensesEntriesByIdInvoiced
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesInvoicedRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on projectId when the line is on no project or the installation has no projects module, on status when it is not approved or is invoiced already, on billable when nobody bills it, on billAmount when it has not been priced, or on reference.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the expense but not the project's money.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the expense has moved on since the revision that was sent.
            summary: Mark an expense invoiced
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/invoiced/undo:
