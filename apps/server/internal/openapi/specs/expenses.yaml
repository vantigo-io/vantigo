components:
    schemas:
        ExpensesApprovalGroup:
            description: 'One person''s submitted units that the caller may approve, with the figures an approver decides on at a glance. A unit is a standalone expense or a whole travel claim, so the group holds two lists: a claim is one row of claims and never a run of loose entries.'
            properties:
                claims:
                    description: The person's submitted travel claims, the earliest departure first. Each is one unit to approve; the trip's own page (GET /claims/{id}) holds its lines.
                    items:
                        $ref: '#/components/schemas/ExpensesClaimSummary'
                    type: array
                entries:
                    description: The person's submitted standalone expenses, oldest day first and then as recorded. Shaped exactly as a single read of each would be for this caller. A travel claim's lines are never here — the claim is the unit.
                    items:
                        $ref: '#/components/schemas/ExpensesEntryResponse'
                    type: array
                overriddenRates:
                    description: How many lines in the group carry a rate an approver has already replaced, the claims' lines included.
                    format: int32
                    type: integer
                receiptsMissing:
                    description: How many lines in the group are outlays with no receipt at all, the claims' lines included. Mileage and a per diem day never take one and are never counted.
                    format: int32
                    type: integer
                totals:
                    description: The group's figures, one line per currency, by currency code — the standalone expenses and the claims' lines together. Nothing is ever converted.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyTotal'
                    type: array
                user:
                    $ref: '#/components/schemas/ExpensesUserRef'
            required:
                - user
                - entries
                - claims
                - totals
                - receiptsMissing
                - overriddenRates
            type: object
        ExpensesAttachmentResponse:
            description: 'One receipt on an expense (design §3.2). The bytes themselves are never in a JSON body: they are read back from GET /attachments/{id}, which serves them with the expense''s own visibility.'
            properties:
                contentType:
                    description: What the receipt was detected to be when it was uploaded — image/jpeg, image/png, image/heic or application/pdf — and what the download is served as.
                    type: string
                fileName:
                    description: The name the client uploaded it under, stripped of any path and capped at 255 characters. It is never what the object is stored under.
                    type: string
                id:
                    format: int64
                    type: integer
                sizeBytes:
                    description: The receipt's size in bytes, at most 10 MB.
                    format: int64
                    type: integer
            required:
                - id
                - fileName
                - contentType
                - sizeBytes
            type: object
        ExpensesBillingLineOption:
            description: 'One billing line a pricer may book an expense against. It carries active because the list holds the expense''s own current line even after the project has stopped using it: the dialog has to be able to show what is stored without offering it again.'
            properties:
                active:
                    description: Whether the project still offers the line. False only for the line this expense already carries — every other line in the list is active.
                    type: boolean
                code:
                    type: string
                id:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - active
            type: object
        ExpensesBillingRequest:
            description: 'What an expense bills its customer, set from the project''s side (decision X7). It is a full replace of the billing fields alone and touches nothing else about the expense: not its amount, not its status, not its receipts. Only a caller with financial rights on the entry''s project may send it — expenses:manage is not one of them — because the markup and the customer rate per kilometre are the project''s figures and an employee''s form never carries them. Allowed while the expense is a draft, rejected, submitted or approved; refused once it has been invoiced, and refused outright on a per diem day, which is never billed on to a customer. The period lock does not reach it: the lock protects what the employee submitted and what was approved, while pricing is bookkeeping done after a period closes — an invoice for December goes out in January.'
            properties:
                billRatePerKm:
                    description: What the customer is charged per kilometre. Only on billable mileage. Left out, the line keeps whatever it carries, and a line that carries none takes the mileage_customer rate in force on the entry date. Refused on a project that bills nothing, rather than accepted and cleared.
                    format: double
                    type: number
                billable:
                    description: Whether the line is billed on to the customer. Forced false on a project that bills nothing. Turning it off clears the markup, the customer rate and the bill amount.
                    type: boolean
                billingLineId:
                    description: An active billing line of the entry's own project, or absent to book it against none. Refused on a per diem day, which bills nobody anything.
                    format: int32
                    type: integer
                markupPercent:
                    description: A billable outlay's markup on the net, 0 to 1000 with at most two decimals. Left out, the line keeps whatever it carries, and a line that carries none takes the settings' default. Refused on a project that bills nothing, rather than accepted and cleared.
                    format: double
                    type: number
                revision:
                    description: The revision the expense was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
            required:
                - billable
                - revision
            type: object
        ExpensesCategoryRequest:
            description: A new expense category. The name is unique case-insensitively; position is the place it takes in the picker and defaults to the end.
            properties:
                active:
                    description: Whether the category may be chosen. Absent means active.
                    type: boolean
                name:
                    type: string
                position:
                    description: The 1-based place the category takes in the picker; the server renumbers the others around it, so the list stays a dense 1..n. A place past the end of the list is the end. Absent puts it last.
                    format: int32
                    type: integer
            required:
                - name
            type: object
        ExpensesCategoryResponse:
            description: One expense category (design §3.3). Categories are deactivated, never deleted, once an expense has used one.
            properties:
                active:
                    type: boolean
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                position:
                    description: The 1-based place it holds in the picker. Positions are a dense 1..n over every category, active or not, and the list is returned in that order — so this is the place it ended up in, which is not always the one a request asked for.
                    format: int32
                    type: integer
            required:
                - id
                - name
                - active
                - position
            type: object
        ExpensesCategoryUpdateRequest:
            description: A full replace of a category's name, whether it may be chosen, and where it sits. Renaming it onto another category's name — however it is cased — is refused on the name field.
            properties:
                active:
                    type: boolean
                name:
                    type: string
                position:
                    description: 'The 1-based place the category is to take in the picker; the server renumbers the others, so the list stays a dense 1..n. Send the place you want it in, not the neighbour''s number: sending a place it already holds changes no order at all, and a place past the end of the list is the end. Deactivated categories keep their place and are counted in the numbering.'
                    format: int32
                    type: integer
            required:
                - name
                - active
                - position
            type: object
        ExpensesClaimCapabilities:
            description: What the calling user may do with this travel claim, so a client never re-derives the rules of design §5. A claim is the unit that moves through the flow and through a payroll run, so these are the claim's own — its lines carry no submit, approve or reimburse of their own.
            properties:
                canApprove:
                    description: Whether the caller may approve or reject it — an approver of it, while it is submitted.
                    type: boolean
                canDelete:
                    description: Whether the caller may delete it, which takes its lines and their receipts with it.
                    type: boolean
                canEdit:
                    description: Whether the caller may change it — its owner or expenses:manage, while it is a draft or rejected, and not before the period lock. It is the same answer for adding, changing or deleting one of its lines.
                    type: boolean
                canMarkReimbursed:
                    description: 'Whether the caller may mark it reimbursed — expenses:manage, while it is approved, owes the employee something and has not been paid yet. The period lock does not hold it back: payroll runs after the books close.'
                    type: boolean
                canSubmit:
                    description: Whether the caller may submit it — its owner or expenses:manage, while it is a draft or rejected, and not before the period lock.
                    type: boolean
                canUnapprove:
                    description: Whether the caller may return it to a draft — an approver of it or expenses:manage, while it is approved and has not been reimbursed.
                    type: boolean
                canUndoReimbursed:
                    description: Whether the caller may take the reimbursement back — expenses:manage, while it stands reimbursed.
                    type: boolean
            required:
                - canEdit
                - canDelete
                - canSubmit
                - canApprove
                - canUnapprove
                - canMarkReimbursed
                - canUndoReimbursed
            type: object
        ExpensesClaimListResponse:
            description: One travel claim in a list — everything a single read answers except its lines, which a list of trips has no use for, plus how many there are.
            properties:
                abroad:
                    type: boolean
                abroadCurrency:
                    description: The currency the claim's own day rate is in. Present only on a claim abroad.
                    type: string
                abroadDayRate:
                    description: The day rate a trip abroad is paid at, in place of the dated table's. Present only on a claim abroad.
                    format: double
                    type: number
                capabilities:
                    $ref: '#/components/schemas/ExpensesClaimCapabilities'
                createdAt:
                    format: date-time
                    type: string
                decision:
                    $ref: '#/components/schemas/ExpensesEntryDecision'
                departureAt:
                    format: date-time
                    type: string
                destination:
                    type: string
                id:
                    format: int64
                    type: integer
                lineCount:
                    description: How many expenses the claim holds.
                    format: int32
                    type: integer
                owner:
                    $ref: '#/components/schemas/ExpensesUserRef'
                project:
                    $ref: '#/components/schemas/ExpensesEntryProject'
                purpose:
                    type: string
                reimbursement:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesEntryReimbursement'
                    description: That the employee has been paid back for the trip. Absent until then.
                returnAt:
                    format: date-time
                    type: string
                revision:
                    format: int32
                    type: integer
                status:
                    description: '''draft'', ''submitted'', ''approved'' or ''rejected''.'
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                totals:
                    description: The claim's figures, one line per currency, by currency code. Nothing is ever converted.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyTotal'
                    type: array
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - purpose
                - abroad
                - departureAt
                - returnAt
                - status
                - owner
                - lineCount
                - totals
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        ExpensesClaimRequest:
            description: 'A travel claim (design §3.6): the container a trip''s expenses sit in. Its lines are ordinary expenses carrying its id — they take their owner, their project, their status and their decision from it, and keep their own kind, date, amounts and receipts. A claim is created as a draft with no lines.'
            properties:
                abroad:
                    description: Whether the trip was abroad. A trip abroad is paid at the claim's own day rate rather than the dated per diem table, so abroadDayRate and abroadCurrency are required with it and refused without it.
                    type: boolean
                abroadCurrency:
                    description: A three-letter ISO 4217 code. Required when abroad, refused otherwise.
                    type: string
                abroadDayRate:
                    description: The day rate the trip is paid at, greater than zero with at most two decimals. Required when abroad, refused otherwise.
                    format: double
                    type: number
                departureAt:
                    description: When the traveller left, as entered. It is stored and compared as the instant it names; the per diem day boundaries are 24-hour periods from it, not calendar midnights.
                    format: date-time
                    type: string
                destination:
                    description: At most 200 characters.
                    type: string
                projectId:
                    description: The project the whole trip is booked on, and so every one of its lines. The person it concerns must be allowed to book on it — what logging time needs. Refused when this installation has no projects module.
                    format: int32
                    type: integer
                purpose:
                    description: What the trip was for. 1 to 200 characters.
                    type: string
                returnAt:
                    description: When the traveller came back. It must be after the departure, and the trip may be at most 366 days.
                    format: date-time
                    type: string
                userId:
                    description: The person the claim concerns. Absent means the caller; naming somebody else needs expenses:manage, and they must be a user identity still has as active.
                    format: uuid
                    type: string
            required:
                - purpose
                - departureAt
                - returnAt
            type: object
        ExpensesClaimResponse:
            description: One travel claim as the caller may see it, with its lines. A line is shaped exactly as a single read of it would be — the same renderer, the same capabilities — and the claim is visible to its owner, a manager of its project, and expenses:view-all, expenses:approve and expenses:manage; anyone else gets the bare 404 an unknown id gets.
            properties:
                abroad:
                    type: boolean
                abroadCurrency:
                    description: The currency the claim's own day rate is in. Present only on a claim abroad.
                    type: string
                abroadDayRate:
                    description: The day rate a trip abroad is paid at, in place of the dated table's. Present only on a claim abroad.
                    format: double
                    type: number
                billableTotals:
                    description: What the claim's lines bill their customer, one line per currency. Present only for a caller with financial rights on the claim's project, exactly as the billing object on a line is.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyAmount'
                    type: array
                capabilities:
                    $ref: '#/components/schemas/ExpensesClaimCapabilities'
                createdAt:
                    format: date-time
                    type: string
                decision:
                    $ref: '#/components/schemas/ExpensesEntryDecision'
                departureAt:
                    format: date-time
                    type: string
                destination:
                    type: string
                id:
                    format: int64
                    type: integer
                lines:
                    description: The claim's expenses, oldest day first and then as recorded. Always present, empty when it holds none.
                    items:
                        $ref: '#/components/schemas/ExpensesEntryResponse'
                    type: array
                owner:
                    $ref: '#/components/schemas/ExpensesUserRef'
                project:
                    $ref: '#/components/schemas/ExpensesEntryProject'
                purpose:
                    type: string
                reimbursement:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesEntryReimbursement'
                    description: That the employee has been paid back for the trip. Absent until then.
                returnAt:
                    format: date-time
                    type: string
                revision:
                    description: What an update must carry to be allowed to save.
                    format: int32
                    type: integer
                status:
                    description: '''draft'', ''submitted'', ''approved'' or ''rejected''.'
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                totals:
                    description: The claim's figures, one line per currency, by currency code. Nothing is ever converted.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyTotal'
                    type: array
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - purpose
                - abroad
                - departureAt
                - returnAt
                - status
                - owner
                - lines
                - totals
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        ExpensesClaimSummary:
            description: 'One travel claim as a *unit* in a queue — the approval queue and the reimbursement list. It is the trip at a glance, with the figures whoever is deciding needs and nothing else: the lines themselves are one read away at GET /claims/{id}, which a queue of a hundred trips has no business carrying.'
            properties:
                capabilities:
                    $ref: '#/components/schemas/ExpensesClaimCapabilities'
                departureAt:
                    format: date-time
                    type: string
                destination:
                    type: string
                id:
                    format: int64
                    type: integer
                lineCount:
                    description: How many expenses the trip holds.
                    format: int32
                    type: integer
                overriddenRates:
                    description: How many of its lines carry a rate an approver has already replaced.
                    format: int32
                    type: integer
                project:
                    $ref: '#/components/schemas/ExpensesEntryProject'
                purpose:
                    type: string
                receiptsMissing:
                    description: How many of its lines are outlays with no receipt at all. Mileage and a per diem day never take one and are never counted.
                    format: int32
                    type: integer
                returnAt:
                    format: date-time
                    type: string
                totals:
                    description: The trip's figures, one line per currency, by currency code. Nothing is ever converted.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyTotal'
                    type: array
            required:
                - id
                - purpose
                - departureAt
                - returnAt
                - lineCount
                - totals
                - receiptsMissing
                - overriddenRates
                - capabilities
            type: object
        ExpensesClaimUpdateRequest:
            description: 'A full replace of a travel claim''s header, guarded by the revision it was read at. What is left out is cleared. Changing the project re-points every line onto it in the same transaction and clears a line''s billing line when it does not belong to the new project; clearing the project makes every line non-billable. A line that has already been invoiced holds the project where it is. The owner stays whoever the claim already concerns.'
            properties:
                abroad:
                    type: boolean
                abroadCurrency:
                    type: string
                abroadDayRate:
                    format: double
                    type: number
                departureAt:
                    format: date-time
                    type: string
                destination:
                    type: string
                projectId:
                    description: A project the claim already carries is kept even once it stops accepting new bookings; a different one is judged in full.
                    format: int32
                    type: integer
                purpose:
                    type: string
                returnAt:
                    format: date-time
                    type: string
                revision:
                    description: The revision the claim was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
            required:
                - purpose
                - departureAt
                - returnAt
                - revision
            type: object
        ExpensesCurrencyAmount:
            description: One currency's amount in a dashboard reading. Nothing is ever converted (design §4), so a caller owed money in two currencies gets two lines and never a sum that is in neither.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - currency
                - amount
            type: object
        ExpensesCurrencyTotal:
            description: One currency's figures inside a group of expenses — the approval queue's, and the reimbursement list's. Nothing is ever converted.
            properties:
                currency:
                    type: string
                gross:
                    description: The entries' gross amounts together.
                    format: double
                    type: number
                owedToEmployee:
                    description: What the person is owed back — the company's own outlays add nothing.
                    format: double
                    type: number
            required:
                - currency
                - gross
                - owedToEmployee
            type: object
        ExpensesEntryBilling:
            description: What an expense bills its customer (decision X7). Present only for a caller with financial rights on the entry's project — its managers, projects:manage-all, and projects:view-financials on a project they can see — and then always present, even with nothing in it, so a client can tell "may see, nothing billed" from "may not see". The entry's owner does not see it as such.
            properties:
                billAmount:
                    description: What the customer is billed; zero on a line nobody bills. It always follows the line as it now stands — a save that changes the net or the distance works it out again from the markup or the customer rate the line carries, in an installation with no projects module too, where those two are carried through untouched.
                    format: double
                    type: number
                billRatePerKm:
                    description: Billable mileage's rate per kilometre. Absent otherwise.
                    format: double
                    type: number
                invoice:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesEntryInvoice'
                    description: What the customer has been billed for this line (decision X5). Absent until somebody marks it invoiced. It sits inside billing on purpose — an invoice number is the project's business, not the employee's.
                markupPercent:
                    description: A billable outlay's markup on the net. Absent otherwise.
                    format: double
                    type: number
            required:
                - billAmount
            type: object
        ExpensesEntryBillingLine:
            description: The billing line an expense is booked on, resolved through the project directory. Absent when the entry is on none, or when the directory no longer lists it.
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
            required:
                - id
                - code
            type: object
        ExpensesEntryCapabilities:
            description: What the calling user may do with this entry, so a client never re-derives the rules of design §5.
            properties:
                canApprove:
                    description: Whether the caller may approve or reject it — an approver of it, while it is submitted.
                    type: boolean
                canDelete:
                    description: Whether the caller may delete it.
                    type: boolean
                canEdit:
                    description: Whether the caller may change it — its owner or expenses:manage, while it is a draft or rejected, and not before the period lock.
                    type: boolean
                canMarkInvoiced:
                    description: 'Whether the caller may mark it invoiced — financial rights on its project, while it is an approved billable line that carries an amount to bill and is not invoiced yet. The period lock does not hold it back: the lock protects what the employee submitted and what was approved, and invoicing is bookkeeping done after the period closes.'
                    type: boolean
                canMarkReimbursed:
                    description: 'Whether the caller may mark it reimbursed — expenses:manage, while it is approved, owes the employee something and has not been paid yet. The period lock does not hold it back: payroll runs after the books close, and only expenses:manage, whom the lock never held back, marks a reimbursement.'
                    type: boolean
                canOverrideRate:
                    description: Whether the caller may override the rate on it — an approver of it or expenses:manage, while it is a submitted mileage line.
                    type: boolean
                canSeeBilling:
                    description: Whether the billing object is in this copy of the entry.
                    type: boolean
                canSetBilling:
                    description: Whether the caller may price it from the project's side (PUT /entries/{id}/billing) — financial rights on its project, while it has not been invoiced. The period lock does not reach it.
                    type: boolean
                canSubmit:
                    description: Whether the caller may submit it — its owner or expenses:manage, while it is a draft or rejected, and not before the period lock.
                    type: boolean
                canUnapprove:
                    description: Whether the caller may return it to a draft — an approver of it or expenses:manage, while it is approved and has been neither reimbursed nor invoiced.
                    type: boolean
                canUndoInvoiced:
                    description: Whether the caller may take the invoicing back — financial rights on its project, while it stands invoiced.
                    type: boolean
                canUndoReimbursed:
                    description: Whether the caller may take the reimbursement back — expenses:manage, while it stands reimbursed.
                    type: boolean
            required:
                - canEdit
                - canDelete
                - canSubmit
                - canApprove
                - canUnapprove
                - canOverrideRate
                - canMarkInvoiced
                - canUndoInvoiced
                - canMarkReimbursed
                - canUndoReimbursed
                - canSeeBilling
                - canSetBilling
            type: object
        ExpensesEntryCategory:
            description: The category an outlay is booked under, with the name as it stands now. Absent on a mileage line, which carries none.
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        ExpensesEntryInvoice:
            description: That a billable line has been billed on to the customer, by whom and when, with the reference of the invoice it went out on.
            properties:
                at:
                    description: When it was marked invoiced.
                    format: date-time
                    type: string
                by:
                    $ref: '#/components/schemas/ExpensesUserRef'
                reference:
                    description: The invoice it went out on, as whoever marked it typed it. Absent when none was given.
                    maxLength: 100
                    type: string
            required:
                - at
                - by
            type: object
        ExpensesEntryDecision:
            description: 'What was decided about the expense, by whom and when — shown to everyone who may see it, its owner first of all: being told who rejected you is the point of a rejection. Present only while a decision stands; a submit and an unapprove both clear it.'
            properties:
                at:
                    format: date-time
                    type: string
                by:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesUserRef'
                    description: Who decided it. Absent only for a row carrying a decision and no decider, which no operation here can produce.
                reason:
                    description: Why it was rejected, as the approver wrote it. Absent on an approval.
                    type: string
                status:
                    description: '''approved'' or ''rejected'' — what was decided, which is the status the expense has been left in.'
                    type: string
            required:
                - status
                - at
            type: object
        ExpensesEntryOwner:
            description: The person the expense concerns — who gets the money back — which is not always who recorded it.
            properties:
                active:
                    description: Whether identity still has them as an active user.
                    type: boolean
                displayName:
                    description: Their display name; 'Unknown user' when the directory no longer knows them.
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        ExpensesEntryMealPercents:
            description: 'The meal deductions the per diem day was priced with, as they stood in the rate table on its own date. Each one is absent rather than zero when the table held no percentage for that meal and the meal was not covered anyway: a deduction of nothing and a deduction nobody has set are different facts. A meal that *was* covered on a date the table prices no deduction for is refused instead, so a misconfigured table can never quietly pay out the whole day.'
            properties:
                breakfast:
                    format: double
                    type: number
                dinner:
                    format: double
                    type: number
                lunch:
                    format: double
                    type: number
            type: object
        ExpensesEntryPerDiem:
            description: 'The per diem day one line is (design §4): which kind of day it was, which meals somebody else covered, and the dated figures it was priced from. The amount itself is the line''s own grossAmount — the day rate less each covered meal''s percentage of it, never below zero, rounded once.'
            properties:
                breakfastCovered:
                    type: boolean
                dayRate:
                    description: What a whole day of this kind was worth — the per_diem_* rate in force on the entry date, or the claim's own abroadDayRate on a trip abroad. It is the line's rate column, so an approver's override moves it and the amount with it.
                    format: double
                    type: number
                dinnerCovered:
                    type: boolean
                lunchCovered:
                    type: boolean
                mealPercents:
                    $ref: '#/components/schemas/ExpensesEntryMealPercents'
                type:
                    description: '''day_6_12'', ''day_over_12'', ''overnight_hotel'' or ''overnight_other''.'
                    type: string
            required:
                - type
                - breakfastCovered
                - lunchCovered
                - dinnerCovered
                - dayRate
                - mealPercents
            type: object
        ExpensesEntryProject:
            description: The project an expense is booked on, resolved through the project directory. Absent when the entry is on none, when this installation has no projects module (decision X2), or when the directory no longer knows the project — the stored id stays either way.
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
            type: object
        ExpensesEntryRateOverride:
            description: 'The record an overridden rate leaves on a mileage line or a per diem day (decision X8) — who replaced it, and what the line was priced at before they did. Present only while an override stands: a submit reprices the line and clears it, and an unapprove clears it with the rest of the decision it undoes. Shown to everyone who may see the expense, its owner included.'
            properties:
                byUser:
                    $ref: '#/components/schemas/ExpensesUserRef'
                passengerTableValue:
                    description: The passenger supplement per kilometre the line was frozen at before the first override of it. Absent when the supplement was never overridden, so a client can tell a changed supplement from an untouched one.
                    format: double
                    type: number
                tableValue:
                    description: 'The rate the line was priced at before the first override — a mileage line''s rate per kilometre, or a per diem day''s day rate. It usually came from the dated rate table, but on a per diem day of a claim abroad it is the claim''s own abroadDayRate, so this says "what it was priced at" rather than "what the table said". Absent when the line carried none.'
                    format: double
                    type: number
            required:
                - byUser
            type: object
        ExpensesEntryReimbursement:
            description: That the employee has been paid back for this expense (decision X5), by whom, when it was recorded, the day the money went and the payroll reference. Whoever may see the expense sees it — being told that you have been paid is not a privilege.
            properties:
                at:
                    description: When it was marked reimbursed.
                    format: date-time
                    type: string
                by:
                    $ref: '#/components/schemas/ExpensesUserRef'
                date:
                    description: The day the payroll run it went with was made. A calendar date, never in the future.
                    format: date
                    type: string
                reference:
                    description: 'The payroll run it went with, as whoever marked it typed it. Absent when none was given, and absent for a reader who is neither the expense''s owner nor a holder of expenses:view-all, expenses:approve or expenses:manage: that the money went is everyone''s business, which batch it went in is the payroll clerk''s. A project manager therefore reads the stamp without this field.'
                    maxLength: 100
                    type: string
            required:
                - at
                - by
                - date
            type: object
        ExpensesEntryRequest:
            description: 'One money line (design §3.1). The fields a kind does not carry are refused on their own field rather than ignored: an outlay carries a category, a payer, a currency and a gross amount with optional VAT; a mileage line carries a distance, optional places and passengers, and is priced by the server from the dated rate table; a per diem day carries a type and three covered-meal flags, and is priced the same way. claimId records it as a line of a travel claim instead of a standalone expense, which is the only place a per diem day exists.'
            properties:
                billRatePerKm:
                    description: 'What the customer is charged per kilometre on billable mileage. Only a caller with financial rights on the project — the ones who are sent the billing object — may name it; anyone else is refused on this field. Left out, a save keeps whatever the line already carries, and a line that carries none takes the mileage_customer rate in force on the entry date. When there is no such rate and the caller could not have named one, the line is saved billable with no customer rate and nothing billed, for whoever can see the project''s money to fill in. Refused on anything but billable mileage, and on a project that bills nothing.'
                    format: double
                    type: number
                billable:
                    description: Whether the line is billed on to the customer. Requires a project, and is forced false on a project that bills nothing. Refused on a per diem day, which is never billed on.
                    type: boolean
                billingLineId:
                    description: An active billing line of the same project. Refused on a per diem day.
                    format: int32
                    type: integer
                breakfastCovered:
                    description: Whether somebody else paid for that day's breakfast, which deducts the meal_breakfast_percent rate in force on the entry date. Per diem only; absent means false.
                    type: boolean
                categoryId:
                    description: Required on an outlay, and must be an active category. Refused on a mileage line and on a per diem day.
                    format: int32
                    type: integer
                claimId:
                    description: 'The travel claim this expense is a line of. The caller must be allowed to change that claim, and it must still be a draft or rejected; the line takes the claim''s owner and its project, so userId naming somebody else and projectId naming another project are both refused. A per diem day is refused without one: it belongs to a travel claim and exists nowhere else.'
                    format: int64
                    type: integer
                currency:
                    description: A three-letter ISO 4217 code. Required on an outlay. A mileage line takes the installation's default currency and refuses any other; a per diem day refuses it outright and takes the installation's currency, or the claim's own abroadCurrency on a trip abroad.
                    type: string
                description:
                    description: 1 to 500 characters. Required on an outlay and on a mileage line. A per diem day may be left without one and then carries the empty string — what the day *is* is its perDiemType, and a name the server invented would sit in the column in one language for ever, so the client renders the label instead.
                    type: string
                dinnerCovered:
                    description: Whether somebody else paid for that day's dinner, which deducts the meal_dinner_percent rate in force on the entry date. Per diem only; absent means false.
                    type: boolean
                distanceKm:
                    description: Mileage's distance — greater than zero, at most 9999.9, at most one decimal. Refused on an outlay and on a per diem day.
                    format: double
                    type: number
                entryDate:
                    description: The day the money was spent or the distance driven. Nothing before the period lock may be recorded except by expenses:manage. On a per diem day it is the day of the trip, which must fall between the claim's departure day and its return day, and no two per diem days of one claim may share it.
                    format: date
                    type: string
                fromPlace:
                    description: At most 200 characters. Mileage only.
                    type: string
                grossAmount:
                    description: An outlay's amount including VAT — greater than zero, at most 9999999999.99, at most two decimals. Refused on a mileage line and on a per diem day, whose amounts the server computes.
                    format: double
                    type: number
                kind:
                    description: '''outlay'', ''mileage'' or ''per_diem''. A per diem day exists only inside a travel claim, so it is refused without a claimId.'
                    type: string
                lunchCovered:
                    description: Whether somebody else paid for that day's lunch, which deducts the meal_lunch_percent rate in force on the entry date. Per diem only; absent means false.
                    type: boolean
                markupPercent:
                    description: 'A billable outlay''s markup on the net, 0 to 1000 with at most two decimals. Only a caller with financial rights on the project — the ones who are sent the billing object — may name it; anyone else is refused on this field. Left out, a save keeps whatever the line already carries, and a line that carries none takes the settings'' default. Refused on anything but a billable outlay.'
                    format: double
                    type: number
                paidBy:
                    description: '''employee'' or ''company''. Required on an outlay, refused on a mileage line and on a per diem day — both are always owed to the employee.'
                    type: string
                passengers:
                    description: 0 to 8. Mileage only; each one adds the passenger supplement per kilometre.
                    format: int32
                    type: integer
                perDiemType:
                    description: '''day_6_12'', ''day_over_12'', ''overnight_hotel'' or ''overnight_other''. Required on a per diem day and refused on every other kind. It names the per_diem_* rate the day is priced at; a type with no rate in force on the entry date is refused on this field, which is what a day of type overnight_other gets until an administrator enters the company''s own rate for it. On a claim abroad the day rate is the claim''s own abroadDayRate and the type is recorded rather than priced from.'
                    type: string
                projectId:
                    description: The project to book the expense on. The person it concerns must be allowed to book on it — what logging time needs. Refused when this installation has no projects module.
                    format: int32
                    type: integer
                supplier:
                    description: At most 200 characters. Outlays only.
                    type: string
                toPlace:
                    description: At most 200 characters. Mileage only.
                    type: string
                userId:
                    description: The person the expense concerns. Absent means the caller; naming somebody else needs expenses:manage, and they must be a user identity still has as active.
                    format: uuid
                    type: string
                vatAmount:
                    description: An outlay's VAT, from zero to its gross. Refused on a mileage line and on a per diem day, neither of which carries VAT.
                    format: double
                    type: number
            required:
                - kind
                - entryDate
            type: object
        ExpensesEntryResponse:
            description: One expense as the caller may see it (design §5). What the caller may not see is absent rather than null or zero — above all the billing object, which needs financial rights on the entry's project.
            properties:
                attachmentCount:
                    description: How many receipts the entry carries — the length of attachments, kept as its own field so a client can show the count without reading the list.
                    format: int32
                    type: integer
                attachments:
                    description: 'The entry''s receipts, oldest first. Always present, empty when it carries none, on a single read and in a list alike: the count and the list never disagree.'
                    items:
                        $ref: '#/components/schemas/ExpensesAttachmentResponse'
                    type: array
                billable:
                    type: boolean
                billing:
                    $ref: '#/components/schemas/ExpensesEntryBilling'
                billingLine:
                    $ref: '#/components/schemas/ExpensesEntryBillingLine'
                capabilities:
                    $ref: '#/components/schemas/ExpensesEntryCapabilities'
                category:
                    $ref: '#/components/schemas/ExpensesEntryCategory'
                claimId:
                    description: 'The travel claim this expense is a line of. Absent on a standalone expense. A line''s status, its decision and its reimbursement are the claim''s, not its own: they are rendered here from the claim, and the flow operations refuse a line by id and point at the claim.'
                    format: int64
                    type: integer
                createdAt:
                    format: date-time
                    type: string
                currency:
                    type: string
                decision:
                    $ref: '#/components/schemas/ExpensesEntryDecision'
                description:
                    type: string
                distanceKm:
                    description: Mileage's distance. Absent on an outlay.
                    format: double
                    type: number
                entryDate:
                    format: date
                    type: string
                fromPlace:
                    type: string
                grossAmount:
                    description: An outlay's amount as entered, VAT included; a mileage line's or a per diem day's computed amount.
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                netAmount:
                    description: The gross less the VAT — the project's cost and the markup's base.
                    format: double
                    type: number
                owedToEmployee:
                    description: What the owner gets back — the gross of an outlay they paid, a mileage line's amount, a per diem day's amount, and nothing at all for an outlay the company paid.
                    format: double
                    type: number
                owner:
                    $ref: '#/components/schemas/ExpensesEntryOwner'
                paidBy:
                    type: string
                passengerRate:
                    description: The passenger supplement per kilometre the line was priced with. Absent when it carries no passengers.
                    format: double
                    type: number
                passengers:
                    format: int32
                    type: integer
                perDiem:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesEntryPerDiem'
                    description: The per diem day this line is. Absent on every other kind.
                project:
                    $ref: '#/components/schemas/ExpensesEntryProject'
                rate:
                    description: The reimbursement rate per kilometre the line was priced with, or a per diem day's own day rate. Absent on an outlay.
                    format: double
                    type: number
                rateOverride:
                    $ref: '#/components/schemas/ExpensesEntryRateOverride'
                reimbursement:
                    allOf:
                        - $ref: '#/components/schemas/ExpensesEntryReimbursement'
                    description: That the employee has been paid back for it. Absent until then.
                revision:
                    description: What an update must carry to be allowed to save.
                    format: int32
                    type: integer
                status:
                    description: '''draft'', ''submitted'', ''approved'' or ''rejected''.'
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                supplier:
                    type: string
                toPlace:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                vatAmount:
                    description: Absent when none was entered, rather than zero.
                    format: double
                    type: number
            required:
                - id
                - kind
                - entryDate
                - description
                - currency
                - grossAmount
                - netAmount
                - owedToEmployee
                - billable
                - status
                - attachmentCount
                - attachments
                - owner
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
        ExpensesEntryUpdateRequest:
            description: 'A full replace of an expense, held to every rule a create is held to, and guarded by the revision the entry was read at. What is left out is cleared — with three deliberate exceptions, because a replace only replaces what its caller can see: the markup and the customer rate per kilometre are kept unless the caller has financial rights on the project and sends one, the project a line already carries is not judged for bookability again, and in an installation with no projects module the stored project link, markup, customer rate and bill amount are carried through untouched. The owner stays whoever the entry already concerns.'
            properties:
                billRatePerKm:
                    description: 'See the create request: only a caller with financial rights on the project may name it, and leaving it out keeps what the line already carries.'
                    format: double
                    type: number
                billable:
                    type: boolean
                billingLineId:
                    format: int32
                    type: integer
                breakfastCovered:
                    description: 'See the create request: per diem only, absent means false.'
                    type: boolean
                categoryId:
                    format: int32
                    type: integer
                claimId:
                    description: 'The travel claim the expense is already a line of. It must be exactly the one it carries, or absent: a standalone expense cannot be moved into a claim, and a claim''s line cannot be moved out of one or into another.'
                    format: int64
                    type: integer
                currency:
                    type: string
                description:
                    description: 'See the create request: required on an outlay and on a mileage line, and the empty string on a per diem day that leaves it out.'
                    type: string
                dinnerCovered:
                    description: 'See the create request: per diem only, absent means false.'
                    type: boolean
                distanceKm:
                    format: double
                    type: number
                entryDate:
                    description: Neither the day the entry had nor the day it is given may fall before the period lock, except for expenses:manage.
                    format: date
                    type: string
                fromPlace:
                    type: string
                grossAmount:
                    format: double
                    type: number
                kind:
                    description: 'Changing an outlay that still carries receipts into a line of another kind is refused on this field: a receipt belongs to an outlay, so the change would leave them where nothing can reach them. Remove them first.'
                    type: string
                lunchCovered:
                    description: 'See the create request: per diem only, absent means false.'
                    type: boolean
                markupPercent:
                    description: 'See the create request: only a caller with financial rights on the project may name it, and leaving it out keeps what the line already carries.'
                    format: double
                    type: number
                paidBy:
                    type: string
                passengers:
                    format: int32
                    type: integer
                perDiemType:
                    description: 'See the create request: required on a per diem day and refused on every other kind.'
                    type: string
                projectId:
                    description: A project the line already carries is kept even once it stops accepting new bookings; a different one is judged in full.
                    format: int32
                    type: integer
                revision:
                    description: The revision the entry was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
                supplier:
                    type: string
                toPlace:
                    type: string
                vatAmount:
                    format: double
                    type: number
            required:
                - kind
                - entryDate
                - revision
            type: object
        ExpensesFlowRequest:
            description: 'The units to move through the flow (decision X4): standalone expenses, travel claims, or both in one batch. All or nothing — one unit that may not be moved refuses the whole request, with a message per offending id on the list that named it, and nothing changes. At least one id between the two lists is required. At most 500 distinct *units* across both; an id given twice is one unit, so the cap is counted after the duplicates are collapsed.'
            properties:
                claimIds:
                    description: The travel claims to move. A claim moves as one unit — its lines go with it and are never named on their own — so an entryIds naming one of a claim's lines is refused and points at the claim.
                    items:
                        format: int64
                        type: integer
                    type: array
                entryIds:
                    description: The standalone expenses to move. An id that belongs to a travel claim is refused with a message naming the claim.
                    items:
                        format: int64
                        type: integer
                    type: array
            type: object
        ExpensesFlowResponse:
            description: What one batch moved. The two lists are separate because the two units are — a claim is not an expense, and a client that ticked both gets each back in the shape it reads it in — and each holds its own ids in the order they were given.
            properties:
                claims:
                    description: The travel claims that moved, in the order their ids were given.
                    items:
                        $ref: '#/components/schemas/ExpensesClaimListResponse'
                    type: array
                entries:
                    description: The standalone expenses that moved, in the order their ids were given.
                    items:
                        $ref: '#/components/schemas/ExpensesEntryResponse'
                    type: array
            required:
                - entries
                - claims
            type: object
        ExpensesInvoicedRequest:
            description: Marks one approved, billable line as billed on to the customer (decision X5). The caller needs financial rights on the line's project; the period lock does not hold it back, because invoicing is bookkeeping done after the period closes.
            properties:
                reference:
                    description: The invoice it went out on. Optional, at most 100 characters once trimmed.
                    maxLength: 100
                    type: string
                revision:
                    description: The revision the entry was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
            required:
                - revision
            type: object
        ExpensesInvoicedUndoRequest:
            description: Takes the invoicing back off one line, under exactly the rights that set it.
            properties:
                revision:
                    description: The revision the entry was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
            required:
                - revision
            type: object
        ExpensesMetaCapabilities:
            description: What the calling user may do in this module, so the frontend never re-derives the rules.
            properties:
                canApprove:
                    description: Whether the caller holds expenses:approve.
                    type: boolean
                canManage:
                    description: Whether the caller holds expenses:manage — settings, rates, categories, recording for a colleague, reimbursements and working past the period lock.
                    type: boolean
                canViewAll:
                    description: Whether the caller holds expenses:view-all.
                    type: boolean
            required:
                - canApprove
                - canViewAll
                - canManage
            type: object
        ExpensesMetaResponse:
            description: What the Expenses app needs before it can draw anything — above all whether this installation has projects at all (decision X2). Without projects there is no project field, billing line, billable flag or markup anywhere, and every request carrying one is refused on that field.
            properties:
                capabilities:
                    $ref: '#/components/schemas/ExpensesMetaCapabilities'
                categories:
                    description: Every category, active first is not assumed — they come in position order, then by name, inactive ones included so a stored expense can still name its own.
                    items:
                        $ref: '#/components/schemas/ExpensesCategoryResponse'
                    type: array
                defaultCurrency:
                    description: The currency a new expense starts in.
                    type: string
                defaultMarkupPercent:
                    description: The markup a new billable outlay starts with. Present only for expenses:manage, as on GET /settings — the server applies the default itself, so no form needs the number.
                    format: double
                    type: number
                lockedBefore:
                    description: The period lock — nothing dated before it may be touched except by expenses:manage. Absent when no lock is set.
                    format: date
                    type: string
                projectsAvailable:
                    description: Whether the projects module is enabled in this installation (decision X2).
                    type: boolean
                receiptRequiredOver:
                    description: An employee-paid outlay above this gross amount cannot be submitted without a receipt. Zero means every one of them needs a receipt. Absent when the rule is off.
                    format: double
                    type: number
                timeZone:
                    description: 'The installation''s business time zone, an IANA name (''Europe/Oslo'' by default): the zone every date derived from a travel claim''s departure and return instants is taken in. A form labelling a trip''s days has to label them in it rather than in the browser''s, or it will disagree with the server about which day a save lands on. The same value GET /settings answers, here because meta is the one read an expense form makes.'
                    type: string
            required:
                - projectsAvailable
                - defaultCurrency
                - timeZone
                - categories
                - capabilities
            type: object
        ExpensesPerDiemSuggestedDay:
            description: 'One day the server proposes for a trip. It is a suggestion and nothing more: nothing is written, and the client records whichever of them the traveller agrees with as ordinary per diem lines. A trip may run 366 days while a claim holds at most 200 expenses, so a client offering "record them all" has to reckon with the cap itself — the 201st create is refused on claimId and says nothing about the suggestion.'
            properties:
                amount:
                    description: What that day would come to with no meal covered — the day rate, rounded once. Absent with the rate, for the same reason.
                    format: double
                    type: number
                dayRate:
                    description: The per_diem_* rate in force on that date for that type, or the claim's own abroadDayRate on a trip abroad. Absent when the table prices no such day — which is what a day of type overnight_other gets until an administrator enters the company's own rate for it.
                    format: double
                    type: number
                entryDate:
                    description: The day the period starts, as a calendar day in UTC.
                    format: date
                    type: string
                exists:
                    description: Whether the claim already holds a per diem line on that date. The suggestion is answered either way — what to do about a day already recorded is the client's decision, not the server's — and this is what lets it say so without a second read.
                    type: boolean
                perDiemType:
                    description: '''day_6_12'', ''day_over_12'', ''overnight_hotel'' or ''overnight_other''.'
                    type: string
            required:
                - entryDate
                - perDiemType
                - exists
            type: object
        ExpensesPerDiemSuggestionRequest:
            description: 'What the trip''s times cannot say. Whether the traveller slept away is a fact only they know, and it decides whether the trip is counted in 24-hour periods from the departure or as a single day.'
            properties:
                overnight:
                    description: Whether the traveller stayed the night away from home.
                    type: boolean
            required:
                - overnight
            type: object
        ExpensesProjectOption:
            description: One project the caller may book an expense on, with the billing lines they may book it against — so the expense form needs no code of the projects module's own.
            properties:
                billingLines:
                    description: The project's active billing lines, by code. Empty when it has none.
                    items:
                        $ref: '#/components/schemas/ExpensesProjectOptionBillingLine'
                    type: array
                code:
                    type: string
                currency:
                    description: The project's own currency, when it has one.
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
                - billingLines
            type: object
        ExpensesProjectOptionBillingLine:
            description: One billing line of a project an expense may be booked against.
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
            required:
                - id
                - code
            type: object
        ExpensesRateOverrideRequest:
            description: A replacement rate for one submitted mileage line or per diem day (decision X8). It reprices the line's amount and nothing else — the customer's own rate per kilometre is untouched — and records who set it and what the rate table had said.
            properties:
                passengerRate:
                    description: The passenger supplement per kilometre, 0 or more with at most two decimals. Only on a mileage line that carries passengers; left out, the line keeps the supplement it was frozen with. Refused on a per diem day, which carries no supplement.
                    format: double
                    type: number
                rate:
                    description: The reimbursement rate per kilometre, or a per diem day's day rate — greater than zero, at most two decimals. On a per diem day the amount is worked out again from it and the meal percentages the line was saved with, so an approver correcting the day rate does not lose the deductions.
                    format: double
                    type: number
                revision:
                    description: The revision the expense was read at. A revision that has moved on is a 409.
                    format: int32
                    type: integer
            required:
                - rate
                - revision
            type: object
        ExpensesRateRequest:
            description: A new dated rate (design §3.4). A money kind carries a currency and a value greater than zero with at most two decimals; a percentage kind carries no currency and a value between 0 and 100. One row per kind and valid-from day.
            properties:
                currency:
                    description: A three-letter ISO 4217 code. Required for the money kinds, refused for the percentage kinds.
                    type: string
                kind:
                    description: 'One of: mileage, mileage_passenger, mileage_customer, per_diem_6_12, per_diem_over_12, per_diem_overnight_hotel, per_diem_overnight_other, meal_breakfast_percent, meal_lunch_percent, meal_dinner_percent.'
                    type: string
                source:
                    description: Where the rate comes from, for display — "State rate" on a seeded row. Absent means the company's own.
                    type: string
                validFrom:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            required:
                - kind
                - validFrom
                - value
            type: object
        ExpensesRateResetRequest:
            description: The rate kind to restore. Every row of that kind the product shipped is written back exactly as it shipped — restored when it was removed, and put back to its shipped value, currency and label when it was edited. The company's own rows, on their own days, are untouched, and nothing is removed.
            properties:
                kind:
                    type: string
            required:
                - kind
            type: object
        ExpensesRateResponse:
            description: One dated rate. The rate in force on a date is the row of that kind with the greatest validFrom on or before it.
            properties:
                currency:
                    description: The money kinds' three-letter ISO 4217 code. Absent on the percentage kinds.
                    type: string
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                source:
                    description: Where the rate comes from, for display. Absent means the company's own.
                    type: string
                validFrom:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            required:
                - id
                - kind
                - validFrom
                - value
            type: object
        ExpensesRateUpdateRequest:
            description: A full replace of a rate row's day, value, currency and source. The kind stays the row's own.
            properties:
                currency:
                    type: string
                source:
                    type: string
                validFrom:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            required:
                - validFrom
                - value
            type: object
        ExpensesReimbursedRequest:
            description: 'The units one payroll run pays for (decision X5): standalone expenses, travel claims, or both. All or nothing, exactly as the flow''s batches are — one unit that may not be paid refuses the whole request with a message per offending id on the list that named it, and nothing is stamped. At least one id between the two lists is required, and at most 500 distinct units across both.'
            properties:
                claimIds:
                    description: The travel claims to pay. A trip is paid as one unit, for the sum of what its lines owe its owner; a claim that owes nothing cannot be marked.
                    items:
                        format: int64
                        type: integer
                    type: array
                date:
                    description: The day the payroll run was made. A calendar date, today or earlier — never a date somebody means to pay on.
                    format: date
                    type: string
                entryIds:
                    description: The standalone expenses to pay. An id that belongs to a travel claim is refused with a message naming the claim.
                    items:
                        format: int64
                        type: integer
                    type: array
                reference:
                    description: The payroll run, for whoever has to find it again. Optional, at most 100 characters once trimmed.
                    maxLength: 100
                    type: string
            required:
                - date
            type: object
        ExpensesReimbursementGroup:
            description: 'One person''s approved units that are owed back to them, with the figures a payroll run is made from. A unit is a standalone expense or a whole travel claim, so the group holds two lists: a trip is paid as one.'
            properties:
                claims:
                    description: The person's approved travel claims that owe them something, the earliest departure first. Each is one unit of the payroll run.
                    items:
                        $ref: '#/components/schemas/ExpensesClaimSummary'
                    type: array
                entries:
                    description: The person's standalone expenses, oldest day first and then as recorded. Shaped exactly as a single read of each would be for this caller. A travel claim's lines are never here — the claim is the unit.
                    items:
                        $ref: '#/components/schemas/ExpensesEntryResponse'
                    type: array
                totals:
                    description: The group's figures, one line per currency, by currency code — the standalone expenses and the claims' lines together. Nothing is ever converted.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyTotal'
                    type: array
                user:
                    $ref: '#/components/schemas/ExpensesUserRef'
            required:
                - user
                - entries
                - claims
                - totals
            type: object
        ExpensesRejectRequest:
            description: The units to reject and why, under exactly the rules an approval follows. The reason is shown to their owner, who may then edit and submit again. At least one id between the two lists is required, and at most 500 distinct units across both.
            properties:
                claimIds:
                    description: The travel claims to reject. The reason is stamped on the claim, which its owner edits and submits afresh.
                    items:
                        format: int64
                        type: integer
                    type: array
                entryIds:
                    description: The standalone expenses to reject. An id that belongs to a travel claim is refused with a message naming the claim.
                    items:
                        format: int64
                        type: integer
                    type: array
                reason:
                    description: Why they are rejected. Required; 1 to 1000 characters once trimmed.
                    type: string
            required:
                - reason
            type: object
        ExpensesSettingsRequest:
            description: A full replace of the installation's expense settings. Leaving lockedBefore or receiptRequiredOver out — or sending null — clears it.
            properties:
                defaultCurrency:
                    description: A three-letter ISO 4217 code.
                    type: string
                defaultMarkupPercent:
                    description: 0 to 1000, at most two decimals.
                    format: double
                    type: number
                lockedBefore:
                    format: date
                    type: string
                receiptRequiredOver:
                    description: Zero or greater, at most two decimals. Zero means every employee-paid outlay needs a receipt; leaving it out turns the rule off.
                    format: double
                    type: number
                timeZone:
                    description: 'The installation''s own business time zone, as an IANA name (''Europe/Oslo''). It is what every date derived from a travel claim''s two instants is taken in — the day the period lock judges, the day GET /claims'' from/to filter matches, the days a per diem line may fall on and the days the suggestion proposes — because a claim stores instants and the company''s own calendar is what a period lock and a payroll month mean. A name neither Go nor Postgres knows is refused on this field. Leaving it out keeps the zone the installation already has.'
                    maxLength: 64
                    type: string
            required:
                - defaultCurrency
                - defaultMarkupPercent
            type: object
        ExpensesSettingsResponse:
            description: The installation's expense settings (design §3.5). Every expenses:access holder may read them — the lock and the receipt rule decide what they may record — and expenses:manage changes them.
            properties:
                defaultCurrency:
                    type: string
                defaultMarkupPercent:
                    description: 'The markup a new billable outlay starts with. Present only for expenses:manage — what the company adds to a supplier cost before invoicing it on is a commercial figure (design §5). No form needs it: the server applies the default itself when a billable outlay names no markup.'
                    format: double
                    type: number
                lockedBefore:
                    description: Absent when no lock is set.
                    format: date
                    type: string
                receiptRequiredOver:
                    description: An employee-paid outlay above this gross amount cannot be submitted without a receipt. Zero means every one of them needs a receipt. Absent when the rule is off.
                    format: double
                    type: number
                timeZone:
                    description: 'The installation''s own business time zone, an IANA name. Every date derived from a travel claim''s two instants is the calendar day of that instant here: the day the period lock judges, the day GET /claims'' from/to filter matches, the days a per diem line may fall on and the days the suggestion proposes. A client showing a trip''s days labels them in this zone and not in the browser''s, or it will disagree with the server about which day a save lands on. Read by every expenses:access holder.'
                    type: string
            required:
                - defaultCurrency
                - timeZone
            type: object
        ExpensesStatsAttentionItem:
            description: |-
                One thing the dashboard wants a human to look at. The shape is the dashboard's, shared by every module's /stats/attention, and the host translates the sentence from `type` — the title is only the name of the thing.

                Three types, each with its own recipients, and each counted in *units* — a standalone expense or a whole travel claim. `approvalWaiting`: one per person with submitted units the caller may approve; entityId and id are that person's user id, title is their display name, occurredAt is the oldest of their submissions and count is how many units are waiting. `expenseRejected`: one of the caller's own units that was sent back; for an expense entityId and id are the expense id and title is its description, for a travel claim they are 'claim/<id>' and title is the trip's purpose, and occurredAt is when it was decided, newest first and at most twenty of them. `reimbursementWaiting`: for holders of expenses:manage, a single item when anything at all is waiting to be paid; entityId and id are the literal string 'reimbursements', because the payroll list is what it links to rather than any one unit, occurredAt is the oldest approval among them and count is how many units.
            properties:
                count:
                    description: How many things the item stands for, when it stands for more than one. Absent on an item that is about a single expense. It is here because a count inside a server-written title could never be translated.
                    format: int32
                    type: integer
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ExpensesStatsDailyBucket:
            description: One UTC calendar day of a time series. Days with nothing in them are absent, not zero — the dashboard's sparkline plots the points it is given.
            properties:
                date:
                    format: date
                    type: string
                value:
                    description: The net amount approved that day, in the installation's default currency.
                    format: double
                    type: number
            type: object
        ExpensesStatsResponse:
            description: The caller's own key figures, for the strip above their expense list. Every status is always present, 0 included.
            properties:
                approved:
                    format: int32
                    type: integer
                awaitingMyApproval:
                    description: How many submitted expenses the caller may approve — the approval queue's own scope, counted in expenses; 0 for a caller who approves nothing.
                    format: int32
                    type: integer
                draft:
                    format: int32
                    type: integer
                rejected:
                    format: int32
                    type: integer
                submitted:
                    format: int32
                    type: integer
                unreimbursed:
                    description: What the caller is still owed — their own approved expenses that owe them something and have not been paid — one line per currency. Empty when there is nothing.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyAmount'
                    type: array
            required:
                - draft
                - submitted
                - approved
                - rejected
                - unreimbursed
                - awaitingMyApproval
            type: object
        ExpensesStatsSummaryResponse:
            description: The dashboard's expenses card over one period, in the envelope every module's /stats/summary shares. Only awaitingMyApproval moves with the period; the other two are a state now, and neither can have a delta — a draft count cannot be reconstructed for a past moment, because a rejected expense becomes a draft again, and a currency-mixed amount would have no meaning as one.
            properties:
                awaitingMyApproval:
                    description: How many submitted expenses the caller may approve; 0 for a caller who approves nothing.
                    format: int32
                    type: integer
                awaitingMyApprovalDelta:
                    description: awaitingMyApproval against how many of the same expenses were already waiting when the period began — reconstructed from the expenses' submission and decision times, so one since unapproved or edited back to draft no longer counts in it.
                    format: int32
                    type: integer
                from:
                    format: date-time
                    type: string
                myDrafts:
                    description: How many of the caller's own expenses are still drafts.
                    format: int32
                    type: integer
                myUnreimbursed:
                    description: What the caller is still owed, one line per currency. Empty when there is nothing.
                    items:
                        $ref: '#/components/schemas/ExpensesCurrencyAmount'
                    type: array
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - awaitingMyApproval
                - awaitingMyApprovalDelta
                - myDrafts
                - myUnreimbursed
            type: object
        ExpensesUserRef:
            description: One person, named through identity — an expense's owner, the owner of an approval or reimbursement group, whoever overrode a rate, whoever decided the expense, whoever paid it back, or whoever invoiced it.
            properties:
                active:
                    description: Whether identity still has them as an active user.
                    type: boolean
                displayName:
                    description: Their display name; 'Unknown user' when the directory no longer knows them.
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        PaginatedResponseOfExpensesApprovalGroup:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ExpensesApprovalGroup'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfExpensesClaimListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ExpensesClaimListResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfExpensesEntryResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ExpensesEntryResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfExpensesReimbursementGroup:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ExpensesReimbursementGroup'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
info:
    title: Vantigo Expenses API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/expenses/approvals:
        get:
            description: 'The approval queue — the submitted *units* the caller may approve (every one of them for expenses:approve, the ones on the projects they manage otherwise, and not those dated before the period lock unless they hold expenses:manage, whose approval the lock would refuse anyway) — grouped per person, the person who has been waiting longest first, and paged by person, so a page always holds whole groups. A unit is a standalone expense or a whole travel claim: each group carries its entries and its claims separately, and a claim''s lines are never listed as loose expenses.'
            operationId: getExpensesApprovals
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfExpensesApprovalGroup'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller holds neither expenses:approve nor the manager role on any project, so there is nothing they could ever approve.
            summary: Get the approval queue
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/approve:
        post:
            description: 'Approves submitted units — standalone expenses, travel claims, or both in one batch (decision X4) — recording who decided and when. Each must be submitted, each must be one the caller approves for (expenses:approve for anything, or the manager role on its project; a claim is judged on the claim''s own project), and none may be dated before the period lock unless the caller holds expenses:manage — a claim on the day it departed. The frozen amounts are not touched: an approval agrees with them.'
            operationId: postExpensesApprove
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesFlowRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesFlowResponse'
                    description: OK — the approved expenses, each list in the order its own ids were given.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — no ids at all, more than 500 distinct units, or at least one unit that may not be approved; the errors on entryIds and on claimIds name each offending id under the list that named it (a unit the caller may not see reads as not found), and nothing was approved.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller approves nothing at all; they hold neither expenses:approve nor the manager role on any project.
            summary: Approve expenses
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/attachments/{id}:
        delete:
            description: 'Removes a receipt while its expense is still its owner''s to change — a draft or a rejected line, by its owner or by expenses:manage, and not before the period lock. The stored object goes with the row. The two refusals are told apart as they are everywhere else here: who is asking is a 403, what the expense is right now is a 400 naming the reason.'
            operationId: deleteExpensesAttachmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on entryId, because the expense the receipt is on has moved past being editable or is dated before the period lock.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the expense is not the caller's to change; they are neither its owner nor a holder of expenses:manage.
                "404":
                    description: Not Found — no receipt has that id, or the caller may not see the expense it is on.
            summary: Delete a receipt
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        get:
            description: 'Streams a receipt''s bytes with the type they were stored under, named as they were uploaded (RFC 5987), never cached and never sniffed. Visibility is the expense''s own: anyone who may not see it gets the same bare 404 an unknown id gets.'
            operationId: getExpensesAttachmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        '*/*':
                            schema:
                                format: binary
                                type: string
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no receipt has that id, or the caller may not see the expense it is on.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Service Unavailable — the receipt store could not be read.
            summary: Download a receipt
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/categories:
        get:
            description: Every expense category in its own order, inactive ones included so a stored expense can still name its own. Positions are a dense 1..n that the server keeps, so this order is the positions themselves.
            operationId: getExpensesCategories
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ExpensesCategoryResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List expense categories
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        post:
            description: Adds an expense category. With no position it goes last; with one it is inserted at that place and the rest of the list is renumbered around it.
            operationId: postExpensesCategories
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesCategoryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesCategoryResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — including a name another category already has, however it is cased.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Add an expense category
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/categories/{id}:
        put:
            description: 'Replaces a category''s name, whether it may be chosen, and where it sits. A category is never deleted — one that is no longer wanted is deactivated, so the expenses booked on it keep their name. Moving one is this operation: send the place it should take and the server takes it out of the list, puts it back there and renumbers every category 1..n, so a move always moves. A request that repeats the place the category already holds reorders nothing.'
            operationId: putExpensesCategoriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesCategoryUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesCategoryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — including a name another category already has, however it is cased.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no category has that id.
            summary: Change an expense category
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/claims:
        get:
            description: Travel claims, the most recent trip first, and only where the caller may see them — their own, everything on a project they manage, and everyone's for expenses:view-all, expenses:approve and expenses:manage. The same rule a single read applies, so the list never holds a claim its own read would answer 404 for.
            operationId: getExpensesClaims
            parameters:
                - description: 'Narrows the list to one person''s claims. It never widens it: a caller sees only what they may see anyway.'
                  in: query
                  name: userId
                  schema:
                    format: uuid
                    type: string
                - description: '''draft'', ''submitted'', ''approved'' or ''rejected''.'
                  in: query
                  name: status
                  schema:
                    type: string
                - description: The earliest departure day to include, judged in UTC.
                  in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - description: The latest departure day to include, judged in UTC.
                  in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - description: Narrows the list to what has been reimbursed, or to what has not. Left out, both are in it.
                  in: query
                  name: reimbursed
                  schema:
                    type: boolean
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfExpensesClaimListResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, or an unknown status.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List travel claims
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        post:
            description: Records one travel claim as a draft with no lines. Expenses are added to it afterwards, with POST /entries carrying its claimId.
            operationId: postExpensesClaims
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesClaimRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesClaimResponse'
                    description: Created — a draft owned by the caller, or by the person userId names.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Record a travel claim
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/claims/{id}:
        delete:
            description: 'Deletes a travel claim while it is still its owner''s to change — a draft or a rejected one, by its owner or by expenses:manage, and not before the period lock. Its lines go with it, and their receipts with them. The two refusals are told apart on purpose: who is asking is a 403, what the claim is right now is a 400 naming the reason.'
            operationId: deleteExpensesClaimsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the claim has moved past being editable (on status) or departed before the period lock (on departureAt).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the claim is not the caller's to change; they are neither its owner nor a holder of expenses:manage.
                "404":
                    description: Not Found — no claim has that id, or the caller may not see it.
            summary: Delete a travel claim
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        get:
            description: One travel claim with its lines, shaped for the caller. A claim the caller may not see answers the same bare 404 an unknown id does.
            operationId: getExpensesClaimsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesClaimResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no claim has that id, or the caller may not see it.
            summary: Get a travel claim by id
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        put:
            description: 'Replaces a travel claim''s header, guarded by the revision it was read at. Changing its project re-points every line in the same transaction. The trip''s own fields answer for the per diem days it already holds, in that same transaction: narrowing departureAt or returnAt past a day already recorded is refused naming the stranded dates — a day somebody recorded is theirs to remove — and changing abroad, abroadDayRate or abroadCurrency reprices every per diem day of the claim, refusing the whole edit if one of them could no longer be priced at all.'
            operationId: putExpensesClaimsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesClaimUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesClaimResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, the claim has moved past being editable (on status) or departed before the period lock (on departureAt), a new trip window would leave a per diem day outside it (on departureAt or returnAt), or a change to what the trip pays would leave one unpriced (on abroad, abroadDayRate or abroadCurrency).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the claim is not the caller's to change; they are neither its owner nor a holder of expenses:manage.
                "404":
                    description: Not Found — no claim has that id, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the claim has moved on from the revision supplied.
            summary: Change a travel claim
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/claims/{id}/per-diem-suggestion:
        post:
            description: 'The per diem days a trip would have, worked out from its departure and its return (design §4). It writes nothing: the client shows the days and records whichever ones the traveller agrees with as ordinary per diem lines. A trip under six hours suggests none. Without an overnight it is one day — day_6_12 up to and including twelve hours, day_over_12 beyond — dated on the departure day. With one it is one overnight_hotel line per full 24-hour period from the departure, plus one more when what is left over is strictly longer than six hours — and never fewer than one, so any overnight trip from six hours up is a day. Each is dated on the day its own period starts. The six hours is therefore inclusive as the threshold a whole trip has to clear and exclusive for the remainder after a full period: six hours exactly with an overnight is one day, thirty hours exactly is still one, and thirty hours and a minute is two. The day boundaries are 24 hours from the departure instant, not calendar midnights, and the dates are calendar days in UTC. It is a POST because the answer depends on a body, and readable by whoever may see the claim.'
            operationId: postExpensesClaimsByIdPerDiemSuggestion
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesPerDiemSuggestionRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ExpensesPerDiemSuggestedDay'
                                type: array
                    description: OK — the days in order, empty when the trip is too short to earn one.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no claim has that id, or the caller may not see it.
            summary: Suggest a trip's per diem days
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries:
        get:
            description: Expenses, the latest day first, and only where the caller may see them — their own, everything on a project they manage, and everyone's for expenses:view-all, expenses:approve and expenses:manage. The same rule a single read applies, so the list never holds an entry its own read would answer 404 for and its total counts only what the caller may see.
            operationId: getExpensesEntries
            parameters:
                - description: 'Narrows the list to one person''s expenses. It never widens it: a caller sees only what they may see anyway.'
                  in: query
                  name: userId
                  schema:
                    format: uuid
                    type: string
                - description: Narrows the list to one project.
                  in: query
                  name: projectId
                  schema:
                    format: int32
                    type: integer
                - description: Narrows the list to one travel claim's lines. A claim the caller may not see holds nothing they can see either, so this is an empty page rather than a refusal.
                  in: query
                  name: claimId
                  schema:
                    format: int64
                    type: integer
                - description: 'true lists only standalone expenses, false only the lines of travel claims. Left out, the list holds both — the default is unchanged, so a client that knows nothing of claims sees exactly what it always saw.'
                  in: query
                  name: standalone
                  schema:
                    type: boolean
                - description: '''draft'', ''submitted'', ''approved'' or ''rejected''. On a claim''s line it is the claim''s own status that is matched, because that is the status the line is rendered with.'
                  in: query
                  name: status
                  schema:
                    type: string
                - description: '''outlay'', ''mileage'' or ''per_diem''.'
                  in: query
                  name: kind
                  schema:
                    type: string
                - description: The earliest entry date to include.
                  in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - description: The latest entry date to include.
                  in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - description: Narrows the list to what has been reimbursed, or to what has not. Left out, both are in it.
                  in: query
                  name: reimbursed
                  schema:
                    type: boolean
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfExpensesEntryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, or an unknown status or kind.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List expenses
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
        post:
            description: Records one expense as a draft. A mileage line and a per diem day are priced from the dated rate table for the entry's own date; an outlay is entered as it stands.
            operationId: postExpensesEntries
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ExpensesEntryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExpensesEntryResponse'
                    description: Created — a draft owned by the caller, or by the person userId names.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Record an expense
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
