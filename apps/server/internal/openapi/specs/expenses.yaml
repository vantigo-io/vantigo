                    description: Bad Request — no ids, more than 500, a claimId, or at least one expense that has not been reimbursed; the errors on entryIds name each offending id, and nothing was changed.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Undo marking expenses reimbursed
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/reimbursements:
        get:
            description: 'What a payroll run is made from: approved expenses that owe their owner something and have not been paid, grouped per person with their totals per currency, and paged by person, so a page always holds whole people. state=reimbursed answers what has already been paid instead, the latest payout first, so an undo is reachable.'
            operationId: getExpensesReimbursements
            parameters:
                - description: '''waiting'' (the default) or ''reimbursed''.'
                  in: query
                  name: state
                  schema:
                    type: string
                - description: Narrows the list to one person.
                  in: query
                  name: userId
                  schema:
                    format: uuid
                    type: string
                - description: The earliest entry date to include.
                  in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - description: The latest entry date to include.
                  in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfExpensesReimbursementGroup'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, or an unknown state.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List what is owed back
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/reimbursements/export.csv:
        get:
            description: |-
                The same expenses the reimbursement list holds, as the file a payroll system reads: UTF-8 with a byte order mark, semicolon-separated, decimal comma, ISO dates, CRLF line ends and a header row — the form a Norwegian Excel opens correctly without an import dialog. Quoting is RFC 4180's with the semicolon as the separator: a value holding a semicolon, a quote or a line break is quoted and its quotes doubled. A text cell beginning with '=', '+', '-', '@', a tab or a carriage return is prefixed with an apostrophe, so a description nobody vetted cannot become a formula in somebody's spreadsheet.

                The columns, in order: employee display name, user id, date, kind, description, category, currency, gross, VAT, owed, project code. Rows are ordered by the person's display name, then by date and id. The VAT and project code cells are empty when there is none — including in an installation with no projects module, which keeps the column so a payroll system need not know which modules an installation runs.

                It takes the list's own filters, or explicit entryIds instead of them, and it is deliberately not paged: half a payroll file is worse than none, so an export of more than 5000 rows is refused and asks for a narrower filter.
            operationId: getExpensesReimbursementsExportCsv
            parameters:
                - description: '''waiting'' (the default) or ''reimbursed''. Ignored when entryIds is given.'
                  in: query
                  name: state
                  schema:
                    type: string
                - description: Narrows the export to one person. Ignored when entryIds is given.
                  in: query
                  name: userId
                  schema:
                    format: uuid
                    type: string
                - description: The earliest entry date to include. Ignored when entryIds is given.
                  in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - description: The latest entry date to include. Ignored when entryIds is given.
                  in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - description: Exactly these expenses instead of the filters. An id that is not one the export could hold refuses the whole file rather than being left out of it silently, and a parameter that is present but names nothing is refused rather than read as "everything" — a button with nothing selected should leave it out and send the filters.
                  in: query
                  name: entryIds
                  schema:
                    items:
                        format: int64
                        type: integer
                    type: array
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named expenses-reimbursements-YYYY-MM-DD.csv, and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on entryIds for an id the export cannot hold, for more than 5000 of them, or for a present but empty list; and, with no errors object at all, for an unknown state (the very body GET /reimbursements answers it with) or because the filters would produce more rows than one file may hold.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export what is owed back as CSV
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access+expenses:manage
    /api/v1/expenses/reject:
        post:
            description: Rejects submitted expenses with a reason their owner sees, under exactly the rules an approval follows. A rejected expense is its owner's to edit, delete or submit again; submitting it prices it once more, so a line sent back over a wrong rate comes back at the right one.
            operationId: postExpensesReject
            requestBody:
                content:
                    application/json:
