                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the expense but not the project's money.
                "404":
                    description: Not Found — no expense has that id, or the caller may not see it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict — the expense has moved on since the revision that was sent.
            summary: Undo marking an expense invoiced
            tags:
                - Expenses
            x-vantigo-access: permission:expenses:access
    /api/v1/expenses/entries/{id}/rate:
        put:
            description: Replaces the reimbursement rate on one submitted mileage line (decision X8) and reprices its amount. Its owner cannot — unless they also approve it, because self-approval is allowed. What the rate table had said is recorded beside the new rate, the first time and no later, so the original is never lost.
