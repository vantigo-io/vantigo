                    description: Forbidden
            summary: The calendar's settings
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/rsvp:
        post:
            description: 'An invitee''s answer through the RSVP link (calendar invitations design D5; a POST, so the token travels in the body and never in an API URL). Anonymous: no session is needed, and a signed-in caller is answered alike. The token is hashed and looked up; 404 with no body when no attendee holds it, an erased one included. The answer — accepted, declined or tentative — sets the attendee''s status and respondedAt, which they may change at any time, and the owner is told through identity; 409 appointment_cancelled when the appointment is cancelled. 200 with the page as it now stands. Rate limited to 30 per client address per 10 minutes (calendar-rsvp).'
            operationId: postCalendarRsvp
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RsvpWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RsvpPage'
                    description: OK — the appointment as the RSVP page shows it, with the answer recorded.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — a body that does not decode, no token, or a status that is not an answer.
                "404":
                    description: Not Found — no attendee holds that token. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — appointment_cancelled.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-rsvp's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Answer an invitation
            tags:
                - Calendar
            x-vantigo-access: anonymous
    /api/v1/calendar/rsvp/read:
        post:
            description: 'The RSVP page''s read (calendar invitations design D5; a POST, so the token travels in the body and never in an API URL). Anonymous: no session is needed, and a signed-in caller is answered alike. The token is hashed and looked up; 404 with no body when no attendee holds it, an erased one included. 200 with what the page shows — the title, when, where, the organiser''s name, the invitee''s name and current answer, whether it is cancelled and the language — and never the description, another attendee or an address. Rate limited to 60 per client address per 10 minutes (calendar-rsvp-read).'
            operationId: postCalendarRsvpRead
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RsvpReadRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RsvpPage'
                    description: OK — the appointment as the RSVP page shows it.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — a body that does not decode, or no token.
                "404":
                    description: Not Found — no attendee holds that token. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-rsvp-read's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Read an invitation for the RSVP page
            tags:
                - Calendar
            x-vantigo-access: anonymous
    /api/v1/calendar/subscriptions:
        get:
            description: The caller's subscriptions (calendar feed design D6), by name, each with the worker's record of its last fetch. calendar:access's, on the caller's own rows.
            operationId: getCalendarSubscriptions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CalendarSubscription'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The caller's subscriptions
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        post:
            description: 'Subscribes the caller to a calendar from elsewhere (calendar feed design D6). The rules at write are field errors (CalendarSubscriptionWrite), and the eleventh is 409 subscription_limit: ten calendars beside one''s own is more than anyone reads, and each is a fetch every half hour. The address is fetched once before the answer, under a budget of twenty seconds and through the outbound guard — no private address, no redirect, at most 1 MiB — so a wrong one is seen at once and a right one shows its events at the next load; the row is created whatever the fetch answers, its error set when it failed, and the calendar-subscriptions worker fetches it from then on. The count and the insert are one step under the caller''s lock, so two saves at nine cannot both be the tenth. 201 with the row as it stands. Rate limited, with PUT /subscriptions/{id} and POST /subscriptions/{id}/refresh, to 30 per client address per 10 minutes (calendar-subscription-fetch).'
            operationId: postCalendarSubscriptions
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalendarSubscriptionWrite'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSubscription'
                    description: Created — the row as the fetch left it.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — subscription_limit, the caller has ten subscriptions already.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-subscription-fetch's limit for this client address, shared with PUT /subscriptions/{id} and POST /subscriptions/{id}/refresh.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Subscribe to a calendar
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/subscriptions/{id}:
        delete:
            description: Removes one of the caller's subscriptions (calendar feed design D6); its events are gone from the next read. Another person's is the 404 an unknown id gets.
            operationId: deleteCalendarSubscriptionsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such subscription, or another person's. The body is empty.
            summary: Remove a subscription
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        put:
            description: 'Replaces one of the caller''s subscriptions whole (calendar feed design D6), the rules at write as for POST. There is no revision and no If-Match: the row is the caller''s own, small, and last write wins. A new url forgets every fetch of the old one — its validators, its calendar and its record — and is fetched once before the answer, as POST fetches; a change of the rest fetches nothing. Another person''s is the 404 an unknown id gets. Rate limited, with POST /subscriptions and POST /subscriptions/{id}/refresh, to 30 per client address per 10 minutes (calendar-subscription-fetch), whether or not the url changes.'
            operationId: putCalendarSubscriptionsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CalendarSubscriptionWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSubscription'
                    description: OK — the row as it now stands.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such subscription, or another person's. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-subscription-fetch's limit for this client address, shared with POST /subscriptions and POST /subscriptions/{id}/refresh.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Change a subscription
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/subscriptions/{id}/refresh:
        post:
            description: 'Fetches one of the caller''s subscriptions now (calendar feed design D6) — the screen''s Refresh now — under the same budget and guard as POST /subscriptions, and answers the row as the fetch left it: fetchedAt on a calendar or a 304, error when it failed, which is not an error of this request. Another person''s is the 404 an unknown id gets. Rate limited, with POST /subscriptions and PUT /subscriptions/{id}, to 30 per client address per 10 minutes (calendar-subscription-fetch).'
            operationId: postCalendarSubscriptionsByIdRefresh
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarSubscription'
                    description: OK — the row as the fetch left it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such subscription, or another person's. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-subscription-fetch's limit for this client address, shared with POST /subscriptions and PUT /subscriptions/{id}.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Refresh a subscription
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/users:
        get:
            description: Active users in the directory, ordered by display name, for the attendee picker and the colleague picker. Every calendar:access holder may search; what it answers — a colleague's id and display name — is what every appointment already shows its attendees.
