components:
    schemas:
        Appointment:
            description: 'One appointment (calendar design D2, D3): a timed one is two instants (startsAt, endsAt exclusive), an all-day one two civil dates (startDate, endDate inclusive), never both. timeZone is the TZID it was made in, and a recurring one expands in it. The caller is its owner or one of its attendees; anyone else gets the 404 an unknown id gets.'
            properties:
                allDay:
                    type: boolean
                attendees:
                    description: The people on it — colleagues, a customer's contacts and addresses typed in — the owner never among them, in the order they were added.
                    items:
                        $ref: '#/components/schemas/AppointmentAttendee'
                    type: array
                cancelledAt:
                    description: When the appointment was cancelled (calendar invitations design D6) — deleted after someone outside the company had been sent an invitation. A cancelled appointment is read-only, every write answering 409 appointment_cancelled, and is on nobody's calendar. Absent on a live one.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                customer:
                    $ref: '#/components/schemas/AppointmentCustomer'
                description:
                    type: string
                endDate:
                    description: An all-day appointment's last day, inclusive. Absent on a timed one.
                    format: date
                    type: string
                endsAt:
                    description: A timed appointment's end, exclusive. Absent on an all-day one.
                    format: date-time
                    type: string
                exceptions:
                    description: A recurring appointment's cancelled and moved occurrences, by occurrenceDate — each one DELETE /appointments/{id}/occurrences/{date} puts back. Empty on a single appointment.
                    items:
                        $ref: '#/components/schemas/AppointmentOccurrence'
                    type: array
                id:
                    format: int64
                    type: integer
                location:
                    type: string
                myStatus:
                    $ref: '#/components/schemas/AppointmentAttendeeStatus'
                owner:
                    $ref: '#/components/schemas/CalendarUserRef'
                project:
                    $ref: '#/components/schemas/AppointmentProject'
                recurrence:
                    $ref: '#/components/schemas/AppointmentRecurrence'
                revision:
                    description: Send it back as If-Match on PUT /appointments/{id}.
                    format: int32
                    type: integer
                startDate:
                    description: An all-day appointment's first day. Absent on a timed one.
                    format: date
                    type: string
                startsAt:
                    description: A timed appointment's start. Absent on an all-day one.
                    format: date-time
                    type: string
                timeZone:
                    description: The IANA zone the appointment was made in, the creator's effective zone at creation.
                    type: string
                title:
                    type: string
                transparency:
                    $ref: '#/components/schemas/AppointmentTransparency'
                updatedAt:
                    format: date-time
                    type: string
                visibility:
                    $ref: '#/components/schemas/AppointmentVisibility'
            required:
                - id
                - title
                - allDay
                - timeZone
                - visibility
                - transparency
                - owner
                - attendees
                - exceptions
                - revision
                - createdAt
                - updatedAt
            type: object
        AppointmentAttendee:
            description: 'One person on an appointment and what they answered (calendar invitations design D1), by kind: a user carries user; a contact carries contact, its name read from the customer directory when the appointment is read and absent when the directory no longer answers it — its address is never on an appointment; an email attendee carries email and the name as typed. The two outside kinds carry invitation; a user never does.'
            properties:
                contact:
                    $ref: '#/components/schemas/AppointmentAttendeeContact'
                email:
                    description: An email attendee's address, lower-cased. Absent on the other kinds.
                    type: string
                id:
                    description: The attendee row's id — what POST /appointments/{id}/attendees/{attendeeId}/resend names.
                    format: int64
                    type: integer
                invitation:
                    $ref: '#/components/schemas/AttendeeInvitation'
                kind:
                    $ref: '#/components/schemas/AppointmentAttendeeKind'
                name:
                    description: An email attendee's name, as typed. Absent when none was given, and on the other kinds.
                    type: string
                respondedAt:
                    description: When they last answered. Absent while the status is needs-action.
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/AppointmentAttendeeStatus'
                user:
                    $ref: '#/components/schemas/CalendarUserRef'
            required:
                - id
                - kind
                - status
            type: object
        AppointmentAttendeeContact:
            description: A customer's contact on an appointment — an opaque link, its name resolved through the customer directory when the appointment is read, absent when the directory no longer answers it (an anonymised contact), which the app shows as "A contact".
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
            type: object
        AppointmentAttendeeKind:
            description: 'The kind of an attendee (calendar invitations design D1): user (a colleague, told through the app and by a notice from identity), contact (a customer''s contact, mailed an invitation at the address the customer directory holds) or email (an address typed in, mailed an invitation).'
            enum:
                - user
                - contact
                - email
            type: string
        AppointmentAttendeeStatus:
            description: An attendee's answer. needs-action until they answer, and again after the owner changes when the appointment is; the owner's own is implicitly accepted and never stored.
            enum:
                - needs-action
                - accepted
                - declined
                - tentative
            type: string
        AppointmentCustomer:
            description: The customer the appointment was made from — an opaque link, its name resolved through the customer directory when Customers is on, absent when not.
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
            type: object
        AppointmentOccurrence:
            description: 'One occurrence''s exception (calendar design D4): cancelled, or moved to the pair the series uses — startsAt and endsAt for a timed series, startDate and endDate for an all-day one. occurrenceDate is the day in the appointment''s zone the series put it on, and stays its identity wherever it moved.'
            properties:
                cancelled:
                    type: boolean
                endDate:
                    format: date
                    type: string
                endsAt:
                    format: date-time
                    type: string
                occurrenceDate:
                    format: date
                    type: string
                startDate:
                    format: date
                    type: string
                startsAt:
                    format: date-time
                    type: string
            required:
                - occurrenceDate
                - cancelled
            type: object
        AppointmentProject:
            description: The project the appointment was made from — an opaque link, its code and name resolved through the project directory when Projects is on, absent when not.
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
            type: object
        AppointmentRecurrence:
            description: A recurring appointment's rule, as stored.
            properties:
                lastDate:
                    description: The last occurrence's day in the appointment's zone, when the rule ends (COUNT or UNTIL). Absent when the series never ends.
                    format: date
                    type: string
                rule:
                    description: 'An RFC 5545 RRULE value without DTSTART, which is the appointment''s start, in its canonical form: FREQ=WEEKLY;INTERVAL=1;BYDAY=MO,WE;COUNT=10.'
                    type: string
            required:
                - rule
            type: object
        AppointmentRecurrenceWrite:
            description: 'The rule to repeat by (calendar design D4): FREQ DAILY, WEEKLY or MONTHLY; INTERVAL 1 to 99; BYDAY plain weekdays for WEEKLY and one ordinal weekday (2TU, -1FR) for MONTHLY; BYMONTHDAY one day for MONTHLY; at most one of COUNT (up to 730) and UNTIL (a date at most five years after the start). Anything else is a field error on recurrence.rule. The server stores it re-serialised.'
            properties:
                rule:
                    type: string
            required:
                - rule
            type: object
        AppointmentResponseWrite:
            description: An attendee's answer. needs-action is not something a person sends.
            properties:
                status:
                    enum:
                        - accepted
                        - declined
                        - tentative
                    type: string
            required:
                - status
            type: object
        AppointmentTransparency:
            description: iCalendar's TRANSP in this module's words — busy (OPAQUE) blocks the time on a colleague's view, free (TRANSPARENT) does not show there.
            enum:
                - busy
                - free
            type: string
        AppointmentVisibility:
            description: iCalendar's CLASS in this module's words — shared (PUBLIC) shows its title to a colleague, private (PRIVATE) shows with an empty title and nothing else, which the app labels Busy.
            enum:
                - shared
                - private
            type: string
        AppointmentWrite:
            description: 'An appointment as POST creates it and PUT replaces it whole. Exactly one pair is set: startsAt and endsAt (endsAt after startsAt, at most 31 days) when allDay is false, startDate and endDate (endDate on or after startDate, at most 366 days) when it is true. A PUT that changes when, where or the rule bumps the sequence; one that changes when resets every attendee to needs-action; one that changes the rule or the start drops every exception.'
            properties:
                allDay:
                    type: boolean
                attendees:
                    description: 'The people on it, at most 50 of all kinds together, the owner never among them; two naming the same user, contact or address are one. Absent means none. A PUT keeps an attendee still listed — their answer and their invitation with them — drops one who is not, and adds the new ones. Each refused element is a field error on attendees[i].'
                    items:
                        $ref: '#/components/schemas/AttendeeWrite'
                    type: array
                customerId:
                    description: The customer the appointment is made from. Opaque, and never refused for being unresolvable.
                    format: int32
                    type: integer
                description:
                    description: At most 10 000 characters.
                    type: string
                endDate:
                    format: date
                    type: string
                endsAt:
                    format: date-time
                    type: string
                location:
                    description: At most 200 characters.
                    type: string
                projectId:
                    description: The project the appointment is made from. Opaque, and never refused for being unresolvable.
                    format: int32
                    type: integer
                recurrence:
                    $ref: '#/components/schemas/AppointmentRecurrenceWrite'
                startDate:
                    format: date
                    type: string
                startsAt:
                    format: date-time
                    type: string
                timeZone:
                    description: The IANA zone the appointment is made in — the SPA sends the session's effective zone. On PUT, the zone a recurring series expands in from then on.
                    type: string
                title:
                    description: 1 to 200 characters.
                    type: string
                transparency:
                    $ref: '#/components/schemas/AppointmentTransparency'
                visibility:
                    $ref: '#/components/schemas/AppointmentVisibility'
            required:
                - title
                - allDay
                - timeZone
            type: object
        AttendeeInvitation:
            description: 'The invitation record of an outside attendee (calendar invitations design D3): sentAt and sequence, the last send that succeeded and the SEQUENCE it carried; failedAt, the last send that failed since then. All three absent is "Not sent" — the mail driver is not smtp, or nothing has been sent yet.'
            properties:
                failedAt:
                    format: date-time
                    type: string
                sentAt:
                    format: date-time
                    type: string
                sequence:
                    format: int32
                    type: integer
            type: object
        AttendeeWrite:
            description: 'One attendee as a write names them (calendar invitations design D1), by kind: user with userId, an active user in the directory (or one already on the appointment); contact with contactId, a contact of a customer that the customer directory answers and that has an address — the writer must hold customers:contacts-view; email with email, an address net/mail accepts, stored lower-cased, and name, at most 200 characters, optional. The fields of another kind are refused.'
            properties:
                contactId:
                    format: int32
                    type: integer
                email:
                    description: At most 254 characters.
                    type: string
                kind:
                    $ref: '#/components/schemas/AppointmentAttendeeKind'
                name:
                    description: An email attendee's name, at most 200 characters.
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - kind
            type: object
        CalendarContact:
            description: A customer's contact with an address, for the attendee picker (calendar invitations design D2).
            properties:
                email:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
                - email
            type: object
        CalendarItem:
            description: 'One thing on a person''s calendar: an appointment''s occurrence (kind calendar.appointment, with appointment set), a row another module projects through its calendar source (with path set), an event of a calendar the person subscribes to (kind calendar.subscription, with subscription set — calendar feed design D8), or an event of the person''s Outlook calendar that blocks their time, read back by their Outlook sync (kind calendar.outlook, with outlook set and no title — calendar Outlook sync design O9.5). An all-day item spans startDate..endDate inclusive; a timed one spans startsAt..endsAt, endsAt exclusive (equal to startsAt for a point in time, which the view draws at its default length).'
            properties:
                allDay:
                    type: boolean
                appointment:
                    $ref: '#/components/schemas/CalendarItemAppointment'
                done:
                    description: A follow-up done, a task done, an entry approved — rendered struck. Always false on an appointment and on a subscription's item.
                    type: boolean
                endDate:
                    format: date
                    type: string
                endsAt:
                    format: date-time
                    type: string
                id:
                    description: Stable within the kind. An appointment's "1001", or "1001:2026-11-03" for one occurrence of a series; a provider's row id; a subscription's "<subscription id>:<UID>", with ":<start>" after it for an occurrence of a rule (20261103T080000Z, or the date for an all-day one); an Outlook event's the first 16 hex digits of the SHA-256 of its id in the mailbox, which never reaches the browser.
                    type: string
                kind:
                    description: calendar.appointment, calendar.subscription, calendar.outlook, or one of the kinds in sources.
                    type: string
                path:
                    description: The SPA route of the provider's record, for the link back. Absent on an appointment, which the sheet opens by id, and on a subscription's item, which opens nothing — the event's own URL is the other calendar's and is not followed.
                    type: string
                startDate:
                    format: date
                    type: string
                startsAt:
                    format: date-time
                    type: string
                subscription:
                    $ref: '#/components/schemas/CalendarItemSubscription'
                subtitle:
                    description: One line — the customer's name, the project's code, the subscription's name. Absent when empty.
                    type: string
                title:
                    description: Empty on a busy-only subscription's item, which the app labels Busy, and on an Outlook event, which the app labels by its outlook.showAs.
                    type: string
                outlook:
                    $ref: '#/components/schemas/CalendarItemOutlook'
            required:
                - kind
                - id
                - title
                - allDay
                - done
            type: object
        CalendarItemAppointment:
            description: What the view needs about the appointment behind an item.
            properties:
                id:
                    format: int64
                    type: integer
                isOwner:
                    type: boolean
                myStatus:
                    $ref: '#/components/schemas/AppointmentAttendeeStatus'
                occurrenceDate:
                    description: The occurrence's identity in its series — the day in the appointment's zone the series put it on. Absent on a single appointment.
                    format: date
                    type: string
                recurring:
                    type: boolean
                transparency:
                    $ref: '#/components/schemas/AppointmentTransparency'
                visibility:
                    $ref: '#/components/schemas/AppointmentVisibility'
            required:
                - id
                - isOwner
                - visibility
                - transparency
                - recurring
            type: object
        CalendarItemOutlook:
            description: 'The Outlook event behind an item of kind calendar.outlook (calendar Outlook sync design O9.5): how it shows the person''s time in Outlook — busy, tentative, oof (out of office) or workingElsewhere — which the app labels it by (Busy in Outlook, Tentative, Out of office, Working elsewhere). Nothing else of the event is stored or answered: a free or cancelled event is never an item.'
            properties:
                showAs:
                    enum:
                        - busy
                        - tentative
                        - oof
                        - workingElsewhere
                    type: string
            required:
                - showAs
            type: object
        CalendarItemSubscription:
            description: 'The subscription behind an item of kind calendar.subscription (calendar feed design D8): what the app draws it by — its colour and its name — and whether it is busy only, in which case the item''s title is empty and the app labels it Busy.'
            properties:
                busyOnly:
                    type: boolean
                colour:
                    $ref: '#/components/schemas/CalendarSubscriptionColour'
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
                - colour
                - busyOnly
            type: object
        CalendarItems:
            description: One person's calendar in a window (calendar design D5), sorted by start, all-day first within a day, never paged.
            properties:
                from:
                    format: date
                    type: string
                items:
                    items:
                        $ref: '#/components/schemas/CalendarItem'
                    type: array
                publicHolidays:
                    items:
                        $ref: '#/components/schemas/CalendarPublicHoliday'
                    type: array
                sources:
                    description: Every kind a wired provider declares, enabled modules only. Empty on a colleague's calendar.
                    items:
                        $ref: '#/components/schemas/CalendarSourceKind'
                    type: array
                timeZone:
                    description: The zone the window was judged in.
                    type: string
                to:
                    format: date
                    type: string
            required:
                - from
                - to
                - timeZone
                - sources
                - publicHolidays
                - items
            type: object
        CalendarMeta:
            description: What the calendar app needs before it asks for a window.
            properties:
                canViewColleagues:
                    description: Whether the caller holds calendar:view-colleagues.
                    type: boolean
                invitationsAvailable:
                    description: Whether invitations are mailed — the mail driver is smtp. When false, outside attendees are stored and marked not sent.
                    type: boolean
                sources:
                    description: Every kind a wired provider declares, enabled modules only — for the filter, the legend and the colours — calendar.subscription when the caller has at least one subscription, and calendar.outlook while the caller's Outlook sync is on.
                    items:
                        $ref: '#/components/schemas/CalendarSourceKind'
                    type: array
                timeZone:
                    description: The workspace's business time zone.
                    type: string
                today:
                    description: Today in the business time zone.
                    format: date
                    type: string
            required:
                - timeZone
                - today
                - canViewColleagues
                - invitationsAvailable
                - sources
            type: object
        CalendarProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: revision_mismatch (409: the If-Match revision has moved on), occurrence_not_in_series (409: the series'' rule never produces that date), appointment_cancelled (409: the appointment is cancelled and nothing of it changes), invitations_unavailable (503: the mail driver is not smtp, so no invitation can be sent), subscription_limit (409: the caller has ten subscriptions already), mailbox_sync_unavailable (409: the Outlook sync cannot run now; detail carries the availability — switch_off, no_provider, unavailable or no_account) and mailbox_sync_off (409: Sync now of an Outlook sync that is turned off). errors carries the field errors of a 400, keyed by the request''s camelCase field (a nested one as recurrence.rule, an element of a list as attendees[0]). A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        CalendarPublicHoliday:
            description: A Norwegian public holiday in the window.
            properties:
                date:
                    format: date
                    type: string
                name:
                    type: string
            required:
                - date
                - name
            type: object
        CalendarSourceKind:
            description: 'One kind of item a module projects onto the calendar: a stable key, "<module>.<noun>", and the module it comes from.'
            properties:
                kind:
                    type: string
                module:
                    type: string
            required:
                - kind
                - module
            type: object
        CalendarSubscription:
            description: 'A calendar from elsewhere the caller subscribes to (calendar feed design D6, D7): what they wrote, and the worker''s record of the last fetch — fetchedAt, the last that answered a calendar or a 304; attemptedAt, the last tried, whatever it answered; error, why the last one failed, absent after one that did not. A failed fetch keeps the calendar last fetched, so its items still show, and the screen says both when it last worked and why it does not now.'
            properties:
                attemptedAt:
                    description: The last fetch tried, whatever it answered. Absent before the first.
                    format: date-time
                    type: string
                busyOnly:
                    description: Its items are shown with an empty title, which the app labels Busy.
                    type: boolean
                colour:
                    $ref: '#/components/schemas/CalendarSubscriptionColour'
                createdAt:
                    format: date-time
                    type: string
                error:
                    description: Why the last fetch failed, as one sentence — never the response's body or the address it resolved to. Absent after a fetch that did not fail.
                    type: string
                fetchedAt:
                    description: The last fetch that answered a calendar or a 304. Absent while none has.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                url:
                    description: The address as stored — webcal and webcals rewritten to https.
                    type: string
            required:
                - id
                - name
                - url
                - colour
                - busyOnly
                - createdAt
                - updatedAt
            type: object
        CalendarSubscriptionColour:
            description: The palette a subscription is drawn in (calendar feed design D9) — twelve Mantine hues, each a --vantigo-calendar-<name> variable in the app, so a subscription's items follow the colour scheme as a module's do.
            enum:
                - blue
                - cyan
                - teal
                - green
                - lime
                - yellow
                - orange
                - red
                - pink
                - grape
                - violet
                - indigo
            type: string
        CalendarSubscriptionWrite:
            description: 'A subscription as POST creates it and PUT replaces it whole (calendar feed design D6), each rule a field error: name 1 to 100 characters; url at most 2048 characters, absolute, with a scheme of https, http, webcal or webcals (the last two stored as https, since they are the same thing in a program''s address bar), a host that is not empty and not an address Vantigo may not fetch, and no user name or password — they would be written to the row and the log; colour one of the palette''s.'
            properties:
                busyOnly:
                    type: boolean
                colour:
                    $ref: '#/components/schemas/CalendarSubscriptionColour'
                name:
                    type: string
                url:
                    type: string
            required:
                - name
                - url
                - colour
                - busyOnly
            type: object
        CalendarUserRef:
            description: A user as the directory names them.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        FeedAddress:
            description: 'One of the caller''s calendar addresses (calendar feed design D1): the address a calendar program subscribes to, in its https form and its webcal form — the same address, which Apple''s and Outlook''s programs subscribe to in one click; the server serves https alone. It is kept sealed and opened for its owner''s screen only, so it can be shown again; a reset gives a new one and the old answers 404 from that moment.'
            properties:
                address:
                    description: <base>/api/v1/calendar/feed/<token>.ics, the base PUBLIC_BASE_URL when it is set and APP_URL with APP_BASE_PATH otherwise.
                    type: string
                createdAt:
                    description: When the address was created, or last reset.
                    format: date-time
                    type: string
                lastUsedAt:
                    description: The last request that answered 200 or 304. Absent while nothing has read the address.
                    format: date-time
                    type: string
                variant:
                    $ref: '#/components/schemas/FeedVariant'
                webcalAddress:
                    description: The same address with webcal:// in place of https://.
                    type: string
            required:
                - variant
                - address
                - webcalAddress
                - createdAt
            type: object
        FeedAddresses:
            description: The caller's calendar addresses, full before busy; a variant without one is absent.
            properties:
                addresses:
                    items:
                        $ref: '#/components/schemas/FeedAddress'
                    type: array
                public:
                    description: Whether the addresses are on PUBLIC_BASE_URL, reachable from the internet. False is APP_URL, which may answer on the company's network only.
                    type: boolean
            required:
                - public
                - addresses
            type: object
        FeedVariant:
            description: 'A calendar address''s variant (calendar feed design D3): full is the person''s calendar as they see it — never a colleague''s appointment, a cancelled or a declined one, a subscription''s item or a public holiday; busy is its busy spans and nothing else, each titled Busy.'
            enum:
                - full
                - busy
            type: string
        MailboxSync:
            description: 'The caller''s Outlook sync (calendar Outlook sync design O5): their setting, the worker''s state, and whether it can run. availability is available, or why not — switch_off (an Owner has not turned on Calendar sync in the Entra module), no_provider (no enabled module writes mailboxes), unavailable (the provider''s connection is not working), permission_missing (reserved and no longer answered: the calendar permission may be granted with Exchange RBAC for Applications, which no token shows, so a mailbox outside the grant is the sync''s mailbox_denied error instead) or no_account (the caller has no account in the directory that Staff links to them). availableKinds are the kinds the caller may choose: the appointment kind and the kinds the calendar sources declare today. state is pending (on, not yet synced), active, stopping (the copies are being removed), off, unavailable or failed; error is the last refusal''s code, absent after a sync that worked. A caller who never turned it on is answered the defaults at revision 0.'
            properties:
                availability:
                    enum:
                        - available
                        - switch_off
                        - no_provider
                        - unavailable
                        - permission_missing
                        - no_account
                    type: string
                availableKinds:
                    items:
                        $ref: '#/components/schemas/MailboxSyncKind'
                    type: array
                detail:
                    $ref: '#/components/schemas/MailboxSyncDetail'
                enabled:
                    type: boolean
                error:
                    enum:
                        - no_account
                        - mailbox_denied
                        - mailbox_gone
                        - unavailable
                        - failed
                    type: string
                kinds:
                    items:
                        type: string
                    type: array
                busySyncedAt:
                    description: When the sync last read the caller's Outlook calendar to its end (calendar Outlook sync design O9.1). Absent before the first read, and once the sync is turned off.
                    format: date-time
                    type: string
                lastSyncedAt:
                    format: date-time
                    type: string
                putBack:
                    $ref: '#/components/schemas/MailboxSyncPutBack'
                revision:
                    description: Send it back as If-Match on PUT /mailbox-sync.
                    format: int32
                    type: integer
                state:
                    enum:
                        - pending
                        - active
                        - stopping
                        - "off"
                        - unavailable
                        - failed
                    type: string
                target:
                    $ref: '#/components/schemas/MailboxSyncTarget'
            required:
                - availability
                - enabled
                - target
                - detail
                - kinds
                - availableKinds
                - state
                - revision
            type: object
        MailboxSyncDetail:
            description: What the copies show — full, the titles, the places and the links, or busy, Busy for every title and the link alone.
            enum:
                - full
                - busy
            type: string
        MailboxSyncKind:
            description: 'One kind the caller may sync: its key ("calendar.appointment", "staff.absence") and the module it comes from.'
            properties:
                key:
                    type: string
                module:
                    type: string
            required:
                - key
                - module
            type: object
        MailboxSyncPutBack:
            description: 'The last change the caller made in Outlook to a copy that the sync did not take, and put back (calendar Outlook sync design O10.3). reason is conflict (the appointment was changed in Vantigo too, and Vantigo''s version won), refused (the appointment''s rules refused the change), not_owner (the copy is of an appointment the caller attends, not one they own) or not_editable (the copy is of an item another module projects, or the change is one an occurrence cannot carry). Absent when nothing was put back since the sync was last turned on or cleaned up.'
            properties:
                appointmentId:
                    description: The appointment the copy is of, when it is one.
                    format: int64
                    type: integer
                at:
                    description: When the change was put back.
                    format: date-time
                    type: string
                occurrenceDate:
                    description: The occurrence's day, when the copy is of one occurrence of a series.
                    format: date
                    type: string
                reason:
                    enum:
                        - conflict
                        - refused
                        - not_owner
                        - not_editable
                    type: string
                title:
                    description: The appointment's title, read live, and answered only for an appointment the caller owns or attends.
                    type: string
            required:
                - reason
                - at
            type: object
        MailboxSyncTarget:
            description: Where the copies go — default, the caller's main calendar, which shows them busy to colleagues, or own, a separate calendar named Vantigo.
            enum:
                - default
                - own
            type: string
        MailboxSyncWrite:
            description: 'The caller''s setting as PUT /mailbox-sync replaces it whole (calendar Outlook sync design O5), each rule a field error: target and detail one of their values; kinds each one of availableKinds, no kind twice.'
            properties:
                detail:
                    $ref: '#/components/schemas/MailboxSyncDetail'
                enabled:
                    type: boolean
                kinds:
                    items:
                        type: string
                    type: array
                target:
                    $ref: '#/components/schemas/MailboxSyncTarget'
            required:
                - enabled
                - target
                - detail
                - kinds
            type: object
        OccurrenceWrite:
            description: 'One occurrence''s exception: cancelled true, or a move — startsAt and endsAt for a timed series, startDate and endDate for an all-day one — never both. A moved occurrence keeps the day it came from as its identity.'
            properties:
                cancelled:
                    type: boolean
                endDate:
                    format: date
                    type: string
                endsAt:
                    format: date-time
                    type: string
                startDate:
                    format: date
                    type: string
                startsAt:
                    format: date-time
                    type: string
            type: object
        RsvpPage:
            description: 'What the RSVP page shows an invitee (calendar invitations design D5) — what they need to decide and nothing more: no description, no other attendee, no address. A timed appointment carries startsAt and endsAt, an all-day one startDate and endDate (inclusive); a series answers its first occurrence. company is reserved for the workspace''s name and is not answered yet — no contract the calendar reads exposes one. language is the organiser''s, the one the invitation was written in.'
            properties:
                allDay:
                    type: boolean
                attendee:
                    $ref: '#/components/schemas/RsvpPerson'
                cancelled:
                    type: boolean
                company:
                    description: Reserved for the workspace's name, and not answered yet; a client shows the organiser alone.
                    type: string
                endDate:
                    format: date
                    type: string
                endsAt:
                    format: date-time
                    type: string
                language:
                    enum:
                        - en
                        - nb
                    type: string
                location:
                    type: string
                organiser:
                    $ref: '#/components/schemas/RsvpPerson'
                startDate:
                    format: date
                    type: string
                startsAt:
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/AppointmentAttendeeStatus'
                timeZone:
                    description: The IANA zone the appointment was made in.
                    type: string
                title:
                    type: string
            required:
                - title
                - allDay
                - timeZone
                - organiser
                - attendee
                - status
                - cancelled
                - language
            type: object
        RsvpPerson:
            description: A person as the RSVP page names them — the organiser by their display name, the invitee by the name the appointment holds for them.
            properties:
                name:
                    type: string
            required:
                - name
            type: object
        RsvpReadRequest:
            description: 'POST /rsvp/read''s body: the RSVP link''s token, from the page''s own address — in the body, so it never travels in an API URL.'
            properties:
                token:
                    type: string
            required:
                - token
            type: object
        RsvpWrite:
            description: 'POST /rsvp''s body: the RSVP link''s token and the invitee''s answer. needs-action is not something a person sends.'
            properties:
                status:
                    enum:
                        - accepted
                        - declined
                        - tentative
                    type: string
                token:
                    type: string
            required:
                - token
                - status
            type: object
info:
    title: Vantigo Calendar API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/calendar/appointments:
        post:
            description: Creates an appointment owned by the caller, its attendees at needs-action. visibility defaults to shared and transparency to busy. The rule, when given, is stored canonical with its last occurrence's day.
            operationId: postCalendarAppointments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AppointmentWrite'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Appointment'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create an appointment
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/appointments/{id}:
        delete:
            description: 'Deletes the appointment, the owner only; anyone else gets the 404 an unknown id gets (calendar invitations design D6). When no outside attendee has ever been sent an invitation, the row goes — the whole series, with its attendees and exceptions. Otherwise the appointment is cancelled: cancelledAt set, its sequence bumped, a CANCEL mailed to every outside attendee and the colleagues told; it stays, read-only, until the calendar-cancellations worker erases it after its last day. A cancelled appointment answers 409 appointment_cancelled.'
            operationId: deleteCalendarAppointmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller does not own. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — appointment_cancelled.
            summary: Delete an appointment
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        get:
            description: One appointment, to its owner or an attendee; anyone else gets the 404 an unknown id gets. A cancelled one is answered with cancelledAt until it is erased.
            operationId: getCalendarAppointmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Appointment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller neither owns nor attends. The body is empty.
            summary: Get an appointment
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        put:
            description: Replaces the appointment whole, the owner only. A change of when, where or the rule bumps its sequence; a change of when resets every attendee to needs-action; a change of the rule or the start drops every exception.
            operationId: putCalendarAppointmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the appointment was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_mismatch.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AppointmentWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Appointment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body, or an If-Match that is not a revision.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller does not own. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — revision_mismatch, or appointment_cancelled.
            summary: Change an appointment
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/appointments/{id}/attendees/{attendeeId}/resend:
        post:
            description: 'Sends one outside attendee their invitation again (calendar invitations design D3), the owner only — a REQUEST with the appointment''s current sequence and the same RSVP link the first carried. The send is made after the answer is decided and recorded on the attendee''s invitation: sentAt and sequence on success, failedAt on a failure, which is not an error of this request. 404 for an appointment the caller does not own, an attendee not on it, or a user attendee, who is never mailed an invitation; 409 appointment_cancelled for a cancelled appointment; 503 invitations_unavailable when the mail driver is not smtp.'
            operationId: postCalendarAppointmentsByIdAttendeesByAttendeeIdResend
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: attendeeId
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Appointment'
                    description: OK — the appointment, with the attendee's invitation as the send left it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, one the caller does not own, no such attendee on it, or a user attendee. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — appointment_cancelled.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Service Unavailable — invitations_unavailable, the mail driver is not smtp.
            summary: Resend an invitation
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/appointments/{id}/occurrences/{date}:
        delete:
            description: Removes one occurrence's exception, the owner only, so the series' own occurrence returns, moving the appointment's revision and its sequence on. A date with no exception is already that, and answers the same with nothing changed.
            operationId: deleteCalendarAppointmentsByIdOccurrencesByDate
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The occurrence's day in the appointment's zone, as the series made it.
                  in: path
                  name: date
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller does not own. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — appointment_cancelled.
            summary: Restore an occurrence
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        put:
            description: Creates or replaces one occurrence's exception — cancelled, or moved — the owner only. The date must be one the series' rule produces, within ten years of today. A change of when, it moves the appointment's revision and its sequence on.
            operationId: putCalendarAppointmentsByIdOccurrencesByDate
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The occurrence's day in the appointment's zone, as the series made it.
                  in: path
                  name: date
                  required: true
                  schema:
                    format: date
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OccurrenceWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppointmentOccurrence'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body, or an appointment that does not recur.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller does not own. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — occurrence_not_in_series, or appointment_cancelled.
            summary: Move or cancel an occurrence
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/appointments/{id}/response:
        post:
            description: An attendee's answer to an appointment — accepted, declined or tentative — which they may change at any time. An answer changes nothing of the appointment itself, so its revision stays and the owner's If-Match still holds. Anyone who is not an attendee, the owner included, gets the 404 an unknown id gets.
            operationId: postCalendarAppointmentsByIdResponse
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AppointmentResponseWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Appointment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — a status that is not an answer.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such appointment, or one the caller does not attend. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — appointment_cancelled.
            summary: Answer an appointment
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/colleagues/{userId}/items:
        get:
            description: 'A colleague''s calendar in a window (calendar design D6): their appointments — owned, or attended and accepted — that block time (transparency busy), expanded as GET /items does. A shared one carries its title and location; a private one carries an empty title, no subtitle and visibility private, which the app labels Busy. While the colleague''s Outlook sync is on, the events of their Outlook calendar shown as busy or out of office come too, as calendar.outlook items with no title (calendar Outlook sync design O9.7). No provider is asked and sources is empty. The caller''s own id answers as their own calendar would, private titles included.'
            operationId: getCalendarColleaguesByUserIdItems
            parameters:
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: The window's first day, inclusive, within ten years of today.
                  in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The window's last day, inclusive. The window is at most 93 days, both ends counted.
                  in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The viewer's IANA zone, in which the window's edges are judged. Absent means the business time zone.
                  in: query
                  name: timeZone
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarItems'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — to before from, a window over 93 days, or a time zone that is not one.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no active user has that id. The body is empty.
            summary: A colleague's calendar
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access+calendar:view-colleagues
    /api/v1/calendar/contacts:
        get:
            description: 'The contacts of one customer that have an address, ordered by name, for the attendee picker (calendar invitations design D2), through the customer directory. Besides calendar:access, which the contract checks, the module requires the pair Customers'' own contact list does — customers:contacts-view and customers:associations-view — and answers 403 without both: the address is on this answer because its caller holds the key that guards it in Customers. 400 without a customerId; 404 when the directory knows no such customer.'
            operationId: getCalendarContacts
            parameters:
                - description: The customer whose contacts to list.
                  in: query
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CalendarContact'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — no customerId, or one that is not a number.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller lacks calendar:access, customers:contacts-view or customers:associations-view.
                "404":
                    description: Not Found — the customer directory knows no such customer. The body is empty.
            summary: A customer's contacts
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/feed:
        get:
            description: 'The caller''s calendar addresses (calendar feed design D1) — full before busy, a variant without one absent — each opened from its sealed copy for its owner alone, with when it was created or last reset and when it was last read, and whether they are on the public host. calendar:access''s, on the caller''s own rows.'
            operationId: getCalendarFeed
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedAddresses'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The caller's calendar addresses
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/feed/{file}:
        delete:
            description: Turns off the caller's address of one variant (calendar feed design D1); it answers 404 from this moment. The other variant's is untouched.
            operationId: deleteCalendarFeedByVariant
            parameters:
                - description: The variant, full or busy; anything else is the 404 an address the caller does not have gets. The segment is named file because the feed's GET shares this path, where it is the token's file.
                  in: path
                  name: file
                  required: true
                  schema:
                    $ref: '#/components/schemas/FeedVariant'
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the caller has no address of that variant, or the variant is neither full nor busy. The body is empty.
            summary: Turn off a calendar address
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        get:
            description: 'A calendar address''s iCalendar feed (calendar feed design D2–D4), for a calendar program to subscribe to. It is the module''s one anonymous GET with its token in the path: Google, Apple, Outlook and Thunderbird take one address and ask it, with no header and no body of ours. It is held to its mitigations. The token is stored only as its SHA-256 and found by it, so a database read answers no address. It is per person and per variant, and a reset kills it at once. It is rate limited to 120 per client address per 10 minutes (calendar-feed). A token nobody holds is the bare 404, and so is a file without the .ics suffix, and so is a token whose person may no longer act — disabled, locked out, pending, deactivated by the directory under SCIM, or without calendar:access — with nothing recorded, so the answer tells nothing apart. The feed carries nothing the person''s own calendar does not, and the busy variant nothing but spans. The path is logged as every path is, so the operator keeps the proxy''s access log to the path on the public host, or to nothing. A signed-in caller is answered alike, by the token and not the session. The calendar is today −3 months to today +12 months in the business time zone, series as rules, with no METHOD, ORGANIZER or ATTENDEE; its ETag is the SHA-256 of the calendar without its DTSTAMP lines, so an unchanged calendar keeps its tag, and an If-None-Match naming it, or *, is 304 with no body. A 200 or a 304 records when the address was last read.'
            operationId: getCalendarFeedByFile
            parameters:
                - description: The token with the .ics suffix, as one segment — the address's last.
                  in: path
                  name: file
                  required: true
                  schema:
                    type: string
                - description: An ETag this feed answered, or *. An unchanged calendar is 304.
                  in: header
                  name: If-None-Match
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        text/calendar; charset=utf-8:
                            schema:
                                format: binary
                                type: string
                    description: OK — the calendar.
                    headers:
                        Cache-Control:
                            description: private, no-cache — a program may keep the calendar, and must ask again.
                            schema:
                                type: string
                        Content-Disposition:
                            description: inline; filename="vantigo.ics".
                            schema:
                                type: string
                        ETag:
                            description: The quoted hex SHA-256 of the calendar with every DTSTAMP line removed.
                            schema:
                                type: string
                "304":
                    description: Not Modified — If-None-Match named the calendar's ETag, or *. The body is empty.
                    headers:
                        Cache-Control:
                            description: private, no-cache, as on the 200.
                            schema:
                                type: string
                        ETag:
                            description: The calendar's ETag, the one If-None-Match named.
                            schema:
                                type: string
                "404":
                    description: Not Found — no address holds that token, or the file does not end in .ics. The body is empty.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-feed's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Service Unavailable — a calendar source could not be read. The problem names no module.
            summary: A calendar address's feed
            tags:
                - Calendar
            x-vantigo-access: anonymous
        post:
            description: 'Creates the caller''s address of one variant (calendar feed design D1), or resets the one they have: a new token — 32 random bytes, stored only as its SHA-256 — and the whole address sealed, so the old address answers 404 from this moment and nothing has read the new one yet. Answers the address.'
            operationId: postCalendarFeedByVariant
            parameters:
                - description: The variant, full or busy; anything else is the 404 an address the caller does not have gets. The segment is named file because the feed's GET shares this path, where it is the token's file.
                  in: path
                  name: file
                  required: true
                  schema:
                    $ref: '#/components/schemas/FeedVariant'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FeedAddress'
                    description: OK — the address, new or reset.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the variant is neither full nor busy. The body is empty.
            summary: Create or reset a calendar address
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/items:
        get:
            description: 'The caller''s calendar in a window (calendar design D5): their appointments — owned, or attended with any status — expanded in their own zones with their exceptions applied, then every enabled module''s calendar source in module order, each under its own permission, then the caller''s subscriptions'' events as last fetched (calendar feed design D8), then the public holidays. A timed item is in the window when it overlaps from 00:00 to the end of to in timeZone; an all-day one when its dates overlap from..to.'
            operationId: getCalendarItems
            parameters:
                - description: The window's first day, inclusive, within ten years of today.
                  in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The window's last day, inclusive. The window is at most 93 days, both ends counted.
                  in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The viewer's IANA zone, in which the window's edges are judged. Absent means the business time zone.
                  in: query
                  name: timeZone
                  schema:
                    type: string
                - description: A comma-separated list of kinds to ask for (calendar.appointment, customers.follow-up, ...). Absent means every kind; a kind no source declares is ignored.
                  in: query
                  name: kinds
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CalendarItems'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — to before from, a window over 93 days, or a time zone that is not one.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Service Unavailable — a calendar source could not be read. The problem names no module.
            summary: The caller's calendar
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/mailbox-sync:
        get:
            description: The caller's Outlook sync (calendar Outlook sync design O5) — their setting, its state and its last sync, whether it can run and, when not, why, and the kinds they may choose.
            operationId: getCalendarMailboxSync
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MailboxSync'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The caller's Outlook sync
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
        put:
            description: 'Replaces the caller''s Outlook sync setting whole (calendar Outlook sync design O5). Turning it on, or keeping it on, while availability is not available is a 409 mailbox_sync_unavailable whose detail is the availability; turning it off is always taken. Turning it off, or changing the target, starts the clean-up of the copies already written (O8); every write makes the sync due at once. The first write turns the defaults into the caller''s row. Rate limited to 10 per client address in 10 minutes (calendar-mailbox-sync-write): each write makes a sync due.'
            operationId: putCalendarMailboxSync
            parameters:
                - description: The revision the setting was read at, bare (3) or quoted ("3"); 0 for a caller who never turned it on. A revision that has moved on is a 409 revision_mismatch.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MailboxSyncWrite'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MailboxSync'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Bad Request — field errors on the body (an unknown target, detail or kind), or an If-Match that is not a revision.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — revision_mismatch, or mailbox_sync_unavailable with the availability as its detail.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-mailbox-sync-write's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Change the caller's Outlook sync
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/mailbox-sync/run:
        post:
            description: 'Syncs the caller''s calendar now — the screen''s Sync now: the sync is made due at once and the worker takes it within a minute. It writes nothing of the setting, so the revision stays. 409 mailbox_sync_off while the sync is turned off, and 409 mailbox_sync_unavailable, with the availability as its detail, while it cannot run. Rate limited to 6 per client address a minute (calendar-mailbox-run).'
            operationId: postCalendarMailboxSyncRun
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MailboxSync'
                    description: OK — the setting as it now stands, due at once.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CalendarProblem'
                    description: Conflict — mailbox_sync_off, or mailbox_sync_unavailable with the availability as its detail.
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — calendar-mailbox-run's limit for this client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Sync the caller's calendar now
            tags:
                - Calendar
            x-vantigo-access: permission:calendar:access
    /api/v1/calendar/meta:
        get:
            description: The business time zone and today in it, whether the caller may see colleagues' calendars, whether invitations are mailed, and every kind the enabled modules' calendar sources declare — with calendar.subscription and calendar.outlook as CalendarMeta.sources says.
            operationId: getCalendarMeta
