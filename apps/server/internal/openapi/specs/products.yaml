components:
    schemas:
        CategoryRequest:
            properties:
                name:
                    type: string
                parentId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - name
            type: object
        CategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                parentId:
                    format: int32
                    nullable: true
                    type: integer
                productCount:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - productCount
            type: object
        PaginatedResponseOfProductResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/ProductResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        ProductCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        ProductPriceRequest:
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                validFrom:
                    format: date-time
                    nullable: true
                    type: string
                validTo:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - currency
                - amount
            type: object
        ProductPriceResponse:
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                id:
                    format: int32
                    type: integer
                validFrom:
                    format: date-time
                    nullable: true
                    type: string
                validTo:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - currency
                - amount
            type: object
        ProductRequest:
            properties:
                categoryId:
                    format: int32
                    nullable: true
                    type: integer
                description:
                    nullable: true
                    type: string
                name:
                    type: string
                status:
                    nullable: true
                    type: string
                taxCategoryId:
                    format: int32
                    type: integer
                type:
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/VariantRequest'
                    nullable: true
                    type: array
            required:
                - name
                - type
                - taxCategoryId
            type: object
        ProductResponse:
            properties:
                barcode:
                    nullable: true
                    type: string
                category:
                    allOf:
                        - $ref: '#/components/schemas/ProductCategoryResponse'
                    nullable: true
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                effectivePrices:
                    items:
                        $ref: '#/components/schemas/ProductPriceResponse'
                    type: array
                heightCm:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                name:
                    type: string
                sku:
                    nullable: true
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                status:
                    type: string
                taxCategory:
                    $ref: '#/components/schemas/ProductTaxCategoryResponse'
                type:
                    type: string
                unit:
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variants:
                    items:
                        $ref: '#/components/schemas/ProductVariantResponse'
                    type: array
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - name
                - type
                - status
                - taxCategory
                - effectivePrices
                - variants
                - createdAt
                - updatedAt
            type: object
        ProductStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        ProductStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        ProductStatsSummaryResponse:
            properties:
                from:
                    format: date-time
                    type: string
                newProducts:
                    format: int32
                    type: integer
                newProductsDelta:
                    format: int32
                    type: integer
                statusCountDeltas:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                statusCounts:
                    additionalProperties:
                        format: int64
                        type: integer
                    type: object
                to:
                    format: date-time
                    type: string
                totalActiveProducts:
                    format: int32
                    type: integer
                totalActiveProductsDelta:
                    format: int32
                    type: integer
            required:
                - from
                - to
                - totalActiveProducts
                - totalActiveProductsDelta
                - newProducts
                - newProductsDelta
                - statusCounts
                - statusCountDeltas
            type: object
        ProductTaxCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - rate
            type: object
        ProductVariantResponse:
            properties:
                barcode:
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                effectivePrices:
                    items:
                        $ref: '#/components/schemas/ProductPriceResponse'
                    type: array
                heightCm:
                    format: double
                    nullable: true
                    type: number
                id:
                    format: int32
                    type: integer
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                optionValues:
                    additionalProperties:
                        type: string
                    type: object
                sku:
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                unit:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - id
                - sku
                - unit
                - optionValues
                - effectivePrices
                - createdAt
                - updatedAt
            type: object
        TaxCategoryRequest:
            properties:
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - name
                - kind
                - rate
            type: object
        TaxCategoryResponse:
            properties:
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                rate:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - rate
            type: object
        VariantRequest:
            properties:
                barcode:
                    nullable: true
                    type: string
                heightCm:
                    format: double
                    nullable: true
                    type: number
                lengthCm:
                    format: double
                    nullable: true
                    type: number
                optionValues:
                    additionalProperties:
                        type: string
                    nullable: true
                    type: object
                prices:
                    items:
                        $ref: '#/components/schemas/ProductPriceRequest'
                    nullable: true
                    type: array
                sku:
                    type: string
                standardCost:
                    format: double
                    nullable: true
                    type: number
                unit:
                    nullable: true
                    type: string
                weightKg:
                    format: double
                    nullable: true
                    type: number
                widthCm:
                    format: double
                    nullable: true
                    type: number
            required:
                - sku
            type: object
info:
    title: Vantigo Products API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/products:
        get:
            operationId: getProducts
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: sortBy
                  schema:
                    type: string
                - in: query
                  name: sortDirection
                  schema:
                    type: string
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: categoryId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: uncategorized
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfProductResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all products
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-view+products:tax-categories-view+products:variants-view
        post:
            operationId: postProducts
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Create a new product
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-manage+products:tax-categories-view+products:variants-manage+products:variants-view
    /api/v1/products/{id}:
        delete:
            description: Marks the product as discontinued. Products are never hard-deleted because other services reference them.
            operationId: deleteProductsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a product
            tags:
                - Products
            x-vantigo-access: permission:products:products-manage
        get:
            operationId: getProduct
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a product by id
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-view+products:tax-categories-view+products:variants-view
        put:
            operationId: putProductsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Update a product
            tags:
                - Products
            x-vantigo-access: permission:products:categories-view+products:pricing-view+products:products-manage+products:tax-categories-view+products:variants-view
    /api/v1/products/{id}/variants:
        get:
            operationId: getProductsByIdVariants
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ProductVariantResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List variants of a product
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-view+products:variants-view
        post:
            operationId: postProductsByIdVariants
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VariantRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductVariantResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Add a variant to a product
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-view+products:variants-manage+products:variants-view
    /api/v1/products/{id}/variants/{variantId}:
        delete:
            operationId: deleteProductsByIdVariantsByVariantId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Remove a product variant
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-manage+products:variants-manage
        put:
            operationId: putProductsByIdVariantsByVariantId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VariantRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductVariantResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Update a product variant
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-manage+products:pricing-view+products:variants-manage+products:variants-view
    /api/v1/products/{id}/variants/{variantId}/prices:
        get:
            operationId: getProductsByIdVariantsByVariantIdPrices
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ProductPriceResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List prices of a variant
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-view
        post:
            operationId: postProductsByIdVariantsByVariantIdPrices
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductPriceRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductPriceResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Add a price to a variant
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-manage+products:pricing-view
    /api/v1/products/{id}/variants/{variantId}/prices/{priceId}:
        delete:
            operationId: deleteProductsByIdVariantsByVariantIdPricesByPriceId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: priceId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Remove a variant price
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-manage
        put:
            operationId: putProductsByIdVariantsByVariantIdPricesByPriceId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: priceId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProductPriceRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProductPriceResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Update a variant price
            tags:
                - Products
            x-vantigo-access: permission:products:pricing-manage+products:pricing-view
    /api/v1/products/categories:
        get:
            description: Returns the flat adjacency list; clients build the tree from parentId.
            operationId: getProductsCategories
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CategoryResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all categories
            tags:
                - Categories
            x-vantigo-access: permission:products:categories-view
        post:
            operationId: postProductsCategories
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CategoryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CategoryResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
