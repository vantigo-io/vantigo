components:
    schemas:
        AddressRequest:
            properties:
                city:
                    nullable: true
                    type: string
                countryCode:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                streetAddress:
                    nullable: true
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        AddressResponse:
            properties:
                city:
                    type: string
                countryCode:
                    type: string
                postalCode:
                    type: string
                streetAddress:
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        ConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        ConsumptionImportError:
            description: One problem with one row of a consumption import. row is the row's number as the import counts it (the first row under the header is 1, blank rows take no number); column is the 0-based index of the file column the offending cell is in, absent for a problem with the row as a whole (an interval the file repeats, an end not after its start).
            properties:
                column:
                    format: int32
                    type: integer
                message:
                    type: string
                row:
                    format: int32
                    type: integer
            required:
                - row
                - message
            type: object
        ConsumptionImportMapping:
            description: "Which columns of a consumption file hold what (energy import design D8), each a 0-based column of the file. start and quantityKwh are required; exactly one of end (a column) and resolution (PT1H or PT15M: the end is the start plus that length) is given; quality is optional (every row Measured when unmapped); gsrn is optional and, when mapped, every row must name this metering point. A column holds one field at most. As the server suggests it, any field it found no column for is absent, and resolution is PT1H when no end column was found."
            properties:
                end:
                    format: int32
                    type: integer
                gsrn:
                    format: int32
                    type: integer
                quality:
                    format: int32
                    type: integer
                quantityKwh:
                    format: int32
                    type: integer
                resolution:
                    enum:
                        - PT1H
                        - PT15M
                    type: string
                start:
                    format: int32
                    type: integer
            type: object
        ConsumptionImportResult:
            description: "What a consumption import read and did (energy import design D8). header, sample (the first ten rows), rows (the number of data rows) and suggested (the mapping proposed from the header) are answered on every call, with the encoding and the separator the file was read with. evaluated is false when no mapping was sent: the file was only read, and the counts are zero. Otherwise new, replacing and unchanged count the rows without an error — new where no current interval has the row's start and end, replacing where one has them with another quantity or quality, unchanged where one has them with the same quantity and quality — and rangeStart and rangeEnd are the earliest start and the latest end among them. errorCount counts every problem found, errors lists the first 200 in file order. imported is true only when the readings were written: a run (dryRun=false) with no error, all of them in one transaction."
            properties:
                dryRun:
                    type: boolean
                encoding:
                    type: string
                errorCount:
                    format: int32
                    type: integer
                errors:
                    items:
                        $ref: '#/components/schemas/ConsumptionImportError'
                    type: array
                evaluated:
                    type: boolean
                header:
                    items:
                        type: string
                    type: array
                imported:
                    type: boolean
                new:
                    format: int32
                    type: integer
                rangeEnd:
                    format: date-time
                    type: string
                rangeStart:
                    format: date-time
                    type: string
                replacing:
                    format: int32
                    type: integer
                rows:
                    format: int32
                    type: integer
                sample:
                    items:
                        $ref: '#/components/schemas/ConsumptionImportSampleRow'
                    type: array
                separator:
                    type: string
                suggested:
                    $ref: '#/components/schemas/ConsumptionImportMapping'
                unchanged:
                    format: int32
                    type: integer
            required:
                - dryRun
                - evaluated
                - imported
                - encoding
                - separator
                - header
                - sample
                - rows
                - suggested
                - new
                - replacing
                - unchanged
                - errorCount
                - errors
            type: object
        ConsumptionImportSampleRow:
            description: One of the first rows of a consumption file, as the file has it.
            properties:
                cells:
                    items:
                        type: string
                    type: array
                row:
                    format: int32
                    type: integer
            required:
                - row
                - cells
            type: object
        ConsumptionResponse:
            properties:
                end:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quality:
                    description: Measured, Estimated, Corrected or Manual.
                    type: string
                quantityKwh:
                    format: double
                    type: number
                receivedAt:
                    format: date-time
                    type: string
                source:
                    description: Where the interval came from — Manual (added by hand), Import (a consumption import from a file) or Elhub.
                    type: string
                start:
                    format: date-time
                    type: string
            required:
                - id
                - meteringPointId
                - start
                - end
                - quantityKwh
                - quality
                - source
                - receivedAt
            type: object
        CreateSupplyPeriodRequest:
            properties:
                cadence:
                    description: The billing cadence, monthly (the default when absent), quarterly or yearly.
                    nullable: true
                    type: string
                customerId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
                tariffId:
                    description: An active power tariff, or null for none (the period is then not priced).
                    format: int32
                    nullable: true
                    type: integer
            required:
                - customerId
                - start
            type: object
        CustomerConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - meteringPointId
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        CustomerMeteringPointResponse:
            properties:
                meteringPoint:
                    $ref: '#/components/schemas/MeteringPointResponse'
                supplyPeriods:
                    items:
                        $ref: '#/components/schemas/SupplyPeriodResponse'
                    type: array
            required:
                - meteringPoint
                - supplyPeriods
            type: object
        EndSupplyPeriodRequest:
            properties:
                end:
                    format: date-time
                    type: string
            required:
                - end
            type: object
        EnergyImport:
            description: An import of metering points from a file (energy import design D3, D6, D7), the customers import's record with energy's counts. state is draft (uploaded, mapping being made), checking (the worker runs the dry run), checked (the dry run finished; the counts and the failed rows are on the import), importing (the worker runs the real run), done (finishedAt set; when it was stopped, processed short of rows) or attaching (the worker attaches the pending rows' points to their customers from attachStart, then the import is done again). encoding is utf-8 or windows-1252, separator the one character the header was split on. header is the file's header row as written; sample the first twenty rows, each with the errors its cells get under the saved mapping. mapping is absent until PUT …/mapping saved one; suggested is the mapping the server proposes, answered on every read. processed, created, updated, failed and skipped are the worker's progress while it runs and the recounted totals once it has finished; skipped counts the totals lines (a row with no GSRN and at most one other non-blank cell). switched counts the rows whose point switched customer (or, after a check, would), pending the rows matched to a customer and not yet attached, pendingSwitches the pending rows whose point was another customer's when the run wrote them, attached the pending rows attached since. error is a whole-run failure the worker met and will retry next cycle. createdByName is the uploader's display name. requestedAt is when the check, the run or the attach was asked for, startedAt when the worker took it up.
            properties:
                attachStart:
                    format: date-time
                    type: string
                attached:
                    format: int32
                    type: integer
                created:
                    format: int32
                    type: integer
                createdAt:
                    format: date-time
                    type: string
                createdByName:
                    type: string
                encoding:
                    type: string
                error:
                    type: string
                failed:
                    format: int32
                    type: integer
                fileName:
                    type: string
                finishedAt:
                    format: date-time
                    type: string
                header:
                    items:
                        type: string
                    type: array
                id:
                    format: int32
                    type: integer
                mapping:
                    $ref: '#/components/schemas/EnergyImportMapping'
                pending:
                    format: int32
                    type: integer
                pendingSwitches:
                    format: int32
                    type: integer
                processed:
                    format: int32
                    type: integer
                requestedAt:
                    format: date-time
                    type: string
                rows:
                    format: int32
                    type: integer
                sample:
                    items:
                        $ref: '#/components/schemas/EnergyImportSampleRow'
                    type: array
                separator:
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                skipped:
                    format: int32
                    type: integer
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - draft
                        - checking
                        - checked
                        - importing
                        - done
                        - attaching
                    type: string
                stopRequested:
                    type: boolean
                suggested:
                    $ref: '#/components/schemas/EnergyImportMapping'
                switched:
                    format: int32
                    type: integer
                updated:
                    format: int32
                    type: integer
            required:
                - id
                - state
                - fileName
                - sizeBytes
                - encoding
                - separator
                - rows
                - header
                - sample
                - suggested
                - processed
                - created
                - updated
                - failed
                - skipped
                - switched
                - pending
                - pendingSwitches
                - attached
                - stopRequested
                - createdAt
            type: object
        EnergyImportAttachRequest:
            description: Attaches an import's pending rows to their customers (energy import design D6). start is the date every period starts from, a UTC timestamp as the Assign customer dialog sends. confirmSwitches is how many of the pending points will switch customer — those whose active supply period is another customer's now — and must equal that number exactly when it is not zero.
            properties:
                confirmSwitches:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
            required:
                - start
            type: object
        EnergyImportConflictProblem:
            description: "ProblemDetails plus the import's conflict code (energy import design D7) — the one place the energy module answers a code: import_running (the worker is checking, importing or attaching it), import_not_checked (a run on a draft), import_nothing_to_import (a run on a check that found nothing to create or update), import_finished (a mapping, a check or a run on a done import, or a stop with nothing running), import_switch_not_confirmed (a run or an attach whose confirmSwitches is not the number of points that will switch customer) and import_nothing_pending (an attach on an import with no pending row, or one that is not done)."
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                switches:
                    description: For import_switch_not_confirmed, the number of points that will switch customer.
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        EnergyImportMapping:
            description: "How an import's rows become metering points (energy import design D3). mode: create makes every row a new point and refuses a GSRN on file; update finds the point by GSRN and refuses a row that finds none; createOrUpdate updates a row that finds one and creates from a row that finds none. Rows are always matched by gsrn. columns maps the fields: a field at most once, a column at most once, each entry a column of the file or a fixed value for every row."
            properties:
                columns:
                    items:
                        $ref: '#/components/schemas/EnergyImportMappingColumn'
                    type: array
                mode:
                    enum:
                        - create
                        - update
                        - createOrUpdate
                    type: string
            required:
                - mode
                - columns
            type: object
        EnergyImportMappingColumn:
            description: "One field of a mapping (energy import design D3): field is one of gsrn, meterNumber, streetAddress, postalCode, city, countryCode, priceArea, gridArea, expectedAnnualConsumptionKwh, latitude, longitude, connectionStatus, customerLegalId and supplyStart — and exactly one of column (the 0-based column of the file it is read from) and value (the same text for every row, read as a cell would be; gsrn takes none)."
            properties:
                column:
                    format: int32
                    type: integer
                field:
                    type: string
                value:
                    type: string
            required:
                - field
            type: object
        EnergyImportRow:
            description: One row of an import with what the worker did with it (energy import design D4, D7). cells are the row's cells as the file had them; outcome is absent for a row not yet run; meteringPointId and gsrn name the point the row created or updated (no id for a point a check would create); link is what the row did about its customer — none (no organisation number), same (the point is already that customer's), assigned, switched, pending (matched, not yet attached) or attached (attached afterwards); customerId and customerName the customer the organisation number resolved to, switchFromCustomerId and switchFromCustomerName the customer the point was supplied to before a switch (or, on a pending row, is supplied to); supplyStart the date the period was or will be written from. errors are a failed row's problems, a pending row's attach error, or a skipped row's reason.
            properties:
                cells:
                    items:
                        type: string
                    type: array
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                errors:
                    items:
                        $ref: '#/components/schemas/EnergyImportRowError'
                    type: array
                gsrn:
                    type: string
                link:
                    enum:
                        - none
                        - same
                        - assigned
                        - switched
                        - pending
                        - attached
                    type: string
                meteringPointId:
                    format: int32
                    type: integer
                outcome:
                    enum:
                        - created
                        - updated
                        - failed
                        - skipped
                    type: string
                row:
                    format: int32
                    type: integer
                supplyStart:
                    format: date-time
                    type: string
                switchFromCustomerId:
                    format: int32
                    type: integer
                switchFromCustomerName:
                    type: string
            required:
                - row
                - cells
                - errors
            type: object
        EnergyImportRowError:
            description: One problem with one row of an import. column is the 0-based index of the file column the offending cell is in, absent for a problem with the row as a whole or with a fixed value. message is the module's own validation wording.
            properties:
                column:
                    format: int32
                    type: integer
                message:
                    type: string
            required:
                - message
            type: object
        EnergyImportRunRequest:
            description: The run of a checked import (energy import design D4). confirmSwitches is how many points the run will switch customer, and must equal the check's switched exactly when that is not zero; absent is zero.
            properties:
                confirmSwitches:
                    format: int32
                    type: integer
            type: object
        EnergyImportSampleRow:
            description: One of the first rows of an import as the preview shows it, with the errors its cells get under the saved mapping — planned through the endpoints' own validators, no database asked.
            properties:
                cells:
                    items:
                        type: string
                    type: array
                errors:
                    items:
                        $ref: '#/components/schemas/EnergyImportRowError'
                    type: array
                row:
                    format: int32
                    type: integer
            required:
                - row
                - cells
                - errors
            type: object
        EnergyPaginationMetadata:
            properties:
                page:
                    format: int32
                    type: integer
                pageSize:
                    format: int32
                    type: integer
                totalCount:
                    format: int32
                    type: integer
                totalPages:
                    format: int32
                    type: integer
            required:
                - page
                - pageSize
                - totalCount
                - totalPages
            type: object
        EnergyStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        EnergyStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            type: object
        EnergyStatsSummaryResponse:
            properties:
                activeSupplyPeriods:
                    format: int32
                    type: integer
                activeSupplyPeriodsDelta:
                    format: int32
                    type: integer
                consumptionKwh:
                    format: double
                    type: number
                consumptionKwhDelta:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                meteringPointCount:
                    format: int32
                    type: integer
                meteringPointCountDelta:
                    format: int32
                    type: integer
                previousConsumptionKwh:
                    format: double
                    type: number
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - meteringPointCount
                - meteringPointCountDelta
                - activeSupplyPeriods
                - activeSupplyPeriodsDelta
                - consumptionKwh
                - consumptionKwhDelta
                - previousConsumptionKwh
            type: object
        ManualConsumptionRequest:
            properties:
                end:
                    format: date-time
                    type: string
                quantityKwh:
                    format: double
                    type: number
                start:
                    format: date-time
                    type: string
            required:
                - start
                - end
                - quantityKwh
            type: object
        MeterResponse:
            properties:
                id:
                    format: int32
                    type: integer
                installedAt:
                    format: date-time
                    type: string
                meterNumber:
                    type: string
                meteringPointId:
                    format: int32
                    type: integer
                removedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - meteringPointId
                - meterNumber
                - installedAt
                - removedAt
            type: object
        MeteringPointRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                electricityTaxClass:
                    description: ordinary (the default when absent), reduced or exempt.
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gridTariffId:
                    description: An active grid tariff, or null for none. The PUT is a full replace, so absent means none; a tariff the point already holds is kept even when archived.
                    format: int32
                    nullable: true
                    type: integer
                gsrn:
                    nullable: true
                    type: string
                household:
                    description: Supplied for household use; absent means false.
                    nullable: true
                    type: boolean
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - meterNumber
                - address
                - priceArea
            type: object
        MeteringPointResponse:
            description: A metering point. household, electricityTaxClass and vatTreatment (energy consumption billing design D3, D4) are always sent; gridTariffId and gridTariffName are sent when the point has a grid tariff and left out when it has none. The schema leaves all five optional because the recorded .NET exchanges predate them.
            properties:
                address:
                    $ref: '#/components/schemas/AddressResponse'
                connectionStatus:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                electricityTaxClass:
                    description: ordinary, reduced or exempt (energy consumption billing design D4).
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gridTariffId:
                    description: The installation's own grid tariff for the point; left out when it has none, as when the grid company bills grid services itself.
                    format: int32
                    nullable: true
                    type: integer
                gridTariffName:
                    description: The grid tariff's name; left out without one.
                    nullable: true
                    type: string
                gsrn:
                    type: string
                household:
                    description: Supplied for household use (mvaf § 6-6-1), set by hand.
                    type: boolean
                id:
                    format: int32
                    type: integer
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                vatTreatment:
                    description: "Derived, never stored: exempt_household_north when household is set, the country is NO and the postal code is 8000–9999; otherwise standard. A hint Invoices maps to a VAT code."
                    type: string
            required:
                - id
                - gsrn
                - meterNumber
                - address
                - priceArea
                - gridArea
                - expectedAnnualConsumptionKwh
                - latitude
                - longitude
                - connectionStatus
                - createdAt
                - updatedAt
            type: object
        MeteringPointUpdateRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                electricityTaxClass:
                    description: ordinary (the default when absent), reduced or exempt.
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gridTariffId:
                    description: An active grid tariff, or null for none. The PUT is a full replace, so absent means none; a tariff the point already holds is kept even when archived.
                    format: int32
                    nullable: true
                    type: integer
                gsrn:
                    nullable: true
                    type: string
                household:
                    description: Supplied for household use; absent means false.
                    nullable: true
                    type: boolean
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - address
                - priceArea
            type: object
        PaginatedResponseOfEnergyImport:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/EnergyImport'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfEnergyImportRow:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/EnergyImportRow'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfMeteringPointResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/MeteringPointResponse'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        ReplaceMeterRequest:
            properties:
                installedAt:
                    format: date-time
                    nullable: true
                    type: string
                meterNumber:
                    nullable: true
                    type: string
            required:
                - meterNumber
                - installedAt
            type: object
        SettlementInvoice:
            description: The invoice a settlement was stamped by.
            properties:
                id:
                    format: int64
                    type: integer
                invoicedAt:
                    format: date-time
                    type: string
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
                releasedAt:
                    description: When a credit note returned the settlement; left out while it is invoiced.
                    format: date-time
                    type: string
            required:
                - id
                - number
                - issueDate
                - invoicedAt
            type: object
        SettlementLine:
            description: One priced element of a settlement, in the order it prints.
            properties:
                amount:
                    description: Two decimals, NOK; negative allowed on a correction.
                    format: double
                    type: number
                band:
                    description: day or night for a grid energy component with a night rate; left out otherwise.
                    type: string
                kind:
                    description: The tariff component's kind (spot_energy, fixed_energy, markup, monthly_fee, grid_energy, grid_capacity, grid_fixed, electricity_tax, enova_levy).
                    type: string
                month:
                    description: The calendar month (its first day) a grid capacity line prices; left out otherwise.
                    format: date
                    type: string
                quantity:
                    description: Three decimals, in unit.
                    format: double
                    type: number
                text:
                    description: The tariff component's name.
                    type: string
                unit:
                    description: kWh, month, year or pcs.
                    type: string
                unitPrice:
                    description: Six decimals, NOK per unit.
                    format: double
                    type: number
                vatHint:
                    description: standard or exempt_household_north.
                    type: string
            required:
                - kind
                - text
                - quantity
                - unit
                - unitPrice
                - amount
                - vatHint
            type: object
        SettlementResponse:
            description: What the supply period's customer owes for the metering point over one billing period (energy consumption billing design D5). A period nobody has settled yet is computed for the answer and has no id or revision.
            properties:
                amount:
                    description: The sum of the lines, two decimals, NOK; 0 when blocked.
                    format: double
                    type: number
                blocked:
                    description: Why the period cannot be invoiced (period_open, no_tariff, no_consumption, incomplete, price_gap, price_preliminary); left out when it can.
                    type: string
                blockedDetail:
                    description: The blocker's sentence; left out when not blocked.
                    type: string
                contractName:
                    description: The power tariff's name.
                    type: string
                correctsId:
                    description: A correction's invoiced original; left out on a regular settlement.
                    format: int64
                    type: integer
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                estimated:
                    description: Whether any interval of the period is an estimate.
                    type: boolean
                id:
                    description: The stored settlement; left out for a period computed for this answer.
                    format: int64
                    type: integer
                invoice:
                    $ref: '#/components/schemas/SettlementInvoice'
                kind:
                    description: regular or correction.
                    type: string
                kwh:
                    description: Three decimals; a correction's is the difference.
                    format: double
                    type: number
                lines:
                    items:
                        $ref: '#/components/schemas/SettlementLine'
                    type: array
                meteringPointId:
                    format: int32
                    type: integer
                missingIntervals:
                    description: How many intervals the period lacks; 0 is complete.
                    format: int32
                    type: integer
                periodEnd:
                    description: The period's end, exclusive.
                    format: date-time
                    type: string
                periodStart:
                    format: date-time
                    type: string
                revision:
                    description: The stored settlement's revision; left out with the id.
                    format: int32
                    type: integer
                state:
                    description: draft, invoiced or released.
                    type: string
                supplyPeriodId:
                    format: int32
                    type: integer
            required:
                - kind
                - supplyPeriodId
                - meteringPointId
                - customerId
                - periodStart
                - periodEnd
                - kwh
                - estimated
                - missingIntervals
                - currency
                - lines
                - amount
                - contractName
                - state
            type: object
        SpotPriceCoverage:
            description: What the installation holds of day-ahead prices, per price area (energy consumption billing design D2), for the Prices page — every area a metering point with a supply period is in, every area already priced and, with the spot-price service as the source, every area the service follows (spot-price service design S4). source is where the installation's worker fetches prices from — service (the shared spot-price service), feed (the public feed) or none (files only).
            properties:
                areas:
                    items:
                        $ref: '#/components/schemas/SpotPriceCoverageArea'
                    type: array
                source:
                    description: service, feed or none.
                    type: string
            required:
                - source
                - areas
            type: object
        SpotPriceCoverageArea:
            description: One area's coverage. firstStart and lastEnd bound what is stored and are absent for an area with no prices; daysMissingLast30 counts the civil days (Europe/Oslo) among the last thirty, today included, with no price interval starting in them; lastFetch is the feed worker's most recent attempt for the area, absent when the worker never tried it.
            properties:
                daysMissingLast30:
                    format: int32
                    type: integer
                firstStart:
                    format: date-time
                    type: string
                intervalCount:
                    format: int64
                    type: integer
                lastEnd:
                    format: date-time
                    type: string
                followedByService:
                    description: With the spot-price service as the source, whether the service follows the area, as its last answer of its areas said; absent with another source or before the worker has asked.
                    type: boolean
                history:
                    $ref: '#/components/schemas/SpotPriceHistory'
                lastFetch:
                    $ref: '#/components/schemas/SpotPriceFetch'
                priceArea:
                    type: string
                resolution:
                    description: The length of the area's latest stored interval as an ISO 8601 duration, PT15M or PT60M; absent for an area with no prices.
                    type: string
            required:
                - priceArea
                - intervalCount
                - daysMissingLast30
            type: object
        SpotPriceFetch:
            description: "The feed worker's record of one area and civil day: ok once the day's prices are stored; pending while today's or tomorrow's are not yet published; missing for a past day the feed has no file for; failed for anything else, with the failure's sentence in error (never the response's body). attempts counts the requests made since the record last changed status, so a day pending for hours and then missing starts its seven missing attempts from one."
            properties:
                attemptedAt:
                    format: date-time
                    type: string
                attempts:
                    format: int32
                    type: integer
                day:
                    format: date
                    type: string
                error:
                    type: string
                nextAttemptAt:
                    format: date-time
                    type: string
                status:
                    description: ok, pending, missing or failed.
                    type: string
            required:
                - day
                - status
                - attempts
            type: object
        SpotPriceHistory:
            description: "The spot-price service sync's walk back through an area's history (spot-price service design S5): cursorDay is the oldest civil day (Europe/Oslo) copied so far, floorDay the oldest the service holds; complete once the cursor has reached the floor. daysSkipped counts the days the service held incompletely, without a NOK price, or over an imported day at another resolution, and the days of a window it failed permanently three times in a row — left for a file. error is the last failed window's sentence while the walk waits to retry, or after a skipped window until the next window is copied. It is kept for an area the service no longer follows."
            properties:
                complete:
                    type: boolean
                cursorDay:
                    format: date
                    type: string
                daysSkipped:
                    format: int32
                    type: integer
                error:
                    type: string
                floorDay:
                    format: date
                    type: string
            required:
                - complete
                - daysSkipped
            type: object
        SpotPriceImportArea:
            description: What a spot price import did for one area, counting the rows without an error — inserted where no interval with the row's start was stored, replaced where one was with other figures, unchanged where one was with the same — and the range the rows cover.
            properties:
                inserted:
                    format: int32
                    type: integer
                priceArea:
                    type: string
                rangeEnd:
                    format: date-time
                    type: string
                rangeStart:
                    format: date-time
                    type: string
                replaced:
                    format: int32
                    type: integer
                unchanged:
                    format: int32
                    type: integer
            required:
                - priceArea
                - inserted
                - replaced
                - unchanged
            type: object
        SpotPriceImportError:
            description: One problem with one row of a spot price import. row is the row's number as the import counts it (the first row under the header is 1, blank rows take no number); column is the 0-based index of the file column the offending cell is in, absent for a problem with the row as a whole.
            properties:
                column:
                    format: int32
                    type: integer
                message:
                    type: string
                row:
                    format: int32
                    type: integer
            required:
                - row
                - message
            type: object
        SpotPriceImportResult:
            description: What a spot price import read and did (energy consumption billing design D2). rows is the number of data rows; errorCount counts every problem found and errors lists the first 200 in file order; areas is the file's areas with their counts and ranges, over the rows without an error. imported is true only when the prices were written — a run (dryRun=false) with no error, every row in one transaction.
            properties:
                areas:
                    items:
                        $ref: '#/components/schemas/SpotPriceImportArea'
                    type: array
                dryRun:
                    type: boolean
                errorCount:
                    format: int32
                    type: integer
                errors:
                    items:
                        $ref: '#/components/schemas/SpotPriceImportError'
                    type: array
                imported:
                    type: boolean
                rows:
                    format: int32
                    type: integer
            required:
                - dryRun
                - imported
                - rows
                - errorCount
                - errors
                - areas
            type: object
        SpotPriceInterval:
            description: One day-ahead price interval of a price area, half-open [start, end), at the resolution the source gave (hourly from the public feed, a quarter of an hour from the spot-price service since 2025-10-01). nokPerKwh is the price a settlement uses; eurPerKwh and exchangeRate are present when the source gave them. source is Feed (the public feed), Service (the spot-price service) or Import (a file). state is final or preliminary — a settlement prices only from final intervals. upstream, rateSource and upstreamVersion are the service's provenance for a Service interval — its own source (nordpool_portal, entsoe, hks), whose EUR/NOK rate gave the NOK figure (nordpool, norges_bank) and its version of the interval.
            properties:
                end:
                    format: date-time
                    type: string
                eurPerKwh:
                    format: double
                    type: number
                exchangeRate:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                nokPerKwh:
                    format: double
                    type: number
                priceArea:
                    type: string
                rateSource:
                    type: string
                source:
                    description: Feed, Service or Import.
                    type: string
                start:
                    format: date-time
                    type: string
                state:
                    description: final or preliminary.
                    type: string
                upstream:
                    type: string
                upstreamVersion:
                    format: int32
                    type: integer
            required:
                - id
                - priceArea
                - start
                - end
                - nokPerKwh
                - source
                - state
            type: object
        SpotPriceSummary:
            description: One price area's prices summarised per bucket (spot-price service design S8). timeZone is the zone the buckets are civil periods of, Europe/Oslo.
            properties:
                bucket:
                    description: hour, day, week or month.
                    type: string
                buckets:
                    items:
                        $ref: '#/components/schemas/SpotPriceSummaryBucket'
                    type: array
                priceArea:
                    type: string
                timeZone:
                    type: string
            required:
                - priceArea
                - bucket
                - timeZone
                - buckets
            type: object
        SpotPriceSummaryBucket:
            description: One civil hour, day, ISO week or month [start, end) of an area's prices. avgNokPerKwh is time-weighted over the stored intervals starting in it; minNokPerKwh and maxNokPerKwh are the lowest and highest of them; coveredMinutes is the minutes they cover, less than the bucket's length where days are missing; preliminary is true when any of them is preliminary.
            properties:
                avgNokPerKwh:
                    format: double
                    type: number
                coveredMinutes:
                    format: int32
                    type: integer
                end:
                    format: date-time
                    type: string
                maxNokPerKwh:
                    format: double
                    type: number
                minNokPerKwh:
                    format: double
                    type: number
                preliminary:
                    type: boolean
                start:
                    format: date-time
                    type: string
            required:
                - start
                - end
                - avgNokPerKwh
                - minNokPerKwh
                - maxNokPerKwh
                - coveredMinutes
                - preliminary
            type: object
        SupplyPeriodResponse:
            description: A supply period. cadence (energy consumption billing design D4) is always sent; tariffId and tariffName (D3) are sent when the period has a power tariff and left out when it has none. The schema leaves all three optional because the recorded .NET exchanges predate them.
            properties:
                cadence:
                    description: monthly, quarterly or yearly.
                    type: string
                customerId:
                    format: int32
                    type: integer
                end:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
                status:
                    type: string
                tariffId:
                    description: The period's power tariff; left out when it has none.
                    format: int32
                    nullable: true
                    type: integer
                tariffName:
                    description: The power tariff's name; left out without one.
                    nullable: true
                    type: string
            required:
                - id
                - meteringPointId
                - customerId
                - start
                - end
                - status
            type: object
        SwitchSupplyPeriodRequest:
            properties:
                cadence:
                    description: The billing cadence, monthly (the default when absent), quarterly or yearly.
                    nullable: true
                    type: string
                customerId:
                    format: int32
                    type: integer
                switchAt:
                    format: date-time
                    type: string
                tariffId:
                    description: An active power tariff, or null for none (the period is then not priced).
                    format: int32
                    nullable: true
                    type: integer
            required:
                - customerId
                - switchAt
            type: object
        SwitchSupplyPeriodResponse:
            properties:
                endedPeriod:
                    allOf:
                        - $ref: '#/components/schemas/SupplyPeriodResponse'
                    nullable: true
                newPeriod:
                    $ref: '#/components/schemas/SupplyPeriodResponse'
            required:
                - endedPeriod
                - newPeriod
            type: object
        Tariff:
            description: "A tariff (energy consumption billing design D3): a power tariff is the supplier's contract, assigned to supply periods; a grid tariff is the installation's own, assigned to metering points. versions are in validFrom order, each with its components in position order."
            properties:
                createdAt:
                    format: date-time
                    type: string
                description:
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                kind:
                    description: power or grid.
                    type: string
                name:
                    description: What a settlement prints as the contract's name (§ 7-2 d).
                    type: string
                status:
                    description: active or archived. An archived tariff cannot be assigned anew, and still prices the periods it is assigned to.
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                usage:
                    $ref: '#/components/schemas/TariffUsage'
                versions:
                    items:
                        $ref: '#/components/schemas/TariffVersion'
                    type: array
            required:
                - id
                - kind
                - name
                - description
                - status
                - createdAt
                - updatedAt
                - usage
                - versions
            type: object
        TariffComponent:
            description: One priced element of a version. A field the kind does not use is null; see TariffComponentRequest for which kind uses which.
            properties:
                dayFrom:
                    format: int32
                    nullable: true
                    type: integer
                dayTo:
                    format: int32
                    nullable: true
                    type: integer
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                position:
                    description: The component's place in its version, from 0; the order the lines print in.
                    format: int32
                    type: integer
                rate:
                    format: double
                    nullable: true
                    type: number
                rateBusiness:
                    format: double
                    nullable: true
                    type: number
                rateNight:
                    format: double
                    nullable: true
                    type: number
                rateReduced:
                    format: double
                    nullable: true
                    type: number
                tiers:
                    items:
                        $ref: '#/components/schemas/TariffTier'
                    nullable: true
                    type: array
                weekdaysOnly:
                    type: boolean
            required:
                - id
                - position
                - kind
                - name
                - rate
                - rateNight
                - dayFrom
                - dayTo
                - weekdaysOnly
                - tiers
                - rateReduced
                - rateBusiness
            type: object
        TariffComponentRequest:
            description: "One component. kind is one of spot_energy, fixed_energy, markup, monthly_fee (a power tariff's) or grid_energy, grid_capacity, grid_fixed, electricity_tax, enova_levy, monthly_fee (a grid tariff's). The fields each kind needs: spot_energy none; fixed_energy and markup rate (NOK/kWh); monthly_fee and grid_fixed rate (NOK/month); grid_energy rate (the day rate, NOK/kWh) and optionally rateNight with dayFrom, dayTo (whole hours, 0 ≤ dayFrom < dayTo ≤ 24) and weekdaysOnly, all or none; grid_capacity tiers; electricity_tax rate (ordinary) and rateReduced; enova_levy rate (household, NOK/kWh) and rateBusiness (NOK/year). A field the kind does not use must be null or absent. Rates are 0 ≤ rate < 1 000 000, stored to six decimals."
            properties:
                dayFrom:
                    format: int32
                    nullable: true
                    type: integer
                dayTo:
                    format: int32
                    nullable: true
                    type: integer
                kind:
                    nullable: true
                    type: string
                name:
                    description: The line's text, 1–80 characters.
                    nullable: true
                    type: string
                rate:
                    format: double
                    nullable: true
                    type: number
                rateBusiness:
                    format: double
                    nullable: true
                    type: number
                rateNight:
                    format: double
                    nullable: true
                    type: number
                rateReduced:
                    format: double
                    nullable: true
                    type: number
                tiers:
                    items:
                        $ref: '#/components/schemas/TariffTier'
                    nullable: true
                    type: array
                weekdaysOnly:
                    nullable: true
                    type: boolean
            required:
                - kind
                - name
            type: object
        TariffRequest:
            description: "A tariff's header and every version with its components, in one body (POST creates, PUT replaces). A power tariff's version holds exactly one of spot_energy and fixed_energy; at most one each of grid_energy, grid_capacity, electricity_tax and enova_levy per version. A tariff has at least one version, a version at least one component, and two versions never overlap. A refusal names the place: versions[i].components[j].field."
            properties:
                description:
                    description: At most 500 characters.
                    nullable: true
                    type: string
                kind:
                    description: power or grid; on a PUT, the stored kind (a tariff's kind cannot be changed).
                    nullable: true
                    type: string
                name:
                    description: 1–120 characters.
                    nullable: true
                    type: string
                versions:
                    items:
                        $ref: '#/components/schemas/TariffVersionRequest'
                    nullable: true
                    type: array
            required:
                - kind
                - name
                - versions
            type: object
        TariffSummary:
            description: A tariff as the list shows it, with the version valid today (Europe/Oslo), null when none is.
            properties:
                createdAt:
                    format: date-time
                    type: string
                currentVersion:
                    allOf:
                        - $ref: '#/components/schemas/TariffValidity'
                    nullable: true
                description:
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                kind:
                    type: string
                name:
                    type: string
                status:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                usage:
                    $ref: '#/components/schemas/TariffUsage'
                versionCount:
                    format: int32
                    type: integer
            required:
                - id
                - kind
                - name
                - description
                - status
                - createdAt
                - updatedAt
                - versionCount
                - currentVersion
                - usage
            type: object
        TariffTier:
            description: A capacity step (kapasitetsledd) from fromKw, the average of the month's three highest hourly kWh on three different days, at perMonth NOK a month. Tiers ascend strictly from 0; at most 50.
            properties:
                fromKw:
                    format: double
                    type: number
                perMonth:
                    format: double
                    type: number
            required:
                - fromKw
                - perMonth
            type: object
        TariffUsage:
            description: How many supply periods (of any status) and metering points name the tariff; a tariff named by any cannot be deleted.
            properties:
                meteringPoints:
                    format: int32
                    type: integer
                supplyPeriods:
                    format: int32
                    type: integer
            required:
                - supplyPeriods
                - meteringPoints
            type: object
        TariffValidity:
            properties:
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    nullable: true
                    type: string
            required:
                - validFrom
                - validTo
            type: object
        TariffVersion:
            description: A version applies on the civil days [validFrom, validTo) in the point's market time zone; validTo null is open-ended.
            properties:
                components:
                    items:
                        $ref: '#/components/schemas/TariffComponent'
                    type: array
                id:
                    format: int32
                    type: integer
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    nullable: true
                    type: string
            required:
                - id
                - validFrom
                - validTo
                - components
            type: object
        TariffVersionRequest:
            properties:
                components:
                    items:
                        $ref: '#/components/schemas/TariffComponentRequest'
                    nullable: true
                    type: array
                validFrom:
                    format: date
                    nullable: true
                    type: string
                validTo:
                    description: The first day the version no longer applies; null or absent is open-ended.
                    format: date
                    nullable: true
                    type: string
            required:
                - validFrom
                - components
            type: object
        UpdateSupplyPeriodTermsRequest:
            description: A supply period's terms, nothing else of it.
            properties:
                cadence:
                    description: monthly (the default when absent), quarterly or yearly.
                    nullable: true
                    type: string
                tariffId:
                    description: An active power tariff (or the one the period already holds, even archived), or null for none.
                    format: int32
                    nullable: true
                    type: integer
            type: object
info:
    title: Vantigo Energy API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/energy/customers/{customerId}/consumption:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumption
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ConsumptionResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/consumption/aggregate:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumptionAggregate
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: resolution
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerConsumptionAggregateResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Aggregate a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/metering-points:
        get:
            operationId: getEnergyCustomersByCustomerIdMeteringPoints
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerMeteringPointResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's metering points
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:metering-points-view+energy:meters-view+energy:supply-periods-view
    /api/v1/energy/imports:
        get:
            description: The metering-point imports, newest change first (energy import design D7), each as GET /energy/imports/{importId} answers it.
            operationId: getEnergyImports
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfEnergyImport'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — page below 1, or pageSize outside 1 to 100.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List metering-point imports
            tags:
                - Energy imports
            x-vantigo-access: permission:energy:import+energy:metering-points-view
        post:
            description: |-
                Uploads a file of metering points and reads it once (energy import design D2, D6), exactly as the customers import reads its file: one multipart part named file, at most 50 MiB, 100 000 data rows and 200 columns; UTF-8 with or without a byte order mark, or Windows-1252; the separator detected among the semicolon, the comma and the tab; RFC 4180 quoting; CRLF or LF; the first non-blank row the header; blank rows skipped.

                The rows are stored, the import is created in state draft, and the answer carries the header, the first twenty rows and a suggested mapping — the mapping last saved on an import with the same header, else the fields' own JSON names, else the alias table of the words suppliers' exports use (målepunktid, målernr, anleggsadresse, postnr anlegg, prisområde, netteier, org. nr., startdato kunde, …), where an installation alias (… anlegg) wins over the plain one whatever the column order. Rate-limited at 600 uploads an hour per client address.
            operationId: postEnergyImports
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EnergyImport'
                    description: Created — the import, in state draft, with its suggested mapping.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'file' for the file itself (no part named file or two of them, an empty file, one past 50 MiB, no header row, more than 200 columns, more than 100 000 rows, or a line the CSV reader cannot parse). A body that is not multipart at all is a bare 400.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests — at most 600 uploads an hour from one client address.
                    headers:
                        Retry-After:
                            schema:
                                type: string
            summary: Upload a file of metering points
            tags:
                - Energy imports
            x-vantigo-access: permission:energy:import+energy:metering-points-view
    /api/v1/energy/imports/{importId}:
        delete:
            description: Removes an import and its rows — a draft, a checked or a done one; the metering points and supply periods a done import wrote are untouched. A running one (checking, importing or attaching) is refused; stop it first.
