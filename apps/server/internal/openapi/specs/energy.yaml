    /api/v1/energy/tariffs:
        get:
            description: 'Every tariff (energy consumption billing design D3), active first, then by kind and name, each with its version count, the version valid today in Europe/Oslo and its usage. Not paged: a business holds a handful.'
            operationId: getEnergyTariffs
            parameters:
                - description: power or grid.
                  in: query
                  name: kind
                  required: false
                  schema:
                    type: string
                - description: active or archived.
                  in: query
                  name: status
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/TariffSummary'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — kind or status that is none of its two.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List tariffs
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-view
        post:
            description: Creates a tariff with its versions and components, active.
            operationId: postEnergyTariffs
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TariffRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tariff'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — the body refused, every error keyed by its place: kind, name, description, versions, versions[i].validFrom, versions[i].validTo, versions[i].components, versions[i].components[j].<field>, versions[i].components[j].tiers[k].<field>.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a tariff
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-manage+energy:tariffs-view
    /api/v1/energy/tariffs/{id}:
        delete:
            description: Deletes a tariff no supply period (of any status) and no metering point names, with its versions and components. A tariff in use is archived instead.
            operationId: deleteEnergyTariffsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: 'Conflict — Tariff in use: a supply period or a metering point names the tariff.'
            summary: Delete an unused tariff
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-manage
        get:
            operationId: getEnergyTariff
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tariff'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a tariff
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-view
        put:
            description: 'Replaces the tariff''s name, description and every version with its components. The kind cannot be changed; the status is the archive''s. An archived tariff can still be edited: it still prices the periods it covers.'
            operationId: putEnergyTariffsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TariffRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tariff'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — the body refused, every error keyed by its place: kind, name, description, versions, versions[i].validFrom, versions[i].validTo, versions[i].components, versions[i].components[j].<field>, versions[i].components[j].tiers[k].<field>. kind differing from the stored kind.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Replace a tariff
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-manage+energy:tariffs-view
    /api/v1/energy/tariffs/{id}/archive:
        post:
            description: 'Archives the tariff (idempotent): it can no longer be assigned anew, and it still prices the supply periods and metering points it is assigned to.'
            operationId: postEnergyTariffsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Tariff'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a tariff
            tags:
                - EnergyTariffsEndpoints
            x-vantigo-access: permission:energy:tariffs-manage+energy:tariffs-view
