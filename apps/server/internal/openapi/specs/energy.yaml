    /api/v1/energy/imports/{importId}/attach:
        post:
            description: |-
                Attaches the pending rows' metering points to their customers (energy import design D6): a done import with at least one pending row goes to attaching and the worker takes it up. For each pending row the point's active supply period is read again, now: none, and a period for the row's customer starts at start; the row's customer's, and the row becomes same and nothing is written; another customer's, and that period ends at start and the row's customer's starts there — the switch, which needs start after that period's start. Each row becomes attached, or stays pending with its error, so attaching can be asked for again, with another date, until nothing is pending. Every write goes through the supply-period endpoints' own functions, under their lock.

                confirmSwitches must equal the number of pending points whose active period is another customer's now, when that is not zero; the worker never switches more than that.
            operationId: postEnergyImportsByImportIdAttach
            parameters:
                - in: path
                  name: importId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EnergyImportAttachRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EnergyImport'
                    description: OK — the import, now attaching.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'start' for a start that is not a UTC timestamp.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/EnergyImportConflictProblem'
                    description: "Conflict — import_running when it is checking, importing or attaching, import_nothing_pending when it is not done or has no pending row, import_switch_not_confirmed when confirmSwitches is not the number of points that will switch customer (switches says how many)."
            summary: Attach a metering-point import's pending points
            tags:
                - Energy imports
            x-vantigo-access: permission:energy:import+energy:metering-points-view+energy:supply-periods-manage
    /api/v1/energy/imports/{importId}/check:
        post:
            description: Asks for the check (energy import design D6) — the dry run — of a draft import with a mapping. The import goes to checking and the worker takes it up; every row runs exactly as the real run would, each in its own transaction rolled back at its end, and its outcome, link and errors are written to the row. Nothing is kept — no metering point, no meter, no supply period. Two rows with one GSRN are refused on the second in both runs.
            operationId: postEnergyImportsByImportIdCheck
            parameters:
