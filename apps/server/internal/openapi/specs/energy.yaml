components:
    schemas:
        AddressRequest:
            properties:
                city:
                    nullable: true
                    type: string
                countryCode:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                streetAddress:
                    nullable: true
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        AddressResponse:
            properties:
                city:
                    type: string
                countryCode:
                    type: string
                postalCode:
                    type: string
                streetAddress:
                    type: string
            required:
                - streetAddress
                - postalCode
                - city
                - countryCode
            type: object
        ConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        ConsumptionResponse:
            properties:
                end:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quality:
                    type: string
                quantityKwh:
                    format: double
                    type: number
                receivedAt:
                    format: date-time
                    type: string
                source:
                    type: string
                start:
                    format: date-time
                    type: string
            required:
                - id
                - meteringPointId
                - start
                - end
                - quantityKwh
                - quality
                - source
                - receivedAt
            type: object
        CreateSupplyPeriodRequest:
            properties:
                customerId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
            required:
                - customerId
                - start
            type: object
        CustomerConsumptionAggregateResponse:
            properties:
                bucketEnd:
                    format: date-time
                    type: string
                bucketStart:
                    format: date-time
                    type: string
                hasEstimated:
                    type: boolean
                intervalCount:
                    format: int64
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                quantityKwh:
                    format: double
                    type: number
            required:
                - meteringPointId
                - bucketStart
                - bucketEnd
                - quantityKwh
                - intervalCount
                - hasEstimated
            type: object
        CustomerMeteringPointResponse:
            properties:
                meteringPoint:
                    $ref: '#/components/schemas/MeteringPointResponse'
                supplyPeriods:
                    items:
                        $ref: '#/components/schemas/SupplyPeriodResponse'
                    type: array
            required:
                - meteringPoint
                - supplyPeriods
            type: object
        EndSupplyPeriodRequest:
            properties:
                end:
                    format: date-time
                    type: string
            required:
                - end
            type: object
        EnergyImport:
            description: An import of metering points from a file (energy import design D3, D6, D7), the customers import's record with energy's counts. state is draft (uploaded, mapping being made), checking (the worker runs the dry run), checked (the dry run finished; the counts and the failed rows are on the import), importing (the worker runs the real run), done (finishedAt set; when it was stopped, processed short of rows) or attaching (the worker attaches the pending rows' points to their customers from attachStart, then the import is done again). encoding is utf-8 or windows-1252, separator the one character the header was split on. header is the file's header row as written; sample the first twenty rows, each with the errors its cells get under the saved mapping. mapping is absent until PUT …/mapping saved one; suggested is the mapping the server proposes, answered on every read. processed, created, updated, failed and skipped are the worker's progress while it runs and the recounted totals once it has finished; skipped counts the totals lines (a row with no GSRN and at most one other non-blank cell). switched counts the rows whose point switched customer (or, after a check, would), pending the rows matched to a customer and not yet attached, pendingSwitches the pending rows whose point was another customer's when the run wrote them, attached the pending rows attached since. error is a whole-run failure the worker met and will retry next cycle. createdByName is the uploader's display name. requestedAt is when the check, the run or the attach was asked for, startedAt when the worker took it up.
            properties:
                attachStart:
                    format: date-time
                    type: string
                attached:
                    format: int32
                    type: integer
                created:
                    format: int32
                    type: integer
                createdAt:
                    format: date-time
                    type: string
                createdByName:
                    type: string
                encoding:
                    type: string
                error:
                    type: string
                failed:
                    format: int32
                    type: integer
                fileName:
                    type: string
                finishedAt:
                    format: date-time
                    type: string
                header:
                    items:
                        type: string
                    type: array
                id:
                    format: int32
                    type: integer
                mapping:
                    $ref: '#/components/schemas/EnergyImportMapping'
                pending:
                    format: int32
                    type: integer
                pendingSwitches:
                    format: int32
                    type: integer
                processed:
                    format: int32
                    type: integer
                requestedAt:
                    format: date-time
                    type: string
                rows:
                    format: int32
                    type: integer
                sample:
                    items:
                        $ref: '#/components/schemas/EnergyImportSampleRow'
                    type: array
                separator:
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                skipped:
                    format: int32
                    type: integer
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - draft
                        - checking
                        - checked
                        - importing
                        - done
                        - attaching
                    type: string
                stopRequested:
                    type: boolean
                suggested:
                    $ref: '#/components/schemas/EnergyImportMapping'
                switched:
                    format: int32
                    type: integer
                updated:
                    format: int32
                    type: integer
            required:
                - id
                - state
                - fileName
                - sizeBytes
                - encoding
                - separator
                - rows
                - header
                - sample
                - suggested
                - processed
                - created
                - updated
                - failed
                - skipped
                - switched
                - pending
                - pendingSwitches
                - attached
                - stopRequested
                - createdAt
            type: object
        EnergyImportAttachRequest:
            description: Attaches an import's pending rows to their customers (energy import design D6). start is the date every period starts from, a UTC timestamp as the Assign customer dialog sends. confirmSwitches is how many of the pending points will switch customer — those whose active supply period is another customer's now — and must equal that number exactly when it is not zero.
            properties:
                confirmSwitches:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
            required:
                - start
            type: object
        EnergyImportConflictProblem:
            description: "ProblemDetails plus the import's conflict code (energy import design D7) — the one place the energy module answers a code: import_running (the worker is checking, importing or attaching it), import_not_checked (a run on a draft), import_nothing_to_import (a run on a check that found nothing to create or update), import_finished (a mapping, a check or a run on a done import, or a stop with nothing running), import_switch_not_confirmed (a run or an attach whose confirmSwitches is not the number of points that will switch customer) and import_nothing_pending (an attach on an import with no pending row, or one that is not done)."
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                switches:
                    description: For import_switch_not_confirmed, the number of points that will switch customer.
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        EnergyImportMapping:
            description: "How an import's rows become metering points (energy import design D3). mode: create makes every row a new point and refuses a GSRN on file; update finds the point by GSRN and refuses a row that finds none; createOrUpdate updates a row that finds one and creates from a row that finds none. Rows are always matched by gsrn. columns maps the fields: a field at most once, a column at most once, each entry a column of the file or a fixed value for every row."
            properties:
                columns:
                    items:
                        $ref: '#/components/schemas/EnergyImportMappingColumn'
                    type: array
                mode:
                    enum:
                        - create
                        - update
                        - createOrUpdate
                    type: string
            required:
                - mode
                - columns
            type: object
        EnergyImportMappingColumn:
            description: "One field of a mapping (energy import design D3): field is one of gsrn, meterNumber, streetAddress, postalCode, city, countryCode, priceArea, gridArea, expectedAnnualConsumptionKwh, latitude, longitude, connectionStatus, customerLegalId and supplyStart — and exactly one of column (the 0-based column of the file it is read from) and value (the same text for every row, read as a cell would be; gsrn takes none)."
            properties:
                column:
                    format: int32
                    type: integer
                field:
                    type: string
                value:
                    type: string
            required:
                - field
            type: object
        EnergyImportRow:
            description: One row of an import with what the worker did with it (energy import design D4, D7). cells are the row's cells as the file had them; outcome is absent for a row not yet run; meteringPointId and gsrn name the point the row created or updated (no id for a point a check would create); link is what the row did about its customer — none (no organisation number), same (the point is already that customer's), assigned, switched, pending (matched, not yet attached) or attached (attached afterwards); customerId and customerName the customer the organisation number resolved to, switchFromCustomerId and switchFromCustomerName the customer the point was supplied to before a switch (or, on a pending row, is supplied to); supplyStart the date the period was or will be written from. errors are a failed row's problems, a pending row's attach error, or a skipped row's reason.
            properties:
                cells:
                    items:
                        type: string
                    type: array
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                errors:
                    items:
                        $ref: '#/components/schemas/EnergyImportRowError'
                    type: array
                gsrn:
                    type: string
                link:
                    enum:
                        - none
                        - same
                        - assigned
                        - switched
                        - pending
                        - attached
                    type: string
                meteringPointId:
                    format: int32
                    type: integer
                outcome:
                    enum:
                        - created
                        - updated
                        - failed
                        - skipped
                    type: string
                row:
                    format: int32
                    type: integer
                supplyStart:
                    format: date-time
                    type: string
                switchFromCustomerId:
                    format: int32
                    type: integer
                switchFromCustomerName:
                    type: string
            required:
                - row
                - cells
                - errors
            type: object
        EnergyImportRowError:
            description: One problem with one row of an import. column is the 0-based index of the file column the offending cell is in, absent for a problem with the row as a whole or with a fixed value. message is the module's own validation wording.
            properties:
                column:
                    format: int32
                    type: integer
                message:
                    type: string
            required:
                - message
            type: object
        EnergyImportRunRequest:
            description: The run of a checked import (energy import design D4). confirmSwitches is how many points the run will switch customer, and must equal the check's switched exactly when that is not zero; absent is zero.
            properties:
                confirmSwitches:
                    format: int32
                    type: integer
            type: object
        EnergyImportSampleRow:
            description: One of the first rows of an import as the preview shows it, with the errors its cells get under the saved mapping — planned through the endpoints' own validators, no database asked.
            properties:
                cells:
                    items:
                        type: string
                    type: array
                errors:
                    items:
                        $ref: '#/components/schemas/EnergyImportRowError'
                    type: array
                row:
                    format: int32
                    type: integer
            required:
                - row
                - cells
                - errors
            type: object
        EnergyPaginationMetadata:
            properties:
                page:
                    format: int32
                    type: integer
                pageSize:
                    format: int32
                    type: integer
                totalCount:
                    format: int32
                    type: integer
                totalPages:
                    format: int32
                    type: integer
            required:
                - page
                - pageSize
                - totalCount
                - totalPages
            type: object
        EnergyStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        EnergyStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            type: object
        EnergyStatsSummaryResponse:
            properties:
                activeSupplyPeriods:
                    format: int32
                    type: integer
                activeSupplyPeriodsDelta:
                    format: int32
                    type: integer
                consumptionKwh:
                    format: double
                    type: number
                consumptionKwhDelta:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                meteringPointCount:
                    format: int32
                    type: integer
                meteringPointCountDelta:
                    format: int32
                    type: integer
                previousConsumptionKwh:
                    format: double
                    type: number
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - meteringPointCount
                - meteringPointCountDelta
                - activeSupplyPeriods
                - activeSupplyPeriodsDelta
                - consumptionKwh
                - consumptionKwhDelta
                - previousConsumptionKwh
            type: object
        ManualConsumptionRequest:
            properties:
                end:
                    format: date-time
                    type: string
                quantityKwh:
                    format: double
                    type: number
                start:
                    format: date-time
                    type: string
            required:
                - start
                - end
                - quantityKwh
            type: object
        MeterResponse:
            properties:
                id:
                    format: int32
                    type: integer
                installedAt:
                    format: date-time
                    type: string
                meterNumber:
                    type: string
                meteringPointId:
                    format: int32
                    type: integer
                removedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - id
                - meteringPointId
                - meterNumber
                - installedAt
                - removedAt
            type: object
        MeteringPointRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    nullable: true
                    type: string
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - meterNumber
                - address
                - priceArea
            type: object
        MeteringPointResponse:
            properties:
                address:
                    $ref: '#/components/schemas/AddressResponse'
                connectionStatus:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    type: string
                id:
                    format: int32
                    type: integer
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                meterNumber:
                    nullable: true
                    type: string
                priceArea:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - gsrn
                - meterNumber
                - address
                - priceArea
                - gridArea
                - expectedAnnualConsumptionKwh
                - latitude
                - longitude
                - connectionStatus
                - createdAt
                - updatedAt
            type: object
        MeteringPointUpdateRequest:
            properties:
                address:
                    allOf:
                        - $ref: '#/components/schemas/AddressRequest'
                    nullable: true
                connectionStatus:
                    nullable: true
                    type: string
                expectedAnnualConsumptionKwh:
                    format: double
                    nullable: true
                    type: number
                gridArea:
                    nullable: true
                    type: string
                gsrn:
                    nullable: true
                    type: string
                latitude:
                    format: double
                    nullable: true
                    type: number
                longitude:
                    format: double
                    nullable: true
                    type: number
                priceArea:
                    nullable: true
                    type: string
            required:
                - gsrn
                - address
                - priceArea
            type: object
        PaginatedResponseOfEnergyImport:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/EnergyImport'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfEnergyImportRow:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/EnergyImportRow'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfMeteringPointResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/MeteringPointResponse'
                    type: array
                pagination:
                    $ref: '#/components/schemas/EnergyPaginationMetadata'
            required:
                - data
                - pagination
            type: object
        ReplaceMeterRequest:
            properties:
                installedAt:
                    format: date-time
                    nullable: true
                    type: string
                meterNumber:
                    nullable: true
                    type: string
            required:
                - meterNumber
                - installedAt
            type: object
        SupplyPeriodResponse:
            properties:
                customerId:
                    format: int32
                    type: integer
                end:
                    format: date-time
                    nullable: true
                    type: string
                id:
                    format: int32
                    type: integer
                meteringPointId:
                    format: int32
                    type: integer
                start:
                    format: date-time
                    type: string
                status:
                    type: string
            required:
                - id
                - meteringPointId
                - customerId
                - start
                - end
                - status
            type: object
        SwitchSupplyPeriodRequest:
            properties:
                customerId:
                    format: int32
                    type: integer
                switchAt:
                    format: date-time
                    type: string
            required:
                - customerId
                - switchAt
            type: object
        SwitchSupplyPeriodResponse:
            properties:
                endedPeriod:
                    allOf:
                        - $ref: '#/components/schemas/SupplyPeriodResponse'
                    nullable: true
                newPeriod:
                    $ref: '#/components/schemas/SupplyPeriodResponse'
            required:
                - endedPeriod
                - newPeriod
            type: object
info:
    title: Vantigo Energy API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/energy/customers/{customerId}/consumption:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumption
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ConsumptionResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/consumption/aggregate:
        get:
            operationId: getEnergyCustomersByCustomerIdConsumptionAggregate
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: meteringPointId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: resolution
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerConsumptionAggregateResponse'
                                type: array
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Aggregate a customer's consumption
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:consumption-view
    /api/v1/energy/customers/{customerId}/metering-points:
        get:
            operationId: getEnergyCustomersByCustomerIdMeteringPoints
            parameters:
                - in: path
                  name: customerId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/CustomerMeteringPointResponse'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List a customer's metering points
            tags:
                - Customer energy
            x-vantigo-access: permission:energy:metering-points-view+energy:meters-view+energy:supply-periods-view
    /api/v1/energy/imports:
        get:
            description: The metering-point imports, newest change first (energy import design D7), each as GET /energy/imports/{importId} answers it.
            operationId: getEnergyImports
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfEnergyImport'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — page below 1, or pageSize outside 1 to 100.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List metering-point imports
            tags:
                - Energy imports
            x-vantigo-access: permission:energy:import+energy:metering-points-view
        post:
            description: |-
                Uploads a file of metering points and reads it once (energy import design D2, D6), exactly as the customers import reads its file: one multipart part named file, at most 50 MiB, 100 000 data rows and 200 columns; UTF-8 with or without a byte order mark, or Windows-1252; the separator detected among the semicolon, the comma and the tab; RFC 4180 quoting; CRLF or LF; the first non-blank row the header; blank rows skipped.

                The rows are stored, the import is created in state draft, and the answer carries the header, the first twenty rows and a suggested mapping — the mapping last saved on an import with the same header, else the fields' own JSON names, else the alias table of the words suppliers' exports use (målepunktid, målernr, anleggsadresse, postnr anlegg, prisområde, netteier, org. nr., startdato kunde, …), where an installation alias (… anlegg) wins over the plain one whatever the column order. Rate-limited at 600 uploads an hour per client address.
            operationId: postEnergyImports
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
