components:
    schemas:
        PurchasingAddress:
            additionalProperties: false
            description: A postal address; every field optional.
            properties:
                city:
                    maxLength: 100
                    nullable: true
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    nullable: true
                    type: string
                line1:
                    maxLength: 255
                    nullable: true
                    type: string
                line2:
                    maxLength: 255
                    nullable: true
                    type: string
                name:
                    maxLength: 255
                    nullable: true
                    type: string
                postalCode:
                    maxLength: 20
                    nullable: true
                    type: string
            type: object
        PurchasingBuyerList:
            additionalProperties: false
            description: 'The buyers: the active holders of purchasing:orders-manage.'
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingPerson'
                    type: array
            required:
                - items
            type: object
        PurchasingCancelInput:
            additionalProperties: false
            description: Cancel a sent order with nothing received (P18, A16). An order that was mailed sends the supplier its cancellation — the PDF marked Cancelled — unless notifySupplier is false.
            properties:
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
                message:
                    maxLength: 4000
                    type: string
                notifySupplier:
                    description: Default true for an order that was mailed; ignored for one marked as sent.
                    type: boolean
                recipient:
                    format: email
                    maxLength: 254
                    type: string
            required:
                - expectedUpdatedAt
            type: object
        PurchasingChange:
            additionalProperties: false
            description: One entry of an order's change log (P18).
            properties:
                actions:
                    items:
                        $ref: '#/components/schemas/PurchasingChangeAction'
                    type: array
                actor:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - at
                - actions
            type: object
        PurchasingChangeAction:
            additionalProperties: false
            description: One action of a change.
            properties:
                action:
                    description: 'What was done: created, updated, line_added, line_changed, line_removed, sent, marked_sent, sent_again, confirmed, confirmation_cleared, line_closed, closed, received (the last open line closed with everything received, or a receipt that left nothing open), reopened, cancelled; receipt_posted and receipt_undone (to: the receipt''s number), line_delivered and line_undelivered (delivery B), from_proposals (Create orders made the draft or added lines to it; to is the number of lines added).'
                    type: string
                field:
                    nullable: true
                    type: string
                from:
                    nullable: true
                    type: string
                lineId:
                    format: int64
                    nullable: true
                    type: integer
                to:
                    nullable: true
                    type: string
            required:
                - action
            type: object
        PurchasingConfirmationInput:
            additionalProperties: false
            description: 'The supplier''s confirmation (P19): its order reference and the confirmed day, per order and optionally per line. A fact on the order, not a state; empty values clear it.'
            properties:
                confirmedOn:
                    format: date
                    nullable: true
                    type: string
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/PurchasingConfirmationLine'
                    maxItems: 500
                    type: array
                supplierReference:
                    maxLength: 100
                    nullable: true
                    type: string
            required:
                - expectedUpdatedAt
            type: object
        PurchasingConfirmationLine:
            additionalProperties: false
            description: A line's confirmed day.
            properties:
                confirmedOn:
                    format: date
                    nullable: true
                    type: string
                lineId:
                    format: int64
                    type: integer
            required:
                - lineId
            type: object
        PurchasingDeliveredInput:
            additionalProperties: false
            description: Marks a text or service line delivered, or takes the mark off.
            properties:
                delivered:
                    type: boolean
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
            required:
                - expectedUpdatedAt
                - delivered
            type: object
        PurchasingDeliveredResult:
            additionalProperties: false
            description: 'The order after a delivered mark (A47): progress without prices for every caller; order, with its prices, only for a holder of purchasing:access.'
            properties:
                order:
                    $ref: '#/components/schemas/PurchasingOrder'
                progress:
                    $ref: '#/components/schemas/PurchasingOrderProgress'
            required:
                - progress
            type: object
        PurchasingDocument:
            additionalProperties: false
            description: A stored PDF of an order (P21).
            properties:
                createdAt:
                    format: date-time
                    type: string
                erased:
                    description: The supplier's erase took the PDF out (A8).
                    type: boolean
                id:
                    format: int64
                    type: integer
                kind:
                    enum:
                        - order
                        - cancellation
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                version:
                    format: int32
                    type: integer
            required:
                - id
                - kind
                - version
                - sizeBytes
                - createdAt
                - erased
            type: object
        PurchasingImportOutcome:
            description: 'A row''s outcome: created or updated (a dry run says what a commit would do), or why it fails.'
            enum:
                - created
                - updated
                - variant_not_found
                - variant_ambiguous
                - packaging_not_found
                - price_invalid
                - quantity_invalid
                - lead_time_invalid
                - duplicate_row
                - line_invalid
            type: string
        PurchasingImportResult:
            additionalProperties: false
            description: 'The import''s answer: every row''s outcome; on a commit with every row ok, what was written.'
            properties:
                committed:
                    description: 'The rows were written: a commit with every row ok.'
                    type: boolean
                created:
                    format: int32
                    type: integer
                ok:
                    description: Every row is ok.
                    type: boolean
                rows:
                    items:
                        $ref: '#/components/schemas/PurchasingImportRow'
                    type: array
                updated:
                    format: int32
                    type: integer
            required:
                - ok
                - committed
                - created
                - updated
                - rows
            type: object
        PurchasingImportRow:
            additionalProperties: false
            description: One row of a supplier's price list and its outcome (P14).
            properties:
                code:
                    description: The SKU or barcode as written.
                    type: string
                detail:
                    type: string
                outcome:
                    $ref: '#/components/schemas/PurchasingImportOutcome'
                row:
                    description: The row in the file, the header being row 1.
                    format: int32
                    type: integer
                variantId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - row
                - code
                - outcome
            type: object
        PurchasingLineInput:
            additionalProperties: false
            description: A line as written (P16). id names an existing line of the order; a line without one is new. A variant line names variantId and takes its supplier item's number, price, packaging and expected day when they are left out; a text line names description, unit and unitPrice.
            properties:
                description:
                    maxLength: 2000
                    type: string
                discountPercent:
                    nullable: true
                    type: string
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    nullable: true
                    type: integer
                kind:
                    enum:
                        - variant
                        - text
                    type: string
                orderQuantity:
                    description: In the purchase packaging, more than 0, three places at most.
                    type: string
                packagingId:
                    description: The purchase packaging; absent takes the supplier item's, null the unit.
                    format: int32
                    nullable: true
                    type: integer
                supplierItemNumber:
                    maxLength: 60
                    nullable: true
                    type: string
                unit:
                    description: A text line's unit.
                    maxLength: 20
                    nullable: true
                    type: string
                unitPrice:
                    description: Per the purchase packaging; absent takes the supplier item's price, else 0.
                    nullable: true
                    type: string
                variantId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - kind
                - orderQuantity
            type: object
        PurchasingLineWarning:
            description: 'below_minimum: the quantity is under the supplier item''s minimum; off_multiple: it is not a multiple of the item''s multiple (P16). A warning, never a refusal.'
            enum:
                - below_minimum
                - off_multiple
            type: string
        PurchasingLocation:
            additionalProperties: false
            description: An active location of the order's site, as Inventory answers it.
            properties:
                fullCode:
                    type: string
                id:
                    format: int64
                    type: integer
                root:
                    description: The site's own node, where stock lies when it has no place.
                    type: boolean
            required:
                - id
                - fullCode
                - root
            type: object
        PurchasingMailing:
            additionalProperties: false
            description: One mailing of an order's PDF (P21).
            properties:
                attempts:
                    format: int32
                    type: integer
                cc:
                    items:
                        type: string
                    type: array
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    enum:
                        - order
                        - cancellation
                    type: string
                lastError:
                    nullable: true
                    type: string
                recipient:
                    type: string
                sentAt:
                    format: date-time
                    nullable: true
                    type: string
                sentBy:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                status:
                    enum:
                        - queued
                        - sent
                        - failed
                    type: string
                subject:
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - id
                - kind
                - version
                - recipient
                - cc
                - subject
                - status
                - attempts
                - createdAt
            type: object
        PurchasingMarkSentInput:
            additionalProperties: false
            description: 'Mark as sent (P18): as Send, without a mail — for an order placed by phone or in a supplier''s web shop.'
            properties:
                clientRequestId:
                    description: 'The client''s id of this request (A11): a replay with the same body answers the first result; another body under the same id is 409 client_request_reused.'
                    format: uuid
                    type: string
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
            required:
                - expectedUpdatedAt
                - clientRequestId
            type: object
        PurchasingMeta:
            additionalProperties: false
            description: What the Purchasing screens need without purchasing:settings.
            properties:
                baseCurrency:
                    type: string
                canManageSuppliers:
                    description: 'The caller may create and edit a supplier in the register through Accounting''s endpoints: accounting:suppliers-manage, or accounting:post with accounting:read (A12, A25).'
                    type: boolean
                canOpenAccountingSuppliers:
                    description: The caller may open Accounting's supplier pages (accounting:read).
                    type: boolean
                defaultSiteId:
                    format: int64
                    nullable: true
                    type: integer
                priceTolerancePercent:
                    type: string
                sendingAvailable:
                    description: 'Send by e-mail is offered: Communications is on and the settings'' channel can send (P21). When false, Mark as sent is offered instead.'
                    type: boolean
            required:
                - sendingAvailable
                - baseCurrency
                - priceTolerancePercent
                - canManageSuppliers
                - canOpenAccountingSuppliers
            type: object
        PurchasingOrder:
            additionalProperties: false
            description: A purchase order (P15–P20).
            properties:
                buyer:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                cancelledAt:
                    format: date-time
                    nullable: true
                    type: string
                closedAt:
                    format: date-time
                    nullable: true
                    type: string
                confirmedAt:
                    format: date-time
                    nullable: true
                    type: string
                confirmedBy:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                confirmedOn:
                    format: date
                    nullable: true
                    type: string
                copiedFromId:
                    format: int64
                    nullable: true
                    type: integer
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                currency:
                    type: string
                deliveryAddress:
                    $ref: '#/components/schemas/PurchasingAddress'
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                internalNote:
                    type: string
                language:
                    enum:
                        - nb
                        - en
                    type: string
                lastMailingStatus:
                    enum:
                        - queued
                        - sent
                        - failed
                    nullable: true
                    type: string
                late:
                    description: Sent, not received, closed or cancelled, and an open line's expected day is past.
                    type: boolean
                lines:
                    items:
                        $ref: '#/components/schemas/PurchasingOrderLine'
                    type: array
                netTotal:
                    description: An amount as decimal text with two places.
                    type: string
                note:
                    type: string
                number:
                    description: Allocated when the order is sent; null for a draft (P20).
                    format: int64
                    nullable: true
                    type: integer
                orderDate:
                    format: date
                    type: string
                sendMethod:
                    enum:
                        - mail
                        - manual
                    nullable: true
                    type: string
                sentAt:
                    format: date-time
                    nullable: true
                    type: string
                sentBy:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                siteId:
                    format: int64
                    type: integer
                siteName:
                    type: string
                status:
                    description: draft → sent → partially_received → received; closed and cancelled beside them (P18). partially_received and received are reached by receipts (delivery B).
                    enum:
                        - draft
                        - sent
                        - partially_received
                        - received
                        - closed
                        - cancelled
                    type: string
                supplierActive:
                    description: The supplier is active in the register now.
                    type: boolean
                supplierAddress:
                    $ref: '#/components/schemas/PurchasingAddress'
                supplierContact:
                    type: string
                supplierEmail:
                    nullable: true
                    type: string
                supplierId:
                    format: int64
                    type: integer
                supplierName:
                    type: string
                supplierNumber:
                    format: int32
                    nullable: true
                    type: integer
                supplierReference:
                    nullable: true
                    type: string
                unconfirmed:
                    description: Sent more than three business days ago with no confirmation (P19).
                    type: boolean
                updatedAt:
                    format: date-time
                    type: string
                version:
                    description: 'The PDFs sent: 1 at the first send, one more per Send again; 0 for a draft.'
                    format: int32
                    type: integer
            required:
                - id
                - status
                - version
                - supplierId
                - supplierName
                - supplierAddress
                - supplierContact
                - supplierActive
                - siteId
                - siteName
                - deliveryAddress
                - currency
                - language
                - orderDate
                - note
                - internalNote
                - netTotal
                - late
                - unconfirmed
                - createdAt
                - updatedAt
                - lines
            type: object
        PurchasingOrderHistory:
            additionalProperties: false
            description: An order's change log, stored PDFs and mailings, newest first.
            properties:
                changes:
                    items:
                        $ref: '#/components/schemas/PurchasingChange'
                    type: array
                documents:
                    items:
                        $ref: '#/components/schemas/PurchasingDocument'
                    type: array
                mailings:
                    items:
                        $ref: '#/components/schemas/PurchasingMailing'
                    type: array
            required:
                - changes
                - documents
                - mailings
            type: object
        PurchasingOrderInput:
            additionalProperties: false
            description: A new draft purchase order (P15). currency defaults to the supplier's, language from the supplier's country, siteId to the settings' default site, orderDate to today.
            properties:
                buyerId:
                    format: uuid
                    nullable: true
                    type: string
                currency:
                    description: ISO 4217.
                    maxLength: 3
                    nullable: true
                    type: string
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                internalNote:
                    maxLength: 4000
                    type: string
                language:
                    enum:
                        - nb
                        - en
                    nullable: true
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/PurchasingLineInput'
                    maxItems: 500
                    type: array
                note:
                    maxLength: 4000
                    type: string
                orderDate:
                    format: date
                    nullable: true
                    type: string
                siteId:
                    format: int64
                    nullable: true
                    type: integer
                supplierContact:
                    maxLength: 200
                    type: string
                supplierId:
                    format: int64
                    type: integer
            required:
                - supplierId
            type: object
        PurchasingOrderLine:
            additionalProperties: false
            description: A line of a purchase order (P16).
            properties:
                closedAt:
                    format: date-time
                    nullable: true
                    type: string
                confirmedOn:
                    format: date
                    nullable: true
                    type: string
                deliveredAt:
                    description: When a text or service line was marked delivered (P16).
                    format: date-time
                    nullable: true
                    type: string
                description:
                    type: string
                discountPercent:
                    type: string
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                invoiced:
                    description: Invoiced so far, in the variant's unit (delivery D).
                    type: string
                kind:
                    enum:
                        - variant
                        - text
                    type: string
                lineNet:
                    description: Net of VAT, two places (P17).
                    type: string
                name:
                    type: string
                open:
                    description: 'Ordered and not received, 0 when the line is closed: what counts as on order.'
                    type: string
                orderQuantity:
                    description: As entered, in the purchase packaging (the variant's unit when none).
                    type: string
                packagingId:
                    format: int32
                    nullable: true
                    type: integer
                packagingName:
                    nullable: true
                    type: string
                packagingQuantity:
                    description: The packaging's quantity in the variant's unit, as the line took it.
                    nullable: true
                    type: string
                position:
                    format: int32
                    type: integer
                productType:
                    enum:
                        - Goods
                        - Service
                    nullable: true
                    type: string
                quantity:
                    description: In the variant's unit.
                    type: string
                received:
                    description: Received so far, in the variant's unit (delivery B).
                    type: string
                sku:
                    nullable: true
                    type: string
                supplierItemNumber:
                    nullable: true
                    type: string
                unit:
                    type: string
                unitPrice:
                    description: Per the purchase packaging, in the order's currency.
                    type: string
                variantId:
                    format: int32
                    nullable: true
                    type: integer
                warnings:
                    items:
                        $ref: '#/components/schemas/PurchasingLineWarning'
                    type: array
            required:
                - id
                - position
                - kind
                - name
                - description
                - unit
                - orderQuantity
                - quantity
                - unitPrice
                - discountPercent
                - lineNet
                - received
                - invoiced
                - open
                - warnings
            type: object
        PurchasingOrderPage:
            additionalProperties: false
            description: A page of purchase orders.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingOrderSummary'
                    type: array
                page:
                    format: int32
                    type: integer
                pageSize:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
                - page
                - pageSize
            type: object
        PurchasingOrderProgress:
            additionalProperties: false
            description: 'An order as receiving sees it (A47): its state, its updatedAt and each line''s quantities — no prices.'
            properties:
                id:
                    format: int64
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/PurchasingProgressLine'
                    type: array
                number:
                    format: int64
                    nullable: true
                    type: integer
                status:
                    enum:
                        - draft
                        - sent
                        - partially_received
                        - received
                        - closed
                        - cancelled
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - status
                - updatedAt
                - lines
            type: object
        PurchasingOrderSummary:
            additionalProperties: false
            description: A purchase order as the list shows it (P23).
            properties:
                buyer:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingPerson'
                    nullable: true
                confirmedOn:
                    format: date
                    nullable: true
                    type: string
                currency:
                    type: string
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                goodsLines:
                    description: 'Lines to receive: goods variant lines.'
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                invoicedLines:
                    description: Lines invoiced in full (delivery D).
                    format: int32
                    type: integer
                lastMailingStatus:
                    enum:
                        - queued
                        - sent
                        - failed
                    nullable: true
                    type: string
                late:
                    type: boolean
                lineCount:
                    format: int32
                    type: integer
                netTotal:
                    description: An amount as decimal text with two places.
                    type: string
                number:
                    format: int64
                    nullable: true
                    type: integer
                orderDate:
                    format: date
                    type: string
                receivedLines:
                    description: Goods lines received in full or closed.
                    format: int32
                    type: integer
                sentAt:
                    format: date-time
                    nullable: true
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    description: draft → sent → partially_received → received; closed and cancelled beside them (P18). partially_received and received are reached by receipts (delivery B).
                    enum:
                        - draft
                        - sent
                        - partially_received
                        - received
                        - closed
                        - cancelled
                    type: string
                supplierId:
                    format: int64
                    type: integer
                supplierName:
                    type: string
                supplierReference:
                    nullable: true
                    type: string
                unconfirmed:
                    type: boolean
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - status
                - supplierId
                - supplierName
                - siteId
                - currency
                - netTotal
                - orderDate
                - late
                - unconfirmed
                - goodsLines
                - receivedLines
                - invoicedLines
                - lineCount
                - updatedAt
            type: object
        PurchasingOrderUpdate:
            additionalProperties: false
            description: An order's header and lines, whole (P15, P16, P18). A draft changes freely; a sent order takes new lines, a line's quantity down to what is received, its price, discount and expected day, and the header's dates, contact, notes and buyer — each change written to the change log. A line left out of lines is deleted on a draft and refused on a sent order (line_not_found names it).
            properties:
                buyerId:
                    format: uuid
                    nullable: true
                    type: string
                currency:
                    maxLength: 3
                    type: string
                expectedOn:
                    format: date
                    nullable: true
                    type: string
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
                internalNote:
                    maxLength: 4000
                    type: string
                language:
                    enum:
                        - nb
                        - en
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/PurchasingLineInput'
                    maxItems: 500
                    type: array
                note:
                    maxLength: 4000
                    type: string
                orderDate:
                    format: date
                    type: string
                siteId:
                    format: int64
                    type: integer
                supplierContact:
                    maxLength: 200
                    type: string
                supplierId:
                    description: A draft's supplier; a sent order's must stay (supplier_changed).
                    format: int64
                    type: integer
            required:
                - expectedUpdatedAt
                - supplierId
                - siteId
                - currency
                - language
                - orderDate
                - supplierContact
                - note
                - internalNote
                - lines
            type: object
        PurchasingPackaging:
            additionalProperties: false
            description: A packaging of a variant.
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                quantity:
                    type: string
            required:
                - id
                - name
                - quantity
            type: object
        PurchasingPerson:
            additionalProperties: false
            description: A user as snapshotted on a record.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - displayName
            type: object
        PurchasingProblem:
            additionalProperties: false
            description: 'An RFC 9457 problem with this module''s refusal code (purchasing design §3). code names the rule that refused and is what a client keys off, never the words. 400: field errors (errors), supplier_not_found, site_not_found, site_archived, currency_invalid, series_start_too_low, send_channel_unknown, recipient_missing, order_empty, import_invalid, amount_out_of_range (an order''s total above 999 999 999 999.99), and an order''s line refusals in lines, the first of which is also code: too_many_lines, line_invalid, line_not_found, variant_not_found, variant_discontinued, packaging_not_found, quantity_invalid, price_invalid, discount_invalid, quantity_below_received, amount_out_of_range (a line''s amount above 999 999 999 999.99). 404: not_found. 409: version_conflict (a stale revision or expectedUpdatedAt), order_not_draft, order_not_sent (the order is not sent or partially received), order_not_closed, order_has_receipts (a cancel of an order with something received), line_closed, line_kind_changed, currency_fixed (a currency change once a line has a price), supplier_inactive, supplier_changed (a sent order''s supplier), supplier_item_exists, client_request_reused, proposal_gone (Create orders: a row no longer proposed as the screen showed it — on a draft or sent since, or its remaining changed; lines name the rows). Create orders'' rows are refused in lines as an order''s are, with supplier_item_not_found (the item is not the row variant''s, or not known). 503: dependency_unavailable (a module Purchasing reads is not composed), sending_disabled (Communications is off, or no channel that can send is chosen) and mail_failed (the e-mail did not go out now; the change is made, and its mailing, written in the same transaction, stays queued for the purchasing.mail worker). errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither. Receipts (delivery B): 400 line_not_receivable (a line that is not an open goods line of the order) and quantity_invalid (also a line whose received quantity would pass 999 999 999.999, acceptOver or not) in lines; 409 over_receipt (more than a line''s remainder without acceptOver, the lines named), receipt_undone (an undo of a receipt undone already), receipt_invoiced (an undo that would leave a line with less received than invoiced) and line_not_deliverable (a delivered mark on a goods line). Inventory''s refusals of a receipt or its undo keep Inventory''s own codes, each line named by its index.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                lines:
                    description: Every failing line, in the request's order.
                    items:
                        $ref: '#/components/schemas/PurchasingProblemLine'
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        PurchasingProblemLine:
            additionalProperties: false
            description: One failing line of an order.
            properties:
                code:
                    description: The line's refusal code.
                    type: string
                detail:
                    type: string
                index:
                    description: The line's index in the request, from 0.
                    format: int32
