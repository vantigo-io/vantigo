                deliveryAddresses:
                    items:
                        $ref: '#/components/schemas/PurchasingSiteAddress'
                    type: array
                nextOrderNumber:
                    description: The number the next order sent gets.
                    format: int64
                    type: integer
                orderFooter:
                    type: string
                orderSeriesStart:
                    format: int64
                    type: integer
                priceTolerancePercent:
                    description: The price tolerance of P38, in percent.
                    type: string
                revision:
                    format: int32
                    type: integer
                sendChannelId:
                    format: uuid
                    nullable: true
                    type: string
                sendingAvailable:
                    type: boolean
                updatedAt:
                    format: date-time
                    nullable: true
                    type: string
            required:
                - orderSeriesStart
                - nextOrderNumber
                - channels
                - sendingAvailable
                - orderFooter
                - deliveryAddresses
                - priceTolerancePercent
                - revision
            type: object
        PurchasingSettingsInput:
            additionalProperties: false
            description: The settings to save (P9), whole.
            properties:
                defaultSiteId:
                    format: int64
                    nullable: true
                    type: integer
                deliveryAddresses:
                    items:
                        $ref: '#/components/schemas/PurchasingSiteAddress'
                    maxItems: 200
                    type: array
                orderFooter:
                    maxLength: 4000
                    type: string
                orderSeriesStart:
                    description: Only above the highest number used (series_start_too_low).
                    format: int64
                    minimum: 1
                    type: integer
                priceTolerancePercent:
                    type: string
                revision:
                    description: 'The revision as read: a stale one is version_conflict.'
                    format: int32
                    type: integer
                sendChannelId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - revision
                - orderSeriesStart
                - orderFooter
                - deliveryAddresses
                - priceTolerancePercent
            type: object
        PurchasingSite:
            additionalProperties: false
            description: A receiving site, as Inventory answers it.
            properties:
                active:
                    type: boolean
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
                - active
            type: object
        PurchasingSiteAddress:
            additionalProperties: false
            description: A site's delivery address when it differs from the company's (P9).
            properties:
                address:
                    $ref: '#/components/schemas/PurchasingAddress'
                siteId:
                    format: int64
                    type: integer
            required:
                - siteId
                - address
            type: object
        PurchasingSiteList:
            additionalProperties: false
            description: The sites.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingSite'
                    type: array
            required:
                - items
            type: object
        PurchasingSummary:
            additionalProperties: false
            description: The dashboard's figures (P23).
            properties:
                drafts:
                    format: int32
                    type: integer
                failedMailings:
                    description: Open orders whose last mailing failed (§11).
                    format: int32
                    type: integer
                late:
                    format: int32
                    type: integer
                mineUnconfirmed:
                    description: 'Unconfirmed orders whose buyer is the caller: the attention item of P19.'
                    format: int32
                    type: integer
                open:
                    description: Sent or partially received.
                    format: int32
                    type: integer
                unconfirmed:
                    format: int32
                    type: integer
            required:
                - drafts
                - open
                - late
                - unconfirmed
                - mineUnconfirmed
                - failedMailings
            type: object
        PurchasingSupplier:
            additionalProperties: false
            description: A supplier of Accounting's register as Purchasing shows it (P1, P13), with what Purchasing keeps of it.
            properties:
                active:
                    type: boolean
                addressLine:
                    type: string
                anonymised:
                    type: boolean
                city:
                    type: string
                country:
                    type: string
                currency:
                    type: string
                email:
                    type: string
                id:
                    format: int64
                    type: integer
                isPerson:
                    type: boolean
                name:
                    type: string
                number:
                    format: int32
                    type: integer
                openOrderCount:
                    description: Orders sent and not received, closed or cancelled.
                    format: int32
                    type: integer
                organisationNumber:
                    type: string
                paymentTermsDays:
                    format: int32
                    type: integer
                postalCode:
                    type: string
                revision:
                    description: The register row's revision (A26), which a change of the supplier through Accounting's API carries — so a buyer without accounting:read can write it.
                    format: int32
                    type: integer
                supplierItemCount:
                    format: int32
                    type: integer
            required:
                - id
                - number
                - name
                - organisationNumber
                - country
                - addressLine
                - postalCode
                - city
                - email
                - currency
                - paymentTermsDays
                - active
                - isPerson
                - anonymised
                - supplierItemCount
                - openOrderCount
                - revision
            type: object
        PurchasingSupplierItem:
            additionalProperties: false
            description: 'A supplier item (P11): what one supplier sells of one variant.'
            properties:
                currency:
                    description: 'The currency the price is in: the supplier''s when it was set.'
                    type: string
                currencyDiffers:
                    description: The supplier's currency in the register is no longer the price's (§11).
                    type: boolean
                id:
                    format: int64
                    type: integer
                leadTimeDays:
                    format: int32
                    nullable: true
                    type: integer
                minimumQuantity:
                    description: In purchase packagings.
                    nullable: true
                    type: string
                multiple:
                    description: In purchase packagings.
                    nullable: true
                    type: string
                packagingId:
                    format: int32
                    nullable: true
                    type: integer
                packagingMissing:
                    description: 'The packaging the item names is no longer the variant''s: the item falls back to the unit (§11).'
                    type: boolean
                packagingName:
                    nullable: true
                    type: string
                packagingQuantity:
                    description: The packaging's quantity in the variant's unit.
                    nullable: true
                    type: string
                preferred:
                    type: boolean
                price:
                    description: Per the purchase packaging, in currency, four places at most.
                    nullable: true
                    type: string
                priceSetBy:
                    enum:
                        - person
                        - invoice
                        - import
                    nullable: true
                    type: string
                priceSetOn:
                    format: date
                    nullable: true
                    type: string
                productId:
                    format: int32
                    type: integer
                productName:
                    type: string
                productStatus:
                    type: string
                revision:
                    format: int32
                    type: integer
                sku:
                    type: string
                supplierId:
                    format: int64
                    type: integer
                supplierItemName:
                    nullable: true
                    type: string
                supplierItemNumber:
                    nullable: true
                    type: string
                supplierName:
                    type: string
                unit:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                variantId:
                    format: int32
                    type: integer
            required:
                - id
                - supplierId
                - supplierName
                - variantId
                - productId
                - sku
                - productName
                - unit
                - productStatus
                - currency
                - currencyDiffers
                - packagingMissing
                - preferred
                - revision
                - updatedAt
            type: object
        PurchasingSupplierItemInput:
            additionalProperties: false
            description: A new supplier item (P11). The first item of a variant is preferred whatever preferred says; preferred true on another makes it the preferred one.
            properties:
                leadTimeDays:
                    format: int32
                    maximum: 3650
                    minimum: 0
                    nullable: true
                    type: integer
                minimumQuantity:
                    nullable: true
                    type: string
                multiple:
                    nullable: true
                    type: string
                packagingId:
                    description: One of the variant's packagings; absent or null for the variant's unit.
                    format: int32
                    nullable: true
                    type: integer
                preferred:
                    type: boolean
                price:
                    description: A price as decimal text with at most four places.
                    nullable: true
                    type: string
                supplierId:
                    format: int64
                    type: integer
                supplierItemName:
                    maxLength: 255
                    nullable: true
                    type: string
                supplierItemNumber:
                    maxLength: 60
                    nullable: true
                    type: string
                variantId:
                    format: int32
                    type: integer
            required:
                - supplierId
                - variantId
            type: object
        PurchasingSupplierItemPage:
            additionalProperties: false
            description: A page of supplier items.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingSupplierItem'
                    type: array
                page:
                    format: int32
                    type: integer
                pageSize:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
                - page
                - pageSize
            type: object
        PurchasingSupplierItemUpdate:
            additionalProperties: false
            description: A supplier item's fields, whole; supplier and variant do not change.
            properties:
                leadTimeDays:
                    format: int32
                    maximum: 3650
                    minimum: 0
                    nullable: true
                    type: integer
                minimumQuantity:
                    nullable: true
                    type: string
                multiple:
                    nullable: true
                    type: string
                packagingId:
                    format: int32
                    nullable: true
                    type: integer
                preferred:
                    type: boolean
                price:
                    description: A price as decimal text with at most four places.
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                supplierItemName:
                    maxLength: 255
                    nullable: true
                    type: string
                supplierItemNumber:
                    maxLength: 60
                    nullable: true
                    type: string
            required:
                - revision
                - preferred
            type: object
        PurchasingSupplierList:
            additionalProperties: false
            description: Suppliers of the register.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingSupplier'
                    type: array
            required:
                - items
            type: object
        PurchasingUndoInput:
            additionalProperties: false
            description: Undo a receipt, with an optional note the reversal carries.
            properties:
                note:
                    maxLength: 1000
                    type: string
            type: object
        PurchasingVariantList:
            additionalProperties: false
            description: Variants for a line.
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/PurchasingVariantOption'
                    type: array
            required:
                - items
            type: object
        PurchasingVariantOption:
            additionalProperties: false
            description: A variant a line may name, with the supplier's item when the supplier sells it (P16).
            properties:
                name:
                    type: string
                packagings:
                    items:
                        $ref: '#/components/schemas/PurchasingPackaging'
                    type: array
                productId:
                    format: int32
                    type: integer
                productStatus:
                    type: string
                productType:
                    enum:
                        - Goods
                        - Service
                    type: string
                sku:
                    type: string
                supplierItem:
                    allOf:
                        - $ref: '#/components/schemas/PurchasingSupplierItem'
                    nullable: true
                unit:
                    type: string
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - productId
                - sku
                - name
                - unit
                - productType
                - productStatus
                - packagings
            type: object
        PurchasingVersionInput:
            additionalProperties: false
            description: A write that carries only the version read.
            properties:
                expectedUpdatedAt:
                    description: 'The updatedAt of the order as the client read it: the write is refused with version_conflict when the order was written since (every write moves it).'
                    format: date-time
                    type: string
            required:
                - expectedUpdatedAt
            type: object
info:
    title: Vantigo Purchasing API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/purchasing/buyers:
        get:
            description: The active holders of purchasing:orders-manage, as an order's reference picks one, by display name.
            operationId: listPurchasingBuyers
            parameters:
                - description: Matches the display name.
                  in: query
                  name: q
                  schema:
                    maxLength: 100
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingBuyerList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the buyers
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:access
    /api/v1/purchasing/meta:
        get:
            description: Whether an order can be sent by e-mail now (Communications on and the settings' channel able to send, P21), the base currency, the default site and the price tolerance, and whether the caller may write suppliers in the register.
            operationId: getPurchasingMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingMeta'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get what the Purchasing screens need
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:access
    /api/v1/purchasing/orders:
        get:
            description: Purchase orders, newest first (P23), filtered by status, supplier, site, Late (sent, open and past an expected day), Mine (the caller is the buyer) and a search of the number, the supplier's name and the supplier's reference.
            operationId: listPurchasingOrders
            parameters:
                - description: Any of the statuses; none means all.
                  explode: true
                  in: query
                  name: status
                  schema:
                    items:
                        enum:
                            - draft
                            - sent
                            - partially_received
                            - received
                            - closed
                            - cancelled
                        type: string
                    type: array
                  style: form
                - in: query
                  name: supplierId
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: siteId
                  schema:
                    format: int64
                    type: integer
                - description: Only late orders.
                  in: query
                  name: late
                  schema:
                    type: boolean
                - description: Only orders whose buyer is the caller.
                  in: query
                  name: mine
                  schema:
                    type: boolean
                - description: Only orders sent more than three business days ago with no confirmation.
                  in: query
                  name: unconfirmed
                  schema:
                    type: boolean
                - description: Only orders that are drafts, sent or partially received.
                  in: query
                  name: open
                  schema:
                    type: boolean
                - description: Matches the number, the supplier's name and the supplier's reference.
                  in: query
                  name: q
                  schema:
                    maxLength: 100
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    minimum: 1
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    maximum: 200
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingOrderPage'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List purchase orders
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:access
        post:
            description: 'Creates a draft purchase order (P15): no number until it is sent. The supplier is read through the directory and held FOR SHARE (A8); an inactive one is refused (supplier_inactive). Lines as P16.'
            operationId: createPurchasingOrder
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchasingOrderInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingOrder'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Bad Request — field errors, supplier_not_found, site_not_found, site_archived, currency_invalid, and the line refusals in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Conflict — supplier_inactive.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Service Unavailable — dependency_unavailable.
            summary: Create a purchase order
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:orders-manage
    /api/v1/purchasing/orders/{orderId}:
        delete:
            description: Deletes a draft (P18); a sent order is cancelled instead (order_not_draft).
            operationId: deletePurchasingOrder
            parameters:
                - in: path
                  name: orderId
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The updatedAt as read.
                  in: query
                  name: expectedUpdatedAt
                  required: true
                  schema:
                    format: date-time
                    type: string
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Conflict — order_not_draft, version_conflict.
            summary: Delete a draft purchase order
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:orders-manage
        get:
            description: One purchase order with its lines.
            operationId: getPurchasingOrder
            parameters:
                - in: path
                  name: orderId
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingOrder'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
            summary: Get a purchase order
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:access
        put:
            description: 'Saves an order''s header and lines whole (P15, P16, P18): a draft freely; a sent or partially received order within P18''s limits, every change written to the change log. A closed, received or cancelled order is refused (order_not_sent).'
            operationId: updatePurchasingOrder
            parameters:
                - in: path
                  name: orderId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchasingOrderUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingOrder'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Bad Request — field errors, supplier_not_found, site_not_found, site_archived, currency_invalid, and the line refusals in lines (quantity_below_received among them).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Conflict — version_conflict, order_not_sent, supplier_changed, supplier_inactive, currency_fixed, line_closed, line_kind_changed.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Service Unavailable — dependency_unavailable.
            summary: Update a purchase order
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:orders-manage
    /api/v1/purchasing/orders/{orderId}/cancel:
        post:
            description: Cancels a sent order with nothing received (P18, A16); a draft is deleted instead. An order that was mailed sends the supplier its cancellation, unless notifySupplier is false.
            operationId: cancelPurchasingOrder
            parameters:
                - in: path
                  name: orderId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchasingCancelInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingSendResult'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Bad Request — field errors.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Conflict — version_conflict, order_not_sent, order_has_receipts.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Service Unavailable — sending_disabled, mail_failed.
            summary: Cancel a purchase order
            tags:
                - Purchasing
            x-vantigo-access: permission:purchasing:orders-send
    /api/v1/purchasing/orders/{orderId}/close:
        post:
            description: 'Ends a sent or partially received order with its remainder (P18, A16): every open line is closed and its open quantity stops counting as on order.'
            operationId: closePurchasingOrder
            parameters:
                - in: path
                  name: orderId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchasingVersionInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PurchasingOrder'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Bad Request — field errors.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PurchasingProblem'
                    description: Not Found
                "409":
                    content:
