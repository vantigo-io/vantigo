components:
    schemas:
        AssistantAction:
            additionalProperties: false
            description: "What the assistant did for the caller: a tool or operation, its mode and the HTTP status the router answered. No request or response bodies."
            properties:
                createdAt:
                    format: date-time
                    type: string
                durationMs:
                    format: int32
                    type: integer
                httpStatus:
                    format: int32
                    type: integer
                id:
                    format: uuid
                    type: string
                mode:
                    type: string
                operationId:
                    type: string
                runId:
                    format: uuid
                    type: string
            required:
                - id
                - runId
                - operationId
                - mode
                - durationMs
                - createdAt
            type: object
        AssistantAvailability:
            additionalProperties: false
            properties:
                available:
                    type: boolean
                local:
                    description: True when the provider's endpoint is on a loopback, private or single-label host.
                    type: boolean
                reason:
                    description: Why not, when not available.
                    enum:
                        - not_configured
                        - disabled
                        - not_enabled
                    type: string
            required:
                - available
                - local
            type: object
        AssistantBulkExcluded:
            additionalProperties: false
            description: The items the person may not change, pre-checked before the plan is shown against the operation's access rule, the Owner's permission levels and the items themselves. A refusal that only a record's own rule gives shows when the change runs, as a failed item.
            properties:
                count:
                    format: int32
                    type: integer
                reasons:
                    items:
                        $ref: "#/components/schemas/AssistantBulkReason"
                    type: array
            required:
                - count
                - reasons
            type: object
        AssistantBulkItem:
            additionalProperties: false
            description: |
                One frozen item of a bulk plan and how it went. code and title are the problem's own, httpStatus the HTTP status; never a response body. in_flight is an item whose change is being made now; unknown an item whose change may or may not have been made, because the replica that was making it died: it is never run again, and the person checks it.
            properties:
                code:
                    type: string
                httpStatus:
                    format: int32
                    type: integer
                label:
                    type: string
                seq:
                    format: int32
                    type: integer
                status:
                    enum:
                        - pending
                        - in_flight
                        - succeeded
                        - failed
                        - skipped
                        - unknown
                    type: string
                title:
                    type: string
            required:
                - seq
                - status
            type: object
        AssistantBulkJob:
            additionalProperties: false
            description: A bulk job as it stands - the state, the counters and the first failures. The card polls it while the job runs.
            properties:
                failures:
                    description: The first 50 items that failed or are unknown (the unknown ones first), each with the refusal. All of them are in failures.csv.
                    items:
                        $ref: "#/components/schemas/AssistantBulkItem"
                    type: array
                canary:
                    description: How each of the first items went, once the canary has run. No value of the change.
                    items:
                        $ref: "#/components/schemas/AssistantBulkItem"
                    type: array
                canarySize:
                    format: int32
                    type: integer
                endedAt:
                    format: date-time
                    type: string
                errorCode:
                    description: Why the job ended other than done - cancelled, stopped_by_person, narrowed (the Owner narrowed what the assistant may use), session_ended (the person signed out), internal.
                    type: string
                excluded:
                    $ref: "#/components/schemas/AssistantBulkExcluded"
                failed:
                    format: int32
                    type: integer
                grantExpiresAt:
                    format: date-time
                    type: string
                jobId:
                    format: uuid
                    type: string
                pauseReason:
                    description: Why a job waits for Continue - grant_expiring (the assistant's permission, which is bound to the person's session, is about to lapse), or canary_done.
                    type: string
                processed:
                    format: int32
                    type: integer
                sample:
                    description: The first items, with the value each has now and would have. A decided plan keeps the labels and the names of the fields.
                    items:
                        $ref: "#/components/schemas/AssistantBulkSample"
                    type: array
                skipped:
                    format: int32
                    type: integer
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - previewed
                        - canary
                        - awaiting_continue
                        - running
                        - stopping
                        - done
                        - stopped
                        - failed
                        - expired
                    type: string
                succeeded:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
                unknown:
                    description: How many items may or may not have been changed - the replica making the change died and the item is never run again. They count as processed.
                    format: int32
                    type: integer
            required:
                - jobId
                - state
                - total
                - processed
                - succeeded
                - failed
                - unknown
                - skipped
                - canarySize
                - sample
                - excluded
                - canary
                - failures
            type: object
        AssistantBulkPlan:
            additionalProperties: false
            description: A bulk plan as its card shows it - the same as the job without the failed list. total is how many items the selector found when the plan was made; the items are frozen then and the job acts on exactly them.
            properties:
                canary:
                    description: How each of the first items went, once the canary has run. No value of the change.
                    items:
                        $ref: "#/components/schemas/AssistantBulkItem"
                    type: array
                canarySize:
                    format: int32
                    type: integer
                endedAt:
                    format: date-time
                    type: string
                errorCode:
                    description: Why the job ended other than done - cancelled, stopped_by_person, narrowed (the Owner narrowed what the assistant may use), session_ended (the person signed out), internal.
                    type: string
                excluded:
                    $ref: "#/components/schemas/AssistantBulkExcluded"
                failed:
                    format: int32
                    type: integer
                grantExpiresAt:
                    format: date-time
                    type: string
                jobId:
                    format: uuid
                    type: string
                pauseReason:
                    description: Why a job waits for Continue - grant_expiring (the assistant's permission, which is bound to the person's session, is about to lapse), or canary_done.
                    type: string
                processed:
                    format: int32
                    type: integer
                sample:
                    description: The first items, with the value each has now and would have. A decided plan keeps the labels and the names of the fields.
                    items:
                        $ref: "#/components/schemas/AssistantBulkSample"
                    type: array
                skipped:
                    format: int32
                    type: integer
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - previewed
                        - canary
                        - awaiting_continue
                        - running
                        - stopping
                        - done
                        - stopped
                        - failed
                        - expired
                    type: string
                succeeded:
                    format: int32
                    type: integer
                total:
                    format: int32
                    type: integer
                unknown:
                    description: How many items may or may not have been changed - the replica making the change died and the item is never run again. They count as processed.
                    format: int32
                    type: integer
            required:
                - jobId
                - state
                - total
                - processed
                - succeeded
                - failed
                - unknown
                - skipped
                - canarySize
                - sample
                - excluded
                - canary
            type: object
        AssistantBulkReason:
            additionalProperties: false
            properties:
                code:
                    description: missing_id (the item carries no value for the parameter it feeds).
                    type: string
                count:
                    format: int32
                    type: integer
            required:
                - code
                - count
            type: object
        AssistantBulkSample:
            additionalProperties: false
            properties:
                fields:
                    items:
                        $ref: "#/components/schemas/AssistantPendingField"
                    type: array
                label:
                    type: string
                route:
                    type: string
            required:
                - fields
            type: object
        AssistantAgentList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/AssistantAgentRef"
                    type: array
            required:
                - items
            type: object
        AssistantAgentRef:
            additionalProperties: false
            description: A virtual employee the person talks to in the panel.
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
        AssistantConversation:
            additionalProperties: false
            properties:
                agent:
                    allOf:
                        - $ref: "#/components/schemas/AssistantAgentRef"
                    description: The virtual employee this conversation is with, null for the Assistant's own.
                    nullable: true
                archived:
                    type: boolean
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                lastActivityAt:
                    format: date-time
                    type: string
                originApp:
                    type: string
                originRoute:
                    type: string
                pinned:
                    type: boolean
                running:
                    description: A run is in progress.
                    type: boolean
                title:
                    type: string
            required:
                - id
                - title
                - originApp
                - originRoute
                - pinned
                - archived
                - running
                - createdAt
                - lastActivityAt
            type: object
        AssistantConversationDetail:
            additionalProperties: false
            properties:
                actions:
                    items:
                        $ref: "#/components/schemas/AssistantAction"
                    type: array
                activeRun:
                    allOf:
                        - $ref: "#/components/schemas/AssistantRun"
                    description: The run that has not ended, running or awaiting_confirmation.
                conversation:
                    $ref: "#/components/schemas/AssistantConversation"
                lastRun:
                    allOf:
                        - $ref: "#/components/schemas/AssistantRun"
                    description: The latest run of the conversation when it is over, so a client that polled or reloaded can tell a run that failed or was stopped from one that finished.
                messages:
                    items:
                        $ref: "#/components/schemas/AssistantMessage"
                    type: array
                pendingActions:
                    description: Every change the assistant proposed in this conversation, oldest first, with its card and, once decided, its outcome. A decided action keeps no values.
                    items:
                        $ref: "#/components/schemas/AssistantPendingAction"
                    type: array
            required:
                - conversation
                - messages
                - actions
                - pendingActions
            type: object
        AssistantConversationList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: "#/components/schemas/AssistantConversation"
                    type: array
                nextCursor:
                    nullable: true
                    type: string
            required:
                - items
            type: object
        AssistantCreateConversationRequest:
            additionalProperties: false
            properties:
                agentId:
                    description: Talk to this virtual employee instead of the Assistant. The caller needs agents:view, and the agent must be active.
                    format: uuid
                    nullable: true
                    type: string
                origin:
                    $ref: "#/components/schemas/AssistantOrigin"
            required:
                - origin
            type: object
        AssistantMe:
            additionalProperties: false
            properties:
                lastConversationId:
                    format: uuid
                    nullable: true
                    type: string
            type: object
        AssistantMeRequest:
            additionalProperties: false
            properties:
                lastConversationId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - lastConversationId
            type: object
        AssistantMessage:
            additionalProperties: false
            properties:
                context:
                    $ref: "#/components/schemas/AssistantMessageContext"
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                inputTokens:
                    format: int32
                    type: integer
                model:
                    type: string
                outputTokens:
                    format: int32
                    type: integer
                parts:
                    items:
                        $ref: "#/components/schemas/AssistantPart"
                    type: array
                role:
                    enum:
                        - user
                        - assistant
                        - tool
                    type: string
                runId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - id
                - role
                - parts
                - createdAt
            type: object
        AssistantMessageContext:
            additionalProperties: false
            description: "The context chip as a message was sent with it: the app, the route, the route's ids and a label for the record or the screen. Never the page's contents."
            properties:
                app:
                    maxLength: 40
                    type: string
                label:
                    maxLength: 200
                    type: string
                params:
                    additionalProperties:
                        maxLength: 100
                        type: string
                    type: object
                route:
                    maxLength: 300
                    type: string
            required:
                - app
                - route
            type: object
        AssistantOrigin:
            additionalProperties: false
            description: "Where a conversation began: the app key and the route."
            properties:
                app:
                    maxLength: 40
                    type: string
                route:
                    maxLength: 300
                    type: string
            required:
                - app
                - route
            type: object
        AssistantPart:
            additionalProperties: false
            description: "One typed part of a message. text: the words (Markdown); tool_call: the assistant asked for a tool (name, label, the arguments it gave); tool_result: what the tool answered the model, compacted (status ok, refused or error); link: a record or screen in the app (route, label); confirmation: a change the assistant proposed, waiting for the person (actionId; the card is the conversation's pendingActions entry with that id); tour: a guided tour the person starts with a click (steps, each a registered target with a title and a text in the person's language)."
            properties:
                actionId:
                    format: uuid
                    type: string
                arguments:
                    additionalProperties: true
                    type: object
                callId:
                    type: string
                content:
                    type: string
                label:
                    type: string
                name:
                    type: string
                route:
                    type: string
                status:
                    enum:
                        - ok
                        - refused
                        - error
                    type: string
                steps:
                    items:
                        $ref: "#/components/schemas/AssistantTourStep"
                    type: array
                text:
                    type: string
                type:
                    enum:
                        - text
                        - tool_call
                        - tool_result
                        - link
                        - confirmation
                        - tour
                    type: string
            required:
                - type
            type: object
        AssistantPendingAction:
            additionalProperties: false
            description: "A change the assistant proposed and nothing has written yet, or has now been decided. summary is the operation's summary; explain is the assistant's own one-line description in the person's language, shown beside it and never instead of the fields. A decided action keeps the names of its fields and no values."
            properties:
                bulk:
                    $ref: "#/components/schemas/AssistantBulkPlan"
                conversationId:
                    format: uuid
                    type: string
                createdAt:
                    format: date-time
                    type: string
                decidedAt:
                    format: date-time
                    type: string
                expiresAt:
                    format: date-time
                    type: string
                explain:
                    type: string
                fields:
                    items:
                        $ref: "#/components/schemas/AssistantPendingField"
                    type: array
                id:
                    format: uuid
                    type: string
                kind:
                    description: change (one change) or bulk (a bulk plan, whose card is bulk).
                    enum:
                        - change
                        - bulk
                    type: string
                method:
                    type: string
                operationId:
                    type: string
                outcome:
                    $ref: "#/components/schemas/AssistantPendingOutcome"
                runId:
                    format: uuid
                    type: string
                status:
                    enum:
                        - pending
                        - confirmed
                        - cancelled
                        - expired
                        - failed
                    type: string
                summary:
                    type: string
                target:
                    $ref: "#/components/schemas/AssistantPendingTarget"
            required:
                - id
                - runId
                - conversationId
                - operationId
                - method
                - status
                - summary
                - fields
                - createdAt
                - expiresAt
            type: object
        AssistantPendingField:
            additionalProperties: false
            properties:
                current:
                    description: The value now, when a read of the same record could say. Absent for a new value only, and after the decision.
                    type: string
                name:
                    type: string
                next:
                    description: The value the change sets. Absent after the decision.
                    type: string
            required:
                - name
            type: object
        AssistantPendingOutcome:
            additionalProperties: false
            description: How a decided action ended. status is the HTTP status the operation answered; reason is cancelled, stopped, expired, changed (the record changed since the card was made), refused, interrupted or failed; message is a short sentence from the operation's own refusal when it gave one.
            properties:
                message:
                    type: string
                ok:
                    type: boolean
                reason:
                    type: string
                status:
                    format: int32
                    type: integer
            required:
                - ok
            type: object
        AssistantPendingTarget:
            additionalProperties: false
            description: The record the change is about, when the card could name it. route is an in-app route.
            properties:
                label:
                    type: string
                route:
                    type: string
            type: object
        AssistantPermission:
            additionalProperties: false
            properties:
                defaultLevel:
                    $ref: "#/components/schemas/AssistantPermissionLevel"
                description:
                    type: string
                display:
                    type: string
                effectiveLevel:
                    $ref: "#/components/schemas/AssistantPermissionLevel"
                key:
                    type: string
                override:
                    $ref: "#/components/schemas/AssistantPermissionLevel"
                    nullable: true
                sensitive:
                    type: boolean
            required:
                - key
                - display
                - sensitive
                - defaultLevel
                - effectiveLevel
            type: object
        AssistantPermissionGroup:
            additionalProperties: false
            properties:
                category:
                    type: string
                module:
                    type: string
                permissions:
                    items:
                        $ref: "#/components/schemas/AssistantPermission"
                    type: array
            required:
                - module
                - category
                - permissions
            type: object
        AssistantPermissionLevel:
            enum:
                - off
                - read
                - change
            type: string
        AssistantPermissionRequest:
            additionalProperties: false
            properties:
                level:
                    description: The level, or null to reset the permission to its default.
                    enum:
                        - off
                        - read
                        - change
                        - null
                    nullable: true
                    type: string
            required:
                - level
            type: object
        AssistantPermissionResult:
            additionalProperties: false
            properties:
                permission:
                    $ref: "#/components/schemas/AssistantPermission"
                version:
                    format: int32
                    type: integer
            required:
                - version
                - permission
            type: object
        AssistantPermissions:
            additionalProperties: false
            properties:
                groups:
                    items:
                        $ref: "#/components/schemas/AssistantPermissionGroup"
                    type: array
                version:
                    format: int32
                    type: integer
            required:
                - version
                - groups
            type: object
        AssistantPerson:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
                userId:
                    format: uuid
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - userId
                - enabled
                - version
            type: object
        AssistantPersonRequest:
            additionalProperties: false
            properties:
                enabled:
                    type: boolean
            required:
                - enabled
            type: object
        AssistantProblem:
            description: "An RFC 9457 problem with this module's refusal code: assistant_unavailable (403), not_found (404), run_in_progress (409), version_conflict (409), ai_unavailable (503), invalid (400). errors carries the field errors of a 400."
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        AssistantRun:
            additionalProperties: false
            properties:
                conversationId:
                    format: uuid
                    type: string
                endedAt:
                    format: date-time
                    type: string
                errorCode:
                    type: string
                id:
                    format: uuid
                    type: string
                startedAt:
                    format: date-time
                    type: string
                state:
                    enum:
                        - running
                        - awaiting_confirmation
                        - done
                        - failed
                        - stopped
                        - expired
                    type: string
                stopRequested:
                    type: boolean
                toolCalls:
                    format: int32
                    type: integer
            required:
                - id
                - conversationId
                - state
                - toolCalls
                - startedAt
                - stopRequested
            type: object
        AssistantSendMessageRequest:
            additionalProperties: false
            properties:
                context:
                    $ref: "#/components/schemas/AssistantMessageContext"
                text:
                    maxLength: 8000
                    minLength: 1
                    type: string
            required:
                - text
            type: object
        AssistantSettings:
            additionalProperties: false
            properties:
                configured:
                    description: The instance has an AI provider.
                    type: boolean
                dailyTokenBudget:
                    description: The most tokens one person may use on a business day, input and output; null is no limit.
                    format: int32
                    nullable: true
                    type: integer
                local:
                    type: boolean
                mode:
                    enum:
                        - all
                        - per_person
                        - disabled
                    type: string
                models:
                    items:
                        type: string
                    type: array
                provider:
                    type: string
                retentionMonths:
                    format: int32
                    maximum: 60
                    minimum: 1
                    type: integer
                sensitiveDefault:
                    description: "The default level of every Sensitive permission: off (not available) or read (can read)."
                    enum:
                        - off
                        - read
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                version:
                    format: int32
                    type: integer
            required:
                - mode
                - retentionMonths
                - sensitiveDefault
                - version
                - updatedAt
                - configured
                - local
                - models
            type: object
        AssistantSettingsRequest:
            additionalProperties: false
            properties:
                dailyTokenBudget:
                    description: The daily token budget per person, 1000 to 1000000000; 0 removes the limit. Left out, it is kept.
                    format: int32
                    minimum: 0
                    type: integer
                mode:
                    enum:
                        - all
                        - per_person
                        - disabled
                    type: string
                retentionMonths:
                    format: int32
                    type: integer
                sensitiveDefault:
                    enum:
                        - off
                        - read
                    type: string
            type: object
        AssistantTourStep:
            additionalProperties: false
            description: "One step of a guided tour. target is a key of the registry the module frontends declare (the server refuses any other); the screen it lives on is the registry's, never the model's."
            properties:
                body:
                    type: string
                target:
                    type: string
                title:
                    type: string
            required:
                - target
                - title
                - body
            type: object
        AssistantUpdateConversationRequest:
            additionalProperties: false
            properties:
                archived:
                    type: boolean
                pinned:
                    type: boolean
                title:
                    maxLength: 200
                    type: string
            type: object
        AssistantUsage:
            additionalProperties: false
            description: "What people used, per person and business day. Counts and tokens only: no content, no titles."
            properties:
                from:
                    format: date
                    type: string
                rows:
                    items:
                        $ref: "#/components/schemas/AssistantUsageRow"
                    type: array
                to:
                    format: date
                    type: string
            required:
                - from
                - to
                - rows
            type: object
        AssistantUsageRow:
            additionalProperties: false
            properties:
                confirmedChanges:
                    format: int32
                    type: integer
                conversations:
                    format: int32
                    type: integer
                day:
                    format: date
                    type: string
                failedChanges:
                    format: int32
                    type: integer
                inputTokens:
                    format: int64
                    type: integer
                name:
                    description: The person's display name; empty when they no longer exist.
                    type: string
                outputTokens:
                    format: int64
                    type: integer
                runs:
                    format: int32
                    type: integer
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - name
                - day
                - conversations
                - runs
                - inputTokens
                - outputTokens
                - confirmedChanges
                - failedChanges
            type: object
info:
    title: Vantigo Assistant API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/assistant/agents:
        get:
            description: "The active virtual employees the caller may talk to in the panel, ordered by name. Talking to one needs agents:view; a caller without it, or an installation without the agents module, gets an empty list."
            operationId: listAssistantAgents
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantAgentList"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Forbidden - assistant_unavailable (the assistant is not available to the caller), or the session's own refusal.
            summary: List the virtual employees the caller may talk to
            tags:
                - Assistant
            x-vantigo-access: session
            x-vantigo-assistant: never
    /api/v1/assistant/availability:
        get:
            description: "Whether the signed-in caller has the assistant: the instance has an AI provider, the workspace mode allows the caller, and (in per-person mode) their own switch is on. The shell asks it to decide whether to show the Assistant button. reason says why not: not_configured (no AI provider), disabled (the Owner turned the assistant off for everyone), not_enabled (per-person mode and the caller's switch is off). local says whether the provider's endpoint is local to the installation, for the data notice."
            operationId: getAssistantAvailability
            responses:
                "200":
