                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: "Not Found - not_found. Also what another person's action answers: the assistant never says whether it exists."
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Conflict - action_decided (already confirmed, cancelled, expired or failed), or action_expired (undecided for 24 hours).
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Service Unavailable - ai_unavailable.
            summary: Confirm a change the assistant proposed
            tags:
                - Assistant
            x-vantigo-access: session
            x-vantigo-assistant: never
    /api/v1/assistant/runs/{id}/stop:
        parameters:
            - in: path
              name: id
              required: true
              schema:
                  format: uuid
                  type: string
        post:
            description: Asks the run to stop at its next step. A run already over is answered as it is.
            operationId: stopAssistantRun
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantRun"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Forbidden - assistant_unavailable (the assistant is not available to the caller), or the session's own refusal.
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: "Not Found - not_found. Also what another person's conversation, run or action answers: the assistant never says whether it exists."
            summary: Stop a run
            tags:
                - Assistant
            x-vantigo-access: session
            x-vantigo-assistant: never
    /api/v1/assistant/settings:
        get:
            description: The workspace's mode, retention and sensitive data switch, with the provider and models the instance is configured for and whether that provider is local, for the data notice. Owner only.
            operationId: getAssistantSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantSettings"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Assistant settings
            tags:
                - Assistant
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-assistant: never
        put:
            description: Changes the mode, the retention in months (1 to 60), the sensitive data switch and the daily token budget per person; a field left out is kept. Guarded by If-Match, audited with before and after. Owner only.
            operationId: putAssistantSettings
            parameters:
                - description: The version the settings was read at, bare (3) or quoted ("3"). A version that has moved on is a 409 version_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssistantSettingsRequest"
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantSettings"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Bad Request - field errors, or an If-Match that is not a version
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Conflict - version_conflict.
            summary: Change the Assistant settings
            tags:
                - Assistant
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-assistant: never
    /api/v1/assistant/settings/permissions:
        get:
            description: The permission catalog of the enabled modules grouped by module and category, each with its default level, the Owner's override and the effective level. Owner only.
            operationId: getAssistantPermissions
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantPermissions"
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List what the assistant may use
            tags:
                - Assistant
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-assistant: never
    /api/v1/assistant/settings/permissions/{key}:
        parameters:
            - description: A permission key of the catalog, such as customers:view.
              in: path
              name: key
              required: true
              schema:
                  type: string
        put:
            description: Sets the level the assistant may use the permission at (off, read, change), or resets it to its default with null. Guarded by If-Match on the settings' version, audited with before and after. A key outside the catalog is a 404. Owner only.
            operationId: putAssistantPermission
            parameters:
                - description: The version the settings was read at, bare (3) or quoted ("3"). A version that has moved on is a 409 version_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                      type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AssistantPermissionRequest"
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantPermissionResult"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Bad Request - an unknown level, or an If-Match that is not a version
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: "Not Found - not_found. Also what another person's conversation, run or action answers: the assistant never says whether it exists."
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Conflict - version_conflict.
            summary: Set the level of one permission
            tags:
                - Assistant
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-assistant: never
    /api/v1/assistant/usage:
        get:
            description: "What people used of the assistant, per person and business day: the conversations they began, the runs, the model tokens (input and output) and the changes that were confirmed and that failed. The business time zone's days, at most 92 of them. Counts only: no content and no titles. Owner only."
            operationId: getAssistantUsage
            parameters:
                - description: The first day, inclusive. Defaults to 30 days before to.
                  in: query
                  name: from
                  required: false
                  schema:
                      format: date
                      type: string
                - description: The last day, inclusive. Defaults to today, in the business time zone.
                  in: query
                  name: to
                  required: false
                  schema:
                      format: date
                      type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/AssistantUsage"
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Bad Request - a range that is not valid or longer than 92 days
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Assistant usage
            tags:
                - Assistant
            x-vantigo-access: policy:OwnerManagement
            x-vantigo-assistant: never
