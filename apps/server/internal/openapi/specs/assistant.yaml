                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: "Not Found - not_found. Also what another person's conversation, run or action answers: the assistant never says whether it exists."
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Conflict - run_in_progress, or agent_unavailable (the agent was paused or deleted, or the caller lost agents:view).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Too Many Requests - the rate limit, or budget_exhausted (the person has used the day's token budget).
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: "#/components/schemas/AssistantProblem"
                    description: Service Unavailable - ai_unavailable.
            summary: Send a message and stream the assistant's answer
            tags:
                - Assistant
            x-vantigo-access: session
            x-vantigo-assistant: never
