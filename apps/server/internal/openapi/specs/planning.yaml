components:
    schemas:
        PlanningActor:
            additionalProperties: false
            description: Who wrote an event, as snapshotted when they did.
            properties:
                displayName:
                    type: string
                kind:
                    enum:
                        - user
                        - system
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - kind
                - displayName
            type: object
        PlanningAllocation:
            additionalProperties: false
            description: A person booked on a project over a period (S1).
            properties:
                confirmedAt:
                    description: When it was last confirmed; absent on a tentative row.
                    format: date-time
                    type: string
                createdAt:
                    format: date-time
                    type: string
                earliestRelease:
                    description: 'The earliest day the person can be released (S15), derived on read: the latest of toDate, the terms'' minimumUntil, and noticeGivenOn plus the notice period when notice is given — toDate alone when no term binds.'
                    format: date
                    type: string
                fromDate:
                    format: date
                    type: string
                handoverStart:
                    description: The earliest release less the terms' handoverDays, the day a successor should begin so the two overlap (S15); absent when no handover is set.
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                load:
                    format: double
                    type: number
                loadUnit:
                    $ref: '#/components/schemas/PlanningLoadUnit'
                note:
                    description: 'The planners'' note, at most 500 characters: present to planning:manage alone (S5).'
                    type: string
                person:
                    $ref: '#/components/schemas/PlanningPersonRef'
                project:
                    $ref: '#/components/schemas/PlanningProjectRef'
                requestId:
                    description: The request this row fills (S16); absent otherwise.
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /allocations/{id}.
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/PlanningAllocationStatus'
                terms:
                    $ref: '#/components/schemas/PlanningTerms'
                title:
                    description: The role as the project names it, at most 100 characters.
                    type: string
                toDate:
                    description: Inclusive.
                    format: date
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - person
                - project
                - fromDate
                - toDate
                - loadUnit
                - load
                - status
                - earliestRelease
                - revision
                - createdAt
                - updatedAt
            type: object
        PlanningAllocationInput:
            additionalProperties: false
            description: 'An allocation''s fields, on create and on a whole replace. status defaults by the project''s status on create: tentative on a planned project, confirmed on any other (S3).'
            properties:
                fromDate:
                    format: date
                    type: string
                load:
                    description: More than 0; at most 100 as percent, at most 80 as hours_per_week; two decimals.
                    format: double
                    type: number
                loadUnit:
                    $ref: '#/components/schemas/PlanningLoadUnit'
                note:
                    maxLength: 500
                    type: string
                personId:
                    format: int64
                    type: integer
                projectId:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/PlanningAllocationStatus'
                title:
                    maxLength: 100
                    type: string
                toDate:
                    description: On or after fromDate, at most 1096 days after it.
                    format: date
                    type: string
            required:
                - personId
                - projectId
                - fromDate
                - toDate
                - loadUnit
                - load
            type: object
        PlanningAllocationList:
            additionalProperties: false
            description: At most 500 allocations.
            properties:
                allocations:
                    items:
                        $ref: '#/components/schemas/PlanningAllocation'
                    type: array
            required:
                - allocations
            type: object
        PlanningAllocationStatus:
            description: tentative is the planner's draft — shown apart, weighing nothing in the headline figures, never shown to the person; confirmed is the plan (S3).
            enum:
                - tentative
                - confirmed
            type: string
        PlanningAllocationWritten:
            additionalProperties: false
            description: 'A write''s answer: the row and what it caused.'
            properties:
                allocation:
                    $ref: '#/components/schemas/PlanningAllocation'
                warnings:
                    items:
                        $ref: '#/components/schemas/PlanningWarning'
                    type: array
            required:
                - allocation
                - warnings
            type: object
        PlanningBoard:
            additionalProperties: false
            description: People against weeks (S10), at most 53 weeks.
            properties:
                allocations:
                    description: The allocations touching the window, for the bars.
                    items:
                        $ref: '#/components/schemas/PlanningAllocation'
                    type: array
                from:
                    format: date
                    type: string
                rows:
                    items:
                        $ref: '#/components/schemas/PlanningBoardRow'
                    type: array
                to:
                    format: date
                    type: string
                weeks:
                    items:
                        $ref: '#/components/schemas/PlanningWeek'
                    type: array
            required:
                - from
                - to
                - weeks
                - rows
                - allocations
            type: object
        PlanningBoardRow:
            additionalProperties: false
            description: 'One row of the board: a person (groupBy people) or a project (groupBy project).'
            properties:
                cells:
                    description: One per week of the board, in order.
                    items:
                        $ref: '#/components/schemas/PlanningWeekFigures'
                    type: array
                person:
                    $ref: '#/components/schemas/PlanningPerson'
                project:
                    $ref: '#/components/schemas/PlanningProject'
            required:
                - cells
            type: object
        PlanningCandidate:
            additionalProperties: false
            description: 'One person judged for a request (S17): their competence against the requirements, their free hours against the request''s, and the fit Staff scores — each with its figures, its flags and its reasons, so the planner sees why.'
            properties:
                availability:
                    description: 'fits: the person''s free hours over the period are at or above the hours the request would book; partial: fewer.'
                    enum:
                        - fits
                        - partial
                    type: string
                covers:
                    description: 'True when the person covers the request outright: every requirement met, availability fits and no flag (S18''s covered).'
                    type: boolean
                currentProject:
                    $ref: '#/components/schemas/PlanningCurrentProject'
                fit:
                    $ref: '#/components/schemas/PlanningFit'
                flags:
                    items:
                        $ref: '#/components/schemas/PlanningCandidateFlag'
                    type: array
                freeHours:
                    description: The person's free hours over the request's period, confirmed rows alone (S6).
                    format: double
                    type: number
                missing:
                    description: The keys of the requirements the person does not meet; listed only with includePartial, empty otherwise.
                    items:
                        type: string
                    type: array
                person:
                    $ref: '#/components/schemas/PlanningPerson'
                requiredHours:
                    description: The hours the request would book over its period, hoursPerWeek / 5 on each day with capacity.
                    format: double
                    type: number
            required:
                - person
                - availability
                - freeHours
                - requiredHours
                - fit
                - flags
                - missing
                - covers
            type: object
        PlanningCandidateFlag:
            additionalProperties: false
            description: 'Something the planner should know about a candidate (S17): certificate_expires — a certificate a requirement needs, held, but expiring before the request''s last day; date is its validTo and competenceKey the competence. release_after_start — a confirmed row of the person with terms (an assignment) whose earliest release (S15) is after the request''s first day; date is that release, handoverFrom its handover start when the terms set one, allocationId the row. needs_customer_approval — that row''s terms say a replacement needs the customer''s approval; allocationId the row. wishes — an open wish of the person, new or off their current project, from on or before the request''s first day; wishKind and date are the kind and the date, nothing more.'
            properties:
                allocationId:
                    format: int64
                    type: integer
                code:
                    enum:
                        - certificate_expires
                        - release_after_start
                        - needs_customer_approval
                        - wishes
                    type: string
                competenceKey:
                    type: string
                date:
                    format: date
                    type: string
                handoverFrom:
                    format: date
                    type: string
                wishKind:
                    $ref: '#/components/schemas/PlanningWishKind'
            required:
                - code
            type: object
        PlanningCandidateList:
            additionalProperties: false
            description: 'The candidates, sorted: fits first, then those who wish — a wishes flag — first, then fit score descending, then free hours descending, then the longest on their current project first, then by name. A person under a non-compete in force toward the request''s project''s customer is not listed (S17.3).'
            properties:
                candidates:
                    items:
                        $ref: '#/components/schemas/PlanningCandidate'
                    type: array
                includePartial:
                    type: boolean
            required:
                - candidates
                - includePartial
            type: object
        PlanningCompetence:
            additionalProperties: false
            description: 'One competence of Staff''s catalogue as Workforce.Competences answers it: for a request''s requirements and the board''s filter. A hidden one is offered for no new requirement.'
            properties:
                categoryKey:
                    type: string
                hasLevel:
                    type: boolean
                hidden:
                    type: boolean
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                kind:
                    enum:
                        - skill
                        - certificate
                    type: string
                nameEn:
                    type: string
                nameNb:
                    type: string
            required:
                - id
                - key
                - nameEn
                - nameNb
                - categoryKey
                - kind
                - hasLevel
                - hidden
            type: object
        PlanningCompetenceList:
            additionalProperties: false
            description: Empty when Staff answers the caller nothing (no staff:view).
            properties:
                competences:
                    items:
                        $ref: '#/components/schemas/PlanningCompetence'
                    type: array
            required:
                - competences
            type: object
        PlanningCoverage:
            description: 'Whether a request is covered (S18): filled, or at least one candidate covers it; partly_covered when every candidate is partial, flagged or missing something; uncovered when nobody is a candidate.'
            enum:
                - covered
                - partly_covered
                - uncovered
            type: string
        PlanningCurrentProject:
            additionalProperties: false
            description: 'The project of the person''s confirmed row covering today with the earliest from date, and the days since that date — the fairness signal (S17).'
            properties:
                days:
                    format: int32
                    type: integer
                project:
                    $ref: '#/components/schemas/PlanningProjectRef'
                since:
                    format: date
                    type: string
            required:
                - project
                - since
                - days
            type: object
        PlanningCustomerRef:
            additionalProperties: false
            description: A project's customer, an opaque link named through the customer directory.
            properties:
                id:
                    format: int32
                    type: integer
                name:
                    description: Absent when the customer directory does not resolve the id.
                    type: string
            required:
                - id
            type: object
        PlanningDateSpan:
            additionalProperties: false
            description: A run of civil dates.
            properties:
                from:
                    format: date
                    type: string
                to:
                    description: Inclusive.
                    format: date
                    type: string
            required:
                - from
                - to
            type: object
        PlanningDepartmentRef:
            additionalProperties: false
            description: A person's department as Staff names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        PlanningEvent:
            additionalProperties: false
            description: One write of the record (S23).
            properties:
                actor:
                    $ref: '#/components/schemas/PlanningActor'
                entityId:
                    format: int64
                    type: integer
                entityKind:
                    enum:
                        - allocation
                        - request
                        - wish
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    enum:
                        - allocation_created
                        - allocation_changed
                        - allocation_confirmed
                        - allocation_unconfirmed
                        - allocation_deleted
                        - request_created
                        - request_changed
                        - request_filled
                        - request_reopened
                        - request_withdrawn
                        - terms_set
                        - terms_cleared
                        - wish_created
                        - wish_seen
                        - wish_resolved
                        - wish_withdrawn
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                payload:
                    additionalProperties: true
                    description: The changed fields before and after, by the contract's field names.
                    type: object
                personId:
                    format: int64
                    type: integer
                projectId:
                    format: int32
                    type: integer
            required:
                - id
                - entityKind
                - entityId
                - kind
                - payload
                - actor
                - occurredAt
            type: object
        PlanningEventList:
            additionalProperties: false
            description: Newest first.
            properties:
                events:
                    items:
                        $ref: '#/components/schemas/PlanningEvent'
                    type: array
            required:
                - events
            type: object
        PlanningFillInput:
            additionalProperties: false
            description: 'Who fills the request (S16). status defaults by the project''s status, as on POST /allocations.'
            properties:
                personId:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/PlanningAllocationStatus'
            required:
                - personId
            type: object
        PlanningFit:
            additionalProperties: false
            description: 'How the booking fits what the person wants, as Staff scores it (S17.6): 100 less weight × 10 per preference the booking contradicts, and the kinds lowered — never a value.'
            properties:
                lowered:
                    items:
                        type: string
                    type: array
                score:
                    format: int32
                    type: integer
            required:
                - score
                - lowered
            type: object
        PlanningIntake:
            additionalProperties: false
            description: 'The pipeline (S18): every project in status planned, by code, with its open and filled requests judged for coverage.'
            properties:
                projects:
                    items:
                        $ref: '#/components/schemas/PlanningIntakeProject'
                    type: array
            required:
                - projects
            type: object
        PlanningIntakeProject:
            additionalProperties: false
            description: 'One planned project: its requests and its hours a week — requested over its open requests, tentative and confirmed over its rows, a percent row counted as its share of the person''s hours a week in force on its first day.'
            properties:
                confirmedHoursPerWeek:
                    format: double
                    type: number
                project:
                    $ref: '#/components/schemas/PlanningProject'
                requestedHoursPerWeek:
                    format: double
                    type: number
                requests:
                    items:
                        $ref: '#/components/schemas/PlanningIntakeRequest'
                    type: array
                tentativeHoursPerWeek:
                    format: double
                    type: number
            required:
                - project
                - requestedHoursPerWeek
                - tentativeHoursPerWeek
                - confirmedHoursPerWeek
                - requests
            type: object
        PlanningIntakeRequest:
            additionalProperties: false
            description: 'One request of the pipeline with its coverage; candidates is how many cover it outright, and key_person flags exactly one (S18).'
            properties:
                candidates:
                    format: int32
                    type: integer
                coverage:
                    $ref: '#/components/schemas/PlanningCoverage'
                flags:
                    items:
                        enum:
                            - key_person
                        type: string
                    type: array
                request:
                    $ref: '#/components/schemas/PlanningRequest'
            required:
                - request
                - coverage
                - candidates
                - flags
            type: object
        PlanningLoadUnit:
            description: 'How an allocation''s load is typed (planning design S2): percent of the person''s position (more than 0, at most 100), or hours_per_week (more than 0, at most 80). Two decimals.'
            enum:
                - percent
                - hours_per_week
            type: string
        PlanningMe:
            additionalProperties: false
            description: My planning (S19).
            properties:
                allocations:
                    description: Confirmed, from today on.
                    items:
                        $ref: '#/components/schemas/PlanningAllocation'
                    type: array
                person:
                    $ref: '#/components/schemas/PlanningPerson'
                wishes:
                    description: The caller's open wishes, oldest first (S21).
                    items:
                        $ref: '#/components/schemas/PlanningWish'
                    type: array
            required:
                - person
                - allocations
                - wishes
            type: object
        PlanningMeta:
            additionalProperties: false
            description: What the app needs to start (§5). settings is present for planning:manage alone.
            properties:
                canManage:
                    description: planning:manage — the writes, the notes and the settings.
                    type: boolean
                canView:
                    description: planning:view — the board, the plans, the timelines, the unbooked list, the events, the stats.
                    type: boolean
                hasPerson:
                    description: 'Whether Staff answers a person for the caller (Workforce.Self): My planning has someone to show.'
                    type: boolean
                loadUnits:
                    description: The load units an allocation may be typed in.
                    items:
                        $ref: '#/components/schemas/PlanningLoadUnit'
                    type: array
                settings:
                    $ref: '#/components/schemas/PlanningSettings'
                workforceVisible:
                    description: False when the caller may see the plan but Staff answered nobody for them — they lack staff:view — so an empty board is never mistaken for an empty plan.
                    type: boolean
            required:
                - canView
                - canManage
                - hasPerson
                - workforceVisible
                - loadUnits
            type: object
        PlanningNoticeUnit:
            description: The unit of a notice period (S14), as Staff's terms carry notice.
            enum:
                - days
                - weeks
                - months
            type: string
        PlanningOverbooking:
            description: 'warn: a write that overbooks a week is written with the warning overbooked. refuse: a write that makes a week''s excess grow is the 409 overbooked (S7).'
            enum:
                - warn
                - refuse
            type: string
        PlanningPeopleList:
            additionalProperties: false
            description: The people of a window (S8).
            properties:
                people:
                    items:
                        $ref: '#/components/schemas/PlanningPerson'
                    type: array
            required:
                - people
            type: object
        PlanningPerson:
            additionalProperties: false
            description: 'A person as Staff answers them to the caller (Workforce.People): the work group, never a private field.'
            properties:
                department:
                    $ref: '#/components/schemas/PlanningDepartmentRef'
                displayName:
                    type: string
                employed:
                    description: The days of the window asked the person is in employment, merged.
                    items:
                        $ref: '#/components/schemas/PlanningDateSpan'
                    type: array
                employeeNumber:
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - displayName
                - employeeNumber
                - employed
            type: object
        PlanningPersonRef:
            additionalProperties: false
            description: 'The person of an allocation: an opaque id, named when Staff answers them.'
            properties:
                displayName:
                    description: Null when Staff does not answer the person to the caller — erased, left, or not visible — which the app shows as Erased person or A colleague (rule 4).
                    nullable: true
                    type: string
                employeeNumber:
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - displayName
                - id
            type: object
        PlanningProblem:
            description: 'An RFC 9457 problem with this module''s refusal code (planning design §4.7). code names the rule that refused and is what a client keys off, never the words: outside_employment (409: a day of the period lies outside the person''s employment as Staff answers it), project_closed (409: the project is completed or cancelled and takes no new row and no change but deletion), overbooked (409: under the setting overbooking refuse, the write would make a week''s confirmed excess over capacity grow; weeks are named in detail), period_too_long (400, a field error on toDate: more than 1096 days), window_out_of_bounds (400, a field error on from, to, fromDate or toDate: the window lies outside Staff''s bound, the Monday thirteen weeks before today to three years after it), request_not_open (409: the request is filled or withdrawn and takes no fill, no change and no withdrawal), non_compete (409: the write would place a confirmed row of the person on a project of a customer their non-compete in force names, S17.3), wish_exists (409: the person already wishes off that project), wish_limit (409: the person has five open wishes), wish_no_booking (409: an off wish names a project the person has no confirmed row on today or later), revision_conflict (409: the If-Match revision has moved on, or the row kept changing under a DELETE or a confirm), no_person (404: the caller is nobody''s person in Staff) and dependency_unavailable (503: a module Planning reads is not composed). errors carries the field errors of a 400, keyed by the request''s camelCase field; a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        PlanningProject:
            additionalProperties: false
            description: 'A project as the directory answers it (S9): never its currency or bill rate.'
            properties:
                code:
                    type: string
                customer:
                    $ref: '#/components/schemas/PlanningCustomerRef'
                endDate:
                    description: The project's planned end; absent when it has none.
                    format: date
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                startDate:
                    description: The project's planned start; absent when it has none.
                    format: date
                    type: string
                status:
                    $ref: '#/components/schemas/PlanningProjectStatus'
            required:
                - id
                - code
                - name
                - status
            type: object
        PlanningProjectList:
            additionalProperties: false
            description: Plannable projects by code.
            properties:
                projects:
                    items:
                        $ref: '#/components/schemas/PlanningProject'
                    type: array
            required:
                - projects
            type: object
        PlanningProjectPlan:
            additionalProperties: false
            description: A project's plan over a window (S11).
            properties:
                allocations:
                    items:
                        $ref: '#/components/schemas/PlanningAllocation'
                    type: array
                project:
                    $ref: '#/components/schemas/PlanningProject'
                requests:
                    description: The project's open and filled requests touching the window; withdrawn ones are not shown.
                    items:
                        $ref: '#/components/schemas/PlanningRequest'
                    type: array
                weeks:
                    items:
                        $ref: '#/components/schemas/PlanningProjectPlanWeek'
                    type: array
            required:
                - project
                - allocations
                - requests
                - weeks
            type: object
        PlanningProjectPlanWeek:
            additionalProperties: false
            description: One week of a project's plan.
            properties:
                booked:
                    format: double
                    type: number
                demand:
                    description: 'The open demand (S16): over the project''s open requests covering the week, hoursPerWeek × the weekdays of the week inside the request''s period / 5.'
                    format: double
                    type: number
                monday:
                    format: date
                    type: string
                tentative:
                    format: double
                    type: number
            required:
                - monday
                - booked
                - tentative
                - demand
            type: object
        PlanningProjectRef:
            additionalProperties: false
            description: 'The project of an allocation: an opaque id, named when the directory resolves it (rule 4).'
            properties:
                code:
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/PlanningProjectStatus'
            required:
                - id
            type: object
        PlanningProjectStatus:
            description: The project's status as Projects answers it.
            enum:
                - planned
                - active
                - on-hold
                - completed
                - cancelled
            type: string
        PlanningRequest:
            additionalProperties: false
            description: 'A project''s need for a person not yet named (S16): a period, hours a week, competence requirements, and a status — open, filled while an allocation names it, or withdrawn.'
            properties:
                createdAt:
                    format: date-time
                    type: string
                filledBy:
                    $ref: '#/components/schemas/PlanningRequestFilledBy'
                fromDate:
                    format: date
                    type: string
                hoursPerWeek:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                note:
                    description: 'The planners'' note, at most 500 characters: present to planning:manage alone (S5).'
                    type: string
                project:
                    $ref: '#/components/schemas/PlanningProjectRef'
                requirements:
                    items:
                        $ref: '#/components/schemas/PlanningRequirement'
                    type: array
                revision:
                    description: Send it back as If-Match on PUT /requests/{id}.
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/PlanningRequestStatus'
                title:
                    type: string
                toDate:
                    description: Inclusive.
                    format: date
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - project
                - title
                - fromDate
                - toDate
                - hoursPerWeek
                - status
                - requirements
                - revision
                - createdAt
                - updatedAt
            type: object
        PlanningRequestFilled:
            additionalProperties: false
            description: 'A fill''s answer: the request now filled, the allocation that fills it, and the allocation''s warnings.'
            properties:
                allocation:
                    $ref: '#/components/schemas/PlanningAllocation'
                request:
                    $ref: '#/components/schemas/PlanningRequest'
                warnings:
                    items:
                        $ref: '#/components/schemas/PlanningWarning'
                    type: array
            required:
                - request
                - allocation
                - warnings
            type: object
        PlanningRequestFilledBy:
            additionalProperties: false
            description: The allocation that fills the request and its person; present on a filled request alone.
            properties:
                allocationId:
                    format: int64
                    type: integer
                person:
                    $ref: '#/components/schemas/PlanningPersonRef'
            required:
                - allocationId
                - person
            type: object
        PlanningRequestInput:
            additionalProperties: false
            description: 'A request''s fields, on create and on a whole replace (S16). requirements left out means none.'
            properties:
                fromDate:
                    format: date
                    type: string
                hoursPerWeek:
                    description: More than 0, at most 80; two decimals.
                    format: double
                    type: number
                note:
                    maxLength: 500
                    type: string
                projectId:
                    format: int32
                    type: integer
                requirements:
                    description: At most 10, each competence once.
                    items:
                        $ref: '#/components/schemas/PlanningRequirementInput'
                    type: array
                title:
                    maxLength: 100
                    minLength: 1
                    type: string
                toDate:
                    description: On or after fromDate, at most 1096 days after it.
                    format: date
                    type: string
            required:
                - projectId
                - title
                - fromDate
                - toDate
                - hoursPerWeek
            type: object
        PlanningRequestList:
            additionalProperties: false
            description: At most 500 requests, by from date then id.
            properties:
                requests:
                    items:
                        $ref: '#/components/schemas/PlanningRequest'
                    type: array
            required:
                - requests
            type: object
        PlanningRequestStatus:
            description: 'open is demand; filled, exactly while an allocation names the request; withdrawn is final (S16).'
            enum:
                - open
                - filled
                - withdrawn
            type: string
        PlanningRequestWritten:
            additionalProperties: false
            description: 'A request write''s answer: the row and what it caused (outside_project_dates).'
            properties:
                request:
                    $ref: '#/components/schemas/PlanningRequest'
                warnings:
                    items:
                        $ref: '#/components/schemas/PlanningWarning'
                    type: array
            required:
                - request
                - warnings
            type: object
        PlanningRequirement:
            additionalProperties: false
            description: 'A competence the person who fills the request must hold on its first day (S16), named from the catalogue when it still answers it (rule 4).'
            properties:
                competenceId:
                    format: int64
                    type: integer
                hasLevel:
                    type: boolean
                key:
                    type: string
                kind:
                    enum:
                        - skill
                        - certificate
                    type: string
                minLevel:
                    description: 0 to 4, on a competence with a level alone.
                    format: int32
                    type: integer
                nameEn:
                    type: string
                nameNb:
                    type: string
            required:
                - competenceId
            type: object
        PlanningRequirementInput:
            additionalProperties: false
            properties:
                competenceId:
                    format: int64
                    type: integer
                minLevel:
                    description: 0 to 4, on a competence with a level alone; a field error otherwise.
                    format: int32
                    type: integer
            required:
                - competenceId
            type: object
        PlanningSettings:
            additionalProperties: false
            description: The installation's Planning settings (S20).
            properties:
                defaultLoadUnit:
                    $ref: '#/components/schemas/PlanningLoadUnit'
                endingLeadWeeks:
                    description: '1 to 26: a confirmed row ending within it with no follow-on is an attention item.'
                    format: int32
                    type: integer
                overbooking:
                    $ref: '#/components/schemas/PlanningOverbooking'
                requestLeadDays:
                    description: '0 to 365: an open request starting within it is an attention item (requestsOpen).'
                    format: int32
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /settings.
                    format: int32
                    type: integer
                unbookedHorizonWeeks:
                    description: '1 to 52: the weeks from today the unbooked list looks at.'
                    format: int32
                    type: integer
                unbookedThresholdPercent:
                    description: '1 to 100: a person whose confirmed load over the horizon is under it is unbooked (S13).'
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
            required:
                - overbooking
                - defaultLoadUnit
                - unbookedThresholdPercent
                - unbookedHorizonWeeks
                - requestLeadDays
                - endingLeadWeeks
                - revision
                - updatedAt
            type: object
        PlanningSettingsRequest:
            additionalProperties: false
            description: 'PUT /settings'' body: every field left out keeps its value; a property the schema does not name is refused as a field error.'
            properties:
                defaultLoadUnit:
                    $ref: '#/components/schemas/PlanningLoadUnit'
                endingLeadWeeks:
                    format: int32
                    type: integer
                overbooking:
                    $ref: '#/components/schemas/PlanningOverbooking'
                requestLeadDays:
                    format: int32
                    type: integer
                unbookedHorizonWeeks:
                    format: int32
                    type: integer
                unbookedThresholdPercent:
                    format: int32
                    type: integer
            type: object
        PlanningStats:
            additionalProperties: false
            description: The dashboard card's figures (S22).
            properties:
                loadPercentThisWeek:
                    description: Confirmed booked / capacity this week × 100; absent when the capacity is 0.
                    format: double
                    type: number
                openRequests:
                    description: Requests in status open.
                    format: int32
                    type: integer
                peoplePlannedThisWeek:
                    description: People with a confirmed booking this week.
                    format: int32
                    type: integer
                tentativeLoadPercentThisWeek:
                    description: The same for tentative rows.
                    format: double
                    type: number
                unbooked:
                    description: People on the unbooked list.
                    format: int32
                    type: integer
            required:
                - peoplePlannedThisWeek
                - unbooked
                - openRequests
            type: object
        PlanningStatsAttentionItem:
            additionalProperties: false
            description: 'One thing the dashboard wants a human to look at, in the shape every module''s /stats/attention shares (S22). unbooked (planning:view): a person under the threshold within the horizon. overbooked (planning:view): a person with a week in the horizon whose confirmed booked exceeds capacity. endingWithoutFollowOn (planning:manage): a confirmed row ending within endingLeadWeeks where the person has no confirmed row starting on or before that end plus seven days. certificatesExpiring (planning:view): a held certificate expiring inside a confirmed row within the horizon. requestsOpen (planning:manage): an open request starting within requestLeadDays, or already started. wishesUnseen (planning:manage): one item standing for every open wish no planner has stamped seen, count how many. A caller with neither role gets an empty list.'
            properties:
                count:
                    description: How many the item stands for, when it stands for more than one.
                    format: int32
                    type: integer
                entityId:
                    description: The person's id, the allocation's for endingWithoutFollowOn, the request's for requestsOpen, or the oldest unseen wish's for wishesUnseen.
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    enum:
                        - unbooked
                        - overbooked
                        - endingWithoutFollowOn
                        - certificatesExpiring
                        - requestsOpen
                        - wishesUnseen
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        PlanningTerms:
            additionalProperties: false
            description: 'The terms of an allocation that is also a contract with the customer (S14), planning:manage''s alone: the notice as a count and a unit, when notice was given, the day before which the customer need not release, whether a replacement needs the customer''s approval, the handover overlap in days, the non-compete toward named customers until a date, and the contract''s reference. Set on a tentative row they bind once the row is confirmed (reading 8). The dates derived from them are on the allocation (earliestRelease, handoverStart).'
            properties:
                createdAt:
                    format: date-time
                    type: string
                handoverDays:
                    format: int32
                    type: integer
                minimumUntil:
                    format: date
                    type: string
                nonCompeteCustomers:
                    description: The customers the non-compete names, each read through the customer directory; empty when there is no non-compete.
                    items:
                        $ref: '#/components/schemas/PlanningCustomerRef'
                    type: array
                nonCompeteUntil:
                    format: date
                    type: string
                noticeCount:
                    format: int32
                    type: integer
                noticeGivenOn:
                    format: date
                    type: string
                noticeUnit:
                    $ref: '#/components/schemas/PlanningNoticeUnit'
                reference:
                    type: string
                replacementNeedsApproval:
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /allocations/{id}/terms.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
            required:
                - replacementNeedsApproval
                - nonCompeteCustomers
                - revision
                - createdAt
                - updatedAt
            type: object
        PlanningTermsInput:
            additionalProperties: false
            description: 'The terms whole, on set and on replace (S14): a field left out is cleared. noticeCount and noticeUnit both or neither; nonCompeteUntil required when any customer id is given; each id read from the customer directory, an unknown one a field error on nonCompeteCustomerIds.'
            properties:
                handoverDays:
                    description: 0 to 90.
                    format: int32
                    type: integer
                minimumUntil:
                    format: date
                    type: string
                nonCompeteCustomerIds:
                    description: At most 20, Customers' ids.
                    items:
                        format: int32
                        type: integer
                    maxItems: 20
                    type: array
                nonCompeteUntil:
                    format: date
                    type: string
                noticeCount:
                    description: 1 to 365.
                    format: int32
                    type: integer
                noticeGivenOn:
                    format: date
                    type: string
                noticeUnit:
                    $ref: '#/components/schemas/PlanningNoticeUnit'
                reference:
                    maxLength: 200
                    type: string
                replacementNeedsApproval:
                    description: Defaults to false.
                    type: boolean
            type: object
        PlanningTimeline:
            additionalProperties: false
            description: One person's forward view (S12).
            properties:
                allocations:
                    items:
                        $ref: '#/components/schemas/PlanningAllocation'
                    type: array
                away:
                    description: Whole-day spans away, coalesced — never a type or a share.
                    items:
                        $ref: '#/components/schemas/PlanningDateSpan'
                    type: array
                employed:
                    items:
                        $ref: '#/components/schemas/PlanningDateSpan'
                    type: array
                flags:
                    items:
                        $ref: '#/components/schemas/PlanningTimelineFlag'
                    type: array
                person:
                    $ref: '#/components/schemas/PlanningPerson'
                wishes:
                    description: The person's open wishes, to planning:manage and to the person themself; empty to anyone else (S21).
                    items:
                        $ref: '#/components/schemas/PlanningWish'
                    type: array
            required:
                - person
                - employed
                - away
                - allocations
                - flags
                - wishes
            type: object
        PlanningTimelineFlag:
            additionalProperties: false
            description: A flag on one allocation of the timeline (S12).
            properties:
                allocationId:
                    format: int64
                    type: integer
                code:
                    enum:
                        - beyond_employment
                        - certificate_expires
                    type: string
                date:
                    description: 'The day the flag is about: the employment''s end, or the certificate''s validTo.'
                    format: date
                    type: string
            required:
                - allocationId
                - code
            type: object
        PlanningUnbooked:
            additionalProperties: false
            description: The people under the threshold within the horizon (S13), by roll-off then load.
            properties:
                horizon:
                    $ref: '#/components/schemas/PlanningDateSpan'
                people:
                    items:
                        $ref: '#/components/schemas/PlanningUnbookedPerson'
                    type: array
            required:
                - horizon
                - people
            type: object
        PlanningUnbookedPerson:
            additionalProperties: false
            description: One unbooked person.
            properties:
                freeHours:
                    format: double
                    type: number
                loadPercent:
                    description: Confirmed booked / available over the horizon × 100.
                    format: double
                    type: number
                person:
                    $ref: '#/components/schemas/PlanningPerson'
                rollOff:
                    description: The last day of their latest confirmed allocation ending inside the horizon; absent when none does.
                    format: date
                    type: string
            required:
                - person
                - loadPercent
                - freeHours
            type: object
        PlanningWarning:
            additionalProperties: false
            description: 'A consequence of a write that did not stop it (rule 6). non_compete, on a tentative row alone: the person''s non-compete in force names the project''s customer; allocationId is the confirmed row whose terms bind and date its nonCompeteUntil — the same case refuses a confirmed row (S17.3).'
            properties:
                allocationId:
                    format: int64
                    type: integer
                code:
                    enum:
                        - overbooked
                        - booked_while_away
                        - outside_project_dates
                        - non_compete
                    type: string
                date:
                    format: date
                    type: string
                detail:
                    type: string
                weeks:
                    description: The Mondays of the weeks the warning is about.
                    items:
                        format: date
                        type: string
                    type: array
            required:
                - code
            type: object
        PlanningWeek:
            additionalProperties: false
            description: One week, Monday to Sunday, by its Monday.
            properties:
                monday:
                    format: date
                    type: string
            required:
                - monday
            type: object
        PlanningWeekFigures:
            additionalProperties: false
            description: One week's figures of the capacity calculation (S6).
            properties:
                available:
                    description: 'Hours: capacity on the days not away.'
                    format: double
                    type: number
                away:
                    description: Whether any day of the week is a day away — never a type, a share or an hour.
                    type: boolean
                booked:
                    description: Hours booked by confirmed allocations.
                    format: double
                    type: number
                busyDays:
                    description: 'The days of the week the calendar shows the person busy all day — an all-day appointment, or an all-day Outlook event shown as busy or out of office (calendar Outlook sync design O9.8). Shown, not subtracted: available, free and loadPercent do not count it. Absent when the calendar answers nothing for the person (the calendar off, the caller without the permission to see their calendar, no user linked).'
                    type: integer
                busyHours:
                    description: 'Hours the calendar shows the person busy in the week — their appointments that block time and their Outlook events shown as busy or out of office, merged so an overlap counts once, in the business time zone, rounded to 0.1 (calendar Outlook sync design O9.8). Shown, not subtracted: a meeting about the project is often the booking''s own time, so available, free and loadPercent do not count it. Absent when the calendar answers nothing for the person, as busyDays.'
                    format: double
                    type: number
                capacity:
                    description: 'Hours: the position''s hours a week over five on each weekday that is not a public holiday.'
                    format: double
                    type: number
                free:
                    description: available − booked; may be negative.
                    format: double
                    type: number
                loadPercent:
                    description: booked / capacity × 100 over the week; absent when the week's capacity is 0.
                    format: double
                    type: number
                monday:
                    format: date
                    type: string
                tentative:
                    description: Hours booked by tentative allocations, apart.
                    format: double
                    type: number
            required:
                - monday
                - capacity
                - available
                - booked
                - tentative
                - free
                - away
            type: object
        PlanningWish:
            additionalProperties: false
            description: 'A person''s wish (S21): off a named project from a date, or for something new from a date — no free text. Open wishes only; a resolved or withdrawn wish is deleted and its event keeps the kind, the project id and the date.'
            properties:
                createdAt:
                    format: date-time
                    type: string
                fromDate:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/PlanningWishKind'
                person:
                    $ref: '#/components/schemas/PlanningPersonRef'
                project:
                    $ref: '#/components/schemas/PlanningProjectRef'
                seenAt:
                    description: When a planner stamped it seen; absent until then.
                    format: date-time
                    type: string
            required:
                - id
                - person
                - kind
                - fromDate
                - createdAt
            type: object
        PlanningWishInput:
            additionalProperties: false
            description: 'A new wish of the caller''s (S21): off needs projectId, a project the caller has a confirmed row on today or later; new takes none. fromDate on or after today.'
            properties:
                fromDate:
                    format: date
                    type: string
                kind:
                    $ref: '#/components/schemas/PlanningWishKind'
                projectId:
                    format: int32
                    type: integer
            required:
                - kind
                - fromDate
            type: object
        PlanningWishKind:
            description: 'off: the person wants off the named project from the date. new: the person wants something new from the date.'
            enum:
                - off
                - new
            type: string
        PlanningWishList:
            additionalProperties: false
            description: Open wishes, oldest first.
            properties:
                wishes:
                    items:
                        $ref: '#/components/schemas/PlanningWish'
                    type: array
            required:
                - wishes
            type: object
info:
    title: Vantigo Planning API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/planning/allocations:
        get:
            description: Allocations touching the window, at most 500, by from date then id.
            operationId: listPlanningAllocations
            parameters:
                - description: Only this person's.
                  in: query
                  name: personId
                  required: false
                  schema:
                    format: int64
                    type: integer
                - description: Only this project's.
                  in: query
                  name: projectId
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: The window's first day, a civil date. Defaults as the operation says.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date
                    type: string
                - description: The window's last day, inclusive. Defaults as the operation says.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date
                    type: string
                - description: Only rows in this status.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/PlanningAllocationStatus'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PlanningAllocationList'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: Bad Request — a date that does not parse, to before from, or a window outside the bound (the Monday thirteen weeks before today to three years after it).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Service Unavailable — dependency_unavailable: a module Planning reads through a contract is not composed. Nothing was changed.'
            summary: List allocations
            tags:
                - Planning
            x-vantigo-access: permission:planning:access+planning:view
        post:
            description: 'Books a person on a project (S1–S7): the person''s lock taken, the warnings answered with the row.'
            operationId: createPlanningAllocation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PlanningAllocationInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PlanningAllocationWritten'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: Bad Request — field errors on the body.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: Conflict — outside_employment, project_closed, non_compete (a confirmed row on a project of a customer the person's non-compete names), or overbooked under refuse.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Service Unavailable — dependency_unavailable: a module Planning reads through a contract is not composed. Nothing was changed.'
            summary: Create an allocation
            tags:
                - Planning
            x-vantigo-access: permission:planning:access+planning:manage
    /api/v1/planning/allocations/{id}:
        delete:
            description: Deletes the allocation; a confirmed row's person is told.
            operationId: deletePlanningAllocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Bad Request — window_out_of_bounds on fromDate or toDate: Staff judged the row''s period outside its bound, as it can when the day turns during the request.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such allocation. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Conflict — revision_conflict: the row kept changing while it was being deleted.'
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Service Unavailable — dependency_unavailable: a module Planning reads through a contract is not composed. Nothing was changed.'
            summary: Delete an allocation
            tags:
                - Planning
            x-vantigo-access: permission:planning:access+planning:manage
        get:
            description: One allocation; the note to planning:manage alone.
            operationId: getPlanningAllocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PlanningAllocation'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such allocation. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Service Unavailable — dependency_unavailable: a module Planning reads through a contract is not composed. Nothing was changed.'
            summary: Get an allocation
            tags:
                - Planning
            x-vantigo-access: permission:planning:access+planning:view
        put:
            description: Replaces the allocation whole, guarded by If-Match. A confirmed row set back to tentative tells the person.
            operationId: putPlanningAllocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PlanningAllocationInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PlanningAllocationWritten'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: Bad Request — field errors on the body, or an If-Match that is not a revision.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such allocation. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: Conflict — revision_conflict, outside_employment, project_closed, non_compete (a confirmed row on a project of a customer the person's non-compete names), or overbooked under refuse.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
                    description: 'Service Unavailable — dependency_unavailable: a module Planning reads through a contract is not composed. Nothing was changed.'
            summary: Change an allocation
            tags:
                - Planning
            x-vantigo-access: permission:planning:access+planning:manage
    /api/v1/planning/allocations/{id}/confirm:
        post:
            description: Confirms a tentative row and tells the person (S3, S19); a confirmed row is answered as it is.
            operationId: confirmPlanningAllocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PlanningAllocationWritten'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/PlanningProblem'
