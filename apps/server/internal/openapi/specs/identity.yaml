            operationId: deleteIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            nullable: true
                            oneOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            type: object
            responses:
                "200":
                    description: OK
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
        post:
            operationId: postIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            nullable: true
                            oneOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            type: object
            responses:
                "200":
                    description: OK
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
        put:
            operationId: putIdentityAccessGroupsByGroupIdMembersByUserId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: userId
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            nullable: true
                            oneOf:
                                - $ref: '#/components/schemas/MutationRequest'
                            type: object
            responses:
                "200":
                    description: OK
            tags:
                - Identity control plane
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/groups/{groupId}/role-mappings/{roleId}:
        delete:
            operationId: deleteIdentityAccessGroupsByGroupIdRoleMappingsByRoleId
            parameters:
                - in: path
                  name: groupId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - in: path
                  name: roleId
                  required: true
                  schema:
                    format: uuid
                    type: string
