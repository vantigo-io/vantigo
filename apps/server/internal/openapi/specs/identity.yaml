components:
    schemas:
        AccessGroupRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                displayName:
                    nullable: true
                    type: string
                isActive:
                    type: boolean
            required:
                - displayName
                - isActive
            type: object
        AccessGroupResponse:
            properties:
                concurrencyStamp:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
                isActive:
                    type: boolean
                memberUserIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                roleIds:
                    items:
                        format: uuid
                        type: string
                    type: array
                scimConnectionId:
                    format: uuid
                    nullable: true
                    type: string
                source:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - displayName
                - source
                - scimConnectionId
                - isActive
                - createdAt
                - updatedAt
                - concurrencyStamp
                - memberUserIds
                - roleIds
            type: object
            x-vantigo-source: Vantigo.Identity
        AccountPasswordRequest:
            properties:
                currentPassword:
                    nullable: true
                    type: string
                newPassword:
                    nullable: true
                    type: string
            required:
                - currentPassword
                - newPassword
            type: object
        AccountProfileRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
            required:
                - displayName
                - preferredLanguage
            type: object
        AccountResponse:
            properties:
                avatarUrl:
                    nullable: true
                    type: string
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                preferredLanguage:
                    nullable: true
                    type: string
            required:
                - id
                - displayName
                - email
                - preferredLanguage
                - avatarUrl
            type: object
            x-vantigo-source: Vantigo.Identity
        AntiforgeryResponse:
            properties:
                token:
                    type: string
            required:
                - token
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthSessionResponse:
            properties:
                activeTenantId:
                    format: uuid
                    nullable: true
                    type: string
                isSystemAdmin:
                    type: boolean
                mfaAuthenticated:
                    type: boolean
                mfaEnrollmentRequired:
                    type: boolean
                tenants:
                    items:
                        properties:
                            id:
                                format: uuid
                                type: string
                            name:
                                type: string
                            slug:
                                type: string
                        required:
                            - id
                            - name
                            - slug
                        type: object
                    type: array
                twoFactorEnabled:
                    type: boolean
                user:
                    properties:
                        displayName:
                            type: string
                        email:
                            nullable: true
                            type: string
                        id:
                            format: uuid
                            type: string
                        roles:
                            items:
                                type: string
                            type: array
                    required:
                        - id
                        - displayName
                        - email
                        - roles
                    type: object
            required:
                - user
                - twoFactorEnabled
                - mfaEnrollmentRequired
                - mfaAuthenticated
                - isSystemAdmin
                - tenants
                - activeTenantId
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthSuccessResponse:
            properties:
                activeTenantId:
                    format: uuid
                    nullable: true
                    type: string
                mfaEnrollmentRequired:
                    type: boolean
                requiresTwoFactor:
                    type: boolean
                tenants:
                    items:
                        properties:
                            id:
                                format: uuid
                                type: string
                            name:
                                type: string
                            slug:
                                type: string
                        required:
                            - id
                            - name
                            - slug
                        type: object
                    nullable: true
                    type: array
                twoFactorEnabled:
                    type: boolean
                user:
                    properties:
                        displayName:
                            type: string
                        email:
                            nullable: true
                            type: string
                        id:
                            format: uuid
                            type: string
                        roles:
                            items:
                                type: string
                            type: array
                    required:
                        - id
                        - displayName
                        - email
                        - roles
                    type: object
            required:
                - user
                - requiresTwoFactor
                - twoFactorEnabled
                - mfaEnrollmentRequired
            type: object
            x-vantigo-source: Vantigo.Identity
        AuthUserResponse:
            properties:
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                roles:
                    items:
                        type: string
                    type: array
            required:
                - id
                - displayName
                - email
                - roles
            type: object
            x-vantigo-source: Vantigo.Identity
        AvatarResponse:
            properties:
                uploaded:
                    type: boolean
                url:
                    type: string
            required:
                - uploaded
                - url
            type: object
            x-vantigo-source: Vantigo.Identity
        BootstrapRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
                secret:
                    nullable: true
                    type: string
            required:
                - secret
                - email
                - displayName
                - password
            type: object
        BootstrapStatusResponse:
            properties:
                available:
                    type: boolean
            required:
                - available
            type: object
            x-vantigo-source: Vantigo.Identity
        DelegationMutationRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
            required:
                - concurrencyStamp
            type: object
        DelegationRequest:
            properties:
                canCreateRoles:
                    type: boolean
                concurrencyStamp:
                    nullable: true
                    type: string
                expiresAt:
                    format: date-time
                    nullable: true
                    type: string
                granteeUserId:
                    format: uuid
                    type: string
                permissionKeys:
                    items:
                        type: string
                    nullable: true
                    type: array
                stewardedRoleIds:
                    items:
                        format: uuid
                        type: string
                    nullable: true
                    type: array
            required:
                - granteeUserId
                - expiresAt
                - permissionKeys
                - stewardedRoleIds
                - canCreateRoles
            type: object
        IdentitySystemStatusResponse:
            properties:
                active:
                    format: int32
                    pattern: ^-?(?:0|[1-9]\d*)$
                disabled:
                    format: int32
                    pattern: ^-?(?:0|[1-9]\d*)$
                lastAuthenticatedScimRequestAtUtc:
                    format: date-time
                    nullable: true
                    type: string
                lastStaticOidcSignInAtUtc:
                    format: date-time
                    nullable: true
                    type: string
                pendingInvitations:
                    format: int32
                    pattern: ^-?(?:0|[1-9]\d*)$
                staticOidcEnabled:
                    type: boolean
                staticOidcProvider:
                    nullable: true
                    type: string
                staticScimEnabled:
                    type: boolean
                total:
                    format: int32
                    pattern: ^-?(?:0|[1-9]\d*)$
            required:
                - total
                - active
                - disabled
                - pendingInvitations
                - staticOidcEnabled
                - staticOidcProvider
                - staticScimEnabled
                - lastStaticOidcSignInAtUtc
                - lastAuthenticatedScimRequestAtUtc
            type: object
            x-vantigo-source: Vantigo.Identity
        InvitationAcceptanceRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
                token:
                    nullable: true
                    type: string
            required:
                - token
                - displayName
                - password
            type: object
        InvitationAcceptanceResponse:
            properties:
                email:
                    nullable: true
                    type: string
                expiresAt:
                    format: date-time
                    nullable: true
                    type: string
                role:
                    nullable: true
                    type: string
                valid:
                    type: boolean
            required:
                - valid
            type: object
            x-vantigo-source: Vantigo.Identity
        InvitationRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                role:
                    nullable: true
                    type: string
            required:
                - email
                - displayName
                - role
            type: object
        InvitationResponse:
            properties:
                acceptedAt:
                    format: date-time
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                displayName:
                    nullable: true
                    type: string
                email:
                    type: string
                expiresAt:
                    format: date-time
                    type: string
                id:
                    format: uuid
                    type: string
                revokedAt:
                    format: date-time
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - id
                - email
                - role
                - displayName
                - createdAt
                - expiresAt
                - revokedAt
                - acceptedAt
            type: object
            x-vantigo-source: Vantigo.Identity
        LoginRequest:
            properties:
                email:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
            required:
                - email
                - password
            type: object
        LogoutResponse:
            properties:
                success:
                    type: boolean
            required:
                - success
            type: object
            x-vantigo-source: Vantigo.Identity
        MfaCodeRequest:
            properties:
                code:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
            required:
                - code
            type: object
        MfaEnableResponse:
            properties:
                recoveryCodes:
                    items:
                        type: string
                    type: array
                twoFactorEnabled:
                    type: boolean
            required:
                - twoFactorEnabled
                - recoveryCodes
            type: object
            x-vantigo-source: Vantigo.Identity
        MfaRecoveryCodesResponse:
            properties:
                recoveryCodes:
                    items:
                        type: string
                    type: array
            required:
                - recoveryCodes
            type: object
            x-vantigo-source: Vantigo.Identity
        MfaResetResponse:
            properties:
                recoveryCodes:
                    items:
                        type: string
                    type: array
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - recoveryCodes
            type: object
            x-vantigo-source: Vantigo.Identity
        MfaSetupResponse:
            properties:
                authenticatorUri:
                    nullable: true
                    type: string
                initialized:
                    type: boolean
                sharedKey:
                    nullable: true
                    type: string
            required:
                - sharedKey
                - authenticatorUri
                - initialized
            type: object
            x-vantigo-source: Vantigo.Identity
        MfaStatusResponse:
            properties:
                mfaEnrollmentRequired:
                    type: boolean
                twoFactorEnabled:
                    type: boolean
            required:
                - twoFactorEnabled
                - mfaEnrollmentRequired
            type: object
            x-vantigo-source: Vantigo.Identity
        MutationRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                scimConnectionId:
                    format: uuid
                    nullable: true
                    type: string
            required:
                - concurrencyStamp
            type: object
        OidcProviderResponse:
            properties:
                displayName:
                    type: string
            required:
                - displayName
            type: object
            x-vantigo-source: Vantigo.Identity
        OidcProvidersResponse:
            properties:
                oidc:
                    properties:
                        displayName:
                            type: string
                    required:
                        - displayName
                    type: object
            required:
                - oidc
            type: object
            x-vantigo-source: Vantigo.Identity
        OwnerMfaResetRequest:
            properties:
                userId:
                    format: uuid
                    type: string
            required:
                - userId
            type: object
            x-vantigo-source: Vantigo.Identity
        OwnerUserCreateRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                password:
                    nullable: true
                    type: string
                role:
                    nullable: true
                    type: string
                temporaryPassword:
                    nullable: true
                    type: string
            required:
                - displayName
                - email
                - role
                - password
            type: object
        OwnerUserPasswordRequest:
            properties:
                password:
                    nullable: true
                    type: string
            required:
                - password
            type: object
        OwnerUserResponse:
            properties:
                active:
                    type: boolean
                avatarUrl:
                    nullable: true
                    type: string
                disabled:
                    type: boolean
                displayName:
                    type: string
                email:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                lockedOut:
                    type: boolean
                lockoutEnd:
                    format: date-time
                    nullable: true
                    type: string
                role:
                    type: string
                ssoEnabled:
                    default: false
                    type: boolean
                twoFactorEnabled:
                    type: boolean
            required:
                - id
                - displayName
                - email
                - role
                - active
                - disabled
                - lockedOut
                - lockoutEnd
                - twoFactorEnabled
            type: object
            x-vantigo-source: Vantigo.Identity
        OwnerUserUpdateRequest:
            properties:
                displayName:
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                role:
                    nullable: true
                    type: string
            required:
                - displayName
                - email
                - role
            type: object
        PasskeyBeginRequest:
            properties:
                currentPassword:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
            required:
                - name
                - currentPassword
            type: object
        PasskeyCompleteRequest:
            properties:
                ceremonyId:
                    format: uuid
                    type: string
                credentialJson:
                    nullable: true
                    type: string
                currentPassword:
                    nullable: true
                    type: string
            required:
                - ceremonyId
                - credentialJson
            type: object
        PasskeyLoginBeginRequest:
            properties:
                email:
                    nullable: true
                    type: string
            required:
                - email
            type: object
        PasskeyMutationResponse:
            properties:
                success:
                    type: boolean
            required:
                - success
            type: object
            x-vantigo-source: Vantigo.Identity
        PasskeyOptionsResponse:
            properties:
                ceremonyId:
                    format: uuid
                    type: string
                options: {}
            required:
                - ceremonyId
                - options
            type: object
            x-vantigo-source: Vantigo.Identity
        PasskeyRemoveRequest:
            properties:
                currentPassword:
                    nullable: true
                    type: string
            required:
                - currentPassword
            type: object
        PasskeyResponse:
            properties:
                createdAt:
                    format: date-time
                    type: string
                credentialId:
                    type: string
                isBackedUp:
                    type: boolean
                isBackupEligible:
                    type: boolean
                isUserVerified:
                    type: boolean
                name:
                    type: string
                transports:
                    items:
                        type: string
                    type: array
            required:
                - credentialId
                - name
                - createdAt
                - transports
                - isUserVerified
                - isBackupEligible
                - isBackedUp
            type: object
            x-vantigo-source: Vantigo.Identity
        PasswordRecoveryRequest:
            properties:
                email:
                    nullable: true
                    type: string
            required:
                - email
            type: object
        PasswordRecoveryResponse:
            properties:
                accepted:
                    type: boolean
            required:
                - accepted
            type: object
            x-vantigo-source: Vantigo.Identity
        PasswordResetRequest:
            properties:
                email:
                    nullable: true
                    type: string
                newPassword:
                    nullable: true
                    type: string
                token:
                    nullable: true
                    type: string
            required:
                - email
                - token
                - newPassword
            type: object
        PasswordResetResponse:
            properties:
                success:
                    type: boolean
            required:
                - success
            type: object
            x-vantigo-source: Vantigo.Identity
        PermissionReplacementRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                displayName:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
                permissionKeys:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
                - name
                - displayName
                - description
                - permissionKeys
            type: object
        RoleAssignmentRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                delegationId:
                    format: uuid
                    nullable: true
                    type: string
                roleIds:
                    items:
                        format: uuid
                        type: string
                    nullable: true
                    type: array
            required:
                - roleIds
                - concurrencyStamp
            type: object
        RoleMutationRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
            required:
                - concurrencyStamp
            type: object
        RoleUpsertRequest:
            properties:
                concurrencyStamp:
                    nullable: true
                    type: string
                delegationId:
                    format: uuid
                    nullable: true
                    type: string
                description:
                    nullable: true
                    type: string
                displayName:
                    nullable: true
                    type: string
                name:
                    nullable: true
                    type: string
                permissionKeys:
                    items:
                        type: string
                    nullable: true
                    type: array
            required:
                - name
                - displayName
                - description
                - permissionKeys
            type: object
        SessionRevocationResponse:
            properties:
                revoked:
                    type: boolean
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - revoked
            type: object
            x-vantigo-source: Vantigo.Identity
        SystemMaintenanceRequest:
            properties:
                enabled:
                    type: boolean
                message:
                    nullable: true
                    type: string
            required:
                - enabled
                - message
            type: object
        TenantControlPlaneResponse:
            properties:
                enabledModules:
                    items:
                        type: string
                    type: array
                id:
                    format: uuid
                    type: string
                membershipsCount:
                    format: int32
                    pattern: ^-?(?:0|[1-9]\d*)$
                name:
                    type: string
                seededAdminInvitationId:
                    format: uuid
                    nullable: true
                    type: string
                seededAdminInvitationToken:
                    nullable: true
                    type: string
                slug:
                    type: string
                status:
                    type: string
            required:
                - id
                - name
                - slug
                - status
                - enabledModules
                - membershipsCount
            type: object
            x-vantigo-source: Vantigo.Identity
        TenantSessionResponse:
            properties:
                id:
                    format: uuid
                    type: string
                name:
                    type: string
                slug:
                    type: string
            required:
                - id
                - name
                - slug
            type: object
            x-vantigo-source: Vantigo.Identity
        TwoFactorRequest:
            properties:
                code:
                    nullable: true
                    type: string
                rememberMe:
                    default: false
                    type: boolean
            required:
                - code
            type: object
info:
    title: Vantigo Identity API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/identity/access/audit:
        get:
            operationId: getIdentityAccessAudit
            responses:
                "200":
                    description: OK
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/catalog:
        get:
            operationId: getIdentityAccessCatalog
            responses:
                "200":
                    description: OK
            tags:
                - Authorization
            x-vantigo-access: policy:AuthorizationManagement
    /api/v1/identity/access/delegations:
        get:
            operationId: getIdentityAccessDelegations
            responses:
                "200":
                    description: OK
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
        post:
            operationId: postIdentityAccessDelegations
            requestBody:
                content:
                    application/json:
                        schema:
                            nullable: true
                            oneOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            type: object
            responses:
                "200":
                    description: OK
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/delegations/{id}:
        put:
            operationId: putIdentityAccessDelegationsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            nullable: true
                            oneOf:
                                - $ref: '#/components/schemas/DelegationRequest'
                            type: object
            responses:
                "200":
                    description: OK
            tags:
                - Authorization
            x-vantigo-access: policy:OwnerManagement
    /api/v1/identity/access/delegations/{id}/revoke:
