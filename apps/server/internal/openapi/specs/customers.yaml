components:
    schemas:
        AttachCustomerContactRequest:
            properties:
                contactId:
                    format: int32
                    type: integer
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - contactId
                - role
            type: object
        BrregLookupLookupResult:
            properties:
                legalId:
                    type: string
                legalName:
                    type: string
            required:
                - legalId
                - legalName
            type: object
        BrregLookupResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/BrregLookupLookupResult'
                    type: array
            required:
                - data
            type: object
        ContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - firstName
                - lastName
            type: object
        ContactResponse:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                id:
                    format: int32
                    type: integer
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - id
                - firstName
                - lastName
            type: object
        CreateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409.
                    nullable: true
                    type: boolean
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                status:
                    nullable: true
                    type: string
                type:
                    description: "'business' or 'person'. Defaults to 'business'. When an identity is supplied, its type must agree. Changed afterwards only through PUT /customers/{id}/type."
                    nullable: true
                    type: string
            required:
                - name
            type: object
        CustomerTypeRequest:
            properties:
                revision:
                    description: The revision the caller read the customer at. Optional (customers foundation design D5) — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                type:
                    description: "'business' or 'person', case-insensitive."
                    type: string
            required:
                - type
            type: object
        CreateCustomerResponse:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
            required:
                - id
                - customerNumber
            type: object
            x-vantigo-source: Vantigo.Customers
        CustomerConflictDuplicate:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - customerNumber
                - name
                - status
            type: object
        CustomerConflictProblem:
            description: ProblemDetails plus the customers module's own conflict detail (customers foundation design D5, D6). code and duplicates are populated only by the duplicate-legal-identity conflict; a revision conflict carries neither.
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                duplicates:
                    items:
                        $ref: '#/components/schemas/CustomerConflictDuplicate'
                    nullable: true
                    type: array
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        CustomerContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - role
            type: object
        CustomerContactResponse:
            properties:
                contact:
                    $ref: '#/components/schemas/ContactResponse'
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - contact
                - role
            type: object
        CustomerReference:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - customerNumber
                - name
            type: object
        CustomerStatsAttentionItem:
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        CustomerStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        CustomerStatsSummaryResponse:
            properties:
                from:
                    format: date-time
                    type: string
                newContacts:
                    format: int32
                    type: integer
                newContactsDelta:
                    format: int32
                    type: integer
                newCustomers:
                    format: int32
                    type: integer
                newCustomersDelta:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
                totalActiveCustomers:
                    format: int32
                    type: integer
                totalActiveCustomersDelta:
                    format: int32
                    type: integer
            required:
                - from
                - to
                - totalActiveCustomers
                - totalActiveCustomersDelta
                - newCustomers
                - newCustomersDelta
                - newContacts
                - newContactsDelta
            type: object
        GetContactCustomersContactCustomerResponse:
            properties:
                customer:
                    $ref: '#/components/schemas/GetContactCustomersCustomerReference'
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - customer
                - role
            type: object
        GetContactCustomersCustomerReference:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - customerNumber
                - name
            type: object
        GetContactCustomersResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/GetContactCustomersContactCustomerResponse'
                    type: array
            required:
                - data
            type: object
        GetContactsResponse:
            properties:
                contact:
                    $ref: '#/components/schemas/ContactResponse'
                customer:
                    allOf:
                        - $ref: '#/components/schemas/CustomerReference'
                    nullable: true
                customerCount:
                    format: int32
                    type: integer
            required:
                - contact
                - customerCount
            type: object
        GetCustomerContactsResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/CustomerContactResponse'
                    type: array
            required:
                - data
            type: object
        GetCustomerStatsResponse:
            properties:
                activeCount:
                    format: int32
                    type: integer
                businessCount:
                    format: int32
                    nullable: true
                    type: integer
                distinctCountryCount:
                    format: int32
                    nullable: true
                    type: integer
                missingIdentityCount:
                    format: int32
                    nullable: true
                    type: integer
                newLast30DaysCount:
                    format: int32
                    type: integer
                personCount:
                    format: int32
                    nullable: true
                    type: integer
                totalCount:
                    format: int32
                    type: integer
            required:
                - totalCount
                - activeCount
                - newLast30DaysCount
            type: object
        LegalIdentityRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409. Only consulted when it differs from the identity already on file.
                    nullable: true
                    type: boolean
                country:
                    type: string
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
                - name
                - source
            type: object
        LegalIdentityResponse:
            properties:
                country:
                    type: string
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
                - name
                - source
            type: object
            x-vantigo-source: Vantigo.Customers
        PaginatedResponseOfResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/GetContactsResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfSafeCustomerResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/SafeCustomerResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        SafeCustomerIdentity:
            properties:
                country:
                    type: string
                id:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
            type: object
        SafeCustomerResponse:
            properties:
                createdAt:
                    format: date-time
                    type: string
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                identity:
                    allOf:
                        - $ref: '#/components/schemas/SafeCustomerIdentity'
                    nullable: true
                name:
                    type: string
                revision:
                    description: "The customer row's optimistic-concurrency token (customers foundation design D5). Optional here only because the recorded exchange corpus predates it — always present."
                    format: int32
                    type: integer
                status:
                    type: string
                timelineSummary:
                    $ref: '#/components/schemas/SafeTimelineSummary'
                type:
                    description: "'business' or 'person'. Always present; optional here only because the recorded exchange corpus predates it."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - customerNumber
                - name
                - status
                - createdAt
                - updatedAt
                - timelineSummary
            type: object
        SafeTimelineSummary:
            properties:
                entryCount:
                    format: int32
                    type: integer
                latestOccurredOn:
                    format: date
                    nullable: true
                    type: string
            required:
                - entryCount
            type: object
        TimelineListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineResponse'
                    type: array
                nextCursor:
                    nullable: true
                    type: string
            required:
                - data
            type: object
        TimelineManualTimelineRequest:
            properties:
                eventType:
                    nullable: true
                    type: string
                expectedRevision:
                    format: int32
                    type: integer
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    nullable: true
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
            required:
                - eventType
                - occurredOn
                - note
            type: object
        TimelineResponse:
            properties:
                actorDisplay:
                    nullable: true
                    type: string
                actorKind:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                currentRevision:
                    format: int32
                    type: integer
                eventType:
                    type: string
                id:
                    format: int32
                    type: integer
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - eventType
                - provenance
                - producer
                - occurredOn
                - currentRevision
                - state
                - actorKind
                - createdAt
                - updatedAt
            type: object
        TimelineRevisionListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineRevisionResponse'
                    type: array
            required:
                - data
            type: object
        TimelineRevisionResponse:
            properties:
                action:
                    type: string
                actorDisplayName:
                    type: string
                actorKind:
                    type: string
                changedAt:
                    format: date-time
                    type: string
                deletedAt:
                    format: date-time
                    nullable: true
                    type: string
                eventType:
                    type: string
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                revision:
                    format: int32
                    type: integer
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
            required:
                - revision
                - eventType
                - action
                - changedAt
                - provenance
                - producer
                - occurredOn
                - state
                - actorKind
                - actorDisplayName
            type: object
        UpdateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409. Only consulted when the request's identity differs from the one already on file.
                    nullable: true
                    type: boolean
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the update applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                status:
                    nullable: true
                    type: string
            required:
                - name
            type: object
info:
    title: Vantigo Customers API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/customers:
        get:
            operationId: getCustomers
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: sortBy
                  schema:
                    description: "'id', 'name', 'customerNumber', 'createdAt' or 'updatedAt'. Defaults to 'id'."
                    type: string
                - in: query
                  name: sortDirection
                  schema:
                    type: string
                - in: query
                  name: includeArchived
                  schema:
                    type: boolean
                - in: query
                  name: search
                  schema:
                    description: "Matches, case-insensitively, the name, customer number and, only for a caller who may see them, the legal name/id and any linked contact's name/email."
                    type: string
                - in: query
                  name: status
                  schema:
                    description: "'active', 'disabled' or 'archived', case-sensitive. Naming a status shows exactly that status, regardless of includeArchived."
                    type: string
                - in: query
                  name: type
                  schema:
                    description: "'business' or 'person', case-sensitive."
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfSafeCustomerResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all customers
            tags:
                - Customers
            x-vantigo-access: permission:customers:view
        post:
            operationId: postCustomers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCustomerRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCustomerResponse'
                    description: Created
                    headers:
                        Location:
                            description: The path of the newly created customer, /api/v1/customers/{id}.
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — this server's validation problem (application/problem+json). The application/json branch, whose body carries code csrf_validation_failed, is pre-cutover .NET behaviour retained because the frozen exchange corpus (openapi/testdata/exchanges/customers.jsonl) still validates a recorded 400 of that shape against this contract; this server never emits it. An unsafe cookie-authenticated request whose Origin or Sec-Fetch-Site marks it cross-site is rejected with 403 application/problem+json instead. The check is on the request's origin; no antiforgery token is involved.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CustomerConflictProblem'
                    description: Conflict
            summary: Create a new customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:create
    /api/v1/customers/{id}:
        delete:
            operationId: deleteCustomersById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a customer (customers are never hard-deleted)
            tags:
                - Customers
            x-vantigo-access: permission:customers:delete
        get:
            operationId: getCustomer
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SafeCustomerResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a customer by id
            tags:
                - Customers
            x-vantigo-access: permission:customers:view
        put:
            operationId: putCustomersById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCustomerRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SafeCustomerResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CustomerConflictProblem'
                    description: Conflict
            summary: Update a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:update+customers:view
    /api/v1/customers/{id}/contacts:
        get:
            operationId: getCustomersByIdContacts
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetCustomerContactsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: List the contacts associated with a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:associations-view+customers:contacts-view
        post:
            operationId: postCustomersByIdContacts
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AttachCustomerContactRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CustomerContactResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Conflict
            summary: Associate a contact with a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:associations-manage+customers:contacts-view
    /api/v1/customers/{id}/contacts/{contactId}:
        delete:
            operationId: deleteCustomersByIdContactsByContactId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: contactId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Remove a contact association from a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:associations-manage
        put:
            operationId: putCustomersByIdContactsByContactId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: contactId
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CustomerContactRequest'
                required: true
