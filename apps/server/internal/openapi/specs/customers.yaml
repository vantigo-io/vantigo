components:
    schemas:
        AttachCustomerContactRequest:
            properties:
                contactId:
                    format: int32
                    type: integer
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - contactId
                - role
            type: object
        BrregLookupLookupResult:
            properties:
                legalId:
                    type: string
                legalName:
                    type: string
            required:
                - legalId
                - legalName
            type: object
        BrregLookupResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/BrregLookupLookupResult'
                    type: array
            required:
                - data
            type: object
        ContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - firstName
                - lastName
            type: object
        ContactResponse:
            properties:
                email:
                    nullable: true
                    type: string
                firstName:
                    type: string
                id:
                    format: int32
                    type: integer
                lastName:
                    type: string
                middleName:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                prefix:
                    nullable: true
                    type: string
                suffix:
                    nullable: true
                    type: string
            required:
                - id
                - firstName
                - lastName
            type: object
        CreateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409.
                    nullable: true
                    type: boolean
                contactInfo:
                    allOf:
                        - $ref: '#/components/schemas/CustomerContactInfo'
                    description: When present, the customer is created with its own contact details already set (invoice-ready customer design D2) — the same validation PUT /customers/{id}/contact-info applies, nested under contactInfo.<field>.
                    nullable: true
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                status:
                    nullable: true
                    type: string
                type:
                    description: "'business' or 'person'. Defaults to 'business'. When an identity is supplied, its type must agree. Changed afterwards only through PUT /customers/{id}/type."
                    nullable: true
                    type: string
            required:
                - name
            type: object
        CustomerTypeRequest:
            properties:
                revision:
                    description: The revision the caller read the customer at. Optional (customers foundation design D5) — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                type:
                    description: "'business' or 'person', case-insensitive."
                    type: string
            required:
                - type
            type: object
        CreateCustomerResponse:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
            required:
                - id
                - customerNumber
            type: object
            x-vantigo-source: Vantigo.Customers
        CustomerAddress:
            description: One of a customer's typed addresses (invoice-ready customer design D3) — postal, invoice, delivery or visiting, any number of each, at most one primary per type. city/label/line2/postalCode/region are optional — unset, the response simply omits the key rather than sending it as null.
            properties:
                city:
                    nullable: true
                    type: string
                country:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int32
                    type: integer
                isPrimary:
                    type: boolean
                label:
                    nullable: true
                    type: string
                line1:
                    type: string
                line2:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                region:
                    nullable: true
                    type: string
                type:
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - type
                - line1
                - country
                - isPrimary
                - createdAt
                - updatedAt
            type: object
        CustomerAddressRequest:
            description: "POST/PUT .../addresses(/{addressId})'s own request body (invoice-ready customer design D1, D3): a full replace of one address — every field present or null. isPrimary absent means false, which for a type's first (or otherwise-only-primary) address follows D3's own rules: the first address of a type is primary whatever the request says, and false on the address that is currently the only or primary one of its type is refused."
            properties:
                city:
                    nullable: true
                    type: string
                country:
                    type: string
                isPrimary:
                    nullable: true
                    type: boolean
                label:
                    nullable: true
                    type: string
                line1:
                    type: string
                line2:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
                region:
                    nullable: true
                    type: string
                type:
                    type: string
            required:
                - type
                - line1
                - country
            type: object
        CustomerBillingProfile:
            description: "A customer's billing profile (invoice-ready customer design D1, D4): payment terms, currency, document language, delivery methods and the identifiers used to send it invoices — every field optional, meaning \"not decided here, whoever invoices uses its own default\"; unset, a field is simply absent from the response rather than sent as null. warnings is computed at read time from the profile plus the customer's type, legal identity, contact email and addresses — never stored — in a fixed order: ehf_without_recipient, email_without_address, efaktura_for_business, no_invoice_address, ehf_recipient_not_registered, ehf_available (can-this-customer-receive-EHF design D4). peppolLookup is the last Peppol lookup on record (POST .../peppol-lookup), present only when it was made for the participant this profile would look up now — a stale answer (the org number or peppolId changed since) is omitted."
            properties:
                buyerReference:
                    nullable: true
                    type: string
                currency:
                    nullable: true
                    type: string
                gln:
                    nullable: true
                    type: string
                invoiceDelivery:
                    nullable: true
                    type: string
                invoiceEmail:
                    nullable: true
                    type: string
                language:
                    nullable: true
                    type: string
                paymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
                peppolId:
                    nullable: true
                    type: string
                peppolLookup:
                    $ref: '#/components/schemas/CustomerPeppolLookup'
                reminderDelivery:
                    nullable: true
                    type: string
                reminderEmail:
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - revision
                - warnings
            type: object
        CustomerAssignableUser:
            description: A user who may be made a customer's owner (owner and tags design D1) — the directory's active users, capped at 20. Enough to name them in a picker and nothing more, which is all contracts.UserDirectory publishes.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        CustomerConflictDuplicate:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                status:
                    type: string
            required:
                - id
                - customerNumber
                - name
                - status
            type: object
        CustomerConflictProblem:
            description: ProblemDetails plus the customers module's own conflict detail (customers foundation design D5, D6). duplicates is populated only by the duplicate-legal-identity conflict, which also sets code; code alone (without duplicates) is also populated by the registry refresh's no_registry_identity and registry_identity_changed conflicts. A revision conflict carries neither.
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                duplicates:
                    items:
                        $ref: '#/components/schemas/CustomerConflictDuplicate'
                    nullable: true
                    type: array
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        CustomerContactInfo:
            description: A customer's own contact details (invoice-ready customer design D2) — what reaches the customer itself, not one of its contacts. Each field is optional; a blank value is stored as null, but the response never sends null back — a field with none is simply absent.
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                website:
                    nullable: true
                    type: string
            type: object
        CustomerContactRequest:
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - role
            type: object
        CustomerContactResponse:
            properties:
                contact:
                    $ref: '#/components/schemas/ContactResponse'
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - contact
                - role
            type: object
        CustomerOwner:
            description: The single user accountable for the customer relationship (owner and tags design D1). displayName is resolved from the user directory at read time, never stored on the customer; a user the directory no longer knows is reported as "Unknown user" with active false, and an owner disabled after being assigned keeps the customer and is reported with active false. Absent when the customer is unowned.
            properties:
                active:
                    type: boolean
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
                - active
            type: object
        CustomerPeppolLookup:
            description: "The last (or freshly checked, from POST /customers/{id}/peppol-lookup) answer the Peppol network gave about whether this customer can receive an EHF invoice (can-this-customer-receive-EHF design D3): status is 'registered', 'not_registered' or 'no_identifier' (no Peppol participant id could be derived and none is set, so nothing was looked up). participantId is present only when it is either an explicit peppolId or the caller holds customers:legal-identity-view (a derived id is that permission's to show); smpHost is always present when known. checkedAt is always present, even for no_identifier (the moment the check was made, nothing stored)."
            properties:
                canReceiveCreditNote:
                    type: boolean
                canReceiveInvoice:
                    type: boolean
                checkedAt:
                    format: date-time
                    type: string
                participantId:
                    nullable: true
                    type: string
                smpHost:
                    nullable: true
                    type: string
                status:
                    type: string
            required:
                - status
                - canReceiveInvoice
                - canReceiveCreditNote
                - checkedAt
            type: object
        CustomerReference:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - customerNumber
                - name
            type: object
        CustomerRegistryAddress:
            description: "One of the two addresses the registry holds for an entity (Brreg in full design D1): lines is the registry's own free-form address array — one or more street lines, never a single string — and postalCode/municipality are simply absent on a foreign address, whose own postal district is part of city instead (\"81-336 GDYNIA\"). countryCode is ISO 3166-1 alpha-2, and absent when the registry sent none — the registry only assigns a country code to some foreign addresses, and an empty string was never a country. This is what the registry says, not an address on file: a refresh never writes to the customer's own addresses (design D3)."
            properties:
                city:
                    nullable: true
                    type: string
                countryCode:
                    type: string
                lines:
                    items:
                        type: string
                    type: array
                municipality:
                    nullable: true
                    type: string
                postalCode:
                    nullable: true
                    type: string
            required:
                - lines
            type: object
        CustomerRegistryChange:
            description: "One field the last refresh found different (Brreg in full design D4): field is the record's own field name (\"name\", \"employees\", \"businessAddress\", …), or \"removedFromOpenData\" when the registry answered 410. from and to are the two values rendered as text — a number for employees, 'true'/'false' for a flag, an ISO date for deletedOn, a one-line rendering for an address — and either is absent when that side was empty (a field that was not set before, or is not set now)."
            properties:
                field:
                    type: string
                from:
                    nullable: true
                    type: string
                to:
                    nullable: true
                    type: string
            required:
                - field
            type: object
        CustomerRegistryRecord:
            description: "What Enhetsregisteret says about this customer, as of fetchedAt (Brreg in full design D1): the registry's own view, kept beside the customer and never edited by hand — the customer's name and legal identity stay what the user asserted, and a difference between the two is reported on the timeline rather than written over them. Present only for a customer whose legal identity is a Norwegian business with a valid organisation number, and only once a fetch has actually happened. deletedOn is set for an entity struck from the register; an entity removed from open data altogether has no record at all. registryUpdatedHint is the moment Brønnøysundregistrene's own update feed said this entity changed, written by the background feed worker before it re-reads the record: while it is newer than fetchedAt the record is known to be behind the register — a refresh that failed, or one not attempted yet — and the card says so. It is absent whenever the feed has never reported a change for this customer."
            properties:
                bankrupt:
                    type: boolean
                businessAddress:
                    $ref: '#/components/schemas/CustomerRegistryAddress'
                deletedOn:
                    format: date
                    nullable: true
                    type: string
                email:
                    nullable: true
                    type: string
                employees:
                    format: int32
                    nullable: true
                    type: integer
                fetchedAt:
                    format: date-time
                    type: string
                foundedOn:
                    format: date
                    nullable: true
                    type: string
                industry:
                    nullable: true
                    type: string
                industryCode:
                    nullable: true
                    type: string
                mobile:
                    nullable: true
                    type: string
                name:
                    type: string
                organisationForm:
                    nullable: true
                    type: string
                organisationFormCode:
                    nullable: true
                    type: string
                organisationNumber:
                    type: string
                parentOrganisationNumber:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                postalAddress:
                    $ref: '#/components/schemas/CustomerRegistryAddress'
                registryUpdatedHint:
                    format: date-time
                    nullable: true
                    type: string
                underForcedLiquidation:
                    type: boolean
                underLiquidation:
                    type: boolean
                vatRegistered:
                    type: boolean
                website:
                    nullable: true
                    type: string
            required:
                - organisationNumber
                - name
                - vatRegistered
                - bankrupt
                - underLiquidation
                - underForcedLiquidation
                - fetchedAt
            type: object
        CustomerRegistryRefreshResponse:
            description: "What one POST /customers/{id}/registry-refresh found (Brreg in full design D2, D4). status is 'found' (an ordinary live entity), 'deleted' (struck from the register — the record is kept, with deletedOn set), 'removed' (gone from open data entirely — the stored record is deleted and only the timeline keeps the fact) or 'unknown' (the registry does not know this organisation number, and nothing is stored — worth a look at the identity). record is the stored record after the write, present for found and deleted only. changes lists what differed from the record on file, empty when nothing did; the very first fetch compares only the registry's name with the legal identity's."
            properties:
                changes:
                    items:
                        $ref: '#/components/schemas/CustomerRegistryChange'
                    type: array
                record:
                    $ref: '#/components/schemas/CustomerRegistryRecord'
                status:
                    type: string
            required:
                - status
                - changes
            type: object
        CustomerTag:
            description: One tag as it appears on a customer (owner and tags design D2). color is one of Mantine's named colours (gray, red, pink, grape, violet, indigo, blue, cyan, teal, green, lime, yellow, orange) or null, validated by the server so a client never has to sanitise it.
            properties:
                color:
                    nullable: true
                    type: string
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
            type: object
        CustomerTagRequest:
            description: A tag's name and colour (owner and tags design D2). name is 1-100 characters, trimmed; a name another tag already has, ignoring case, is a 409 with code tag_exists.
            properties:
                color:
                    nullable: true
                    type: string
                name:
                    type: string
            required:
                - name
            type: object
        CustomerTagSummary:
            description: A tag in the installation's vocabulary, with how many customers carry it (owner and tags design D2, D3) — what the Manage tags modal needs in order to say what a delete will affect, on the same response that lists the tags.
            properties:
                color:
                    nullable: true
                    type: string
                customerCount:
                    format: int32
                    type: integer
                id:
                    format: uuid
                    type: string
                name:
                    type: string
            required:
                - id
                - name
                - customerCount
            type: object
        CustomerTagsResponse:
            description: A customer's tags after a set replace (owner and tags design D2), name-ascending.
            properties:
                tags:
                    items:
                        $ref: '#/components/schemas/CustomerTag'
                    type: array
            required:
                - tags
            type: object
        CustomerStatsAttentionItem:
            description: 'One thing the dashboard wants a human to look at. The shape is the dashboard''s, shared by every module''s /stats/attention. Four types, one per customer at most (a struck-off company reports only registryDeleted, its most useful single sentence), computed from the stored registry record against the current customer rather than from events, so the list needs no "dismiss" state: registryBankrupt when the record''s bankrupt flag is set; registryLiquidation when underLiquidation or underForcedLiquidation is set and the customer is not also bankrupt; registryDeleted when the record carries a deletion date, regardless of the other flags; registryRenamed when the record''s name differs (trimmed, case-sensitive) from the legal identity''s name and none of the other three apply. id is ''<type>/<customerId>''; title is the customer''s own name, not the registry''s; occurredAt is the day the thing itself happened — the registry''s bankruptcy, liquidation or deletion date — falling back to when the record was last fetched when the registry gives no date, and always the fetch time for registryRenamed, which has no date; entityId is the customer id. An item clears once the customer is archived, once a later refresh stores the flag as false (or, for registryDeleted, a 410 deletes the row entirely), once the customer''s identity is changed away from that company, or — for registryRenamed — once the legal identity''s name is updated to match the registry''s.'
            properties:
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        CustomerStatsDailyBucket:
            properties:
                date:
                    format: date
                    type: string
                value:
                    format: int64
                    type: integer
            type: object
        CustomerStatsSummaryResponse:
            properties:
                from:
                    format: date-time
                    type: string
                newContacts:
                    format: int32
                    type: integer
                newContactsDelta:
                    format: int32
                    type: integer
                newCustomers:
                    format: int32
                    type: integer
                newCustomersDelta:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
                totalActiveCustomers:
                    format: int32
                    type: integer
                totalActiveCustomersDelta:
                    format: int32
                    type: integer
            required:
                - from
                - to
                - totalActiveCustomers
                - totalActiveCustomersDelta
                - newCustomers
                - newCustomersDelta
                - newContacts
                - newContactsDelta
            type: object
        GetContactCustomersContactCustomerResponse:
            properties:
                customer:
                    $ref: '#/components/schemas/GetContactCustomersCustomerReference'
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                role:
                    type: string
            required:
                - customer
                - role
            type: object
        GetContactCustomersCustomerReference:
            properties:
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                name:
                    type: string
            required:
                - id
                - customerNumber
                - name
            type: object
        GetContactCustomersResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/GetContactCustomersContactCustomerResponse'
                    type: array
            required:
                - data
            type: object
        GetContactsResponse:
            properties:
                contact:
                    $ref: '#/components/schemas/ContactResponse'
                customer:
                    allOf:
                        - $ref: '#/components/schemas/CustomerReference'
                    nullable: true
                customerCount:
                    format: int32
                    type: integer
            required:
                - contact
                - customerCount
            type: object
        GetCustomerAddressesResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/CustomerAddress'
                    type: array
            required:
                - data
            type: object
        GetCustomerContactsResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/CustomerContactResponse'
                    type: array
            required:
                - data
            type: object
        GetCustomerStatsResponse:
            properties:
                activeCount:
                    format: int32
                    type: integer
                businessCount:
                    format: int32
                    nullable: true
                    type: integer
                distinctCountryCount:
                    format: int32
                    nullable: true
                    type: integer
                missingIdentityCount:
                    format: int32
                    nullable: true
                    type: integer
                newLast30DaysCount:
                    format: int32
                    type: integer
                personCount:
                    format: int32
                    nullable: true
                    type: integer
                totalCount:
                    format: int32
                    type: integer
            required:
                - totalCount
                - activeCount
                - newLast30DaysCount
            type: object
        LegalIdentityRequest:
            properties:
                country:
                    type: string
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
                - name
                - source
            type: object
        LegalIdentityResponse:
            properties:
                country:
                    type: string
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
                - name
                - source
            type: object
            x-vantigo-source: Vantigo.Customers
        PutCustomerBillingProfileRequest:
            description: "PUT /customers/{id}/billing-profile's own request body (invoice-ready customer design D1, D4): a full replace of the customer's billing profile — every field present or null, absent and null both meaning the field is cleared. revision is optional, as PUT /customers/{id}'s own is."
            properties:
                buyerReference:
                    nullable: true
                    type: string
                currency:
                    nullable: true
                    type: string
                gln:
                    nullable: true
                    type: string
                invoiceDelivery:
                    nullable: true
                    type: string
                invoiceEmail:
                    nullable: true
                    type: string
                language:
                    nullable: true
                    type: string
                paymentTermsDays:
                    format: int32
                    nullable: true
                    type: integer
                peppolId:
                    nullable: true
                    type: string
                reminderDelivery:
                    nullable: true
                    type: string
                reminderEmail:
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
            type: object
        PutCustomerContactInfoRequest:
            description: "PUT /customers/{id}/contact-info's own request body (invoice-ready customer design D1): a full replace of the customer's contact info — every field present or null, absent and null both meaning the field is cleared. revision is optional, as PUT /customers/{id}'s own is."
            properties:
                email:
                    nullable: true
                    type: string
                phone:
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                website:
                    nullable: true
                    type: string
            type: object
        PutCustomerOwnerRequest:
            description: "PUT /customers/{id}/owner's own request body (owner and tags design D1): the owner is set to ownerUserId, or cleared when it is absent or null. The user must exist and be active to be assigned. revision is optional, as PUT /customers/{id}/contact-info's own is."
            properties:
                ownerUserId:
                    format: uuid
                    nullable: true
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the change applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
            type: object
        PutCustomerTagsRequest:
            description: "PUT /customers/{id}/tags's own request body (owner and tags design D2): the customer's tag set is REPLACED by tagIds. There is no revision here and none is accepted — tags are off the customer row, so they bump nothing and two concurrent replaces are last-wins, which is what replacing a set means. An empty array clears the customer's tags. An unknown id is a field error on tagIds."
            properties:
                tagIds:
                    items:
                        format: uuid
                        type: string
                    type: array
            required:
                - tagIds
            type: object
        PutLegalIdentityRequest:
            description: "PUT /customers/{id}/legal-identity's own request body — not LegalIdentityRequest plus an allOf, deliberately: LegalIdentityRequest is also nested (via allOf) as CreateCustomerRequest.identity/UpdateCustomerRequest.identity, and allowDuplicateIdentity belongs to this operation's body alone. Composing it onto LegalIdentityRequest would have surfaced it a second time, nested and inert, under identity on those two requests — confusing a caller into believing it took effect there. The five identity fields are repeated here rather than shared, so this stays a clean, flat generated type."
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409. Only consulted when it differs from the identity already on file.
                    nullable: true
                    type: boolean
                country:
                    type: string
                id:
                    type: string
                name:
                    type: string
                source:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
                - name
                - source
            type: object
        PaginatedResponseOfResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/GetContactsResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfSafeCustomerResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/SafeCustomerResponse'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        SafeCustomerIdentity:
            properties:
                country:
                    type: string
                id:
                    type: string
                type:
                    type: string
            required:
                - country
                - type
                - id
            type: object
        SafeCustomerResponse:
            properties:
                contactInfo:
                    allOf:
                        - $ref: '#/components/schemas/CustomerContactInfo'
                    description: A customer's own contact details (invoice-ready customer design D2). Always present; optional here only because the recorded exchange corpus predates it.
                createdAt:
                    format: date-time
                    type: string
                customerNumber:
                    format: int64
                    type: integer
                id:
                    format: int32
                    type: integer
                identity:
                    allOf:
                        - $ref: '#/components/schemas/SafeCustomerIdentity'
                    nullable: true
                name:
                    type: string
                owner:
                    allOf:
                        - $ref: '#/components/schemas/CustomerOwner'
                    description: The user accountable for this customer relationship (owner and tags design D1). Absent when the customer is unowned; needs nothing beyond customers:view to read.
                    nullable: true
                revision:
                    description: "The customer row's optimistic-concurrency token (customers foundation design D5). Optional here only because the recorded exchange corpus predates it — always present."
                    format: int32
                    type: integer
                status:
                    type: string
                tags:
                    description: Every tag this customer carries, name-ascending (owner and tags design D2). Always present on responses from this version on — an empty array when the customer has none — and optional here only because the recorded exchange corpus predates it.
                    items:
                        $ref: '#/components/schemas/CustomerTag'
                    type: array
                timelineSummary:
                    $ref: '#/components/schemas/SafeTimelineSummary'
                type:
                    description: "'business' or 'person'. Always present; optional here only because the recorded exchange corpus predates it."
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - customerNumber
                - name
                - status
                - createdAt
                - updatedAt
                - timelineSummary
            type: object
        SafeTimelineSummary:
            properties:
                entryCount:
                    format: int32
                    type: integer
                latestOccurredOn:
                    format: date
                    nullable: true
                    type: string
            required:
                - entryCount
            type: object
        TimelineListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineResponse'
                    type: array
                nextCursor:
                    nullable: true
                    type: string
            required:
                - data
            type: object
        TimelineManualTimelineRequest:
            properties:
                eventType:
                    nullable: true
                    type: string
                expectedRevision:
                    format: int32
                    type: integer
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    nullable: true
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
            required:
                - eventType
                - occurredOn
                - note
            type: object
        TimelineResponse:
            properties:
                actorDisplay:
                    nullable: true
                    type: string
                actorKind:
                    type: string
                createdAt:
                    format: date-time
                    type: string
                currentRevision:
                    format: int32
                    type: integer
                eventType:
                    type: string
                id:
                    format: int32
                    type: integer
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - eventType
                - provenance
                - producer
                - occurredOn
                - currentRevision
                - state
                - actorKind
                - createdAt
                - updatedAt
            type: object
        TimelineRevisionListResponse:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/TimelineRevisionResponse'
                    type: array
            required:
                - data
            type: object
        TimelineRevisionResponse:
            properties:
                action:
                    type: string
                actorDisplayName:
                    type: string
                actorKind:
                    type: string
                changedAt:
                    format: date-time
                    type: string
                deletedAt:
                    format: date-time
                    nullable: true
                    type: string
                eventType:
                    type: string
                note:
                    nullable: true
                    type: string
                occurredAt:
                    format: date-time
                    nullable: true
                    type: string
                occurredOn:
                    format: date
                    type: string
                payload:
                    allOf:
                        - $ref: common.yaml#/components/schemas/JsonElement
                    nullable: true
                producer:
                    type: string
                provenance:
                    type: string
                revision:
                    format: int32
                    type: integer
                sourceUrl:
                    nullable: true
                    type: string
                state:
                    type: string
                summary:
                    nullable: true
                    type: string
            required:
                - revision
                - eventType
                - action
                - changedAt
                - provenance
                - producer
                - occurredOn
                - state
                - actorKind
                - actorDisplayName
            type: object
        UpdateCustomerRequest:
            properties:
                allowDuplicateIdentity:
                    description: When true, skips the duplicate-legal-identity conflict check entirely (customers foundation design D6) — two departments of one company kept as separate customers is legitimate. Absent or false, an identity another customer already has is a 409. Only consulted when the request's identity differs from the one already on file.
                    nullable: true
                    type: boolean
                identity:
                    allOf:
                        - $ref: '#/components/schemas/LegalIdentityRequest'
                    nullable: true
                name:
                    type: string
                revision:
                    description: The revision the caller read the customer at (customers foundation design D5). Optional — omitted, the update applies regardless; present and stale, a 409.
                    format: int32
                    nullable: true
                    type: integer
                status:
                    nullable: true
                    type: string
            required:
                - name
            type: object
info:
    title: Vantigo Customers API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/customers:
        get:
            operationId: getCustomers
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: sortBy
                  schema:
                    description: "'id', 'name', 'customerNumber', 'createdAt' or 'updatedAt'. Defaults to 'id'."
                    type: string
                - in: query
                  name: sortDirection
                  schema:
                    type: string
                - in: query
                  name: includeArchived
                  schema:
                    type: boolean
                - in: query
                  name: search
                  schema:
                    description: "Matches, case-insensitively, the name, customer number and, only for a caller who may see them, the legal name/id and any linked contact's name/email."
                    type: string
                - in: query
                  name: status
                  schema:
                    description: "'active', 'disabled' or 'archived', case-sensitive. Naming a status shows exactly that status, regardless of includeArchived."
                    type: string
                - in: query
                  name: type
                  schema:
                    description: "'business' or 'person', case-sensitive."
                    type: string
                - in: query
                  name: ownerId
                  schema:
                    description: "A user id, or the literal 'me' (the calling user) or 'none' (customers with no owner). Case-sensitive. 'me' is how the UI's My customers filter is expressed — the caller is resolved from the session, never sent."
                    type: string
                - in: query
                  name: tagId
                  schema:
                    description: "A tag id. A customer matches when it carries that tag. One tag only; multi-tag filtering is not built."
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfSafeCustomerResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List all customers
            tags:
                - Customers
            x-vantigo-access: permission:customers:view
        post:
            operationId: postCustomers
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateCustomerRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateCustomerResponse'
                    description: Created
                    headers:
                        Location:
                            description: The path of the newly created customer, /api/v1/customers/{id}.
                            schema:
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — this server's validation problem (application/problem+json). The application/json branch, whose body carries code csrf_validation_failed, is pre-cutover .NET behaviour retained because the frozen exchange corpus (openapi/testdata/exchanges/customers.jsonl) still validates a recorded 400 of that shape against this contract; this server never emits it. An unsafe cookie-authenticated request whose Origin or Sec-Fetch-Site marks it cross-site is rejected with 403 application/problem+json instead. The check is on the request's origin; no antiforgery token is involved.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CustomerConflictProblem'
                    description: Conflict
            summary: Create a new customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:create
    /api/v1/customers/{id}:
        delete:
            operationId: deleteCustomersById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Archive a customer (customers are never hard-deleted)
            tags:
                - Customers
            x-vantigo-access: permission:customers:delete
        get:
            operationId: getCustomer
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SafeCustomerResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Get a customer by id
            tags:
                - Customers
            x-vantigo-access: permission:customers:view
        put:
            operationId: putCustomersById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateCustomerRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SafeCustomerResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/CustomerConflictProblem'
                    description: Conflict
            summary: Update a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:update+customers:view
    /api/v1/customers/{id}/addresses:
        get:
            operationId: getCustomersByIdAddresses
