                            schema:
                                type: string
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
            summary: Add an address to a customer
            tags:
                - Customers
            x-vantigo-access: permission:customers:update+customers:view
    /api/v1/customers/{id}/addresses/{addressId}:
        delete:
            operationId: deleteCustomersByIdAddressesByAddressId
            parameters:
                - in: path
