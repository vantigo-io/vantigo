                duplicateOfId:
                    format: int64
                    type: integer
                events:
                    items:
                        $ref: '#/components/schemas/InvoicesBankTransactionEvent'
                    type: array
                id:
                    format: int64
                    type: integer
                kid:
                    type: string
                lineRef:
                    type: string
                negative:
                    type: boolean
                orderedOn:
                    format: date
                    type: string
                possibleDuplicateOf:
