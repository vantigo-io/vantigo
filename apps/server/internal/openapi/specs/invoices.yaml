                        $ref: '#/components/schemas/InvoicesJournalCode'
                    type: array
                grossTotal:
                    format: double
                    type: number
                netTotal:
                    format: double
                    type: number
                vatTotal:
                    format: double
                    type: number
            required:
                - byCode
                - netTotal
                - vatTotal
                - grossTotal
            type: object
        InvoicesStatsSummaryResponse:
            description: 'The dashboard''s invoices card over one period, in the envelope every module''s /stats/summary shares (payments and delivery design D7). outstanding and overdue are now — the issued invoices with something open, at their open amounts, credit notes excluded, and of those the ones past their due date on today''s Oslo date. issued, credited and paid are in the period: the invoices and the credit notes whose issue date, and the live payments whose paid date, falls on an Oslo day from the day of from up to and including the day of the last instant before to. issuedGrossTotalDelta is issuedGrossTotal less the previous period''s, the period of the same length just before. All NOK.'
            properties:
                creditedCount:
                    format: int32
                    type: integer
                creditedGrossTotal:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                issuedCount:
                    format: int32
                    type: integer
                issuedGrossTotal:
                    format: double
                    type: number
                issuedGrossTotalDelta:
                    format: double
                    type: number
                outstandingAmount:
                    format: double
                    type: number
                outstandingCount:
                    format: int32
                    type: integer
                overdueAmount:
                    format: double
                    type: number
                overdueCount:
                    format: int32
                    type: integer
                paidAmount:
                    format: double
                    type: number
                paidCount:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - outstandingAmount
                - outstandingCount
                - overdueAmount
                - overdueCount
                - issuedCount
                - issuedGrossTotal
                - issuedGrossTotalDelta
                - creditedCount
                - creditedGrossTotal
                - paidAmount
                - paidCount
            type: object
info:
    title: Vantigo Invoices API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/invoices/meta:
        get:
            description: What every Invoices page needs in one read — the currency, the default payment terms, whether the seller is complete and what it lacks, whether anything is issued and the series start, whether an object store exists, today in Oslo, the VAT codes in force today and the caller's capabilities.
            operationId: getInvoicesMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesMetaResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Invoices metadata
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/settings:
        get:
            description: The seller record and the series start. Every invoices:access holder may read them — they are what every document prints.
            operationId: getInvoicesSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces the seller record and the series start (D2). It takes the settings row FOR UPDATE, so it waits behind an issue in flight; the series start is refused once the counter row exists (409 series_locked). Every other field stays editable after the first issue — issued documents keep their seller snapshot.
            operationId: putInvoicesSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — series_locked, or a stale revision (no code; the detail names both revisions).
            summary: Change the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/settings/access-point:
        get:
            description: The stored access-point credentials (EHF and KID design D7) — the provider, its legal entity, whether a key is stored and when the provider refused it — never the key. With none stored the answer is 200 with hasCredentials false and neither provider nor legalEntityId, so the settings page opens an empty card rather than handling an error.
            operationId: getInvoicesSettingsAccessPoint
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
        delete:
            description: Removes the access-point credentials (EHF and KID design D7); EHF is unavailable until new ones are stored. Refused with 409 transmissions_active while any transmission is queued, submitted or unconfirmed — the provider still holds what it needs to finish them. Removing what is not there is a 204 too.
            operationId: deleteInvoicesSettingsAccessPoint
            responses:
                "204":
                    description: No Content — the credentials are gone.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmissions_active.
            summary: Remove the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
        put:
            description: Stores the access point's provider, its legal entity and its API key (EHF and KID design D7), in their own row, the key sealed by the secrets box under invoices/access-point-credential. An omitted key keeps the stored one, opened and sealed again in the same transaction. The answer never carries the key. A PUT clears rejectedAt. Switching to another provider is refused with 409 transmissions_active while any transmission is queued, submitted or unconfirmed; changing the key or the legal entity is not, so a refused key can be replaced while documents wait for it.
            operationId: putInvoicesSettingsAccessPoint
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesAccessPointRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — provider, legalEntityId or apiKey did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmissions_active, on a provider switch.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — ehf_unavailable, the key was omitted and the stored one cannot be opened (APP_SECRET changed, or the row was altered); the credentials are flagged as rejected. Send the key again.
            summary: Store the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/settings/access-point/verify:
        post:
            description: Asks the provider to answer one authenticated read with the stored credentials (EHF and KID design D7) and says how it went. ok clears rejectedAt; unauthorized sets it.
            operationId: postInvoicesSettingsAccessPointVerify
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointVerifyResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — ehf_unavailable, no credentials are stored.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — ehf_unavailable, the stored key cannot be opened; the credentials are flagged as rejected. Store the key again.
            summary: Verify the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes:
        get:
            description: Every VAT code, inactive ones included, with every rate period it has had (D3).
            operationId: getInvoicesVatCodes
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/InvoicesVatCode'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the VAT codes
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Creates a VAT code with its first, open rate period (D3).
            operationId: postInvoicesVatCodes
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, or the code already exists (on code).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a VAT code
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}:
        put:
            description: Replaces a VAT code's own fields (D3). A code in use keeps its category and SAF-T code.
            operationId: putInvoicesVatCodesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, or the code already exists (on code).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no VAT code has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — vat_code_in_use, or a stale revision.
            summary: Change a VAT code
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}/rates:
        post:
            description: The rate-change rule (D3). The open period closes the day before validFrom and a new open period starts on it. It waits behind any issue in flight, so the latest issue date it reads is final.
            operationId: postInvoicesVatCodesByIdRates
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeRateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: Created — the code with its periods.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on ratePercent, or on validFrom when it is not after the open period's start.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no VAT code has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — rate_change_in_past, when validFrom is on or before the latest issue date of any issued document.
            summary: Change a VAT code's rate from a date
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}/rates/{rateId}:
        delete:
            description: Removes a mistaken future period and reopens the previous one (D3). Only the latest period may go, never the only one, and only while no issued document is dated on or after its start.
            operationId: deleteInvoicesVatCodesByIdRatesByRateId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: rateId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: OK — the code with the periods it has left.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such code, or no such period on it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — rate_period_not_latest, rate_period_last or rate_period_in_use.
            summary: Remove a VAT code's latest rate period
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices:
        get:
            description: 'Invoices and credit notes, drafts first and then by number descending (D4). status is draft or issued, kind invoice or credit_note; state is one of open, partially_paid, overdue, paid or credited (D3), which only an issued invoice matches; from and to are issue dates, inclusive; search matches the number exactly when it is digits, or the buyer''s name ignoring case — a draft has no buyer snapshot, so it is found by customerId, not search. page and pageSize are the codebase''s paging: 25 by default, at most 100.'
            operationId: getInvoices
            parameters:
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: kind
                  schema:
                    type: string
                - description: 'One of open, partially_paid, overdue, paid or credited, judged against today in Oslo; only an issued invoice can match it.'
                  in: query
                  name: state
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesInvoiceListItem'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, an unknown status, kind or state, or from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List invoices and credit notes
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Creates an invoice draft (D4). The buyer's billing profile is read before anything is written, for the prefills and the customer gates. A line naming sources, or refreshSources, is a 400 — work is added to a draft through the uninvoiced view (invoices work design D2).
            operationId: postInvoices
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — customer_merged (with mergedInto), customer_archived, customer_blocked or customer_missing.
            summary: Create an invoice draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}:
        delete:
            description: Deletes a draft, its lines with it. An issued document is never deleted (409 invoice_issued).
            operationId: deleteInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued.
            summary: Delete a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
        get:
            description: One document with its lines, VAT summaries, warnings and credit links. On an invoice draft that bills work, a caller holding invoices:create is also told which of its sources changed or are no longer invoiceable (source_changed, source_not_invoiceable), read by id through the source modules' billable reads; a module that is off is not judged, and a read that fails leaves the warnings out (invoices work design D2).
            operationId: getInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
            summary: Get an invoice or a credit note
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces a draft whole, with revision (D4). Only a draft is edited (409 invoice_issued otherwise). A credit-note draft changes only what D8 allows — lines removed, a quantity or a unit price lowered, a description, the note and the internal note — and anything else — another customer, currency, delivery, place of delivery or reference, payment terms, a line's VAT code or unit changed, a quantity or unit price raised, a discount lowered, a line added or one credited twice — is a 400 on the field, and so is a line naming sources or refreshSources; its revision is checked first, so a stale copy is the revision 409. On an invoice draft that holds work (invoices work design D2) every line names its sources — absent is a 400 on lines[i].sources, [] drops — each one the draft holds, once — a save never adds work. A source left out of every line, on a removed line or under a changed customer is dropped and named in releasedSources. refreshSources re-reads the held work first.
            operationId: putInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued, a customer gate, a stale revision or invoice_changed (refreshSources, when the held work changed between its read and the save's lock).
            summary: Replace a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}/issue:
        post:
            description: 'Issues a draft — an invoice or a credit note — into the next number of the one series (D6). An invoice''s billing profile is read first (a credit note reads no directory); then one transaction locks the document, shares the settings row, allocates the number, and only then checks every rule, so any refusal rolls the number back with it. Under a KID agreement an invoice gets its kid from the allocated number; a number the agreement no longer fits is 409 kid_length_exceeded, rolled back like every refusal. The response is the issued document with its warnings (issued_late). The PDF is stored after the commit; pdfStored false means storing it failed and the next download stores it.'
            operationId: postInvoicesByIdIssue
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesIssueRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the issued document.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — the body did not decode (none at all, or an issueDate that is not a calendar date).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — invoice_issued, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed (with allowedIssueDates), customer_merged, customer_archived, customer_blocked, customer_missing, buyer_incomplete, vat_code_inactive and vat_code_not_valid (with linePosition), vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line (with linePosition) or credit_exceeds_invoice.'
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, before any number is allocated. An issued number whose PDF can never be stored is not allowed to exist.
            summary: Issue a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/pdf:
        get:
            description: 'An issued document''s PDF (D7), always the stored object: rendered and stored once when it has no hash yet, then streamed; otherwise read whole and verified against its SHA-256. It is never re-rendered once stored. Named faktura-<number>.pdf or kreditnota-<number>.pdf, invoice-<number>.pdf or credit-note-<number>.pdf in English.'
            operationId: getInvoicesByIdPdf
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                    description: OK — the PDF, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft; a draft is previewed, not downloaded.
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — the stored object is gone, or its bytes no longer match the hash. It is never papered over by rendering again.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, the object store is not configured or could not be read.
