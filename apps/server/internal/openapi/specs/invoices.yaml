components:
    schemas:
        InvoicesMetaCapabilities:
            description: What the caller may do in the Invoices app, answered by the server so no client re-derives a permission rule.
            properties:
                canCreate:
                    description: invoices:create — create, edit and delete drafts, and preview a draft.
                    type: boolean
                canIssue:
                    description: invoices:issue — issue a draft, and create a credit-note draft.
                    type: boolean
                canManage:
                    description: invoices:manage — the seller record, the series start and the VAT codes.
                    type: boolean
                canRegisterPayments:
                    description: invoices:payments — register a payment against an issued invoice, and remove a registration with a reason.
                    type: boolean
                canSend:
                    description: invoices:issue and mailAvailable — send an issued document to the customer by e-mail.
                    type: boolean
                canSendEhf:
                    description: invoices:issue and ehfAvailable — send an issued document to the customer as EHF over Peppol.
                    type: boolean
            required:
                - canCreate
                - canIssue
                - canManage
                - canRegisterPayments
                - canSend
                - canSendEhf
            type: object
        InvoicesMetaResponse:
            description: What every Invoices page needs before it draws anything (invoices foundation design D2).
            properties:
                accessPointCredentialsRejected:
                    description: Whether the access-point provider refused the stored API key (a 401 or 403, or a key that could not be opened). Cleared by the next accepted call or a new key. False without credentials. It does not change ehfAvailable.
                    type: boolean
                anythingIssued:
                    description: Whether any document has been issued — the counter row exists. Once true the series start is locked.
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/InvoicesMetaCapabilities'
                currency:
                    description: The one currency a document may carry in this phase, NOK.
                    type: string
                defaultPaymentTermsDays:
                    description: The seller's default payment terms, which a new draft takes when neither the request nor the customer's billing profile decides.
                    format: int32
                    type: integer
                ehfAvailable:
                    description: Whether this installation can send EHF over Peppol — INVOICES_EHF_ENABLED is on, the Peppol lookup is enabled (PEPPOL_LOOKUP_ENABLED), access-point credentials are stored and the seller's Peppol id is set. Without it canSendEhf is false.
                    type: boolean
                mailAvailable:
                    description: Whether this installation's mail driver is smtp. Without it nothing can be sent (503 mail_unavailable), and canSend is false.
                    type: boolean
                missingSellerFields:
                    description: The seller fields issuing still needs, by their camelCase names (legalName, organisationNumber, addressLine1, postalCode, city, bankAccount). Empty when the seller is complete.
                    items:
                        type: string
                    type: array
                sellerComplete:
                    description: Whether the seller record is complete enough to issue. Issuing is refused with 409 seller_incomplete until it is.
                    type: boolean
                seriesStart:
                    description: The first number of the one series invoices and credit notes share.
                    format: int64
                    type: integer
                storageAvailable:
                    description: Whether this installation has an object store. Without one nothing can be issued (503 storage_unavailable), because an issued number whose PDF can never be stored is not allowed to exist.
                    type: boolean
                today:
                    description: Today in Europe/Oslo, the business day every date rule of this module is judged on.
                    format: date
                    type: string
                vatCodes:
                    description: The VAT codes a new line may take — active, with a rate period covering today — each with today's rate.
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeInForce'
                    type: array
            required:
                - currency
                - defaultPaymentTermsDays
                - sellerComplete
                - missingSellerFields
                - anythingIssued
                - seriesStart
                - storageAvailable
                - mailAvailable
                - ehfAvailable
                - accessPointCredentialsRejected
                - today
                - vatCodes
                - capabilities
            type: object
        InvoicesVatCodeInForce:
            description: One VAT code as a new line may take it, with the rate in force today. A draft holds only the code; the rate a line carries is resolved at issue for the issue date (D3).
            properties:
                code:
                    type: string
                ehfCategory:
                    description: The UNCL5305 category — S, Z, E, AE, G, O or K.
                    type: string
                exemptionReason:
                    description: The text printed under the VAT summary for a category other than S. Absent for S.
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
            type: object
        InvoicesConflictProblem:
            description: 'ProblemDetails plus this module''s refusal code (invoices foundation design D2-D8). code names the rule that refused — series_locked, vat_code_in_use, rate_change_in_past, rate_period_not_latest, rate_period_last, rate_period_in_use, invoice_issued, invoice_draft, customer_merged, customer_archived, customer_blocked, customer_missing, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed, buyer_incomplete, vat_code_inactive, vat_code_not_valid, vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line, credit_exceeds_invoice, credit_note_not_creditable, invoice_fully_credited, credit_note_no_payments, invoice_settled, payment_exceeds_open, payment_removed, customer_anonymised, no_invoice_email (invoices payments and delivery design D2, D4), kid_length_exceeded (EHF and KID design D3: the next number no longer fits the KID agreement, which was shortened), transmissions_active (EHF and KID design D7: the access-point credentials still serve a transmission in flight), ehf_unavailable (D7: no access-point credentials to verify — a 409 — or a stored key that cannot be opened — a 503; D8: an installation that cannot send as EHF — a 503), the send as EHF''s no_peppol_id, buyer_reference_missing, ehf_already_sent, peppol_not_receivable (with peppolRegistered and peppolCanReceive) and ehf_invalid (with rules) (EHF and KID design D8), transmission_not_cancellable and transmission_not_resolvable (D9), source_held_elsewhere (invoices work design D2: a source a save would hold is held by another live draft or invoiced by an unreleased issued line; the detail names that document), storage_unavailable and mail_unavailable, which a 503 carries in the same shape, and mail_failed and peppol_lookup_failed, which a 502 carries. A revision conflict carries no code; its detail names both revisions.'
            properties:
                allowedIssueDates:
                    description: On issue_date_not_allowed, the dates this document may be issued with today, the earliest first. Absent otherwise.
                    items:
                        format: date
                        type: string
                    type: array
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                instance:
                    nullable: true
                    type: string
                linePosition:
                    description: On a refusal about one line (vat_code_inactive, vat_code_not_valid, credit_exceeds_line), the line's position, 1-based. Absent otherwise.
                    format: int32
                    type: integer
                mergedInto:
                    description: On customer_merged, the customer the draft's customer was merged into. Absent otherwise.
                    format: int32
                    type: integer
                openAmount:
                    description: On payment_exceeds_open, the invoice's open amount the payment exceeded (gross − credited − paid). Absent otherwise.
                    format: double
                    type: number
                peppolCanReceive:
                    description: On peppol_not_receivable, whether the receiver accepts this document's type (an invoice or a credit note) on the Peppol network at the send's re-check. Absent otherwise.
                    type: boolean
                peppolRegistered:
                    description: On peppol_not_receivable, whether the receiver is registered on the Peppol network at all at the send's re-check. Absent otherwise.
                    type: boolean
                rules:
                    description: On ehf_invalid, every pre-check rule the document's EHF failed. Absent otherwise.
                    items:
                        $ref: '#/components/schemas/InvoicesEhfRule'
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        InvoicesEhfRule:
            description: One pre-check rule a document's EHF failed (EHF and KID design D11) — id is the official Peppol BIS Billing 3.0 or EN 16931 rule id where there is one (PEPPOL-EN16931-R003, NO-R-001, …), else the module's own name for it (vat_category_k_unsupported); message says it in English.
            properties:
                id:
                    type: string
                message:
                    type: string
            required:
                - id
                - message
            type: object
        InvoicesEhfState:
            description: 'An issued document''s EHF state (EHF and KID design D10); absent on a draft. status is the latest transmission''s — queued, submitted, delivered, failed, unconfirmed or cancelled — or not_sent, and the four timestamps are the latest transmission''s. providerRef and reason (the last error, with e-mail addresses and Peppol identifiers taken out, at most 500 characters) are answered only to a caller with invoices:issue. canSend is what POST /invoices/{id}/send-ehf would answer without the network and without a render, and blockedBy names the first refusal when it would refuse: ehf_unavailable, customer_anonymised, no_peppol_id, buyer_reference_missing, ehf_already_sent, or ehf_invalid for a line in VAT category K. preference (the billing profile''s invoice delivery) and buyerPeppolId (the customer''s current Peppol id) are answered only by GET /invoices/{id}, only to a caller with invoices:issue, whether or not the installation can send e-mail, and are absent when the directory could not be read. transmissions is every transmission of the document, the newest first.'
            properties:
                blockedBy:
                    type: string
                buyerPeppolId:
                    type: string
                canSend:
                    type: boolean
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                preference:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                status:
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                transmissions:
                    items:
                        $ref: '#/components/schemas/InvoicesTransmission'
                    type: array
            required:
                - status
                - canSend
                - transmissions
            type: object
        InvoicesTransmission:
            description: 'One EHF transmission of an issued document (EHF and KID design D9): its identity, its state and when it reached each, the receiver it was addressed to, the SHA-256 of the UBL it carries, the resolution of an unconfirmed one — resolvedByUserId absent when the provider''s evidence resolved it — and ublUrl, where the stored UBL is downloaded. providerRef, reason and submitAttemptedAt are answered only to a caller with invoices:issue.'
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                idempotencyKey:
                    format: uuid
                    type: string
                provider:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                receiverParticipant:
                    type: string
                resolutionNote:
                    type: string
                resolvedByUserId:
                    format: uuid
                    type: string
                status:
                    type: string
                submitAttemptedAt:
                    description: When the worker last stamped the crash marker, immediately before it called the provider — absent while the transmission was never attempted, which is when a queued one can still be cancelled. Answered only to a caller with invoices:issue.
                    format: date-time
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                ublSha256:
                    type: string
                ublUrl:
                    type: string
            required:
                - id
                - status
                - provider
                - idempotencyKey
                - receiverParticipant
                - ublSha256
                - queuedAt
                - ublUrl
            type: object
        InvoicesTransmissionResolution:
            description: 'POST /invoices/{id}/transmissions/{transmissionId}/resolve''s body (EHF and KID design D9): a person''s verdict on an unconfirmed transmission after checking with the provider — delivered or failed — and a note saying why, 1 to 500 characters once trimmed.'
            properties:
                note:
                    type: string
                outcome:
                    enum:
                        - delivered
                        - failed
                    type: string
            required:
                - outcome
                - note
            type: object
        InvoicesSettingsRequest:
            description: 'PUT /settings'' body, a full replace (D2). Every text field is trimmed; an empty string is "not set". organisationNumber is nine digits with a valid mod-11 check digit; bankAccount eleven digits with a valid mod-11 check digit (spaces and dots are dropped); iban passes mod-97 and bic is 8 or 11 characters, both optional; country is ISO 3166-1 alpha-2; defaultPaymentTermsDays is 0-365; defaultCurrency is NOK and only NOK in this phase; seriesStart is 1 to 9007199254740991 (2^53 − 1) and cannot change once anything is issued (409 series_locked). peppolId, kidLength and kidAlgorithm are required and nullable (EHF and KID design D2, D3): a body without them is a 400, so a client that predates them cannot clear them by leaving them out. kidLength and kidAlgorithm are a pair or both null; the next number to be issued — the counter''s, or seriesStart before the first issue — must fit in kidLength less one digits, else a 400 on kidLength. revision is the one the caller read: a stale one is a 409 naming both.'
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                kidAlgorithm:
                    description: mod10 or mod11, the KID check digit the bank agreed (D3); null with kidLength null for no agreement.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                kidLength:
                    description: The agreed KID length including the check digit, 4-25 (D3); null with kidAlgorithm null for no agreement.
                    format: int32
                    nullable: true
                    type: integer
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                legalName:
                    type: string
                organisationNumber:
                    type: string
                peppolId:
                    description: The seller's Peppol participant id (D2), a four-digit scheme, a colon and an identifier, such as 0192:974760673; a 0192 id is the seller's own organisation number. Null or empty defaults it to 0192 and the organisation number when that is set.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                postalCode:
                    type: string
                revision:
                    format: int32
                    type: integer
                seriesStart:
                    format: int64
                    maximum: 9007199254740991
                    type: integer
                vatRegistered:
                    type: boolean
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - postalCode
                - city
                - country
                - bankAccount
                - defaultPaymentTermsDays
                - defaultCurrency
                - seriesStart
                - peppolId
                - kidLength
                - kidAlgorithm
                - revision
            type: object
        InvoicesSettingsResponse:
            description: The seller record and the series start (D2). A text field that is not set is the empty string. seriesLocked is true once anything is issued; from then on seriesStart cannot change, and every other field still can — issued documents keep their own seller snapshot. peppolId is the seller's address on the Peppol network, read when a document is sent, never part of the snapshot; kidLength and kidAlgorithm are the KID agreement, which an issued invoice's kid was computed under.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                kidAlgorithm:
                    description: mod10 or mod11; null without a KID agreement.
                    nullable: true
                    type: string
                kidLength:
                    description: The agreed KID length including the check digit; null without a KID agreement.
                    format: int32
                    nullable: true
                    type: integer
                legalName:
                    type: string
                missingSellerFields:
                    description: What issuing still needs, as GET /meta names it.
                    items:
                        type: string
                    type: array
                organisationNumber:
                    type: string
                peppolId:
                    description: The seller's Peppol participant id; null when neither set nor derivable from the organisation number.
                    nullable: true
                    type: string
                postalCode:
                    type: string
                nextNumber:
                    description: The number the next issue takes — the counter's next once anything is issued, else seriesStart (the same figure the KID agreement's fit is judged against).
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
                seriesLocked:
                    type: boolean
                seriesStart:
                    format: int64
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                vatRegistered:
                    type: boolean
                warnings:
                    description: Never refusals. kid_headroom_low — the next number leaves fewer than two digits of the KID agreement's length (a hundredfold growth) before issuing is refused with kid_length_exceeded.
                    items:
                        type: string
                    type: array
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - addressLine2
                - postalCode
                - city
                - country
                - bankAccount
                - iban
                - bic
                - email
                - defaultPaymentTermsDays
                - defaultCurrency
                - footerText
                - seriesStart
                - seriesLocked
                - nextNumber
                - peppolId
                - kidLength
                - kidAlgorithm
                - missingSellerFields
                - warnings
                - revision
                - updatedAt
            type: object
        InvoicesAccessPointRequest:
            description: 'PUT /settings/access-point''s body (EHF and KID design D7). provider is storecove, the one provider so far; legalEntityId is the Storecove legal entity documents are sent as, a positive integer; apiKey is the provider''s API key — omitted or null keeps the stored one, which is required the first time, and an empty or blank one is a 400. The key is sealed by the secrets box and never answered.'
            properties:
                apiKey:
                    nullable: true
                    type: string
                legalEntityId:
                    format: int64
                    type: integer
                provider:
                    type: string
            required:
                - provider
                - legalEntityId
            type: object
        InvoicesAccessPointResponse:
            description: The stored access-point credentials as a client may see them — never the key. provider and legalEntityId are absent only on GET /invoices/settings/access-point when none are stored, which also answers hasCredentials false. hasCredentials is whether a key is stored; rejectedAt is when the provider first refused it (a 401 or 403, or a stored key the server could not open), absent while it has not, cleared by a new PUT and by the next call the provider accepts.
            properties:
                hasCredentials:
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                provider:
                    type: string
                rejectedAt:
                    format: date-time
                    type: string
            required:
                - hasCredentials
            type: object
        InvoicesAccessPointVerifyResponse:
            description: 'What the provider answered the cheapest authenticated read (Storecove: the legal entity). result is ok (the key reaches the legal entity), unauthorized (the provider refused the key — 401 or 403 — which also flags it as rejected) or unreachable (anything else: the network, a timeout, a 5xx, a legal entity the key does not reach).'
            properties:
                result:
                    type: string
            required:
                - result
            type: object
        InvoicesVatCode:
            description: One VAT code with every rate period it has had (D3). inUse is true once any line, draft or issued, carries the code; from then on its category and SAF-T code cannot change (409 vat_code_in_use).
            properties:
                active:
                    type: boolean
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    description: Absent when the code has none (category S).
                    type: string
                id:
                    format: int32
                    type: integer
                inUse:
                    type: boolean
                name:
                    type: string
                rates:
                    description: Every period, the earliest first. The last is open-ended (validTo absent).
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeRate'
                    type: array
                revision:
                    format: int32
                    type: integer
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - active
                - inUse
                - revision
                - rates
            type: object
        InvoicesVatCodeCreateRequest:
            description: A code and its first, open period (D3). code is 1-10 characters and unique ignoring case; name 1-100; safTCode 1-5; ehfCategory S, Z, E, AE, G, O or K; exemptionReason up to 200 and required unless the category is S; ratePercent greater than 0 and at most 100 for S, exactly 0 for every other category, with at most two decimals.
            properties:
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    type: string
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                validFrom:
                    format: date
                    type: string
            required:
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeRate:
            description: One rate period of a VAT code, inclusive at both ends.
            properties:
                id:
                    format: int32
                    type: integer
                ratePercent:
                    format: double
                    type: number
                validFrom:
                    format: date
                    type: string
                validTo:
                    description: Absent for the open-ended period.
                    format: date
                    type: string
            required:
                - id
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeRateRequest:
            description: 'A rate change (D3): the open period closes the day before validFrom and a new open period starts on it. validFrom must be after the open period''s own start (400 on validFrom) and after the latest issue date of any issued document (409 rate_change_in_past). ratePercent follows the category''s rule.'
            properties:
                ratePercent:
                    format: double
                    type: number
                validFrom:
                    format: date
                    type: string
            required:
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeUpdateRequest:
            description: A full replace of a code's own fields (D3). A code is never deleted; active false stops it being offered for new lines. A code in use keeps its ehfCategory and safTCode (409 vat_code_in_use); its code, name and reason stay editable. The rates change only through the rate operations.
            properties:
                active:
                    type: boolean
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    type: string
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                safTCode:
                    type: string
            required:
                - code
                - name
                - safTCode
                - ehfCategory
                - active
                - revision
            type: object
        InvoicesBuyer:
            description: The buyer snapshot (D4), written at issue from the customer's billing profile and printed from, never re-read. A credit note carries its original's.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                city:
                    type: string
                country:
                    type: string
                customerNumber:
                    format: int64
                    type: integer
                foreignId:
                    description: A foreign business's legal id prefixed with its country (SE556677889901), printed under "VAT/Reg. no.". Never a person's.
                    type: string
                gln:
                    type: string
                language:
                    description: The document's language, en or nb.
                    type: string
                name:
                    type: string
                organisationNumber:
                    description: A Norwegian business's organisation number.
                    type: string
                peppolId:
                    type: string
                postalCode:
                    type: string
                region:
                    type: string
                type:
                    description: business or person.
                    type: string
            required:
                - customerNumber
                - type
                - name
                - language
            type: object
        InvoicesCreditNoteRef:
            description: One credit note of an invoice, a draft (number absent) or issued.
            properties:
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
                status:
                    type: string
            required:
                - id
                - grossTotal
                - status
            type: object
        InvoicesCreditsRef:
            description: The issued invoice a credit note credits.
            properties:
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
            required:
                - id
                - number
                - issueDate
            type: object
        InvoicesDelivery:
            description: One e-mail that handed an issued document over (payments and delivery design D4), logged once the mail server took it. recipient is the address it went to — empty once the customer has been anonymised (D6) — and is present only for a caller with invoices:issue; a reader sees when each send happened, by whom and its subject, not the address. subject is as sent.
            properties:
                id:
                    format: int64
                    type: integer
                recipient:
                    description: The address the e-mail went to, empty once the customer has been anonymised (D6). Present only for a caller with invoices:issue; absent for every other reader.
                    type: string
                sentAt:
                    format: date-time
                    type: string
                sentByUserId:
                    format: uuid
                    type: string
                subject:
                    type: string
            required:
                - id
                - subject
                - sentAt
                - sentByUserId
            type: object
        InvoicesDeliveryAddress:
            description: The place of delivery (§ 5-1-1 nr. 4), when it is not the buyer's address. line1, city and country are required; country is ISO 3166-1 alpha-2.
            properties:
                city:
                    type: string
                country:
                    type: string
                line1:
                    type: string
                line2:
                    type: string
                postalCode:
                    type: string
            required:
                - line1
                - city
                - country
            type: object
        InvoicesInvoiceListItem:
            description: One document in the list. customerName is the buyer snapshot's name on an issued document and the customer's current name on a draft, absent when the directory no longer knows it.
            properties:
                creditsInvoiceId:
                    format: int64
                    type: integer
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                dueDate:
                    format: date
                    type: string
                ehfStatus:
                    description: On an issued document, its latest EHF transmission's status — queued, submitted, delivered, failed, unconfirmed or cancelled — or not_sent (EHF and KID design D10). Absent on a draft.
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                number:
                    format: int64
                    type: integer
                openAmount:
                    description: On an issued invoice, gross less what its issued credit notes credit and what its live payments paid; negative when a credit note followed a payment.
                    format: double
                    type: number
                state:
                    description: 'The derived state (D3): draft, issued (an issued credit note), credited, paid, overdue, partially_paid or open.'
                    type: string
                status:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - grossTotal
            type: object
        InvoicesInvoiceRequest:
            description: 'A draft, created (POST) or replaced whole (PUT, with revision) (D4). customerId is the buyer. currency, when given, is NOK — "Only NOK in this phase". Delivery is deliveryDate alone, deliveryFrom with deliveryTo (from on or before to), or none — none only on a draft; the issue refuses it. references are at most 100 characters each, note and internalNote 1000. lines are at most 500. On create, an omitted yourReference is the billing profile''s buyerReference and an omitted paymentTermsDays the profile''s terms, else the settings'' default; on PUT an invoice''s paymentTermsDays is required and an omitted reference is cleared. On a credit-note draft only what D8 allows may change: lines may be removed, a quantity or a unit price lowered, and a description, the note and the internal note edited. A line''s sources name the work it bills (invoices work design D2): never on a create or a credit note; on a PUT of a draft that holds work, required on every line ([] for none), each source one the draft already holds, named once — a save moves work between lines or drops it, and never adds any. At most 5000 sources on one document.'
            properties:
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                internalNote:
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLineRequest'
                    type: array
                note:
                    type: string
                orderReference:
                    type: string
                ourReference:
                    type: string
                paymentTermsDays:
                    format: int32
                    type: integer
                refreshSources:
                    description: 'PUT of an invoice draft only (invoices work design D2): re-read the work the draft holds through the source modules'' billable reads, before the save''s transaction, and take each source''s current revision, project, quantity, amount, date and kind; work no longer invoiceable, or now in another currency than the draft took it in, is dropped and named in releasedSources. A save that slipped in between the read and the save''s lock and changed the held work is 409 invoice_changed. true on a create or on a credit-note draft is a 400.'
                    type: boolean
                revision:
                    description: Required on PUT; the revision the caller read. A stale one is a 409 naming both.
                    format: int32
                    type: integer
                yourReference:
                    type: string
            required:
                - customerId
                - lines
            type: object
        InvoicesInvoiceResponse:
            description: 'One document (D4): every column in camelCase, its lines and its VAT summaries. On a draft the VAT summaries and totals are computed afresh — an invoice draft''s with the rates in force today, which the issue resolves again for the issue date; a credit-note draft''s at its original lines'' snapshot rates, with each line''s and the invoice''s remainder squared as its issue will — and allowedIssueDates lists the dates it may be issued with today. warnings are never refusals: customer_currency_differs, issued_late (never on a credit note, which keeps its original''s delivery), vat_code_not_valid (a line''s code has no rate period covering today; the issue would refuse it), credit_exceeds_invoice, credit_exceeds_line, ehf_buyer_reference_missing (EHF and KID design D8: a draft whose customer''s billing profile prefers EHF or whose customer has a Peppol id — or, on a credit-note draft, whose buyer snapshot has a Peppol id — with neither yourReference nor orderReference set — Peppol needs one, and neither can change after the issue), and for a document that bills work (invoices work design D2) line_differs_from_sources (on a draft, a line''s net differs from its sources'' amounts summed and rounded to øre), sources_released (on a save''s answer, work the save dropped — named in releasedSources), source_changed and source_not_invoiceable (on GET of an invoice draft, for a caller holding invoices:create: a source''s billing facts changed since the draft took them, or it is no longer invoiceable — the issue would refuse either); each of the last three also on the line''s own warnings. A document that bills work carries sources, its count by state, and each of its lines its sources[]. An invoice carries creditedAmount (its issued credit notes'' gross), uncreditedAmount and creditNotes; a credit note carries credits. Every document carries state (D3); an issued invoice also carries paidAmount, openAmount, payments and — only when openAmount is below zero — refundDue, none of which a draft or a credit note carries. Every issued document carries deliveries (D4) and its EHF state, ehf (EHF and KID design D10); sendDefaults is answered only by GET /invoices/{id} and the send, for a caller who may send — and in its place customerAnonymised when the customer is anonymised.'
            properties:
                allowedIssueDates:
                    items:
                        format: date
                        type: string
                    type: array
                buyer:
                    $ref: '#/components/schemas/InvoicesBuyer'
                createdAt:
                    format: date-time
                    type: string
                creditNotes:
                    items:
                        $ref: '#/components/schemas/InvoicesCreditNoteRef'
                    type: array
                creditedAmount:
                    format: double
                    type: number
                credits:
                    $ref: '#/components/schemas/InvoicesCreditsRef'
                currency:
                    type: string
                customerAnonymised:
                    description: 'true on an issued document whose customer this module has anonymised (D6), answered where sendDefaults would be — GET /invoices/{id} and the send, for a caller who may send, on an installation that can — so the app offers no send; absent otherwise, never false.'
                    type: boolean
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                deliveries:
                    description: On an issued document, every e-mail that handed it over, the first first (D4).
                    items:
                        $ref: '#/components/schemas/InvoicesDelivery'
                    type: array
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                ehf:
                    $ref: '#/components/schemas/InvoicesEhfState'
                exchangeRate:
                    format: double
                    type: number
                exchangeRateDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                internalNote:
                    type: string
                issueDate:
                    format: date
                    type: string
                issuedAt:
                    format: date-time
                    type: string
                issuedByUserId:
                    format: uuid
                    type: string
                kid:
                    description: An issued invoice's KID under the seller's bank agreement at issue (EHF and KID design D3) — the number zero-padded to the agreed length less one, then the check digit; a MOD11 check digit may be '-'. Absent without an agreement, on a draft and on a credit note.
                    type: string
                kidAlgorithm:
                    description: mod10 or mod11, the algorithm kid was computed with. Present exactly when kid is.
                    type: string
                kind:
                    description: invoice or credit_note.
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLine'
                    type: array
                netTotal:
                    format: double
                    type: number
                note:
                    type: string
                number:
                    format: int64
                    type: integer
                orderReference:
                    type: string
                openAmount:
                    description: On an issued invoice, grossTotal less creditedAmount less paidAmount. It may be negative — a credit note issued after a payment — and refundDue is then what it is short of zero.
                    format: double
                    type: number
                ourReference:
                    type: string
                paidAmount:
                    description: On an issued invoice, what its live payments add up to; a removed payment counts for nothing.
                    format: double
                    type: number
                paymentTermsDays:
                    format: int32
                    type: integer
                payments:
                    description: On an issued invoice, every payment registered against it, removed ones included with their removal, in the order the money arrived.
                    items:
                        $ref: '#/components/schemas/InvoicesPayment'
                    type: array
                pdfStored:
                    description: On an issued document, whether its PDF is stored. False only when storing it after the issue failed; the next download stores it.
                    type: boolean
                refundDue:
                    description: On an issued invoice whose openAmount is below zero, the amount owed back (−openAmount); absent otherwise. The figure only — refunds are not a flow in this phase.
                    format: double
                    type: number
                releasedSources:
                    description: On a save's answer only, the work the save dropped (invoices work design D2) — removed from every line, its line removed, the customer changed, or no longer invoiceable on a refresh — with the warning sources_released. Absent when nothing was dropped.
                    items:
                        $ref: '#/components/schemas/InvoicesSourceRef'
                    type: array
                revision:
                    format: int32
                    type: integer
                seller:
                    $ref: '#/components/schemas/InvoicesSeller'
                sendDefaults:
                    $ref: '#/components/schemas/InvoicesSendDefaults'
                sources:
                    $ref: '#/components/schemas/InvoicesSourcesBlock'
                state:
                    description: 'The derived state, judged against today in Oslo (D3), the first match winning: draft (a draft); issued (an issued credit note); credited (an issued invoice its issued credit notes cover, credited > 0 and credited ≥ gross); paid (nothing left open); overdue (past its due date); partially_paid (something paid); open (otherwise).'
                    type: string
                status:
                    description: draft or issued.
                    type: string
                uncreditedAmount:
                    format: double
                    type: number
                updatedAt:
                    format: date-time
                    type: string
                vatSummaries:
                    items:
                        $ref: '#/components/schemas/InvoicesVatSummary'
                    type: array
                vatTotal:
                    format: double
                    type: number
                vatTotalNok:
                    format: double
                    type: number
                warnings:
                    items:
                        type: string
                    type: array
                yourReference:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - exchangeRate
                - yourReference
                - ourReference
                - orderReference
                - note
                - internalNote
                - netTotal
                - vatTotal
                - grossTotal
                - vatTotalNok
                - lines
                - vatSummaries
                - warnings
                - createdAt
                - updatedAt
                - revision
            type: object
        InvoicesLine:
            description: One line (D4, D5). lineGross is quantity × unitPrice rounded to øre, lineAllowance the discount of it rounded, lineNet their difference. The VAT fields are the issue snapshot, absent on a draft. On a document that bills work (invoices work design D2) every line carries sources — [] for a line that bills none — and warnings, its own codes (line_differs_from_sources, source_changed, source_not_invoiceable); both absent on a document that bills no work.
            properties:
                creditsLineId:
                    description: On a credit note's line, the original line it credits.
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                exemptionReason:
                    type: string
                id:
                    format: int64
                    type: integer
                lineAllowance:
                    format: double
                    type: number
                lineGross:
                    format: double
                    type: number
                lineNet:
                    format: double
                    type: number
                position:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                safTCode:
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/InvoicesLineSource'
                    type: array
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCategory:
                    type: string
                vatCodeId:
                    format: int32
                    type: integer
                vatRatePercent:
                    format: double
                    type: number
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - id
                - position
                - description
                - quantity
                - unit
                - unitPrice
                - discountPercent
                - vatCodeId
                - lineGross
                - lineAllowance
                - lineNet
            type: object
        InvoicesLineRequest:
            description: One line of a draft. description is 1-500 characters; quantity greater than 0 with at most 3 decimals; unitPrice 0 or more with at most 4; discountPercent 0-100 with at most 2 (0 when omitted); unit at most 20. vatCodeId is an active code. creditsLineId is a credit-note draft's own and names the original line the line credits.
            properties:
                creditsLineId:
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                quantity:
                    format: double
                    type: number
                sources:
                    description: The work the line bills, by identity (invoices work design D2). Required on every line of a draft that holds work — [] for none — and refused on a create and on a credit note.
                    items:
                        $ref: '#/components/schemas/InvoicesSourceRef'
                    type: array
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCodeId:
                    format: int32
                    type: integer
            required:
                - description
                - quantity
                - unitPrice
                - vatCodeId
            type: object
        InvoicesLineSource:
            description: 'One piece of work a line bills (invoices work design D2), answered from the document''s own rows and never a live read: its kind and id, its project, the work''s date, the quantity (hours, kilometres or 1) and the exact amount the draft took from the source — at most eight decimals — and state: held (on a draft), invoiced (by the issue) or released (by the credit note that returned its line in full).'
            properties:
                amount:
                    format: double
                    type: number
                date:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                projectId:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                state:
                    type: string
            required:
                - kind
                - id
                - projectId
                - date
                - quantity
                - amount
                - state
            type: object
        InvoicesSourceRef:
            description: 'A piece of work by identity (invoices work design D2): kind is time.entry (an hour entry), expenses.entry (an expense line) or projects.milestone (a billing milestone), and id is its row in the module that owns it.'
            properties:
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
            required:
                - kind
                - id
            type: object
        InvoicesSourcesBlock:
            description: 'The work a document bills, counted by state from its own rows (invoices work design D2): count in all, held (on a draft), invoiced (by the issue) and released (by a credit note). Answered on a document that bills work, absent otherwise.'
            properties:
                count:
                    format: int32
                    type: integer
                held:
                    format: int32
                    type: integer
                invoiced:
                    format: int32
                    type: integer
                released:
                    format: int32
                    type: integer
            required:
                - count
                - held
                - invoiced
                - released
            type: object
        InvoicesPayment:
            description: One payment registered against an issued invoice (D2). A removed one keeps its row and carries removedAt, removedByUserId and removalReason; it counts for nothing.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
                registeredByUserId:
                    format: uuid
                    type: string
                removalReason:
                    type: string
                removedAt:
                    format: date-time
                    type: string
                removedByUserId:
                    format: uuid
                    type: string
            required:
