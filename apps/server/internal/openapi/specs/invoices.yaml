    /api/v1/invoices/overdue:
        get:
            description: 'The overdue list (invoices payments and reminders design D12): the issued invoices whose state is overdue today in Oslo — and, with charges=outstanding, also the paid ones whose charges are still outstanding — filtered by customerId and dueBefore (a due date before that day). Past 5 000 of them, 409 too_many_overdue asks for customerId or dueBefore. The whole set is read on the pool in a handful of statements and judged by the reminder engine, invoice by invoice, before the action filter (reminder, collection_notice, hand_off, blocked, waiting) and the page apply (M7); the oldest due date first. page and pageSize are the codebase''s paging, 25 by default, at most 100. With the bank data''s freshness and the warnings that apply.'
            operationId: getInvoicesOverdue
            parameters:
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: dueBefore
                  schema:
                    format: date
                    type: string
                - in: query
                  name: action
                  schema:
                    enum:
                        - reminder
                        - collection_notice
                        - hand_off
                        - blocked
                        - waiting
                    type: string
                - in: query
                  name: charges
                  schema:
                    enum:
                        - outstanding
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesOverdueResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — too_many_overdue, more than 5 000 invoices to judge; narrow by customerId or dueBefore.
            summary: List the overdue invoices
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/reminder-runs:
        get:
            description: The reminder runs, newest first (D10), each with the letters it made and the items it skipped once it finished. page and pageSize are the codebase's paging, 25 by default, at most 100.
            operationId: getInvoicesReminderRuns
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesReminderRun'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the reminder runs
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
        post:
            description: 'A reminder run (invoices payments and reminders design D10). dryRun true is the preview, narrowed by customerId and dueBefore as the overdue list is: every overdue invoice whose next action is a reminder or a collection notice due today or earlier, each with its letter as it would go today, its channel and recipient (read from the customers'' billing profiles, one directory call per customer), the invoices blocked or waiting, the bank data''s freshness and the warnings — 200, nothing written, no lock taken; past 5 000 overdue invoices, 409 too_many_overdue. dryRun false runs items (1 to 500, each invoice once, each an issued invoice with the action its preview showed; 400 on items otherwise), refused in order: reminders_disabled; then, judged on the pool before anything is written, collection_rates_outdated (an item''s letter needs a rate with no row for a half-year, with kind and halfYear), collection_regime_unreviewed (an item would carry a fee or be a collection notice past the regime review under the 1988 regime) and bank_import_stale (the bank data is stale, an item would carry a fee, the compensation or interest, and acknowledgeStaleImport is not true, with lastBookedOn) — letters without charges are never held back by it. Then the items'' billing profiles are read, before any lock; the run row; and per item one transaction — the invoice FOR UPDATE and every figure after it — that skips customer_anonymised or action_changed (the engine no longer gives the item''s action; the letter now claims a charge on stale bank data the run did not confirm; or the invoice was merged to another customer since its recipient was read), or inserts the letter: queued for e-mail, awaiting_print for paper, without facts. The run''s counts are set once at its end. 201.'
            operationId: postInvoicesReminderRuns
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesReminderRunRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesReminderRunPreview'
                    description: OK — the preview (dryRun true).
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesReminderRunResult'
                    description: Created — the run, its letters and the items it skipped.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on items (none or more than 500, an invoice twice, an action that is not reminder or collection_notice, an id that is not an issued invoice).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — reminders_disabled, collection_rates_outdated (with kind and halfYear), collection_regime_unreviewed, bank_import_stale (with lastBookedOn), or on the preview too_many_overdue. Nothing is written.
            summary: Preview or make a reminder run
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/reminder-runs/{id}:
