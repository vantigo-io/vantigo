components:
    schemas:
        InvoicesMetaCapabilities:
            description: What the caller may do in the Invoices app, answered by the server so no client re-derives a permission rule.
            properties:
                canCreate:
                    description: invoices:create — create, edit and delete drafts, and preview a draft.
                    type: boolean
                canImportBankFiles:
                    description: invoices:payments — import OCR giro and camt.054 bank files, and read the imported files and their accounts.
                    type: boolean
                canIssue:
                    description: invoices:issue — issue a draft, and create a credit-note draft.
                    type: boolean
                canManage:
                    description: invoices:manage — the seller record, the series start and the VAT codes.
                    type: boolean
                canRegisterPayments:
                    description: invoices:payments — register a payment against an issued invoice, and remove a registration with a reason.
                    type: boolean
                canRunReminders:
                    description: invoices:payments — preview and make reminder runs, and read the runs.
                    type: boolean
                canSend:
                    description: invoices:issue and mailAvailable — send an issued document to the customer by e-mail.
                    type: boolean
                canSendEhf:
                    description: invoices:issue and ehfAvailable — send an issued document to the customer as EHF over Peppol.
                    type: boolean
            required:
                - canCreate
                - canImportBankFiles
                - canIssue
                - canManage
                - canRegisterPayments
                - canRunReminders
                - canSend
                - canSendEhf
            type: object
        InvoicesMetaResponse:
            description: What every Invoices page needs before it draws anything (invoices foundation design D2).
            properties:
                accessPointCredentialsRejected:
                    description: Whether the access-point provider refused the stored API key (a 401 or 403, or a key that could not be opened). Cleared by the next accepted call or a new key. False without credentials. It does not change ehfAvailable.
                    type: boolean
                anythingIssued:
                    description: Whether any document has been issued — the counter row exists. Once true the series start is locked.
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/InvoicesMetaCapabilities'
                currency:
                    description: The one currency a document may carry in this phase, NOK.
                    type: string
                defaultPaymentTermsDays:
                    description: The seller's default payment terms, which a new draft takes when neither the request nor the customer's billing profile decides.
                    format: int32
                    type: integer
                ehfAvailable:
                    description: Whether this installation can send EHF over Peppol — INVOICES_EHF_ENABLED is on, the Peppol lookup is enabled (PEPPOL_LOOKUP_ENABLED), access-point credentials are stored and the seller's Peppol id is set. Without it canSendEhf is false.
                    type: boolean
                mailAvailable:
                    description: Whether this installation's mail driver is smtp. Without it nothing can be sent (503 mail_unavailable), and canSend is false.
                    type: boolean
                remindersEnabled:
                    description: Whether reminders are offered at all — the reminder settings' enabled (invoices payments and reminders design D7). Off, every invoice's next action is blocked reminders_disabled and a run is refused.
                    type: boolean
                missingSellerFields:
                    description: The seller fields issuing still needs, by their camelCase names (legalName, organisationNumber, addressLine1, postalCode, city, bankAccount). Empty when the seller is complete.
                    items:
                        type: string
                    type: array
                sellerComplete:
                    description: Whether the seller record is complete enough to issue. Issuing is refused with 409 seller_incomplete until it is.
                    type: boolean
                seriesStart:
                    description: The first number of the one series invoices and credit notes share.
                    format: int64
                    type: integer
                storageAvailable:
                    description: Whether this installation has an object store. Without one nothing can be issued (503 storage_unavailable), because an issued number whose PDF can never be stored is not allowed to exist.
                    type: boolean
                today:
                    description: Today in Europe/Oslo, the business day every date rule of this module is judged on.
                    format: date
                    type: string
                vatCodes:
                    description: The VAT codes a new line may take — active, with a rate period covering today — each with today's rate.
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeInForce'
                    type: array
                work:
                    $ref: '#/components/schemas/InvoicesMetaWork'
                workAvailable:
                    description: Whether any work can be invoiced here — at least one of the billable reads (time's hours, expenses' lines, projects' milestones) is composed, so the uninvoiced view answers (invoices work design D3). Without it GET /invoices/work is 409 work_unavailable.
                    type: boolean
            required:
                - currency
                - defaultPaymentTermsDays
                - sellerComplete
                - missingSellerFields
                - anythingIssued
                - seriesStart
                - storageAvailable
                - mailAvailable
                - ehfAvailable
                - accessPointCredentialsRejected
                - today
                - vatCodes
                - capabilities
                - workAvailable
                - work
                - remindersEnabled
            type: object
        InvoicesMetaWork:
            description: Which kinds of work this installation can invoice (invoices work design D3) — each true when the module that owns it is switched on and provides its billable read.
            properties:
                expenses:
                    description: Expenses' lines (expenses.entry).
                    type: boolean
                hours:
                    description: Time's hour entries (time.entry).
                    type: boolean
                milestones:
                    description: Projects' billing milestones (projects.milestone).
                    type: boolean
            required:
                - hours
                - expenses
                - milestones
            type: object
        InvoicesVatCodeInForce:
            description: One VAT code as a new line may take it, with the rate in force today. A draft holds only the code; the rate a line carries is resolved at issue for the issue date (D3).
            properties:
                code:
                    type: string
                ehfCategory:
                    description: The UNCL5305 category — S, Z, E, AE, G, O or K.
                    type: string
                exemptionReason:
                    description: The text printed under the VAT summary for a category other than S. Absent for S.
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
            type: object
        InvoicesConflictProblem:
            description: 'ProblemDetails plus this module''s refusal code (invoices foundation design D2-D8). code names the rule that refused — series_locked, vat_code_in_use, rate_change_in_past, rate_period_not_latest, rate_period_last, rate_period_in_use, invoice_issued, invoice_draft, customer_merged, customer_archived, customer_blocked, customer_missing, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed, buyer_incomplete, vat_code_inactive, vat_code_not_valid, vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line, credit_exceeds_invoice, credit_note_not_creditable, invoice_fully_credited, credit_note_no_payments, invoice_settled, payment_exceeds_open, payment_removed, customer_anonymised, no_invoice_email (invoices payments and delivery design D2, D4), kid_length_exceeded (EHF and KID design D3: the next number no longer fits the KID agreement, which was shortened), transmissions_active (EHF and KID design D7: the access-point credentials still serve a transmission in flight), ehf_unavailable (D7: no access-point credentials to verify — a 409 — or a stored key that cannot be opened — a 503; D8: an installation that cannot send as EHF — a 503), the send as EHF''s no_peppol_id, buyer_reference_missing, ehf_already_sent, peppol_not_receivable (with peppolRegistered and peppolCanReceive) and ehf_invalid (with rules) (EHF and KID design D8), transmission_not_cancellable and transmission_not_resolvable (D9), source_held_elsewhere (invoices work design D2: a source a save or the wizard would hold is held by another live draft or invoiced by an unreleased issued line; heldBy, sourceKind and sourceId name the document and the source), the wizard''s refusals (invoices work design D3, D4, D11; POST /invoices/from-work) — work_unavailable (no billable read is composed), too_many_sources (more than 5 000 sources on one document, an append target''s held ones counted), source_not_for_customer (a source''s project bills another customer or is gone), mixed_currency (the selection spans currencies), currency_not_nok (the selection is in another currency than NOK) and too_many_lines (the grouping would make more than 500 lines, with suggestedGrouping, the next coarser grouping that fits) — the issue''s refusals about the work it bills (invoices work design D1, each with linePosition, sourceKind and sourceId) — source_not_invoiceable, source_changed and source_already_invoiced (a source''s own module would not stamp it: no longer approved, ready or billable; changed since the draft took it; already invoiced), source_customer_changed (a source''s project no longer bills the draft''s customer, or is gone; judged before a number exists) and source_not_selectable (hours of a project now fixed-price or non-billable, or any work of a project now non-billable) — and projects_unavailable (the draft bills work and the projects module is switched off); a final settlement''s (invoices work design D7) deduction_exceeds_invoice (with linePosition: a deduction line takes more than its a-konto has left at its VAT code, or deducts a document that is no longer an issued invoice of this customer, or deducted at a code where it deducts itself), deduction_duplicated (with linePosition: a second deduction line for one deducted invoice and VAT code) and invoice_total_not_positive (a settlement''s gross is zero or less); a credit note''s credit_total_negative (its gross is below zero) and invoice_deducted (it credits more of an a-konto at a VAT code than no issued settlement deducted there; the detail names the settlements); credit_note_deducts_nothing (GET /invoices/{id}/deductible on a credit-note draft), and invoice_changed also when the draft''s work changed between the issue''s reads and its lock; the bank import''s (invoices payments and reminders design D3) bank_account_unknown (an account the file names is neither the seller''s nor one an issued invoice printed; the detail names its last four digits), bank_file_duplicate (the same bytes or the same file identity imported before, with bankFileId, uploadedAt and uploadedBy of that import) and bank_import_format_mismatch (the account''s files come in the other format; the detail names the account and its format); the collection rates'' (invoices payments and reminders design D6) collection_rate_exists (a rate of that kind already takes effect on that day) and collection_rate_in_force (the rate came with a release, is in force or past, or a printed or sent letter relied on it, so it is not deleted); the charges'' (invoices payments and reminders design D9) no_charges_outstanding (nothing is outstanding: no letter claimed a charge, or every charge is waived or paid), charge_payment_exceeds_outstanding (with chargesOutstanding), charge_not_claimed (the letter was not sent, claimed no such charge, it is waived already, or no interest is left unpaid) and credit_note_no_reminders (a credit note is never reminded of), and the manual deliveries'' (D8) delivery_removed and delivery_relied_on (a letter''s charge stands on the record and no other delivery on or before the due date would remain); the reminder runs'' and the overdue list''s (invoices payments and reminders design D10, D12) reminders_disabled (reminders are switched off in the reminder settings), collection_rates_outdated (a letter of the run needs a rate with no row for a half-year, with kind and halfYear), collection_regime_unreviewed (a letter of the run would carry a fee or be a collection notice past the regime review under the 1988 regime), bank_import_stale (the bank data is stale and a letter of the run would carry a charge, with lastBookedOn; acknowledgeStaleImport confirms it) and too_many_overdue (more than 5 000 overdue invoices to judge; narrow by customer or due date); the holds'' and the hand-off''s (invoices payments and reminders design D11) invoice_on_hold (a hold is live already), invoice_not_on_hold (no hold is live to lift), invoice_handed_off (a hand-off is live already), invoice_not_handed_off (no hand-off is live to withdraw) and invoice_not_delivered (no delivery on or before the due date; acknowledgeNotDelivered confirms the hand-off); the exception queue''s (invoices payments and reminders design D5) bank_transaction_not_open (the line is not in the state the action takes — not an exception, for most), bank_transaction_not_applicable (the action is not for this line: an apply of a reversal or a negative line, a dismissal of a reversal, a reversal handled on a line that is none, a duplicate confirmed or kept that is none, a reopen of a line that is open), bank_transaction_applied (a live payment or charge payment still refers to the line), bank_transaction_reversed (a reversal took back a payment of the line, so it is never reopened, or of the line it was kept as a duplicate of, so it is never treated as distinct nor applied), reversal_payment_required (a reversal handled with no payment named and no note saying why), allocation_not_an_invoice (an allocation names no issued invoice), allocation_exceeds_transaction (the allocations add up to more than the line has left) and paid_before_issue (the line was booked before an allocation''s invoice was issued), besides payment_exceeds_open with invoiceId and charge_payment_exceeds_outstanding on an allocation; and storage_unavailable and mail_unavailable, which a 503 carries in the same shape, and mail_failed and peppol_lookup_failed, which a 502 carries. A revision conflict carries no code; its detail names both revisions.'
            properties:
                allowedIssueDates:
                    description: On issue_date_not_allowed, the dates this document may be issued with today, the earliest first. Absent otherwise.
                    items:
                        format: date
                        type: string
                    type: array
                bankFileId:
                    description: On bank_file_duplicate, the earlier import of the same file — the same bytes or the same file identity. Absent otherwise.
                    format: int64
                    type: integer
                chargesOutstanding:
                    description: On charge_payment_exceeds_outstanding, the invoice's charges outstanding — the fees and compensation its sent letters claimed and the latest letter's interest, less waivers and charge payments — which the charge payment exceeded. Absent otherwise.
                    format: double
                    type: number
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                halfYear:
                    description: On collection_rates_outdated, the half-year a letter needs a rate row for and has none, as 2027-H1 or 2027-H2. Absent otherwise.
                    type: string
                heldBy:
                    $ref: '#/components/schemas/InvoicesWorkHeldBy'
                instance:
                    nullable: true
                    type: string
                invoiceId:
                    description: On payment_exceeds_open answered by the exception queue's apply, the invoice whose open amount the allocation exceeded, beside openAmount. Absent otherwise.
                    format: int64
                    type: integer
                kind:
                    description: On collection_rates_outdated, the kind of the rate without a row — late_interest_percent or b2b_compensation_nok. Absent otherwise.
                    type: string
                lastBookedOn:
                    description: On bank_import_stale, the latest booking date of any imported bank file. Absent otherwise, and absent when no bank file was ever imported.
                    format: date
                    type: string
                linePosition:
                    description: On a refusal about one line (vat_code_inactive, vat_code_not_valid, credit_exceeds_line, deduction_exceeds_invoice, deduction_duplicated, and the issue's refusals about a source — the first line holding it), the line's position, 1-based. Absent otherwise.
                    format: int32
                    type: integer
                mergedInto:
                    description: On customer_merged, the customer the draft's customer was merged into. Absent otherwise.
                    format: int32
                    type: integer
                openAmount:
                    description: On payment_exceeds_open, the invoice's open amount the payment exceeded (gross − credited − paid). Absent otherwise.
                    format: double
                    type: number
                peppolCanReceive:
                    description: On peppol_not_receivable, whether the receiver accepts this document's type (an invoice or a credit note) on the Peppol network at the send's re-check. Absent otherwise.
                    type: boolean
                peppolRegistered:
                    description: On peppol_not_receivable, whether the receiver is registered on the Peppol network at all at the send's re-check. Absent otherwise.
                    type: boolean
                rules:
                    description: On ehf_invalid, every pre-check rule the document's EHF failed. Absent otherwise.
                    items:
                        $ref: '#/components/schemas/InvoicesEhfRule'
                    type: array
                sourceId:
                    description: On the issue's and the wizard's refusals about a source (source_not_invoiceable, source_changed, source_already_invoiced, source_customer_changed, source_not_selectable, source_not_for_customer, source_held_elsewhere), the source's id in its own module. Absent otherwise.
                    format: int64
                    type: integer
                sourceKind:
                    description: On the issue's and the wizard's refusals about a source, its kind — time.entry, expenses.entry or projects.milestone. Absent otherwise.
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                suggestedGrouping:
                    description: On too_many_lines, the next coarser grouping whose lines fit in 500 — date, person, work_type or project. Absent otherwise, and absent when none fits.
                    type: string
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
                uploadedAt:
                    description: On bank_file_duplicate, when the earlier import was uploaded. Absent otherwise.
                    format: date-time
                    type: string
                uploadedBy:
                    description: On bank_file_duplicate, the user who uploaded the earlier import. Absent otherwise.
                    format: uuid
                    type: string
            type: object
        InvoicesEhfRule:
            description: One pre-check rule a document's EHF failed (EHF and KID design D11) — id is the official Peppol BIS Billing 3.0 or EN 16931 rule id where there is one (PEPPOL-EN16931-R003, NO-R-001, …), else the module's own name for it (vat_category_k_unsupported); message says it in English.
            properties:
                id:
                    type: string
                message:
                    type: string
            required:
                - id
                - message
            type: object
        InvoicesEhfState:
            description: 'An issued document''s EHF state (EHF and KID design D10); absent on a draft. status is the latest transmission''s — queued, submitted, delivered, failed, unconfirmed or cancelled — or not_sent, and the four timestamps are the latest transmission''s. providerRef and reason (the last error, with e-mail addresses and Peppol identifiers taken out, at most 500 characters) are answered only to a caller with invoices:issue. canSend is what POST /invoices/{id}/send-ehf would answer without the network and without a render, and blockedBy names the first refusal when it would refuse: ehf_unavailable, customer_anonymised, no_peppol_id, buyer_reference_missing, ehf_already_sent, or ehf_invalid for a line in VAT category K. preference (the billing profile''s invoice delivery) and buyerPeppolId (the customer''s current Peppol id) are answered only by GET /invoices/{id}, only to a caller with invoices:issue, whether or not the installation can send e-mail, and are absent when the directory could not be read. transmissions is every transmission of the document, the newest first.'
            properties:
                blockedBy:
                    type: string
                buyerPeppolId:
                    type: string
                canSend:
                    type: boolean
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                preference:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                status:
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                transmissions:
                    items:
                        $ref: '#/components/schemas/InvoicesTransmission'
                    type: array
            required:
                - status
                - canSend
                - transmissions
            type: object
        InvoicesTransmission:
            description: 'One EHF transmission of an issued document (EHF and KID design D9): its identity, its state and when it reached each, the receiver it was addressed to, the SHA-256 of the UBL it carries, the resolution of an unconfirmed one — resolvedByUserId absent when the provider''s evidence resolved it — and ublUrl, where the stored UBL is downloaded. providerRef, reason and submitAttemptedAt are answered only to a caller with invoices:issue.'
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                idempotencyKey:
                    format: uuid
                    type: string
                provider:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                receiverParticipant:
                    type: string
                resolutionNote:
                    type: string
                resolvedByUserId:
                    format: uuid
                    type: string
                status:
                    type: string
                submitAttemptedAt:
                    description: When the worker last stamped the crash marker, immediately before it called the provider — absent while the transmission was never attempted, which is when a queued one can still be cancelled. Answered only to a caller with invoices:issue.
                    format: date-time
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                ublSha256:
                    type: string
                ublUrl:
                    type: string
            required:
                - id
                - status
                - provider
                - idempotencyKey
                - receiverParticipant
                - ublSha256
                - queuedAt
                - ublUrl
            type: object
        InvoicesTransmissionResolution:
            description: 'POST /invoices/{id}/transmissions/{transmissionId}/resolve''s body (EHF and KID design D9): a person''s verdict on an unconfirmed transmission after checking with the provider — delivered or failed — and a note saying why, 1 to 500 characters once trimmed.'
            properties:
                note:
                    type: string
                outcome:
                    enum:
                        - delivered
                        - failed
                    type: string
            required:
                - outcome
                - note
            type: object
        InvoicesSettingsRequest:
            description: 'PUT /settings'' body, a full replace (D2). Every text field is trimmed; an empty string is "not set". organisationNumber is nine digits with a valid mod-11 check digit; bankAccount eleven digits with a valid mod-11 check digit (spaces and dots are dropped); iban passes mod-97 and bic is 8 or 11 characters, both optional; country is ISO 3166-1 alpha-2; defaultPaymentTermsDays is 0-365; defaultCurrency is NOK and only NOK in this phase; seriesStart is 1 to 9007199254740991 (2^53 − 1) and cannot change once anything is issued (409 series_locked). peppolId, kidLength and kidAlgorithm are required and nullable (EHF and KID design D2, D3): a body without them is a 400, so a client that predates them cannot clear them by leaving them out. kidLength and kidAlgorithm are a pair or both null; the next number to be issued — the counter''s, or seriesStart before the first issue — must fit in kidLength less one digits, else a 400 on kidLength. workVatCodes is required too (invoices work design D6; a body without it is a 400 on workVatCodes): the VAT code the uninvoiced view''s wizard pre-fills for each kind of work, each a code that exists and — when it differs from the stored one — is active, else a 400 on workVatCodes.hours, workVatCodes.expenses or workVatCodes.milestones. timesheetDefault and timesheetPersonLabel are required too (invoices work design D5; a body without either, or with null, is a 400 on it): whether a new draft — the wizard''s or one created by hand — carries a timesheet unless its request says, and how the timesheet names each person — initials, number or name, anything else a 400 on timesheetPersonLabel. revision is the one the caller read: a stale one is a 409 naming both.'
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                kidAlgorithm:
                    description: mod10 or mod11, the KID check digit the bank agreed (D3); null with kidLength null for no agreement.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                kidLength:
                    description: The agreed KID length including the check digit, 4-25 (D3); null with kidAlgorithm null for no agreement.
                    format: int32
                    nullable: true
                    type: integer
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                legalName:
                    type: string
                organisationNumber:
                    type: string
                peppolId:
                    description: The seller's Peppol participant id (D2), a four-digit scheme, a colon and an identifier, such as 0192:974760673; a 0192 id is the seller's own organisation number. Null or empty defaults it to 0192 and the organisation number when that is set.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                postalCode:
                    type: string
                revision:
                    format: int32
                    type: integer
                seriesStart:
                    format: int64
                    maximum: 9007199254740991
                    type: integer
                timesheetDefault:
                    description: Whether a new invoice draft carries a timesheet unless its request says (invoices work design D5). Required — a body without it is a 400 on timesheetDefault.
                    type: boolean
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                timesheetPersonLabel:
                    description: How a timesheet names each person (invoices work design D5) — initials (the display name's initials, a second KN becoming KN2), number (Person 1, Person 2 in order of first appearance on the timesheet) or name (the display name). Required; anything else is a 400 on timesheetPersonLabel.
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                vatRegistered:
                    type: boolean
                workVatCodes:
                    description: The VAT code each kind of work is invoiced at (invoices work design D6), each the id of an active code — a changed one; one kept as stored passes even if it has since become inactive. Required — a body without it is a 400 on workVatCodes, so a client that predates it cannot reset the codes by leaving it out.
                    properties:
                        expenses:
                            format: int32
                            type: integer
                        hours:
                            format: int32
                            type: integer
                        milestones:
                            format: int32
                            type: integer
                    required:
                        - hours
                        - expenses
                        - milestones
                    type: object
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - postalCode
                - city
                - country
                - bankAccount
                - defaultPaymentTermsDays
                - defaultCurrency
                - seriesStart
                - peppolId
                - kidLength
                - kidAlgorithm
                - workVatCodes
                - timesheetDefault
                - timesheetPersonLabel
                - revision
            type: object
        InvoicesSettingsResponse:
            description: The seller record and the series start (D2). A text field that is not set is the empty string. seriesLocked is true once anything is issued; from then on seriesStart cannot change, and every other field still can — issued documents keep their own seller snapshot. peppolId is the seller's address on the Peppol network, read when a document is sent, never part of the snapshot; kidLength and kidAlgorithm are the KID agreement, which an issued invoice's kid was computed under.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
