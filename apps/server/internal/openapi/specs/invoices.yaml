                "200":
                    content:
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                    description: OK — the PDF, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
