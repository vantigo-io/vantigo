    /api/v1/invoices/{id}/manual-deliveries/{deliveryId}/remove:
        post:
            description: 'Removes a manual delivery with a reason (D8), as a payment is removed: the reason is judged before anything is read; then one transaction locks the invoice first and reads the record after that lock. A record that is not the invoice''s is 404; one removed already is delivery_removed; while a letter of the invoice that carries its facts and is not withdrawn — sent, printed, or being sent — carries a fee or the compensation not waived, or interest beyond what was waived, and no other delivery on or before the due date would remain, the record is relied on — delivery_relied_on; a mistaken record is then corrected by waiving those charges claimed_in_error once the letter is sent and removing it after. A record dated after the due date is never relied on. The row is kept and counts for nothing. The response is the document.'
            operationId: postInvoicesByIdManualDeliveriesByDeliveryIdRemove
            parameters:
