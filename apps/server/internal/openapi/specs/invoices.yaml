                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: paymentId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesPaymentRemovalRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the invoice with the payment removed.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the reason is empty or over 200 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the payment is not that document's.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — payment_removed (the registration is already removed).
            summary: Remove a payment registration
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/{id}/send:
        post:
            description: 'Sends an issued document''s stored PDF by e-mail (D4), in this order: 503 mail_unavailable when the installation''s mail driver is not smtp, judged before anything is read; 404; 409 invoice_draft; 409 customer_anonymised when this module has anonymised the customer; the recipient — the override, else the customer''s current invoice e-mail, read from the directory outside any lock (409 no_invoice_email when there is none); the stored PDF, stored first when it never was and otherwise verified against its hash (503 storage_unavailable, 500 when the stored object is gone or altered); then one plain-text mail in the buyer''s language from the installation''s address under the seller snapshot''s name, Reply-To the current settings'' e-mail, the PDF attached under the download''s name. The send runs on a context the request''s cancellation does not reach, bounded at 30 seconds; its log row on an uncancellable context of its own, bounded at 5 seconds, and the response is rendered uncancellable too, bounded at 5 seconds of its own. A failed send is 502 mail_failed and records nothing; a sent one is logged once, and sending again is logged again. Rate limited to 60 per client per 10 minutes. The response is the document with its deliveries and sendDefaults.'
            operationId: postInvoicesByIdSend
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, sent, with the send logged in deliveries and the send warnings in sendDefaults.warnings.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — recipient is not a bare e-mail address.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft, customer_anonymised (this module has anonymised the customer) or no_invoice_email (no override and no invoice e-mail in the directory).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — a directory that fails; the stored object is gone, or its bytes no longer match the hash; the mail went and its log row could not be written, which the operator is told of; or a render that fails.
                "502":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Bad Gateway — mail_failed, the mail server did not take the mail; nothing is recorded.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — mail_unavailable, the installation cannot send mail; or storage_unavailable, the object store is not configured or could not be reached.
            summary: Send an issued document by e-mail
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/send-ehf:
        post:
            description: 'Queues an issued document''s EHF for the Peppol network (EHF and KID design D8), in this order: 503 ehf_unavailable when the installation cannot send as EHF — INVOICES_EHF_ENABLED off, the Peppol lookup disabled, no access-point credentials, or no seller Peppol id — judged before anything is read; 404; 409 invoice_draft; 409 customer_anonymised; 409 no_peppol_id when the buyer snapshot has no Peppol id, or one that is not <scheme>:<value>; 409 buyer_reference_missing when neither yourReference nor orderReference is set; 409 ehf_already_sent when a transmission is queued, submitted, delivered or unconfirmed; the stored PDF (503 storage_unavailable, 500 a stored object gone or altered), the UBL rendered from the document''s own rows with the PDF embedded and pre-checked (409 ehf_invalid with rules); the receiver re-checked on the Peppol network outside any lock (409 peppol_not_receivable with peppolRegistered and peppolCanReceive when it is not registered or does not accept this document type; 502 peppol_lookup_failed when the network could not answer); the UBL stored once by its hash (503 storage_unavailable) — or, after an unconfirmed transmission a person resolved as failed, the bytes that transmission carried; then, under the document''s lock, the anonymisation, the credentials and ehf_already_sent judged again and the transmission queued. The access point is not called here: a worker submits it. Rate limited to 60 per client per 10 minutes. The response is the document with its ehf state, without sendDefaults.'
            operationId: postInvoicesByIdSendEhf
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, its transmission queued in ehf.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft, customer_anonymised, no_peppol_id, buyer_reference_missing, ehf_already_sent, ehf_invalid (with rules) or peppol_not_receivable (with peppolRegistered and peppolCanReceive).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — the stored PDF or a reused UBL is gone or altered, the render or its invariants failed, or the database failed.
                "502":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Bad Gateway — peppol_lookup_failed, the Peppol network could not say whether the receiver accepts the document; nothing is queued.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — ehf_unavailable, the installation cannot send as EHF; or storage_unavailable, the object store is not configured or could not be reached.
            summary: Send an issued document as EHF
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/transmissions/{transmissionId}/cancel:
        post:
            description: 'Cancels a queued EHF transmission that was never attempted (EHF and KID design D9): queued, its crash marker unset, and not leased by a worker at this moment. Anything else is 409 transmission_not_cancellable — once a submission may have reached the provider, only the outcome decides. The response is the document.'
            operationId: postInvoicesByIdTransmissionsByTransmissionIdCancel
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: transmissionId
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, the transmission cancelled.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the transmission is not that document's.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmission_not_cancellable.
            summary: Cancel a queued EHF transmission
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/transmissions/{transmissionId}/resolve:
        post:
            description: 'A person''s verdict on an unconfirmed EHF transmission after checking with the provider (EHF and KID design D9): delivered closes it, failed allows a new send — which carries the same UBL, since those bytes may have reached the receiver. The outcome, who and the note are recorded. Only an unconfirmed transmission is resolved; anything else is 409 transmission_not_resolvable. The response is the document.'
            operationId: postInvoicesByIdTransmissionsByTransmissionIdResolve
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: transmissionId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesTransmissionResolution'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, the transmission resolved.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — outcome is not delivered or failed, or the note is empty or over 500 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the transmission is not that document's.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmission_not_resolvable.
            summary: Resolve an unconfirmed EHF transmission
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/transmissions/{transmissionId}/ubl:
        get:
            description: 'The UBL an EHF transmission carries (EHF and KID design D10), as stored when it was queued and verified against its SHA-256. A stored object that is gone or altered is a 500, never rendered again.'
            operationId: getInvoicesByIdTransmissionsByTransmissionIdUbl
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: transmissionId
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/xml:
                            schema:
                                format: binary
                                type: string
                    description: OK — the UBL, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the transmission is not that document's.
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — the stored UBL is gone, or its bytes no longer match the hash.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, the object store is not configured or could not be read.
            summary: Download an EHF transmission's UBL
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/bank-files:
        get:
            description: The imported bank files, newest first (D3), each with its lines counted by status — a file with pending lines has some not yet matched. page and pageSize are the codebase's paging, 25 by default, at most 100.
            operationId: getInvoicesBankFiles
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesBankFile'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the imported bank files
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
        post:
            description: 'Imports an OCR giro or camt.054 (.001.02 or .001.08) file of incoming payments (invoices payments and reminders design D3), all or nothing, in order: the one multipart part named file, at most 10 MiB; its format detected; the file parsed and checked against its own control totals, every booking day on or before today in Oslo and not before 2000, at most 5 000 transactions, every booked amount in NOK; every account it names the seller''s bank account or one an issued document printed (409 bank_account_unknown); the same bytes or the same file identity imported before (409 bank_file_duplicate, naming the earlier import); the bytes stored once in the object store under bank-files/<sha256>.<ocr|xml>, outside any transaction (503 storage_unavailable without one); then one transaction — the file''s accounts first, in account order, the first import of an account setting its format, a file of the other format refused (409 bank_import_format_mismatch); the file row; every line in one insert ordered by fingerprint, a line an earlier or overlapping file already brought kept as a duplicate row linked to it. Every line that is not a duplicate is left pending for matching.'
            operationId: postInvoicesBankFiles
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankImportResult'
                    description: Created — the file imported, and what became of its lines.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'file' — no part named file or two of them, an empty part, a part or a body past 10 MiB, not an OCR giro or camt.054 file, or a file its own rules refuse (the message names the record or the element). Nothing is stored. A body that is not multipart at all is a bare 400.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — bank_account_unknown (the detail names the account's last four digits), bank_file_duplicate (with bankFileId, uploadedAt and uploadedBy of the earlier import) or bank_import_format_mismatch (the detail names the account and its format). Nothing is written.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, before anything is written. A bank file is the documentation of the payments booked from it, kept like the PDFs.
            summary: Import a bank file
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-files/{id}:
        get:
            description: One imported bank file and every line it brought, duplicates included, in the order they were stored (D3).
            operationId: getInvoicesBankFilesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankFileDetail'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no bank file has that id.
            summary: Get an imported bank file
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-accounts:
        get:
            description: Every receiving account a bank file was imported for (D3), in account order, with its format, the previous format and cutover a change kept, its latest file and the latest booking day of its lines.
            operationId: getInvoicesBankAccounts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankAccountsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the bank import accounts
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-accounts/{account}/format:
        put:
            description: 'Changes the format an account''s bank files come in (D3): the account''s row locked; the same format answers the account unchanged; another keeps the old one as previousFormat with cutoverThrough, the latest booking day of the account''s own lines in the old format (absent when it has none), and sets the new one — matching then holds back a line of the new format booked on or before the cutover, which the old format may already have registered (D4). A change of bank is a new account, with its own row.'
            operationId: putInvoicesBankAccountsByAccountFormat
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankAccountFormatRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankAccount'
                    description: OK — the account as it now stands.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'format', neither ocr nor camt054; or a body that did not decode.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no bank file was ever imported for that account.
            summary: Change an account's bank file format
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/journal:
        get:
            description: The invoice journal (D11) — what proves complete registration (§ 5-1-3). from and to are issue dates, both required, from on or before to; page and pageSize are the list's.
            operationId: getInvoicesJournal
            parameters:
                - in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesJournalResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The invoice journal
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/export.csv:
        get:
            description: 'The accountant''s CSV export (payments and delivery design D5): the issued documents whose issue date is from-to — the journal''s own selection — one row per document and VAT row, in number order and in each document by category then rate, a credit note negative in every amount. UTF-8 with a byte order mark, semicolons, the decimal comma, YYYY-MM-DD, CRLF after every row, RFC 4180 quoting, and the formula guard on the text columns only. The header row is Number;Kind;Issue date;Delivery;Due;Customer number;Buyer;Buyer org no;Currency;SAF-T code;Rate;Base;VAT;Base NOK;VAT NOK;Credits number;KID;Project — KID an invoice''s KID (EHF and KID design D3), Project the document''s project reference (invoices work design D9), each empty where there is none. from and to are both required, from on or before to; a period of more than 5000 rows is refused, never cut short.'
            operationId: getInvoicesExportCsv
            parameters:
                - description: The first issue date to include.
                  in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The last issue date to include.
                  in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named invoices-<from>-<to>.csv (the period's two dates, YYYY-MM-DD), and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or more than 5000 rows, which asks for a narrower period.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export the issued documents as CSV
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/stats/summary:
        get:
            description: The dashboard's invoices card (payments and delivery design D7). from and to are instants, as every module's summary takes them; to defaults to now and from to 30 days before to, and from after to is a 400.
            operationId: getInvoicesStatsSummary
            parameters:
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesStatsSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoices dashboard summary
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
