components:
    schemas:
        InvoicesMetaCapabilities:
            description: What the caller may do in the Invoices app, answered by the server so no client re-derives a permission rule.
            properties:
                canCreate:
                    description: invoices:create — create, edit and delete drafts, and preview a draft.
                    type: boolean
                canIssue:
                    description: invoices:issue — issue a draft, and create a credit-note draft.
                    type: boolean
                canManage:
                    description: invoices:manage — the seller record, the series start and the VAT codes.
                    type: boolean
                canRegisterPayments:
                    description: invoices:payments — register a payment against an issued invoice, and remove a registration with a reason.
                    type: boolean
                canSend:
                    description: invoices:issue and mailAvailable — send an issued document to the customer by e-mail.
                    type: boolean
            required:
                - canCreate
                - canIssue
                - canManage
                - canRegisterPayments
                - canSend
            type: object
        InvoicesMetaResponse:
            description: What every Invoices page needs before it draws anything (invoices foundation design D2).
            properties:
                anythingIssued:
                    description: Whether any document has been issued — the counter row exists. Once true the series start is locked.
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/InvoicesMetaCapabilities'
                currency:
                    description: The one currency a document may carry in this phase, NOK.
                    type: string
                defaultPaymentTermsDays:
                    description: The seller's default payment terms, which a new draft takes when neither the request nor the customer's billing profile decides.
                    format: int32
                    type: integer
                mailAvailable:
                    description: Whether this installation's mail driver is smtp. Without it nothing can be sent (503 mail_unavailable), and canSend is false.
                    type: boolean
                missingSellerFields:
                    description: The seller fields issuing still needs, by their camelCase names (legalName, organisationNumber, addressLine1, postalCode, city, bankAccount). Empty when the seller is complete.
                    items:
                        type: string
                    type: array
                sellerComplete:
                    description: Whether the seller record is complete enough to issue. Issuing is refused with 409 seller_incomplete until it is.
                    type: boolean
                seriesStart:
                    description: The first number of the one series invoices and credit notes share.
                    format: int64
                    type: integer
                storageAvailable:
                    description: Whether this installation has an object store. Without one nothing can be issued (503 storage_unavailable), because an issued number whose PDF can never be stored is not allowed to exist.
                    type: boolean
                today:
                    description: Today in Europe/Oslo, the business day every date rule of this module is judged on.
                    format: date
                    type: string
                vatCodes:
                    description: The VAT codes a new line may take — active, with a rate period covering today — each with today's rate.
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeInForce'
                    type: array
            required:
                - currency
                - defaultPaymentTermsDays
                - sellerComplete
                - missingSellerFields
                - anythingIssued
                - seriesStart
                - storageAvailable
                - mailAvailable
                - today
                - vatCodes
                - capabilities
            type: object
        InvoicesVatCodeInForce:
            description: One VAT code as a new line may take it, with the rate in force today. A draft holds only the code; the rate a line carries is resolved at issue for the issue date (D3).
            properties:
                code:
                    type: string
                ehfCategory:
                    description: The UNCL5305 category — S, Z, E, AE, G, O or K.
                    type: string
                exemptionReason:
                    description: The text printed under the VAT summary for a category other than S. Absent for S.
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
            type: object
        InvoicesConflictProblem:
            description: 'ProblemDetails plus this module''s refusal code (invoices foundation design D2-D8). code names the rule that refused — series_locked, vat_code_in_use, rate_change_in_past, rate_period_not_latest, rate_period_last, rate_period_in_use, invoice_issued, invoice_draft, customer_merged, customer_archived, customer_blocked, customer_missing, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed, buyer_incomplete, vat_code_inactive, vat_code_not_valid, vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line, credit_exceeds_invoice, credit_note_not_creditable, invoice_fully_credited, credit_note_no_payments, invoice_settled, payment_exceeds_open, payment_removed, customer_anonymised, no_invoice_email (invoices payments and delivery design D2, D4), storage_unavailable and mail_unavailable, which a 503 carries in the same shape, and mail_failed, which a 502 carries. A revision conflict carries no code; its detail names both revisions.'
            properties:
                allowedIssueDates:
                    description: On issue_date_not_allowed, the dates this document may be issued with today, the earliest first. Absent otherwise.
                    items:
                        format: date
                        type: string
                    type: array
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                instance:
                    nullable: true
                    type: string
                linePosition:
                    description: On a refusal about one line (vat_code_inactive, vat_code_not_valid, credit_exceeds_line), the line's position, 1-based. Absent otherwise.
                    format: int32
                    type: integer
                mergedInto:
                    description: On customer_merged, the customer the draft's customer was merged into. Absent otherwise.
                    format: int32
                    type: integer
                openAmount:
                    description: On payment_exceeds_open, the invoice's open amount the payment exceeded (gross − credited − paid). Absent otherwise.
                    format: double
                    type: number
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        InvoicesSettingsRequest:
            description: 'PUT /settings'' body, a full replace (D2). Every text field is trimmed; an empty string is "not set". organisationNumber is nine digits with a valid mod-11 check digit; bankAccount eleven digits with a valid mod-11 check digit (spaces and dots are dropped); iban passes mod-97 and bic is 8 or 11 characters, both optional; country is ISO 3166-1 alpha-2; defaultPaymentTermsDays is 0-365; defaultCurrency is NOK and only NOK in this phase; seriesStart is 1 to 9007199254740991 (2^53 − 1) and cannot change once anything is issued (409 series_locked). revision is the one the caller read: a stale one is a 409 naming both.'
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                legalName:
                    type: string
                organisationNumber:
                    type: string
                postalCode:
                    type: string
                revision:
                    format: int32
                    type: integer
                seriesStart:
                    format: int64
                    maximum: 9007199254740991
                    type: integer
                vatRegistered:
                    type: boolean
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - postalCode
                - city
                - country
                - bankAccount
                - defaultPaymentTermsDays
                - defaultCurrency
                - seriesStart
                - revision
            type: object
        InvoicesSettingsResponse:
            description: The seller record and the series start (D2). A text field that is not set is the empty string. seriesLocked is true once anything is issued; from then on seriesStart cannot change, and every other field still can — issued documents keep their own seller snapshot.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                legalName:
                    type: string
                missingSellerFields:
                    description: What issuing still needs, as GET /meta names it.
                    items:
                        type: string
                    type: array
                organisationNumber:
                    type: string
                postalCode:
                    type: string
                revision:
                    format: int32
                    type: integer
                seriesLocked:
                    type: boolean
                seriesStart:
                    format: int64
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
                vatRegistered:
                    type: boolean
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - addressLine2
                - postalCode
                - city
                - country
                - bankAccount
                - iban
                - bic
                - email
                - defaultPaymentTermsDays
                - defaultCurrency
                - footerText
                - seriesStart
                - seriesLocked
                - missingSellerFields
                - revision
                - updatedAt
            type: object
        InvoicesVatCode:
            description: One VAT code with every rate period it has had (D3). inUse is true once any line, draft or issued, carries the code; from then on its category and SAF-T code cannot change (409 vat_code_in_use).
            properties:
                active:
                    type: boolean
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    description: Absent when the code has none (category S).
                    type: string
                id:
                    format: int32
                    type: integer
                inUse:
                    type: boolean
                name:
                    type: string
                rates:
                    description: Every period, the earliest first. The last is open-ended (validTo absent).
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeRate'
                    type: array
                revision:
                    format: int32
                    type: integer
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - active
                - inUse
                - revision
                - rates
            type: object
        InvoicesVatCodeCreateRequest:
            description: A code and its first, open period (D3). code is 1-10 characters and unique ignoring case; name 1-100; safTCode 1-5; ehfCategory S, Z, E, AE, G, O or K; exemptionReason up to 200 and required unless the category is S; ratePercent greater than 0 and at most 100 for S, exactly 0 for every other category, with at most two decimals.
            properties:
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    type: string
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                validFrom:
                    format: date
                    type: string
            required:
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeRate:
            description: One rate period of a VAT code, inclusive at both ends.
            properties:
                id:
                    format: int32
                    type: integer
                ratePercent:
                    format: double
                    type: number
                validFrom:
                    format: date
                    type: string
                validTo:
                    description: Absent for the open-ended period.
                    format: date
                    type: string
            required:
                - id
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeRateRequest:
            description: 'A rate change (D3): the open period closes the day before validFrom and a new open period starts on it. validFrom must be after the open period''s own start (400 on validFrom) and after the latest issue date of any issued document (409 rate_change_in_past). ratePercent follows the category''s rule.'
            properties:
                ratePercent:
                    format: double
                    type: number
                validFrom:
                    format: date
                    type: string
            required:
                - ratePercent
                - validFrom
            type: object
        InvoicesVatCodeUpdateRequest:
            description: A full replace of a code's own fields (D3). A code is never deleted; active false stops it being offered for new lines. A code in use keeps its ehfCategory and safTCode (409 vat_code_in_use); its code, name and reason stay editable. The rates change only through the rate operations.
            properties:
                active:
                    type: boolean
                code:
                    type: string
                ehfCategory:
                    type: string
                exemptionReason:
                    type: string
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                safTCode:
                    type: string
            required:
                - code
                - name
                - safTCode
                - ehfCategory
                - active
                - revision
            type: object
        InvoicesBuyer:
            description: The buyer snapshot (D4), written at issue from the customer's billing profile and printed from, never re-read. A credit note carries its original's.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                city:
                    type: string
                country:
                    type: string
                customerNumber:
                    format: int64
                    type: integer
                foreignId:
                    description: A foreign business's legal id prefixed with its country (SE556677889901), printed under "VAT/Reg. no.". Never a person's.
                    type: string
                gln:
                    type: string
                language:
                    description: The document's language, en or nb.
                    type: string
                name:
                    type: string
                organisationNumber:
                    description: A Norwegian business's organisation number.
                    type: string
                peppolId:
                    type: string
                postalCode:
                    type: string
                region:
                    type: string
                type:
                    description: business or person.
                    type: string
            required:
                - customerNumber
                - type
                - name
                - language
            type: object
        InvoicesCreditNoteRef:
            description: One credit note of an invoice, a draft (number absent) or issued.
            properties:
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
                status:
                    type: string
            required:
                - id
                - grossTotal
                - status
            type: object
        InvoicesCreditsRef:
            description: The issued invoice a credit note credits.
            properties:
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
            required:
                - id
                - number
                - issueDate
            type: object
        InvoicesDelivery:
            description: One e-mail that handed an issued document over (payments and delivery design D4), logged once the mail server took it. recipient is the address it went to — empty once the customer has been anonymised (D6) — and is present only for a caller with invoices:issue; a reader sees when each send happened, by whom and its subject, not the address. subject is as sent.
            properties:
                id:
                    format: int64
                    type: integer
                recipient:
                    description: The address the e-mail went to, empty once the customer has been anonymised (D6). Present only for a caller with invoices:issue; absent for every other reader.
                    type: string
                sentAt:
                    format: date-time
                    type: string
                sentByUserId:
                    format: uuid
                    type: string
                subject:
                    type: string
            required:
                - id
                - subject
                - sentAt
                - sentByUserId
            type: object
        InvoicesDeliveryAddress:
            description: The place of delivery (§ 5-1-1 nr. 4), when it is not the buyer's address. line1, city and country are required; country is ISO 3166-1 alpha-2.
            properties:
                city:
                    type: string
                country:
                    type: string
                line1:
                    type: string
                line2:
                    type: string
                postalCode:
                    type: string
            required:
                - line1
                - city
                - country
            type: object
        InvoicesInvoiceListItem:
            description: One document in the list. customerName is the buyer snapshot's name on an issued document and the customer's current name on a draft, absent when the directory no longer knows it.
            properties:
                creditsInvoiceId:
                    format: int64
                    type: integer
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                dueDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                number:
                    format: int64
                    type: integer
                openAmount:
                    description: On an issued invoice, gross less what its issued credit notes credit and what its live payments paid; negative when a credit note followed a payment.
                    format: double
                    type: number
                state:
                    description: 'The derived state (D3): draft, issued (an issued credit note), credited, paid, overdue, partially_paid or open.'
                    type: string
                status:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - grossTotal
            type: object
        InvoicesInvoiceRequest:
            description: 'A draft, created (POST) or replaced whole (PUT, with revision) (D4). customerId is the buyer. currency, when given, is NOK — "Only NOK in this phase". Delivery is deliveryDate alone, deliveryFrom with deliveryTo (from on or before to), or none — none only on a draft; the issue refuses it. references are at most 100 characters each, note and internalNote 1000. lines are at most 500. On create, an omitted yourReference is the billing profile''s buyerReference and an omitted paymentTermsDays the profile''s terms, else the settings'' default; on PUT an invoice''s paymentTermsDays is required and an omitted reference is cleared. On a credit-note draft only what D8 allows may change: lines may be removed, a quantity or a unit price lowered, and a description, the note and the internal note edited.'
            properties:
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                internalNote:
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLineRequest'
                    type: array
                note:
                    type: string
                orderReference:
                    type: string
                ourReference:
                    type: string
                paymentTermsDays:
                    format: int32
                    type: integer
                revision:
                    description: Required on PUT; the revision the caller read. A stale one is a 409 naming both.
                    format: int32
                    type: integer
                yourReference:
                    type: string
            required:
                - customerId
                - lines
            type: object
        InvoicesInvoiceResponse:
            description: 'One document (D4): every column in camelCase, its lines and its VAT summaries. On a draft the VAT summaries and totals are computed afresh — an invoice draft''s with the rates in force today, which the issue resolves again for the issue date; a credit-note draft''s at its original lines'' snapshot rates, with each line''s and the invoice''s remainder squared as its issue will — and allowedIssueDates lists the dates it may be issued with today. warnings are never refusals: customer_currency_differs, issued_late (never on a credit note, which keeps its original''s delivery), vat_code_not_valid (a line''s code has no rate period covering today; the issue would refuse it), credit_exceeds_invoice, credit_exceeds_line. An invoice carries creditedAmount (its issued credit notes'' gross), uncreditedAmount and creditNotes; a credit note carries credits. Every document carries state (D3); an issued invoice also carries paidAmount, openAmount, payments and — only when openAmount is below zero — refundDue, none of which a draft or a credit note carries. Every issued document carries deliveries (D4); sendDefaults is answered only by GET /invoices/{id} and the send, for a caller who may send — and in its place customerAnonymised when the customer is anonymised.'
            properties:
                allowedIssueDates:
                    items:
                        format: date
                        type: string
                    type: array
                buyer:
                    $ref: '#/components/schemas/InvoicesBuyer'
                createdAt:
                    format: date-time
                    type: string
                creditNotes:
                    items:
                        $ref: '#/components/schemas/InvoicesCreditNoteRef'
                    type: array
                creditedAmount:
                    format: double
                    type: number
                credits:
                    $ref: '#/components/schemas/InvoicesCreditsRef'
                currency:
                    type: string
                customerAnonymised:
                    description: 'true on an issued document whose customer this module has anonymised (D6), answered where sendDefaults would be — GET /invoices/{id} and the send, for a caller who may send, on an installation that can — so the app offers no send; absent otherwise, never false.'
                    type: boolean
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                deliveries:
                    description: On an issued document, every e-mail that handed it over, the first first (D4).
                    items:
                        $ref: '#/components/schemas/InvoicesDelivery'
                    type: array
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                exchangeRate:
                    format: double
                    type: number
                exchangeRateDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                internalNote:
                    type: string
                issueDate:
                    format: date
                    type: string
                issuedAt:
                    format: date-time
                    type: string
                issuedByUserId:
                    format: uuid
                    type: string
                kind:
                    description: invoice or credit_note.
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLine'
                    type: array
                netTotal:
                    format: double
                    type: number
                note:
                    type: string
                number:
                    format: int64
                    type: integer
                orderReference:
                    type: string
                openAmount:
                    description: On an issued invoice, grossTotal less creditedAmount less paidAmount. It may be negative — a credit note issued after a payment — and refundDue is then what it is short of zero.
                    format: double
                    type: number
                ourReference:
                    type: string
                paidAmount:
                    description: On an issued invoice, what its live payments add up to; a removed payment counts for nothing.
                    format: double
                    type: number
                paymentTermsDays:
                    format: int32
                    type: integer
                payments:
                    description: On an issued invoice, every payment registered against it, removed ones included with their removal, in the order the money arrived.
                    items:
                        $ref: '#/components/schemas/InvoicesPayment'
                    type: array
                pdfStored:
                    description: On an issued document, whether its PDF is stored. False only when storing it after the issue failed; the next download stores it.
                    type: boolean
                refundDue:
                    description: On an issued invoice whose openAmount is below zero, the amount owed back (−openAmount); absent otherwise. The figure only — refunds are not a flow in this phase.
                    format: double
                    type: number
                revision:
                    format: int32
                    type: integer
                seller:
                    $ref: '#/components/schemas/InvoicesSeller'
                sendDefaults:
                    $ref: '#/components/schemas/InvoicesSendDefaults'
                state:
                    description: 'The derived state, judged against today in Oslo (D3), the first match winning: draft (a draft); issued (an issued credit note); credited (an issued invoice its issued credit notes cover, credited > 0 and credited ≥ gross); paid (nothing left open); overdue (past its due date); partially_paid (something paid); open (otherwise).'
                    type: string
                status:
                    description: draft or issued.
                    type: string
                uncreditedAmount:
                    format: double
                    type: number
                updatedAt:
                    format: date-time
                    type: string
                vatSummaries:
                    items:
                        $ref: '#/components/schemas/InvoicesVatSummary'
                    type: array
                vatTotal:
                    format: double
                    type: number
                vatTotalNok:
                    format: double
                    type: number
                warnings:
                    items:
                        type: string
                    type: array
                yourReference:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - exchangeRate
                - yourReference
                - ourReference
                - orderReference
                - note
                - internalNote
                - netTotal
                - vatTotal
                - grossTotal
                - vatTotalNok
                - lines
                - vatSummaries
                - warnings
                - createdAt
                - updatedAt
                - revision
            type: object
        InvoicesLine:
            description: One line (D4, D5). lineGross is quantity × unitPrice rounded to øre, lineAllowance the discount of it rounded, lineNet their difference. The VAT fields are the issue snapshot, absent on a draft.
            properties:
                creditsLineId:
                    description: On a credit note's line, the original line it credits.
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                exemptionReason:
                    type: string
                id:
                    format: int64
                    type: integer
                lineAllowance:
                    format: double
                    type: number
                lineGross:
                    format: double
                    type: number
                lineNet:
                    format: double
                    type: number
                position:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                safTCode:
                    type: string
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCategory:
                    type: string
                vatCodeId:
                    format: int32
                    type: integer
                vatRatePercent:
                    format: double
                    type: number
            required:
                - id
                - position
                - description
                - quantity
                - unit
                - unitPrice
                - discountPercent
                - vatCodeId
                - lineGross
                - lineAllowance
                - lineNet
            type: object
        InvoicesLineRequest:
            description: One line of a draft. description is 1-500 characters; quantity greater than 0 with at most 3 decimals; unitPrice 0 or more with at most 4; discountPercent 0-100 with at most 2 (0 when omitted); unit at most 20. vatCodeId is an active code. creditsLineId is a credit-note draft's own and names the original line the line credits.
            properties:
                creditsLineId:
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                quantity:
                    format: double
                    type: number
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCodeId:
                    format: int32
                    type: integer
            required:
                - description
                - quantity
                - unitPrice
                - vatCodeId
            type: object
        InvoicesPayment:
            description: One payment registered against an issued invoice (D2). A removed one keeps its row and carries removedAt, removedByUserId and removalReason; it counts for nothing.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
                registeredByUserId:
                    format: uuid
                    type: string
                removalReason:
                    type: string
                removedAt:
                    format: date-time
                    type: string
                removedByUserId:
                    format: uuid
                    type: string
            required:
                - id
                - paidOn
                - amount
                - currency
                - reference
                - note
                - registeredAt
                - registeredByUserId
            type: object
        InvoicesPaymentRemovalRequest:
            description: 'POST /invoices/{id}/payments/{paymentId}/remove''s body (D2). reason is why the registration is removed: 1-200 characters once trimmed. A removal is never undone; a mistake is registered again.'
            properties:
                reason:
                    type: string
            required:
                - reason
            type: object
        InvoicesPaymentRequest:
            description: 'POST /invoices/{id}/payments'' body (D2). paidOn is the day the money arrived: on or after the invoice''s issue date and not after today (Oslo). amount is greater than 0 with at most 2 decimals, at most 99999999999.99, in the invoice''s currency, and at most its open amount (409 payment_exceeds_open). reference (the bank''s or the payer''s) holds at most 100 characters and note at most 500, both trimmed; absent is empty.'
            properties:
                amount:
                    format: double
                    type: number
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
            required:
                - paidOn
                - amount
            type: object
        InvoicesSendDefaults:
            description: 'What the Send dialog opens with (D4), on an issued document''s GET and on the send''s own response only, and only for a caller who may send (invoices:issue on an installation whose mail driver is smtp); never for a customer this module has anonymised, whom a send is refused. recipient is the customer''s current invoice e-mail, absent when it has none; preference is the billing profile''s invoice delivery (email, ehf, efaktura or paper), absent when unset. warnings are the send''s, never refusals: delivery_preference_ehf (the customer expects EHF; an e-mailed PDF does not meet the e-invoicing duty), delivery_preference_other (the customer prefers efaktura or paper), buyer_norwegian_business (the buyer snapshot has a Norwegian organisation number and today, the Oslo business day of the server''s clock, is before 2027-01-01: from that day a Norwegian business must receive an e-invoice), buyer_norwegian_business_required (the same buyer from 2027-01-01, when an e-mailed PDF no longer meets the duty). The server judges the date, never the browser. Absent when the directory could not be read.'
            properties:
                preference:
                    type: string
                recipient:
                    type: string
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - warnings
            type: object
        InvoicesSendRequest:
            description: 'POST /invoices/{id}/send''s body (D4). recipient overrides the customer''s current invoice e-mail: a bare address that parses to itself, at most 254 characters once trimmed (so "Name <a@b>" is refused). Absent, the invoice e-mail is used.'
            properties:
                recipient:
                    type: string
            type: object
        InvoicesSeller:
            description: The seller snapshot (D4), copied from the settings at issue.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                legalName:
                    type: string
                organisationNumber:
                    type: string
                postalCode:
                    type: string
                vatRegistered:
                    type: boolean
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - addressLine2
                - postalCode
                - city
                - country
                - bankAccount
                - iban
                - bic
                - email
                - footerText
            type: object
        InvoicesVatSummary:
            description: VAT per (category, rate) of a document (D5), computed on the sum of the lines' nets, a row for each 0 % category too.
            properties:
                exemptionReason:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                taxableAmount:
                    format: double
                    type: number
                vatAmount:
                    format: double
                    type: number
                vatAmountNok:
                    format: double
                    type: number
                vatCategory:
                    type: string
            required:
                - vatCategory
                - ratePercent
                - safTCode
                - taxableAmount
                - vatAmount
                - vatAmountNok
            type: object
        PaginatedResponseOfInvoicesInvoiceListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesInvoiceListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        InvoicesIssueRequest:
            description: 'POST /invoices/{id}/issue''s body (D6). issueDate is today (Oslo) when omitted; the only other date allowed is the last day of the previous month, while today''s calendar day is 15 or less and the delivery ended on or before it — and never a date before the latest issue date of any issued document.'
            properties:
                issueDate:
                    format: date
                    type: string
            type: object
        InvoicesJournalCode:
            description: One (SAF-T code, category, rate) of the journal's VAT, credit notes signed negative.
            properties:
                category:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                taxableAmount:
                    format: double
                    type: number
                vatAmount:
                    format: double
                    type: number
            required:
                - safTCode
                - category
                - ratePercent
                - taxableAmount
                - vatAmount
            type: object
        InvoicesJournalResponse:
            description: 'The invoice journal (D11) over issue dates from-to: the issued documents in number order, a page at a time; the totals over the whole range, per SAF-T code, category and rate, credit notes signed negative; and the gap check — the numbers from the one after the issued document before the range''s first (never below the series start) to the range''s last that no issued document holds, at most 1000 listed.'
            properties:
                checkedFrom:
                    description: The first number the gap check covered — one past the issued document before the range's first, or the series start; absent when the range holds no document.
                    format: int64
                    type: integer
                checkedTo:
                    description: The last number the gap check covered, the range's last; absent when the range holds no document.
                    format: int64
                    type: integer
                counterLast:
                    description: The counter's last allocated number; absent when nothing was ever issued. When it is not highestIssued, a number was allocated without a document.
                    format: int64
                    type: integer
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalRow'
                    type: array
                gaps:
                    items:
                        format: int64
                        type: integer
                    type: array
                gapsTruncated:
                    type: boolean
                highestIssued:
                    description: The highest number any issued document holds, whatever its date; absent when nothing is issued.
                    format: int64
                    type: integer
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
                seriesStart:
                    format: int64
                    type: integer
                totals:
                    $ref: '#/components/schemas/InvoicesJournalTotals'
            required:
                - data
                - pagination
                - totals
                - gaps
                - gapsTruncated
                - seriesStart
            type: object
        InvoicesJournalRow:
            description: One issued document in the journal, credit notes signed negative in every amount.
            properties:
                buyerCustomerNumber:
                    format: int64
                    type: integer
                buyerName:
                    type: string
                buyerOrganisationNumber:
                    type: string
                creditsNumber:
                    description: On a credit note, the number of the invoice it credits.
                    format: int64
                    type: integer
                currency:
                    type: string
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                netTotal:
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
                vatSummaries:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalCode'
                    type: array
                vatTotal:
                    format: double
                    type: number
            required:
                - id
                - number
                - kind
                - issueDate
                - currency
                - netTotal
                - vatTotal
                - grossTotal
                - vatSummaries
            type: object
        InvoicesJournalTotals:
            description: The journal's totals over the whole range, not the page, credit notes signed negative.
            properties:
                byCode:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalCode'
                    type: array
                grossTotal:
                    format: double
                    type: number
                netTotal:
                    format: double
                    type: number
                vatTotal:
                    format: double
                    type: number
            required:
                - byCode
                - netTotal
                - vatTotal
                - grossTotal
            type: object
        InvoicesStatsSummaryResponse:
            description: 'The dashboard''s invoices card over one period, in the envelope every module''s /stats/summary shares (payments and delivery design D7). outstanding and overdue are now — the issued invoices with something open, at their open amounts, credit notes excluded, and of those the ones past their due date on today''s Oslo date. issued, credited and paid are in the period: the invoices and the credit notes whose issue date, and the live payments whose paid date, falls on an Oslo day from the day of from up to and including the day of the last instant before to. issuedGrossTotalDelta is issuedGrossTotal less the previous period''s, the period of the same length just before. All NOK.'
            properties:
                creditedCount:
                    format: int32
                    type: integer
                creditedGrossTotal:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                issuedCount:
                    format: int32
                    type: integer
                issuedGrossTotal:
                    format: double
                    type: number
                issuedGrossTotalDelta:
                    format: double
                    type: number
                outstandingAmount:
                    format: double
                    type: number
                outstandingCount:
                    format: int32
                    type: integer
                overdueAmount:
                    format: double
                    type: number
                overdueCount:
                    format: int32
                    type: integer
                paidAmount:
                    format: double
                    type: number
                paidCount:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - outstandingAmount
                - outstandingCount
                - overdueAmount
                - overdueCount
                - issuedCount
                - issuedGrossTotal
                - issuedGrossTotalDelta
                - creditedCount
                - creditedGrossTotal
                - paidAmount
                - paidCount
            type: object
info:
    title: Vantigo Invoices API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/invoices/meta:
        get:
            description: What every Invoices page needs in one read — the currency, the default payment terms, whether the seller is complete and what it lacks, whether anything is issued and the series start, whether an object store exists, today in Oslo, the VAT codes in force today and the caller's capabilities.
            operationId: getInvoicesMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesMetaResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Invoices metadata
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/settings:
        get:
            description: The seller record and the series start. Every invoices:access holder may read them — they are what every document prints.
            operationId: getInvoicesSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces the seller record and the series start (D2). It takes the settings row FOR UPDATE, so it waits behind an issue in flight; the series start is refused once the counter row exists (409 series_locked). Every other field stays editable after the first issue — issued documents keep their seller snapshot.
            operationId: putInvoicesSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — series_locked, or a stale revision (no code; the detail names both revisions).
            summary: Change the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes:
        get:
            description: Every VAT code, inactive ones included, with every rate period it has had (D3).
            operationId: getInvoicesVatCodes
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/InvoicesVatCode'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the VAT codes
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Creates a VAT code with its first, open rate period (D3).
            operationId: postInvoicesVatCodes
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeCreateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, or the code already exists (on code).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Create a VAT code
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}:
        put:
            description: Replaces a VAT code's own fields (D3). A code in use keeps its category and SAF-T code.
            operationId: putInvoicesVatCodesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeUpdateRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass, or the code already exists (on code).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no VAT code has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — vat_code_in_use, or a stale revision.
            summary: Change a VAT code
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}/rates:
        post:
            description: The rate-change rule (D3). The open period closes the day before validFrom and a new open period starts on it. It waits behind any issue in flight, so the latest issue date it reads is final.
            operationId: postInvoicesVatCodesByIdRates
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesVatCodeRateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: Created — the code with its periods.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on ratePercent, or on validFrom when it is not after the open period's start.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no VAT code has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — rate_change_in_past, when validFrom is on or before the latest issue date of any issued document.
            summary: Change a VAT code's rate from a date
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/vat-codes/{id}/rates/{rateId}:
        delete:
            description: Removes a mistaken future period and reopens the previous one (D3). Only the latest period may go, never the only one, and only while no issued document is dated on or after its start.
            operationId: deleteInvoicesVatCodesByIdRatesByRateId
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: rateId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesVatCode'
                    description: OK — the code with the periods it has left.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such code, or no such period on it.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — rate_period_not_latest, rate_period_last or rate_period_in_use.
            summary: Remove a VAT code's latest rate period
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices:
        get:
            description: 'Invoices and credit notes, drafts first and then by number descending (D4). status is draft or issued, kind invoice or credit_note; state is one of open, partially_paid, overdue, paid or credited (D3), which only an issued invoice matches; from and to are issue dates, inclusive; search matches the number exactly when it is digits, or the buyer''s name ignoring case — a draft has no buyer snapshot, so it is found by customerId, not search. page and pageSize are the codebase''s paging: 25 by default, at most 100.'
            operationId: getInvoices
            parameters:
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: kind
                  schema:
                    type: string
                - description: 'One of open, partially_paid, overdue, paid or credited, judged against today in Oslo; only an issued invoice can match it.'
                  in: query
                  name: state
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesInvoiceListItem'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, an unknown status, kind or state, or from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List invoices and credit notes
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Creates an invoice draft (D4). The buyer's billing profile is read before anything is written, for the prefills and the customer gates.
            operationId: postInvoices
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — customer_merged (with mergedInto), customer_archived, customer_blocked or customer_missing.
            summary: Create an invoice draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}:
        delete:
            description: Deletes a draft, its lines with it. An issued document is never deleted (409 invoice_issued).
            operationId: deleteInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued.
            summary: Delete a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
        get:
            description: One document with its lines, VAT summaries, warnings and credit links.
            operationId: getInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
            summary: Get an invoice or a credit note
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces a draft whole, with revision (D4). Only a draft is edited (409 invoice_issued otherwise). A credit-note draft changes only what D8 allows — lines removed, a quantity or a unit price lowered, a description, the note and the internal note — and anything else — another customer, currency, delivery, place of delivery or reference, payment terms, a line's VAT code or unit changed, a quantity or unit price raised, a discount lowered, a line added or one credited twice — is a 400 on the field; its revision is checked first, so a stale copy is the revision 409.
            operationId: putInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued, a customer gate, or a stale revision.
            summary: Replace a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}/issue:
        post:
            description: 'Issues a draft — an invoice or a credit note — into the next number of the one series (D6). An invoice''s billing profile is read first (a credit note reads no directory); then one transaction locks the document, shares the settings row, allocates the number, and only then checks every rule, so any refusal rolls the number back with it. The response is the issued document with its warnings (issued_late). The PDF is stored after the commit; pdfStored false means storing it failed and the next download stores it.'
            operationId: postInvoicesByIdIssue
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesIssueRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the issued document.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — the body did not decode (none at all, or an issueDate that is not a calendar date).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — invoice_issued, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed (with allowedIssueDates), customer_merged, customer_archived, customer_blocked, customer_missing, buyer_incomplete, vat_code_inactive and vat_code_not_valid (with linePosition), vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line (with linePosition) or credit_exceeds_invoice.'
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, before any number is allocated. An issued number whose PDF can never be stored is not allowed to exist.
            summary: Issue a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/pdf:
        get:
            description: 'An issued document''s PDF (D7), always the stored object: rendered and stored once when it has no hash yet, then streamed; otherwise read whole and verified against its SHA-256. It is never re-rendered once stored. Named faktura-<number>.pdf or kreditnota-<number>.pdf, invoice-<number>.pdf or credit-note-<number>.pdf in English.'
            operationId: getInvoicesByIdPdf
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                    description: OK — the PDF, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft; a draft is previewed, not downloaded.
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — the stored object is gone, or its bytes no longer match the hash. It is never papered over by rendering again.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, the object store is not configured or could not be read.
            summary: Download an issued document's PDF
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/{id}/preview.pdf:
        get:
            description: 'A draft rendered on demand (D4), never stored: the watermark "UTKAST — ikke et salgsdokument", no number, today as the would-be issue date, the current settings, the customer''s current billing profile for an invoice draft and the copied snapshot for a credit-note draft.'
            operationId: getInvoicesByIdPreviewPdf
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                    description: OK — the PDF, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued; an issued document is downloaded, not previewed.
            summary: Preview a draft as PDF
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}/credit:
        post:
            description: 'Creates a draft credit note for an issued invoice (D8, § 5-2-7): the customer, currency and rate, the delivery, the references and the buyer snapshot are copied from the original, and every line with its VAT code, pointing at the line it credits. It reads no directory. Several credit-note drafts may exist at once; the caps are decided at issue.'
            operationId: postInvoicesByIdCredit
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: Created — the credit-note draft.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft (the original is not issued), credit_note_not_creditable (a credit note is never credited) or invoice_fully_credited.
            summary: Create a credit-note draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/payments:
        post:
            description: 'Registers money received against an issued invoice (D2). It reads no directory: the customer may be disabled, archived, merged or anonymised since — the money arrived regardless. The fields are judged before anything is locked; then one transaction locks the invoice, reads what its issued credit notes credit and what its live payments paid under that lock, and refuses a payment once nothing is open (invoice_settled) or one over the open amount (payment_exceeds_open, with openAmount). The response is the document with its new state, open amount and payments.'
            operationId: postInvoicesByIdPayments
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesPaymentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the invoice with the payment registered.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft, credit_note_no_payments (a credit note, draft or issued, takes no payment), invoice_settled (nothing is open) or payment_exceeds_open (with openAmount).
            summary: Register a payment
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/{id}/payments/{paymentId}/remove:
        post:
            description: 'Removes a payment registration with a reason (D2): the row is kept, struck through on the document, and counts for nothing. The reason is judged before anything is read; then one transaction locks the invoice first and reads the payment after that lock, so two removals of one payment give one 200 and one payment_removed. A removal is never undone; the payment is registered again. The response is the document.'
            operationId: postInvoicesByIdPaymentsByPaymentIdRemove
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: paymentId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesPaymentRemovalRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the invoice with the payment removed.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — the reason is empty or over 200 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the payment is not that document's.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — payment_removed (the registration is already removed).
            summary: Remove a payment registration
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/{id}/send:
        post:
            description: 'Sends an issued document''s stored PDF by e-mail (D4), in this order: 503 mail_unavailable when the installation''s mail driver is not smtp, judged before anything is read; 404; 409 invoice_draft; 409 customer_anonymised when this module has anonymised the customer; the recipient — the override, else the customer''s current invoice e-mail, read from the directory outside any lock (409 no_invoice_email when there is none); the stored PDF, stored first when it never was and otherwise verified against its hash (503 storage_unavailable, 500 when the stored object is gone or altered); then one plain-text mail in the buyer''s language from the installation''s address under the seller snapshot''s name, Reply-To the current settings'' e-mail, the PDF attached under the download''s name. The send runs on a context the request''s cancellation does not reach, bounded at 30 seconds; its log row on an uncancellable context of its own, bounded at 5 seconds, and the response is rendered uncancellable too, bounded at 5 seconds of its own. A failed send is 502 mail_failed and records nothing; a sent one is logged once, and sending again is logged again. Rate limited to 60 per client per 10 minutes. The response is the document with its deliveries and sendDefaults.'
            operationId: postInvoicesByIdSend
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, sent, with the send logged in deliveries and the send warnings in sendDefaults.warnings.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — recipient is not a bare e-mail address.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_draft, customer_anonymised (this module has anonymised the customer) or no_invoice_email (no override and no invoice e-mail in the directory).
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Too Many Requests
                    headers:
                        Retry-After:
                            schema:
                                type: string
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — a directory that fails; the stored object is gone, or its bytes no longer match the hash; the mail went and its log row could not be written, which the operator is told of; or a render that fails.
                "502":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Bad Gateway — mail_failed, the mail server did not take the mail; nothing is recorded.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — mail_unavailable, the installation cannot send mail; or storage_unavailable, the object store is not configured or could not be reached.
            summary: Send an issued document by e-mail
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/journal:
        get:
            description: The invoice journal (D11) — what proves complete registration (§ 5-1-3). from and to are issue dates, both required, from on or before to; page and pageSize are the list's.
            operationId: getInvoicesJournal
            parameters:
                - in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesJournalResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The invoice journal
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/export.csv:
        get:
            description: 'The accountant''s CSV export (payments and delivery design D5): the issued documents whose issue date is from-to — the journal''s own selection — one row per document and VAT row, in number order and in each document by category then rate, a credit note negative in every amount. UTF-8 with a byte order mark, semicolons, the decimal comma, YYYY-MM-DD, CRLF after every row, RFC 4180 quoting, and the formula guard on the text columns only. The header row is Number;Kind;Issue date;Delivery;Due;Customer number;Buyer;Buyer org no;Currency;SAF-T code;Rate;Base;VAT;Base NOK;VAT NOK;Credits number. from and to are both required, from on or before to; a period of more than 5000 rows is refused, never cut short.'
            operationId: getInvoicesExportCsv
            parameters:
                - description: The first issue date to include.
                  in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The last issue date to include.
                  in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named invoices-<from>-<to>.csv (the period's two dates, YYYY-MM-DD), and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or more than 5000 rows, which asks for a narrower period.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export the issued documents as CSV
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/stats/summary:
        get:
            description: The dashboard's invoices card (payments and delivery design D7). from and to are instants, as every module's summary takes them; to defaults to now and from to 30 days before to, and from after to is a 400.
            operationId: getInvoicesStatsSummary
            parameters:
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesStatsSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoices dashboard summary
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
servers:
    - url: /
