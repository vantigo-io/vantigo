    /api/v1/invoices:
        get:
            description: 'Invoices and credit notes, drafts first and then by number descending (D4). status is draft or issued, kind invoice or credit_note; projectId the project a document''s work belongs to (invoices work design D9); state is one of open, partially_paid, overdue, paid or credited (D3), which only an issued invoice matches; from and to are issue dates, inclusive; search matches the number exactly when it is digits, or the buyer''s name ignoring case — a draft has no buyer snapshot, so it is found by customerId, not search. page and pageSize are the codebase''s paging: 25 by default, at most 100.'
            operationId: getInvoices
            parameters:
                - in: query
                  name: status
                  schema:
                    type: string
                - in: query
                  name: kind
                  schema:
                    type: string
                - description: 'One of open, partially_paid, overdue, paid or credited, judged against today in Oslo; only an issued invoice can match it.'
                  in: query
                  name: state
                  schema:
                    type: string
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - description: The documents whose work belongs to this project (invoices work design D9) — the derived project, so a document whose work spans two projects matches neither.
                  in: query
                  name: projectId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: search
                  schema:
                    type: string
                - in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesInvoiceListItem'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, an unknown status, kind or state, or from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List invoices and credit notes
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Creates an invoice draft (D4). The buyer's billing profile is read before anything is written, for the prefills and the customer gates. A line naming sources, or refreshSources, is a 400 — work is added to a draft through the uninvoiced view (invoices work design D2).
            operationId: postInvoices
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — customer_merged (with mergedInto), customer_archived, customer_blocked or customer_missing; deduction_duplicated (with linePosition), a second deduction line for one deducted invoice and VAT code (invoices work design D7).
            summary: Create an invoice draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/work:
        get:
            description: 'The uninvoiced view (invoices work design D3): exactly one of customerId and projectId, else a 400. For a customer, every project it is billed for (ProjectDirectory.ProjectsForCustomer); for a project, that one and its customer. Then the work of those projects through the billable reads — time''s approved, billable, priced hours, expenses'' lines ready to invoice and projects'' ready milestones — dated on or before until when given, on the pool. Work a live draft holds or an issued invoice invoiced is listed and not selectable, with heldBy, and counts in no total; so are a fixed-price project''s hours (shown as information), a non-billable project''s work and work in another currency than NOK. 409 work_unavailable when no billable read is composed, projects_unavailable with the projects module switched off; 404 for an unknown project.'
            operationId: getInvoicesWork
            parameters:
                - in: query
                  name: customerId
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: projectId
                  schema:
                    format: int32
                    type: integer
                - description: The latest work date to list, inclusive; absent lists every date.
                  in: query
                  name: until
                  schema:
                    format: date
                    type: string
            responses:
