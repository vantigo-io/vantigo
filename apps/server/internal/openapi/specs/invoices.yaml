                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                netTotal:
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
