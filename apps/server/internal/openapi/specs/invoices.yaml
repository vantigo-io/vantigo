                    type: boolean
            required:
                - kind
                - id
                - invoiceId
                - amount
                - removed
            type: object
        InvoicesBankTransactionApplyRequest:
            description: POST /invoices/bank-transactions/{id}/apply's body (D5) — 1 to 20 allocations, each invoice once, and an optional note of at most 500 characters kept on the line and its event.
            properties:
                allocations:
                    items:
                        $ref: '#/components/schemas/InvoicesAllocation'
                    type: array
                note:
                    type: string
            required:
                - allocations
            type: object
        InvoicesBankTransactionDismissRequest:
            description: POST /invoices/bank-transactions/{id}/dismiss's body (D5) — why the line is not a customer payment, or what was done about it outside Vantigo, 1 to 500 characters.
            properties:
                note:
                    type: string
            required:
                - note
            type: object
        InvoicesBankTransactionEvent:
            description: 'What happened to a bank line (D5): event matched, queued, applied, dismissed, reversal_handled, reopened, duplicate_confirmed, treated_as_distinct or reversed (a reversal took back a payment of this line; the note names the reversal); the reason the line had or was given (absent on a match); the note given with it; who and when. Events are never changed; they keep a resolution a reopen cleared from the line.'
            properties:
                at:
                    format: date-time
                    type: string
                by:
                    format: uuid
                    type: string
                event:
                    enum:
                        - matched
                        - queued
                        - applied
                        - dismissed
                        - reversal_handled
                        - reopened
                        - duplicate_confirmed
                        - treated_as_distinct
                        - reversed
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                reason:
                    $ref: '#/components/schemas/InvoicesBankTransactionReason'
            required:
                - id
                - event
                - note
                - by
                - at
            type: object
        InvoicesBankTransactionFile:
            description: The bank file a line came in — its id, format (ocr or camt054) and when it was uploaded.
            properties:
                format:
                    type: string
                id:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
            required:
                - id
                - format
                - uploadedAt
            type: object
        InvoicesBankTransactionNoteRequest:
            description: POST /invoices/bank-transactions/{id}/confirm-duplicate's body (D5) — an optional note of at most 500 characters.
            properties:
                note:
                    type: string
            type: object
        InvoicesBankTransactionReason:
            description: 'Why a line was queued (D4, D5): kid_invalid, kid_unknown, invoice_credited, invoice_settled, exceeds_open, no_kid, negative_amount, reversal, vipps_payout, paid_before_issue, account_mismatch, possible_duplicate or payment_removed (a matched line whose payments were all removed, reopened).'
            enum:
                - kid_invalid
                - kid_unknown
                - invoice_credited
                - invoice_settled
                - exceeds_open
                - no_kid
                - negative_amount
                - reversal
                - vipps_payout
                - paid_before_issue
                - account_mismatch
                - possible_duplicate
                - payment_removed
            type: string
        InvoicesBankTransactionReversalPayment:
            description: A payment a reversal takes back — the invoice and its payment's id.
            properties:
                invoiceId:
                    format: int64
                    type: integer
                paymentId:
                    format: int64
                    type: integer
            required:
                - invoiceId
                - paymentId
            type: object
        InvoicesBankTransactionReversalRequest:
            description: 'POST /invoices/bank-transactions/{id}/handle-reversal''s body (D5): removePayments, the payments the reversal takes back (at most 20, each once), each removed with the reason "Reversed by the bank: line {lineRef}"; or noPayment true and a note saying why none is removed. The note, at most 500 characters, is kept on the line and its event either way.'
            properties:
                noPayment:
                    type: boolean
                note:
                    type: string
                removePayments:
                    items:
                        $ref: '#/components/schemas/InvoicesBankTransactionReversalPayment'
                    type: array
            type: object
        InvoicesBankTransactionSuggestion:
            description: 'An issued invoice a queued line may pay (D5), read when the line is read, never registered by itself: why is number_in_text (the invoice''s number is a whole word of the line''s text), amount_equals_open (its open amount equals the line''s amount) or debtor_account (its customer''s earlier payments came from the line''s debtor account, and it is open). One entry per invoice, under the first reason in that order.'
            properties:
                buyerName:
                    type: string
                customerId:
                    format: int32
                    type: integer
                invoiceId:
                    format: int64
                    type: integer
                number:
                    format: int64
                    type: integer
                openAmount:
                    format: double
                    type: number
                why:
                    enum:
                        - number_in_text
                        - amount_equals_open
                        - debtor_account
                    type: string
            required:
                - invoiceId
                - number
                - customerId
                - buyerName
                - openAmount
                - why
            type: object
        InvoicesBankTransactionTwin:
            description: 'The line a possible duplicate may repeat (D5): the line it was kept as a duplicate of, or else the earliest matched or resolved line of another file with the same account, booking day, amount and KID, one with a live payment first — its id, file, lineRef, booking day, amount, KID, status, its payments and charge payments, and reversed, whether a reversal took back a payment of it (why its payment is gone).'
            properties:
                amount:
                    format: double
                    type: number
                applied:
                    items:
                        $ref: '#/components/schemas/InvoicesBankTransactionApplied'
                    type: array
                bankFileId:
                    format: int64
                    type: integer
                bookedOn:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                kid:
                    type: string
                lineRef:
                    type: string
                reversed:
                    type: boolean
                status:
                    type: string
            required:
                - id
                - bankFileId
                - lineRef
                - bookedOn
                - amount
                - status
                - applied
                - reversed
            type: object
        PaginatedResponseOfInvoicesBankFile:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesBankFile'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfInvoicesBankTransaction:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesBankTransaction'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        InvoicesBuyer:
            description: The buyer snapshot (D4), written at issue from the customer's billing profile and printed from, never re-read. A credit note carries its original's.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                city:
                    type: string
                country:
                    type: string
                customerNumber:
                    format: int64
                    type: integer
                foreignId:
                    description: A foreign business's legal id prefixed with its country (SE556677889901), printed under "VAT/Reg. no.". Never a person's.
                    type: string
                gln:
                    type: string
                language:
                    description: The document's language, en or nb.
                    type: string
                name:
                    type: string
                organisationNumber:
                    description: A Norwegian business's organisation number.
                    type: string
                peppolId:
                    type: string
                postalCode:
                    type: string
                region:
                    type: string
                type:
                    description: business or person.
                    type: string
            required:
                - customerNumber
                - type
                - name
                - language
            type: object
        InvoicesCreditNoteRef:
            description: One credit note of an invoice, a draft (number absent) or issued.
            properties:
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
                status:
                    type: string
            required:
                - id
                - grossTotal
                - status
            type: object
        InvoicesCreditsRef:
            description: The issued invoice a credit note credits.
            properties:
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
            required:
                - id
                - number
                - issueDate
            type: object
        InvoicesDeductible:
            description: 'What one issued invoice of a draft''s customer — an a-konto — has left to deduct at one VAT code (invoices work design D7): its lines'' net at the code, less what its issued credit notes credited on those lines, less what issued settlements'' deduction lines took and their issued credit notes did not give back. category and ratePercent are the a-konto line''s VAT snapshot, which a deduction at the code is taxed at; left is the most a deduction line at the code may take as its unitPrice.'
            properties:
                category:
                    type: string
                invoiceId:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                left:
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
                ratePercent:
                    format: double
                    type: number
                vatCodeId:
                    format: int32
                    type: integer
            required:
                - invoiceId
                - number
                - issueDate
                - vatCodeId
                - category
                - ratePercent
                - left
            type: object
        InvoicesDelivery:
            description: One e-mail that handed an issued document over (payments and delivery design D4), logged once the mail server took it. recipient is the address it went to — empty once the customer has been anonymised (D6) — and is present only for a caller with invoices:issue; a reader sees when each send happened, by whom and its subject, not the address. subject is as sent.
            properties:
                id:
                    format: int64
                    type: integer
                recipient:
                    description: The address the e-mail went to, empty once the customer has been anonymised (D6). Present only for a caller with invoices:issue; absent for every other reader.
                    type: string
                sentAt:
                    format: date-time
                    type: string
                sentByUserId:
                    format: uuid
                    type: string
                subject:
                    type: string
            required:
                - id
                - subject
                - sentAt
                - sentByUserId
            type: object
        InvoicesDeliveryAddress:
            description: The place of delivery (§ 5-1-1 nr. 4), when it is not the buyer's address. line1, city and country are required; country is ISO 3166-1 alpha-2.
            properties:
                city:
                    type: string
                country:
                    type: string
                line1:
                    type: string
                line2:
                    type: string
                postalCode:
                    type: string
            required:
                - line1
                - city
                - country
            type: object
        InvoicesInvoiceListItem:
            description: One document in the list. customerName is the buyer snapshot's name on an issued document and the customer's current name on a draft, absent when the directory no longer knows it.
            properties:
                creditsInvoiceId:
                    format: int64
                    type: integer
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                dueDate:
                    format: date
                    type: string
                ehfStatus:
                    description: On an issued document, its latest EHF transmission's status — queued, submitted, delivered, failed, unconfirmed or cancelled — or not_sent (EHF and KID design D10). Absent on a draft.
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                number:
                    format: int64
                    type: integer
                openAmount:
                    description: On an issued invoice, gross less what its issued credit notes credit and what its live payments paid; negative when a credit note followed a payment.
                    format: double
                    type: number
                projectId:
                    description: The project all of the document's work belongs to (invoices work design D9) — derived from its line sources, never written by a request; absent when its work spans two projects or it bills none.
                    format: int32
                    type: integer
                projectReference:
                    description: The project's code as the document took it, beside projectId — the reference its PDF and EHF print.
                    type: string
                state:
                    description: 'The derived state (D3): draft, issued (an issued credit note), credited, paid, overdue, partially_paid or open.'
                    type: string
                status:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - grossTotal
            type: object
        InvoicesInvoiceRequest:
            description: 'A draft, created (POST) or replaced whole (PUT, with revision) (D4). customerId is the buyer. currency, when given, is NOK — "Only NOK in this phase". Delivery is deliveryDate alone, deliveryFrom with deliveryTo (from on or before to), or none — none only on a draft; the issue refuses it. references are at most 100 characters each, note and internalNote 1000. lines are at most 500. On create, an omitted yourReference is the billing profile''s buyerReference and an omitted paymentTermsDays the profile''s terms, else the settings'' default; on PUT an invoice''s paymentTermsDays is required and an omitted reference is cleared. On a credit-note draft only what D8 allows may change: lines may be removed, a quantity or a unit price lowered, and a description, the note and the internal note edited. A line''s sources name the work it bills (invoices work design D2): never on a create or a credit note; on a PUT of a draft that holds work, required on every line ([] for none), each source one the draft already holds, named once — a save moves work between lines or drops it, and never adds any. At most 5000 sources on one document.'
            properties:
                currency:
                    type: string
                customerId:
                    format: int32
                    type: integer
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                internalNote:
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLineRequest'
                    type: array
                note:
                    type: string
                orderReference:
                    type: string
                ourReference:
                    type: string
                paymentTermsDays:
                    format: int32
                    type: integer
                refreshSources:
                    description: 'PUT of an invoice draft only (invoices work design D2): re-read the work the draft holds through the source modules'' billable reads, before the save''s transaction, and take each source''s current revision, project, quantity, amount, date and kind; work no longer invoiceable, or now in another currency than the draft took it in, is dropped and named in releasedSources. A save that slipped in between the read and the save''s lock and changed the held work is 409 invoice_changed. true on a create or on a credit-note draft is a 400.'
                    type: boolean
                revision:
                    description: Required on PUT; the revision the caller read. A stale one is a 409 naming both.
                    format: int32
                    type: integer
                timesheet:
                    description: 'Whether the invoice carries a timesheet inside its PDF (invoices work design D5). On a create, absent takes the settings'' timesheetDefault; on a PUT, absent keeps the draft''s. Turned on, the save reads the hours the draft holds through Time''s billable read and the people''s names, before its transaction, and writes the rows; turned off, it deletes them; every save prunes them to the hours the draft still holds, and a refreshSources writes them again. true on a credit-note draft is a 400.'
                    type: boolean
                yourReference:
                    type: string
            required:
                - customerId
                - lines
            type: object
        InvoicesInvoiceResponse:
            description: 'One document (D4): every column in camelCase, its lines and its VAT summaries. On a draft the VAT summaries and totals are computed afresh — an invoice draft''s with the rates in force today, which the issue resolves again for the issue date; a credit-note draft''s at its original lines'' snapshot rates, with each line''s and the invoice''s remainder squared as its issue will — and allowedIssueDates lists the dates it may be issued with today. warnings are never refusals: customer_currency_differs, issued_late (never on a credit note, which keeps its original''s delivery), vat_code_not_valid (a line''s code has no rate period covering today; the issue would refuse it), credit_exceeds_invoice, credit_exceeds_line, ehf_buyer_reference_missing (EHF and KID design D8: a draft whose customer''s billing profile prefers EHF or whose customer has a Peppol id — or, on a credit-note draft, whose buyer snapshot has a Peppol id — with neither yourReference nor orderReference set — Peppol needs one, and neither can change after the issue), and for a document that bills work (invoices work design D2) line_differs_from_sources (on a draft, a line''s net differs from its sources'' amounts summed and rounded to øre), sources_released (on a save''s answer, work the save dropped — named in releasedSources), source_changed and source_not_invoiceable (on GET of an invoice draft, for a caller holding invoices:create: a source''s billing facts changed since the draft took them, or it is no longer invoiceable — the issue would refuse either); each of the last three also on the line''s own warnings; on an invoice draft that is a final settlement (invoices work design D7) deduction_exceeds_invoice (a deduction line takes more than its a-konto has left at its VAT code) and invoice_total_not_positive (its gross is zero or less) — the issue refuses either. A deduction line is totalled at its a-konto line''s snapshot (category and rate), never at today''s rate of its code. A document that bills work carries sources, its count by state, and each of its lines its sources[]. An invoice carries creditedAmount (its issued credit notes'' gross), uncreditedAmount and creditNotes; a credit note carries credits. Every document carries state (D3); an issued invoice also carries paidAmount, openAmount, payments and — only when openAmount is below zero — refundDue, none of which a draft or a credit note carries. An issued invoice also carries charges, chargePayments, waivers and manualDeliveries (invoices payments and reminders design D8, D9), and its reminders and nextAction — what the reminder engine says to do next today (D8, D10). An issued invoice also carries hold and handoff, its latest hold and hand-off, live or ended (D11); each is absent when the invoice was never held or handed off. Every issued document carries deliveries (D4) and its EHF state, ehf (EHF and KID design D10); sendDefaults is answered only by GET /invoices/{id} and the send, for a caller who may send — and in its place customerAnonymised when the customer is anonymised.'
            properties:
                allowedIssueDates:
                    items:
                        format: date
                        type: string
                    type: array
                buyer:
                    $ref: '#/components/schemas/InvoicesBuyer'
                chargePayments:
                    description: On an issued invoice, every payment of its charges (invoices payments and reminders design D9), removed ones included with their removal, in the order the money arrived.
                    items:
                        $ref: '#/components/schemas/InvoicesChargePayment'
                    type: array
                charges:
                    $ref: '#/components/schemas/InvoicesCharges'
                createdAt:
                    format: date-time
                    type: string
                creditNotes:
                    items:
                        $ref: '#/components/schemas/InvoicesCreditNoteRef'
                    type: array
                creditedAmount:
                    format: double
                    type: number
                credits:
                    $ref: '#/components/schemas/InvoicesCreditsRef'
                currency:
                    type: string
                customerAnonymised:
                    description: 'true on an issued document whose customer this module has anonymised (D6), answered where sendDefaults would be — GET /invoices/{id} and the send, for a caller who may send, on an installation that can — so the app offers no send; absent otherwise, never false.'
                    type: boolean
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                deliveries:
                    description: On an issued document, every e-mail that handed it over, the first first (D4).
                    items:
                        $ref: '#/components/schemas/InvoicesDelivery'
                    type: array
                deliveryAddress:
                    $ref: '#/components/schemas/InvoicesDeliveryAddress'
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                ehf:
                    $ref: '#/components/schemas/InvoicesEhfState'
                exchangeRate:
                    format: double
                    type: number
                exchangeRateDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                handoff:
                    $ref: '#/components/schemas/InvoicesHandoff'
                hold:
                    $ref: '#/components/schemas/InvoicesHold'
                id:
                    format: int64
                    type: integer
                internalNote:
                    type: string
                issueDate:
                    format: date
                    type: string
                issuedAt:
                    format: date-time
                    type: string
                issuedByUserId:
                    format: uuid
                    type: string
                kid:
                    description: An issued invoice's KID under the seller's bank agreement at issue (EHF and KID design D3) — the number zero-padded to the agreed length less one, then the check digit; a MOD11 check digit may be '-'. Absent without an agreement, on a draft and on a credit note.
                    type: string
                kidAlgorithm:
                    description: mod10 or mod11, the algorithm kid was computed with. Present exactly when kid is.
                    type: string
                kind:
                    description: invoice or credit_note.
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InvoicesLine'
                    type: array
                manualDeliveries:
                    description: On an issued invoice, every delivery recorded by hand (invoices payments and reminders design D8), removed ones included with their removal, the earliest first.
                    items:
                        $ref: '#/components/schemas/InvoicesManualDelivery'
                    type: array
                netTotal:
                    format: double
                    type: number
                nextAction:
                    $ref: '#/components/schemas/InvoicesNextAction'
                note:
                    type: string
                number:
                    format: int64
                    type: integer
                orderReference:
                    type: string
                openAmount:
                    description: On an issued invoice, grossTotal less creditedAmount less paidAmount. It may be negative — a credit note issued after a payment — and refundDue is then what it is short of zero.
                    format: double
                    type: number
                ourReference:
                    type: string
                paidAmount:
                    description: On an issued invoice, what its live payments add up to; a removed payment counts for nothing.
                    format: double
                    type: number
                paymentTermsDays:
                    format: int32
                    type: integer
                payments:
                    description: On an issued invoice, every payment registered against it, removed ones included with their removal, in the order the money arrived.
                    items:
                        $ref: '#/components/schemas/InvoicesPayment'
                    type: array
                pdfStored:
                    description: On an issued document, whether its PDF is stored. False only when storing it after the issue failed; the next download stores it.
                    type: boolean
                projectId:
                    description: 'The project all of the document''s work belongs to (invoices work design D9): set by every save of an invoice draft to the one project all its line sources share, absent when they span two projects or there are none, or when the project directory no longer knows it; never written by a request; frozen at issue; a credit note copies its original''s.'
                    format: int32
                    type: integer
                projectReference:
                    description: The project's code, a snapshot taken when the document's derived project last became this one — what the PDF prints and the EHF carries (BT-11 on an invoice, an AdditionalDocumentReference with DocumentTypeCode 50 on a credit note). Present exactly when projectId is.
                    type: string
                refundDue:
                    description: On an issued invoice whose openAmount is below zero, the amount owed back (−openAmount); absent otherwise. The figure only — refunds are not a flow in this phase.
                    format: double
                    type: number
                releasedSources:
                    description: On a save's answer only, the work the save dropped (invoices work design D2) — removed from every line, its line removed, the customer changed, or no longer invoiceable on a refresh — with the warning sources_released. Absent when nothing was dropped.
                    items:
                        $ref: '#/components/schemas/InvoicesSourceRef'
                    type: array
                reminders:
                    description: On an issued invoice, every reminder letter (invoices payments and reminders design D10), any status, by sequence.
                    items:
                        $ref: '#/components/schemas/InvoicesReminder'
                    type: array
                revision:
                    format: int32
                    type: integer
                seller:
                    $ref: '#/components/schemas/InvoicesSeller'
                sendDefaults:
                    $ref: '#/components/schemas/InvoicesSendDefaults'
                sources:
                    $ref: '#/components/schemas/InvoicesSourcesBlock'
                state:
                    description: 'The derived state, judged against today in Oslo (D3), the first match winning: draft (a draft); issued (an issued credit note); credited (an issued invoice its issued credit notes cover, credited > 0 and credited ≥ gross); paid (nothing left open); overdue (past its due date); partially_paid (something paid); open (otherwise).'
                    type: string
                status:
                    description: draft or issued.
                    type: string
                timesheet:
                    description: Whether the document carries a timesheet inside its PDF (invoices work design D5); frozen at issue.
                    type: boolean
                timesheetRows:
                    description: 'The timesheet as printed (invoices work design D5), in order: a snapshot of the hours the document holds, each person named by the settings'' label when the rows were written — never the time entry''s note. Empty without a timesheet. Kept with the document; nothing identity later does to a user changes it.'
                    items:
                        $ref: '#/components/schemas/InvoicesTimesheetRow'
                    type: array
                uncreditedAmount:
                    format: double
                    type: number
                updatedAt:
                    format: date-time
                    type: string
                vatSummaries:
                    items:
                        $ref: '#/components/schemas/InvoicesVatSummary'
                    type: array
                vatTotal:
                    format: double
                    type: number
                vatTotalNok:
                    format: double
                    type: number
                waivers:
                    description: On an issued invoice, every charge waiver (invoices payments and reminders design D9), the first first.
                    items:
                        $ref: '#/components/schemas/InvoicesChargeWaiver'
                    type: array
                warnings:
                    items:
                        type: string
                    type: array
                yourReference:
                    type: string
            required:
                - id
                - kind
                - status
                - state
                - customerId
                - currency
                - exchangeRate
                - yourReference
                - ourReference
                - orderReference
                - note
                - internalNote
                - netTotal
                - vatTotal
                - grossTotal
                - vatTotalNok
                - lines
                - vatSummaries
                - timesheet
                - timesheetRows
                - warnings
                - createdAt
                - updatedAt
                - revision
            type: object
        InvoicesTimesheetRow:
            description: One row of a document's timesheet (invoices work design D5) — one time entry as printed. description is the entry's task title, else its project's name; never the entry's note.
            properties:
                date:
                    format: date
                    type: string
                description:
                    type: string
                hours:
                    format: double
                    type: number
                personLabel:
                    description: The person as the settings' timesheetPersonLabel named them when the row was written — initials, Person n, or the display name.
                    type: string
                position:
                    format: int32
                    type: integer
                workType:
                    description: The entry's work type; absent for none.
                    type: string
            required:
                - position
                - personLabel
                - date
                - hours
                - description
            type: object
        InvoicesLine:
            description: One line (D4, D5). lineGross is quantity × unitPrice rounded to øre, lineAllowance the discount of it rounded, lineNet their difference. The VAT fields are the issue snapshot, absent on a draft. A deduction line (invoices work design D7) carries deductsInvoiceId, a quantity of -1 and a positive unitPrice, so its lineGross and lineNet are negative; a credit note's line crediting one carries it too, with a negative quantity. On a document that bills work (invoices work design D2) every line carries sources — [] for a line that bills none — and warnings, its own codes (line_differs_from_sources, source_changed, source_not_invoiceable); both absent on a document that bills no work.
            properties:
                creditsLineId:
                    description: On a credit note's line, the original line it credits.
                    format: int64
                    type: integer
                deductsInvoiceId:
                    description: On a deduction line of a final settlement (invoices work design D7), the issued invoice — the a-konto — it deducts, frozen on the line; on a credit note's line, copied from the line it credits. Absent otherwise.
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                exemptionReason:
                    type: string
                id:
                    format: int64
                    type: integer
                lineAllowance:
                    format: double
                    type: number
                lineGross:
                    format: double
                    type: number
                lineNet:
                    format: double
                    type: number
                position:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                safTCode:
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/InvoicesLineSource'
                    type: array
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCategory:
                    type: string
                vatCodeId:
                    format: int32
                    type: integer
                vatRatePercent:
                    format: double
                    type: number
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - id
                - position
                - description
                - quantity
                - unit
                - unitPrice
                - discountPercent
                - vatCodeId
                - lineGross
                - lineAllowance
                - lineNet
            type: object
        InvoicesLineRequest:
            description: One line of a draft. description is 1-500 characters; quantity greater than 0 with at most 3 decimals; unitPrice 0 or more with at most 4; discountPercent 0-100 with at most 2 (0 when omitted); unit at most 20. vatCodeId is an active code. creditsLineId is a credit-note draft's own and names the original line the line credits. A deduction line (invoices work design D7) names deductsInvoiceId and has a quantity of exactly -1, a unitPrice greater than 0 — the amount deducted — and no discount; its vatCodeId is one the deducted invoice has a line at and deducts nothing at itself, and need not be active. On a credit-note draft a line's quantity is negative exactly when the original line it credits is a deduction line, and never larger in magnitude.
            properties:
                creditsLineId:
                    format: int64
                    type: integer
                deductsInvoiceId:
                    description: 'Makes the line a deduction of an earlier invoice — an a-konto — in a final settlement (invoices work design D7): an issued invoice of the same customer in the same currency, never a draft, a credit note or the document itself (a 400 on lines[i].deductsInvoiceId). One deduction line per (deducted invoice, VAT code) — a second is 409 deduction_duplicated — and none naming sources (a 400 on lines[i].sources). Refused on a credit-note draft''s own request: there it is derived from the original line.'
                    format: int64
                    type: integer
                description:
                    type: string
                discountPercent:
                    format: double
                    type: number
                quantity:
                    format: double
                    type: number
                sources:
                    description: The work the line bills, by identity (invoices work design D2). Required on every line of a draft that holds work — [] for none — and refused on a create and on a credit note.
                    items:
                        $ref: '#/components/schemas/InvoicesSourceRef'
                    type: array
                unit:
                    type: string
                unitPrice:
                    format: double
                    type: number
                vatCodeId:
                    format: int32
                    type: integer
            required:
                - description
                - quantity
                - unitPrice
                - vatCodeId
            type: object
        InvoicesLineSource:
            description: 'One piece of work a line bills (invoices work design D2), answered from the document''s own rows and never a live read: its kind and id, its project, the work''s date, the quantity (hours, kilometres or 1) and the exact amount the draft took from the source — at most eight decimals — and state: held (on a draft), invoiced (by the issue) or released (by the credit note that returned its line in full).'
            properties:
                amount:
                    format: double
                    type: number
                date:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                projectId:
                    format: int32
                    type: integer
                quantity:
                    format: double
                    type: number
                state:
                    type: string
            required:
                - kind
                - id
                - projectId
                - date
                - quantity
                - amount
                - state
            type: object
        InvoicesSourceRef:
            description: 'A piece of work by identity (invoices work design D2): kind is time.entry (an hour entry), expenses.entry (an expense line) or projects.milestone (a billing milestone), and id is its row in the module that owns it.'
            properties:
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
            required:
                - kind
                - id
            type: object
        InvoicesSourcesBlock:
            description: 'The work a document bills, counted by state from its own rows (invoices work design D2): count in all, held (on a draft), invoiced (by the issue) and released (by a credit note that returned its line in full, D8). Answered on a document that bills work, absent otherwise. A credit-note draft of an invoice that bills invoiced work answers it too, its counts zero — a credit note holds no work of its own — with wouldRelease.'
            properties:
                count:
                    format: int32
                    type: integer
                held:
                    format: int32
                    type: integer
                invoiced:
                    format: int32
                    type: integer
                released:
                    format: int32
                    type: integer
                wouldRelease:
                    description: 'Only on a credit-note draft (D8): the work its issue would release — the invoiced sources of every original line the draft returns in full, its last return at the line''s own price and discount; [] when it returns no line in full. A line credited in part or at a lower price releases nothing.'
                    items:
                        $ref: '#/components/schemas/InvoicesSourceRef'
                    type: array
            required:
                - count
                - held
                - invoiced
                - released
            type: object
        InvoicesPayment:
            description: 'One payment registered against an issued invoice (D2; invoices payments and reminders design D2, D4). source is manual for one registered by hand, ocr or camt054 for one a bank line was matched to, which bankTransactionId then names — registered by the person who uploaded the file or asked for the rest to be matched, paid on the line''s booking day, its reference the KID. registeredByUserId is the person who registered it; it is optional on the wire, for a later source with no person. A removed one keeps its row and carries removedAt, removedByUserId and removalReason; it counts for nothing.'
            properties:
                amount:
                    format: double
                    type: number
                bankTransactionId:
                    description: The bank line the payment was matched or applied from; absent for one registered by hand.
                    format: int64
                    type: integer
                currency:
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
                registeredByUserId:
                    format: uuid
                    type: string
                removalReason:
                    type: string
                removedAt:
                    format: date-time
                    type: string
                removedByUserId:
                    format: uuid
                    type: string
                source:
                    description: manual, ocr or camt054.
                    enum:
                        - manual
                        - ocr
                        - camt054
                    type: string
            required:
                - id
                - paidOn
                - amount
                - currency
                - source
                - reference
                - note
                - registeredAt
            type: object
        InvoicesPaymentRemovalRequest:
            description: 'POST /invoices/{id}/payments/{paymentId}/remove''s body (D2). reason is why the registration is removed: 1-200 characters once trimmed. A removal is never undone; a mistake is registered again. The same body removes a charge payment and a manual delivery (invoices payments and reminders design D8, D9).'
            properties:
                reason:
                    type: string
            required:
                - reason
            type: object
        InvoicesPaymentRequest:
            description: 'POST /invoices/{id}/payments'' body (D2). paidOn is the day the money arrived: on or after the invoice''s issue date and not after today (Oslo). amount is greater than 0 with at most 2 decimals, at most 99999999999.99, in the invoice''s currency, and at most its open amount (409 payment_exceeds_open). reference (the bank''s or the payer''s) holds at most 100 characters and note at most 500, both trimmed; absent is empty.'
            properties:
                amount:
                    format: double
                    type: number
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
            required:
                - paidOn
                - amount
            type: object
        InvoicesChargePayment:
            description: 'One payment of an issued invoice''s charges — the fees, the compensation and the interest its reminders claimed — never of its principal (invoices payments and reminders design D9). source is manual for one registered by hand, ocr or camt054 for one taken from a bank line, which bankTransactionId then names. A removed one keeps its row and carries removedAt, removedByUserId and removalReason; it counts for nothing.'
            properties:
                amount:
                    format: double
                    type: number
                bankTransactionId:
                    description: The bank line the payment was taken from; absent for one registered by hand.
                    format: int64
                    type: integer
                currency:
                    type: string
                id:
                    format: int64
                    type: integer
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
                registeredAt:
                    format: date-time
                    type: string
                registeredByUserId:
                    format: uuid
                    type: string
                removalReason:
                    type: string
                removedAt:
                    format: date-time
                    type: string
                removedByUserId:
                    format: uuid
                    type: string
                source:
                    description: manual, ocr or camt054.
                    enum:
                        - manual
                        - ocr
                        - camt054
                    type: string
            required:
                - id
                - paidOn
                - amount
                - currency
                - source
                - reference
                - note
                - registeredAt
                - registeredByUserId
            type: object
        InvoicesChargePaymentRequest:
            description: 'POST /invoices/{id}/charge-payments'' body (D9), a payment''s fields and rules (D2): paidOn on or after the invoice''s issue date and not after today (Oslo); amount greater than 0 with at most 2 decimals, at most 99999999999.99, in the invoice''s currency, and at most its charges outstanding (409 charge_payment_exceeds_outstanding); reference at most 100 characters and note at most 500, both trimmed; absent is empty.'
            properties:
                amount:
                    format: double
                    type: number
                note:
                    type: string
                paidOn:
                    format: date
                    type: string
                reference:
                    type: string
            required:
                - paidOn
                - amount
            type: object
        InvoicesChargeWaiveRequest:
            description: 'POST /invoices/{id}/charges/waive''s body (D9): the charges to release, each a letter and a kind — fee or compensation, the letter''s whole charge; interest, what the latest sent letter claimed less every earlier interest waiver and the charge payments allocated to interest, so it names the latest sent letter — at least 1 and at most 50, judged in order; reason objection_upheld, claimed_in_error or goodwill (deadline_met is the bank match''s own); note at most 500 characters, trimmed, absent is empty.'
            properties:
                note:
                    type: string
                reason:
                    enum:
                        - objection_upheld
                        - claimed_in_error
                        - goodwill
                    type: string
                waivers:
                    items:
                        properties:
                            kind:
                                enum:
                                    - fee
                                    - compensation
                                    - interest
                                type: string
                            reminderId:
                                format: int64
                                type: integer
                        required:
                            - reminderId
                            - kind
                        type: object
                    type: array
            required:
                - waivers
                - reason
            type: object
        InvoicesChargeWaiver:
            description: 'One charge released (D9): a sent letter''s fee or compensation whole, or an amount of the interest the latest sent letter claimed — interestThrough is then that letter''s sent day. A waiver is never removed or changed. reason is objection_upheld, claimed_in_error, goodwill or deadline_met (the bank match''s, when the payments ordered by a missed deadline in fact met it).'
            properties:
                amount:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                interestThrough:
                    format: date
                    type: string
                kind:
                    enum:
                        - fee
                        - compensation
                        - interest
                    type: string
                note:
                    type: string
                reason:
                    enum:
                        - objection_upheld
                        - claimed_in_error
                        - goodwill
                        - deadline_met
                    type: string
                reminderId:
                    format: int64
                    type: integer
                waivedAt:
                    format: date-time
                    type: string
                waivedBy:
                    format: uuid
                    type: string
            required:
                - id
                - reminderId
                - kind
                - amount
                - reason
                - note
                - waivedBy
                - waivedAt
            type: object
        InvoicesCharges:
            description: 'An issued invoice''s charges (D9), apart from its principal: claimed is the fees and compensation its sent letters claimed plus the latest sent letter''s cumulative interest; waived what its waivers released; paid what its live charge payments paid; outstanding what is left, never below zero. refundDue is present only when the charge payments exceed every charge less its waivers — a charge paid, then waived — and is what is owed back, outside Vantigo.'
            properties:
                claimed:
                    format: double
                    type: number
                interestToday:
                    description: The late interest accrued to today as a letter sent today would claim it — cumulative from the day after the effective due date, before waivers and what is paid of it (invoices payments and reminders design D8, D12). Present only when interest applies — late interest on, the customer's policy normal, the invoice delivered on or before its due date — and the rates cover the period.
                    format: double
                    type: number
                outstanding:
                    format: double
                    type: number
                paid:
                    format: double
                    type: number
                refundDue:
                    format: double
                    type: number
                waived:
                    format: double
                    type: number
            required:
                - claimed
                - waived
                - paid
                - outstanding
            type: object
        InvoicesManualDelivery:
            description: 'A delivery recorded by hand (invoices payments and reminders design D8): the invoice handed_over or posted on deliveredOn. A charge needs a live delivery — this, an e-mail or a delivered EHF transmission — on or before the due date. A removed one keeps its row and carries removedAt, removedByUserId and removalReason; it counts for nothing.'
            properties:
                deliveredOn:
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    enum:
                        - handed_over
                        - posted
                    type: string
                note:
                    type: string
                recordedAt:
                    format: date-time
                    type: string
                recordedByUserId:
                    format: uuid
                    type: string
                removalReason:
                    type: string
                removedAt:
                    format: date-time
                    type: string
                removedByUserId:
                    format: uuid
                    type: string
            required:
                - id
                - kind
                - deliveredOn
                - note
                - recordedAt
                - recordedByUserId
            type: object
        InvoicesManualDeliveryRequest:
            description: 'POST /invoices/{id}/manual-deliveries'' body (D8): kind handed_over or posted; deliveredOn on or after the invoice''s issue date and not after today (Oslo); note at most 500 characters, trimmed, absent is empty.'
            properties:
                deliveredOn:
                    format: date
                    type: string
                kind:
                    enum:
                        - handed_over
                        - posted
                    type: string
                note:
                    type: string
            required:
                - kind
                - deliveredOn
            type: object
        InvoicesSendDefaults:
            description: 'What the Send dialog opens with (D4), on an issued document''s GET and on the send''s own response only, and only for a caller who may send (invoices:issue on an installation whose mail driver is smtp); never for a customer this module has anonymised, whom a send is refused. recipient is the customer''s current invoice e-mail, absent when it has none; preference is the billing profile''s invoice delivery (email, ehf, efaktura or paper), absent when unset. warnings are the send''s, never refusals: delivery_preference_ehf (the customer expects EHF; an e-mailed PDF does not meet the e-invoicing duty), ehf_preferred (in place of delivery_preference_ehf when the caller can send as EHF on this installation — canSendEhf — and the document''s ehf names nothing blocking it: send it as EHF instead; EHF and KID design D10), delivery_preference_other (the customer prefers efaktura or paper), buyer_norwegian_business (the buyer snapshot has a Norwegian organisation number and today, the Oslo business day of the server''s clock, is before 2027-01-01: from that day a Norwegian business must receive an e-invoice), buyer_norwegian_business_required (the same buyer from 2027-01-01, when an e-mailed PDF no longer meets the duty). The server judges the date, never the browser. Absent when the directory could not be read.'
            properties:
                preference:
                    type: string
                recipient:
                    type: string
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - warnings
            type: object
        InvoicesSendRequest:
            description: 'POST /invoices/{id}/send''s body (D4). recipient overrides the customer''s current invoice e-mail: a bare address that parses to itself, at most 254 characters once trimmed (so "Name <a@b>" is refused). Absent, the invoice e-mail is used.'
            properties:
                recipient:
                    type: string
            type: object
        InvoicesSeller:
            description: The seller snapshot (D4), copied from the settings at issue.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                legalName:
                    type: string
                organisationNumber:
                    type: string
                postalCode:
                    type: string
                vatRegistered:
                    type: boolean
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - addressLine2
                - postalCode
                - city
                - country
                - bankAccount
                - iban
                - bic
                - email
                - footerText
            type: object
        InvoicesVatSummary:
            description: VAT per (category, rate) of a document (D5), computed on the sum of the lines' nets, a row for each 0 % category too.
            properties:
                exemptionReason:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                taxableAmount:
                    format: double
                    type: number
                vatAmount:
                    format: double
                    type: number
                vatAmountNok:
                    format: double
                    type: number
                vatCategory:
                    type: string
            required:
                - vatCategory
                - ratePercent
                - safTCode
                - taxableAmount
                - vatAmount
                - vatAmountNok
            type: object
        InvoicesWorkVatCodes:
            description: The VAT code each kind of work is invoiced at (invoices work design D6) — the settings' defaults, which the uninvoiced view's wizard pre-fills, each the id of a code. All three are 1 (code 3, 25 %) until changed.
            properties:
                expenses:
                    format: int32
                    type: integer
                hours:
                    format: int32
                    type: integer
                milestones:
                    format: int32
                    type: integer
            required:
                - hours
                - expenses
                - milestones
            type: object
        InvoicesFromWorkVatCodes:
            description: The wizard's VAT code per kind of work (invoices work design D6), each optional — absent takes the settings' default, or id 9 (code 7, category O) for every kind while the seller is not VAT-registered. A code given must exist and be active (a 400 on vatCodes.<kind>); a default that has become inactive, with no code given, is a 400 on vatCodes.<kind> too.
            properties:
                expenses:
                    format: int32
                    type: integer
                hours:
                    format: int32
                    type: integer
                milestones:
                    format: int32
                    type: integer
            type: object
        InvoicesWorkHeldBy:
            description: The live document that holds a piece of work (invoices work design D2, D3) — a draft that holds it, or an issued invoice that invoiced it — by id, number (an issued one's only) and status.
            properties:
                invoiceId:
                    format: int64
                    type: integer
                number:
                    format: int64
                    type: integer
                status:
                    type: string
            required:
                - invoiceId
                - status
            type: object
        InvoicesWorkHeldOnDraft:
            description: How many of a project's sources of one kind a draft holds (invoices work design D3).
            properties:
                count:
                    format: int32
                    type: integer
                invoiceId:
                    format: int64
                    type: integer
                kind:
                    type: string
            required:
                - invoiceId
                - kind
                - count
            type: object
        InvoicesWorkHour:
            description: 'One approved, billable, priced hour entry not yet invoiced (invoices work design D3). hours is the entry''s hours; billRate the rate per hour, billMultiplierPercent its work type''s multiplier (absent for none); rate the effective rate a line bills it at — billRate × the multiplier / 100, rounded half away from zero to four decimals; amount Time''s exact amount (hours × billRate × the multiplier, up to eight decimals). selectable is whether the wizard takes it; when not, reason says why — held (heldBy names the live document that has it), non_billable (its project is non-billable), fixed_price (its project is fixed-price: its hours are shown, not invoiced), currency (not NOK) or no_customer (its project bills no customer). A row that is not selectable counts in no total. warnings: currency_not_nok.'
            properties:
                amount:
                    format: double
                    type: number
                billMultiplierPercent:
                    format: double
                    type: number
                billRate:
                    format: double
                    type: number
                billingLineId:
                    format: int32
                    type: integer
                currency:
                    type: string
                date:
                    format: date
                    type: string
                heldBy:
                    $ref: '#/components/schemas/InvoicesWorkHeldBy'
                hours:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                rate:
                    format: double
                    type: number
                reason:
                    type: string
                revision:
                    format: int32
                    type: integer
                selectable:
                    type: boolean
                taskTitle:
                    type: string
                userId:
                    format: uuid
                    type: string
                warnings:
                    items:
                        type: string
                    type: array
                workTypeId:
                    format: int32
                    type: integer
                workTypeName:
                    type: string
            required:
                - id
                - revision
                - date
                - userId
                - hours
                - billRate
                - rate
                - amount
                - currency
                - selectable
            type: object
        InvoicesWorkExpense:
            description: 'One expense line ready to invoice and not yet invoiced (invoices work design D3): its kind (outlay, mileage or supplier_invoice), date, description, the supplier and its invoice number on a supplier invoice, the net amount, the markup, the distance and the rate per km on mileage, and billAmount, what the customer is billed with the markup in it. selectable and reason as on an hour (never fixed_price: only hours are a fixed-price project''s information). warnings: currency_not_nok, and supplier_invoice_rebilled — a supplier invoice whose supplier and number another entry already invoiced, or that another row of this answer repeats.'
            properties:
                billAmount:
                    format: double
                    type: number
                billRatePerKm:
                    format: double
                    type: number
                claimId:
                    format: int64
                    type: integer
                currency:
                    type: string
                date:
                    format: date
                    type: string
                description:
                    type: string
                distanceKm:
                    format: double
                    type: number
                heldBy:
                    $ref: '#/components/schemas/InvoicesWorkHeldBy'
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                markupPercent:
                    format: double
                    type: number
                netAmount:
                    format: double
                    type: number
                reason:
                    type: string
                revision:
                    format: int32
                    type: integer
                selectable:
                    type: boolean
                supplier:
                    type: string
                supplierInvoiceNumber:
                    type: string
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - id
                - revision
                - kind
                - date
                - description
                - netAmount
                - billAmount
                - currency
                - selectable
            type: object
        InvoicesWorkMilestone:
            description: 'One billing milestone ready to invoice (invoices work design D3): its name and description, the planned date, when it became ready (readyAt) and that day in Oslo (date, the work''s date), and amount, its effective amount — a percent of the fixed price resolved by Projects. selectable and reason as on an hour.'
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
                date:
                    format: date
                    type: string
                description:
                    type: string
                heldBy:
                    $ref: '#/components/schemas/InvoicesWorkHeldBy'
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                plannedDate:
                    format: date
                    type: string
                readyAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                revision:
                    format: int32
                    type: integer
                selectable:
                    type: boolean
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - id
                - revision
                - name
                - description
                - readyAt
                - date
                - amount
                - currency
                - selectable
            type: object
        InvoicesWorkProject:
            description: 'One project''s uninvoiced work (invoices work design D3): the project''s code, name, billing type (time-and-materials, fixed-price or non-billable) and currency, its hours, expenses and milestones — each kind in its provider''s order, held work listed and not selectable — what drafts hold of it (heldOnDrafts, per draft and kind), and warnings: work_overdue_to_invoice when its oldest selectable item is dated more than one calendar month before today (D12).'
            properties:
                billingType:
                    type: string
                code:
                    type: string
                currency:
                    type: string
                expenses:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkExpense'
                    type: array
                heldOnDrafts:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkHeldOnDraft'
                    type: array
                hours:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkHour'
                    type: array
                id:
                    format: int32
                    type: integer
                milestones:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkMilestone'
                    type: array
                name:
                    type: string
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - id
                - code
                - name
                - billingType
                - hours
                - expenses
                - milestones
                - heldOnDrafts
                - warnings
            type: object
        InvoicesWorkTotal:
            description: The selectable work's amount in one currency.
            properties:
                amount:
                    format: double
                    type: number
                currency:
                    type: string
            required:
                - currency
                - amount
            type: object
        InvoicesWorkUser:
            description: A person whose hours the answer lists, named by the user directory.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        InvoicesWorkResponse:
            description: 'GET /invoices/work''s answer (invoices work design D3): the customer (absent for a project that bills none), its projects — every project of the customer, or the one asked for — with their uninvoiced work, the totals of the selectable work per currency, the people the hours name, and warnings: work_truncated when a billable read had more than 5 000 rows to answer and the rest is not here.'
            properties:
                customerId:
                    format: int32
                    type: integer
                projects:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkProject'
                    type: array
                totals:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkTotal'
                    type: array
                users:
                    items:
                        $ref: '#/components/schemas/InvoicesWorkUser'
                    type: array
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - projects
                - totals
                - users
                - warnings
            type: object
        InvoicesFromWorkSource:
            description: A piece of work the wizard takes, by identity and the revision the view showed — judged for an hour entry and a milestone, display-only for an expense (invoices work design D1, D3).
            properties:
                id:
                    format: int64
                    type: integer
                kind:
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - kind
                - id
                - revision
            type: object
        InvoicesFromWorkRequest:
            description: 'POST /invoices/from-work''s body (invoices work design D3, D4, D6): the customer, the work by identity (at most 5 000 with an append target''s held work, none twice), the grouping — project (the default), work_type, person, date or itemised — the VAT codes per kind, an optional delivery period (both or neither; the first and last work dates when absent), an optional note (a re-pull note suggested when absent), and, to add the work to an existing invoice draft of this customer, its invoiceId with the revision it was read at.'
            properties:
                customerId:
                    format: int32
                    type: integer
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                grouping:
                    type: string
                invoiceId:
                    format: int64
                    type: integer
                note:
                    description: The draft's note, printed on the document, at most 1 000 characters. Absent or empty, the wizard suggests one when the work was released by a credit note before — "Erstatter faktura <n>, kreditert med kreditnota <c>" / "Replaces invoice <n>, credited by credit note <c>" — in the buyer's language, cut to fit the note's 1 000 characters (whole sentences, ending in "…" when any is left out). An append writes a note only on a target whose note is empty — on a target that has one, the request's note is dropped and the target's kept.
                    type: string
                revision:
                    format: int32
                    type: integer
                sources:
                    items:
                        $ref: '#/components/schemas/InvoicesFromWorkSource'
                    type: array
                timesheet:
                    description: Whether the draft carries a timesheet inside its PDF (invoices work design D5) — absent takes the settings' timesheetDefault for a new draft and the target's own for an append. On, the rows are written for every hour the draft then holds, each person named through the user directory before the transaction.
                    type: boolean
                vatCodes:
                    $ref: '#/components/schemas/InvoicesFromWorkVatCodes'
            required:
                - customerId
                - sources
            type: object
        PaginatedResponseOfInvoicesInvoiceListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesInvoiceListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        InvoicesIssueRequest:
            description: 'POST /invoices/{id}/issue''s body (D6). issueDate is today (Oslo) when omitted; the only other date allowed is the last day of the previous month, while today''s calendar day is 15 or less and the delivery ended on or before it — and never a date before the latest issue date of any issued document.'
            properties:
                issueDate:
                    format: date
                    type: string
            type: object
        InvoicesJournalCode:
            description: One (SAF-T code, category, rate) of the journal's VAT, credit notes signed negative.
            properties:
                category:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
                taxableAmount:
                    format: double
                    type: number
                vatAmount:
                    format: double
                    type: number
            required:
                - safTCode
                - category
                - ratePercent
                - taxableAmount
                - vatAmount
            type: object
        InvoicesJournalResponse:
            description: 'The invoice journal (D11) over issue dates from-to: the issued documents in number order, a page at a time; the totals over the whole range, per SAF-T code, category and rate, credit notes signed negative; and the gap check — the numbers from the one after the issued document before the range''s first (never below the series start) to the range''s last that no issued document holds, at most 1000 listed.'
            properties:
                checkedFrom:
                    description: The first number the gap check covered — one past the issued document before the range's first, or the series start; absent when the range holds no document.
                    format: int64
                    type: integer
                checkedTo:
                    description: The last number the gap check covered, the range's last; absent when the range holds no document.
                    format: int64
                    type: integer
                counterLast:
                    description: The counter's last allocated number; absent when nothing was ever issued. When it is not highestIssued, a number was allocated without a document.
                    format: int64
                    type: integer
                data:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalRow'
                    type: array
                gaps:
                    items:
                        format: int64
                        type: integer
                    type: array
                gapsTruncated:
                    type: boolean
                highestIssued:
                    description: The highest number any issued document holds, whatever its date; absent when nothing is issued.
                    format: int64
                    type: integer
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
                seriesStart:
                    format: int64
                    type: integer
                totals:
                    $ref: '#/components/schemas/InvoicesJournalTotals'
            required:
                - data
                - pagination
                - totals
                - gaps
                - gapsTruncated
                - seriesStart
            type: object
        InvoicesJournalRow:
            description: One issued document in the journal, credit notes signed negative in every amount.
            properties:
                buyerCustomerNumber:
                    format: int64
                    type: integer
                buyerName:
                    type: string
                buyerOrganisationNumber:
                    type: string
                creditsNumber:
                    description: On a credit note, the number of the invoice it credits.
                    format: int64
                    type: integer
                currency:
                    type: string
                deliveryDate:
                    format: date
                    type: string
                deliveryFrom:
                    format: date
                    type: string
                deliveryTo:
                    format: date
                    type: string
                dueDate:
                    format: date
                    type: string
                grossTotal:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                issueDate:
                    format: date
                    type: string
                kind:
                    type: string
                netTotal:
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
                vatSummaries:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalCode'
                    type: array
                vatTotal:
                    format: double
                    type: number
            required:
                - id
                - number
                - kind
                - issueDate
                - currency
                - netTotal
                - vatTotal
                - grossTotal
                - vatSummaries
            type: object
        InvoicesJournalTotals:
            description: The journal's totals over the whole range, not the page, credit notes signed negative.
            properties:
                byCode:
                    items:
                        $ref: '#/components/schemas/InvoicesJournalCode'
                    type: array
                grossTotal:
                    format: double
                    type: number
                netTotal:
                    format: double
                    type: number
                vatTotal:
                    format: double
                    type: number
            required:
                - byCode
                - netTotal
                - vatTotal
                - grossTotal
            type: object
        InvoicesStatsSummaryResponse:
            description: 'The dashboard''s invoices card over one period, in the envelope every module''s /stats/summary shares (payments and delivery design D7). outstanding and overdue are now — the issued invoices with something open, at their open amounts, credit notes excluded, and of those the ones past their due date on today''s Oslo date. issued, credited and paid are in the period: the invoices and the credit notes whose issue date, and the live payments whose paid date, falls on an Oslo day from the day of from up to and including the day of the last instant before to. issuedGrossTotalDelta is issuedGrossTotal less the previous period''s, the period of the same length just before. All NOK.'
            properties:
                creditedCount:
                    format: int32
                    type: integer
                creditedGrossTotal:
                    format: double
                    type: number
                from:
                    format: date-time
                    type: string
                issuedCount:
                    format: int32
                    type: integer
                issuedGrossTotal:
                    format: double
                    type: number
                issuedGrossTotalDelta:
                    format: double
                    type: number
                outstandingAmount:
                    format: double
                    type: number
                outstandingCount:
                    format: int32
                    type: integer
                overdueAmount:
                    format: double
                    type: number
                overdueCount:
                    format: int32
                    type: integer
                paidAmount:
                    format: double
                    type: number
                paidCount:
                    format: int32
                    type: integer
                to:
                    format: date-time
                    type: string
            required:
                - from
                - to
                - outstandingAmount
                - outstandingCount
                - overdueAmount
                - overdueCount
                - issuedCount
                - issuedGrossTotal
                - issuedGrossTotalDelta
                - creditedCount
                - creditedGrossTotal
                - paidAmount
                - paidCount
            type: object
info:
    title: Vantigo Invoices API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/invoices/meta:
        get:
            description: What every Invoices page needs in one read — the currency, the default payment terms, whether the seller is complete and what it lacks, whether anything is issued and the series start, whether an object store exists, today in Oslo, the VAT codes in force today and the caller's capabilities.
            operationId: getInvoicesMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesMetaResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the Invoices metadata
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/settings:
        get:
            description: The seller record and the series start. Every invoices:access holder may read them — they are what every document prints.
            operationId: getInvoicesSettings
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces the seller record and the series start (D2). It takes the settings row FOR UPDATE, so it waits behind an issue in flight; the series start is refused once the counter row exists (409 series_locked). Every other field stays editable after the first issue — issued documents keep their seller snapshot.
            operationId: putInvoicesSettings
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesSettingsResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — series_locked, or a stale revision (no code; the detail names both revisions).
            summary: Change the invoice settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/settings/access-point:
        get:
            description: The stored access-point credentials (EHF and KID design D7) — the provider, its legal entity, whether a key is stored and when the provider refused it — never the key. With none stored the answer is 200 with hasCredentials false and neither provider nor legalEntityId, so the settings page opens an empty card rather than handling an error.
            operationId: getInvoicesSettingsAccessPoint
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
        delete:
            description: Removes the access-point credentials (EHF and KID design D7); EHF is unavailable until new ones are stored. Refused with 409 transmissions_active while any transmission is queued, submitted or unconfirmed — the provider still holds what it needs to finish them. Removing what is not there is a 204 too.
            operationId: deleteInvoicesSettingsAccessPoint
            responses:
                "204":
                    description: No Content — the credentials are gone.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmissions_active.
            summary: Remove the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
        put:
            description: Stores the access point's provider, its legal entity and its API key (EHF and KID design D7), in their own row, the key sealed by the secrets box under invoices/access-point-credential. An omitted key keeps the stored one, opened and sealed again in the same transaction. The answer never carries the key. A PUT clears rejectedAt. Switching to another provider is refused with 409 transmissions_active while any transmission is queued, submitted or unconfirmed; changing the key or the legal entity is not, so a refused key can be replaced while documents wait for it.
            operationId: putInvoicesSettingsAccessPoint
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesAccessPointRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — provider, legalEntityId or apiKey did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmissions_active, on a provider switch.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — ehf_unavailable, the key was omitted and the stored one cannot be opened (APP_SECRET changed, or the row was altered); the credentials are flagged as rejected. Send the key again.
            summary: Store the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/settings/access-point/verify:
        post:
            description: Asks the provider to answer one authenticated read with the stored credentials (EHF and KID design D7) and says how it went. ok clears rejectedAt; unauthorized sets it.
            operationId: postInvoicesSettingsAccessPointVerify
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesAccessPointVerifyResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — ehf_unavailable, no credentials are stored.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — ehf_unavailable, the stored key cannot be opened; the credentials are flagged as rejected. Store the key again.
            summary: Verify the access-point credentials
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/settings/reminders:
        get:
            description: The reminder settings and the regime and its review (invoices payments and reminders design D6, D7). Every invoices:access holder may read them.
            operationId: getInvoicesSettingsReminders
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesReminderSettings'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the reminder settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces the reminder settings (D7), every field required, and checks the revision in the same statement. Moving regimeReviewedThrough or setting inkassolov2026From records who and when (D6). Changing anything changes only letters made afterwards.
            operationId: putInvoicesSettingsReminders
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesReminderSettingsRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesReminderSettings'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field is absent or did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — a stale revision (no code; the detail names both).
            summary: Change the reminder settings
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/collection-rates:
        get:
            description: Every collection rate by kind and date (D6), each with whether it is in force today (Oslo), whether a letter has used it, and the release's value over a user's row; warns collection_rate_differs_from_release while any row's release value differs from its value.
            operationId: getInvoicesCollectionRates
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesCollectionRateList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the collection rates
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        post:
            description: Adds a rate ahead of a release (D6). Refused, in this order, with a 400 on the field — validFrom not after today or not after the latest printed or sent letter's date, a half-yearly kind not on 1 January or 1 July, a value out of its kind's bounds or with more than two decimals, a sourceRef blank or too long — and with 409 collection_rate_exists when the kind already has a row on that day.
            operationId: postInvoicesCollectionRates
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesCollectionRateRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesCollectionRate'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — collection_rate_exists.
            summary: Add a collection rate
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/collection-rates/{id}:
        delete:
            description: Locks the rate row, then deletes a user's rate that is not yet in force and that no printed or sent letter has used (D6, plan reading 6); a seeded row, a row in force or past, and a used row are 409 collection_rate_in_force. A deleted row a release had seeded over is replaced, in the same transaction, by a seeded row of the release's value and regulation, so its half-year never goes empty.
            operationId: deleteInvoicesCollectionRatesById
            parameters:
                - in: path
