        InvoicesBankTransaction:
            description: 'One line of a bank file (D3), as the bank wrote it: lineRef (OCR assignment/transaction, camt.054 notification/entry/transaction), the receiving account, direction (credit, or debit for a reversal), negative (an OCR line with a minus sign), the booking, value and ordering days (orderedOn is OCR''s alone), the amount, the KID as written (absent without one), the remittance text, the debtor''s name and account, the bank''s archive reference; bankFile, the file it came in; and its state in matching and the exception queue (D4, D5) — status pending, matched, exception, resolved or duplicate; the reason it was queued (a resolved line keeps it); duplicateOfId, the line it duplicates; suggestedInvoiceId, the invoice its KID named or the one unambiguous suggestion when it was queued; applied, every payment and charge payment that refers to it, removed ones included; unappliedAmount, the amount less what its live payments and charge payments apply — 0 for a reversal, a negative line, a duplicate row, a line whose payment a reversal took back, and a line resolved otherwise than applied unless it was dismissed after being queued invoice_credited, invoice_settled or exceeds_open (money owed back), since none of the others is money waiting to be applied; resolution, resolvedBy, resolvedAt and resolutionNote while it is resolved; and events, what happened to it, the first first. On the exception queue''s list, an exception queued no_kid, kid_invalid, kid_unknown or payment_removed — or possible_duplicate without a suggested invoice — carries suggestions, and a possible_duplicate or duplicate line possibleDuplicateOf, the line it may repeat with that line''s payments; a file''s detail carries possibleDuplicateOf but no suggestions.'
