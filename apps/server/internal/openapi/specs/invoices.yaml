                ignored:
                    $ref: '#/components/schemas/InvoicesBankIgnored'
                matched:
                    format: int32
                    type: integer
                matchedAmount:
                    format: double
                    type: number
                pending:
                    format: int32
                    type: integer
                transactions:
                    format: int32
                    type: integer
            required:
                - file
                - transactions
                - matched
                - matchedAmount
                - exceptions
                - exceptionsAmount
                - duplicates
                - ignored
                - pending
            type: object
        InvoicesBankTransaction:
