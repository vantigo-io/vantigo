components:
    schemas:
        InvoicesMetaCapabilities:
            description: What the caller may do in the Invoices app, answered by the server so no client re-derives a permission rule.
            properties:
                canCreate:
                    description: invoices:create — create, edit and delete drafts, and preview a draft.
                    type: boolean
                canImportBankFiles:
                    description: invoices:payments — import OCR giro and camt.054 bank files, and read the imported files and their accounts.
                    type: boolean
                canIssue:
                    description: invoices:issue — issue a draft, and create a credit-note draft.
                    type: boolean
                canManage:
                    description: invoices:manage — the seller record, the series start and the VAT codes.
                    type: boolean
                canRegisterPayments:
                    description: invoices:payments — register a payment against an issued invoice, and remove a registration with a reason.
                    type: boolean
                canSend:
                    description: invoices:issue and mailAvailable — send an issued document to the customer by e-mail.
                    type: boolean
                canSendEhf:
                    description: invoices:issue and ehfAvailable — send an issued document to the customer as EHF over Peppol.
                    type: boolean
            required:
                - canCreate
                - canImportBankFiles
                - canIssue
                - canManage
                - canRegisterPayments
                - canSend
                - canSendEhf
            type: object
        InvoicesMetaResponse:
            description: What every Invoices page needs before it draws anything (invoices foundation design D2).
            properties:
                accessPointCredentialsRejected:
                    description: Whether the access-point provider refused the stored API key (a 401 or 403, or a key that could not be opened). Cleared by the next accepted call or a new key. False without credentials. It does not change ehfAvailable.
                    type: boolean
                anythingIssued:
                    description: Whether any document has been issued — the counter row exists. Once true the series start is locked.
                    type: boolean
                capabilities:
                    $ref: '#/components/schemas/InvoicesMetaCapabilities'
                currency:
                    description: The one currency a document may carry in this phase, NOK.
                    type: string
                defaultPaymentTermsDays:
                    description: The seller's default payment terms, which a new draft takes when neither the request nor the customer's billing profile decides.
                    format: int32
                    type: integer
                ehfAvailable:
                    description: Whether this installation can send EHF over Peppol — INVOICES_EHF_ENABLED is on, the Peppol lookup is enabled (PEPPOL_LOOKUP_ENABLED), access-point credentials are stored and the seller's Peppol id is set. Without it canSendEhf is false.
                    type: boolean
                mailAvailable:
                    description: Whether this installation's mail driver is smtp. Without it nothing can be sent (503 mail_unavailable), and canSend is false.
                    type: boolean
                missingSellerFields:
                    description: The seller fields issuing still needs, by their camelCase names (legalName, organisationNumber, addressLine1, postalCode, city, bankAccount). Empty when the seller is complete.
                    items:
                        type: string
                    type: array
                sellerComplete:
                    description: Whether the seller record is complete enough to issue. Issuing is refused with 409 seller_incomplete until it is.
                    type: boolean
                seriesStart:
                    description: The first number of the one series invoices and credit notes share.
                    format: int64
                    type: integer
                storageAvailable:
                    description: Whether this installation has an object store. Without one nothing can be issued (503 storage_unavailable), because an issued number whose PDF can never be stored is not allowed to exist.
                    type: boolean
                today:
                    description: Today in Europe/Oslo, the business day every date rule of this module is judged on.
                    format: date
                    type: string
                vatCodes:
                    description: The VAT codes a new line may take — active, with a rate period covering today — each with today's rate.
                    items:
                        $ref: '#/components/schemas/InvoicesVatCodeInForce'
                    type: array
                work:
                    $ref: '#/components/schemas/InvoicesMetaWork'
                workAvailable:
                    description: Whether any work can be invoiced here — at least one of the billable reads (time's hours, expenses' lines, projects' milestones) is composed, so the uninvoiced view answers (invoices work design D3). Without it GET /invoices/work is 409 work_unavailable.
                    type: boolean
            required:
                - currency
                - defaultPaymentTermsDays
                - sellerComplete
                - missingSellerFields
                - anythingIssued
                - seriesStart
                - storageAvailable
                - mailAvailable
                - ehfAvailable
                - accessPointCredentialsRejected
                - today
                - vatCodes
                - capabilities
                - workAvailable
                - work
            type: object
        InvoicesMetaWork:
            description: Which kinds of work this installation can invoice (invoices work design D3) — each true when the module that owns it is switched on and provides its billable read.
            properties:
                expenses:
                    description: Expenses' lines (expenses.entry).
                    type: boolean
                hours:
                    description: Time's hour entries (time.entry).
                    type: boolean
                milestones:
                    description: Projects' billing milestones (projects.milestone).
                    type: boolean
            required:
                - hours
                - expenses
                - milestones
            type: object
        InvoicesVatCodeInForce:
            description: One VAT code as a new line may take it, with the rate in force today. A draft holds only the code; the rate a line carries is resolved at issue for the issue date (D3).
            properties:
                code:
                    type: string
                ehfCategory:
                    description: The UNCL5305 category — S, Z, E, AE, G, O or K.
                    type: string
                exemptionReason:
                    description: The text printed under the VAT summary for a category other than S. Absent for S.
                    type: string
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                ratePercent:
                    format: double
                    type: number
                safTCode:
                    type: string
            required:
                - id
                - code
                - name
                - safTCode
                - ehfCategory
                - ratePercent
            type: object
        InvoicesConflictProblem:
            description: 'ProblemDetails plus this module''s refusal code (invoices foundation design D2-D8). code names the rule that refused — series_locked, vat_code_in_use, rate_change_in_past, rate_period_not_latest, rate_period_last, rate_period_in_use, invoice_issued, invoice_draft, customer_merged, customer_archived, customer_blocked, customer_missing, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed, buyer_incomplete, vat_code_inactive, vat_code_not_valid, vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line, credit_exceeds_invoice, credit_note_not_creditable, invoice_fully_credited, credit_note_no_payments, invoice_settled, payment_exceeds_open, payment_removed, customer_anonymised, no_invoice_email (invoices payments and delivery design D2, D4), kid_length_exceeded (EHF and KID design D3: the next number no longer fits the KID agreement, which was shortened), transmissions_active (EHF and KID design D7: the access-point credentials still serve a transmission in flight), ehf_unavailable (D7: no access-point credentials to verify — a 409 — or a stored key that cannot be opened — a 503; D8: an installation that cannot send as EHF — a 503), the send as EHF''s no_peppol_id, buyer_reference_missing, ehf_already_sent, peppol_not_receivable (with peppolRegistered and peppolCanReceive) and ehf_invalid (with rules) (EHF and KID design D8), transmission_not_cancellable and transmission_not_resolvable (D9), source_held_elsewhere (invoices work design D2: a source a save or the wizard would hold is held by another live draft or invoiced by an unreleased issued line; heldBy, sourceKind and sourceId name the document and the source), the wizard''s refusals (invoices work design D3, D4, D11; POST /invoices/from-work) — work_unavailable (no billable read is composed), too_many_sources (more than 5 000 sources on one document, an append target''s held ones counted), source_not_for_customer (a source''s project bills another customer or is gone), mixed_currency (the selection spans currencies), currency_not_nok (the selection is in another currency than NOK) and too_many_lines (the grouping would make more than 500 lines, with suggestedGrouping, the next coarser grouping that fits) — the issue''s refusals about the work it bills (invoices work design D1, each with linePosition, sourceKind and sourceId) — source_not_invoiceable, source_changed and source_already_invoiced (a source''s own module would not stamp it: no longer approved, ready or billable; changed since the draft took it; already invoiced), source_customer_changed (a source''s project no longer bills the draft''s customer, or is gone; judged before a number exists) and source_not_selectable (hours of a project now fixed-price or non-billable, or any work of a project now non-billable) — and projects_unavailable (the draft bills work and the projects module is switched off); a final settlement''s (invoices work design D7) deduction_exceeds_invoice (with linePosition: a deduction line takes more than its a-konto has left at its VAT code, or deducts a document that is no longer an issued invoice of this customer, or deducted at a code where it deducts itself), deduction_duplicated (with linePosition: a second deduction line for one deducted invoice and VAT code) and invoice_total_not_positive (a settlement''s gross is zero or less); a credit note''s credit_total_negative (its gross is below zero) and invoice_deducted (it credits more of an a-konto at a VAT code than no issued settlement deducted there; the detail names the settlements); credit_note_deducts_nothing (GET /invoices/{id}/deductible on a credit-note draft), and invoice_changed also when the draft''s work changed between the issue''s reads and its lock; the bank import''s (invoices payments and reminders design D3) bank_account_unknown (an account the file names is neither the seller''s nor one an issued invoice printed; the detail names its last four digits), bank_file_duplicate (the same bytes or the same file identity imported before, with bankFileId, uploadedAt and uploadedBy of that import) and bank_import_format_mismatch (the account''s files come in the other format; the detail names the account and its format); and storage_unavailable and mail_unavailable, which a 503 carries in the same shape, and mail_failed and peppol_lookup_failed, which a 502 carries. A revision conflict carries no code; its detail names both revisions.'
            properties:
                allowedIssueDates:
                    description: On issue_date_not_allowed, the dates this document may be issued with today, the earliest first. Absent otherwise.
                    items:
                        format: date
                        type: string
                    type: array
                bankFileId:
                    description: On bank_file_duplicate, the earlier import of the same file — the same bytes or the same file identity. Absent otherwise.
                    format: int64
                    type: integer
                chargesOutstanding:
                    description: On charge_payment_exceeds_outstanding, the invoice's charges outstanding — the fees and compensation its sent letters claimed and the latest letter's interest, less waivers and charge payments — which the charge payment exceeded. Absent otherwise.
                    format: double
                    type: number
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                halfYear:
                    description: On collection_rates_outdated, the half-year a letter needs a rate row for and has none, as 2027-H1 or 2027-H2. Absent otherwise.
                    type: string
                heldBy:
                    $ref: '#/components/schemas/InvoicesWorkHeldBy'
                instance:
                    nullable: true
                    type: string
                invoiceId:
                    description: On payment_exceeds_open answered by the exception queue's apply, the invoice whose open amount the allocation exceeded, beside openAmount. Absent otherwise.
                    format: int64
                    type: integer
                kind:
                    description: On collection_rates_outdated, the kind of the rate without a row — late_interest_percent or b2b_compensation_nok. Absent otherwise.
                    type: string
                lastBookedOn:
                    description: On bank_import_stale, the latest booking date of any imported bank file. Absent otherwise, and absent when no bank file was ever imported.
                    format: date
                    type: string
                linePosition:
                    description: On a refusal about one line (vat_code_inactive, vat_code_not_valid, credit_exceeds_line, deduction_exceeds_invoice, deduction_duplicated, and the issue's refusals about a source — the first line holding it), the line's position, 1-based. Absent otherwise.
                    format: int32
                    type: integer
                mergedInto:
                    description: On customer_merged, the customer the draft's customer was merged into. Absent otherwise.
                    format: int32
                    type: integer
                openAmount:
                    description: On payment_exceeds_open, the invoice's open amount the payment exceeded (gross − credited − paid). Absent otherwise.
                    format: double
                    type: number
                peppolCanReceive:
                    description: On peppol_not_receivable, whether the receiver accepts this document's type (an invoice or a credit note) on the Peppol network at the send's re-check. Absent otherwise.
                    type: boolean
                peppolRegistered:
                    description: On peppol_not_receivable, whether the receiver is registered on the Peppol network at all at the send's re-check. Absent otherwise.
                    type: boolean
                rules:
                    description: On ehf_invalid, every pre-check rule the document's EHF failed. Absent otherwise.
                    items:
                        $ref: '#/components/schemas/InvoicesEhfRule'
                    type: array
                sourceId:
                    description: On the issue's and the wizard's refusals about a source (source_not_invoiceable, source_changed, source_already_invoiced, source_customer_changed, source_not_selectable, source_not_for_customer, source_held_elsewhere), the source's id in its own module. Absent otherwise.
                    format: int64
                    type: integer
                sourceKind:
                    description: On the issue's and the wizard's refusals about a source, its kind — time.entry, expenses.entry or projects.milestone. Absent otherwise.
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                suggestedGrouping:
                    description: On too_many_lines, the next coarser grouping whose lines fit in 500 — date, person, work_type or project. Absent otherwise, and absent when none fits.
                    type: string
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
                uploadedAt:
                    description: On bank_file_duplicate, when the earlier import was uploaded. Absent otherwise.
                    format: date-time
                    type: string
                uploadedBy:
                    description: On bank_file_duplicate, the user who uploaded the earlier import. Absent otherwise.
                    format: uuid
                    type: string
            type: object
        InvoicesEhfRule:
            description: One pre-check rule a document's EHF failed (EHF and KID design D11) — id is the official Peppol BIS Billing 3.0 or EN 16931 rule id where there is one (PEPPOL-EN16931-R003, NO-R-001, …), else the module's own name for it (vat_category_k_unsupported); message says it in English.
            properties:
                id:
                    type: string
                message:
                    type: string
            required:
                - id
                - message
            type: object
        InvoicesEhfState:
            description: 'An issued document''s EHF state (EHF and KID design D10); absent on a draft. status is the latest transmission''s — queued, submitted, delivered, failed, unconfirmed or cancelled — or not_sent, and the four timestamps are the latest transmission''s. providerRef and reason (the last error, with e-mail addresses and Peppol identifiers taken out, at most 500 characters) are answered only to a caller with invoices:issue. canSend is what POST /invoices/{id}/send-ehf would answer without the network and without a render, and blockedBy names the first refusal when it would refuse: ehf_unavailable, customer_anonymised, no_peppol_id, buyer_reference_missing, ehf_already_sent, or ehf_invalid for a line in VAT category K. preference (the billing profile''s invoice delivery) and buyerPeppolId (the customer''s current Peppol id) are answered only by GET /invoices/{id}, only to a caller with invoices:issue, whether or not the installation can send e-mail, and are absent when the directory could not be read. transmissions is every transmission of the document, the newest first.'
            properties:
                blockedBy:
                    type: string
                buyerPeppolId:
                    type: string
                canSend:
                    type: boolean
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                preference:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                status:
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                transmissions:
                    items:
                        $ref: '#/components/schemas/InvoicesTransmission'
                    type: array
            required:
                - status
                - canSend
                - transmissions
            type: object
        InvoicesTransmission:
            description: 'One EHF transmission of an issued document (EHF and KID design D9): its identity, its state and when it reached each, the receiver it was addressed to, the SHA-256 of the UBL it carries, the resolution of an unconfirmed one — resolvedByUserId absent when the provider''s evidence resolved it — and ublUrl, where the stored UBL is downloaded. providerRef, reason and submitAttemptedAt are answered only to a caller with invoices:issue.'
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                deliveredAt:
                    format: date-time
                    type: string
                failedAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                idempotencyKey:
                    format: uuid
                    type: string
                provider:
                    type: string
                providerRef:
                    type: string
                queuedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                receiverParticipant:
                    type: string
                resolutionNote:
                    type: string
                resolvedByUserId:
                    format: uuid
                    type: string
                status:
                    type: string
                submitAttemptedAt:
                    description: When the worker last stamped the crash marker, immediately before it called the provider — absent while the transmission was never attempted, which is when a queued one can still be cancelled. Answered only to a caller with invoices:issue.
                    format: date-time
                    type: string
                submittedAt:
                    format: date-time
                    type: string
                ublSha256:
                    type: string
                ublUrl:
                    type: string
            required:
                - id
                - status
                - provider
                - idempotencyKey
                - receiverParticipant
                - ublSha256
                - queuedAt
                - ublUrl
            type: object
        InvoicesTransmissionResolution:
            description: 'POST /invoices/{id}/transmissions/{transmissionId}/resolve''s body (EHF and KID design D9): a person''s verdict on an unconfirmed transmission after checking with the provider — delivered or failed — and a note saying why, 1 to 500 characters once trimmed.'
            properties:
                note:
                    type: string
                outcome:
                    enum:
                        - delivered
                        - failed
                    type: string
            required:
                - outcome
                - note
            type: object
        InvoicesSettingsRequest:
            description: 'PUT /settings'' body, a full replace (D2). Every text field is trimmed; an empty string is "not set". organisationNumber is nine digits with a valid mod-11 check digit; bankAccount eleven digits with a valid mod-11 check digit (spaces and dots are dropped); iban passes mod-97 and bic is 8 or 11 characters, both optional; country is ISO 3166-1 alpha-2; defaultPaymentTermsDays is 0-365; defaultCurrency is NOK and only NOK in this phase; seriesStart is 1 to 9007199254740991 (2^53 − 1) and cannot change once anything is issued (409 series_locked). peppolId, kidLength and kidAlgorithm are required and nullable (EHF and KID design D2, D3): a body without them is a 400, so a client that predates them cannot clear them by leaving them out. kidLength and kidAlgorithm are a pair or both null; the next number to be issued — the counter''s, or seriesStart before the first issue — must fit in kidLength less one digits, else a 400 on kidLength. workVatCodes is required too (invoices work design D6; a body without it is a 400 on workVatCodes): the VAT code the uninvoiced view''s wizard pre-fills for each kind of work, each a code that exists and — when it differs from the stored one — is active, else a 400 on workVatCodes.hours, workVatCodes.expenses or workVatCodes.milestones. timesheetDefault and timesheetPersonLabel are required too (invoices work design D5; a body without either, or with null, is a 400 on it): whether a new draft — the wizard''s or one created by hand — carries a timesheet unless its request says, and how the timesheet names each person — initials, number or name, anything else a 400 on timesheetPersonLabel. revision is the one the caller read: a stale one is a 409 naming both.'
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                kidAlgorithm:
                    description: mod10 or mod11, the KID check digit the bank agreed (D3); null with kidLength null for no agreement.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                kidLength:
                    description: The agreed KID length including the check digit, 4-25 (D3); null with kidAlgorithm null for no agreement.
                    format: int32
                    nullable: true
                    type: integer
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                legalName:
                    type: string
                organisationNumber:
                    type: string
                peppolId:
                    description: The seller's Peppol participant id (D2), a four-digit scheme, a colon and an identifier, such as 0192:974760673; a 0192 id is the seller's own organisation number. Null or empty defaults it to 0192 and the organisation number when that is set.
                    nullable: true
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                postalCode:
                    type: string
                revision:
                    format: int32
                    type: integer
                seriesStart:
                    format: int64
                    maximum: 9007199254740991
                    type: integer
                timesheetDefault:
                    description: Whether a new invoice draft carries a timesheet unless its request says (invoices work design D5). Required — a body without it is a 400 on timesheetDefault.
                    type: boolean
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                timesheetPersonLabel:
                    description: How a timesheet names each person (invoices work design D5) — initials (the display name's initials, a second KN becoming KN2), number (Person 1, Person 2 in order of first appearance on the timesheet) or name (the display name). Required; anything else is a 400 on timesheetPersonLabel.
                    type: string
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
                vatRegistered:
                    type: boolean
                workVatCodes:
                    description: The VAT code each kind of work is invoiced at (invoices work design D6), each the id of an active code — a changed one; one kept as stored passes even if it has since become inactive. Required — a body without it is a 400 on workVatCodes, so a client that predates it cannot reset the codes by leaving it out.
                    properties:
                        expenses:
                            format: int32
                            type: integer
                        hours:
                            format: int32
                            type: integer
                        milestones:
                            format: int32
                            type: integer
                    required:
                        - hours
                        - expenses
                        - milestones
                    type: object
                    x-go-type: json.RawMessage
                    x-go-type-skip-optional-pointer: true
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - postalCode
                - city
                - country
                - bankAccount
                - defaultPaymentTermsDays
                - defaultCurrency
                - seriesStart
                - peppolId
                - kidLength
                - kidAlgorithm
                - workVatCodes
                - timesheetDefault
                - timesheetPersonLabel
                - revision
            type: object
        InvoicesSettingsResponse:
            description: The seller record and the series start (D2). A text field that is not set is the empty string. seriesLocked is true once anything is issued; from then on seriesStart cannot change, and every other field still can — issued documents keep their own seller snapshot. peppolId is the seller's address on the Peppol network, read when a document is sent, never part of the snapshot; kidLength and kidAlgorithm are the KID agreement, which an issued invoice's kid was computed under.
            properties:
                addressLine1:
                    type: string
                addressLine2:
                    type: string
                bankAccount:
                    type: string
                bic:
                    type: string
                city:
                    type: string
                country:
                    type: string
                defaultCurrency:
                    type: string
                defaultPaymentTermsDays:
                    format: int32
                    type: integer
                email:
                    type: string
                footerText:
                    type: string
                iban:
                    type: string
                inForetaksregisteret:
                    type: boolean
                kidAlgorithm:
                    description: mod10 or mod11; null without a KID agreement.
                    nullable: true
                    type: string
                kidLength:
                    description: The agreed KID length including the check digit; null without a KID agreement.
                    format: int32
                    nullable: true
                    type: integer
                legalName:
                    type: string
                missingSellerFields:
                    description: What issuing still needs, as GET /meta names it.
                    items:
                        type: string
                    type: array
                organisationNumber:
                    type: string
                peppolId:
                    description: The seller's Peppol participant id; null when neither set nor derivable from the organisation number.
                    nullable: true
                    type: string
                postalCode:
                    type: string
                nextNumber:
                    description: The number the next issue takes — the counter's next once anything is issued, else seriesStart (the same figure the KID agreement's fit is judged against).
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
                seriesLocked:
                    type: boolean
                seriesStart:
                    format: int64
                    type: integer
                timesheetDefault:
                    description: Whether a new invoice draft carries a timesheet unless its request says (invoices work design D5); false until changed.
                    type: boolean
                timesheetPersonLabel:
                    description: How a timesheet names each person (invoices work design D5) — initials (the default), number or name — applied when its rows are written.
                    enum:
                        - initials
                        - number
                        - name
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                vatRegistered:
                    type: boolean
                warnings:
                    description: Never refusals. kid_headroom_low — the next number leaves fewer than two digits of the KID agreement's length (a hundredfold growth) before issuing is refused with kid_length_exceeded.
                    items:
                        type: string
                    type: array
                workVatCodes:
                    $ref: '#/components/schemas/InvoicesWorkVatCodes'
            required:
                - legalName
                - organisationNumber
                - vatRegistered
                - inForetaksregisteret
                - addressLine1
                - addressLine2
                - postalCode
                - city
                - country
                - bankAccount
                - iban
                - bic
                - email
                - defaultPaymentTermsDays
                - defaultCurrency
                - footerText
                - seriesStart
                - seriesLocked
                - nextNumber
                - peppolId
                - kidLength
                - kidAlgorithm
                - missingSellerFields
                - warnings
                - workVatCodes
                - timesheetDefault
                - timesheetPersonLabel
                - revision
                - updatedAt
            type: object
        InvoicesAccessPointRequest:
            description: 'PUT /settings/access-point''s body (EHF and KID design D7). provider is storecove, the one provider so far; legalEntityId is the Storecove legal entity documents are sent as, a positive integer; apiKey is the provider''s API key — omitted or null keeps the stored one, which is required the first time, and an empty or blank one is a 400. The key is sealed by the secrets box and never answered.'
            properties:
                apiKey:
                    nullable: true
                    type: string
                legalEntityId:
                    format: int64
                    type: integer
                provider:
                    type: string
            required:
                - provider
                - legalEntityId
            type: object
        InvoicesAccessPointResponse:
            description: The stored access-point credentials as a client may see them — never the key. provider and legalEntityId are absent only on GET /invoices/settings/access-point when none are stored, which also answers hasCredentials false. hasCredentials is whether a key is stored; rejectedAt is when the provider first refused it (a 401 or 403, or a stored key the server could not open), absent while it has not, cleared by a new PUT and by the next call the provider accepts.
            properties:
                hasCredentials:
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                provider:
                    type: string
                rejectedAt:
                    format: date-time
                    type: string
            required:
                - hasCredentials
            type: object
        InvoicesAccessPointVerifyResponse:
            description: 'What the provider answered the cheapest authenticated read (Storecove: the legal entity). result is ok (the key reaches the legal entity), unauthorized (the provider refused the key — 401 or 403 — which also flags it as rejected) or unreachable (anything else: the network, a timeout, a 5xx, a legal entity the key does not reach).'
            properties:
                result:
                    type: string
            required:
                - result
            type: object
        InvoicesCollectionRate:
            description: One statutory rate as a dated row (invoices payments and reminders design D6), in force from validFrom until the next row of its kind. seeded rows came with a release and have no createdBy; a user adds later ones ahead of a release. releaseValue and releaseSourceRef are what a later release seeded for this kind and date over a user's row, equal or not — while releaseValue differs from value the list warns collection_rate_differs_from_release. inForce is whether the row is the one in force today (Oslo). usable is false once a printed or sent letter dated on or after validFrom and before the next row of the kind has relied on it; a row in force, a used row and a seeded row cannot be deleted.
            properties:
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    description: The user who added the row; absent on a seeded row.
                    format: uuid
                    type: string
                id:
                    format: int64
                    type: integer
                inForce:
                    type: boolean
                kind:
                    description: late_interest_percent (the forsinkelsesrente, percent a year, set per half-year), b2b_compensation_nok (the § 3a compensation, NOK, set per half-year) or inkassosats (NOK).
                    enum:
                        - late_interest_percent
                        - b2b_compensation_nok
                        - inkassosats
                    type: string
                releaseSourceRef:
                    description: The regulation a release seeded over this user's row; absent when none did.
                    type: string
                releaseValue:
                    description: The value a release seeded over this user's row; absent when none did.
                    format: double
                    type: number
                seeded:
                    type: boolean
                sourceRef:
                    description: The regulation the value comes from, such as FOR-2026-06-25-1372.
                    type: string
                usable:
                    type: boolean
                validFrom:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            required:
                - id
                - kind
                - validFrom
                - value
                - sourceRef
                - seeded
                - inForce
                - usable
                - createdAt
            type: object
        InvoicesCollectionRateList:
            description: Every collection rate by kind and date (D6), and the list's warnings — collection_rate_differs_from_release while any row's releaseValue differs from its value.
            properties:
                rates:
                    items:
                        $ref: '#/components/schemas/InvoicesCollectionRate'
                    type: array
                warnings:
                    items:
                        enum:
                            - collection_rate_differs_from_release
                        type: string
                    type: array
            required:
                - rates
                - warnings
            type: object
        InvoicesCollectionRateRequest:
            description: 'POST /collection-rates'' body (D6): a rate a user adds ahead of a release. validFrom is after today (Oslo); late_interest_percent and b2b_compensation_nok start on 1 January or 1 July; value has at most two decimals and is within its kind''s bounds — late_interest_percent 0.01-30, b2b_compensation_nok 100-2000, inkassosats 100-5000; sourceRef is the regulation, 1-100 characters. Each is a 400 on its field; a row of the same kind and date is a 409 collection_rate_exists.'
            properties:
                kind:
                    enum:
                        - late_interest_percent
                        - b2b_compensation_nok
                        - inkassosats
                    type: string
                sourceRef:
                    type: string
                validFrom:
                    format: date
                    type: string
                value:
                    format: double
                    type: number
            required:
                - kind
                - validFrom
                - value
                - sourceRef
            type: object
        InvoicesReminderPolicy:
            description: Whether a customer is reminded and charged (D7). normal (letters as the reminder settings make them), no_charges (letters without fee, compensation or interest) or none (no letter at all; the invoice is still listed overdue). A customer without a policy is normal with an empty note and neither updatedAt nor updatedBy.
            properties:
                customerId:
                    format: int32
                    type: integer
                mode:
                    enum:
                        - normal
                        - no_charges
                        - none
                    type: string
                note:
