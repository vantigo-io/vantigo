                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — reason empty or over 200 characters, or withdrawnOn after today or before the hand-off''s handedOn.
                "401":
                    content:
                        application/json:
