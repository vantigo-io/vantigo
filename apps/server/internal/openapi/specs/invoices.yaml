    /api/v1/invoices/{id}:
        delete:
            description: Deletes a draft, its lines with it. An issued document is never deleted (409 invoice_issued).
            operationId: deleteInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued.
            summary: Delete a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
        get:
            description: One document with its lines, VAT summaries, warnings and credit links. On an invoice draft that bills work, a caller holding invoices:create is also told which of its sources changed or are no longer invoiceable (source_changed, source_not_invoiceable), read by id through the source modules' billable reads; a module that is off is not judged, and a read that fails leaves the warnings out (invoices work design D2).
            operationId: getInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
            summary: Get an invoice or a credit note
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
        put:
            description: Replaces a draft whole, with revision (D4). Only a draft is edited (409 invoice_issued otherwise). A credit-note draft changes only what D8 allows — lines removed, a quantity or a unit price lowered, a description, the note and the internal note — and anything else — another customer, currency, delivery, place of delivery or reference, payment terms, a line's VAT code or unit changed, a quantity or unit price raised, a discount lowered, a line added or one credited twice — is a 400 on the field, and so is a line naming sources or deductsInvoiceId, or refreshSources; a credit line's quantity is negative exactly when the line it credits is a deduction line (invoices work design D7), compared with it by magnitude and of the same sign; its revision is checked first, so a stale copy is the revision 409. On an invoice draft that holds work (invoices work design D2) every line names its sources — absent is a 400 on lines[i].sources, [] drops — each one the draft holds, once — a save never adds work. A source left out of every line, on a removed line or under a changed customer is dropped and named in releasedSources. refreshSources re-reads the held work first.
            operationId: putInvoicesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesInvoiceRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — a field did not pass; the errors name it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — invoice_issued, a customer gate, a stale revision, invoice_changed (refreshSources, when the held work changed between its read and the save's lock) or deduction_duplicated (with linePosition; invoices work design D7).
            summary: Replace a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:create
    /api/v1/invoices/{id}/issue:
        post:
            description: 'Issues a draft — an invoice or a credit note — into the next number of the one series (D6). An invoice''s billing profile is read first (a credit note reads no directory) and, when the invoice bills work, its projects and the issuer''s name (invoices work design D1); then one transaction locks the document, shares the settings row, allocates the number, and only then checks every rule, so any refusal rolls the number back with it. Under a KID agreement an invoice gets its kid from the allocated number; a number the agreement no longer fits is 409 kid_length_exceeded, rolled back like every refusal. The work an invoice bills is then marked invoiced by its modules (time, expenses, projects) inside the same transaction, before the document is written: a source a module will not stamp refuses the issue, rolled back with the number and every module''s stamp. The response is the issued document with its warnings (issued_late). The PDF is stored after the commit; pdfStored false means storing it failed and the next download stores it.'
            operationId: postInvoicesByIdIssue
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesIssueRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the issued document.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — the body did not decode (none at all, or an issueDate that is not a calendar date).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — invoice_issued, invoice_changed, seller_incomplete, no_lines, delivery_date_missing, issue_date_not_allowed (with allowedIssueDates), customer_merged, customer_archived, customer_blocked, customer_missing, buyer_incomplete, vat_code_inactive and vat_code_not_valid (with linePosition), vat_not_registered, category_o_not_allowed, reverse_charge_needs_org_number, vat_codes_ambiguous, credit_exceeds_line (with linePosition), credit_exceeds_invoice, credit_total_negative or invoice_deducted (a credit note of an a-konto a settlement deducted; invoices work design D7); for a final settlement deduction_exceeds_invoice (with linePosition; the cap is read after the number, the deducted invoices never locked) and invoice_total_not_positive; for an invoice that bills work, projects_unavailable, source_customer_changed (before a number), source_not_selectable, and a holder''s source_not_invoiceable, source_changed or source_already_invoiced (each with linePosition, sourceKind and sourceId).'
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, before any number is allocated. An issued number whose PDF can never be stored is not allowed to exist.
            summary: Issue a draft
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/pdf:
        get:
            description: 'An issued document''s PDF (D7), always the stored object: rendered and stored once when it has no hash yet, then streamed; otherwise read whole and verified against its SHA-256. It is never re-rendered once stored. Named faktura-<number>.pdf or kreditnota-<number>.pdf, invoice-<number>.pdf or credit-note-<number>.pdf in English.'
