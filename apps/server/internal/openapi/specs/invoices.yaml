                    type: integer
                firstBookedOn:
                    format: date
                    type: string
                format:
                    type: string
                id:
                    format: int64
                    type: integer
                ignored:
                    format: int32
                    type: integer
                ignoredKinds:
                    $ref: '#/components/schemas/InvoicesBankIgnored'
                lastBookedOn:
                    format: date
                    type: string
                matched:
                    format: int32
                    type: integer
                pending:
                    format: int32
                    type: integer
                sha256:
                    type: string
                transactions:
                    format: int32
                    type: integer
