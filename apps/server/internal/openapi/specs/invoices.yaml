                    format: int64
                    type: integer
                - in: path
                  name: transmissionId
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesTransmissionResolution'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesInvoiceResponse'
                    description: OK — the document, the transmission resolved.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — outcome is not delivered or failed, or the note is empty or over 500 characters.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the transmission is not that document's.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — transmission_not_resolvable.
            summary: Resolve an unconfirmed EHF transmission
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:issue
    /api/v1/invoices/{id}/transmissions/{transmissionId}/ubl:
        get:
            description: 'The UBL an EHF transmission carries (EHF and KID design D10), as stored when it was queued and verified against its SHA-256. A stored object that is gone or altered is a 500, never rendered again.'
            operationId: getInvoicesByIdTransmissionsByTransmissionIdUbl
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: path
                  name: transmissionId
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/xml:
                            schema:
                                format: binary
                                type: string
                    description: OK — the UBL, with a Content-Disposition naming it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no document has that id, or the transmission is not that document's.
                "500":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Internal Server Error — the stored UBL is gone, or its bytes no longer match the hash.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, the object store is not configured or could not be read.
            summary: Download an EHF transmission's UBL
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/bank-files:
        get:
            description: The imported bank files, newest first (D3), each with its lines counted by status — a file with pending lines has some not yet matched. page and pageSize are the codebase's paging, 25 by default, at most 100.
            operationId: getInvoicesBankFiles
            parameters:
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesBankFile'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the imported bank files
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
        post:
            description: 'Imports an OCR giro or camt.054 (.001.02 or .001.08) file of incoming payments (invoices payments and reminders design D3), all or nothing, in order: the one multipart part named file, at most 10 MiB; its format detected; the file parsed and checked against its own control totals, every booking day on or before today in Oslo and not before 2000, at most 5 000 transactions, every booked amount in NOK; every account it names the seller''s bank account or one an issued document printed (409 bank_account_unknown); the same bytes or the same file identity imported before (409 bank_file_duplicate, naming the earlier import); the bytes stored once in the object store under bank-files/<sha256>.<ocr|xml>, outside any transaction (503 storage_unavailable without one); then one transaction — the file''s accounts first, in account order, the first import of an account setting its format, a file of the other format refused (409 bank_import_format_mismatch); the file row; every line in one insert ordered by fingerprint, a line an earlier or overlapping file already brought kept as a duplicate row linked to it. Once that commits, every line that is not a duplicate is matched on its KID (D4), each in a transaction of its own, the uploader registering the payments; a line matching stops on before it ends is left pending.'
            operationId: postInvoicesBankFiles
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            properties:
                                file:
                                    format: binary
                                    type: string
                            required:
                                - file
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankImportResult'
                    description: Created — the file imported, and what became of its lines.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'file' — no part named file or two of them, an empty part, a part or a body past 10 MiB, not an OCR giro or camt.054 file, or a file its own rules refuse (the message names the record or the element). Nothing is stored. A body that is not multipart at all is a bare 400.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Conflict — bank_account_unknown (the detail names the account's last four digits), bank_file_duplicate (with bankFileId, uploadedAt and uploadedBy of the earlier import) or bank_import_format_mismatch (the detail names the account and its format). Nothing is written.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: Service Unavailable — storage_unavailable, before anything is written. A bank file is the documentation of the payments booked from it, kept like the PDFs.
            summary: Import a bank file
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-files/{id}:
        get:
            description: One imported bank file and every line it brought, duplicates included, in the order they were stored (D3).
            operationId: getInvoicesBankFilesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankFileDetail'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no bank file has that id.
            summary: Get an imported bank file
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-files/{id}/match:
        post:
            description: 'Matches the file''s pending lines on their KID (invoices payments and reminders design D3, D4), the caller registering the payments — what finishes a file whose import stopped matching early. Each line is classified on the pool first, in order — a reversal, a negative amount, a possible duplicate (the account''s cutover, or the same account, booking day, amount and KID already paid from another file), a Vipps payout, no KID, a KID that is not valid, a KID no issued invoice carries, an invoice on another account — and queued with that reason; otherwise it is matched in one transaction of its own: the line, then its invoice, locked, and every figure read after them — the same payment seen again under the lock is queued possible_duplicate; a credited invoice, a payment booked before the issue day, a settled invoice and more than is open and its charges outstanding are queued; otherwise a payment of up to the open amount and a charge payment of the rest, the line matched, and a reminder fee claimed after a deadline the payment''s ordering day met waived deadline_met. A line already matched or queued is left as it is. Matching stops at the first error or when the request ends; what is left stays pending.'
            operationId: postInvoicesBankFilesByIdMatch
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankImportResult'
                    description: OK — the file as it now stands, and what this request matched and queued.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no bank file has that id.
            summary: Match a bank file's pending lines
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions:
        get:
            description: 'The bank lines and the exception queue (invoices payments and reminders design D5): every line, filtered by status (pending, matched, exception, resolved or duplicate), reason, bankFileId and the booking days from and to (inclusive); unapplied=true keeps only matched and resolved lines with an unapplied rest — never one whose payment a reversal took back, and a dismissed one only when it was queued invoice_credited, invoice_settled or exceeds_open. The open lines — pending, exception and duplicate — first, each group oldest booking day first, then by id. Each line carries its file, the payments and charge payments that refer to it, its unappliedAmount, its suggestions while it is an exception the suggestions are for, the line a possible duplicate may repeat, and its events. page and pageSize are the codebase''s paging, 25 by default, at most 100.'
            operationId: getInvoicesBankTransactions
            parameters:
                - in: query
                  name: status
                  schema:
                    enum:
                        - pending
                        - matched
                        - exception
                        - resolved
                        - duplicate
                    type: string
                - in: query
                  name: reason
                  schema:
                    $ref: '#/components/schemas/InvoicesBankTransactionReason'
                - in: query
                  name: bankFileId
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: unapplied
                  schema:
                    type: boolean
                - in: query
                  name: from
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfInvoicesBankTransaction'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — paging out of range, or from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the bank lines and the exception queue
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/apply:
        post:
            description: 'Applies an exception to one or more invoices and their charges (D5), the caller registering, in order: 400 on the fields — 1 to 20 allocations, each invoice once, amount and chargesAmount 0 or more with two decimals and their sum above 0, the note at most 500 characters; 404; 409 bank_transaction_not_open unless the line is an exception; 409 bank_transaction_not_applicable for a reversal or a negative line. Then one transaction: the line FOR NO KEY UPDATE, its state judged again, 409 bank_transaction_reversed when it was kept as a duplicate of a line whose payment a reversal took back, then the invoices FOR UPDATE in descending id, and per invoice after its lock — allocation_not_an_invoice (no issued invoice), payment_exceeds_open (with invoiceId and openAmount), charge_payment_exceeds_outstanding (with chargesOutstanding), paid_before_issue (the line was booked before the invoice''s issue day) — and allocation_exceeds_transaction when the allocations add up to more than the line''s amount less what is already applied from it. Any refusal rolls the whole apply back. Each allocation registers a payment of its amount and a charge payment of its chargesAmount, each when above 0, as a match does (the file''s format, the line, paid on its booking day, the KID as reference), and waives deadline_met what the payment shows was claimed after a met deadline; the line becomes resolved, applied, with an applied event. What the allocations leave of the line stays visible as its unappliedAmount — no credit balance, no refund.'
            operationId: postInvoicesBankTransactionsByIdApply
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankTransactionApplyRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — on allocations (none, more than 20, an invoice twice), on allocations[n].amount or allocations[n].chargesAmount (below 0, more than two decimals, or both 0), or on note (more than 500 characters).'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_open, bank_transaction_not_applicable, bank_transaction_reversed (the line was kept as a duplicate of a reversed line), allocation_not_an_invoice, payment_exceeds_open (with invoiceId and openAmount), charge_payment_exceeds_outstanding (with chargesOutstanding), paid_before_issue or allocation_exceeds_transaction. Nothing is written.'
            summary: Apply a bank line to invoices
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/dismiss:
        post:
            description: 'Dismisses an exception as not a customer payment (D5) — a Vipps payout, a payment refunded outside Vantigo, another system''s KID: 400 on note (1 to 500 characters); 404; 409 bank_transaction_not_open unless the line is an exception; 409 bank_transaction_not_applicable for a reversal, which is handled instead. The line alone is locked, FOR NO KEY UPDATE, and its state judged again under it; it becomes resolved, not_customer_payment, the note kept, with a dismissed event.'
            operationId: postInvoicesBankTransactionsByIdDismiss
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankTransactionDismissRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — on note, empty or more than 500 characters.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_open or bank_transaction_not_applicable. Nothing is written.'
            summary: Dismiss a bank line as not a customer payment
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/handle-reversal:
        post:
            description: 'Handles a reversal (D5): the payments it takes back are removed, or none with a reason. In order: 400 on the fields — at most 20 payments, each once, not both payments and noPayment, the note at most 500 characters; 404; 409 bank_transaction_not_open unless the line is an exception; 409 bank_transaction_not_applicable unless it is queued reversal; 409 reversal_payment_required when no payment is named and noPayment with a note is not given. Then one transaction: the line FOR NO KEY UPDATE, its state judged again, then the named payments'' invoices FOR UPDATE in descending id, and each payment removed by the removal''s own rules — 404 a payment that is not its invoice''s, 409 payment_removed one already removed — with the reason "Reversed by the bank: line {lineRef}", and the line each removed payment came from given a reversed event, so its money is never applied again. The line becomes resolved, reversal_handled, with a reversal_handled event. Nothing links a reversal to a payment by itself.'
            operationId: postInvoicesBankTransactionsByIdHandleReversal
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankTransactionReversalRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — on removePayments (more than 20, a payment twice), on noPayment (given with payments), or on note (more than 500 characters).'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id, or a named payment is not its invoice''s.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_open, bank_transaction_not_applicable, reversal_payment_required or payment_removed. Nothing is written.'
            summary: Handle a reversed bank line
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/confirm-duplicate:
        post:
            description: 'Confirms a duplicate (D5): a duplicate row, or an exception queued possible_duplicate, becomes resolved, duplicate_confirmed, its reason possible_duplicate — so a reopen lands on a reason — the note kept, with a duplicate_confirmed event. 400 on note (more than 500 characters); 404; 409 bank_transaction_not_open unless the line is an exception or a duplicate; 409 bank_transaction_not_applicable for an exception with another reason. The line alone is locked, FOR NO KEY UPDATE, and its state judged again under it.'
            operationId: postInvoicesBankTransactionsByIdConfirmDuplicate
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankTransactionNoteRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: 'Bad Request — on note, more than 500 characters.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_open or bank_transaction_not_applicable. Nothing is written.'
            summary: Confirm a bank line a duplicate
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/treat-as-distinct:
        post:
            description: 'Keeps a duplicate row as a payment of its own (D5): it becomes an exception queued possible_duplicate, so it can be applied, with a treated_as_distinct event; its duplicateOfId stays, and it stays out of the fingerprint''s unique index. The invoice its KID names, or else the one unambiguous suggestion, becomes its suggested invoice. 404; 409 bank_transaction_not_applicable for an exception; 409 bank_transaction_not_open for any other line that is not a duplicate; then under the lock 409 bank_transaction_reversed when the line it duplicates had a payment reversed — the same transaction, whose money went back. The line alone is locked, FOR NO KEY UPDATE, and its state judged again under it.'
            operationId: postInvoicesBankTransactionsByIdTreatAsDistinct
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_open, bank_transaction_not_applicable or bank_transaction_reversed. Nothing is written.'
            summary: Treat a duplicate bank line as distinct
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-transactions/{id}/reopen:
        post:
            description: 'Returns a line to the queue (D5): a resolved line back to an exception with its reason, or a matched line whose payments and charge payments were all removed to an exception queued payment_removed. Its resolution, who, when and the note, are cleared on the line and kept in its events, with a reopened event; a line without a suggested invoice gets the invoice its KID names, or the one unambiguous suggestion. 404; 409 bank_transaction_not_applicable for a line that is pending, an exception or a duplicate; 409 bank_transaction_applied while any live payment or charge payment refers to it — remove them first; 409 bank_transaction_reversed when a reversal took back one of its payments. The line alone is locked, FOR NO KEY UPDATE, and every figure read under it.'
            operationId: postInvoicesBankTransactionsByIdReopen
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankTransaction'
                    description: OK — the line as it now stands, with its events.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: 'Not Found — no bank line has that id.'
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InvoicesConflictProblem'
                    description: 'Conflict — bank_transaction_not_applicable, bank_transaction_applied or bank_transaction_reversed. Nothing is written.'
            summary: Reopen a bank line
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-accounts:
        get:
            description: Every receiving account a bank file was imported for (D3), in account order, with its format, the previous format and cutover a change kept, its latest file and the latest booking day of its lines.
            operationId: getInvoicesBankAccounts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankAccountsResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List the bank import accounts
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/bank-accounts/{account}/format:
        put:
            description: 'Changes the format an account''s bank files come in (D3): the account''s row locked; the same format answers the account unchanged; another keeps the old one as previousFormat with cutoverThrough, the latest booking day of the account''s own lines in the old format (absent when it has none), and sets the new one — matching then holds back a line of the new format booked on or before the cutover, which the old format may already have registered (D4). A change of bank is a new account, with its own row.'
            operationId: putInvoicesBankAccountsByAccountFormat
            parameters:
                - in: path
                  name: account
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvoicesBankAccountFormatRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesBankAccount'
                    description: OK — the account as it now stands.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request — on 'format', neither ocr nor camt054; or a body that did not decode.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no bank file was ever imported for that account.
            summary: Change an account's bank file format
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:manage
    /api/v1/invoices/journal:
        get:
            description: The invoice journal (D11) — what proves complete registration (§ 5-1-3). from and to are issue dates, both required, from on or before to; page and pageSize are the list's.
            operationId: getInvoicesJournal
            parameters:
                - in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesJournalResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or paging out of range.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: The invoice journal
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/export.csv:
        get:
            description: 'The accountant''s CSV export (payments and delivery design D5): the issued documents whose issue date is from-to — the journal''s own selection — one row per document and VAT row, in number order and in each document by category then rate, a credit note negative in every amount. UTF-8 with a byte order mark, semicolons, the decimal comma, YYYY-MM-DD, CRLF after every row, RFC 4180 quoting, and the formula guard on the text columns only. The header row is Number;Kind;Issue date;Delivery;Due;Customer number;Buyer;Buyer org no;Currency;SAF-T code;Rate;Base;VAT;Base NOK;VAT NOK;Credits number;KID;Project — KID an invoice''s KID (EHF and KID design D3), Project the document''s project reference (invoices work design D9), each empty where there is none. from and to are both required, from on or before to; a period of more than 5000 rows is refused, never cut short.'
            operationId: getInvoicesExportCsv
            parameters:
                - description: The first issue date to include.
                  in: query
                  name: from
                  required: true
                  schema:
                    format: date
                    type: string
                - description: The last issue date to include.
                  in: query
                  name: to
                  required: true
                  schema:
                    format: date
                    type: string
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named invoices-<from>-<to>.csv (the period's two dates, YYYY-MM-DD), and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from or to missing or not a calendar date, from after to, or more than 5000 rows, which asks for a narrower period.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export the issued documents as CSV
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
    /api/v1/invoices/collection-export.csv:
        get:
            description: 'The collection agency''s file (invoices payments and reminders design D11): one row per invoice, either the invoices with a live hand-off whose handedOn is from handedFrom to handedTo (both required together), or the issued invoices named by invoiceId (repeatable, 1-500) — exactly one of the two selections; 400 otherwise, for an invoiceId that is not an issued invoice, or past 500 rows, never cut short. The module''s CSV form (GET /invoices/export.csv): UTF-8 with a byte order mark, semicolons, the decimal comma, YYYY-MM-DD, CRLF after every row, RFC 4180 quoting, and the formula guard on the text columns only. The header row is Invoice number;Issue date;Due date;Delivery;Delivered;KID;Customer number;Debtor;Debtor type;Org no;Foreign id;Address line 1;Address line 2;Postal code;City;Country;E-mail;Gross;Credited;Paid;Principal open;Payments;Fees claimed;Compensation claimed;Charges waived;Interest rate;Interest from;Interest to;Interest accrued;Charges paid;Letters;Notice sent;Notice deadline;Disputed;Handed on;Agency;Agency reference — the principal apart from the charges: Fees claimed and Compensation claimed are the sent letters'' net of waivers, Charges waived every waiver''s total, Interest accrued the late interest to today (Interest to) less what was waived, at the rate in force today from Interest from, and Charges paid the live charge payments. Delivered is the first recorded delivery, its kind and day; Debtor and the address the buyer snapshot''s; E-mail the customer''s reminder address, read from the customer directory before any query (empty when the read fails, logged at warn); Payments and Letters compact lists; Disputed yes while a hold is live. No national identity number is held.'
            operationId: getInvoicesCollectionExportCsv
            parameters:
                - description: The first hand-off day to include, with handedTo.
                  in: query
                  name: handedFrom
                  required: false
                  schema:
                    format: date
                    type: string
                - description: The last hand-off day to include, with handedFrom.
                  in: query
                  name: handedTo
                  required: false
                  schema:
                    format: date
                    type: string
                - description: An issued invoice to include; repeat for each, at most 500.
                  explode: true
                  in: query
                  name: invoiceId
                  required: false
                  schema:
                    items:
                        format: int64
                        type: integer
                    type: array
                  style: form
            responses:
                "200":
                    content:
                        text/csv:
                            schema:
                                format: binary
                                type: string
                    description: OK — served as an attachment named invoices-collection-<today>.csv (YYYY-MM-DD), and never cached.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — neither selection or both, one hand-off date without the other or handedFrom after handedTo, more than 500 invoiceIds or one that is not an issued invoice, or more than 500 rows.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Export invoices for a collection agency as CSV
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access+invoices:payments
    /api/v1/invoices/stats/summary:
        get:
            description: The dashboard's invoices card (payments and delivery design D7). from and to are instants, as every module's summary takes them; to defaults to now and from to 30 days before to, and from after to is a 400.
            operationId: getInvoicesStatsSummary
            parameters:
                - in: query
                  name: from
                  schema:
                    format: date-time
                    type: string
                - in: query
                  name: to
                  schema:
                    format: date-time
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InvoicesStatsSummaryResponse'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/ProblemDetails
                    description: Bad Request — from after to.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Get the invoices dashboard summary
            tags:
                - Invoices
            x-vantigo-access: permission:invoices:access
