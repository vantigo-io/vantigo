                format:
                    type: string
                lastBookedOn:
                    format: date
                    type: string
                lastFileId:
                    format: int64
                    type: integer
                lastUploadedAt:
                    format: date-time
                    type: string
                previousFormat:
                    type: string
                setAt:
                    format: date-time
                    type: string
                setBy:
