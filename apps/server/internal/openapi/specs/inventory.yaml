components:
    schemas:
        InventoryActor:
            additionalProperties: false
            description: Who posted, as snapshotted when they did.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - displayName
            type: object
        InventoryAddress:
            additionalProperties: false
            description: A site's postal address; every field optional.
            properties:
                city:
                    maxLength: 100
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    minLength: 2
                    type: string
                line1:
                    maxLength: 200
                    type: string
                line2:
                    maxLength: 200
                    type: string
                postalCode:
                    maxLength: 20
                    type: string
            type: object
        InventoryAdjustmentInput:
            additionalProperties: false
            description: 'An adjustment (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryAdjustmentLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - reason
                - lines
            type: object
        InventoryAdjustmentLine:
            additionalProperties: false
            description: change adds quantity, signed and not 0, to what lies there; set makes it the new on hand, 0 or more, and is posted as the difference — a line whose difference is 0 is dropped (I15). Exactly one of quantity and entered is given. Entered under change adds, or takes away with decrease.
            properties:
                decrease:
                    description: 'With entered under change: the entered quantity is taken away rather than added.'
                    type: boolean
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                lotId:
                    description: 'The lot the line takes or puts (manufacturing phase 2 M59): required for a tracked variant, refused for an untracked one (lot_not_allowed).'
                    format: int64
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryNewLot'
                mode:
                    enum:
                        - change
                        - set
                    type: string
                quantity:
                    description: Signed under change, at most three decimals.
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
                - mode
            type: object
        InventoryAdjustmentReason:
            enum:
                - correction
                - damaged
                - lost
                - found
                - opening_balance
                - other
            type: string
        InventoryBalanceLot:
            additionalProperties: false
            description: 'What lies of one lot on one location (manufacturing phase 2 M63): a stock row''s lots, in FEFO order — expiry first, none last, then received.'
            properties:
                bestBefore:
                    format: date
                    nullable: true
                    type: string
                expired:
                    description: The expiry is before today in the workspace zone (M62).
                    type: boolean
                expiry:
                    format: date
                    nullable: true
                    type: string
                lotId:
                    format: int64
                    type: integer
                number:
                    type: string
                onHand:
                    format: double
                    type: number
                receivedAt:
                    description: When the lot was first received; FEFO's second key, after the expiry (M65).
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryLotStatus'
            required:
                - lotId
                - number
                - status
                - expired
                - onHand
                - receivedAt
            type: object
        InventoryBalanceRow:
            additionalProperties: false
            description: What lies of one variant on one location.
            properties:
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                lots:
                    description: 'A tracked variant''s lots on the location, in FEFO order (manufacturing phase 2 M63); set on a site''s stock rows, absent elsewhere and for an untracked variant.'
                    items:
                        $ref: '#/components/schemas/InventoryBalanceLot'
                    type: array
                onHand:
                    format: double
                    type: number
                primary:
                    description: The variant's primary location at the site (I55); set on a site's stock rows, absent elsewhere.
                    type: boolean
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - location
                - onHand
            type: object
        InventoryBulkCreateInput:
            additionalProperties: false
            description: 'A grid of locations under a parent (I5): every combination of the levels'' codes, the first level under the parent, each next level under every location of the one before.'
            properties:
                levels:
                    description: One to three levels.
                    items:
                        $ref: '#/components/schemas/InventoryBulkLevel'
                    maxItems: 3
                    minItems: 1
                    type: array
                parentId:
                    format: int64
                    type: integer
            required:
                - parentId
                - levels
            type: object
        InventoryBulkCreated:
            additionalProperties: false
            description: The locations created, by full code.
            properties:
                created:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
            required:
                - created
            type: object
        InventoryBulkLevel:
            additionalProperties: false
            description: 'One level of a bulk create: a kind and the codes of a range. from and to are both digits, padded to the width of from (01–12), or both one letter (A–D); to absent makes the one code from. prefix is put before each code.'
            properties:
                from:
                    maxLength: 16
                    minLength: 1
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                prefix:
                    maxLength: 15
                    type: string
                to:
                    maxLength: 16
                    type: string
            required:
                - kind
                - from
            type: object
        InventoryCount:
            additionalProperties: false
            description: A stock count of a site, or of one location and its subtree (I16).
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                cancelledBy:
                    $ref: '#/components/schemas/InventoryActor'
                countedLines:
                    description: Lines with a counted quantity.
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                lineCount:
                    format: int32
                    type: integer
                lines:
                    description: By the location's full code, then SKU; present on GET /counts/{id} and the writes.
                    items:
                        $ref: '#/components/schemas/InventoryCountLine'
                    type: array
                movedLines:
                    description: Lines whose balance changed since the count opened.
                    format: int32
                    type: integer
                movementId:
                    description: The count movement a posted count wrote.
                    format: int64
                    type: integer
                note:
                    type: string
                openedAt:
                    format: date-time
                    type: string
                openedBy:
                    $ref: '#/components/schemas/InventoryActor'
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                revision:
                    format: int32
                    type: integer
                scope:
                    $ref: '#/components/schemas/InventoryLocationRef'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                status:
                    $ref: '#/components/schemas/InventoryCountStatus'
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - id
                - site
                - scope
                - status
                - openedBy
                - openedAt
                - lineCount
                - countedLines
                - movedLines
                - revision
            type: object
        InventoryCountInput:
            additionalProperties: false
            description: 'Opening a count: of a whole site, or of one location and everything below it (I16, I17).'
            properties:
                locationId:
                    description: The location the count covers with its subtree; the site's root when absent.
                    format: int64
                    type: integer
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - siteId
            type: object
        InventoryCountLine:
            additionalProperties: false
            description: 'One balance in a count — a variant on one location, in one lot for a tracked variant (manufacturing phase 2 M69): what was expected when it opened, what the balance is now, and what was counted (I17–I19).'
            properties:
                added:
                    description: 'The line was added while counting: nothing was expected there.'
                    type: boolean
                counted:
                    description: What was counted; absent until someone counts it.
                    format: double
                    type: number
                countedAt:
                    format: date-time
                    type: string
                countedBy:
                    $ref: '#/components/schemas/InventoryActor'
                current:
                    description: The balance now.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                expected:
                    description: The balance when the count opened.
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                lot:
                    $ref: '#/components/schemas/InventoryLotRef'
                moved:
                    description: The balance changed since the count opened; posting needs acceptMoved (I19).
                    type: boolean
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - id
                - variant
                - location
                - expected
                - current
                - added
                - moved
            type: object
        InventoryCountLineInput:
            additionalProperties: false
            description: 'A counted quantity of a variant on a location in the count''s scope (I18): a line that exists is changed, a balance with no line is added. Exactly one of quantity and entered is given. 0 is a valid count. A tracked variant''s line names its lot (manufacturing phase 2 M69): lotId for one the variant has, or lot to find or make one by number as a receipt does (lot_required, lot_not_allowed, lot_unknown) — a new lot that does not read refuses its line (lot_invalid, lot_dates_invalid), and a lot a count makes takes only the dates the line states, never the variant''s day offsets; a serial is counted 0 or 1 exactly (serial_quantity).'
            properties:
                counted:
                    description: 0 or more, at most three decimals.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryNewLot'
                lotId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
            type: object
        InventoryCountLinesInput:
            additionalProperties: false
            description: Counted lines, at most 500 per request.
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryCountLineInput'
                    maxItems: 500
                    minItems: 1
                    type: array
            required:
                - lines
            type: object
        InventoryCountList:
            additionalProperties: false
            description: Counts, newest first; at most 200.
            properties:
                counts:
                    items:
                        $ref: '#/components/schemas/InventoryCount'
                    type: array
            required:
                - counts
            type: object
        InventoryCountPostInput:
            additionalProperties: false
            description: Posting a count (I19).
            properties:
                acceptMoved:
                    description: Post although some lines' balances changed since the count opened; refused with count_lines_moved otherwise.
                    type: boolean
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - uncounted
            type: object
        InventoryCountStatus:
            enum:
                - counting
                - posted
                - cancelled
            type: string
        InventoryEntered:
            additionalProperties: false
            description: 'A quantity entered in packagings (I25) instead of quantity: the server computes the base quantity from the packagings as they are at posting and keeps the entry on the line.'
            properties:
                loose:
                    description: A rest in the variant's own unit, 0 or more, at most three decimals.
                    format: double
                    type: number
                packagings:
                    description: At most one entry per packaging.
                    items:
                        $ref: '#/components/schemas/InventoryEnteredPackaging'
                    maxItems: 10
                    type: array
            required:
                - packagings
            type: object
        InventoryEnteredPackaging:
            additionalProperties: false
            description: A count of one packaging.
            properties:
                count:
                    description: At least 1.
                    format: int32
                    minimum: 1
                    type: integer
                packagingId:
                    format: int32
                    type: integer
            required:
                - packagingId
                - count
            type: object
        InventoryEnteredSnapshot:
            additionalProperties: false
            description: 'What a line was entered as, as it was at posting: each packaging''s name, count and content then, and the loose rest (I25).'
            properties:
                loose:
                    format: double
                    type: number
                packagings:
                    items:
                        additionalProperties: false
                        description: One packaging of the entry.
                        properties:
                            count:
                                format: int32
                                type: integer
                            name:
                                type: string
                            packagingId:
                                format: int32
                                type: integer
                            quantity:
                                description: Its content in the variant's unit at posting.
                                format: double
                                type: number
                        required:
                            - packagingId
                            - name
                            - quantity
                            - count
                        type: object
                    type: array
            required:
                - packagings
            type: object
        InventoryImportOutcome:
            enum:
                - ok
                - location_not_found
                - variant_not_found
                - variant_not_stockable
                - quantity_invalid
                - lot_required
                - lot_not_allowed
                - lot_invalid
                - serial_quantity
            type: string
        InventoryImportResult:
            additionalProperties: false
            description: 'The import''s answer: every row''s outcome, and on a committed import the one movement it posted.'
            properties:
                movementId:
                    description: The adjustment movement posted; absent on a dry run or a refused import.
                    format: int64
                    type: integer
                ok:
                    description: Every row is ok.
                    type: boolean
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryImportRow'
                    type: array
            required:
                - ok
                - rows
            type: object
        InventoryImportRow:
            additionalProperties: false
            description: One row of the opening-balance file and its outcome (I32).
            properties:
                detail:
                    type: string
                location:
                    description: The full code as written.
                    type: string
                lot:
                    description: The lot number as written, absent when the file has no lot column (manufacturing phase 2 M71).
                    type: string
                outcome:
                    $ref: '#/components/schemas/InventoryImportOutcome'
                quantity:
                    description: As written.
                    type: string
                row:
                    description: The row in the file, the header being row 1.
                    format: int32
                    type: integer
                sku:
                    description: As written.
                    type: string
            required:
                - row
                - location
                - sku
                - quantity
                - outcome
            type: object
        InventoryLabelLayout:
            description: Avery L7160 (21 labels per A4) or L7163 (14 per A4).
            enum:
                - l7160
                - l7163
            type: string
        InventoryLabelFormat:
            description: 'internal: the LOT token as Code 128 (M73). gs1: a GS1-128 label (manufacturing phase 2 M93) — FNC1, (01) the GTIN-14 when the variant''s barcode is a valid GTIN, (11) the production date, (17) the expiry, (15) the best-before when there is no expiry, and (10) the lot or (21) the serial last; a lot whose variant has no valid GTIN falls back to the internal label, marked No GTIN — not a GS1 label.'
            enum:
                - internal
                - gs1
            type: string
        InventoryLabelsInput:
            additionalProperties: false
            description: 'Labels to print (I7): each carries the location''s LOC token as a Code 128 barcode, its full code and its name.'
            properties:
                layout:
                    $ref: '#/components/schemas/InventoryLabelLayout'
                locationIds:
                    description: At most 1000.
                    items:
                        format: int64
                        type: integer
                    maxItems: 1000
                    minItems: 1
                    type: array
                subtree:
                    description: Also every active location below each one.
                    type: boolean
            required:
                - locationIds
                - layout
            type: object
        InventoryLot:
            additionalProperties: false
            description: 'A lot''s page (manufacturing phase 2 M61): its header, its holds, where it lies, its movement lines and its files.'
            properties:
                attachments:
                    description: The lot's files, newest first (M54).
                    items:
                        $ref: '#/components/schemas/InventoryLotAttachment'
                    type: array
                bestBefore:
                    format: date
                    nullable: true
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/InventoryActor'
                expired:
                    description: The expiry is before today in the workspace zone (M62).
                    type: boolean
                expiry:
                    format: date
                    nullable: true
                    type: string
                holds:
                    description: Every hold, the active ones first, newest first within each (M64).
                    items:
                        $ref: '#/components/schemas/InventoryLotHold'
                    type: array
                id:
                    format: int64
                    type: integer
                locations:
                    description: Where it lies, per location, by site code then full code.
                    items:
                        $ref: '#/components/schemas/InventoryLotLocation'
                    type: array
                movements:
                    description: The lot's movement lines, newest first; the latest 200.
                    items:
                        $ref: '#/components/schemas/InventoryLotMovementLine'
                    type: array
                note:
                    nullable: true
                    type: string
                number:
                    type: string
                onHand:
                    description: On hand over every location.
                    format: double
                    type: number
                origin:
                    $ref: '#/components/schemas/InventorySourceRef'
                productionDate:
                    format: date
                    nullable: true
                    type: string
                receivedAt:
                    description: When stock first entered under the lot, the FIFO key (M52).
                    format: date-time
                    type: string
                revision:
                    description: Sent back as If-Match on a change.
                    format: int32
                    type: integer
                serial:
                    description: The variant's tracking was serial when the lot was made; a serial holds at most 1.
                    type: boolean
                status:
                    $ref: '#/components/schemas/InventoryLotStatus'
                supplierLot:
                    nullable: true
                    type: string
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - id
                - number
                - serial
                - variant
                - status
                - expired
                - receivedAt
                - onHand
                - revision
                - createdAt
                - holds
                - locations
                - movements
                - attachments
            type: object
        InventoryLotAttachment:
            additionalProperties: false
            description: A file of a lot (M54), such as an EN 10204 3.1 certificate. Its bytes are read through GET /lots/{id}/attachments/{attachmentId}; no path is ever returned.
            properties:
                contentType:
                    type: string
                fileName:
                    type: string
                id:
                    format: int64
                    type: integer
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
                uploadedBy:
                    $ref: '#/components/schemas/InventoryActor'
            required:
                - id
                - fileName
                - contentType
                - sizeBytes
                - uploadedAt
            type: object
        InventoryLotBlock:
            additionalProperties: false
            description: What a block with the downstream list did (manufacturing phase 2 M92) — the lot as it is now, and every lot the block holds, the lot itself first, as the walk found them inside the block's transaction.
            properties:
                blocked:
                    items:
                        $ref: '#/components/schemas/InventoryLotBlocked'
                    type: array
                lot:
                    $ref: '#/components/schemas/InventoryLot'
            required:
                - lot
                - blocked
            type: object
        InventoryLotBlocked:
            additionalProperties: false
            description: One lot a block holds.
            properties:
                id:
                    format: int64
                    type: integer
                number:
                    type: string
                productName:
                    type: string
                root:
                    description: True for the lot the block was asked for; false for a lot made from it.
                    type: boolean
                sku:
                    type: string
            required:
                - id
                - number
                - sku
                - productName
                - root
            type: object
        InventoryLotBlockInput:
            additionalProperties: false
            description: 'A block of the lot page (manufacturing phase 2 M92): a block hold, source inventory/lot/<id>, on the lot and — with downstream, the default — on every lot made from it that still holds stock, as the usage trace finds them inside the block''s transaction. A lot already blocked by this lot page is left as is, so a block may be asked again to catch the lots made since.'
            properties:
                cause:
                    enum:
                        - recall
                        - complaint
                        - other
                    type: string
                downstream:
                    default: true
                    description: Also block the lots made from it that still hold stock.
                    type: boolean
                note:
                    maxLength: 1000
                    type: string
            required:
                - cause
            type: object
        InventoryLotExpiringPage:
            additionalProperties: false
            description: 'The lots expiring soon (manufacturing phase 2 M72): lots holding stock whose expiry falls within the days asked for or has passed, by expiry, at most 1000.'
            properties:
                lots:
                    items:
                        $ref: '#/components/schemas/InventoryLotSummary'
                    type: array
                more:
                    description: More lots match than the 1000 answered.
                    type: boolean
                today:
                    description: Today in the workspace zone, the day the days are counted from.
                    format: date
                    type: string
                until:
                    description: The last expiry day the list reaches.
                    format: date
                    type: string
            required:
                - lots
                - more
                - today
                - until
            type: object
        InventoryLotHold:
            additionalProperties: false
            description: 'One hold on a lot (M64), owned by the document that put it: the lot page''s own (inventory/lot/<id>), a receipt''s inspection (inventory/movement/<id>), or another module''s document, released only there.'
            properties:
                cause:
                    enum:
                        - inspection
                        - deviation
                        - complaint
                        - recall
                        - other
                    type: string
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/InventoryActor'
                id:
                    format: int64
                    type: integer
                inventorys:
                    description: The hold's source is Inventory's, so the lot page may release it; another module's is released on its document (hold_not_inventorys).
                    type: boolean
                kind:
                    enum:
                        - quarantine
                        - block
                    type: string
                note:
                    nullable: true
                    type: string
                releaseNote:
                    nullable: true
                    type: string
                releasedAt:
                    format: date-time
                    nullable: true
                    type: string
                releasedBy:
                    $ref: '#/components/schemas/InventoryActor'
                source:
                    $ref: '#/components/schemas/InventorySourceRef'
            required:
                - id
                - kind
                - cause
                - source
                - inventorys
                - createdAt
            type: object
        InventoryLotHoldInput:
            additionalProperties: false
            description: A hold the lot page puts (M64). A lot that already holds an active hold of the lot page of the same kind is left as is.
            properties:
                cause:
                    enum:
                        - inspection
                        - deviation
                        - complaint
                        - recall
                        - other
                    type: string
                kind:
                    enum:
                        - quarantine
                        - block
                    type: string
                note:
                    maxLength: 1000
                    type: string
            required:
                - kind
                - cause
            type: object
        InventoryLotHoldRelease:
            additionalProperties: false
            description: The release of one of Inventory's own holds (M64), with why.
            properties:
                downstream:
                    description: 'For a block of the lot page (M92): also release the blocks it put on the lots made from it. A hold of another source on any of them stays.'
                    type: boolean
                note:
                    maxLength: 1000
                    type: string
            type: object
        InventoryLotLocation:
            additionalProperties: false
            description: What lies of a lot on one location.
            properties:
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                onHand:
                    format: double
                    type: number
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - site
                - location
                - onHand
            type: object
        InventoryLotMovementLine:
            additionalProperties: false
            description: One movement line of a lot.
            properties:
                from:
                    $ref: '#/components/schemas/InventoryLocationRef'
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lineNo:
                    format: int32
                    type: integer
                movementId:
                    format: int64
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                quantity:
                    format: double
                    type: number
                to:
                    $ref: '#/components/schemas/InventoryLocationRef'
            required:
                - movementId
                - kind
                - postedAt
                - lineNo
                - quantity
            type: object
        InventoryLotPage:
            additionalProperties: false
            description: A page of the lots list (M60).
            properties:
                lots:
                    items:
                        $ref: '#/components/schemas/InventoryLotSummary'
                    type: array
                nextCursor:
                    description: Absent on the last page.
                    type: string
            required:
                - lots
            type: object
        InventoryLotRef:
            additionalProperties: false
            description: A lot as a movement line names it (manufacturing phase 2 M52).
            properties:
                expiry:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                number:
                    type: string
            required:
                - id
                - number
            type: object
        InventoryLotStatus:
