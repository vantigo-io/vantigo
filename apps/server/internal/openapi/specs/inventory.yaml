                    format: int32
                    type: integer
            required:
                - ok
                - rows
            type: object
        InventoryPlacementImportRow:
            additionalProperties: false
            description: One row of the placements file and its outcome (I61). Every cell is as written; an empty one clears its field.
            properties:
                detail:
