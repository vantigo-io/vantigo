                        $ref: '#/components/schemas/InventoryVariantStock'
                    type: array
            required:
                - productId
                - variants
            type: object
        InventoryReceiptInput:
            additionalProperties: false
            description: 'A goods receipt (I15): at most 500 lines, every location in the site. A Discontinued product''s variant is refused (I12).'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
