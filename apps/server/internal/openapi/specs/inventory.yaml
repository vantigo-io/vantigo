            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - code
                - name
                - kind
                - status
            type: object
        InventorySiteStock:
            additionalProperties: false
