components:
    schemas:
        InventoryActor:
            additionalProperties: false
            description: Who posted, as snapshotted when they did.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - displayName
            type: object
        InventoryAddress:
            additionalProperties: false
            description: A site's postal address; every field optional.
            properties:
                city:
                    maxLength: 100
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    minLength: 2
                    type: string
                line1:
                    maxLength: 200
                    type: string
                line2:
                    maxLength: 200
                    type: string
                postalCode:
                    maxLength: 20
                    type: string
            type: object
        InventoryAdjustmentInput:
            additionalProperties: false
            description: 'An adjustment (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryAdjustmentLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - reason
                - lines
            type: object
        InventoryAdjustmentLine:
            additionalProperties: false
            description: change adds quantity, signed and not 0, to what lies there; set makes it the new on hand, 0 or more, and is posted as the difference — a line whose difference is 0 is dropped (I15). Exactly one of quantity and entered is given. Entered under change adds, or takes away with decrease.
            properties:
                decrease:
                    description: 'With entered under change: the entered quantity is taken away rather than added.'
                    type: boolean
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                mode:
                    enum:
                        - change
                        - set
                    type: string
                quantity:
                    description: Signed under change, at most three decimals.
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
                - mode
            type: object
        InventoryAdjustmentReason:
            enum:
                - correction
                - damaged
                - lost
                - found
                - opening_balance
                - other
            type: string
        InventoryBalanceRow:
            additionalProperties: false
            description: What lies of one variant on one location.
            properties:
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                onHand:
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - location
                - onHand
            type: object
        InventoryBulkCreateInput:
            additionalProperties: false
            description: 'A grid of locations under a parent (I5): every combination of the levels'' codes, the first level under the parent, each next level under every location of the one before.'
            properties:
                levels:
                    description: One to three levels.
                    items:
                        $ref: '#/components/schemas/InventoryBulkLevel'
                    maxItems: 3
                    minItems: 1
                    type: array
                parentId:
                    format: int64
                    type: integer
            required:
                - parentId
                - levels
            type: object
        InventoryBulkCreated:
            additionalProperties: false
            description: The locations created, by full code.
            properties:
                created:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
            required:
                - created
            type: object
        InventoryBulkLevel:
            additionalProperties: false
            description: 'One level of a bulk create: a kind and the codes of a range. from and to are both digits, padded to the width of from (01–12), or both one letter (A–D); to absent makes the one code from. prefix is put before each code.'
            properties:
                from:
                    maxLength: 16
                    minLength: 1
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                prefix:
                    maxLength: 15
                    type: string
                to:
                    maxLength: 16
                    type: string
            required:
                - kind
                - from
            type: object
        InventoryCount:
            additionalProperties: false
            description: A stock count of a site, or of one location and its subtree (I16).
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                cancelledBy:
                    $ref: '#/components/schemas/InventoryActor'
                countedLines:
                    description: Lines with a counted quantity.
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                lineCount:
                    format: int32
                    type: integer
                lines:
                    description: By the location's full code, then SKU; present on GET /counts/{id} and the writes.
                    items:
                        $ref: '#/components/schemas/InventoryCountLine'
                    type: array
                movedLines:
                    description: Lines whose balance changed since the count opened.
                    format: int32
                    type: integer
                movementId:
                    description: The count movement a posted count wrote.
                    format: int64
                    type: integer
                note:
                    type: string
                openedAt:
                    format: date-time
                    type: string
                openedBy:
                    $ref: '#/components/schemas/InventoryActor'
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                revision:
                    format: int32
                    type: integer
                scope:
                    $ref: '#/components/schemas/InventoryLocationRef'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                status:
                    $ref: '#/components/schemas/InventoryCountStatus'
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - id
                - site
                - scope
                - status
                - openedBy
                - openedAt
                - lineCount
                - countedLines
                - movedLines
                - revision
            type: object
        InventoryCountInput:
            additionalProperties: false
            description: 'Opening a count: of a whole site, or of one location and everything below it (I16, I17).'
            properties:
                locationId:
                    description: The location the count covers with its subtree; the site's root when absent.
                    format: int64
                    type: integer
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - siteId
            type: object
        InventoryCountLine:
            additionalProperties: false
            description: 'One variant on one location in a count: what was expected when it opened, what the balance is now, and what was counted (I17–I19).'
            properties:
                added:
                    description: 'The line was added while counting: nothing was expected there.'
                    type: boolean
                counted:
                    description: What was counted; absent until someone counts it.
                    format: double
                    type: number
                countedAt:
                    format: date-time
                    type: string
                countedBy:
                    $ref: '#/components/schemas/InventoryActor'
                current:
                    description: The balance now.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                expected:
                    description: The balance when the count opened.
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                moved:
                    description: The balance changed since the count opened; posting needs acceptMoved (I19).
                    type: boolean
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - id
                - variant
                - location
                - expected
                - current
                - added
                - moved
            type: object
        InventoryCountLineInput:
            additionalProperties: false
            description: 'A counted quantity of a variant on a location in the count''s scope (I18): a line that exists is changed, a pair with no line is added. Exactly one of quantity and entered is given. 0 is a valid count.'
            properties:
                counted:
                    description: 0 or more, at most three decimals.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
            type: object
        InventoryCountLinesInput:
            additionalProperties: false
            description: Counted lines, at most 500 per request.
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryCountLineInput'
                    maxItems: 500
                    minItems: 1
                    type: array
            required:
                - lines
            type: object
        InventoryCountList:
            additionalProperties: false
            description: Counts, newest first; at most 200.
            properties:
                counts:
                    items:
                        $ref: '#/components/schemas/InventoryCount'
                    type: array
            required:
                - counts
            type: object
        InventoryCountPostInput:
            additionalProperties: false
            description: Posting a count (I19).
            properties:
                acceptMoved:
                    description: Post although some lines' balances changed since the count opened; refused with count_lines_moved otherwise.
                    type: boolean
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - uncounted
            type: object
        InventoryCountStatus:
            enum:
                - counting
                - posted
                - cancelled
            type: string
        InventoryEntered:
            additionalProperties: false
            description: 'A quantity entered in packagings (I25) instead of quantity: the server computes the base quantity from the packagings as they are at posting and keeps the entry on the line.'
            properties:
                loose:
                    description: A rest in the variant's own unit, 0 or more, at most three decimals.
                    format: double
                    type: number
                packagings:
                    description: At most one entry per packaging.
                    items:
                        $ref: '#/components/schemas/InventoryEnteredPackaging'
                    maxItems: 10
                    type: array
            required:
                - packagings
            type: object
        InventoryEnteredPackaging:
            additionalProperties: false
            description: A count of one packaging.
            properties:
                count:
                    description: At least 1.
                    format: int32
                    minimum: 1
                    type: integer
                packagingId:
                    format: int32
                    type: integer
            required:
                - packagingId
                - count
            type: object
        InventoryEnteredSnapshot:
            additionalProperties: false
            description: 'What a line was entered as, as it was at posting: each packaging''s name, count and content then, and the loose rest (I25).'
            properties:
                loose:
                    format: double
                    type: number
                packagings:
                    items:
                        additionalProperties: false
                        description: One packaging of the entry.
                        properties:
                            count:
                                format: int32
                                type: integer
                            name:
                                type: string
                            packagingId:
                                format: int32
                                type: integer
                            quantity:
                                description: Its content in the variant's unit at posting.
                                format: double
                                type: number
                        required:
                            - packagingId
                            - name
                            - quantity
                            - count
                        type: object
                    type: array
            required:
                - packagings
            type: object
        InventoryImportOutcome:
            enum:
                - ok
                - location_not_found
                - variant_not_found
                - variant_not_stockable
                - quantity_invalid
            type: string
        InventoryImportResult:
            additionalProperties: false
            description: 'The import''s answer: every row''s outcome, and on a committed import the one movement it posted.'
            properties:
                movementId:
                    description: The adjustment movement posted; absent on a dry run or a refused import.
                    format: int64
                    type: integer
                ok:
                    description: Every row is ok.
                    type: boolean
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryImportRow'
                    type: array
            required:
                - ok
                - rows
            type: object
        InventoryImportRow:
            additionalProperties: false
            description: One row of the opening-balance file and its outcome (I32).
            properties:
                detail:
                    type: string
                location:
                    description: The full code as written.
                    type: string
                outcome:
                    $ref: '#/components/schemas/InventoryImportOutcome'
                quantity:
                    description: As written.
                    type: string
                row:
                    description: The row in the file, the header being row 1.
                    format: int32
                    type: integer
                sku:
                    description: As written.
                    type: string
            required:
                - row
                - location
                - sku
                - quantity
                - outcome
            type: object
        InventoryLabelLayout:
            description: Avery L7160 (21 labels per A4) or L7163 (14 per A4).
            enum:
                - l7160
                - l7163
            type: string
        InventoryLabelsInput:
            additionalProperties: false
            description: 'Labels to print (I7): each carries the location''s LOC token as a Code 128 barcode, its full code and its name.'
            properties:
                layout:
                    $ref: '#/components/schemas/InventoryLabelLayout'
                locationIds:
                    description: At most 1000.
                    items:
                        format: int64
                        type: integer
                    maxItems: 1000
                    minItems: 1
                    type: array
                subtree:
                    description: Also every active location below each one.
                    type: boolean
            required:
                - locationIds
                - layout
            type: object
        InventoryLocation:
            additionalProperties: false
            description: A node of a site's tree (I2).
            properties:
                code:
                    description: 1–16 characters A–Z and 0–9, unique among its siblings.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                depth:
                    description: 0 at the root, at most 8.
                    format: int32
                    type: integer
                fullCode:
                    description: The codes from the root down joined with -, unique in the deployment (I4).
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                parentId:
                    description: Absent on the root.
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /locations/{id}.
                    format: int32
                    type: integer
                siteId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - siteId
                - kind
                - code
                - fullCode
                - depth
                - sortOrder
                - status
                - revision
                - createdAt
                - updatedAt
            type: object
        InventoryLocationContents:
            additionalProperties: false
            description: What lies on the location — and below it unless subtree is false — by full code then SKU.
            properties:
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
            required:
                - rows
            type: object
        InventoryLocationDetail:
            additionalProperties: false
            description: A location with its site, its path from the root and its children (I29).
            properties:
                children:
                    description: Its children by sort order then code, archived ones included.
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
                location:
                    $ref: '#/components/schemas/InventoryLocation'
                path:
                    description: From the root down to the parent; empty on the root.
                    items:
                        $ref: '#/components/schemas/InventoryLocationRef'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - location
                - site
                - path
                - children
            type: object
        InventoryLocationInput:
            additionalProperties: false
            description: A new location under a parent of the same site.
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
            required:
                - parentId
                - kind
                - code
            type: object
        InventoryLocationKind:
            description: site is the root's alone and is never written (I2).
            enum:
                - site
                - zone
                - area
                - sales_floor
                - back_room
                - aisle
                - rack
                - shelf
                - bin
                - display
                - dock
                - other
            type: string
        InventoryLocationList:
            additionalProperties: false
            description: A site's locations, flat, by full code; at most 10,000, truncated saying when more matched.
            properties:
                locations:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
                truncated:
                    description: True when more than 10,000 locations matched and the list was cut.
                    type: boolean
            required:
                - locations
                - truncated
            type: object
        InventoryLocationRef:
            additionalProperties: false
            description: A location as other answers name it.
            properties:
                fullCode:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - siteId
                - fullCode
                - kind
                - status
            type: object
        InventoryLocationUpdate:
            additionalProperties: false
            description: 'A location''s fields, replaced whole. A new parent re-parents the location with its subtree and its stock inside its site (I21); a new code or parent rewrites the subtree''s full codes (I4). archived archives the subtree and is refused location_has_stock while anything in it holds stock; active reactivates the location alone, under an active parent (I6). The root takes only name and sortOrder: its code is the site''s.'
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    description: Required on every location but the root.
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - kind
                - code
                - sortOrder
                - status
            type: object
        InventoryLookupMatch:
            additionalProperties: false
            description: 'One match of the lookup (I28): a location by its LOC token or full code, or a variant by its SKU or barcode.'
            properties:
                kind:
                    enum:
                        - location
                        - variant
                    type: string
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - kind
            type: object
        InventoryLookupResult:
            additionalProperties: false
            description: The matches, locations first; empty when nothing matched.
            properties:
                matches:
                    items:
                        $ref: '#/components/schemas/InventoryLookupMatch'
                    type: array
            required:
                - matches
            type: object
        InventoryMeta:
            additionalProperties: false
            description: 'What the app needs to start (§5): the caller''s six capabilities.'
            properties:
                canAdjust:
                    description: inventory:stock-adjust — adjustments and moves.
                    type: boolean
                canCount:
                    description: inventory:counts-manage — counts.
                    type: boolean
                canManageLocations:
                    description: inventory:locations-manage — sites and locations.
                    type: boolean
                canReceive:
                    description: inventory:receipts-manage — goods receipts.
                    type: boolean
                canViewLocations:
                    description: inventory:locations-view — sites and locations, without quantities.
                    type: boolean
                canViewStock:
                    description: inventory:stock-view — quantities and movements.
                    type: boolean
            required:
                - canViewLocations
                - canManageLocations
                - canViewStock
                - canAdjust
                - canReceive
                - canCount
            type: object
        InventoryMoveInput:
            additionalProperties: false
            description: 'A move (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMoveLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - lines
            type: object
        InventoryMoveLine:
            additionalProperties: false
            description: A quantity moved from one location to another of the same site. Exactly one of quantity and entered is given.
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                fromLocationId:
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                toLocationId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - fromLocationId
                - toLocationId
            type: object
        InventoryMovement:
            additionalProperties: false
            description: 'A posted movement (I8): never edited or deleted.'
            properties:
                clientRequestId:
                    format: uuid
                    type: string
                countId:
                    description: The count this movement posted, for a count movement.
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMovementLine'
                    type: array
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                source:
                    $ref: '#/components/schemas/InventorySourceRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
            required:
                - id
                - clientRequestId
                - kind
                - site
                - lines
                - postedBy
                - postedAt
            type: object
        InventoryMovementKind:
            description: 'An open set (design §12): issue is stock taken out for another module''s document, such as an order''s delivery (orders design O45); production and transfer join later.'
            enum:
                - adjustment
                - move
                - receipt
                - count
                - issue
            type: string
        InventoryMovementLine:
            additionalProperties: false
            description: A quantity of a variant from a location, to one, or both (I9).
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                from:
                    $ref: '#/components/schemas/InventoryLocationRef'
                lineNo:
                    format: int32
                    type: integer
                quantity:
                    description: More than 0, in the variant's unit as it was at posting.
                    format: double
                    type: number
                to:
                    $ref: '#/components/schemas/InventoryLocationRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - lineNo
                - variant
                - quantity
            type: object
        InventoryMovementPage:
            additionalProperties: false
            description: Movements newest first.
            properties:
                movements:
                    items:
                        $ref: '#/components/schemas/InventoryMovementSummary'
                    type: array
                nextCursor:
                    description: Pass as cursor for the next page; absent on the last.
                    type: string
            required:
                - movements
            type: object
        InventoryMovementSummary:
            additionalProperties: false
            description: A posted movement without its lines.
            properties:
                countId:
                    description: The count this movement posted, for a count movement.
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lineCount:
                    format: int32
                    type: integer
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
            required:
                - id
                - kind
                - site
                - lineCount
                - postedBy
                - postedAt
            type: object
        InventoryPackaging:
            additionalProperties: false
            description: 'A packaging of the variant as the catalog answers it (I24): what it holds in the variant''s unit. The app breaks quantities down in them (I26).'
            properties:
                barcode:
                    type: string
                id:
                    format: int32
                    type: integer
                kind:
                    description: inner, case, pallet or other.
                    type: string
                name:
                    type: string
                quantity:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - quantity
            type: object
        InventoryProblem:
            description: 'An RFC 9457 problem with this module''s refusal code (inventory design §4). code names the rule that refused and is what a client keys off, never the words: site_code_taken, location_code_taken and full_code_taken (409: the code is in use — a site''s in the deployment, a location''s among its siblings, or the full code it would make; a bulk create lists every colliding full code in detail), code_invalid (400: not 1–16 characters A–Z and 0–9 after upper-casing, or of the form LOC followed by digits, which labels reserve), depth_exceeded (400: the tree would be more than 8 levels below the root), parent_invalid (400: the parent is in another site, is the location itself or below it, or is archived), bulk_too_large (400: more than 1000 locations), location_has_stock (409: the location or something below it holds stock; detail names the quantity and the number of lines), location_has_history (409: a movement line has named the location or something below it, so it can only be archived), root_location (409: a site''s root is archived or deleted with its site, never alone), revision_conflict (409: the If-Match revision has moved on), insufficient_stock (409: a line would take a balance below zero; lines name it), client_request_reused (409: the clientRequestId was posted before with a different body), count_scope_overlaps (409: another count still counting covers part of the scope), count_not_open (409: a write to a posted or cancelled count), count_lines_moved (409: posting would count lines whose balances changed since the count opened; lines name them), location_has_open_count (409: archiving a location with a count still counting in its subtree), labels_too_many (400: more than 1000 labels), and a posting''s line codes — location_archived, location_not_found, variant_not_found, variant_not_stockable, variant_discontinued, move_crosses_sites, same_location, quantity_invalid, packaging_not_found (an entered packaging the variant does not have), entered_invalid (both or neither of quantity and entered, or a packaging named twice) — with nothing_to_post and too_many_lines (400). A posting checks every line before it writes any and answers all of them at once in lines; a problem about the request as a whole has none. errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                lines:
                    description: Every failing line of a posting, in the request's order.
                    items:
                        $ref: '#/components/schemas/InventoryProblemLine'
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        InventoryProblemLine:
            additionalProperties: false
            description: One failing line of a posting.
            properties:
                code:
                    description: The line's refusal code, as the problem's description lists them.
                    type: string
                detail:
                    description: 'What a person reads: the SKU, the location''s full code and the quantity where they apply.'
                    type: string
                index:
                    description: The line's position in the request, from 0.
                    format: int32
                    type: integer
            required:
                - index
                - code
                - detail
            type: object
        InventoryProductStock:
            additionalProperties: false
            description: A product's stock, per variant, for the product page's Stock card (I27). A Service product answers no variants.
            properties:
                productId:
                    format: int32
                    type: integer
                variants:
                    description: Every goods variant of the product, with or without stock, in the catalog's order.
                    items:
                        $ref: '#/components/schemas/InventoryVariantStock'
                    type: array
            required:
                - productId
                - variants
            type: object
        InventoryReceiptInput:
            additionalProperties: false
            description: 'A goods receipt (I15): at most 500 lines, every location in the site. A Discontinued product''s variant is refused (I12).'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryReceiptLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
                supplierName:
                    maxLength: 200
                    type: string
                supplierReference:
                    maxLength: 100
                    type: string
                toLocationId:
                    description: Where every line goes that names no location of its own.
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - toLocationId
                - lines
            type: object
        InventoryReceiptLine:
            additionalProperties: false
            description: A quantity received, to locationId or the receipt's toLocationId. Exactly one of quantity and entered is given.
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    description: Overrides the receipt's toLocationId for this line.
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
            type: object
        InventorySite:
            additionalProperties: false
            description: A warehouse or a store, the root of a location tree (I1).
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: 1–16 characters A–Z and 0–9, unique in the deployment; the first segment of every full code in the site.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site (orders design O45). A warehouse does by default, a store does not.
                    type: boolean
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                lastReceiptAt:
                    description: When the site last received goods; present to a caller holding inventory:stock-view, absent when it never has.
                    format: date-time
                    type: string
                locationCount:
                    description: Its active locations, the root excluded.
                    format: int32
                    type: integer
                name:
                    type: string
                revision:
                    description: Send it back as If-Match on PUT /sites/{id}.
                    format: int32
                    type: integer
                rootLocationId:
                    description: The site's root location, where stock may lie when the site has no shelves (I3).
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                stockLines:
                    description: Balances in the site; present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - kind
                - status
                - rootLocationId
                - revision
                - createdAt
                - updatedAt
                - locationCount
                - fulfilsOrders
            type: object
        InventorySiteInput:
            additionalProperties: false
            description: A site's fields on create.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site; when absent, true for a warehouse and false for a store.
                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - code
                - name
                - kind
            type: object
        InventorySiteKind:
            description: Changes the suggested location kinds and the words on screen, never a rule (I1).
            enum:
                - warehouse
                - store
            type: string
        InventorySiteList:
            additionalProperties: false
            description: The sites by code.
            properties:
                sites:
                    items:
                        $ref: '#/components/schemas/InventorySite'
                    type: array
            required:
                - sites
            type: object
        InventorySiteRef:
            additionalProperties: false
            description: A site as other answers name it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - code
                - name
                - kind
                - status
            type: object
        InventorySiteStock:
            additionalProperties: false
            description: One variant's stock in one site.
            properties:
                available:
                    description: On hand less reserved; negative when a correction took on hand below what is reserved.
                    format: double
                    type: number
                onHand:
                    format: double
                    type: number
                reserved:
                    description: What other modules' documents (orders) have reserved of it at the site (orders design O45).
                    format: double
                    type: number
                rows:
                    description: By full code.
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - site
                - onHand
                - reserved
                - available
                - rows
            type: object
        InventorySiteUpdate:
            additionalProperties: false
            description: A site's fields, replaced whole. A new code rewrites every full code in the site (I4); archived refuses location_has_stock while anything in the site holds stock and archives every location (I6); active reactivates the site and its root alone.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site; when absent, it is left as it is. Turning it off leaves the site's reservations as they are.
                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - code
                - name
                - kind
                - status
            type: object
        InventorySourceRef:
            additionalProperties: false
            description: 'What another module''s record caused the movement (design §12): an issue names the document it was posted for, such as an order''s delivery.'
            properties:
                id:
                    type: string
                kind:
                    type: string
                lineId:
                    type: string
                module:
                    type: string
            required:
                - module
                - kind
                - id
            type: object
        InventoryStats:
            additionalProperties: false
            description: The dashboard card's figures.
            properties:
                locations:
                    description: Active locations, roots excluded.
                    format: int32
                    type: integer
                openCounts:
                    description: Counts still counting.
                    format: int32
                    type: integer
                receiptsThisWeek:
                    description: Receipts posted since Monday of the business week.
                    format: int32
                    type: integer
                sites:
                    description: Active sites.
                    format: int32
                    type: integer
                stockLines:
                    description: 'Balances: one per variant and location holding stock.'
                    format: int32
                    type: integer
            required:
                - sites
                - locations
                - stockLines
                - receiptsThisWeek
                - openCounts
            type: object
        InventoryStatsAttentionItem:
            additionalProperties: false
            description: 'One thing the dashboard wants a human to look at, in the shape every module''s /stats/attention shares: countOpenLong, a count still counting more than 7 days after it opened, to a caller holding inventory:counts-manage with both views; entityId is the count''s id.'
            properties:
                count:
                    description: How many the item stands for, when more than one.
                    format: int32
                    type: integer
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    enum:
                        - countOpenLong
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        InventoryStatus:
            enum:
                - active
                - archived
            type: string
        InventoryStockTotal:
            additionalProperties: false
            description: A variant's on hand across every location, what is reserved of it across every site, and the difference.
            properties:
                available:
                    format: double
                    type: number
                onHand:
                    format: double
                    type: number
                reserved:
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - onHand
                - reserved
                - available
            type: object
        InventoryStockTotals:
            additionalProperties: false
            description: One total per variant asked for that has stock or a reservation; a variant with neither is absent.
            properties:
                totals:
                    items:
                        $ref: '#/components/schemas/InventoryStockTotal'
                    type: array
            required:
                - totals
            type: object
        InventoryUncounted:
            description: 'What posting does with a line nobody counted: keep its balance, or count it as zero (I19).'
            enum:
                - keep
                - zero
            type: string
        InventoryVariantList:
            additionalProperties: false
            description: At most 50 goods variants by SKU.
            properties:
                variants:
                    items:
                        $ref: '#/components/schemas/InventoryVariantRef'
                    type: array
            required:
                - variants
            type: object
        InventoryVariantRef:
            additionalProperties: false
            description: A variant as the catalog answers it, or as its last movement line snapshotted it when the catalog no longer knows it (deleted).
            properties:
                barcode:
                    type: string
                deleted:
                    description: True when the catalog no longer has the variant; the fields are its last movement line's snapshot.
                    type: boolean
                id:
                    format: int32
                    type: integer
                packagings:
                    description: The variant's packagings, by sort order; absent on a deleted variant.
                    items:
                        $ref: '#/components/schemas/InventoryPackaging'
                    type: array
                productId:
                    description: Absent on a deleted variant.
                    format: int32
                    type: integer
                productName:
                    type: string
                sku:
                    type: string
                unit:
                    type: string
            required:
                - id
                - sku
                - productName
                - unit
            type: object
        InventoryVariantStock:
            additionalProperties: false
            description: One variant's stock by site (I27).
            properties:
                sites:
                    description: Sites holding stock or a reservation of it, by code.
                    items:
                        $ref: '#/components/schemas/InventorySiteStock'
                    type: array
                totalAvailable:
                    description: Total on hand less total reserved.
                    format: double
                    type: number
                totalOnHand:
                    format: double
                    type: number
                totalReserved:
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - totalOnHand
                - totalReserved
                - totalAvailable
                - sites
            type: object
info:
    title: Vantigo Inventory API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/inventory/counts:
        get:
            operationId: listInventoryCounts
            parameters:
                - in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryCountStatus'
                - in: query
                  name: siteId
                  required: false
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCountList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List counts
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
        post:
            description: Opens a count of a site or of a location and its subtree, freezing what is expected on every balance in scope (I17). Movements are not blocked while counting.
            operationId: openInventoryCount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors; the location is not in the site, or archived.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_scope_overlaps.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Open a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}:
        get:
            operationId: getInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Get a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/cancel:
        post:
            description: Cancels a count still counting; nothing is posted.
            operationId: cancelInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_not_open.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. The count was cancelled; only reading it back failed.'
            summary: Cancel a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/lines:
        put:
            description: Records counted quantities, changing a line that exists and adding one for a pair that does not (I18). Refused whole when any line fails; every failing line is answered.
            operationId: putInventoryCountLines
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountLinesInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, or the lines' codes in lines (a location outside the scope is location_not_found).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_not_open.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Record counted quantities
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/post:
        post:
            description: Posts one count movement of the differences between what was counted and the balance now (I19).
            operationId: postInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountPostInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, or a line's code in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_not_open, count_lines_moved (lines name them), or insufficient_stock.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Post a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/imports/opening-balances:
        post:
            description: Reads a CSV of location (full code), sku and quantity for one site, at most 5000 rows (I32). A dry run answers each row's outcome; a commit posts one adjustment movement, reason opening_balance, of every row — or, when any row fails, posts nothing and answers the rows with ok false. The same file posted twice to the same site is one movement.
            operationId: importInventoryOpeningBalances
            parameters:
                - in: query
                  name: siteId
                  required: true
                  schema:
                    format: int64
                    type: integer
                - in: query
                  name: dryRun
                  required: false
                  schema:
                    default: true
                    type: boolean
            requestBody:
                content:
                    text/csv:
                        schema:
                            type: string
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryImportResult'
                    description: OK — a dry run, a commit refused for its rows (ok false, nothing posted), or a replay of a file already posted.
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryImportResult'
                    description: Created — the movement was posted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — a file that does not read, a header other than location, sku, quantity, more than 5000 rows, or an unknown site.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Conflict — insufficient_stock: an opening balance cannot be negative.'
                "503":
                    content:
                        application/problem+json:
