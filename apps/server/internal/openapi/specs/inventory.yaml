            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/sites/{id}:
        delete:
            description: Deletes the site and every location in it, only when no movement has ever been posted in it (I6); archive it otherwise.
            operationId: deleteInventorySite
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — location_has_history.
            summary: Delete a site
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
        get:
            operationId: getInventorySite
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySite'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
            summary: Get a site
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
        put:
            description: Replaces the site's fields (I1, I4, I6). A new code rewrites every full code in the site; archiving archives every location and is refused while anything in the site holds stock.
            operationId: putInventorySite
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the site was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventorySiteUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySite'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — site_code_taken, full_code_taken, location_has_stock, or revision_conflict.
            summary: Change a site
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/sites/{id}/locations:
        get:
            description: Every location of the site, flat, by full code, the root included; at most 10,000.
            operationId: listInventorySiteLocations
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: Only locations in this status; every location when absent.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryStatus'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLocationList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
            summary: List a site's locations
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
    /api/v1/inventory/stats:
        get:
            operationId: getInventoryStats
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryStats'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Inventory dashboard figures
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/stats/attention:
        get:
            description: The attention items, oldest occurredAt first, as a bare array like every module's. Delivery A raises none.
            operationId: getInventoryStatsAttention
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/InventoryStatsAttentionItem'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Inventory attention items
            tags:
                - Inventory
            x-vantigo-access: session
    /api/v1/inventory/variants:
        get:
            description: Goods variants by SKU, product name or barcode, for the line editor's picker (I22).
            operationId: searchInventoryVariants
            parameters:
                - description: The text to look for.
                  in: query
                  name: q
                  required: true
                  schema:
                    maxLength: 100
                    minLength: 1
                    type: string
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 20
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryVariantList'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Search goods variants
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/variants/{variantId}/stock:
        get:
            description: One variant's stock by site and location (I27). A variant the catalog no longer knows answers from its movements' snapshot.
            operationId: getInventoryVariantStock
            parameters:
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryVariantStock'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — neither the catalog nor the ledger knows the variant. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Get a variant's stock
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
