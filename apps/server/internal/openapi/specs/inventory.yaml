                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
                supplierName:
                    maxLength: 200
                    type: string
                supplierReference:
                    maxLength: 100
                    type: string
                toLocationId:
                    description: Where every line goes that names no location of its own.
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - toLocationId
                - lines
            type: object
        InventoryReceiptLine:
            additionalProperties: false
            description: A quantity received, to locationId or the receipt's toLocationId. Exactly one of quantity and entered is given.
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    description: Overrides the receipt's toLocationId for this line.
                    format: int64
                    type: integer
                lotId:
                    description: 'The lot the line takes or puts (manufacturing phase 2 M59): required for a tracked variant, refused for an untracked one (lot_not_allowed).'
                    format: int64
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryNewLot'
                serials:
                    $ref: '#/components/schemas/InventorySerials'
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
            type: object
        InventorySerials:
            additionalProperties: false
            description: 'The serial numbers of a receipt line of a serial variant (manufacturing phase 2 M57): count numbers from first, incrementing its trailing digits and keeping their width (SN0099, SN0100), or the numbers listed. The line becomes one line of 1 per serial, counted against the 500-line cap; the line''s quantity, when given, must equal their number. The line''s lot, when given, gives every serial its dates and supplier lot and names no number.'
            properties:
                count:
                    maximum: 500
                    minimum: 1
                    type: integer
                first:
                    maxLength: 20
                    type: string
                numbers:
                    items:
                        maxLength: 20
                        type: string
                    maxItems: 500
                    type: array
            type: object
        InventorySite:
            additionalProperties: false
            description: A warehouse or a store, the root of a location tree (I1).
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: 1–16 characters A–Z and 0–9, unique in the deployment; the first segment of every full code in the site.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site (orders design O45). A warehouse does by default, a store does not.
                    type: boolean
                id:
                    format: int64
                    type: integer
                incomingTransfers:
                    description: Open transfers to the site (sent or partly received); present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                lastReceiptAt:
                    description: When the site last received goods; present to a caller holding inventory:stock-view, absent when it never has.
                    format: date-time
                    type: string
                locationCount:
                    description: Its active locations, the root excluded.
                    format: int32
                    type: integer
                name:
                    type: string
                outgoingTransfers:
                    description: Open transfers from the site (sent or partly received); present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /sites/{id}.
                    format: int32
                    type: integer
                rootLocationId:
                    description: The site's root location, where stock may lie when the site has no shelves (I3).
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                stockLines:
                    description: Stock lines in the site — a variant on a location, its lots counted once; present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - kind
                - status
                - rootLocationId
                - revision
                - createdAt
                - updatedAt
                - locationCount
                - fulfilsOrders
            type: object
        InventorySiteInput:
            additionalProperties: false
            description: A site's fields on create.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site; when absent, true for a warehouse and false for a store.
                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - code
                - name
                - kind
            type: object
        InventorySiteKind:
            description: Changes the suggested location kinds and the words on screen, never a rule (I1).
            enum:
                - warehouse
                - store
            type: string
        InventorySiteList:
            additionalProperties: false
            description: The sites by code.
            properties:
                sites:
                    items:
                        $ref: '#/components/schemas/InventorySite'
                    type: array
            required:
                - sites
            type: object
        InventorySiteRef:
            additionalProperties: false
            description: A site as other answers name it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - code
                - name
                - kind
                - status
            type: object
        InventorySiteStock:
            additionalProperties: false
            description: One variant's stock in one site; a site with only incoming has a row with nothing on hand.
            properties:
                available:
                    description: Usable on hand less reserved (manufacturing phase 2 M63) — on hand without the lots on hold or expired; negative when a correction or a hold took it below what is reserved.
                    format: double
                    type: number
                held:
                    description: Of on hand, what lies in lots on hold or expired (M63); 0 for an untracked variant.
                    format: double
                    type: number
                incoming:
                    description: In transit to the site on open transfers (I46).
                    format: double
                    type: number
                onHand:
                    format: double
                    type: number
                placement:
                    $ref: '#/components/schemas/InventoryPlacement'
                reserved:
                    description: What other modules' documents (orders) have reserved of it at the site (orders design O45).
                    format: double
                    type: number
                rows:
                    description: The primary location first, then by full code.
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - site
                - onHand
                - reserved
                - available
                - held
                - rows
                - incoming
            type: object
        InventorySiteUpdate:
            additionalProperties: false
            description: A site's fields, replaced whole. A new code rewrites every full code in the site (I4); archived refuses location_has_stock while anything in the site holds stock and archives every location (I6); active reactivates the site and its root alone.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site; when absent, it is left as it is. Turning it off leaves the site's reservations as they are.
                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - code
                - name
                - kind
                - status
            type: object
        InventorySourceRef:
            additionalProperties: false
            description: 'What another module''s record caused the movement (design §12): an issue names the document it was posted for, such as an order''s delivery.'
            properties:
                id:
                    type: string
                kind:
                    type: string
                lineId:
                    type: string
                module:
                    type: string
            required:
