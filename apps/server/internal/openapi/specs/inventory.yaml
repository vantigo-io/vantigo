                    format: int64
                    type: integer
                deliveryNumber:
                    format: int64
                    type: integer
                orderId:
                    format: int64
                    type: integer
                orderNumber:
                    format: int64
                    type: integer
                postedAt:
                    format: date-time
                    type: string
            required:
                - deliveryId
                - deliveryNumber
                - orderId
                - orderNumber
                - customerId
                - postedAt
            type: object
        InventoryTraceDirection:
