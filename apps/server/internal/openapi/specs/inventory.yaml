    /api/v1/inventory/variants/{variantId}/placements/{siteId}:
        delete:
            description: Removes the variant's placement at the site (I54); the variant keeps no primary location, reorder point or maximum there.
            operationId: deleteInventoryPlacement
            parameters:
                - in: path
                  name: variantId
                  required: true
                  schema:
                    format: int32
                    type: integer
                - in: path
                  name: siteId
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the placement was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — an If-Match that does not parse.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
