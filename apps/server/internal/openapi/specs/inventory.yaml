                countId:
                    description: The count this movement posted, for a count movement.
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMovementLine'
                    type: array
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                source:
                    $ref: '#/components/schemas/InventorySourceRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
                transfer:
                    $ref: '#/components/schemas/InventoryTransferRef'
            required:
                - id
                - clientRequestId
                - kind
                - site
                - lines
                - postedBy
                - postedAt
            type: object
        InventoryMovementKind:
            description: 'An open set (design §12): issue is stock taken out for another module''s document, such as an order''s delivery (orders design O45); transfer_out leaves the from site of a transfer and transfer_in arrives at its to site, or back at the from site when it is cancelled (I39–I44); production is a producing document''s consumption of components, lines with only a from, and its output, lines with only a to, within one site (manufacturing design M1); unbuild reverses a production, its consume lines the finished item and its produce lines the components restored (manufacturing phase 2 M123).'
            enum:
                - adjustment
                - move
                - receipt
                - count
                - issue
                - transfer_out
                - transfer_in
                - production
                - unbuild
            type: string
        InventoryMovementLine:
            additionalProperties: false
            description: A quantity of a variant from a location, to one, or both (I9).
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                from:
                    $ref: '#/components/schemas/InventoryLocationRef'
                lineNo:
                    format: int32
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryLotRef'
                expiredOverride:
                    description: The line took an expired lot on the poster's inventory:expired-override (manufacturing phase 2 M62).
                    type: boolean
                quantity:
                    description: More than 0, in the variant's unit as it was at posting.
                    format: double
                    type: number
                to:
                    $ref: '#/components/schemas/InventoryLocationRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - lineNo
                - variant
                - quantity
            type: object
        InventoryMovementPage:
            additionalProperties: false
            description: Movements newest first.
            properties:
                movements:
                    items:
                        $ref: '#/components/schemas/InventoryMovementSummary'
                    type: array
                nextCursor:
                    description: Pass as cursor for the next page; absent on the last.
                    type: string
            required:
                - movements
            type: object
        InventoryMovementSummary:
            additionalProperties: false
            description: A posted movement without its lines.
            properties:
                countId:
                    description: The count this movement posted, for a count movement.
                    format: int64
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lineCount:
                    format: int32
                    type: integer
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
                transfer:
                    $ref: '#/components/schemas/InventoryTransferRef'
            required:
                - id
                - kind
                - site
                - lineCount
                - postedBy
                - postedAt
            type: object
        InventoryNewLot:
            additionalProperties: false
            description: 'A lot a receipt line or an adjustment up names by number (manufacturing phase 2 M57). An empty number generates L<n>. A number the variant already has names that lot, whose dates are not changed: a date stated here that differs from the stored one is lot_dates_differ; a date left out is not compared. On creation, an expiry and a best-before left out default to the production date (else the receipt''s day) plus the variant''s expiryDays and bestBeforeDays.'
            properties:
                bestBefore:
                    format: date
                    type: string
                expiry:
                    format: date
                    type: string
                note:
                    maxLength: 2000
                    type: string
                number:
                    description: 1–20 characters A–Z, a–z, 0–9 and . _ / -, unique per variant ignoring case.
                    maxLength: 20
                    type: string
                productionDate:
                    format: date
                    type: string
                supplierLot:
                    maxLength: 40
                    type: string
            type: object
        InventoryPackaging:
            additionalProperties: false
            description: 'A packaging of the variant as the catalog answers it (I24): what it holds in the variant''s unit. The app breaks quantities down in them (I26).'
            properties:
                barcode:
                    type: string
                id:
                    format: int32
                    type: integer
                kind:
                    description: inner, case, pallet or other.
                    type: string
                name:
                    type: string
                quantity:
                    format: double
                    type: number
            required:
                - id
                - name
                - kind
                - quantity
            type: object
        InventoryPlacement:
            additionalProperties: false
            description: 'A variant''s placement at a site (I54): its primary location, reorder point and maximum, and whether it is low (I56) — available plus incoming at or below the reorder point.'
            properties:
                low:
                    description: The reorder point is set and available plus incoming is at or below it (I56).
                    type: boolean
                maximum:
                    description: What a suggestion fills up to; never below the reorder point.
                    format: double
                    nullable: true
                    type: number
                primaryLocationId:
                    description: An active location of the site, the default where the variant is put and taken (I55).
                    format: int64
                    nullable: true
                    type: integer
                reorderPoint:
                    description: Low at or below it; zero or more.
                    format: double
                    nullable: true
                    type: number
                revision:
                    description: Checked by If-Match on a change or a removal.
                    format: int32
                    type: integer
            required:
                - primaryLocationId
                - reorderPoint
                - maximum
                - revision
                - low
            type: object
        InventoryPlacementImportOutcome:
            enum:
                - ok
                - site_not_found
                - site_archived
                - placement_location_invalid
                - variant_not_found
                - variant_not_stockable
                - quantity_invalid
                - maximum_below_reorder_point
            type: string
        InventoryPlacementImportResult:
            additionalProperties: false
            description: 'The placements import''s answer (I61): every row''s outcome, and on a committed import how many placements it set and cleared.'
            properties:
                cleared:
                    description: Placements removed by a row clearing all three fields; absent on a dry run or a refused import.
                    format: int32
                    type: integer
                ok:
