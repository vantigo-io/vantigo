                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
            summary: List a site's locations
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
