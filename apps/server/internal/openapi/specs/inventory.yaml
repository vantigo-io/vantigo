components:
    schemas:
        InventoryActor:
            additionalProperties: false
            description: Who posted, as snapshotted when they did.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - displayName
            type: object
        InventoryAddress:
            additionalProperties: false
            description: A site's postal address; every field optional.
            properties:
                city:
                    maxLength: 100
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    minLength: 2
                    type: string
                line1:
                    maxLength: 200
                    type: string
                line2:
                    maxLength: 200
                    type: string
                postalCode:
                    maxLength: 20
                    type: string
            type: object
        InventoryAdjustmentInput:
            additionalProperties: false
            description: 'An adjustment (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryAdjustmentLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - reason
                - lines
            type: object
        InventoryAdjustmentLine:
            additionalProperties: false
            description: change adds quantity, signed and not 0, to what lies there; set makes it the new on hand, 0 or more, and is posted as the difference — a line whose difference is 0 is dropped (I15).
            properties:
                locationId:
                    format: int64
                    type: integer
                mode:
                    enum:
                        - change
                        - set
                    type: string
                quantity:
                    description: Signed under change, at most three decimals.
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
                - mode
                - quantity
            type: object
        InventoryAdjustmentReason:
            enum:
                - correction
                - damaged
                - lost
                - found
                - opening_balance
                - other
            type: string
        InventoryBalanceRow:
            additionalProperties: false
            description: What lies of one variant on one location.
            properties:
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                onHand:
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - location
                - onHand
            type: object
        InventoryBulkCreateInput:
            additionalProperties: false
            description: 'A grid of locations under a parent (I5): every combination of the levels'' codes, the first level under the parent, each next level under every location of the one before.'
            properties:
                levels:
                    description: One to three levels.
                    items:
                        $ref: '#/components/schemas/InventoryBulkLevel'
                    maxItems: 3
                    minItems: 1
                    type: array
                parentId:
                    format: int64
                    type: integer
            required:
                - parentId
                - levels
            type: object
        InventoryBulkCreated:
            additionalProperties: false
            description: The locations created, by full code.
            properties:
                created:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
            required:
                - created
            type: object
        InventoryBulkLevel:
            additionalProperties: false
            description: 'One level of a bulk create: a kind and the codes of a range. from and to are both digits, padded to the width of from (01–12), or both one letter (A–D); to absent makes the one code from. prefix is put before each code.'
            properties:
                from:
                    maxLength: 16
                    minLength: 1
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                prefix:
                    maxLength: 15
                    type: string
                to:
                    maxLength: 16
                    type: string
            required:
                - kind
                - from
            type: object
        InventoryLocation:
            additionalProperties: false
            description: A node of a site's tree (I2).
            properties:
                code:
                    description: 1–16 characters A–Z and 0–9, unique among its siblings.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                depth:
                    description: 0 at the root, at most 8.
                    format: int32
                    type: integer
                fullCode:
                    description: The codes from the root down joined with -, unique in the deployment (I4).
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                parentId:
                    description: Absent on the root.
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /locations/{id}.
                    format: int32
                    type: integer
                siteId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - siteId
                - kind
                - code
                - fullCode
                - depth
                - sortOrder
                - status
                - revision
                - createdAt
                - updatedAt
            type: object
        InventoryLocationContents:
            additionalProperties: false
            description: What lies on the location — and below it unless subtree is false — by full code then SKU.
            properties:
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
            required:
                - rows
            type: object
        InventoryLocationDetail:
            additionalProperties: false
            description: A location with its site, its path from the root and its children (I29).
            properties:
                children:
                    description: Its children by sort order then code, archived ones included.
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
                location:
                    $ref: '#/components/schemas/InventoryLocation'
                path:
                    description: From the root down to the parent; empty on the root.
                    items:
                        $ref: '#/components/schemas/InventoryLocationRef'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - location
                - site
                - path
                - children
            type: object
        InventoryLocationInput:
            additionalProperties: false
            description: A new location under a parent of the same site.
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
            required:
                - parentId
                - kind
                - code
            type: object
        InventoryLocationKind:
            description: site is the root's alone and is never written (I2).
            enum:
                - site
                - zone
                - area
                - sales_floor
                - back_room
                - aisle
                - rack
                - shelf
                - bin
                - display
                - dock
                - other
            type: string
        InventoryLocationList:
            additionalProperties: false
            description: A site's locations, flat, by full code; at most 10,000.
            properties:
                locations:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
            required:
                - locations
            type: object
        InventoryLocationRef:
            additionalProperties: false
            description: A location as other answers name it.
            properties:
                fullCode:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - siteId
                - fullCode
                - kind
                - status
            type: object
        InventoryLocationUpdate:
            additionalProperties: false
            description: 'A location''s fields, replaced whole. A new parent re-parents the location with its subtree and its stock inside its site (I21); a new code or parent rewrites the subtree''s full codes (I4). archived archives the subtree and is refused location_has_stock while anything in it holds stock; active reactivates the location alone, under an active parent (I6). The root takes only name and sortOrder: its code is the site''s.'
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    description: Required on every location but the root.
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - kind
                - code
                - sortOrder
                - status
            type: object
        InventoryLookupMatch:
            additionalProperties: false
            description: 'One match of the lookup (I28): a location by its LOC token or full code, or a variant by its SKU or barcode.'
            properties:
                kind:
                    enum:
                        - location
                        - variant
                    type: string
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - kind
            type: object
        InventoryLookupResult:
            additionalProperties: false
            description: The matches, locations first; empty when nothing matched.
            properties:
                matches:
                    items:
                        $ref: '#/components/schemas/InventoryLookupMatch'
                    type: array
            required:
                - matches
            type: object
        InventoryMeta:
            additionalProperties: false
            description: 'What the app needs to start (§5): the caller''s six capabilities.'
            properties:
                canAdjust:
                    description: inventory:stock-adjust — adjustments and moves.
                    type: boolean
                canCount:
                    description: inventory:counts-manage — counts (delivery B).
                    type: boolean
                canManageLocations:
                    description: inventory:locations-manage — sites and locations.
                    type: boolean
                canReceive:
                    description: inventory:receipts-manage — goods receipts.
                    type: boolean
                canViewLocations:
                    description: inventory:locations-view — sites and locations, without quantities.
                    type: boolean
                canViewStock:
                    description: inventory:stock-view — quantities and movements.
                    type: boolean
            required:
                - canViewLocations
                - canManageLocations
                - canViewStock
                - canAdjust
                - canReceive
                - canCount
            type: object
        InventoryMoveInput:
            additionalProperties: false
            description: 'A move (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMoveLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - lines
            type: object
        InventoryMoveLine:
            additionalProperties: false
            description: A quantity moved from one location to another of the same site.
            properties:
                fromLocationId:
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                toLocationId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - fromLocationId
                - toLocationId
                - quantity
            type: object
        InventoryMovement:
            additionalProperties: false
            description: 'A posted movement (I8): never edited or deleted.'
            properties:
                clientRequestId:
                    format: uuid
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMovementLine'
                    type: array
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                source:
                    $ref: '#/components/schemas/InventorySourceRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
            required:
                - id
                - clientRequestId
                - kind
                - site
                - lines
                - postedBy
                - postedAt
            type: object
        InventoryMovementKind:
            description: 'An open set (design §12): count joins in delivery B, and issue, production and transfer later.'
            enum:
                - adjustment
                - move
                - receipt
            type: string
        InventoryMovementLine:
            additionalProperties: false
            description: A quantity of a variant from a location, to one, or both (I9).
            properties:
                from:
                    $ref: '#/components/schemas/InventoryLocationRef'
                lineNo:
                    format: int32
                    type: integer
                quantity:
                    description: More than 0, in the variant's unit as it was at posting.
                    format: double
                    type: number
                to:
                    $ref: '#/components/schemas/InventoryLocationRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - lineNo
                - variant
                - quantity
            type: object
        InventoryMovementPage:
            additionalProperties: false
            description: Movements newest first.
            properties:
                movements:
                    items:
                        $ref: '#/components/schemas/InventoryMovementSummary'
                    type: array
                nextCursor:
                    description: Pass as cursor for the next page; absent on the last.
                    type: string
            required:
                - movements
            type: object
        InventoryMovementSummary:
            additionalProperties: false
            description: A posted movement without its lines.
            properties:
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                lineCount:
                    format: int32
                    type: integer
                note:
                    type: string
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
            required:
                - id
                - kind
                - site
                - lineCount
                - postedBy
                - postedAt
            type: object
        InventoryProblem:
            description: 'An RFC 9457 problem with this module''s refusal code (inventory design §4). code names the rule that refused and is what a client keys off, never the words: site_code_taken, location_code_taken and full_code_taken (409: the code is in use — a site''s in the deployment, a location''s among its siblings, or the full code it would make; a bulk create lists every colliding full code in detail), code_invalid (400: not 1–16 characters A–Z and 0–9 after upper-casing, or of the form LOC followed by digits, which labels reserve), depth_exceeded (400: the tree would be more than 8 levels below the root), parent_invalid (400: the parent is in another site, is the location itself or below it, or is archived), bulk_too_large (400: more than 1000 locations), location_has_stock (409: the location or something below it holds stock; detail names the quantity and the number of lines), location_has_history (409: a movement line has named the location or something below it, so it can only be archived), root_location (409: a site''s root is archived or deleted with its site, never alone), revision_conflict (409: the If-Match revision has moved on), insufficient_stock (409: a line would take a balance below zero; lines name it), client_request_reused (409: the clientRequestId was posted before with a different body), and a posting''s line codes — location_archived, location_not_found, variant_not_found, variant_not_stockable, variant_discontinued, move_crosses_sites, same_location, quantity_invalid — with nothing_to_post and too_many_lines (400). A posting checks every line before it writes any and answers all of them at once in lines; a problem about the request as a whole has none. errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                lines:
                    description: Every failing line of a posting, in the request's order.
                    items:
                        $ref: '#/components/schemas/InventoryProblemLine'
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        InventoryProblemLine:
            additionalProperties: false
            description: One failing line of a posting.
            properties:
                code:
                    description: The line's refusal code, as the problem's description lists them.
                    type: string
                detail:
                    description: 'What a person reads: the SKU, the location''s full code and the quantity where they apply.'
                    type: string
                index:
                    description: The line's position in the request, from 0.
                    format: int32
                    type: integer
            required:
                - index
                - code
                - detail
            type: object
        InventoryProductStock:
            additionalProperties: false
            description: A product's stock, per variant, for the product page's Stock card (I27). A Service product answers no variants.
            properties:
                productId:
                    format: int32
                    type: integer
                variants:
                    description: Every goods variant of the product, with or without stock, in the catalog's order.
                    items:
                        $ref: '#/components/schemas/InventoryVariantStock'
                    type: array
            required:
                - productId
                - variants
            type: object
        InventoryReceiptInput:
            additionalProperties: false
            description: 'A goods receipt (I15): at most 500 lines, every location in the site. A Discontinued product''s variant is refused (I12).'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryReceiptLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
                supplierName:
                    maxLength: 200
                    type: string
                supplierReference:
                    maxLength: 100
                    type: string
                toLocationId:
                    description: Where every line goes that names no location of its own.
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - toLocationId
                - lines
            type: object
        InventoryReceiptLine:
            additionalProperties: false
            description: A quantity received, to locationId or the receipt's toLocationId.
            properties:
                locationId:
                    description: Overrides the receipt's toLocationId for this line.
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - quantity
            type: object
        InventorySite:
            additionalProperties: false
            description: A warehouse or a store, the root of a location tree (I1).
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: 1–16 characters A–Z and 0–9, unique in the deployment; the first segment of every full code in the site.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    type: string
                revision:
                    description: Send it back as If-Match on PUT /sites/{id}.
                    format: int32
                    type: integer
                rootLocationId:
                    description: The site's root location, where stock may lie when the site has no shelves (I3).
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - kind
                - status
                - rootLocationId
                - revision
                - createdAt
                - updatedAt
            type: object
        InventorySiteInput:
            additionalProperties: false
            description: A site's fields on create.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - code
                - name
                - kind
            type: object
        InventorySiteKind:
            description: Changes the suggested location kinds and the words on screen, never a rule (I1).
            enum:
                - warehouse
                - store
            type: string
        InventorySiteList:
            additionalProperties: false
            description: The sites by code.
            properties:
                sites:
                    items:
                        $ref: '#/components/schemas/InventorySite'
                    type: array
            required:
                - sites
            type: object
        InventorySiteRef:
            additionalProperties: false
            description: A site as other answers name it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - code
                - name
                - kind
                - status
            type: object
        InventorySiteStock:
            additionalProperties: false
            description: One variant's stock in one site.
            properties:
                onHand:
                    format: double
                    type: number
                rows:
                    description: By full code.
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - site
                - onHand
                - rows
            type: object
        InventorySiteUpdate:
            additionalProperties: false
            description: A site's fields, replaced whole. A new code rewrites every full code in the site (I4); archived refuses location_has_stock while anything in the site holds stock and archives every location (I6); active reactivates the site and its root alone.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - code
                - name
                - kind
                - status
            type: object
        InventorySourceRef:
            additionalProperties: false
            description: What another module's record caused the movement (design §12); none does in this phase.
            properties:
                id:
                    type: string
                kind:
                    type: string
                lineId:
                    type: string
                module:
                    type: string
            required:
                - module
                - kind
                - id
            type: object
        InventoryStats:
            additionalProperties: false
            description: The dashboard card's figures.
            properties:
                locations:
                    description: Active locations, roots excluded.
                    format: int32
                    type: integer
                openCounts:
                    description: Counts still counting; 0 until delivery B.
                    format: int32
                    type: integer
                receiptsThisWeek:
                    description: Receipts posted since Monday of the business week.
                    format: int32
                    type: integer
                sites:
                    description: Active sites.
                    format: int32
                    type: integer
                stockLines:
                    description: 'Balances: one per variant and location holding stock.'
                    format: int32
                    type: integer
            required:
                - sites
                - locations
                - stockLines
                - receiptsThisWeek
                - openCounts
            type: object
        InventoryStatsAttentionItem:
            additionalProperties: false
            description: One thing the dashboard wants a human to look at, in the shape every module's /stats/attention shares. Delivery A raises none; delivery B adds countOpenLong.
            properties:
                count:
                    description: How many the item stands for, when more than one.
                    format: int32
                    type: integer
                entityId:
                    type: string
                id:
                    type: string
                occurredAt:
                    format: date-time
                    type: string
                title:
                    type: string
                type:
                    enum:
                        - countOpenLong
                    type: string
            required:
                - id
                - type
                - title
                - occurredAt
                - entityId
            type: object
        InventoryStatus:
            enum:
                - active
                - archived
            type: string
        InventoryVariantList:
            additionalProperties: false
            description: At most 50 goods variants by SKU.
            properties:
                variants:
                    items:
                        $ref: '#/components/schemas/InventoryVariantRef'
                    type: array
            required:
                - variants
            type: object
        InventoryVariantRef:
            additionalProperties: false
            description: A variant as the catalog answers it, or as its last movement line snapshotted it when the catalog no longer knows it (deleted).
            properties:
                barcode:
                    type: string
                deleted:
                    description: True when the catalog no longer has the variant; the fields are its last movement line's snapshot.
                    type: boolean
                id:
                    format: int32
                    type: integer
                productId:
                    description: Absent on a deleted variant.
                    format: int32
                    type: integer
                productName:
                    type: string
                sku:
                    type: string
                unit:
                    type: string
            required:
                - id
                - sku
                - productName
                - unit
            type: object
        InventoryVariantStock:
            additionalProperties: false
            description: One variant's stock by site (I27).
            properties:
                sites:
                    description: Sites holding stock, by code.
                    items:
                        $ref: '#/components/schemas/InventorySiteStock'
                    type: array
                totalOnHand:
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - totalOnHand
                - sites
            type: object
info:
    title: Vantigo Inventory API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/inventory/locations:
        post:
            description: Creates a location under an active parent of the same site (I2).
            operationId: createInventoryLocation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryLocationInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLocation'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid, depth_exceeded, parent_invalid.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — location_code_taken, full_code_taken.
            summary: Create a location
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/locations/{id}:
        delete:
            description: Deletes the location and its subtree, only when no movement line has ever named any of them (I6); archive it otherwise.
            operationId: deleteInventoryLocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such location. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — location_has_history, or root_location.
            summary: Delete a location
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
        get:
            description: The location with its site, its path and its children (I29).
            operationId: getInventoryLocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLocationDetail'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such location. The body is empty.
            summary: Get a location
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
        put:
            description: 'Replaces the location''s fields: rename, recode, re-parent inside its site, archive with its subtree, or reactivate (I2, I4, I6, I21).'
            operationId: putInventoryLocation
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the location was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryLocationUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLocation'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid, depth_exceeded, parent_invalid.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such location. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — location_code_taken, full_code_taken, location_has_stock, root_location, or revision_conflict.
            summary: Change a location
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/locations/{id}/contents:
        get:
            description: The balances on the location and, unless subtree is false, below it (I29).
            operationId: getInventoryLocationContents
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: False for the location itself alone.
                  in: query
                  name: subtree
                  required: false
                  schema:
                    default: true
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLocationContents'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such location. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: List what lies on a location
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/locations/bulk:
        post:
            description: Creates a grid of up to three levels and 1000 locations under a parent, all or nothing (I5).
            operationId: bulkCreateInventoryLocations
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryBulkCreateInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryBulkCreated'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid, depth_exceeded, parent_invalid, bulk_too_large.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — location_code_taken or full_code_taken, with every colliding full code in detail.
            summary: Create locations in bulk
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/lookup:
        get:
            description: 'Matches a scanned or typed code (I28): a LOC token, then a location''s full code — with inventory:locations-view — then a SKU or variant barcode — with inventory:locations-view and inventory:stock-view. A caller holding neither gets no matches.'
            operationId: lookupInventory
            parameters:
                - description: The code as scanned or typed.
                  in: query
                  name: q
                  required: true
                  schema:
                    maxLength: 100
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryLookupResult'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Find a location or an item
            tags:
                - Inventory
            x-vantigo-access: session
    /api/v1/inventory/meta:
        get:
            description: What the caller may do in Inventory (§5), so the app shows only what works.
            operationId: getInventoryMeta
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMeta'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Inventory capabilities
            tags:
                - Inventory
            x-vantigo-access: session
    /api/v1/inventory/movements:
        get:
            description: Posted movements newest first, by cursor (I30).
            operationId: listInventoryMovements
            parameters:
                - description: Only this site's.
                  in: query
                  name: siteId
                  required: false
                  schema:
                    format: int64
                    type: integer
                - description: Only those with a line from or to this location or below it.
                  in: query
                  name: locationId
                  required: false
                  schema:
                    format: int64
                    type: integer
                - description: Only those with a line of this variant.
                  in: query
                  name: variantId
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: Only this kind.
                  in: query
                  name: kind
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryMovementKind'
                - description: Posted on or after this business day.
                  in: query
                  name: from
                  required: false
                  schema:
                    format: date
                    type: string
                - description: Posted on or before this business day.
                  in: query
                  name: to
                  required: false
                  schema:
                    format: date
                    type: string
                - description: The previous page's nextCursor.
                  in: query
                  name: cursor
                  required: false
                  schema:
                    type: string
                - in: query
                  name: limit
                  required: false
                  schema:
                    default: 100
                    format: int32
                    maximum: 500
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovementPage'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — a filter or cursor that does not parse, or to before from.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List movements
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/movements/{id}:
        get:
            operationId: getInventoryMovement
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such movement. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Get a movement
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/movements/adjustments:
        post:
            description: 'Posts an adjustment (I15): each line changes, or sets, what lies of a variant on a location, for a reason. Refused whole when any line fails; every failing line is answered.'
            operationId: postInventoryAdjustment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryAdjustmentInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: 'OK — a replay: the movement first posted under this clientRequestId, with the same body (I14).'
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: Created — the adjustment, posted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors on the body, too_many_lines, nothing_to_post, or the lines' codes in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — insufficient_stock (in lines), or client_request_reused.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Adjust stock
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-adjust+inventory:stock-view
    /api/v1/inventory/movements/moves:
        post:
            description: 'Posts a move (I15): each line moves a quantity of a variant between two locations of the site. Refused whole when any line fails; every failing line is answered.'
            operationId: postInventoryMove
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryMoveInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: 'OK — a replay: the movement first posted under this clientRequestId, with the same body (I14).'
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: Created — the move, posted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors on the body, too_many_lines, nothing_to_post, or the lines' codes in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — insufficient_stock (in lines), or client_request_reused.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Move stock
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-adjust+inventory:stock-view
    /api/v1/inventory/movements/receipts:
        post:
            description: 'Posts a goods receipt (I15): each line puts a quantity of a variant on a location of the site. Refused whole when any line fails; every failing line is answered.'
            operationId: postInventoryReceipt
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryReceiptInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: 'OK — a replay: the movement first posted under this clientRequestId, with the same body (I14).'
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryMovement'
                    description: Created — the receipt, posted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors on the body, too_many_lines, nothing_to_post, or the lines' codes in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — insufficient_stock (in lines), or client_request_reused.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Receive goods
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:receipts-manage+inventory:stock-view
    /api/v1/inventory/products/{productId}/stock:
        get:
            description: A product's stock per variant, by site and location, for the product page's Stock card (I27).
            operationId: getInventoryProductStock
            parameters:
                - in: path
                  name: productId
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryProductStock'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such product. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Get a product's stock
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view+inventory:stock-view
    /api/v1/inventory/sites:
        get:
            description: Every site by code, archived ones only when asked.
            operationId: listInventorySites
            parameters:
                - description: Only sites in this status; active when absent.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryStatus'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySiteList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List sites
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
        post:
            description: Creates a site and its root location in one transaction (I1).
            operationId: createInventorySite
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventorySiteInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySite'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
