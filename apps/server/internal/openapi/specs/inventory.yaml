                    type: integer
                depthLimit:
                    description: True on a lot at maxDepth that went into (usage) or came from (origin) a production the trace does not expand. A lot at maxDepth still shows its ends.
                    type: boolean
                edge:
                    $ref: '#/components/schemas/InventoryTraceEdge'
                key:
                    description: The node's path from the root, its indexes joined by dots ("0", "0.2", "0.2.1").
                    type: string
                kind:
                    enum:
                        - lot
                        - component
                        - receipt
                        - issue
                        - adjustment
                        - count
                        - transfer_out
                        - production
                        - unbuild
                    type: string
                    x-enum-varnames:
                        - TraceLot
                        - TraceComponent
                        - TraceReceipt
                        - TraceIssue
                        - TraceAdjustment
                        - TraceCount
                        - TraceTransferOut
                        - TraceProduction
                        - TraceUnbuild
                lot:
                    $ref: '#/components/schemas/InventoryTraceLot'
                movement:
                    $ref: '#/components/schemas/InventoryTraceMovement'
                parentKey:
                    type: string
                quantity:
                    description: An end's quantity of the lot on its movement; a component's quantity consumed.
                    format: double
                    type: number
                seenAt:
                    description: On a lot traced already, the key of the node where it is expanded; this one is not.
                    type: string
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - key
                - depth
                - kind
                - variant
                - depthLimit
            type: object
        InventoryTransfer:
            additionalProperties: false
            description: A transfer of stock from one site to another (I36), with its lines and its actions.
            properties:
                actions:
                    description: Oldest first.
                    items:
                        $ref: '#/components/schemas/InventoryTransferAction'
                    type: array
                closeNote:
                    type: string
                closeReason:
                    $ref: '#/components/schemas/InventoryTransferCloseReason'
                closedAt:
                    format: date-time
                    type: string
                closedBy:
                    $ref: '#/components/schemas/InventoryActor'
                createdAt:
                    format: date-time
                    type: string
                createdBy:
                    $ref: '#/components/schemas/InventoryActor'
                expectedArrival:
                    format: date
                    type: string
                fromSite:
                    $ref: '#/components/schemas/InventorySiteRef'
                id:
                    format: int64
                    type: integer
                inTransit:
                    description: The lines' in transit, summed.
                    format: double
                    type: number
                lines:
                    description: By line number.
                    items:
                        $ref: '#/components/schemas/InventoryTransferLine'
                    type: array
                note:
                    type: string
                number:
                    format: int64
                    type: integer
                reference:
                    type: string
                revision:
                    description: Send it back as If-Match on every write but receive (I41).
                    format: int32
                    type: integer
                sentAt:
                    format: date-time
                    type: string
                sentBy:
                    $ref: '#/components/schemas/InventoryActor'
                status:
                    $ref: '#/components/schemas/InventoryTransferStatus'
                toSite:
                    $ref: '#/components/schemas/InventorySiteRef'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - number
                - status
                - fromSite
                - toSite
                - revision
                - createdBy
                - createdAt
                - updatedAt
                - lines
                - actions
                - inTransit
            type: object
        InventoryTransferAction:
            additionalProperties: false
            description: 'One send, receive or cancel (I38): who, when, the movement it posted, and its lines.'
            properties:
                closeNote:
                    type: string
                closeReason:
                    $ref: '#/components/schemas/InventoryTransferCloseReason'
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryTransferActionKind'
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryTransferActionLine'
                    type: array
                movementId:
                    description: Absent on a close-only receive, which posts no movement.
                    format: int64
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
            required:
                - id
                - kind
                - lines
                - postedBy
                - postedAt
            type: object
        InventoryTransferActionKind:
            enum:
                - send
                - receive
                - cancel
            type: string
        InventoryTransferActionLine:
            additionalProperties: false
            description: 'What one action did to one line: the source location for sent and returned, the destination for received, none for missing (I38).'
            properties:
                kind:
                    $ref: '#/components/schemas/InventoryTransferActionLineKind'
                lineId:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                quantity:
                    format: double
                    type: number
            required:
                - lineId
                - kind
                - quantity
            type: object
        InventoryTransferActionLineKind:
            enum:
                - sent
                - received
                - missing
                - returned
            type: string
        InventoryTransferCancelInput:
            additionalProperties: false
            description: Cancelling a sent transfer with nothing received or missing (I44).
            properties:
                clientRequestId:
                    description: A UUID made when the dialog opens and kept across retries (D I14).
                    format: uuid
                    type: string
            required:
                - clientRequestId
            type: object
        InventoryTransferClose:
            additionalProperties: false
            description: 'Closing the difference (I42): after the quantities, every line''s remaining outstanding is recorded as missing and the transfer is received.'
            properties:
                note:
                    maxLength: 500
                    type: string
                reason:
                    $ref: '#/components/schemas/InventoryTransferCloseReason'
            required:
                - reason
            type: object
        InventoryTransferCloseReason:
            description: Why what was not received is missing (I42).
            enum:
                - lost
                - damaged
                - not_packed
                - other
            type: string
        InventoryTransferDestination:
            additionalProperties: false
            description: 'Where one line is received: a location at the to site, its root included (D I3).'
            properties:
                lineId:
                    format: int64
                    type: integer
                toLocationId:
                    format: int64
                    type: integer
            required:
                - lineId
                - toLocationId
            type: object
        InventoryTransferInput:
            additionalProperties: false
            description: 'A draft transfer''s header and lines, replaced whole on PUT (I36, I37): two different active sites, 1–500 lines. A field left out is empty.'
            properties:
                expectedArrival:
                    format: date
                    type: string
                fromSiteId:
                    format: int64
                    type: integer
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryTransferLineInput'
                    minItems: 1
                    type: array
                note:
                    maxLength: 2000
                    type: string
                reference:
                    maxLength: 100
                    type: string
                toSiteId:
                    format: int64
                    type: integer
            required:
                - fromSiteId
                - toSiteId
                - lines
            type: object
        InventoryTransferLine:
            additionalProperties: false
            description: 'A transfer line (I36, I46): what was asked for and the running totals. inTransit is sent − received − missing − returned, 0 on every line of a received or cancelled transfer. A line carries one lot (manufacturing phase 2 M70), and its in transit is of that lot.'
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                fromLocation:
                    $ref: '#/components/schemas/InventoryLocationRef'
                id:
                    format: int64
                    type: integer
                inTransit:
                    format: double
                    type: number
                lineNo:
                    format: int32
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryLotRef'
                missing:
                    format: double
                    type: number
                quantity:
                    description: More than 0, in the variant's unit.
                    format: double
                    type: number
                received:
                    format: double
                    type: number
                returned:
                    format: double
                    type: number
                sent:
                    format: double
                    type: number
                suggestion:
                    $ref: '#/components/schemas/InventoryTransferSuggestion'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - id
                - lineNo
                - variant
                - quantity
                - sent
                - received
                - missing
                - returned
                - inTransit
            type: object
        InventoryTransferLineInput:
            additionalProperties: false
            description: 'A draft line: a variant and a quantity of it, in its own unit or entered in packagings (I25). Exactly one of quantity and entered is given. A variant may appear on several lines — which is how two lots of it travel: a line names at most one lot (manufacturing phase 2 M70), one of the variant''s (lot_unknown), and only for a tracked variant (lot_not_allowed).'
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                lotId:
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11).'
                    format: double
                    type: number
                suggestion:
                    $ref: '#/components/schemas/InventoryTransferSuggestion'
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
            type: object
        InventoryTransferPage:
            additionalProperties: false
            description: Transfers newest first.
            properties:
                next:
                    description: Pass as cursor for the next page; absent on the last.
                    type: string
                transfers:
                    items:
                        $ref: '#/components/schemas/InventoryTransferSummary'
                    type: array
            required:
                - transfers
            type: object
        InventoryTransferReceiveInput:
            additionalProperties: false
            description: 'A receive (I40–I42): the quantities that arrived now and, optionally, the difference closed. No If-Match (I41): two receivers both land, each judged against the other''s result.'
            properties:
                clientRequestId:
                    description: A UUID made when the page opens and kept across retries (D I14).
                    format: uuid
                    type: string
                close:
                    $ref: '#/components/schemas/InventoryTransferClose'
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryTransferReceiveLine'
                    type: array
            required:
                - clientRequestId
                - lines
            type: object
        InventoryTransferReceiveLine:
            additionalProperties: false
            description: 'What arrived now of one line and where it goes (I40): at most the line''s outstanding, in the variant''s unit or entered in packagings as they are today. Exactly one of quantity and entered is given; 0 receives nothing of the line.'
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                lineId:
                    format: int64
                    type: integer
                quantity:
                    description: 0 or more, at most three decimals.
                    format: double
                    type: number
                toLocationId:
                    format: int64
                    type: integer
            required:
                - lineId
                - toLocationId
            type: object
        InventoryTransferRef:
            additionalProperties: false
            description: A transfer as other answers name it.
            properties:
                id:
                    format: int64
                    type: integer
                number:
                    description: From the module's own series, shown as Transfer 1042 and TRF-1042 (I36).
                    format: int64
                    type: integer
            required:
                - id
                - number
            type: object
        InventoryTransferSendInput:
            additionalProperties: false
            description: 'Sending a draft (I39): a source location for every line. The client request id is derived from the transfer, so a retried send replays.'
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryTransferSendLine'
                    minItems: 1
                    type: array
                receive:
                    $ref: '#/components/schemas/InventoryTransferSendReceive'
            required:
                - lines
            type: object
        InventoryTransferSendLine:
            additionalProperties: false
            description: 'Where one line is sent from: a location at the from site. A line of the transfer without one is from_location_required. lotId names the lot sent, replacing the draft''s; a tracked variant''s line sent with none is lot_required (manufacturing phase 2 M70).'
            properties:
                fromLocationId:
                    format: int64
                    type: integer
                lineId:
                    format: int64
                    type: integer
                lotId:
                    format: int64
                    type: integer
            required:
                - lineId
            type: object
        InventoryTransferSendReceive:
            additionalProperties: false
            description: 'Send and receive (I43): a destination for every line, or receive_incomplete; everything sent is received in the same transaction.'
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryTransferDestination'
                    minItems: 1
                    type: array
            required:
                - lines
            type: object
        InventoryTransferStatus:
            description: 'A transfer''s status (I36): draft holds nothing and may be edited and deleted (I37); sent is in transit; partly_received has had some of it received; received has nothing outstanding — every line received, or its difference closed (I42); cancelled was sent and returned whole to the from site (I44).'
            enum:
                - draft
                - sent
                - partly_received
                - received
                - cancelled
            type: string
        InventoryTransferStatusFilter:
            description: 'A status, or open: draft, sent and partly_received together.'
            enum:
                - open
                - draft
                - sent
                - partly_received
                - received
                - cancelled
            type: string
        InventoryTransferSuggestion:
            additionalProperties: false
            description: 'The low-stock list''s suggestion a line was drafted from (I57): what was needed, and the smallest packaging it was rounded up to and how many of it. Kept until the line is edited, which clears it; stored and returned as given.'
            properties:
                count:
                    description: How many of the packaging; null when the variant has no packagings.
                    format: int32
                    nullable: true
                    type: integer
                needed:
                    description: What the rule found needed, in the variant's unit.
                    format: double
                    type: number
                packagingId:
                    description: The smallest packaging; null when the variant has none.
                    format: int32
                    nullable: true
                    type: integer
            required:
                - needed
                - packagingId
                - count
            type: object
        InventoryTransferSummary:
            additionalProperties: false
            description: A transfer without its lines and actions, for the list.
            properties:
                createdAt:
                    format: date-time
                    type: string
                expectedArrival:
                    format: date
                    type: string
                fromSite:
                    $ref: '#/components/schemas/InventorySiteRef'
                id:
                    format: int64
                    type: integer
                inTransit:
                    format: double
                    type: number
                lineCount:
                    format: int32
                    type: integer
                missing:
                    description: What its closed difference recorded as missing, summed over the lines.
                    format: double
                    type: number
                number:
                    format: int64
                    type: integer
                overdue:
                    description: Sent or partly received and past its expected arrival, or without one sent more than 7 days ago (I62).
                    type: boolean
                reference:
                    type: string
                sentAt:
                    format: date-time
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryTransferStatus'
                toSite:
                    $ref: '#/components/schemas/InventorySiteRef'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - number
                - status
                - fromSite
                - toSite
                - lineCount
                - inTransit
                - missing
                - overdue
                - createdAt
                - updatedAt
            type: object
        InventoryUncounted:
            description: 'What posting does with a line nobody counted: keep its balance, or count it as zero (I19).'
            enum:
                - keep
                - zero
            type: string
        InventoryVariantList:
            additionalProperties: false
            description: At most 50 goods variants by SKU.
            properties:
                variants:
                    items:
                        $ref: '#/components/schemas/InventoryVariantRef'
                    type: array
            required:
                - variants
            type: object
        InventoryVariantRef:
            additionalProperties: false
            description: A variant as the catalog answers it, or as its last movement line snapshotted it when the catalog no longer knows it (deleted).
            properties:
                barcode:
                    type: string
                deleted:
                    description: True when the catalog no longer has the variant; the fields are its last movement line's snapshot.
                    type: boolean
                id:
                    format: int32
                    type: integer
                packagings:
                    description: The variant's packagings, by sort order; absent on a deleted variant.
                    items:
                        $ref: '#/components/schemas/InventoryPackaging'
                    type: array
                primaryLocationId:
                    description: The variant's primary location at the search's siteId; absent without one, or when the search named no site.
                    format: int64
                    type: integer
                productId:
                    description: Absent on a deleted variant.
                    format: int32
                    type: integer
                productName:
                    type: string
                sku:
                    type: string
                tracking:
                    description: 'How the variant''s stock is kept (manufacturing phase 2 M49): none, in lots, or in serials; absent on a deleted variant.'
                    enum:
                        - none
                        - lot
                        - serial
                    type: string
                unit:
                    type: string
            required:
                - id
                - sku
                - productName
                - unit
            type: object
        InventoryVariantRules:
            additionalProperties: false
            description: 'A variant''s rules in Inventory (manufacturing phase 2 M100). inspectOnReceipt puts every lot a receipt of the variant creates or adds to under a quarantine hold of cause inspection, released on the lot page. revision is 0 while the variant has no rules.'
            properties:
                inspectOnReceipt:
                    type: boolean
                revision:
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    nullable: true
                    type: string
                updatedBy:
                    $ref: '#/components/schemas/InventoryActor'
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - inspectOnReceipt
                - revision
                - updatedAt
            type: object
        InventoryVariantRulesInput:
            additionalProperties: false
            description: 'A variant''s rules as sent: inspectOnReceipt only for a tracked variant (inspection_requires_tracking), under the revision read (0 when it had none).'
            properties:
                inspectOnReceipt:
                    type: boolean
                revision:
                    format: int32
                    type: integer
            required:
                - inspectOnReceipt
                - revision
            type: object
        InventoryVariantStock:
            additionalProperties: false
            description: One variant's stock by site (I27).
            properties:
                sites:
                    description: Sites holding stock, a reservation or incoming of it, by code.
                    items:
                        $ref: '#/components/schemas/InventorySiteStock'
                    type: array
                totalAvailable:
                    description: Total usable on hand — on hand without the lots on hold or expired — less total reserved.
                    format: double
                    type: number
                totalOnHand:
                    format: double
                    type: number
                totalReserved:
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - totalOnHand
                - totalReserved
                - totalAvailable
                - sites
            type: object
info:
    title: Vantigo Inventory API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/inventory/counts:
        get:
            operationId: listInventoryCounts
            parameters:
                - in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryCountStatus'
                - in: query
                  name: siteId
                  required: false
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCountList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List counts
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
        post:
            description: Opens a count of a site or of a location and its subtree, freezing what is expected on every balance in scope (I17). Movements are not blocked while counting.
            operationId: openInventoryCount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors; the location is not in the site, or archived.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_scope_overlaps.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Open a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}:
        get:
            operationId: getInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Get a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/cancel:
        post:
            description: Cancels a count still counting; nothing is posted.
            operationId: cancelInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_not_open.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. The count was cancelled; only reading it back failed.'
            summary: Cancel a count
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/lines:
        put:
            description: Records counted quantities, changing a line that exists and adding one for a pair that does not (I18). Refused whole when any line fails; every failing line is answered.
            operationId: putInventoryCountLines
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountLinesInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, or the lines' codes in lines (a location outside the scope is location_not_found).
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such count. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — count_not_open.
                "503":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: 'Service Unavailable — dependency_unavailable: Products is not composed. Nothing was changed.'
            summary: Record counted quantities
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:counts-manage+inventory:locations-view+inventory:stock-view
    /api/v1/inventory/counts/{id}/post:
        post:
            description: Posts one count movement of the differences between what was counted and the balance now (I19).
            operationId: postInventoryCount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventoryCountPostInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventoryCount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, or a line's code in lines.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
