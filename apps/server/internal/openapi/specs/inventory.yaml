components:
    schemas:
        InventoryActor:
            additionalProperties: false
            description: Who posted, as snapshotted when they did.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - displayName
            type: object
        InventoryAddress:
            additionalProperties: false
            description: A site's postal address; every field optional.
            properties:
                city:
                    maxLength: 100
                    type: string
                country:
                    description: ISO 3166-1 alpha-2.
                    maxLength: 2
                    minLength: 2
                    type: string
                line1:
                    maxLength: 200
                    type: string
                line2:
                    maxLength: 200
                    type: string
                postalCode:
                    maxLength: 20
                    type: string
            type: object
        InventoryAdjustmentInput:
            additionalProperties: false
            description: 'An adjustment (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryAdjustmentLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                reason:
                    $ref: '#/components/schemas/InventoryAdjustmentReason'
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - reason
                - lines
            type: object
        InventoryAdjustmentLine:
            additionalProperties: false
            description: change adds quantity, signed and not 0, to what lies there; set makes it the new on hand, 0 or more, and is posted as the difference — a line whose difference is 0 is dropped (I15). Exactly one of quantity and entered is given. Entered under change adds, or takes away with decrease.
            properties:
                decrease:
                    description: 'With entered under change: the entered quantity is taken away rather than added.'
                    type: boolean
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                lotId:
                    description: 'The lot the line takes or puts (manufacturing phase 2 M59): required for a tracked variant, refused for an untracked one (lot_not_allowed).'
                    format: int64
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryNewLot'
                mode:
                    enum:
                        - change
                        - set
                    type: string
                quantity:
                    description: Signed under change, at most three decimals.
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
                - mode
            type: object
        InventoryAdjustmentReason:
            enum:
                - correction
                - damaged
                - lost
                - found
                - opening_balance
                - other
            type: string
        InventoryBalanceRow:
            additionalProperties: false
            description: What lies of one variant on one location.
            properties:
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                onHand:
                    format: double
                    type: number
                primary:
                    description: The variant's primary location at the site (I55); set on a site's stock rows, absent elsewhere.
                    type: boolean
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - location
                - onHand
            type: object
        InventoryBulkCreateInput:
            additionalProperties: false
            description: 'A grid of locations under a parent (I5): every combination of the levels'' codes, the first level under the parent, each next level under every location of the one before.'
            properties:
                levels:
                    description: One to three levels.
                    items:
                        $ref: '#/components/schemas/InventoryBulkLevel'
                    maxItems: 3
                    minItems: 1
                    type: array
                parentId:
                    format: int64
                    type: integer
            required:
                - parentId
                - levels
            type: object
        InventoryBulkCreated:
            additionalProperties: false
            description: The locations created, by full code.
            properties:
                created:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
            required:
                - created
            type: object
        InventoryBulkLevel:
            additionalProperties: false
            description: 'One level of a bulk create: a kind and the codes of a range. from and to are both digits, padded to the width of from (01–12), or both one letter (A–D); to absent makes the one code from. prefix is put before each code.'
            properties:
                from:
                    maxLength: 16
                    minLength: 1
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                prefix:
                    maxLength: 15
                    type: string
                to:
                    maxLength: 16
                    type: string
            required:
                - kind
                - from
            type: object
        InventoryCount:
            additionalProperties: false
            description: A stock count of a site, or of one location and its subtree (I16).
            properties:
                cancelledAt:
                    format: date-time
                    type: string
                cancelledBy:
                    $ref: '#/components/schemas/InventoryActor'
                countedLines:
                    description: Lines with a counted quantity.
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                lineCount:
                    format: int32
                    type: integer
                lines:
                    description: By the location's full code, then SKU; present on GET /counts/{id} and the writes.
                    items:
                        $ref: '#/components/schemas/InventoryCountLine'
                    type: array
                movedLines:
                    description: Lines whose balance changed since the count opened.
                    format: int32
                    type: integer
                movementId:
                    description: The count movement a posted count wrote.
                    format: int64
                    type: integer
                note:
                    type: string
                openedAt:
                    format: date-time
                    type: string
                openedBy:
                    $ref: '#/components/schemas/InventoryActor'
                postedAt:
                    format: date-time
                    type: string
                postedBy:
                    $ref: '#/components/schemas/InventoryActor'
                revision:
                    format: int32
                    type: integer
                scope:
                    $ref: '#/components/schemas/InventoryLocationRef'
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                status:
                    $ref: '#/components/schemas/InventoryCountStatus'
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - id
                - site
                - scope
                - status
                - openedBy
                - openedAt
                - lineCount
                - countedLines
                - movedLines
                - revision
            type: object
        InventoryCountInput:
            additionalProperties: false
            description: 'Opening a count: of a whole site, or of one location and everything below it (I16, I17).'
            properties:
                locationId:
                    description: The location the count covers with its subtree; the site's root when absent.
                    format: int64
                    type: integer
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - siteId
            type: object
        InventoryCountLine:
            additionalProperties: false
            description: 'One variant on one location in a count: what was expected when it opened, what the balance is now, and what was counted (I17–I19).'
            properties:
                added:
                    description: 'The line was added while counting: nothing was expected there.'
                    type: boolean
                counted:
                    description: What was counted; absent until someone counts it.
                    format: double
                    type: number
                countedAt:
                    format: date-time
                    type: string
                countedBy:
                    $ref: '#/components/schemas/InventoryActor'
                current:
                    description: The balance now.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEnteredSnapshot'
                expected:
                    description: The balance when the count opened.
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                moved:
                    description: The balance changed since the count opened; posting needs acceptMoved (I19).
                    type: boolean
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - id
                - variant
                - location
                - expected
                - current
                - added
                - moved
            type: object
        InventoryCountLineInput:
            additionalProperties: false
            description: 'A counted quantity of a variant on a location in the count''s scope (I18): a line that exists is changed, a pair with no line is added. Exactly one of quantity and entered is given. 0 is a valid count.'
            properties:
                counted:
                    description: 0 or more, at most three decimals.
                    format: double
                    type: number
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
                - locationId
            type: object
        InventoryCountLinesInput:
            additionalProperties: false
            description: Counted lines, at most 500 per request.
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryCountLineInput'
                    maxItems: 500
                    minItems: 1
                    type: array
            required:
                - lines
            type: object
        InventoryCountList:
            additionalProperties: false
            description: Counts, newest first; at most 200.
            properties:
                counts:
                    items:
                        $ref: '#/components/schemas/InventoryCount'
                    type: array
            required:
                - counts
            type: object
        InventoryCountPostInput:
            additionalProperties: false
            description: Posting a count (I19).
            properties:
                acceptMoved:
                    description: Post although some lines' balances changed since the count opened; refused with count_lines_moved otherwise.
                    type: boolean
                uncounted:
                    $ref: '#/components/schemas/InventoryUncounted'
            required:
                - uncounted
            type: object
        InventoryCountStatus:
            enum:
                - counting
                - posted
                - cancelled
            type: string
        InventoryEntered:
            additionalProperties: false
            description: 'A quantity entered in packagings (I25) instead of quantity: the server computes the base quantity from the packagings as they are at posting and keeps the entry on the line.'
            properties:
                loose:
                    description: A rest in the variant's own unit, 0 or more, at most three decimals.
                    format: double
                    type: number
                packagings:
                    description: At most one entry per packaging.
                    items:
                        $ref: '#/components/schemas/InventoryEnteredPackaging'
                    maxItems: 10
                    type: array
            required:
                - packagings
            type: object
        InventoryEnteredPackaging:
            additionalProperties: false
            description: A count of one packaging.
            properties:
                count:
                    description: At least 1.
                    format: int32
                    minimum: 1
                    type: integer
                packagingId:
                    format: int32
                    type: integer
            required:
                - packagingId
                - count
            type: object
        InventoryEnteredSnapshot:
            additionalProperties: false
            description: 'What a line was entered as, as it was at posting: each packaging''s name, count and content then, and the loose rest (I25).'
            properties:
                loose:
                    format: double
                    type: number
                packagings:
                    items:
                        additionalProperties: false
                        description: One packaging of the entry.
                        properties:
                            count:
                                format: int32
                                type: integer
                            name:
                                type: string
                            packagingId:
                                format: int32
                                type: integer
                            quantity:
                                description: Its content in the variant's unit at posting.
                                format: double
                                type: number
                        required:
                            - packagingId
                            - name
                            - quantity
                            - count
                        type: object
                    type: array
            required:
                - packagings
            type: object
        InventoryImportOutcome:
            enum:
                - ok
                - location_not_found
                - variant_not_found
                - variant_not_stockable
                - quantity_invalid
            type: string
        InventoryImportResult:
            additionalProperties: false
            description: 'The import''s answer: every row''s outcome, and on a committed import the one movement it posted.'
            properties:
                movementId:
                    description: The adjustment movement posted; absent on a dry run or a refused import.
                    format: int64
                    type: integer
                ok:
                    description: Every row is ok.
                    type: boolean
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryImportRow'
                    type: array
            required:
                - ok
                - rows
            type: object
        InventoryImportRow:
            additionalProperties: false
            description: One row of the opening-balance file and its outcome (I32).
            properties:
                detail:
                    type: string
                location:
                    description: The full code as written.
                    type: string
                outcome:
                    $ref: '#/components/schemas/InventoryImportOutcome'
                quantity:
                    description: As written.
                    type: string
                row:
                    description: The row in the file, the header being row 1.
                    format: int32
                    type: integer
                sku:
                    description: As written.
                    type: string
            required:
                - row
                - location
                - sku
                - quantity
                - outcome
            type: object
        InventoryLabelLayout:
            description: Avery L7160 (21 labels per A4) or L7163 (14 per A4).
            enum:
                - l7160
                - l7163
            type: string
        InventoryLabelsInput:
            additionalProperties: false
            description: 'Labels to print (I7): each carries the location''s LOC token as a Code 128 barcode, its full code and its name.'
            properties:
                layout:
                    $ref: '#/components/schemas/InventoryLabelLayout'
                locationIds:
                    description: At most 1000.
                    items:
                        format: int64
                        type: integer
                    maxItems: 1000
                    minItems: 1
                    type: array
                subtree:
                    description: Also every active location below each one.
                    type: boolean
            required:
                - locationIds
                - layout
            type: object
        InventoryLotRef:
            additionalProperties: false
            description: A lot as a movement line names it (manufacturing phase 2 M52).
            properties:
                expiry:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                number:
                    type: string
            required:
                - id
                - number
            type: object
        InventoryLocation:
            additionalProperties: false
            description: A node of a site's tree (I2).
            properties:
                code:
                    description: 1–16 characters A–Z and 0–9, unique among its siblings.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                depth:
                    description: 0 at the root, at most 8.
                    format: int32
                    type: integer
                fullCode:
                    description: The codes from the root down joined with -, unique in the deployment (I4).
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                parentId:
                    description: Absent on the root.
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /locations/{id}.
                    format: int32
                    type: integer
                siteId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - siteId
                - kind
                - code
                - fullCode
                - depth
                - sortOrder
                - status
                - revision
                - createdAt
                - updatedAt
            type: object
        InventoryLocationContents:
            additionalProperties: false
            description: What lies on the location — and below it unless subtree is false — by full code then SKU.
            properties:
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryBalanceRow'
                    type: array
            required:
                - rows
            type: object
        InventoryLocationDetail:
            additionalProperties: false
            description: A location with its site, its path from the root and its children (I29).
            properties:
                children:
                    description: Its children by sort order then code, archived ones included.
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
                location:
                    $ref: '#/components/schemas/InventoryLocation'
                path:
                    description: From the root down to the parent; empty on the root.
                    items:
                        $ref: '#/components/schemas/InventoryLocationRef'
                    type: array
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
            required:
                - location
                - site
                - path
                - children
            type: object
        InventoryLocationInput:
            additionalProperties: false
            description: A new location under a parent of the same site.
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
            required:
                - parentId
                - kind
                - code
            type: object
        InventoryLocationKind:
            description: site is the root's alone and is never written (I2).
            enum:
                - site
                - zone
                - area
                - sales_floor
                - back_room
                - aisle
                - rack
                - shelf
                - bin
                - display
                - dock
                - other
            type: string
        InventoryLocationList:
            additionalProperties: false
            description: A site's locations, flat, by full code; at most 10,000, truncated saying when more matched.
            properties:
                locations:
                    items:
                        $ref: '#/components/schemas/InventoryLocation'
                    type: array
                truncated:
                    description: True when more than 10,000 locations matched and the list was cut.
                    type: boolean
            required:
                - locations
                - truncated
            type: object
        InventoryLocationRef:
            additionalProperties: false
            description: A location as other answers name it.
            properties:
                fullCode:
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    type: string
                siteId:
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - id
                - siteId
                - fullCode
                - kind
                - status
            type: object
        InventoryLocationUpdate:
            additionalProperties: false
            description: 'A location''s fields, replaced whole. A new parent re-parents the location with its subtree and its stock inside its site (I21); a new code or parent rewrites the subtree''s full codes (I4). archived archives the subtree and is refused location_has_stock while anything in it holds stock; active reactivates the location alone, under an active parent (I6). The root takes only name and sortOrder: its code is the site''s.'
            properties:
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                kind:
                    $ref: '#/components/schemas/InventoryLocationKind'
                name:
                    maxLength: 200
                    type: string
                parentId:
                    description: Required on every location but the root.
                    format: int64
                    type: integer
                sortOrder:
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - kind
                - code
                - sortOrder
                - status
            type: object
        InventoryLookupMatch:
            additionalProperties: false
            description: 'One match of the lookup (I28): a location by its LOC token or full code, a variant by its SKU or barcode, or a transfer by its TRF token to a caller holding both views (I52).'
            properties:
                kind:
                    enum:
                        - location
                        - variant
                        - transfer
                    type: string
                location:
                    $ref: '#/components/schemas/InventoryLocationRef'
                transfer:
                    $ref: '#/components/schemas/InventoryTransferRef'
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - kind
            type: object
        InventoryLookupResult:
            additionalProperties: false
            description: The matches, locations first; empty when nothing matched.
            properties:
                matches:
                    items:
                        $ref: '#/components/schemas/InventoryLookupMatch'
                    type: array
            required:
                - matches
            type: object
        InventoryLowStockElsewhere:
            additionalProperties: false
            description: What another active site has available of the variant.
            properties:
                available:
                    format: double
                    type: number
                siteId:
                    format: int64
                    type: integer
                siteName:
                    type: string
            required:
                - siteId
                - siteName
                - available
            type: object
        InventoryLowStockPackaging:
            additionalProperties: false
            description: 'The variant''s smallest packaging, which the suggestion was rounded up to (I57): fewest units, then sort order, then id.'
            properties:
                count:
                    description: How many of it the suggestion is.
                    format: int32
                    type: integer
                id:
                    format: int32
                    type: integer
                kind:
                    description: inner, case, pallet or other; the screen names the packaging by its kind.
                    type: string
                name:
                    type: string
                quantity:
                    description: What one holds, in the variant's unit.
                    format: double
                    type: number
            required:
                - id
                - kind
                - name
                - quantity
                - count
            type: object
        InventoryLowStockPage:
            additionalProperties: false
            description: Low placements by site code, then SKU.
            properties:
                next:
                    description: Pass as cursor for the next page; absent on the last.
                    type: string
                rows:
                    items:
                        $ref: '#/components/schemas/InventoryLowStockRow'
                    type: array
            required:
                - rows
            type: object
        InventoryLowStockRow:
            additionalProperties: false
            description: 'One low placement (I56–I58): the variant at an active site whose available plus incoming is at or below its reorder point, what it needs to reach its target — the maximum, or one above the reorder point — and the suggestion rounded up to whole packagings.'
            properties:
                available:
                    description: On hand less reserved.
                    format: double
                    type: number
                elsewhere:
                    description: Every other active site's available, by site code.
                    items:
                        $ref: '#/components/schemas/InventoryLowStockElsewhere'
                    type: array
                incoming:
                    description: In transit to the site on open transfers.
                    format: double
                    type: number
                maximum:
                    format: double
                    nullable: true
                    type: number
                needed:
                    description: The target less available plus incoming; at least 1.
                    format: double
                    type: number
                onHand:
                    format: double
                    type: number
                openDrafts:
                    description: The numbers of the draft transfers to the site with a line of the variant (I59).
                    items:
                        format: int64
                        type: integer
                    type: array
                packaging:
                    allOf:
                        - $ref: '#/components/schemas/InventoryLowStockPackaging'
                    nullable: true
                reorderPoint:
                    format: double
                    type: number
                reserved:
                    format: double
                    type: number
                site:
                    $ref: '#/components/schemas/InventorySiteRef'
                suggested:
                    description: Needed, rounded up to a whole number of the packaging; needed when the variant has none. It may pass the maximum.
                    format: double
                    type: number
                variant:
                    $ref: '#/components/schemas/InventoryVariantRef'
            required:
                - variant
                - site
                - onHand
                - reserved
                - available
                - incoming
                - reorderPoint
                - maximum
                - needed
                - suggested
                - packaging
                - elsewhere
                - openDrafts
            type: object
        InventoryMeta:
            additionalProperties: false
            description: 'What the app needs to start (§5): the caller''s seven capabilities.'
            properties:
                canAdjust:
                    description: inventory:stock-adjust — adjustments and moves.
                    type: boolean
                canOverrideExpired:
                    description: inventory:expired-override — issuing or consuming an expired lot the person chose (manufacturing phase 2 M62).
                    type: boolean
                today:
                    description: Today in the workspace's business time zone, the day a lot's expiry is judged against (manufacturing phase 2 M62).
                    format: date
                    type: string
                canCount:
                    description: inventory:counts-manage — counts.
                    type: boolean
                canManageLocations:
                    description: inventory:locations-manage — sites and locations.
                    type: boolean
                canReceive:
                    description: inventory:receipts-manage — goods receipts.
                    type: boolean
                canTransfer:
                    description: inventory:transfers-manage — transfers between sites.
                    type: boolean
                canViewLocations:
                    description: inventory:locations-view — sites and locations, without quantities.
                    type: boolean
                canViewStock:
                    description: inventory:stock-view — quantities and movements.
                    type: boolean
            required:
                - canViewLocations
                - canManageLocations
                - canViewStock
                - canAdjust
                - canReceive
                - canCount
                - canTransfer
                - canOverrideExpired
                - today
            type: object
        InventoryMoveInput:
            additionalProperties: false
            description: 'A move (I15): at most 500 lines, every location in the site.'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryMoveLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - lines
            type: object
        InventoryMoveLine:
            additionalProperties: false
            description: A quantity moved from one location to another of the same site. Exactly one of quantity and entered is given.
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                fromLocationId:
                    format: int64
                    type: integer
                lotId:
                    description: 'The lot the line takes or puts (manufacturing phase 2 M59): required for a tracked variant, refused for an untracked one (lot_not_allowed).'
                    format: int64
                    type: integer
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                toLocationId:
                    format: int64
