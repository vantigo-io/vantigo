                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
                status:
                    $ref: '#/components/schemas/InventoryStatus'
            required:
                - code
                - name
                - kind
                - status
            type: object
        InventorySourceRef:
