                id:
                    format: int64
                    type: integer
                number:
                    type: string
                onHand:
                    format: double
                    type: number
                productionDate:
                    format: date
                    nullable: true
                    type: string
                quantityIn:
                    description: Received, produced or adjusted in under the lot, over every movement.
