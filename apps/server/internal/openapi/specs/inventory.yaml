                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySite'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
            summary: Get a site
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-view
        put:
            description: Replaces the site's fields (I1, I4, I6). A new code rewrites every full code in the site; archiving archives every location and is refused while anything in the site holds stock.
            operationId: putInventorySite
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the site was read at, bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InventorySiteUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/InventorySite'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Bad Request — field errors, code_invalid.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such site. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/InventoryProblem'
                    description: Conflict — site_code_taken, full_code_taken, location_has_stock, or revision_conflict.
            summary: Change a site
            tags:
                - Inventory
            x-vantigo-access: permission:inventory:locations-manage+inventory:locations-view
    /api/v1/inventory/sites/{id}/locations:
        get:
            description: Every location of the site, flat, by full code, the root included; at most 10,000.
            operationId: listInventorySiteLocations
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: Only locations in this status; every location when absent.
                  in: query
                  name: status
                  required: false
                  schema:
                    $ref: '#/components/schemas/InventoryStatus'
                - description: Only locations whose full code or name contains this, ignoring case.
                  in: query
                  name: q
                  required: false
                  schema:
                    maxLength: 100
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
