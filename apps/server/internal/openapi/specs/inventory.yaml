                - primaryLocation
                - reorderPoint
                - maximum
                - outcome
            type: object
        InventoryPlacementInput:
            additionalProperties: false
            description: A placement's three fields (I54), each null to leave it unset; all three null is placement_empty — remove the placement instead. The maximum is never below the reorder point (maximum_below_reorder_point); the primary location is an active location of the site (placement_location_invalid).
            properties:
                maximum:
                    format: double
                    nullable: true
                    type: number
                primaryLocationId:
                    format: int64
                    nullable: true
                    type: integer
                reorderPoint:
                    format: double
                    nullable: true
                    type: number
            required:
                - primaryLocationId
                - reorderPoint
                - maximum
            type: object
        InventoryProblem:
            description: 'An RFC 9457 problem with this module''s refusal code (inventory design §4). code names the rule that refused and is what a client keys off, never the words: site_code_taken, location_code_taken and full_code_taken (409: the code is in use — a site''s in the deployment, a location''s among its siblings, or the full code it would make; a bulk create lists every colliding full code in detail), code_invalid (400: not 1–16 characters A–Z and 0–9 after upper-casing, or of the form LOC followed by digits, which labels reserve), depth_exceeded (400: the tree would be more than 8 levels below the root), parent_invalid (400: the parent is in another site, is the location itself or below it, or is archived), bulk_too_large (400: more than 1000 locations), location_has_stock (409: the location or something below it holds stock; detail names the quantity and the number of lines), location_has_history (409: a movement line has named the location or something below it, so it can only be archived), root_location (409: a site''s root is archived or deleted with its site, never alone), revision_conflict (409: the If-Match revision has moved on), insufficient_stock (409: a line would take a balance below zero; lines name it), client_request_reused (409: the clientRequestId was posted before with a different body), count_scope_overlaps (409: another count still counting covers part of the scope), count_not_open (409: a write to a posted or cancelled count), count_lines_moved (409: posting would count lines whose balances changed since the count opened; lines name them), location_has_open_count (409: archiving a location with a count still counting in its subtree), labels_too_many (400: more than 1000 labels), transfer_same_site (400: the from and to site are one), site_archived (400: a write names an archived site), transfer_not_draft (409: an edit, delete or send of a transfer that is not a draft), transfer_not_receivable (409: a receive of a draft, received or cancelled transfer), transfer_not_cancellable (409: a cancel of a transfer not sent, or with something received or missing), nothing_to_close (409: a close with nothing outstanding), receive_incomplete (400: a send and receive without a destination for every line), site_has_open_transfers (409: archiving a site that a sent or partly received transfer names), location_in_transit (409: archiving a location a line still in transit was sent from), site_has_transfers (409: deleting a site a transfer names), maximum_below_reorder_point (400: a placement''s maximum below its reorder point), placement_empty (400: a placement written with no primary location, reorder point or maximum — remove it instead), placement_location_invalid (400: a primary location archived, or in another site), and a posting''s line codes — location_archived, location_not_found, variant_not_found, variant_not_stockable, variant_discontinued, move_crosses_sites, same_location, quantity_invalid, packaging_not_found (an entered packaging the variant does not have), entered_invalid (both or neither of quantity and entered, or a packaging named twice), transfer_over_received (more than the line''s outstanding), from_location_required (a send line without a source location), transfer_line_unknown (a line not on the transfer), and the lot rules of manufacturing phase 2 M56–M57: lot_required (a tracked variant''s line names no lot), lot_not_allowed (an untracked variant''s line names one), lot_unknown (no such lot of the variant), serial_quantity (a serial line''s quantity is not 1, or a serial would hold more than 1), serial_first_invalid (a first serial with no trailing digits), lot_dates_differ (a stated date differs from the existing lot''s), and the 409s lot_expired (an expired lot taken without the override) and lot_blocked (a lot on hold issued or consumed, or received into while blocked) — with nothing_to_post and too_many_lines (400). A posting checks every line before it writes any and answers all of them at once in lines; a problem about the request as a whole has none. errors carries the field errors of a 400, keyed by the request''s camelCase field. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                lines:
                    description: Every failing line of a posting, in the request's order.
                    items:
                        $ref: '#/components/schemas/InventoryProblemLine'
                    type: array
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        InventoryProblemLine:
            additionalProperties: false
            description: One failing line of a posting.
            properties:
                code:
                    description: The line's refusal code, as the problem's description lists them.
                    type: string
                detail:
                    description: 'What a person reads: the SKU, the location''s full code and the quantity where they apply.'
                    type: string
                index:
                    description: The line's position in the request, from 0.
                    format: int32
                    type: integer
            required:
                - index
                - code
                - detail
            type: object
        InventoryProductStock:
            additionalProperties: false
            description: A product's stock, per variant, for the product page's Stock card (I27). A Service product answers no variants.
            properties:
                productId:
                    format: int32
                    type: integer
                variants:
                    description: Every goods variant of the product, with or without stock, in the catalog's order.
                    items:
                        $ref: '#/components/schemas/InventoryVariantStock'
                    type: array
            required:
                - productId
                - variants
            type: object
        InventoryReceiptInput:
            additionalProperties: false
            description: 'A goods receipt (I15): at most 500 lines, every location in the site. A Discontinued product''s variant is refused (I12).'
            properties:
                clientRequestId:
                    description: A UUID made when the form opens and kept across retries (I14).
                    format: uuid
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/InventoryReceiptLine'
                    minItems: 1
                    type: array
                note:
                    maxLength: 1000
                    type: string
                siteId:
                    format: int64
                    type: integer
                supplierName:
                    maxLength: 200
                    type: string
                supplierReference:
                    maxLength: 100
                    type: string
                toLocationId:
                    description: Where every line goes that names no location of its own.
                    format: int64
                    type: integer
            required:
                - clientRequestId
                - siteId
                - toLocationId
                - lines
            type: object
        InventoryReceiptLine:
            additionalProperties: false
            description: A quantity received, to locationId or the receipt's toLocationId. Exactly one of quantity and entered is given.
            properties:
                entered:
                    $ref: '#/components/schemas/InventoryEntered'
                locationId:
                    description: Overrides the receipt's toLocationId for this line.
                    format: int64
                    type: integer
                lotId:
                    description: 'The lot the line takes or puts (manufacturing phase 2 M59): required for a tracked variant, refused for an untracked one (lot_not_allowed).'
                    format: int64
                    type: integer
                lot:
                    $ref: '#/components/schemas/InventoryNewLot'
                serials:
                    $ref: '#/components/schemas/InventorySerials'
                quantity:
                    description: 'A quantity in the variant''s own unit: more than 0, at most 99,999,999,999.999, at most three decimals (I11). More decimals are refused with quantity_invalid, never rounded.'
                    format: double
                    type: number
                variantId:
                    format: int32
                    type: integer
            required:
                - variantId
            type: object
        InventorySerials:
            additionalProperties: false
            description: 'The serial numbers of a receipt line of a serial variant (manufacturing phase 2 M57): count numbers from first, incrementing its trailing digits and keeping their width (SN0099, SN0100), or the numbers listed. The line becomes one line of 1 per serial, counted against the 500-line cap; the line''s quantity, when given, must equal their number. The line''s lot, when given, gives every serial its dates and supplier lot and names no number.'
            properties:
                count:
                    maximum: 500
                    minimum: 1
                    type: integer
                first:
                    maxLength: 20
                    type: string
                numbers:
                    items:
                        maxLength: 20
                        type: string
                    maxItems: 500
                    type: array
            type: object
        InventorySite:
            additionalProperties: false
            description: A warehouse or a store, the root of a location tree (I1).
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: 1–16 characters A–Z and 0–9, unique in the deployment; the first segment of every full code in the site.
                    type: string
                createdAt:
                    format: date-time
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site (orders design O45). A warehouse does by default, a store does not.
                    type: boolean
                id:
                    format: int64
                    type: integer
                incomingTransfers:
                    description: Open transfers to the site (sent or partly received); present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                lastReceiptAt:
                    description: When the site last received goods; present to a caller holding inventory:stock-view, absent when it never has.
                    format: date-time
                    type: string
                locationCount:
                    description: Its active locations, the root excluded.
                    format: int32
                    type: integer
                name:
                    type: string
                outgoingTransfers:
                    description: Open transfers from the site (sent or partly received); present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /sites/{id}.
                    format: int32
                    type: integer
                rootLocationId:
                    description: The site's root location, where stock may lie when the site has no shelves (I3).
                    format: int64
                    type: integer
                status:
                    $ref: '#/components/schemas/InventoryStatus'
                stockLines:
                    description: Balances in the site; present to a caller holding inventory:stock-view.
                    format: int32
                    type: integer
                updatedAt:
                    format: date-time
                    type: string
            required:
                - id
                - code
                - name
                - kind
                - status
                - rootLocationId
                - revision
                - createdAt
                - updatedAt
                - locationCount
                - fulfilsOrders
            type: object
        InventorySiteInput:
            additionalProperties: false
            description: A site's fields on create.
            properties:
                address:
                    $ref: '#/components/schemas/InventoryAddress'
                code:
                    description: Upper-cased before it is checked.
                    maxLength: 16
                    type: string
                fulfilsOrders:
                    description: Whether orders reserve and deliver stock from the site; when absent, true for a warehouse and false for a store.
                    type: boolean
                kind:
                    $ref: '#/components/schemas/InventorySiteKind'
                name:
                    maxLength: 200
                    minLength: 1
                    type: string
            required:
                - code
                - name
                - kind
            type: object
        InventorySiteKind:
            description: Changes the suggested location kinds and the words on screen, never a rule (I1).
            enum:
                - warehouse
                - store
            type: string
        InventorySiteList:
            additionalProperties: false
            description: The sites by code.
            properties:
                sites:
                    items:
                        $ref: '#/components/schemas/InventorySite'
                    type: array
            required:
                - sites
            type: object
        InventorySiteRef:
