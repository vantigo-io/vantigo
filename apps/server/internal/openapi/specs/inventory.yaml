            properties:
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/InventoryMovementKind'
                postedAt:
                    format: date-time
                    type: string
                reason:
                    type: string
                source:
                    $ref: '#/components/schemas/InventorySourceRef'
                supplierName:
                    type: string
                supplierReference:
                    type: string
                toSiteName:
