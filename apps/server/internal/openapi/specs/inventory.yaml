                onHand:
                    format: double
                    type: number
                placement:
                    $ref: '#/components/schemas/InventoryPlacement'
                reserved:
                    format: double
                    type: number
                siteId:
                    format: int64
                    type: integer
                variantId:
                    format: int32
                    type: integer
            required:
