                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - status
                - nationalId
            type: object
        StaffProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: in this delivery org_number_invalid, employee_number_too_long, employee_number_taken, work_email_taken, person_in_use, structure_archived, structure_default, department_cycle, revision_conflict, national_id_invalid, national_id_duplicate, national_id_birth_date_mismatch, bank_account_invalid, user_inactive, user_linked_elsewhere, no_person, employment_number_taken, end_reason_required, terms_required_fields, temporary_ground_required, appointment_form_mismatch, probation_too_long, full_time_hours_mismatch, terms_valid_from_taken, terms_before_start, terms_after_end, terms_first_row_start, terms_not_latest, self_manager, manager_cycle, document_type_unsupported, document_too_large, document_count_exceeded, category_restricted, category_in_use, seed_immutable, person_erased, storage_unavailable, legal_hold and reassessment_not_due. errors carries the field errors of a 400, keyed by the request''s camelCase field (an element of a list as nextOfKin[0].name, a nested one as terms.ftePercent); a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        StaffRelationshipType:
            description: The a-melding's kind of arbeidsforhold.
            enum:
                - ordinary
                - maritime
                - freelancer
                - pension_or_other
            type: string
        StaffRemunerationType:
            enum:
                - monthly
                - hourly
                - commission
                - fee
                - piecework
            type: string
        StaffSettings:
            description: The Staff settings delivery A1 exposes (design §3.6). The other columns of the settings row reach the contract with the deliveries that use them.
            properties:
                employeeNumberPrefix:
                    description: What a generated employee number starts with, up to eight letters, digits or hyphens; empty for none.
                    type: string
                injuryInsurer:
                    description: The occupational injury (yrkesskade) insurer. Absent when not set.
                    type: string
                nextEmployeeNumber:
                    description: The number the next generated employee number carries after the prefix, unpadded.
                    format: int64
                    type: integer
                pensionProvider:
                    description: The occupational pension (OTP) provider, which the § 14-6 check reads when a term names no social-security reference. Absent when not set.
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                timeZone:
                    description: The business time zone, an IANA name.
                    type: string
            required:
                - timeZone
                - employeeNumberPrefix
                - nextEmployeeNumber
                - revision
            type: object
        StaffSettingsRequest:
            description: A full replace of the settings delivery A1 exposes.
            properties:
                employeeNumberPrefix:
                    description: Up to eight letters, digits or hyphens. Left out, there is none.
                    maxLength: 8
                    type: string
                injuryInsurer:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                nextEmployeeNumber:
                    description: 1 or more. With the prefix it must make a number of at most 16 characters.
                    format: int64
                    type: integer
                pensionProvider:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                timeZone:
                    description: An IANA name such as Europe/Oslo, which this server and its database must read the same way.
                    maxLength: 64
                    type: string
            required:
                - timeZone
                - nextEmployeeNumber
            type: object
        StaffSimilarErasedRequest:
            description: A new person's names and birth date, to find an erased person they may be (the rehire warning). Sent as a body, not a query, so the names stay out of access logs.
            properties:
                birthDate:
                    format: date
                    type: string
                familyName:
                    type: string
                givenName:
                    type: string
            required:
                - givenName
                - familyName
                - birthDate
            type: object
        StaffStructure:
            description: The company's structure, present on GET /meta only for a caller holding staff:view or staff:manage. Archived rows are included so a stored reference can still be named; the pickers leave them out.
            properties:
                businessUnits:
                    items:
                        $ref: '#/components/schemas/StaffBusinessUnit'
                    type: array
                departments:
                    items:
                        $ref: '#/components/schemas/StaffDepartment'
                    type: array
                legalEntities:
                    items:
                        $ref: '#/components/schemas/StaffLegalEntity'
                    type: array
                locations:
                    items:
                        $ref: '#/components/schemas/StaffLocation'
                    type: array
            required:
                - legalEntities
                - businessUnits
                - departments
                - locations
            type: object
        StaffTemporaryGround:
            description: 'The ground of a temporary employment: aml. § 14-9 (2) a–e, or a tariff agreement''s.'
            enum:
                - a
                - b
                - c
                - d
                - e
                - tariff
            type: string
        StaffTerms:
            description: 'A terms row (design §3.3), shaped by who is asking (§5): the person themselves and HR read every field; a manager of theirs every field but the pay group (remunerationType, payComponents, payMethod, paydayText, seniorityDate, payGrade); a colleague holding staff:view validFrom, validTo, employmentType and ftePercent only; note is HR''s alone. A field the caller may not read is absent, never null.'
            properties:
                appointmentForm:
                    $ref: '#/components/schemas/StaffAppointmentForm'
                breakMinutes:
                    format: int32
                    type: integer
                competenceDevelopmentText:
                    description: Absent when not set.
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                departmentId:
                    format: int64
                    type: integer
                division:
                    description: Absent when not set.
                    type: string
                employeeType:
                    $ref: '#/components/schemas/StaffEmployeeType'
                employmentId:
                    format: int64
                    type: integer
                employmentType:
                    $ref: '#/components/schemas/StaffEmploymentType'
                expectedEndDate:
                    description: Absent when not set.
                    format: date
                    type: string
                ftePercent:
                    format: double
                    type: number
                fullTimeHoursPerWeek:
                    format: double
                    type: number
                hiredOutTo:
                    description: Absent when not set.
                    type: string
                holidayTermsText:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                locationId:
                    format: int64
                    type: integer
                managerPersonId:
                    format: int64
                    type: integer
                note:
                    description: HR's note — staff:manage and staff:personal-data only. Absent when not set.
                    type: string
                noticeEmployee:
                    format: int32
                    type: integer
                noticeEmployer:
                    format: int32
                    type: integer
                noticeUnit:
                    $ref: '#/components/schemas/StaffNoticeUnit'
                occupationCode:
                    description: Absent when not set.
                    type: string
                overtimeRuleText:
                    description: Absent when not set.
                    type: string
                payComponents:
                    description: Pay group. Absent when not recorded.
                    items:
                        $ref: '#/components/schemas/StaffPayComponent'
                    type: array
                payGrade:
                    description: Pay group. Absent when not set.
                    type: string
                payMethod:
                    description: Pay group. Absent when not set.
                    type: string
                paydayText:
                    description: Pay group. Absent when not set.
                    type: string
                probationEndDate:
                    description: Absent without a probation.
                    format: date
                    type: string
                probationExtendedTo:
                    description: Absent without an extension.
                    format: date
                    type: string
                probationExtensionAgreed:
                    type: boolean
                probationExtensionReason:
                    description: Absent when not set.
                    type: string
                remunerationType:
                    $ref: '#/components/schemas/StaffRemunerationType'
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                seniorityDate:
                    description: Pay group. Absent when not set.
                    format: date
                    type: string
                socialSecurityText:
                    description: Absent when not set.
                    type: string
                specialHoursText:
                    description: Absent when not set.
                    type: string
                tariffReference:
                    description: Absent when not set.
                    type: string
                temporaryGround:
                    $ref: '#/components/schemas/StaffTemporaryGround'
                title:
                    description: Absent when not set.
                    type: string
                validFrom:
                    description: The day the row takes effect.
                    format: date
                    type: string
                validTo:
                    description: 'The last day the row is in force: the day before the next row''s validFrom. Absent on the latest row.'
                    format: date
                    type: string
                workingHoursScheme:
                    $ref: '#/components/schemas/StaffWorkingHoursScheme'
                workingTimeText:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employmentId
                - validFrom
                - employmentType
                - ftePercent
                - revision
            type: object
        StaffTermsRequest:
            description: A terms row (design §3.3, S5). On POST /employments/{id}/terms a field left out takes the previous row's value and one sent as null is cleared; on an employment's first row and on PUT /terms/{id} a field left out is empty.
            properties:
                appointmentForm:
                    allOf:
                        - $ref: '#/components/schemas/StaffAppointmentForm'
                    description: Must agree with employmentType. Left out on the first row — or when the previous row's does not agree with this row's type — it is the type's own (fast or midlertidig).
                    nullable: true
                breakMinutes:
                    description: § 14-6 k. 0 to 1440.
                    format: int32
                    nullable: true
                    type: integer
                competenceDevelopmentText:
                    description: § 14-6 p. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                correction:
                    description: 'PUT /terms/{id} only: true replaces a row that is not the latest, as HR''s correction of a past row.'
                    type: boolean
                costCentre:
                    description: Up to 40 characters.
                    maxLength: 40
                    nullable: true
                    type: string
                departmentId:
                    description: An existing department; archived only when the previous row (or, on a change, the row) already names it.
                    format: int64
                    nullable: true
                    type: integer
                division:
                    description: Up to 100 characters.
                    maxLength: 100
                    nullable: true
                    type: string
                employeeType:
                    allOf:
                        - $ref: '#/components/schemas/StaffEmployeeType'
                    description: For an identity provider.
                    nullable: true
                employmentType:
                    allOf:
                        - $ref: '#/components/schemas/StaffEmploymentType'
                    description: 'Required on every row (the law presumes the employee''s claim when it is missing): given, or the previous row''s.'
                    nullable: true
                expectedEndDate:
                    description: A temporary employment's expected end. Dropped when the row is fast and it is not given.
                    format: date
                    nullable: true
                    type: string
                ftePercent:
                    description: 'Stillingsprosent: more than 0 and at most 100, at most two decimals. Required on every row: given, or the previous row''s.'
                    format: double
                    nullable: true
                    type: number
                fullTimeHoursPerWeek:
                    description: 'Hours per week for a full position, at most two decimals. Left out, the scheme''s: 37.5 not_shift and other_shift, 36.5 shift_365, 33.6 offshore_336 and continuous_336, 35.5 round_the_clock_355. Refused full_time_hours_mismatch unless exactly 36.5 for shift_365, exactly 35.5 for round_the_clock_355, 28 to 33.6 for the two 336 schemes; free otherwise (more than 0, at most 168).'
                    format: double
                    nullable: true
                    type: number
                hiredOutTo:
                    description: The innleier, when hired out (§ 14-6 o). Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                holidayTermsText:
                    description: § 14-6 g. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                locationId:
                    description: An existing location, the workplace (§ 14-6 b); archived only as for departmentId.
                    format: int64
                    nullable: true
                    type: integer
                managerPersonId:
                    description: The direct manager, never the person. Left empty, the department's manager is the person's manager.
                    format: int64
                    nullable: true
                    type: integer
                note:
                    description: HR's note on the row — staff:manage and staff:personal-data only. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                noticeEmployee:
                    description: '§ 14-6 h: the employee''s notice, in noticeUnit. 0 to 999.'
                    format: int32
                    nullable: true
                    type: integer
                noticeEmployer:
                    description: '§ 14-6 h: the employer''s notice, in noticeUnit. 0 to 999.'
                    format: int32
                    nullable: true
                    type: integer
                noticeUnit:
                    allOf:
                        - $ref: '#/components/schemas/StaffNoticeUnit'
                    description: Required with a notice.
                    nullable: true
                occupationCode:
                    description: 'The STYRK-08 yrkeskode: seven digits.'
                    nullable: true
                    type: string
                overtimeRuleText:
                    description: § 14-6 m. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                payComponents:
                    description: Pay group. Up to 20 components.
                    items:
                        $ref: '#/components/schemas/StaffPayComponent'
                    nullable: true
                    type: array
                payGrade:
                    description: Pay group. Up to 20 characters.
                    maxLength: 20
                    nullable: true
                    type: string
                payMethod:
                    description: Pay group (§ 14-6 i). Up to 40 characters.
                    maxLength: 40
                    nullable: true
                    type: string
                paydayText:
                    description: Pay group (§ 14-6 i). Up to 100 characters.
                    maxLength: 100
                    nullable: true
                    type: string
                probationEndDate:
                    description: 'The probation''s last day: at most six months after the employment''s start, and for a temporary employment at most half its expected term.'
                    format: date
                    nullable: true
                    type: string
                probationExtendedTo:
                    description: 'The extended probation''s last day: needs the extension agreed, a reason and a probationEndDate, and lies after it by at most the probation''s own length.'
                    format: date
                    nullable: true
                    type: string
                probationExtensionAgreed:
                    description: Whether an extension of the probation was agreed in writing (aml. § 15-6 (4)).
                    nullable: true
                    type: boolean
                probationExtensionReason:
                    description: Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                remunerationType:
                    allOf:
                        - $ref: '#/components/schemas/StaffRemunerationType'
                    description: Pay group. Optional.
                    nullable: true
                seniorityDate:
                    description: Pay group. Lønnsansiennitet.
                    format: date
                    nullable: true
                    type: string
                socialSecurityText:
                    description: § 14-6 q. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                specialHoursText:
                    description: § 14-6 l. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
                tariffReference:
                    description: § 14-6 n. Up to 200 characters.
                    maxLength: 200
                    nullable: true
                    type: string
                temporaryGround:
                    allOf:
                        - $ref: '#/components/schemas/StaffTemporaryGround'
                    description: Required when midlertidig. Dropped when the row is fast and it is not given.
                    nullable: true
                title:
                    description: Up to 120 characters.
                    maxLength: 120
                    nullable: true
                    type: string
                validFrom:
                    description: The day the row takes effect. Required on POST /employments/{id}/terms; on an employment's first row it is the start, and may be left out.
                    format: date
                    nullable: true
                    type: string
                workingHoursScheme:
                    allOf:
                        - $ref: '#/components/schemas/StaffWorkingHoursScheme'
                    description: Left out on the first row, not_shift.
                    nullable: true
                workingTimeText:
                    description: § 14-6 j. Up to 1000 characters.
                    maxLength: 1000
                    nullable: true
                    type: string
            type: object
        StaffWorkingHoursScheme:
            description: 'The a-melding''s arbeidstidsordning: not_shift (ikkeSkift), shift_365 (skift365), offshore_336 (offshore336), continuous_336 (helkontinuerligSkiftOgAndreOrdninger336), round_the_clock_355 (doegnkontinuerligSkiftOgTurnus355), other_shift (andreSkift).'
            enum:
                - not_shift
                - shift_365
                - offshore_336
                - continuous_336
                - round_the_clock_355
                - other_shift
            type: string
info:
    title: Vantigo Staff API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/staff/assignable-users:
        get:
            description: The picker HR links a person to a user with — active users whose display name (or, as the directory chooses, email) matches q, at most twenty. A user already linked to another person is listed too; linking them is user_linked_elsewhere.
            operationId: getStaffAssignableUsers
            parameters:
                - description: Narrows the search. Absent or blank lists the first twenty active users.
                  in: query
                  name: q
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffAssignableUser'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Search the users a person may be linked to
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units:
        get:
            description: Every business unit, archived ones included, by name. Read by staff:view and by staff:manage (HR without the directory still names units and departments); anyone else gets the uniform 403.
            operationId: getStaffBusinessUnits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffBusinessUnit'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List business units
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a business unit (the virksomhet or underenhet the a-melding reports per) under a legal entity. The first one becomes the default; isDefault true makes the new one the default instead.
            operationId: postStaffBusinessUnits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Add a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}:
        put:
            description: Replaces a business unit's legal entity, name and organisation number. isDefault true makes it the default; isDefault false on the default is refused; leaving it out changes nothing about it. Moving it under an archived legal entity is refused, keeping one it already has is not.
            operationId: putStaffBusinessUnitsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, or structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Change a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}/archive:
        post:
            description: 'Archives a business unit: it stays on every employment that names it and leaves the pickers.'
            operationId: postStaffBusinessUnitsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_default: the default row is never archived; make another row the default first.'
            summary: Archive a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments:
        get:
            description: Every department, archived ones included, by code. Read by staff:view and by staff:manage (HR without the directory still names units and departments); anyone else gets the uniform 403.
            operationId: getStaffDepartments
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffDepartment'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List departments
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a department with its code, name and, optionally, a manager, a parent, a cost centre and a division.
            operationId: postStaffDepartments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_archived: the parent is archived.'
            summary: Add a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}:
        put:
            description: Replaces a department. A parent that is the department itself or one of its own descendants is refused department_cycle; a parent it did not have before that is archived is refused structure_archived.
            operationId: putStaffDepartmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, structure_archived (the parent is archived), department_cycle (the parent is the department itself or below it), or manager_cycle when the new manager or parent would close a loop in the manager graph.
            summary: Change a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}/archive:
        post:
            description: 'Archives a department: it stays on every row that names it — its children''s parent included — and leaves the pickers.'
            operationId: postStaffDepartmentsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
