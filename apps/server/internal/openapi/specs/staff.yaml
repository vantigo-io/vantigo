                    maxLength: 32
                    type: string
                phonePrivate:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                privateEmail:
                    description: An email address of up to 254 characters, stored lower-cased.
                    maxLength: 254
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - nextOfKin
            type: object
        StaffMeta:
            description: What the Staff app needs before it draws anything.
            properties:
                capabilities:
                    $ref: '#/components/schemas/StaffCapabilities'
                structure:
                    $ref: '#/components/schemas/StaffStructure'
                timeZone:
                    description: The installation's business time zone, an IANA name. Every date of this module — a start, an end, "today" — is a calendar day in it.
                    type: string
                today:
                    description: Today's calendar day in the business time zone, as the server judges it — the day a form should start from, so the app and the server never disagree about which day it is around midnight.
                    format: date
                    type: string
            required:
                - timeZone
                - today
                - capabilities
            type: object
        StaffNationalIdKind:
            enum:
                - fodselsnummer
                - d_nummer
                - foreign
            type: string
        StaffNationalIdRequest:
            description: 'A national identity number to seal on the person (design S4). A fødselsnummer or d-nummer is eleven digits once spaces, hyphens and full stops are dropped, both control digits checked, its date a real one (the synthetic test ranges, month + 40 and month + 80, accepted); country, when given, is NO. A foreign id is 1 to 40 letters, digits or hyphens with its country, an ISO 3166-1 alpha-2 code other than NO. The value is sealed and indexed by a keyed MAC; only its kind is kept in clear, and no refusal echoes it.'
            properties:
                country:
                    description: A foreign id's country, ISO 3166-1 alpha-2. Required for a foreign id.
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                value:
                    description: The number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffNationalIdReveal:
            description: The national identity number on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a national_id_revealed event naming the viewer.
            properties:
                country:
                    description: A foreign id's country. Absent for a fødselsnummer or a d-nummer.
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                value:
                    description: The number as it was sealed — eleven digits, or the upper-cased foreign id.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffNextOfKin:
            description: One of a person's next of kin (private).
            properties:
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                note:
                    description: Up to 500 characters. Absent when not set.
                    maxLength: 500
                    type: string
                phone:
                    description: Up to 32 characters. Absent when not set.
                    maxLength: 32
                    type: string
                relationship:
                    $ref: '#/components/schemas/StaffNextOfKinRelationship'
            required:
                - name
                - relationship
            type: object
        StaffNextOfKinList:
            description: A person's next of kin in their order, with the person's revision — the one a replace sends back in If-Match.
            properties:
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    type: array
                revision:
                    description: The person's revision.
                    format: int32
                    type: integer
            required:
                - nextOfKin
                - revision
            type: object
        StaffNextOfKinRelationship:
            enum:
                - spouse
                - partner
                - parent
                - child
                - sibling
                - other
            type: string
        StaffNextOfKinRequest:
            description: A person's next of kin, all of them, in the order they are to be listed — a full replace. An empty list removes them all.
            properties:
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    maxItems: 3
                    type: array
            required:
                - nextOfKin
            type: object
        StaffNoticeUnit:
            enum:
                - days
                - weeks
                - months
            type: string
        StaffOrg:
            description: 'A person''s place in the organisation today (design S6): chain is their manager, that manager''s manager and so on up — following each person''s earliest employment in force today, stopping where nobody manages or where the chain would come back on itself; reports are the people whose manager they are today.'
            properties:
                chain:
                    items:
                        $ref: '#/components/schemas/StaffPersonSummary'
                    type: array
                person:
                    $ref: '#/components/schemas/StaffPersonSummary'
                reports:
                    items:
                        $ref: '#/components/schemas/StaffPersonSummary'
                    type: array
            required:
                - person
                - chain
                - reports
            type: object
        StaffPayComponent:
            description: One named amount of the pay as the contract states it.
            properties:
                amount:
                    description: 0 or more, with at most two decimals.
                    format: double
                    type: number
                currency:
                    description: An ISO 4217 code, three letters.
                    type: string
                name:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                period:
                    $ref: '#/components/schemas/StaffPayPeriod'
            required:
                - name
                - amount
                - currency
                - period
            type: object
        StaffPayPeriod:
            enum:
                - monthly
                - yearly
                - hourly
                - once
            type: string
        StaffPerson:
            description: 'A person (design §3.1), shaped by who is asking (§5): every field belongs to a field group — work, private, HR''s notes, the national identity number, the bank account, the account link — and a group the caller may not read is absent, never null. The work group is everyone''s who may see the person, manager, department, title, business unit and location among it — each from the terms in force today and their employment, the manager the terms'' own or else the department''s (design §4 Managers), absent when there is none; the private group, the national identity number, the bank account and the user are the person''s own and HR''s (staff:manage, staff:personal-data); notes are HR''s alone; erasedAt, legalHold and reassessedAt (the hold group) are staff:manage''s and staff:personal-data''s. status is where the person stands today. The national identity number is answered as its kind and whether one is on file, the bank account as its kind and last four digits — never more. capabilities say what the caller may do with this person.'
            properties:
                bankAccount:
                    $ref: '#/components/schemas/StaffPersonBankAccount'
                birthDate:
                    description: Private. Absent when not set.
                    format: date
                    type: string
                businessUnit:
                    $ref: '#/components/schemas/StaffBusinessUnitSummary'
                capabilities:
                    $ref: '#/components/schemas/StaffPersonCapabilities'
                city:
                    description: Private. Absent when not set.
                    type: string
                country:
                    description: Private. Absent when not set.
                    type: string
                department:
                    $ref: '#/components/schemas/StaffDepartmentSummary'
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person — staff:manage and staff:personal-data only (the hold group). Absent when not erased. An erased person is read-only but for the legal hold, the reassessment, an unlink and a rehire.
                    format: date-time
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                legalHold:
                    $ref: '#/components/schemas/StaffLegalHold'
                location:
                    $ref: '#/components/schemas/StaffLocationSummary'
                manager:
                    $ref: '#/components/schemas/StaffPersonSummary'
                nationalId:
                    $ref: '#/components/schemas/StaffPersonNationalId'
                notes:
                    description: HR's notes — staff:manage and staff:personal-data only. Absent when not set.
                    type: string
                phoneMobile:
                    description: Private. Absent when not set.
                    type: string
                phonePrivate:
                    description: Private. Absent when not set.
                    type: string
                phoneWork:
                    description: Absent when not set.
                    type: string
                postalCode:
                    description: Private. Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: Private. Absent when not set.
                    type: string
                reassessedAt:
                    description: When staff:personal-data recorded the reassessment of an erased person — the hold group. Absent when not reassessed.
                    format: date-time
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                status:
                    $ref: '#/components/schemas/StaffPersonStatus'
                street:
                    description: Private. Absent when not set.
                    type: string
                title:
                    description: The job title of the terms in force today. Absent when there is none.
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - capabilities
                - revision
                - status
            type: object
        StaffPersonBankAccount:
            description: The bank account on file, as its kind and its last four digits. Present for the person themselves, staff:manage and staff:personal-data, when one is on file.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                last4:
                    type: string
            required:
                - kind
                - last4
            type: object
        StaffPersonCapabilities:
            description: What the caller may do with this person. The access layer still decides every request.
            properties:
                canEdit:
                    description: staff:manage — change the record, the next of kin and the roles, and delete a person created in error.
                    type: boolean
                canHold:
                    description: staff:personal-data — set and lift the legal hold, record a reassessment and export the person's data.
                    type: boolean
                canManageAccount:
                    description: staff:manage — the self-service link to a user.
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: The person themselves or staff:personal-data — the person's health documents.
                    type: boolean
                canSeePay:
                    description: The person themselves, staff:manage or staff:personal-data — the pay terms of the person's employments.
                    type: boolean
            required:
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canManageAccount
                - canSeeHealth
                - canHold
            type: object
        StaffPersonLink:
            description: A person's self-service link to a user (design S24, §3.6) — the link that makes the user the person themselves to this module, and nothing else. linked is false, and every other field absent, when the person is linked to nobody.
            properties:
                linked:
