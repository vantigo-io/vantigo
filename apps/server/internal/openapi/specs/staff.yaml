components:
    schemas:
        PaginatedResponseOfStaffEvent:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffPersonListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffPersonListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        StaffBankAccountKind:
            enum:
                - bban
                - iban
            type: string
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffEvent:
            description: One change in a person's history (design S21). payload.fields names each field the change touched, with its value before (from) and after (to) — either absent when the field was empty — or, for a field of a group the caller may not read, the string "changed" in place of the values. A sealed value is never in a payload.
            properties:
                actor:
                    $ref: '#/components/schemas/StaffEventActor'
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: person_created, person_updated, next_of_kin_updated or roles_updated in this delivery; the kinds grow with it.
                    type: string
                payload:
                    additionalProperties: true
                    description: 'The change, shaped by the caller''s field groups: {"fields": {"<field>": {"from": …, "to": …} | "changed"}}.'
                    type: object
            required:
                - id
                - kind
                - at
                - actor
                - payload
            type: object
        StaffEventActor:
            description: Who made the change, as the user directory named them at the time.
            properties:
                displayName:
                    type: string
                kind:
                    description: user, or system for a change no user made.
                    type: string
                userId:
                    description: Absent for a system change.
                    format: uuid
                    type: string
            required:
                - kind
                - displayName
            type: object
        StaffGender:
            description: female, male, other or unspecified — what the equality report (ARP) counts.
            enum:
                - female
                - male
                - other
                - unspecified
            type: string
        StaffLanguage:
            description: The language the person reads Vantigo and its mail in.
            enum:
                - en
                - nb
            type: string
        StaffLegalEntity:
            description: A legal entity, the juridisk enhet (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: Exactly one legal entity is the default.
                    type: boolean
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - isDefault
                - revision
            type: object
        StaffLegalEntityRequest:
            properties:
                isDefault:
                    description: True makes this the default legal entity. False is refused on the default; left out, nothing changes.
                    type: boolean
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among legal entities. Left out, it is cleared.
                    type: string
            required:
                - name
            type: object
        StaffLocation:
            description: A location, the arbeidssted (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                city:
                    description: Absent when not set.
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code, upper-case.
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                postalCode:
                    description: Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
                street:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - name
                - country
                - revision
            type: object
        StaffLocationRequest:
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - name
            type: object
        StaffMeta:
            description: What the Staff app needs before it draws anything.
            properties:
                capabilities:
                    $ref: '#/components/schemas/StaffCapabilities'
                structure:
                    $ref: '#/components/schemas/StaffStructure'
                timeZone:
                    description: The installation's business time zone, an IANA name. Every date of this module — a start, an end, "today" — is a calendar day in it.
                    type: string
                today:
                    description: Today's calendar day in the business time zone, as the server judges it — the day a form should start from, so the app and the server never disagree about which day it is around midnight.
                    format: date
                    type: string
            required:
                - timeZone
                - today
                - capabilities
            type: object
        StaffNationalIdKind:
            enum:
                - fodselsnummer
                - d_nummer
                - foreign
            type: string
        StaffNextOfKin:
            description: One of a person's next of kin (private).
            properties:
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                note:
                    description: Up to 500 characters. Absent when not set.
                    maxLength: 500
                    type: string
                phone:
                    description: Up to 32 characters. Absent when not set.
                    maxLength: 32
                    type: string
                relationship:
                    $ref: '#/components/schemas/StaffNextOfKinRelationship'
            required:
                - name
                - relationship
            type: object
        StaffNextOfKinRelationship:
            enum:
                - spouse
                - partner
                - parent
                - child
                - sibling
                - other
            type: string
        StaffNextOfKinRequest:
            description: A person's next of kin, all of them, in the order they are to be listed — a full replace. An empty list removes them all.
            properties:
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    maxItems: 3
                    type: array
            required:
                - nextOfKin
            type: object
        StaffPerson:
            description: 'A person (design §3.1), shaped by who is asking (§5): every field belongs to a field group — work, private, HR''s notes, the national identity number, the bank account, the account link — and a group the caller may not read is absent, never null. The work group is everyone''s who may see the person; the private group, the national identity number, the bank account and the user are the person''s own and HR''s (staff:manage, staff:personal-data); notes are HR''s alone. The national identity number is answered as its kind and whether one is on file, the bank account as its kind and last four digits — never more. capabilities say what the caller may do with this person.'
            properties:
                bankAccount:
                    $ref: '#/components/schemas/StaffPersonBankAccount'
                birthDate:
                    description: Private. Absent when not set.
                    format: date
                    type: string
                capabilities:
                    $ref: '#/components/schemas/StaffPersonCapabilities'
                city:
                    description: Private. Absent when not set.
                    type: string
                country:
                    description: Private. Absent when not set.
                    type: string
                displayName:
                    type: string
                employeeNumber:
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                nationalId:
                    $ref: '#/components/schemas/StaffPersonNationalId'
                notes:
                    description: HR's notes — staff:manage and staff:personal-data only. Absent when not set.
                    type: string
                phoneMobile:
                    description: Private. Absent when not set.
                    type: string
                phonePrivate:
                    description: Private. Absent when not set.
                    type: string
                phoneWork:
                    description: Absent when not set.
                    type: string
                postalCode:
                    description: Private. Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: Private. Absent when not set.
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                street:
                    description: Private. Absent when not set.
                    type: string
                user:
                    $ref: '#/components/schemas/StaffPersonUser'
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
                - capabilities
                - revision
            type: object
        StaffPersonBankAccount:
            description: The bank account on file, as its kind and its last four digits. Present for the person themselves, staff:manage and staff:personal-data, when one is on file.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                last4:
                    type: string
            required:
                - kind
                - last4
            type: object
        StaffPersonCapabilities:
            description: What the caller may do with this person. The access layer still decides every request.
            properties:
                canEdit:
                    description: staff:manage — change the record, the next of kin and the roles, and delete a person created in error.
                    type: boolean
                canManageAccount:
                    description: staff:manage — the self-service link to a user.
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeePay:
                    description: The person themselves, staff:manage or staff:personal-data — the pay terms of the person's employments.
                    type: boolean
            required:
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canManageAccount
            type: object
        StaffPersonListItem:
            description: A person in the directory — the work group only, whoever lists.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                familyName:
                    type: string
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                phoneWork:
                    description: Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                workCountry:
                    type: string
                workEmail:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - employeeNumber
                - givenName
                - familyName
                - displayName
                - workCountry
                - preferredLanguage
            type: object
        StaffPersonNationalId:
            description: Whether a national identity number is on file, and its kind — never a digit of it. Present for the person themselves, staff:manage and staff:personal-data.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                onFile:
                    type: boolean
            required:
                - onFile
            type: object
        StaffPersonRequest:
            additionalProperties: false
            description: 'A person''s editable fields, the whole record as staff:manage replaces it (design §3.1, §5): the work group, the private group and HR''s notes. The national identity number and the bank account are written through their own operations under staff:personal-data, and the self-service link through its own; a property this schema does not name — one of those among them — is refused as a 400 naming it. On a change every optional field left out is cleared, except displayName, which stays.'
            properties:
                birthDate:
                    description: A calendar date. Private.
                    format: date
                    type: string
                city:
                    description: Up to 100 characters. Private (the home address).
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Private (the home address).
                    type: string
                displayName:
                    description: 1 to 200 characters, the name the person is shown by. Left out on a create, it is the given name and the family name; left out on a change, it stays as it is — it is set once from the names and then HR's to edit.
                    maxLength: 200
                    type: string
                employeeNumber:
                    description: 1 to 16 letters, digits or hyphens, unique however it is cased; employee_number_too_long when longer, employee_number_taken when another person has it. Left out on a create, it is generated as the settings' prefix and next number, skipping past any number already taken. It never changes after the create, so on a change it is left out or sent as it is.
                    maxLength: 16
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                familyName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                notes:
                    description: HR's notes, up to 2000 characters. Read by staff:manage and staff:personal-data only — never by the person.
                    maxLength: 2000
                    type: string
                phoneMobile:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phonePrivate:
                    description: Up to 32 characters. Private.
                    maxLength: 32
                    type: string
                phoneWork:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                postalCode:
                    description: Up to 16 characters. Private (the home address).
                    maxLength: 16
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: An email address of up to 254 characters, stored lower-cased. Private.
                    maxLength: 254
                    type: string
                street:
                    description: Up to 200 characters. Private (the home address).
                    maxLength: 200
                    type: string
                workCountry:
                    description: Where the person works from (the usage location), an ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                workEmail:
                    description: An email address of up to 254 characters, stored lower-cased, unique however it is cased (work_email_taken).
                    maxLength: 254
                    type: string
            required:
                - givenName
                - familyName
            type: object
        StaffPersonRole:
            description: A role a person holds for the company (design S6), with the dates they were elected for.
            properties:
                fromDate:
                    description: Absent when not set.
                    format: date
                    type: string
                role:
                    $ref: '#/components/schemas/StaffPersonRoleKind'
                toDate:
                    description: On or after fromDate. Absent when not set.
                    format: date
                    type: string
            required:
                - role
            type: object
        StaffPersonRoleKind:
            description: verneombud (the safety representative), amu_member (a member of the working environment committee) or hms_responsible.
            enum:
                - verneombud
                - amu_member
                - hms_responsible
            type: string
        StaffPersonRolesRequest:
            description: A person's roles, all of them — a full replace. An empty list removes them all.
            properties:
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    type: array
            required:
                - roles
            type: object
        StaffPersonUser:
            description: The user the person is linked to for self-service, as the user directory names them. Present for the person themselves, staff:manage and staff:personal-data, when a link exists. A user the directory no longer knows is "Unknown user", not active.
            properties:
                active:
                    description: False when the account is disabled.
                    type: boolean
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
                - active
            type: object
        StaffProblem:
            description: 'An RFC 9457 problem with this module''s refusal code. code names the rule that refused and is what a client keys off, never the words: in this delivery org_number_invalid, employee_number_too_long, employee_number_taken, work_email_taken, person_in_use, structure_archived, structure_default, department_cycle and revision_conflict. errors carries the field errors of a 400, keyed by the request''s camelCase field (an element of a list as nextOfKin[0].name); a field error without a code is a plain validation failure. A request the server could not decode answers a bare 400 with neither.'
            properties:
                code:
                    nullable: true
                    type: string
                detail:
                    nullable: true
                    type: string
                errors:
                    additionalProperties:
                        items:
                            type: string
                        type: array
                    type: object
                instance:
                    nullable: true
                    type: string
                status:
                    format: int32
                    nullable: true
                    type: integer
                title:
                    nullable: true
                    type: string
                type:
                    nullable: true
                    type: string
            type: object
        StaffSettings:
            description: The Staff settings delivery A1 exposes (design §3.6). The other columns of the settings row reach the contract with the deliveries that use them.
            properties:
                employeeNumberPrefix:
                    description: What a generated employee number starts with, up to eight letters, digits or hyphens; empty for none.
                    type: string
                injuryInsurer:
                    description: The occupational injury (yrkesskade) insurer. Absent when not set.
                    type: string
                nextEmployeeNumber:
                    description: The number the next generated employee number carries after the prefix, unpadded.
                    format: int64
                    type: integer
                pensionProvider:
                    description: The occupational pension (OTP) provider, which the § 14-6 check reads when a term names no social-security reference. Absent when not set.
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                timeZone:
                    description: The business time zone, an IANA name.
                    type: string
            required:
                - timeZone
                - employeeNumberPrefix
                - nextEmployeeNumber
                - revision
            type: object
        StaffSettingsRequest:
            description: A full replace of the settings delivery A1 exposes.
            properties:
                employeeNumberPrefix:
                    description: Up to eight letters, digits or hyphens. Left out, there is none.
                    maxLength: 8
                    type: string
                injuryInsurer:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                nextEmployeeNumber:
                    description: 1 or more. With the prefix it must make a number of at most 16 characters.
                    format: int64
                    type: integer
                pensionProvider:
                    description: Up to 200 characters. Left out, it is cleared.
                    maxLength: 200
                    type: string
                timeZone:
                    description: An IANA name such as Europe/Oslo, which this server and its database must read the same way.
                    maxLength: 64
                    type: string
            required:
                - timeZone
                - nextEmployeeNumber
            type: object
        StaffStructure:
            description: The company's structure, present on GET /meta only for a caller holding staff:view. Archived rows are included so a stored reference can still be named; the pickers leave them out.
            properties:
                businessUnits:
                    items:
                        $ref: '#/components/schemas/StaffBusinessUnit'
                    type: array
                departments:
                    items:
                        $ref: '#/components/schemas/StaffDepartment'
                    type: array
                legalEntities:
                    items:
                        $ref: '#/components/schemas/StaffLegalEntity'
                    type: array
                locations:
                    items:
                        $ref: '#/components/schemas/StaffLocation'
                    type: array
            required:
                - legalEntities
                - businessUnits
                - departments
                - locations
            type: object
info:
    title: Vantigo Staff API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/staff/business-units:
        get:
            description: Every business unit, archived ones included, by name.
            operationId: getStaffBusinessUnits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffBusinessUnit'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: List business units
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:view
        post:
            description: Adds a business unit (the virksomhet or underenhet the a-melding reports per) under a legal entity. The first one becomes the default; isDefault true makes the new one the default instead.
            operationId: postStaffBusinessUnits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Add a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}:
        put:
            description: Replaces a business unit's legal entity, name and organisation number. isDefault true makes it the default; isDefault false on the default is refused; leaving it out changes nothing about it. Moving it under an archived legal entity is refused, keeping one it already has is not.
            operationId: putStaffBusinessUnitsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
