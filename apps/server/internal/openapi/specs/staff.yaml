            type: object
        StaffPersonRolesRequest:
            description: A person's roles, all of them, at most twenty — a full replace. An empty list removes them all.
            properties:
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    maxItems: 20
                    type: array
            required:
                - roles
            type: object
        StaffPersonStatus:
            description: 'Where the person stands today, in the business time zone: active (an employment has started and not ended — the end day itself is still worked), upcoming (none active, one starting later; date is the earliest such start), ended (every employment ended before today; date is the latest end) or none (no employment yet).'
            properties:
                date:
                    description: The start for upcoming, the end for ended; absent otherwise.
                    format: date
                    type: string
                state:
                    enum:
                        - active
                        - upcoming
                        - ended
                        - none
                    type: string
            required:
                - state
            type: object
        StaffPersonSummary:
            description: A person as the work group names them.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - displayName
                - employeeNumber
            type: object
        StaffPersonUser:
            description: The user the person is linked to for self-service, as the user directory names them. Present for the person themselves, staff:manage and staff:personal-data, when a link exists. A user the directory no longer knows is "Unknown user", not active.
            properties:
                active:
                    description: False when the account is disabled.
                    type: boolean
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
                - active
            type: object
        StaffPersonalData:
            description: 'A person''s data in one file (design S16): the record, the next of kin, the roles, every employment with its terms, the self-service link, the documents'' metadata (the files themselves are read through the documents'' own downloads) and every event, read in one snapshot. exportedAt is when it was made. GET /people/{id}/personal-data''s is the complete file, the sealed values opened and the events whole; GET /me/export''s is the person''s own, without the sealed values, HR''s notes and the terms'' notes, its events shaped as the person reads their history.'
            properties:
                documents:
                    items:
                        $ref: '#/components/schemas/StaffDocument'
                    type: array
                employments:
                    items:
                        $ref: '#/components/schemas/StaffPersonalDataEmployment'
                    type: array
                events:
                    description: Every event of the person, oldest first.
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                exportedAt:
                    format: date-time
                    type: string
                link:
                    $ref: '#/components/schemas/StaffPersonLink'
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    type: array
                person:
                    $ref: '#/components/schemas/StaffPersonalDataPerson'
                roles:
                    items:
                        $ref: '#/components/schemas/StaffPersonRole'
                    type: array
            required:
                - exportedAt
                - person
                - nextOfKin
                - roles
                - employments
                - link
                - documents
                - events
            type: object
        StaffPersonalDataBankAccount:
