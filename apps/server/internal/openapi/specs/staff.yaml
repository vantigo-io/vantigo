                    type: string
                country:
                    type: string
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    format: date-time
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                legalHold:
                    $ref: '#/components/schemas/StaffLegalHold'
                nationalId:
                    $ref: '#/components/schemas/StaffPersonalDataNationalId'
                notes:
                    type: string
                phoneMobile:
                    type: string
                phonePrivate:
                    type: string
                phoneWork:
                    type: string
                postalCode:
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    type: string
                reassessedAt:
                    format: date-time
                    type: string
