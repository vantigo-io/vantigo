                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or a property the request does not name; a field error when the employee number differs from the person's; work_email_taken when another person has the work email; national_id_birth_date_mismatch on birthDate when the person's fødselsnummer or d-nummer encodes another birth date.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Change a person
