                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — paging out of range, or a status other than current, ended or all.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List people
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a person. The employee number is the one given, or the next from the settings' sequence — the prefix and the next number, skipping past any number already taken — taken under the settings row's lock, so two creators get two numbers. The display name is the given name and the family name unless one is given. The creation is a person_created event.
            operationId: postStaffPeople
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
