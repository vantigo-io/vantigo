    /api/v1/staff/people:
        get:
            description: 'The directory, by display name, the work group with each person''s manager, department and status today: staff:manage lists everyone, filtered by status (current by default — active, upcoming and no employment yet; ended; all); staff:view without it the people active today (an employment that has started and not ended), whatever status says. q matches each of its words against the names, the employee number and the work email; unitId, departmentId and locationId keep the people with an employment not ended before today in that unit whose terms name that department or location — the row in force today, or an upcoming employment''s first row — all on one employment. Anyone else is the uniform 403.'
            operationId: getStaffPeople
            parameters:
                - description: Words that must each appear in a name, the employee number or the work email, however cased.
                  in: query
                  name: q
                  schema:
                    type: string
                - description: People with an employment in force today in this business unit.
                  in: query
                  name: unitId
                  schema:
                    format: int64
                    type: integer
                - description: People whose terms in force today name this department.
                  in: query
                  name: departmentId
                  schema:
                    format: int64
                    type: integer
                - description: People whose terms in force today name this location.
                  in: query
                  name: locationId
                  schema:
                    format: int64
                    type: integer
                - description: 'staff:manage''s filter on where people stand today: current (the default — active, upcoming and those with no employment yet), ended, or all. A caller without staff:manage lists the people active today, whatever it says.'
                  in: query
                  name: status
                  schema:
                    enum:
                        - current
                        - ended
                        - all
                    type: string
                - in: query
                  name: page
                  schema:
                    format: int32
                    type: integer
                - in: query
                  name: pageSize
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PaginatedResponseOfStaffPersonListItem'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — paging out of range, or a status other than current, ended or all.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List people
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a person. The employee number is the one given, or the next from the settings' sequence — the prefix and the next number, skipping past any number already taken — taken under the settings row's lock, so two creators get two numbers. The display name is the given name and the family name unless one is given. The creation is a person_created event.
            operationId: postStaffPeople
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPerson'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or a property the request does not name; employee_number_too_long when the given or the generated number is longer than 16 characters, employee_number_taken when another person has it however cased, work_email_taken when another person has the work email.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Add a person
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
