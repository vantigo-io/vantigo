components:
    schemas:
        PaginatedResponseOfStaffEvent:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffPersonListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffPersonListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        StaffAppointmentForm:
            description: The a-melding's ansettelsesform. fast and fast_utleid go with a permanent employment, the other three with a temporary one.
            enum:
                - fast
                - midlertidig
                - fast_utleid
                - midlertidig_utleid
                - midlertidig_tilkallingsvikar
            type: string
        StaffAssignableUser:
            description: An active user HR may link a person to, as the user directory names them.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        StaffBankAccountKind:
            enum:
                - bban
                - iban
            type: string
        StaffBankAccountRequest:
            description: 'A bank account to seal on the person (design S4): a Norwegian kontonummer (bban, eleven digits with a valid MOD11 control digit; spaces and full stops are dropped) or an IBAN (spaces dropped; the ISO 13616 check digits, and for a Norwegian IBAN the embedded account''s MOD11). The value is sealed; only its kind and last four digits are kept in clear, and no refusal echoes it.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBankAccountReveal:
            description: The bank account on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a bank_account_revealed event naming the viewer.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number as it was sealed — normalised, without spaces.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitSummary:
            description: A business unit as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeeHealth:
                    description: staff:personal-data — everyone's health documents. The person reads their own whatever this says.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
                - canSeeHealth
            type: object
        StaffContractCheck:
            description: The § 14-6 check of one employment (design S5).
            properties:
                contractSigned:
                    description: Whether the employment records a signed contract (contractSignedAt).
                    type: boolean
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentId:
                    format: int64
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/StaffContractCheckItem'
                    type: array
                termsId:
                    description: The terms row judged. Absent when the employment has none.
                    format: int64
                    type: integer
            required:
                - employmentId
                - items
                - contractSigned
            type: object
        StaffContractCheckItem:
            properties:
                item:
                    description: The letter of aml. § 14-6 (1), a to q.
                    type: string
                source:
                    description: Where the item is read from, as the contract names the fields (terms.locationId, employment.startDate, settings.pensionProvider …).
                    type: string
                state:
                    description: present, missing, or not_applicable when the item does not apply to this employment (e when permanent, f without a probation, l without a special arrangement, n without a tariff when not hired out, o when not hired out).
                    enum:
                        - present
                        - missing
                        - not_applicable
                    type: string
            required:
                - item
                - state
                - source
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffDepartmentSummary:
            description: A department as the work group names it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
            type: object
        StaffDocument:
            description: 'One document in a person''s archive (design S14, §3.6). The bytes are never in a JSON body: they are read from GET /documents/{id}, with the document''s own visibility. Optional fields are absent when not recorded.'
            properties:
                category:
                    $ref: '#/components/schemas/StaffDocumentCategorySummary'
                contentType:
                    description: The type the file's own bytes were sniffed as on upload — application/pdf, image/jpeg, image/png or image/heic.
                    type: string
                employmentId:
                    description: The employment the document belongs to — the one covering signedAt, else the upload day, when exactly one does; HR may set it. It is what the erase of class A documents goes by. Absent when none.
                    format: int64
                    type: integer
                fileName:
                    description: The name the file was uploaded under, without any path, at most 255 characters.
                    type: string
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                revision:
                    description: Send it back as If-Match on PUT /documents/{id}.
                    format: int32
                    type: integer
                signedAt:
                    description: The day the document was signed. Absent when not recorded.
                    format: date
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
                validTo:
                    description: The last day the document is valid — a certificate's expiry. Absent when not recorded.
                    format: date
                    type: string
            required:
                - id
                - personId
                - category
                - fileName
                - contentType
                - sizeBytes
                - uploadedAt
                - revision
            type: object
        StaffDocumentCategory:
            description: A document category (design S14) — one of the six seeds or the company's own. Its retention class is fixed when it is created; restricted (a health category, readable only by the person and staff:personal-data) is true exactly when the class is E. A seeded category never changes; an archived one is offered for no new document, and only a category no document is filed under is archived.
            properties:
                archivedAt:
                    description: When the category was archived. Absent while it is in use.
                    format: date-time
                    type: string
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
                restricted:
                    type: boolean
                revision:
                    description: Send it back as If-Match on PUT /document-categories/{id}.
                    format: int32
                    type: integer
                seeded:
                    description: One of the six categories every installation starts with — contract, attest, certificate, correspondence, health, other.
                    type: boolean
                sort:
                    format: int32
                    type: integer
            required:
                - id
                - key
                - names
                - class
                - restricted
                - seeded
                - sort
                - revision
            type: object
        StaffDocumentCategoryChangeRequest:
            description: A category's names and whether it is archived. Its key and class never change. A seeded category is refused seed_immutable; archiving a category documents are still filed under is refused category_in_use.
            properties:
                archived:
                    type: boolean
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
            required:
                - names
                - archived
            type: object
        StaffDocumentCategoryNames:
            description: A category's name in English and in Norwegian bokmål, each 1 to 100 characters.
            properties:
                en:
                    type: string
                nb:
                    type: string
            required:
                - en
                - nb
            type: object
        StaffDocumentCategoryRequest:
            description: A company category. The key is 1 to 40 characters of a–z, 0–9 and hyphens, unique; the class is A (five years after the employment's end year), D (with the personnel record, after the grace) or E (health), and is fixed from now on; restricted follows from it.
            properties:
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
            required:
                - key
                - names
                - class
            type: object
        StaffDocumentCategorySummary:
            description: The category a document is filed under, as every document carries it.
            properties:
                class:
                    $ref: '#/components/schemas/StaffDocumentClass'
                id:
                    format: int64
                    type: integer
                key:
                    type: string
                names:
                    $ref: '#/components/schemas/StaffDocumentCategoryNames'
                restricted:
                    type: boolean
            required:
                - id
                - key
                - names
                - class
                - restricted
            type: object
        StaffDocumentChangeRequest:
            description: A document's category and dates, replaced whole — a date left out is cleared. employmentId is replaced only when the body names it — null clears it, and left out it stays as it is — since the upload derived it. Moving a document into or out of a restricted category needs staff:personal-data (category_restricted). employmentId must name one of the person's employments.
            properties:
                categoryId:
                    format: int64
                    type: integer
                employmentId:
                    description: One of the person's employments; null clears it; left out, the document keeps its own.
                    format: int64
                    nullable: true
                    type: integer
                signedAt:
                    format: date
                    type: string
                validTo:
                    format: date
                    type: string
            required:
                - categoryId
            type: object
        StaffDocumentClass:
            description: A document category's retention class (design S15) — A pay and contract documentation, five years after the year the employment ended; D personnel administration, with the record after the grace; E health.
            enum:
                - A
                - D
                - E
            type: string
        StaffEmployeeType:
            description: The kind of worker, for an identity provider.
            enum:
                - employee
                - contractor
                - consultant
                - intern
            type: string
        StaffEmployment:
            description: 'An employment (design §3.2), shaped by who is asking (§5): the dates are everyone''s who may see the person; the other fields are the employment group''s — the person themselves, a manager of theirs and HR; salaryChangedAt is the pay group''s — the person and HR. A field the caller may not read is absent, never null.'
            properties:
                businessUnitId:
                    format: int64
                    type: integer
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentNumber:
                    description: The a-melding's arbeidsforholdID. Never changes.
                    type: string
                endDate:
                    description: The last day worked. Absent while open-ended.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
                fteChangedAt:
                    description: 'The date the stillingsprosent in force today (or at the start, before it; at the end, after it) took effect: the earliest row of the unbroken run of rows with that percentage. Derived, never typed.'
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                salaryChangedAt:
                    description: The date the pay in force today took effect, judged on the pay components as a list sorted by name and amount and compared on those two alone. Derived, never typed.
                    format: date
                    type: string
                startDate:
                    format: date
                    type: string
            required:
                - id
                - personId
                - startDate
                - revision
            type: object
        StaffEmploymentChangeRequest:
            description: An employment's own fields, replaced as a whole. The end is written through POST /employments/{id}/end.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived unless the employment is already in it.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed. Left out, it is cleared.
                    format: date
                    type: string
                employmentNumber:
                    description: 'Never changes: left out, or the employment''s own.'
                    type: string
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                startDate:
                    description: The first day of the employment; the first terms row moves with it.
                    format: date
                    type: string
            required:
                - startDate
                - relationshipType
                - businessUnitId
            type: object
        StaffEmploymentEndRequest:
            properties:
                endDate:
                    description: The last day worked, on or after the start; it may lie in the future.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
            type: object
        StaffEmploymentRequest:
            description: A new employment and its first terms row.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived. Left out, the default one.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed.
                    format: date
                    type: string
                employmentNumber:
                    description: 1 to 40 letters, digits or hyphens, unique however cased. Left out, it is generated as <employee number>-<n>.
                    maxLength: 40
                    type: string
                relationshipType:
                    allOf:
                        - $ref: '#/components/schemas/StaffRelationshipType'
                    description: Left out, ordinary.
                startDate:
                    description: The first day of the employment.
                    format: date
                    type: string
                terms:
                    $ref: '#/components/schemas/StaffTermsRequest'
            required:
                - startDate
                - terms
            type: object
        StaffEmploymentType:
            description: fast (permanent) or midlertidig (temporary).
            enum:
                - fast
                - midlertidig
            type: string
        StaffEndReason:
            description: 'The a-melding''s six end reasons (sluttårsak): employee_resigned, employer_terminated, contract_ended (a contract, engagement or temporary employment ran out), wrongly_reported (the employment should never have been reported), internal_change (a change in the organisation or an internal move), payroll_system_change (a change of payroll system or accountant).'
            enum:
                - employee_resigned
                - employer_terminated
                - contract_ended
                - wrongly_reported
                - internal_change
                - payroll_system_change
            type: string
        StaffErasedPerson:
            description: An erased person whose names and birth date match a new person's (POST /people/similar-erased), so a rehire is a choice rather than a duplicate made by accident.
            properties:
                displayName:
                    type: string
                employeeNumber:
                    type: string
                erasedAt:
                    description: When the retention run erased the person.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - id
                - employeeNumber
                - displayName
                - erasedAt
            type: object
        StaffEvent:
            description: One change in a person's history (design S21). payload.fields names each field the change touched, with its value before (from) and after (to) — either absent when the field was empty — or, for a field of a group the caller may not read, the string "changed" in place of the values; a field of the pay or of HR's notes the caller may not read is left out altogether, since even the day it changed is not theirs to know. A sealed value is never in a payload.
            properties:
                actor:
                    $ref: '#/components/schemas/StaffEventActor'
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: person_created, person_updated, next_of_kin_updated, roles_updated, national_id_set, national_id_revealed, bank_account_set, bank_account_revealed, user_linked, user_unlinked, employment_created, employment_updated, employment_ended, employment_reopened, terms_added, terms_corrected, terms_deleted, document_added, document_updated, document_removed, personal_data_exported, legal_hold_set, legal_hold_lifted, reassessed or person_rehired; the kinds grow with the module.
                    type: string
                payload:
                    additionalProperties: true
                    description: 'The change, shaped by the caller''s field groups: {"fields": {"<field>": {"from": …, "to": …} | "changed"}}; an employment''s and a terms row''s events also carry employmentId, and a terms row''s termsId.'
                    type: object
            required:
                - id
                - kind
                - at
                - actor
                - payload
            type: object
        StaffEventActor:
            description: Who made the change, as the user directory named them at the time.
            properties:
                displayName:
                    type: string
                kind:
                    description: user, or system for a change no user made.
                    type: string
                userId:
                    description: Absent for a system change.
                    format: uuid
                    type: string
            required:
                - kind
                - displayName
            type: object
        StaffGender:
            description: female, male, other or unspecified — what the equality report (ARP) counts.
            enum:
                - female
                - male
                - other
                - unspecified
            type: string
        StaffImportError:
            description: One problem with one row of an import. No message carries a digit of a national identity number or a bank account.
            properties:
                column:
                    description: The column the problem is in, as the file's header spells it; absent for a problem with the row as a whole.
                    type: string
                message:
                    type: string
                row:
                    description: The data row, the first under the header being 1; a row whose every cell is blank is skipped and numbered not at all.
                    format: int32
                    type: integer
            required:
                - row
                - message
            type: object
        StaffImportResult:
            description: What an import's rows did, or would do in a dry run.
            properties:
                created:
                    format: int32
                    type: integer
                dryRun:
                    type: boolean
                errors:
                    description: Every problem of every failed row, in file order; [] when none failed.
                    items:
                        $ref: '#/components/schemas/StaffImportError'
                    type: array
                failed:
                    format: int32
                    type: integer
                rows:
                    format: int32
                    type: integer
                updated:
                    format: int32
                    type: integer
            required:
                - dryRun
                - rows
                - created
                - updated
                - failed
                - errors
            type: object
        StaffLanguage:
            description: The language the person reads Vantigo and its mail in.
            enum:
                - en
                - nb
            type: string
        StaffLegalEntity:
            description: A legal entity, the juridisk enhet (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: Exactly one legal entity is the default.
                    type: boolean
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - isDefault
                - revision
            type: object
        StaffLegalEntityRequest:
            properties:
                isDefault:
                    description: True makes this the default legal entity. False is refused on the default; left out, nothing changes.
                    type: boolean
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among legal entities. Left out, it is cleared.
                    type: string
            required:
                - name
            type: object
        StaffLegalHold:
            description: The legal hold (design S15, class F) — while held, no retention erase touches the person. reason and at are absent when the person is not held.
            properties:
                at:
                    description: When the hold was set.
                    format: date-time
                    type: string
                held:
                    type: boolean
                reason:
                    description: Why the person is held, as staff:personal-data wrote it.
                    type: string
            required:
                - held
            type: object
        StaffLegalHoldRequest:
            description: Sets (held true, with a reason) or lifts (held false, no reason) the legal hold.
            properties:
                held:
                    type: boolean
                reason:
                    description: 1 to 500 characters when held is true; absent or null when it is false.
                    maxLength: 500
                    nullable: true
                    type: string
            required:
                - held
            type: object
        StaffLocation:
            description: A location, the arbeidssted (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                city:
                    description: Absent when not set.
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code, upper-case.
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                postalCode:
                    description: Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
                street:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - name
                - country
                - revision
            type: object
        StaffLocationSummary:
            description: A location as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffLocationRequest:
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - name
            type: object
        StaffMeRequest:
            additionalProperties: false
            description: 'What a person edits on their own record (design S17): their private phones and email, their home address and their next of kin — a full replace of exactly these, every optional field left out cleared. Everything else — the work group, the birth date and gender, the national identity number, the bank account — is HR''s; a property this schema does not name is refused as a 400 naming it.'
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code.
                    type: string
                nextOfKin:
                    description: All of the person's next of kin, at most three, in their order. An empty list removes them all.
