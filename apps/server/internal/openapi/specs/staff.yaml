        get:
            description: 'One person, shaped by who is asking (design §5): the person themselves through their self-service link, a manager of theirs today (a person linked to the caller is the manager of one of their employments in force today, by the terms or the department), staff:view for a person active today (an employment that has started and not ended), staff:manage and staff:personal-data each see the field groups theirs to read. Anyone else — staff:view alone for a person not active today included — gets a 404 identical to an unknown id.'
            operationId: getStaffPeopleById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPerson'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one the caller may see. The body is empty.
            summary: Get a person
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: Replaces a person's editable fields — the work group, the private group and HR's notes. The employee number never changes; the display name stays when left out. The change is a person_updated event naming each field with its value before and after; a replace that changes nothing writes nothing.
            operationId: putStaffPeopleById
            parameters:
                - in: path
                  name: id
                  required: true
