                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffTerms'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or validFrom is missing; terms_required_fields when employmentType or ftePercent is missing (errors names each); temporary_ground_required when the row is midlertidig without a ground; appointment_form_mismatch when the appointment form does not agree with the employment type; probation_too_long when the probation ends more than six months after the start, or more than half the expected term of a temporary employment, or an extension is not agreed, has no reason or is longer than the probation itself; full_time_hours_mismatch when the hours for a full position break the a-melding's rule for the working-hours scheme.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_valid_from_taken when the employment has a row on that date; terms_before_start before the employment's start; terms_after_end after its end; terms_first_row_start when the first row would not be dated the start; self_manager when the manager is the person; manager_cycle when the manager — named on the row, or the department's — would close a loop in the manager graph on the row's date or any later date the graph changes; structure_archived when a department or location newly named is archived; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
