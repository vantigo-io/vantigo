                - other_shift
            type: string
info:
    title: Vantigo Staff API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/staff/assignable-users:
        get:
            description: The picker HR links a person to a user with — active users whose display name (or, as the directory chooses, email) matches q, at most twenty. A user already linked to another person is listed too; linking them is user_linked_elsewhere.
            operationId: getStaffAssignableUsers
            parameters:
                - description: Narrows the search. Absent or blank lists the first twenty active users.
                  in: query
                  name: q
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffAssignableUser'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Search the users a person may be linked to
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units:
        get:
            description: Every business unit, archived ones included, by name. Read by staff:view and by staff:manage (HR without the directory still names units and departments); anyone else gets the uniform 403.
            operationId: getStaffBusinessUnits
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffBusinessUnit'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List business units
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a business unit (the virksomhet or underenhet the a-melding reports per) under a legal entity. The first one becomes the default; isDefault true makes the new one the default instead.
            operationId: postStaffBusinessUnits
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Add a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}:
        put:
            description: Replaces a business unit's legal entity, name and organisation number. isDefault true makes it the default; isDefault false on the default is refused; leaving it out changes nothing about it. Moving it under an archived legal entity is refused, keeping one it already has is not.
            operationId: putStaffBusinessUnitsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffBusinessUnitRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, a field error when another business unit has it or the legal entity does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, or structure_archived (the legal entity is archived, or an archived row is made the default) or structure_default (isDefault false on the default).
            summary: Change a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/business-units/{id}/archive:
        post:
            description: 'Archives a business unit: it stays on every employment that names it and leaves the pickers.'
            operationId: postStaffBusinessUnitsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffBusinessUnit'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_default: the default row is never archived; make another row the default first.'
            summary: Archive a business unit
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments:
        get:
            description: Every department, archived ones included, by code. Read by staff:view and by staff:manage (HR without the directory still names units and departments); anyone else gets the uniform 403.
            operationId: getStaffDepartments
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffDepartment'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List departments
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a department with its code, name and, optionally, a manager, a parent, a cost centre and a division.
            operationId: postStaffDepartments
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: 'Conflict — structure_archived: the parent is archived.'
            summary: Add a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}:
        put:
            description: Replaces a department. A parent that is the department itself or one of its own descendants is refused department_cycle; a parent it did not have before that is archived is refused structure_archived.
            operationId: putStaffDepartmentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the row was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffDepartmentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; a field error when another department has the code (however it is cased), or the manager or the parent does not exist.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict, structure_archived (the parent is archived), department_cycle (the parent is the department itself or below it), or manager_cycle when the new manager or parent would close a loop in the manager graph.
            summary: Change a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/departments/{id}/archive:
        post:
            description: 'Archives a department: it stays on every row that names it — its children''s parent included — and leaves the pickers.'
            operationId: postStaffDepartmentsByIdArchive
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffDepartment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such row. The body is empty.
            summary: Archive a department
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}:
        get:
            description: One employment, shaped as on GET /people/{id}/employments.
            operationId: getStaffEmploymentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment, or not one the caller may see. The body is empty.
            summary: Get an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: Replaces an employment's own fields. The employment number never changes. A new start date moves the first terms row with it, and is refused when a later row would then lie before it. The end is written through POST /employments/{id}/end. The change is an employment_updated event.
            operationId: putStaffEmploymentsById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The revision the employment was read at, as the response's revision gave it — bare (3) or quoted ("3"). A revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffEmploymentChangeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or the employment number differs from the employment's; probation_too_long on startDate when a terms row's probation would end more than six months (or half a temporary term) after the new start, and a field error when one would end before it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; terms_before_start when a later terms row would lie before the new start; structure_archived when a newly named business unit is archived; manager_cycle when an earlier start closes a loop in the manager graph.
            summary: Change an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}/contract-check:
        get:
            description: The seventeen items aml. § 14-6 (1) a–q asks a written employment contract to hold, each present, missing or not_applicable, judged from the employment and the terms in force today (the first row before the start, the last before the end), with the column each comes from; and whether the contract is recorded as signed. Informative, never blocking. The person themselves, a manager of theirs and HR read it; anyone else gets a 404 identical to an unknown id. Item i is the pay's, so a reader who does not read the pay (a manager) gets the list without it.
            operationId: getStaffEmploymentsByIdContractCheck
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffContractCheck'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment, or not one the caller may check. The body is empty.
            summary: Check an employment against § 14-6
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
    /api/v1/staff/employments/{id}/end:
        post:
            description: Ends an employment on endDate — which may lie in the future — for one of the a-melding's six reasons. A terms row dated after the end is refused. Ending one already ended moves its end; a later end brings terms back into force and is judged on the manager graph from the day after the old end. The change is an employment_ended event.
            operationId: postStaffEmploymentsByIdEnd
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffEmploymentEndRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — end_reason_required when endReason is missing; a field error when endDate is missing or before the start.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_after_end when a terms row is dated after endDate; manager_cycle when a later end brings back terms that close a loop in the manager graph.
            summary: End an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}/reopen:
        post:
            description: Takes an employment's end and its reason away, for an end recorded in error. The change is an employment_reopened event; reopening an employment that has no end changes nothing.
            operationId: postStaffEmploymentsByIdReopen
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffEmployment'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — manager_cycle when the terms the reopening brings back into force close a loop in the manager graph.
            summary: Reopen an employment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/employments/{id}/terms:
        get:
            description: 'An employment''s terms rows by validFrom, each in force from its validFrom until the next row''s (validTo, the day before, is absent on the latest). Shaped by who is asking (design §5): the person themselves and HR read every field; a manager of theirs reads every field but the pay group; a colleague holding staff:view reads the dates, employmentType and ftePercent only.'
            operationId: getStaffEmploymentsByIdTerms
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffTerms'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment, or not one the caller may see. The body is empty.
            summary: List an employment's terms
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a terms row in force from validFrom (design S5, §4 Terms). A field left out takes its value from the row in force before validFrom; a field sent as null is cleared; the hours for a full position follow the scheme when the scheme changes and the hours are left out. The row is a terms_added event.
            operationId: postStaffEmploymentsByIdTerms
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffTermsRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffTerms'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass, or validFrom is missing; terms_required_fields when employmentType or ftePercent is missing (errors names each); temporary_ground_required when the row is midlertidig without a ground; appointment_form_mismatch when the appointment form does not agree with the employment type; probation_too_long when the probation ends more than six months after the start, or more than half the expected term of a temporary employment, or an extension is not agreed, has no reason or is longer than the probation itself; full_time_hours_mismatch when the hours for a full position break the a-melding's rule for the working-hours scheme.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such employment. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — terms_valid_from_taken when the employment has a row on that date; terms_before_start before the employment's start; terms_after_end after its end; terms_first_row_start when the first row would not be dated the start; self_manager when the manager is the person; manager_cycle when the manager — named on the row, or the department's — would close a loop in the manager graph on the row's date or any later date the graph changes; structure_archived when a department or location newly named is archived.
            summary: Add a terms row
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/legal-entities:
        get:
            description: Every legal entity, archived ones included (so a stored reference can still be named), by name. Read by staff:view and by staff:manage (HR without the directory still names units and departments); anyone else gets the uniform 403.
            operationId: getStaffLegalEntities
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/StaffLegalEntity'
                                type: array
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — neither staff:view nor staff:manage.
            summary: List legal entities
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        post:
            description: Adds a legal entity (the juridisk enhet). The first one becomes the default; isDefault true makes the new one the default instead, and the previous default stops being it.
            operationId: postStaffLegalEntities
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffLegalEntityRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffLegalEntity'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — a field did not pass; org_number_invalid when the organisation number is not nine digits with a valid MOD11 check digit, and a field error when another legal entity has it.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Add a legal entity
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/legal-entities/{id}:
        put:
