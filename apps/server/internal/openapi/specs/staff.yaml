                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — reassessment_not_due.
            summary: Record a reassessment
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:personal-data
    /api/v1/staff/people/{id}/roles:
        get:
            description: A person's roles — the work group, so everyone who may see the person reads them (staff:view for a person active today); anyone else gets a 404 identical to an unknown id.
            operationId: getStaffPeopleByIdRoles
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonRoleList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one the caller may see. The body is empty.
            summary: List a person's roles
            tags:
                - Staff
            x-vantigo-access: permission:staff:access
        put:
            description: Replaces a person's roles — at most twenty — under the person's revision (If-Match), which moves on when the list changes, and records a roles_updated event.
            operationId: putStaffPeopleByIdRoles
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
                - description: The person's revision as read — bare (3) or quoted ("3"). A replace that changes the list moves the person's revision on; a revision that has moved on is a 409 revision_conflict.
                  in: header
                  name: If-Match
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StaffPersonRolesRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonRoleList'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Bad Request — more than twenty, or a field did not pass (keyed as roles[0].toDate), such as a toDate before its fromDate.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Replace a person's roles
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/user:
        get:
            description: 'A person''s self-service link and the linked user as the user directory names them — the person themselves, staff:manage and staff:personal-data read it; anyone else gets a 404 identical to an unknown id.'
            operationId: getStaffPeopleByIdUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffPersonLink'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
