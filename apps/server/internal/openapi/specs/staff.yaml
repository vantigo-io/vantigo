    /api/v1/staff/people/{id}/national-id:
        put:
            description: 'Seals a national identity number on the person (design S4) — staff:personal-data only, never staff:manage alone and never the person — and indexes it by a keyed MAC over its kind, country and value in a unique column, so the same number on two people is refused without opening anything. Only its kind (and a foreign id''s country) is kept in clear. A fødselsnummer or d-nummer that encodes another birth date than the person''s, when one is set, is refused. The change is a national_id_set event carrying the kind only; the number already on file, however it is typed, changes nothing.'
