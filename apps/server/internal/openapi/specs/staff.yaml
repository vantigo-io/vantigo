components:
    schemas:
        PaginatedResponseOfStaffEvent:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffEvent'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        PaginatedResponseOfStaffPersonListItem:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/StaffPersonListItem'
                    type: array
                pagination:
                    $ref: common.yaml#/components/schemas/PaginationMetadata
            required:
                - data
                - pagination
            type: object
        StaffAppointmentForm:
            description: The a-melding's ansettelsesform. fast and fast_utleid go with a permanent employment, the other three with a temporary one.
            enum:
                - fast
                - midlertidig
                - fast_utleid
                - midlertidig_utleid
                - midlertidig_tilkallingsvikar
            type: string
        StaffAssignableUser:
            description: An active user HR may link a person to, as the user directory names them.
            properties:
                displayName:
                    type: string
                id:
                    format: uuid
                    type: string
            required:
                - id
                - displayName
            type: object
        StaffBankAccountKind:
            enum:
                - bban
                - iban
            type: string
        StaffBankAccountRequest:
            description: 'A bank account to seal on the person (design S4): a Norwegian kontonummer (bban, eleven digits with a valid MOD11 control digit; spaces and full stops are dropped) or an IBAN (spaces dropped; the ISO 13616 check digits, and for a Norwegian IBAN the embedded account''s MOD11). The value is sealed; only its kind and last four digits are kept in clear, and no refusal echoes it.'
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBankAccountReveal:
            description: The bank account on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a bank_account_revealed event naming the viewer.
            properties:
                kind:
                    $ref: '#/components/schemas/StaffBankAccountKind'
                value:
                    description: The account number as it was sealed — normalised, without spaces.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffBusinessUnit:
            description: A business unit, the virksomhet or underenhet the a-melding reports per (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: 'Exactly one business unit is the default: the one an employment is put in when it names none.'
                    type: boolean
                legalEntityId:
                    format: int64
                    type: integer
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - legalEntityId
                - name
                - isDefault
                - revision
            type: object
        StaffBusinessUnitSummary:
            description: A business unit as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffBusinessUnitRequest:
            properties:
                isDefault:
                    description: True makes this the default business unit. False is refused on the default; left out, nothing changes.
                    type: boolean
                legalEntityId:
                    description: An existing legal entity, not archived unless the unit is already under it.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among business units. Left out, it is cleared.
                    type: string
            required:
                - legalEntityId
                - name
            type: object
        StaffCapabilities:
            description: What the caller may do in Staff, so the app never re-derives a rule this module owns. The access layer still decides every request.
            properties:
                canEdit:
                    description: 'staff:manage — HR: people, employments and terms, the structure and the settings.'
                    type: boolean
                canRevealIdentifiers:
                    description: staff:personal-data — reveal and write the national identity number and the bank account.
                    type: boolean
                canSeePay:
                    description: staff:manage or staff:personal-data — everyone's pay terms.
                    type: boolean
                canViewDirectory:
                    description: 'staff:view — the directory: everyone''s work fields and the structure.'
                    type: boolean
            required:
                - canViewDirectory
                - canEdit
                - canRevealIdentifiers
                - canSeePay
            type: object
        StaffContractCheck:
            description: The § 14-6 check of one employment (design S5).
            properties:
                contractSigned:
                    description: Whether the employment records a signed contract (contractSignedAt).
                    type: boolean
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentId:
                    format: int64
                    type: integer
                items:
                    items:
                        $ref: '#/components/schemas/StaffContractCheckItem'
                    type: array
                termsId:
                    description: The terms row judged. Absent when the employment has none.
                    format: int64
                    type: integer
            required:
                - employmentId
                - items
                - contractSigned
            type: object
        StaffContractCheckItem:
            properties:
                item:
                    description: The letter of aml. § 14-6 (1), a to q.
                    type: string
                source:
                    description: Where the item is read from, as the contract names the fields (terms.locationId, employment.startDate, settings.pensionProvider …).
                    type: string
                state:
                    description: present, missing, or not_applicable when the item does not apply to this employment (e when permanent, f without a probation, l without a special arrangement, n without a tariff when not hired out, o when not hired out).
                    enum:
                        - present
                        - missing
                        - not_applicable
                    type: string
            required:
                - item
                - state
                - source
            type: object
        StaffDepartment:
            description: A department (design S6). Its manager is the manager of the people whose terms name the department and no manager of their own.
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                code:
                    type: string
                costCentre:
                    description: Absent when not set.
                    type: string
                division:
                    description: Absent when not set.
                    type: string
                id:
                    format: int64
                    type: integer
                managerPersonId:
                    description: The person who manages it. Absent when none.
                    format: int64
                    type: integer
                name:
                    type: string
                parentId:
                    description: The department it sits under. Absent at the top.
                    format: int64
                    type: integer
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - code
                - name
                - revision
            type: object
        StaffDepartmentRequest:
            properties:
                code:
                    description: 1 to 20 letters, digits or hyphens, unique however it is cased.
                    maxLength: 20
                    type: string
                costCentre:
                    description: Up to 40 characters. Left out, it is cleared.
                    maxLength: 40
                    type: string
                division:
                    description: Up to 100 characters. Left out, it is cleared.
                    maxLength: 100
                    type: string
                managerPersonId:
                    description: An existing person. Left out, the department has no manager.
                    format: int64
                    type: integer
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                parentId:
                    description: An existing department that is neither this one nor below it. Left out, the department is at the top.
                    format: int64
                    type: integer
            required:
                - code
                - name
            type: object
        StaffDepartmentSummary:
            description: A department as the work group names it.
            properties:
                code:
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - code
                - name
            type: object
        StaffEmployeeType:
            description: The kind of worker, for an identity provider.
            enum:
                - employee
                - contractor
                - consultant
                - intern
            type: string
        StaffEmployment:
            description: 'An employment (design §3.2), shaped by who is asking (§5): the dates are everyone''s who may see the person; the other fields are the employment group''s — the person themselves, a manager of theirs and HR; salaryChangedAt is the pay group''s — the person and HR. A field the caller may not read is absent, never null.'
            properties:
                businessUnitId:
                    format: int64
                    type: integer
                contractSignedAt:
                    description: Absent when not recorded.
                    format: date
                    type: string
                employmentNumber:
                    description: The a-melding's arbeidsforholdID. Never changes.
                    type: string
                endDate:
                    description: The last day worked. Absent while open-ended.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
                fteChangedAt:
                    description: 'The date the stillingsprosent in force today (or at the start, before it; at the end, after it) took effect: the earliest row of the unbroken run of rows with that percentage. Derived, never typed.'
                    format: date
                    type: string
                id:
                    format: int64
                    type: integer
                personId:
                    format: int64
                    type: integer
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                salaryChangedAt:
                    description: The date the pay in force today took effect, judged on the pay components as a list sorted by name and amount and compared on those two alone. Derived, never typed.
                    format: date
                    type: string
                startDate:
                    format: date
                    type: string
            required:
                - id
                - personId
                - startDate
                - revision
            type: object
        StaffEmploymentChangeRequest:
            description: An employment's own fields, replaced as a whole. The end is written through POST /employments/{id}/end.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived unless the employment is already in it.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed. Left out, it is cleared.
                    format: date
                    type: string
                employmentNumber:
                    description: 'Never changes: left out, or the employment''s own.'
                    type: string
                relationshipType:
                    $ref: '#/components/schemas/StaffRelationshipType'
                startDate:
                    description: The first day of the employment; the first terms row moves with it.
                    format: date
                    type: string
            required:
                - startDate
                - relationshipType
                - businessUnitId
            type: object
        StaffEmploymentEndRequest:
            properties:
                endDate:
                    description: The last day worked, on or after the start; it may lie in the future.
                    format: date
                    type: string
                endReason:
                    $ref: '#/components/schemas/StaffEndReason'
            type: object
        StaffEmploymentRequest:
            description: A new employment and its first terms row.
            properties:
                businessUnitId:
                    description: An existing business unit, not archived. Left out, the default one.
                    format: int64
                    type: integer
                contractSignedAt:
                    description: The date the contract was signed.
                    format: date
                    type: string
                employmentNumber:
                    description: 1 to 40 letters, digits or hyphens, unique however cased. Left out, it is generated as <employee number>-<n>.
                    maxLength: 40
                    type: string
                relationshipType:
                    allOf:
                        - $ref: '#/components/schemas/StaffRelationshipType'
                    description: Left out, ordinary.
                startDate:
                    description: The first day of the employment.
                    format: date
                    type: string
                terms:
                    $ref: '#/components/schemas/StaffTermsRequest'
            required:
                - startDate
                - terms
            type: object
        StaffEmploymentType:
            description: fast (permanent) or midlertidig (temporary).
            enum:
                - fast
                - midlertidig
            type: string
        StaffEndReason:
            description: 'The a-melding''s six end reasons (sluttårsak): employee_resigned, employer_terminated, contract_ended (a contract, engagement or temporary employment ran out), wrongly_reported (the employment should never have been reported), internal_change (a change in the organisation or an internal move), payroll_system_change (a change of payroll system or accountant).'
            enum:
                - employee_resigned
                - employer_terminated
                - contract_ended
                - wrongly_reported
                - internal_change
                - payroll_system_change
            type: string
        StaffEvent:
            description: One change in a person's history (design S21). payload.fields names each field the change touched, with its value before (from) and after (to) — either absent when the field was empty — or, for a field of a group the caller may not read, the string "changed" in place of the values; a field of the pay or of HR's notes the caller may not read is left out altogether, since even the day it changed is not theirs to know. A sealed value is never in a payload.
            properties:
                actor:
                    $ref: '#/components/schemas/StaffEventActor'
                at:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    description: person_created, person_updated, next_of_kin_updated, roles_updated, national_id_set, national_id_revealed, bank_account_set, bank_account_revealed, user_linked, user_unlinked, employment_created, employment_updated, employment_ended, employment_reopened, terms_added, terms_corrected or terms_deleted in this delivery; the kinds grow with it.
                    type: string
                payload:
                    additionalProperties: true
                    description: 'The change, shaped by the caller''s field groups: {"fields": {"<field>": {"from": …, "to": …} | "changed"}}; an employment''s and a terms row''s events also carry employmentId, and a terms row''s termsId.'
                    type: object
            required:
                - id
                - kind
                - at
                - actor
                - payload
            type: object
        StaffEventActor:
            description: Who made the change, as the user directory named them at the time.
            properties:
                displayName:
                    type: string
                kind:
                    description: user, or system for a change no user made.
                    type: string
                userId:
                    description: Absent for a system change.
                    format: uuid
                    type: string
            required:
                - kind
                - displayName
            type: object
        StaffGender:
            description: female, male, other or unspecified — what the equality report (ARP) counts.
            enum:
                - female
                - male
                - other
                - unspecified
            type: string
        StaffLanguage:
            description: The language the person reads Vantigo and its mail in.
            enum:
                - en
                - nb
            type: string
        StaffLegalEntity:
            description: A legal entity, the juridisk enhet (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                isDefault:
                    description: Exactly one legal entity is the default.
                    type: boolean
                name:
                    type: string
                orgNumber:
                    description: Nine digits. Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - id
                - name
                - isDefault
                - revision
            type: object
        StaffLegalEntityRequest:
            properties:
                isDefault:
                    description: True makes this the default legal entity. False is refused on the default; left out, nothing changes.
                    type: boolean
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                orgNumber:
                    description: Nine digits with a valid MOD11 check digit; spaces are ignored. Unique among legal entities. Left out, it is cleared.
                    type: string
            required:
                - name
            type: object
        StaffLocation:
            description: A location, the arbeidssted (design S6).
            properties:
                archivedAt:
                    description: When it was archived. Absent while it is in use.
                    format: date-time
                    type: string
                city:
                    description: Absent when not set.
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code, upper-case.
                    type: string
                id:
                    format: int64
                    type: integer
                name:
                    type: string
                postalCode:
                    description: Absent when not set.
                    type: string
                revision:
                    format: int32
                    type: integer
                street:
                    description: Absent when not set.
                    type: string
            required:
                - id
                - name
                - country
                - revision
            type: object
        StaffLocationSummary:
            description: A location as the work group names it.
            properties:
                id:
                    format: int64
                    type: integer
                name:
                    type: string
            required:
                - id
                - name
            type: object
        StaffLocationRequest:
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code. Left out, Norway (NO).
                    type: string
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - name
            type: object
        StaffMeRequest:
            additionalProperties: false
            description: 'What a person edits on their own record (design S17): their private phones and email, their home address and their next of kin — a full replace of exactly these, every optional field left out cleared. Everything else — the work group, the birth date and gender, the national identity number, the bank account — is HR''s; a property this schema does not name is refused as a 400 naming it.'
            properties:
                city:
                    description: Up to 100 characters.
                    maxLength: 100
                    type: string
                country:
                    description: An ISO 3166-1 alpha-2 code.
                    type: string
                nextOfKin:
                    description: All of the person's next of kin, at most three, in their order. An empty list removes them all.
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    maxItems: 3
                    type: array
                phoneMobile:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                phonePrivate:
                    description: Up to 32 characters.
                    maxLength: 32
                    type: string
                postalCode:
                    description: Up to 16 characters.
                    maxLength: 16
                    type: string
                privateEmail:
                    description: An email address of up to 254 characters, stored lower-cased.
                    maxLength: 254
                    type: string
                street:
                    description: Up to 200 characters.
                    maxLength: 200
                    type: string
            required:
                - nextOfKin
            type: object
        StaffMeta:
            description: What the Staff app needs before it draws anything.
            properties:
                capabilities:
                    $ref: '#/components/schemas/StaffCapabilities'
                structure:
                    $ref: '#/components/schemas/StaffStructure'
                timeZone:
                    description: The installation's business time zone, an IANA name. Every date of this module — a start, an end, "today" — is a calendar day in it.
                    type: string
                today:
                    description: Today's calendar day in the business time zone, as the server judges it — the day a form should start from, so the app and the server never disagree about which day it is around midnight.
                    format: date
                    type: string
            required:
                - timeZone
                - today
                - capabilities
            type: object
        StaffNationalIdKind:
            enum:
                - fodselsnummer
                - d_nummer
                - foreign
            type: string
        StaffNationalIdRequest:
            description: 'A national identity number to seal on the person (design S4). A fødselsnummer or d-nummer is eleven digits once spaces, hyphens and full stops are dropped, both control digits checked, its date a real one (the synthetic test ranges, month + 40 and month + 80, accepted); country, when given, is NO. A foreign id is 1 to 40 letters, digits or hyphens with its country, an ISO 3166-1 alpha-2 code other than NO. The value is sealed and indexed by a keyed MAC; only its kind is kept in clear, and no refusal echoes it.'
            properties:
                country:
                    description: A foreign id's country, ISO 3166-1 alpha-2. Required for a foreign id.
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                value:
                    description: The number. Never answered back, and never named in a refusal.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffNationalIdReveal:
            description: The national identity number on file, opened once for a holder of staff:personal-data. Answered with Cache-Control no-store; each reveal is a national_id_revealed event naming the viewer.
            properties:
                country:
                    description: A foreign id's country. Absent for a fødselsnummer or a d-nummer.
                    type: string
                kind:
                    $ref: '#/components/schemas/StaffNationalIdKind'
                value:
                    description: The number as it was sealed — eleven digits, or the upper-cased foreign id.
                    type: string
            required:
                - kind
                - value
            type: object
        StaffNextOfKin:
            description: One of a person's next of kin (private).
            properties:
                name:
                    description: 1 to 200 characters.
                    maxLength: 200
                    type: string
                note:
                    description: Up to 500 characters. Absent when not set.
                    maxLength: 500
                    type: string
                phone:
                    description: Up to 32 characters. Absent when not set.
                    maxLength: 32
                    type: string
                relationship:
                    $ref: '#/components/schemas/StaffNextOfKinRelationship'
            required:
                - name
                - relationship
            type: object
        StaffNextOfKinList:
            description: A person's next of kin in their order, with the person's revision — the one a replace sends back in If-Match.
            properties:
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    type: array
                revision:
                    description: The person's revision.
                    format: int32
                    type: integer
            required:
                - nextOfKin
                - revision
            type: object
        StaffNextOfKinRelationship:
            enum:
                - spouse
                - partner
                - parent
                - child
                - sibling
                - other
            type: string
        StaffNextOfKinRequest:
            description: A person's next of kin, all of them, in the order they are to be listed — a full replace. An empty list removes them all.
            properties:
                nextOfKin:
                    items:
                        $ref: '#/components/schemas/StaffNextOfKin'
                    maxItems: 3
                    type: array
            required:
                - nextOfKin
            type: object
        StaffNoticeUnit:
            enum:
                - days
                - weeks
                - months
            type: string
        StaffOrg:
            description: 'A person''s place in the organisation today (design S6): chain is their manager, that manager''s manager and so on up — following each person''s earliest employment in force today, stopping where nobody manages or where the chain would come back on itself; reports are the people whose manager they are today.'
            properties:
                chain:
                    items:
                        $ref: '#/components/schemas/StaffPersonSummary'
                    type: array
                person:
                    $ref: '#/components/schemas/StaffPersonSummary'
                reports:
                    items:
                        $ref: '#/components/schemas/StaffPersonSummary'
                    type: array
            required:
                - person
                - chain
                - reports
            type: object
        StaffPayComponent:
            description: One named amount of the pay as the contract states it.
            properties:
                amount:
                    description: 0 or more, with at most two decimals.
                    format: double
                    type: number
                currency:
                    description: An ISO 4217 code, three letters.
                    type: string
                name:
                    description: 1 to 100 characters.
                    maxLength: 100
                    type: string
                period:
                    $ref: '#/components/schemas/StaffPayPeriod'
            required:
                - name
                - amount
                - currency
                - period
            type: object
        StaffPayPeriod:
            enum:
                - monthly
                - yearly
                - hourly
                - once
            type: string
        StaffPerson:
            description: 'A person (design §3.1), shaped by who is asking (§5): every field belongs to a field group — work, private, HR''s notes, the national identity number, the bank account, the account link — and a group the caller may not read is absent, never null. The work group is everyone''s who may see the person, manager, department, title, business unit and location among it — each from the terms in force today and their employment, the manager the terms'' own or else the department''s (design §4 Managers), absent when there is none; the private group, the national identity number, the bank account and the user are the person''s own and HR''s (staff:manage, staff:personal-data); notes are HR''s alone. status is where the person stands today. The national identity number is answered as its kind and whether one is on file, the bank account as its kind and last four digits — never more. capabilities say what the caller may do with this person.'
            properties:
                bankAccount:
                    $ref: '#/components/schemas/StaffPersonBankAccount'
                birthDate:
                    description: Private. Absent when not set.
                    format: date
                    type: string
                businessUnit:
                    $ref: '#/components/schemas/StaffBusinessUnitSummary'
                capabilities:
                    $ref: '#/components/schemas/StaffPersonCapabilities'
                city:
                    description: Private. Absent when not set.
                    type: string
                country:
                    description: Private. Absent when not set.
                    type: string
                department:
                    $ref: '#/components/schemas/StaffDepartmentSummary'
                displayName:
                    type: string
                employeeNumber:
                    type: string
                familyName:
                    type: string
                gender:
                    $ref: '#/components/schemas/StaffGender'
                givenName:
                    type: string
                id:
                    format: int64
                    type: integer
                location:
                    $ref: '#/components/schemas/StaffLocationSummary'
                manager:
                    $ref: '#/components/schemas/StaffPersonSummary'
                nationalId:
                    $ref: '#/components/schemas/StaffPersonNationalId'
                notes:
                    description: HR's notes — staff:manage and staff:personal-data only. Absent when not set.
                    type: string
                phoneMobile:
                    description: Private. Absent when not set.
                    type: string
                phonePrivate:
                    description: Private. Absent when not set.
                    type: string
                phoneWork:
                    description: Absent when not set.
                    type: string
                postalCode:
                    description: Private. Absent when not set.
                    type: string
                preferredLanguage:
                    $ref: '#/components/schemas/StaffLanguage'
                privateEmail:
                    description: Private. Absent when not set.
                    type: string
                revision:
                    description: The revision a change sends back in If-Match.
                    format: int32
                    type: integer
                status:
