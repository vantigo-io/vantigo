                    description: Not Found — no such person. The body is empty.
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/StaffProblem'
                    description: Conflict — revision_conflict; person_erased when the person has been erased (read-only but for the legal hold, the reassessment, an unlink and a rehire).
            summary: Replace a person's next of kin
            tags:
                - Staff
            x-vantigo-access: permission:staff:access+staff:manage
    /api/v1/staff/people/{id}/org:
        get:
            description: The person's managers up the chain — each the manager of the one before, by the terms in force today or the department's manager — and their direct reports today, each as the work group names them. A caller holding staff:view alone is not shown a manager in the chain who is not active today. Anyone who may see the person reads it; anyone else gets a 404 identical to an unknown id.
            operationId: getStaffPeopleByIdOrg
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StaffOrg'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — no such person, or not one the caller may see. The body is empty.
            summary: Get a person's place in the organisation
            tags:
