components:
    schemas:
        TimeEntryApprover:
            description: The user who approved an entry, named for display. A user the directory no longer knows is named 'Unknown user'.
            properties:
                displayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - userId
                - displayName
            type: object
        TimeEntryBilling:
            description: The bill rate snapshotted on the entry (D3), present only when the caller may see it — the entry's owner, the project's managers, and callers with projects:view-financials or projects:manage-all (D8). Present with nothing in it when the entry resolved no bill rate.
            properties:
                billRate:
                    description: The hourly bill rate. Absent when the entry is not billable or no step of the rate chain resolved one.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: The bill rate's currency — the project's for a line or project rate, the person rate card's for a person rate.
                    nullable: true
                    type: string
            type: object
        TimeEntryCapabilities:
            description: What the calling user may do with this entry, so the frontend never re-derives the rules.
            properties:
                canApprove:
                    description: Whether the caller may approve or reject the entry — it is submitted, the caller manages its project or holds time:approve, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canEdit:
                    description: Whether the caller may change or delete the entry — they own it, it is a draft or rejected, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canSubmit:
                    description: Whether the caller may submit the entry — they own it, it is a draft, and it is not dated before the lock date (time:manage is not held back by the lock).
                    type: boolean
                canUnapprove:
                    description: Whether the caller may return the approved entry to draft — it is approved, and the caller manages its project or holds time:approve or time:manage.
                    type: boolean
            required:
                - canEdit
                - canSubmit
                - canApprove
                - canUnapprove
            type: object
        TimeEntryCost:
            description: The cost rate snapshotted on the entry, present only when the caller holds time:manage or time:view-all (D8). Present with nothing in it when the entry resolved no cost rate.
            properties:
                costRate:
                    description: The hourly cost rate. Absent when the person had no cost rate in effect on the entry date.
                    format: double
                    nullable: true
                    type: number
                currency:
                    description: The person rate card's currency.
                    nullable: true
                    type: string
            type: object
        TimeEntryRequest:
            description: A time entry as it should stand. hours is the truth; startTime and endTime are optional, given together or not at all, and when given hours must equal their difference to two decimals (D1).
            properties:
                billable:
                    description: Absent defaults from the project's billing type. Always false on a non-billable project, whatever is sent.
                    nullable: true
                    type: boolean
                billingLineId:
                    description: One of the project's active billing lines.
                    format: int32
                    nullable: true
                    type: integer
                endTime:
                    description: HH:MM on the entry date, after startTime. Required when startTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                entryDate:
                    description: The day worked. Not before the lock date, unless the caller holds time:manage.
                    format: date
                    type: string
                hours:
                    description: Greater than zero, at most 24, at most two decimals; the caller's entries on one day total at most 24.
                    format: double
                    type: number
                note:
                    description: At most 2000 characters once trimmed; a blank note is stored as none.
                    nullable: true
                    type: string
                projectId:
                    description: A project the caller may log time on — active, and the caller holds the member or manager role on it.
                    format: int32
                    type: integer
                startTime:
                    description: HH:MM on the entry date. Required when endTime is given.
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                taskId:
                    description: A task on the project. Its title is snapshotted on the entry, so the entry stays readable after the task is deleted.
                    format: int32
                    nullable: true
                    type: integer
            required:
                - projectId
                - entryDate
                - hours
            type: object
        TimeEntryResponse:
            description: One time entry. The money on it is shaped per caller (D8) rather than refused — billing and cost are absent, not null, for a caller who may not see them.
            properties:
                approvedAt:
                    format: date-time
                    nullable: true
                    type: string
                approvedBy:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryApprover'
                    description: Absent until the entry is approved.
                billable:
                    type: boolean
                billing:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryBilling'
                    description: Absent — not null — when the caller may not see the entry's bill rate.
                billingLineCode:
                    nullable: true
                    type: string
                billingLineId:
                    format: int32
                    nullable: true
                    type: integer
                capabilities:
                    $ref: '#/components/schemas/TimeEntryCapabilities'
                cost:
                    allOf:
                        - $ref: '#/components/schemas/TimeEntryCost'
                    description: Absent — not null — when the caller may not see the entry's cost rate.
                createdAt:
                    format: date-time
                    type: string
                endTime:
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                entryDate:
                    format: date
                    type: string
                hours:
                    format: double
                    type: number
                id:
                    format: int64
                    type: integer
                invoicedAt:
                    format: date-time
                    nullable: true
                    type: string
                note:
                    nullable: true
                    type: string
                projectCode:
                    type: string
                projectId:
                    format: int32
                    type: integer
                projectName:
                    type: string
                rateSource:
                    description: "The step of the rate chain the bill rate came from: 'line', 'project', 'person' or 'none'."
                    type: string
                rejectionReason:
                    nullable: true
                    type: string
                revision:
                    format: int32
                    type: integer
                startTime:
                    nullable: true
                    pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
                    type: string
                status:
                    description: "'draft', 'submitted', 'approved', 'rejected' or 'invoiced'."
                    type: string
                submittedAt:
                    format: date-time
                    nullable: true
                    type: string
                taskId:
                    format: int32
                    nullable: true
                    type: integer
                taskTitle:
                    description: The task's title as it stood when the entry was saved.
                    nullable: true
                    type: string
                trackableCode:
                    description: The project's code and the billing line's joined with a hyphen ('KVEM1000-PM'). Absent when the entry has no billing line.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                userDisplayName:
                    type: string
                userId:
                    format: uuid
                    type: string
            required:
                - id
                - userId
                - userDisplayName
                - projectId
                - projectCode
                - projectName
                - entryDate
                - hours
                - billable
                - rateSource
                - status
                - revision
                - createdAt
                - updatedAt
                - capabilities
            type: object
info:
    title: Vantigo Time API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/time/entries:
        post:
            operationId: postTimeEntries
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TimeEntryRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeEntryResponse'
                    description: Created — a draft entry owned by the caller, with its rates resolved and snapshotted.
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: common.yaml#/components/schemas/HttpValidationProblemDetails
                    description: Bad Request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
            summary: Log time
            tags:
                - Time
            x-vantigo-access: permission:time:access
    /api/v1/time/entries/{id}:
        delete:
            operationId: deleteTimeEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "204":
                    description: No Content — the entry is gone.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden — the caller may see the entry but may not delete it, because it is not theirs, it is past draft or rejected, or it is dated before the lock date.
                "404":
                    description: Not Found — the entry does not exist, or the caller may not see it.
            summary: Delete a time entry
            tags:
                - Time
            x-vantigo-access: permission:time:access
        get:
            operationId: getTimeEntriesById
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int64
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TimeEntryResponse'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found — the entry does not exist, or the caller may not see it. Its owner sees it; so does a manager of its project and anyone holding time:view-all.
            summary: Get a time entry by id
            tags:
                - Time
            x-vantigo-access: permission:time:access
servers:
    - url: /
