                bankAccountId:
                    format: int32
                    type: integer
                bankAccountNumber:
                    type: string
                currencyDifference:
                    description: To currency_loss (positive) or currency_gain (negative); 0.00 for a NOK invoice.
                    type: string
                id:
                    format: int64
                    type: integer
                paidOn:
                    format: date
                    type: string
                removalVoucher:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                removedAt:
                    format: date-time
                    nullable: true
                    type: string
                voucher:
                    $ref: '#/components/schemas/AccountingVoucherRef'
            required:
                - amountCurrency
                - amountNok
                - bankAccountId
                - bankAccountNumber
                - currencyDifference
                - id
                - paidOn
                - removalVoucher
                - removedAt
                - voucher
            type: object
        AccountingSupplierPaymentInput:
            additionalProperties: false
            properties:
                amountCurrency:
                    description: 'For an invoice in another currency: the share settled, default what is left.'
                    nullable: true
                    type: string
                amountNok:
                    description: Positive, as the bank took it.
                    type: string
                bankAccountId:
                    description: An active asset account; default the bank role's.
                    format: int32
                    nullable: true
                    type: integer
                date:
                    format: date
                    type: string
            required:
                - amountNok
                - date
            type: object
        AccountingSystemRole:
            description: The accounts the module posts to by itself (A3, R8, R11). Every charge payment posts to charge_income; interest income is an ordinary account.
            enum:
                - receivables
                - payables
                - bank
                - vat_settlement
                - rounding
                - bad_debt
                - employee_payables
                - opening
                - year_result
                - clearing_vipps
                - charge_income
                - currency_gain
                - currency_loss
                - payment_fees
            type: string
        AccountingTaxCode:
            additionalProperties: false
            properties:
                active:
                    type: boolean
                code:
                    description: The SAF-T standard tax code.
                    type: string
                counterVatAccountId:
                    description: 'Reverse charge only: the account of the other side.'
                    format: int32
                    nullable: true
                    type: integer
                currentRate:
                    description: The rate valid today, null when none is.
                    nullable: true
                    type: string
                direction:
                    $ref: '#/components/schemas/AccountingTaxDirection'
                id:
                    format: int32
                    type: integer
                name:
                    type: string
                rates:
                    description: By validFrom.
                    items:
                        $ref: '#/components/schemas/AccountingTaxRate'
                    type: array
                reported:
                    description: 'False for 0, 7, 20, 21 and 22: the VAT return leaves them out.'
                    type: boolean
                reverseCharge:
                    type: boolean
                revision:
                    format: int32
                    type: integer
                vatAccountId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - active
                - code
                - counterVatAccountId
                - currentRate
                - direction
                - id
                - name
                - rates
                - reported
                - reverseCharge
                - revision
                - vatAccountId
            type: object
        AccountingTaxCodeList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingTaxCode'
                    type: array
            required:
                - items
            type: object
        AccountingTaxCodeUpdate:
            additionalProperties: false
            properties:
                active:
                    type: boolean
                counterVatAccountId:
                    format: int32
                    nullable: true
                    type: integer
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                vatAccountId:
                    format: int32
                    nullable: true
                    type: integer
            required:
                - active
                - counterVatAccountId
                - name
                - revision
                - vatAccountId
            type: object
        AccountingTaxDirection:
            enum:
                - output
                - input
                - none
            type: string
        AccountingTaxRate:
            additionalProperties: false
            properties:
                ratePercent:
                    description: Exact decimal, two places.
                    type: string
                validFrom:
                    format: date
                    type: string
                validTo:
                    format: date
                    nullable: true
                    type: string
            required:
                - ratePercent
                - validFrom
                - validTo
            type: object
        AccountingTaxRateInput:
            additionalProperties: false
            properties:
                ratePercent:
                    description: Exact decimal, at most two places, 0 to 99.99.
                    type: string
                validFrom:
                    format: date
                    type: string
            required:
                - ratePercent
                - validFrom
            type: object
        AccountingTaxRole:
            description: 'base: the line a tax code''s base is posted on. tax: VAT posted on the code''s account — output VAT on a sale, deducted input VAT on a purchase. tax_reverse: the calculated side of a reverse-charge code (86–89, 91, 92), the VAT the buyer owes, with the same base as its tax line.'
            enum:
                - base
                - tax
                - tax_reverse
            type: string
        AccountingUnposted:
            additionalProperties: false
            description: 'A source fact that could not be posted (A15), under Needs attention: the stream and position it was read at, its source key, what it is about, why — tax_code_unknown (the document''s standard tax code is not in the books, or inactive), account_inactive or account_unknown (a rule''s or a role''s account), account_kind_mismatch (a rule''s account is not an income account), waiting_on (another row of the same invoice is under Needs attention and was met first: this one waits behind it, waitingOn names it, and a retry that posts that row retries this one after it — R15), unknown_kind (a fact of a kind this version does not post), document_unknown (the invoice a fact is about is not in the journal), or an engine refusal''s code — and, once a retry posted it, the voucher. Expenses'' facts (delivery C) add amount_in_nok_needed (a line in another currency: enter its NOK amount), enter_as_supplier_invoice (an expense of the supplier_invoice kind: make it into a supplier invoice), expense_invoice_unapproved (an approval made into a supplier invoice was unapproved in Expenses: supplierInvoiceId names the invoice; it blocks while the invoice is a draft — delete or post it, then retry — and is informational once it is posted), and vat_not_deducted (informational: posted gross).'
            properties:
                amount:
                    nullable: true
                    type: string
                attempts:
                    format: int32
                    type: integer
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                detail:
                    type: string
                documentId:
                    description: The document in Invoices the fact is about.
                    format: int64
                    nullable: true
                    type: integer
                documentNumber:
                    nullable: true
                    type: string
                expenseLines:
                    description: An expense fact's lines in another currency, for amount_in_nok_needed; empty otherwise.
                    items:
                        $ref: '#/components/schemas/AccountingUnpostedExpenseLine'
                    type: array
                factDate:
                    format: date
                    nullable: true
                    type: string
                firstSeenAt:
                    format: date-time
                    type: string
                id:
                    format: int64
                    type: integer
                informational:
                    description: 'A row that posted but says something a person should see (vat_not_deducted, expense_invoice_unapproved once its invoice is posted): it never blocks and is not counted in unposted. A vat_not_deducted row is resolved when an undoing turns its voucher back.'
                    type: boolean
                invoiceId:
                    description: The invoice in Invoices the fact is about — a credit note's, the invoice it credits.
                    format: int64
                    nullable: true
                    type: integer
                lastTriedAt:
                    format: date-time
                    type: string
                orderKey:
                    description: 'What an expense fact waits behind: entry:<id> or claim:<id>.'
                    nullable: true
                    type: string
                position:
                    format: int64
                    type: integer
                postedAt:
                    format: date-time
                    nullable: true
                    type: string
                postedVoucher:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                reason:
                    type: string
                resolvedAt:
                    description: When an informational row was acknowledged, or the expense was made into a supplier invoice.
                    format: date-time
                    nullable: true
                    type: string
                source:
                    $ref: '#/components/schemas/AccountingSource'
                stream:
                    type: string
                supplierInvoiceId:
                    description: The draft supplier invoice the row was made into — or, after Reverse and copy, the copy; on expense_invoice_unapproved, the invoice the unapproved expense was made into.
                    format: int64
                    nullable: true
                    type: integer
                waitingOn:
                    description: With reason waiting_on, the row under Needs attention this one waits behind.
                    format: int64
                    nullable: true
                    type: integer
            required:
                - amount
                - attempts
                - customerId
                - customerName
                - detail
                - documentId
                - documentNumber
                - expenseLines
                - factDate
                - firstSeenAt
                - id
                - informational
                - invoiceId
                - lastTriedAt
                - orderKey
                - position
                - postedAt
                - postedVoucher
                - reason
                - resolvedAt
                - source
                - stream
                - supplierInvoiceId
                - waitingOn
            type: object
        AccountingUnpostedExpenseLine:
            additionalProperties: false
            properties:
                amountNok:
                    description: The amount in NOK a person entered, null until then.
                    nullable: true
                    type: string
                currency:
                    type: string
                entryId:
                    format: int64
                    type: integer
                gross:
                    type: string
                kind:
                    type: string
            required:
                - amountNok
                - currency
                - entryId
                - gross
                - kind
            type: object
        AccountingUnpostedList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingUnposted'
                    type: array
                total:
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        AccountingVatTerm:
            description: 'The VAT terms (A2): none when the seller is not VAT-registered.'
            enum:
                - bimonthly
                - yearly
                - none
            type: string
        AccountingVoucher:
            additionalProperties: false
            properties:
                amount:
                    description: The sum of the debits.
                    type: string
                attachments:
                    items:
                        $ref: '#/components/schemas/AccountingAttachment'
                    type: array
                description:
                    type: string
                display:
                    type: string
                documentDate:
                    format: date
                    type: string
                fiscalYear:
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingVoucherKind'
                number:
                    format: int32
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                postedByUserId:
                    format: uuid
                    nullable: true
                    type: string
                postings:
                    items:
                        $ref: '#/components/schemas/AccountingPosting'
                    type: array
                reversalReason:
                    nullable: true
                    type: string
                reversedBy:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                reverses:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                rule:
                    nullable: true
                    type: string
                ruleVersion:
                    format: int32
                    nullable: true
                    type: integer
                source:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSource'
                    nullable: true
                sourceDocumentId:
                    description: The document in Invoices a system voucher belongs to — the invoice its payment, credit note or write-off is about — which the screen links to.
                    format: int64
                    nullable: true
                    type: integer
                system:
                    type: boolean
                voucherDate:
                    format: date
                    type: string
            required:
                - amount
                - attachments
                - description
                - display
                - documentDate
                - fiscalYear
                - id
                - kind
                - number
                - postedAt
                - postedByUserId
                - postings
                - reversalReason
                - reversedBy
                - reverses
                - rule
                - ruleVersion
                - source
                - sourceDocumentId
                - system
                - voucherDate
            type: object
        AccountingVoucherKind:
            enum:
                - manual
                - opening
                - sales_invoice
                - sales_credit_note
                - customer_payment
                - charge
                - write_off
                - supplier_invoice
                - supplier_credit_note
                - supplier_payment
                - expense
                - reimbursement
                - vat_settlement
                - bank
                - import
            type: string
        AccountingVoucherList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingVoucherSummary'
                    type: array
                total:
                    description: Every voucher the filters match.
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        AccountingVoucherRef:
            additionalProperties: false
            properties:
                display:
                    description: 2027-000123.
                    type: string
                id:
                    format: int64
                    type: integer
            required:
                - display
                - id
            type: object
        AccountingVoucherSummary:
            additionalProperties: false
            properties:
                amount:
                    description: The sum of the debits.
                    type: string
                description:
                    type: string
                display:
                    description: 'The voucher''s number as shown: 2027-000123.'
                    type: string
                documentDate:
                    format: date
                    type: string
                fiscalYear:
                    format: int32
                    type: integer
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingVoucherKind'
                number:
                    format: int32
                    type: integer
                postedAt:
                    format: date-time
                    type: string
                reversedBy:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                reverses:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherRef'
                    nullable: true
                source:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSource'
                    nullable: true
                sourceDocumentId:
                    format: int64
                    nullable: true
                    type: integer
                system:
                    description: Posted by the system for a source fact; only its source reverses it.
                    type: boolean
                voucherDate:
                    format: date
                    type: string
            required:
                - amount
                - description
                - display
                - documentDate
                - fiscalYear
                - id
                - kind
                - number
                - postedAt
                - reversedBy
                - reverses
                - source
                - sourceDocumentId
                - system
                - voucherDate
            type: object
info:
    title: Vantigo Accounting API
    version: "1"
openapi: 3.0.3
paths:
    /api/v1/accounting/accounts:
        get:
            operationId: listAccountingAccounts
            parameters:
                - description: Matched against number and name.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
                - description: Only active, or only inactive, accounts.
                  in: query
                  name: active
                  required: false
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccountList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List the chart of accounts
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        post:
            operationId: createAccountingAccount
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingAccountInput'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: Created
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors; account_kind_mismatch.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; account_number_taken.
            summary: Create an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/accounts/{id}:
        delete:
            operationId: deleteAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "204":
                    description: No Content
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; account_has_postings, account_has_role.
            summary: Delete an account that has no postings
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
        get:
            operationId: getAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Get an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        put:
            operationId: updateAccountingAccount
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingAccountUpdate'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Bad Request — field errors; account_kind_mismatch.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up; revision_conflict, account_number_taken, account_has_postings (number or kind changed).
            summary: Change an account
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/accounts/{id}/groupings:
        put:
            operationId: putAccountingAccountGroupings
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: int32
                    type: integer
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingGroupingsInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingAccount'
                    description: OK
                "400":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: 'Bad Request — field errors: a year twice, a code that is not in the year''s list.'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "404":
                    description: Not Found
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Set an account's grouping codes
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:close+accounting:read
    /api/v1/accounting/catch-up:
        get:
            description: Reads Invoices' sales journal, with no transaction open, for how far each stream is behind.
            operationId: getAccountingCatchUp
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingCatchUp'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Where the catch-up of sales stands
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/grouping-codes:
        get:
            operationId: listAccountingGroupingCodes
            parameters:
                - description: Default the current year; the latest list not after it is answered.
                  in: query
                  name: year
                  required: false
                  schema:
                    format: int32
                    type: integer
                - description: Matched against code and both names.
                  in: query
                  name: q
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingGroupingCodeList'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: List Skatteetaten's grouping codes
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
    /api/v1/accounting/lock:
        get:
            operationId: getAccountingLock
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingLock'
                    description: OK
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Unauthorized
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: common.yaml#/components/schemas/AuthErrorResponse
                    description: Forbidden
                "409":
                    content:
                        application/problem+json:
                            schema:
                                $ref: '#/components/schemas/AccountingProblem'
                    description: Conflict — books_not_set_up.
            summary: Get the lock date and its history
            tags:
                - Accounting
            x-vantigo-access: permission:accounting:read
        put:
            description: Forward to a month end, or back with a reason, which the lock's history keeps (A8, R10).
            operationId: putAccountingLock
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AccountingLockInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AccountingLock'
                    description: OK
