components:
    schemas:
        AccountingAccount:
            additionalProperties: false
            properties:
                active:
                    type: boolean
                defaultTaxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                groupings:
                    description: By fromYear.
                    items:
                        $ref: '#/components/schemas/AccountingGrouping'
                    type: array
                hasPostings:
                    description: Number and kind are fixed once true.
                    type: boolean
                id:
                    format: int32
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingAccountKind'
                name:
                    type: string
                number:
                    description: 4 to 6 digits.
                    type: string
                revision:
                    format: int32
                    type: integer
                systemRole:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSystemRole'
                    nullable: true
            required:
                - active
                - defaultTaxCodeId
                - groupings
                - hasPostings
                - id
                - kind
                - name
                - number
                - revision
                - systemRole
            type: object
        AccountingAccountInput:
            additionalProperties: false
            properties:
                defaultTaxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                grouping:
                    allOf:
                        - $ref: '#/components/schemas/AccountingGrouping'
                    nullable: true
                kind:
                    $ref: '#/components/schemas/AccountingAccountKind'
                name:
                    type: string
                number:
                    type: string
            required:
                - kind
                - name
                - number
            type: object
        AccountingAccountKind:
            enum:
                - asset
                - liability
                - equity
                - income
                - expense
            type: string
        AccountingAccountList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingAccount'
                    type: array
            required:
                - items
            type: object
        AccountingAccountUpdate:
            additionalProperties: false
            properties:
                active:
                    type: boolean
                defaultTaxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingAccountKind'
                name:
                    type: string
                number:
                    type: string
                revision:
                    format: int32
                    type: integer
            required:
                - active
                - defaultTaxCodeId
                - kind
                - name
                - number
                - revision
            type: object
        AccountingAttachment:
            additionalProperties: false
            properties:
                contentType:
                    type: string
                fileName:
                    type: string
                id:
                    format: int64
                    type: integer
                sha256:
                    type: string
                sizeBytes:
                    format: int64
                    type: integer
                uploadedAt:
                    format: date-time
                    type: string
            required:
                - contentType
                - fileName
                - id
                - sha256
                - sizeBytes
                - uploadedAt
            type: object
        AccountingBrregEntity:
            additionalProperties: false
            properties:
                addressLine:
                    nullable: true
                    type: string
                city:
                    nullable: true
                    type: string
                country:
                    nullable: true
                    type: string
                deleted:
                    description: Struck off the register.
                    type: boolean
                name:
                    type: string
                organisationNumber:
                    type: string
                postalCode:
                    nullable: true
                    type: string
                vatRegistered:
                    nullable: true
                    type: boolean
            required:
                - addressLine
                - city
                - country
                - deleted
                - name
                - organisationNumber
                - postalCode
                - vatRegistered
            type: object
        AccountingBrregList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingBrregEntity'
                    type: array
            required:
                - items
            type: object
        AccountingCatchUp:
            additionalProperties: false
            description: 'Where the catch-up stands (A12, R7): each stream''s cursor, when it last ran, whether a wake-up waits, and how far the books are behind Invoices — the facts after the cursor, counted up to 500.'
            properties:
                streams:
                    items:
                        $ref: '#/components/schemas/AccountingCatchUpStream'
                    type: array
                unposted:
                    description: Facts under Needs attention, not yet posted.
                    format: int32
                    type: integer
            required:
                - streams
                - unposted
            type: object
        AccountingCatchUpStream:
            additionalProperties: false
            properties:
                behind:
                    description: The facts after the cursor, counted up to 500 (behindMore says there are more); null when the source could not be read.
                    format: int32
                    nullable: true
                    type: integer
                behindMore:
                    type: boolean
                lastError:
                    description: Why the last run stopped early, when it did.
                    nullable: true
                    type: string
                lastRunAt:
                    format: date-time
                    nullable: true
                    type: string
                position:
                    description: The last document number (invoices.documents) or fact seq (invoices.facts, expenses.facts) the books have read.
                    format: int64
                    type: integer
                requestedAt:
                    description: When a wake-up for the stream was asked for and not yet taken; null when none waits.
                    format: date-time
                    nullable: true
                    type: string
                stream:
                    enum:
                        - invoices.documents
                        - invoices.facts
                        - expenses.facts
                    type: string
            required:
                - behind
                - behindMore
                - lastError
                - lastRunAt
                - position
                - requestedAt
                - stream
            type: object
        AccountingEntryMode:
            description: 'How a line with a tax code is entered (A6): net of VAT, or gross with the VAT in it.'
            enum:
                - net
                - gross
            type: string
        AccountingGrouping:
            additionalProperties: false
            properties:
                category:
                    description: SAF-T grouping category, such as salgsinntekt.
                    type: string
                code:
                    description: SAF-T grouping code, such as 3000.
                    type: string
                fromYear:
                    description: The first fiscal year the grouping applies to.
                    format: int32
                    type: integer
            required:
                - category
                - code
                - fromYear
            type: object
        AccountingGroupingCode:
            additionalProperties: false
            properties:
                category:
                    type: string
                code:
                    type: string
                nameEn:
                    type: string
                nameNb:
                    type: string
            required:
                - category
                - code
                - nameEn
                - nameNb
            type: object
        AccountingGroupingCodeList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingGroupingCode'
                    type: array
                year:
                    description: The year of the list answered.
                    format: int32
                    type: integer
            required:
                - items
                - year
            type: object
        AccountingGroupingsInput:
            additionalProperties: false
            properties:
                groupings:
                    items:
                        $ref: '#/components/schemas/AccountingGrouping'
                    maxItems: 50
                    type: array
            required:
                - groupings
            type: object
        AccountingJournalInput:
            additionalProperties: false
            description: A manual journal (A6).
            properties:
                description:
                    maxLength: 500
                    type: string
                entry:
                    $ref: '#/components/schemas/AccountingEntryMode'
                lines:
                    items:
                        $ref: '#/components/schemas/AccountingJournalLineInput'
                    maxItems: 200
                    type: array
                voucherDate:
                    format: date
                    type: string
            required:
                - description
                - lines
                - voucherDate
            type: object
        AccountingJournalLineInput:
            additionalProperties: false
            properties:
                accountId:
                    format: int32
                    type: integer
                amount:
                    description: 'Signed: debit positive, credit negative; never zero.'
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                openItemId:
                    format: int64
                    nullable: true
                    type: integer
                projectId:
                    format: int32
                    nullable: true
                    type: integer
                supplierId:
                    format: int64
                    nullable: true
                    type: integer
                taxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                text:
                    maxLength: 500
                    type: string
            required:
                - accountId
                - amount
            type: object
        AccountingJournalPreview:
            additionalProperties: false
            properties:
                balanced:
                    type: boolean
                credit:
                    description: Positive.
                    type: string
                debit:
                    description: Exact decimal NOK, two places, signed where the field says so.
                    type: string
                difference:
                    description: 'Debit less credit: zero when the voucher balances.'
                    type: string
                lines:
                    items:
                        $ref: '#/components/schemas/AccountingPreviewLine'
                    type: array
            required:
                - balanced
                - credit
                - debit
                - difference
                - lines
            type: object
        AccountingLanguage:
            enum:
                - en
                - nb
            type: string
        AccountingLock:
            additionalProperties: false
            properties:
                booksStart:
                    format: date
                    type: string
                events:
                    description: Newest first.
                    items:
                        $ref: '#/components/schemas/AccountingLockEvent'
                    type: array
                lockedThrough:
                    format: date
                    nullable: true
                    type: string
            required:
                - booksStart
                - events
                - lockedThrough
            type: object
        AccountingLockEvent:
            additionalProperties: false
            properties:
                changedAt:
                    format: date-time
                    type: string
                changedByUserId:
                    format: uuid
                    type: string
                lockedFrom:
                    format: date
                    nullable: true
                    type: string
                lockedTo:
                    format: date
                    nullable: true
                    type: string
                reason:
                    nullable: true
                    type: string
            required:
                - changedAt
                - changedByUserId
                - lockedFrom
                - lockedTo
                - reason
            type: object
        AccountingLockInput:
            additionalProperties: false
            properties:
                lockedThrough:
                    description: A month end on or after booksStart; null unlocks every month.
                    format: date
                    nullable: true
                    type: string
                reason:
                    description: Required when the lock moves back.
                    maxLength: 500
                    nullable: true
                    type: string
            required:
                - lockedThrough
            type: object
        AccountingMakeSupplierInvoiceInput:
            additionalProperties: false
            properties:
                supplierIsPerson:
                    description: 'For a supplier created from the expense''s free text: whether it is a person (a sole proprietor), whose record the bookkeeping keeps five years after the last voucher. Ignored when an existing supplier is matched; default false.'
                    nullable: true
                    type: boolean
            type: object
        AccountingMeta:
            additionalProperties: false
            properties:
                attachmentsEnabled:
                    description: 'Whether the installation has file storage: without it an attachment is refused (storage_not_configured), so the journal form says so before posting.'
                    type: boolean
                canClose:
                    description: accounting:close
                    type: boolean
                canExport:
                    description: accounting:export
                    type: boolean
                canPost:
                    description: accounting:post
                    type: boolean
                currency:
                    description: NOK.
                    type: string
                expensesEnabled:
                    description: 'Whether Expenses'' journal is composed: approved expenses post themselves.'
                    type: boolean
                informational:
                    description: Rows under Needs attention that posted and say something (vat_not_deducted), not acknowledged.
                    format: int32
                    type: integer
                invoicesEnabled:
                    description: 'Whether Invoices'' sales journal is composed: open invoices are offered on the opening form, and sales post themselves.'
                    type: boolean
                openCustomerItems:
                    description: Customer open items with a balance.
                    format: int32
                    type: integer
                payablesDueSoon:
                    description: Posted supplier invoices not settled due today or in the next seven days.
                    format: int32
                    type: integer
                payablesOverdue:
                    description: Posted supplier invoices not settled whose due date has passed.
                    format: int32
                    type: integer
                projectsEnabled:
                    description: 'Whether Projects is composed: the project dimension is offered.'
                    type: boolean
                setUp:
                    description: Whether Set up the books has run (R12).
                    type: boolean
                settings:
                    allOf:
                        - $ref: '#/components/schemas/AccountingSettings'
                    description: Null until the books are set up.
                    nullable: true
                today:
                    description: The business calendar's today.
                    format: date
                    type: string
                unposted:
                    description: Source facts under Needs attention, not yet posted (A15).
                    format: int32
                    type: integer
                vouchersThisYear:
                    description: Vouchers in the fiscal year of today.
                    format: int32
                    type: integer
            required:
                - attachmentsEnabled
                - canClose
                - canExport
                - canPost
                - currency
                - expensesEnabled
                - informational
                - invoicesEnabled
                - openCustomerItems
                - payablesDueSoon
                - payablesOverdue
                - projectsEnabled
                - setUp
                - settings
                - today
                - unposted
                - vouchersThisYear
            type: object
        AccountingNokAmountsInput:
            additionalProperties: false
            properties:
                amounts:
                    items:
                        additionalProperties: false
                        properties:
                            amountNok:
                                description: Positive, two decimals.
                                type: string
                            entryId:
                                format: int64
                                type: integer
                        required:
                            - amountNok
                            - entryId
                        type: object
                    type: array
            required:
                - amounts
            type: object
        AccountingOpenInvoice:
            additionalProperties: false
            properties:
                amount:
                    description: Open at the day before booksStart; below zero is credit due back.
                    type: string
                customerId:
                    format: int32
                    type: integer
                customerName:
                    type: string
                documentId:
                    format: int64
                    type: integer
                dueDate:
                    format: date
                    type: string
                issueDate:
                    format: date
                    type: string
                number:
                    format: int64
                    type: integer
            required:
                - amount
                - customerId
                - customerName
                - documentId
                - dueDate
                - issueDate
                - number
            type: object
        AccountingOpenItem:
            additionalProperties: false
            properties:
                balance:
                    description: 'The sum of the item''s postings: positive is owed to the company.'
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                documentDate:
                    format: date
                    nullable: true
                    type: string
                documentNumber:
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                id:
                    format: int64
                    type: integer
                kind:
                    $ref: '#/components/schemas/AccountingPartyKind'
                originalAmount:
                    description: Exact decimal NOK, two places, signed where the field says so.
                    type: string
                settled:
                    type: boolean
                sourceDocumentId:
                    format: int64
                    nullable: true
                    type: integer
                supplierId:
                    format: int64
                    nullable: true
                    type: integer
                unallocated:
                    description: The party's item for postings that name no document (R5).
                    type: boolean
            required:
                - balance
                - customerId
                - customerName
                - documentDate
                - documentNumber
                - dueDate
                - id
                - kind
                - originalAmount
                - settled
                - sourceDocumentId
                - supplierId
                - unallocated
            type: object
        AccountingOpenItemList:
            additionalProperties: false
            properties:
                items:
                    items:
                        $ref: '#/components/schemas/AccountingOpenItem'
                    type: array
                total:
                    description: Every item the filters match.
                    format: int32
                    type: integer
            required:
                - items
                - total
            type: object
        AccountingOpening:
            additionalProperties: false
            properties:
                booksStart:
                    format: date
                    type: string
                canEnter:
                    description: No standing opening voucher and no lock yet.
                    type: boolean
                invoicesAvailable:
                    type: boolean
                locked:
                    description: 'The first lock is set: the opening is final (A9).'
                    type: boolean
                openInvoices:
                    description: Invoices' open invoices at the day before booksStart (A9).
                    items:
                        $ref: '#/components/schemas/AccountingOpenInvoice'
                    type: array
                voucher:
                    allOf:
                        - $ref: '#/components/schemas/AccountingVoucherSummary'
                    description: The standing opening voucher, null when none.
                    nullable: true
            required:
                - booksStart
                - canEnter
                - invoicesAvailable
                - locked
                - openInvoices
                - voucher
            type: object
        AccountingOpeningInput:
            additionalProperties: false
            description: The opening balances (A9); the difference goes to the opening account.
            properties:
                lines:
                    items:
                        $ref: '#/components/schemas/AccountingOpeningLineInput'
                    maxItems: 2000
                    type: array
            required:
                - lines
            type: object
        AccountingOpeningLineInput:
            additionalProperties: false
            properties:
                accountId:
                    format: int32
                    type: integer
                amount:
                    description: 'Signed: debit positive.'
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                documentDate:
                    format: date
                    nullable: true
                    type: string
                documentNumber:
                    maxLength: 40
                    nullable: true
                    type: string
                dueDate:
                    format: date
                    nullable: true
                    type: string
                sourceDocumentId:
                    description: The invoice in Invoices this line stands for (R5).
                    format: int64
                    nullable: true
                    type: integer
                supplierId:
                    format: int64
                    nullable: true
                    type: integer
                text:
                    maxLength: 500
                    type: string
            required:
                - accountId
                - amount
            type: object
        AccountingPartyKind:
            enum:
                - customer
                - supplier
            type: string
        AccountingPosting:
            additionalProperties: false
            properties:
                accountId:
                    format: int32
                    type: integer
                accountName:
                    type: string
                accountNumber:
                    type: string
                amount:
                    description: 'Signed: debit positive, credit negative.'
                    type: string
                currency:
                    description: 'On a purchase in another currency (R8): its currency; null on a NOK posting.'
                    nullable: true
                    type: string
                currencyAmount:
                    description: The amount in that currency, with the NOK amount's sign.
                    nullable: true
                    type: string
                customerId:
                    format: int32
                    nullable: true
                    type: integer
                customerName:
                    nullable: true
                    type: string
                description:
                    type: string
                exchangeRate:
                    description: NOK per unit, six decimals.
                    nullable: true
                    type: string
                lineNo:
                    format: int32
                    type: integer
                openItemId:
                    format: int64
                    nullable: true
                    type: integer
                postingRuleId:
                    description: On a revenue line, the posting rule that placed it (A14, R15); null on every other line.
                    format: int32
                    nullable: true
                    type: integer
                postingRuleName:
                    description: The rule's name in the version that placed the line, whatever it is called now or whether it is archived.
                    nullable: true
                    type: string
                postingRuleVersion:
                    description: The version of the rule that placed the line.
                    format: int32
                    nullable: true
                    type: integer
                projectId:
                    format: int32
                    nullable: true
                    type: integer
                projectName:
                    nullable: true
                    type: string
                supplierId:
                    format: int64
                    nullable: true
                    type: integer
                taxBase:
                    description: On a tax line, the base it was computed from.
                    nullable: true
                    type: string
                taxCode:
                    nullable: true
                    type: string
                taxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                taxRole:
                    allOf:
                        - $ref: '#/components/schemas/AccountingTaxRole'
                    nullable: true
                taxSpecification:
                    description: The VAT return's specification line the posting belongs to — tapPåKrav for the VAT a konstatert loss takes back (R4); null for an ordinary posting.
                    nullable: true
                    type: string
            required:
                - accountId
                - accountName
                - accountNumber
                - amount
                - currency
                - currencyAmount
                - customerId
                - customerName
                - description
                - exchangeRate
                - lineNo
                - openItemId
                - postingRuleId
                - postingRuleName
                - postingRuleVersion
                - projectId
                - projectName
                - supplierId
                - taxBase
                - taxCode
                - taxCodeId
                - taxRole
                - taxSpecification
            type: object
        AccountingPostingRule:
            additionalProperties: false
            description: 'A posting rule (A14): for a sales rule, the account a sales line''s net is credited to, matched on exactly one of the line''s kind, its product''s tax category or its standard tax code; a default rule (match default) is seeded per tax code and is the last resort. For an expense rule (delivery C), the expense account an expense category''s cost is debited to, and whether its VAT may be deducted. version counts the changes of its name, account or deductibility (R15), each kept; a sales rule credits an income account and an expense rule debits an expense account; a posting names the rule and the version that placed it, and a change affects future vouchers only. A rule is archived, never deleted: an archived one matches nothing and is not listed, and what it placed still names it.'
            properties:
                accountId:
                    format: int32
                    type: integer
                accountName:
                    type: string
                accountNumber:
                    type: string
                expenseCategoryId:
                    description: On an expense_category rule, Expenses' category id.
                    format: int32
                    nullable: true
                    type: integer
                id:
                    format: int32
                    type: integer
                lineKind:
                    description: On a line_kind rule, the line kind (hours, expense, milestone, settlement, order_line, subscription_period, deduction, manual, mixed).
                    nullable: true
                    type: string
                match:
                    $ref: '#/components/schemas/AccountingRuleMatch'
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                scope:
                    $ref: '#/components/schemas/AccountingRuleScope'
                taxCategoryId:
                    description: On a tax_category rule, Products' tax category id.
                    format: int32
                    nullable: true
                    type: integer
                taxCode:
                    description: On a tax_code or default rule, the standard tax code.
                    nullable: true
                    type: string
                updatedAt:
                    format: date-time
                    type: string
                vatDeductible:
                    description: 'On an expense rule: whether the VAT on the category''s expenses may be deducted (R2).'
                    nullable: true
                    type: boolean
                version:
                    format: int32
                    type: integer
            required:
                - accountId
                - accountName
                - accountNumber
                - expenseCategoryId
                - id
                - lineKind
                - match
                - name
                - revision
                - scope
                - taxCategoryId
                - taxCode
                - updatedAt
                - vatDeductible
                - version
            type: object
        AccountingPostingRuleInput:
            additionalProperties: false
            description: 'A new rule: a name (1–100, unique), the scope, a match — for sales line_kind, tax_category or tax_code, for expense expense_category — with its one value, an active account of the scope''s kind, and for an expense rule vatDeductible.'
            properties:
                accountId:
                    format: int32
                    type: integer
                expenseCategoryId:
                    format: int32
                    type: integer
                lineKind:
                    type: string
                match:
                    $ref: '#/components/schemas/AccountingRuleMatch'
                name:
                    type: string
                scope:
                    $ref: '#/components/schemas/AccountingRuleScope'
                taxCategoryId:
                    format: int32
                    type: integer
                taxCode:
                    type: string
                vatDeductible:
                    description: On an expense rule; default true.
                    type: boolean
            required:
                - accountId
                - match
                - name
                - scope
            type: object
        AccountingPostingRuleList:
            additionalProperties: false
            properties:
                items:
                    description: In precedence order — line kind, tax category, tax code, the defaults — and by name.
                    items:
                        $ref: '#/components/schemas/AccountingPostingRule'
                    type: array
            required:
                - items
            type: object
        AccountingPostingRuleUpdate:
            additionalProperties: false
            description: A rule's name and account (and an expense rule's deductibility) under its revision; its match never changes. A change of any of them is a new version.
            properties:
                accountId:
                    format: int32
                    type: integer
                name:
                    type: string
                revision:
                    format: int32
                    type: integer
                vatDeductible:
                    description: On an expense rule; unchanged when left out.
                    nullable: true
                    type: boolean
            required:
                - accountId
                - name
                - revision
            type: object
        AccountingPreviewLine:
            additionalProperties: false
            properties:
                accountId:
                    format: int32
                    type: integer
                amount:
                    description: Exact decimal NOK, two places, signed where the field says so.
                    type: string
                fromLine:
                    description: The index of the entered line this posting comes from.
                    format: int32
                    type: integer
                lineNo:
                    format: int32
                    type: integer
                ratePercent:
                    nullable: true
                    type: string
                taxBase:
                    description: Exact decimal NOK, two places, signed where the field says so.
                    nullable: true
                    type: string
                taxCodeId:
                    format: int32
                    nullable: true
                    type: integer
                taxRole:
                    allOf:
                        - $ref: '#/components/schemas/AccountingTaxRole'
                    nullable: true
            required:
                - accountId
                - amount
                - fromLine
                - lineNo
                - ratePercent
                - taxBase
                - taxCodeId
                - taxRole
            type: object
        AccountingProblem:
