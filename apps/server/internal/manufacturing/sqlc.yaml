# sqlc: Manufacturing's typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/manufacturing/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00156_manufacturing_baseline.sql
      - ../db/migrations/00157_manufacturing_orders.sql
      - ../db/migrations/00158_manufacturing_work_orders.sql
      - ../db/migrations/00159_manufacturing_schedule.sql
      - ../db/migrations/00160_manufacturing_mto.sql
      - ../db/migrations/00167_manufacturing_lots.sql
      - ../db/migrations/00168_manufacturing_quality.sql
      - ../db/migrations/00171_manufacturing_replenishment.sql
      - ../db/migrations/00172_manufacturing_routing.sql
      - ../db/migrations/00173_manufacturing_bom_depth.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
