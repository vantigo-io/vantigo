# sqlc: communications' typed queries. Schema = every goose migration (sqlc
# reads the -- +goose Up sections); queries = internal/communications/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00006_communications_baseline.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
