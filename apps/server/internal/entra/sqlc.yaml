# sqlc: entra's typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/entra/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00061_entra_baseline.sql
      - ../db/migrations/00063_entra_groups.sql
      - ../db/migrations/00082_entra_calendar_sync.sql
      - ../db/migrations/00085_entra_mailbox_subscriptions.sql
      - ../db/migrations/00088_entra_outlook_connect.sql
      - ../db/migrations/00089_entra_outlook_connections.sql
      - ../db/migrations/00090_entra_mail_channels.sql
      - ../db/migrations/00093_entra_mailbox_subscriptions_resource.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
