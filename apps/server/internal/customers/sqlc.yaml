# sqlc: customers' typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/customers/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00003_customers_baseline.sql
      - ../db/migrations/00007_customers_type.sql
      - ../db/migrations/00015_customers_timeline_actor.sql
      - ../db/migrations/00016_customers_revision.sql
      - ../db/migrations/00017_customers_contact_info.sql
      - ../db/migrations/00018_customers_addresses.sql
      - ../db/migrations/00019_customers_billing_profile.sql
      - ../db/migrations/00020_customers_peppol_lookup.sql
      - ../db/migrations/00021_customers_registry_records.sql
      - ../db/migrations/00022_customers_registry_status_dates.sql
      - ../db/migrations/00023_customers_registry_feed.sql
      - ../db/migrations/00024_customers_owner_tags.sql
      - ../db/migrations/00025_customers_contact_roles.sql
      - ../db/migrations/00026_customers_timeline_follow_up.sql
      - ../db/migrations/00027_customers_groups.sql
      - ../db/migrations/00028_customers_default_bill_rate.sql
      - ../db/migrations/00029_customers_merge.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
