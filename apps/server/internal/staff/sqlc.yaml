# sqlc: staff's typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/staff/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00042_staff_foundation.sql
      - ../db/migrations/00043_staff_records.sql
      - ../db/migrations/00047_staff_absence.sql
      - ../db/migrations/00051_staff_accounts.sql
      - ../db/migrations/00053_staff_time_zone_to_workspace.sql
      - ../db/migrations/00060_staff_account_kind.sql
      - ../db/migrations/00062_staff_groups.sql
      - ../db/migrations/00066_staff_competence.sql
      - ../db/migrations/00067_staff_one_to_one.sql
      - ../db/migrations/00068_staff_competence_profiles.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
