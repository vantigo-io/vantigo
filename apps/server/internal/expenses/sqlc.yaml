# sqlc: expenses' typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/expenses/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00012_expenses_baseline.sql
      - ../db/migrations/00013_expenses_claims.sql
      - ../db/migrations/00014_expenses_to_invoice_index.sql
      - ../db/migrations/00033_expenses_supplier_invoices.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
