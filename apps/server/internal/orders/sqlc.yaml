# sqlc: Orders' typed queries. Schema = this module's own migrations only
# (sqlc reads the -- +goose Up sections); internal/db's schema_test keeps that
# list in step with the migrations directory; queries =
# internal/orders/queries.
version: "2"
sql:
  - engine: postgresql
    schema:
      - ../db/migrations/00119_orders_baseline.sql
      - ../db/migrations/00120_orders_warnings.sql
      - ../db/migrations/00121_orders_allocations.sql
      - ../db/migrations/00124_orders_subscriptions.sql
      - ../db/migrations/00126_orders_deliveries.sql
      - ../db/migrations/00127_orders_shipping.sql
      - ../db/migrations/00161_orders_mto_ready.sql
      - ../db/migrations/00166_orders_delivery_lots.sql
      - ../db/migrations/00177_orders_kits.sql
    queries: queries
    gen:
      go:
        package: store
        out: store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_json_tags: false
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
