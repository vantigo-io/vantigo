name: Server tests

# The Go server's quality gate — lint, tests against a real PostgreSQL,
# vulnerability scan, and the release config — defined once and called by the
# PR pipeline and the release dry run. At the cutover it merges with the
# frontend jobs into a single test.yml.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Go server lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vantigo
          POSTGRES_PASSWORD: vantigo
          POSTGRES_DB: vantigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantigo -d vantigo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vantigo:vantigo@127.0.0.1:5432/vantigo_test?sslmode=disable
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "go bun aqua:golangci/golangci-lint aqua:goreleaser/goreleaser aqua:rhysd/actionlint aqua:koalaman/shellcheck aqua:sqlc-dev/sqlc"

      - name: 💾 Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🧰 Toolchain pins agree
        run: |
          bun run toolchain:check
          bun run toolchain:test

      - name: 🔍 Lint workflows and scripts
        run: |
          actionlint .github/workflows/server-*.yml
          shellcheck scripts/*.sh

      - name: 🔍 golangci-lint
        working-directory: apps/server
        run: golangci-lint run

      - name: 🧬 Generated code is up to date
        working-directory: apps/server
        run: |
          go generate ./...
          git diff --exit-code -- . ../../openapi || {
            echo "::error::Generated code or embedded contract copies are stale. Run 'go generate ./...' in apps/server and commit the result."
            exit 1
          }
          untracked="$(git status --porcelain -- . ../../openapi)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::go generate produced files that are not committed. Run 'go generate ./...' in apps/server and commit the result."
            exit 1
          fi

      - name: 🧪 Go tests with the race detector
        working-directory: apps/server
        # The race detector makes the identity suite several times slower than
        # a plain run, so the per-package default of 10m is too tight.
        run: go test -race -count=1 -timeout 20m ./...

      - name: 🌍 Energy tests under a non-UTC time zone
        working-directory: apps/server
        # pgx decodes timestamptz in the process's local zone, so a handler
        # that offset-checks a value read back from Postgres passes under UTC
        # and 400s everywhere else. That bug shipped once and this run is the
        # only thing that would catch it again: every other job here runs UTC.
        # Energy owns the timestamp-sensitive handlers, so it alone is enough.
        env:
          TZ: Europe/Oslo
        run: go test -count=1 -timeout 10m ./internal/energy/...

      - name: 🛡️ govulncheck
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: 🔍 GoReleaser configuration
        run: goreleaser check
