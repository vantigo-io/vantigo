name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  metadata:
    name: 📜 Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      - name: 💾 Dotnet tool restore
        run: dotnet tool restore

      - name: 💾 Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: 🧐 Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.version.outputs.assemblySemVer }}

  build_and_test_frontend:
    needs: metadata
    name: 🏗️ Build and test host frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Check formatting
        run: bun run format:check

      - name: 🔍 Lint host frontend
        run: bun run --cwd apps/host/frontend lint

      - name: 🧪 Test host frontend
        run: bun run --cwd apps/host/frontend test

      - name: 🏗 Build host frontend
        working-directory: apps/host/frontend
        run: bun run build

  build_and_test_solution:
    needs: metadata
    name: 🏗️ Build and test solution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      - name: 🧰 Restore .NET dependencies
        run: dotnet restore Vantigo.slnx

      - name: Build .NET 🏗️
        run: dotnet build Vantigo.slnx --no-restore --configuration Release

      - name: Test .NET 🧪
        run: dotnet test Vantigo.slnx --no-build --configuration Release

  validate_compose:
    needs: metadata
    name: 🔍 Validate Docker Compose stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Validate compose configuration
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          cp vantigo.env.example vantigo.env
          docker compose config -q

  build_images:
    needs: [metadata, build_and_test_solution, build_and_test_frontend]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Package Vantigo locally
        run: |
          dotnet publish \
            apps/host/backend/Vantigo.Host/Vantigo.Host.csproj \
            --configuration Release \
            -p:ContainerImageFormat=OCI

  publish_images:
    needs: [metadata, build_and_test_frontend, build_and_test_solution]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ./global.json

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publish Vantigo to GHCR
        run: |
          dotnet publish \
            apps/host/backend/Vantigo.Host/Vantigo.Host.csproj \
            --configuration Release \
            -p:ContainerImageFormat=OCI \
            -p:ContainerRegistry=ghcr.io

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔏 Sign multi-architecture images
        run: |
          set -euo pipefail
          tag="v${{ needs.metadata.outputs.majorMinorPatch }}"
          image="vantigo"
          digest="$(docker buildx imagetools inspect "ghcr.io/vantigo-io/${image}:${tag}" --format '{{.Manifest.Digest}}')"
          if [ -z "$digest" ]; then
            echo "Failed to resolve digest for ghcr.io/vantigo-io/${image}:${tag}" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/vantigo-io/${image}@${digest}"

  release:
    needs: [metadata, publish_images]
    if: needs.publish_images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.metadata.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping release."
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
