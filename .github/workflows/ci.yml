name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  metadata:
    name: 📜 Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 💾 Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: 🧐 Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.version.outputs.assemblySemVer }}

  build_and_test_frontend:
    needs: metadata
    name: 🏗️ Build and test host frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Frontend API types are up to date
        run: |
          bun run gen:client:test
          bun run gen:client
          git diff --exit-code -- '**/api-schema.d.ts' || {
            echo "::error::Frontend API types are stale. Run 'bun run gen:client' and commit the result."
            exit 1
          }
          untracked="$(git status --porcelain -- '**/api-schema.d.ts')"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::gen:client produced API types that are not committed. Run 'bun run gen:client' and commit the result."
            exit 1
          fi

      - name: 🛡️ Audit frontend dependencies (informational)
        run: bun audit
        continue-on-error: true

      - name: 🛡️ Audit frontend dependencies (fail on High/Critical)
        run: bun audit --audit-level=high

      - name: 🌐 Check translation catalogs
        run: bun run translations:check

      - name: 🧪 Test i18n quality gates
        run: bun run i18n:test

      - name: 🔍 Check formatting
        run: bun run format:check

      - name: 🔍 Lint frontends
        run: bun run frontend:lint

      - name: 🧪 Test frontends
        run: bun run frontend:test

      - name: 🏗 Build host frontend
        working-directory: apps/host/frontend
        run: bun run build

  validate_compose:
    needs: metadata
    name: 🔍 Validate Docker Compose stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Validate compose configuration
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          cp vantigo.env.example vantigo.env
          docker compose config -q

  codeql:
    needs: metadata
    # Dormant until GitHub Advanced Security is enabled on this repository (it
    # is a private org repo without GHAS, so code scanning API calls 403).
    # Flip the `ENABLE_CODE_SCANNING` repository variable to `true` once GHAS
    # is turned on to activate this job — everything else is already wired.
    if: vars.ENABLE_CODE_SCANNING == 'true'
    name: 🔎 CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🔎 Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

