name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  metadata:
    name: 📜 Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 💾 Dotnet tool restore
        run: dotnet tool restore

      - name: 💾 Set up GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
        with:
          versionSpec: 6.8.2

      - name: 🧐 Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.version.outputs.assemblySemVer }}

  build_and_test_frontend:
    needs: metadata
    name: 🏗️ Build and test host frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🛡️ Audit frontend dependencies (informational)
        run: bun audit
        continue-on-error: true

      - name: 🛡️ Audit frontend dependencies (fail on High/Critical)
        run: bun audit --audit-level=high

      - name: 🔧 Check toolchain pinning
        run: bun run toolchain:check

      - name: 🌐 Check translation catalogs
        run: bun run translations:check

      - name: 🧪 Test i18n quality gates
        run: bun run i18n:test

      - name: 🔍 Check formatting
        run: bun run format:check

      - name: 🔍 Lint frontends
        run: bun run frontend:lint

      - name: 🧪 Test frontends
        run: bun run frontend:test

      - name: 🏗 Build host frontend
        working-directory: apps/host/frontend
        run: bun run build

  build_and_test_solution:
    needs: metadata
    name: 🏗️ Build and test solution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Restore .NET dependencies
        run: dotnet restore Vantigo.slnx

      - name: 🛡️ Check NuGet packages for known vulnerabilities
        run: |
          set -o pipefail
          dotnet list Vantigo.slnx package --vulnerable --include-transitive 2>&1 | tee "${RUNNER_TEMP}/nuget-vulnerable.txt"
          if grep -qE "NU190[34]:" "${RUNNER_TEMP}/nuget-vulnerable.txt"; then
            echo "::error::High or Critical severity vulnerable NuGet packages detected (see NU1903/NU1904 warnings above)."
            exit 1
          fi

      - name: Build .NET 🏗️
        run: dotnet build Vantigo.slnx --no-restore --configuration Release

      - name: Test .NET 🧪
        run: dotnet test Vantigo.slnx --no-build --configuration Release

  validate_compose:
    needs: metadata
    name: 🔍 Validate Docker Compose stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Validate compose configuration
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          cp vantigo.env.example vantigo.env
          docker compose config -q

  codeql:
    needs: metadata
    name: 🔎 CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        if: matrix.build-mode == 'manual'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🏗️ Build solution for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          dotnet restore Vantigo.slnx
          dotnet build Vantigo.slnx --no-restore --configuration Release

      - name: 🔎 Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  build_images:
    needs: [metadata, build_and_test_solution, build_and_test_frontend]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 📦 Package Vantigo locally
        # Publish to an OCI archive rather than the Docker daemon. The image is a
        # multi-architecture index, and loading one into Docker requires the
        # containerd image store, which hosted runners do not enable. An archive
        # exercises the same build path publish_images uses, without a daemon.
        run: |
          dotnet publish \
            apps/host/backend/Vantigo.Host/Vantigo.Host.csproj \
            --configuration Release \
            -p:ContainerImageFormat=OCI \
            -p:ContainerArchiveOutputPath="${RUNNER_TEMP}/container"

      - name: 🔍 Verify the image index covers both architectures
        run: |
          archive="${RUNNER_TEMP}/container/vantigo-io/vantigo.tar.gz"
          test -f "$archive" || { echo "::error::No container archive was produced."; exit 1; }
          index=$(tar -xOf "$archive" index.json | jq -r '.manifests[0].digest | sub("^sha256:"; "")')
          platforms=$(tar -xOf "$archive" "blobs/sha256/${index}" | jq -r '.manifests[].platform | .os + "/" + .architecture' | sort -u)
          echo "Image index platforms:"; echo "$platforms" | sed 's/^/  - /'
          for expected in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$expected" || { echo "::error::Image index is missing $expected."; exit 1; }
          done

      - name: 🛡️ Scan container image for vulnerabilities
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/container-extracted"
          tar -xf "${RUNNER_TEMP}/container/vantigo-io/vantigo.tar.gz" -C "${RUNNER_TEMP}/container-extracted"
          trivy image \
            --input "${RUNNER_TEMP}/container-extracted" \
            --platform linux/amd64 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table

      - name: 📋 Generate SBOM for the container image
        run: |
          trivy image \
            --input "${RUNNER_TEMP}/container-extracted" \
            --platform linux/amd64 \
            --scanners vuln \
            --format cyclonedx \
            --output "${RUNNER_TEMP}/vantigo-sbom.cdx.json"

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: ${{ runner.temp }}/vantigo-sbom.cdx.json
          retention-days: 14

  publish_images:
    needs: [metadata, build_and_test_frontend, build_and_test_solution]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publish Vantigo to GHCR
        run: |
          dotnet publish \
            apps/host/backend/Vantigo.Host/Vantigo.Host.csproj \
            --configuration Release \
            -p:ContainerImageFormat=OCI \
            -p:ContainerRegistry=ghcr.io

      - name: 🛡️ Scan published container image for vulnerabilities
        run: |
          set -euo pipefail
          tag="v${{ needs.metadata.outputs.majorMinorPatch }}"
          trivy image \
            "ghcr.io/vantigo-io/vantigo:${tag}" \
            --platform linux/amd64 \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table

      - name: 📋 Generate SBOM for the published container image
        run: |
          set -euo pipefail
          tag="v${{ needs.metadata.outputs.majorMinorPatch }}"
          trivy image \
            "ghcr.io/vantigo-io/vantigo:${tag}" \
            --platform linux/amd64 \
            --scanners vuln \
            --format cyclonedx \
            --output "${RUNNER_TEMP}/vantigo-sbom.cdx.json"

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: ${{ runner.temp }}/vantigo-sbom.cdx.json
          retention-days: 90

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: 🔏 Sign multi-architecture images
        run: |
          set -euo pipefail
          tag="v${{ needs.metadata.outputs.majorMinorPatch }}"
          image="vantigo"
          digest="$(docker buildx imagetools inspect "ghcr.io/vantigo-io/${image}:${tag}" --format '{{.Manifest.Digest}}')"
          if [ -z "$digest" ]; then
            echo "Failed to resolve digest for ghcr.io/vantigo-io/${image}:${tag}" >&2
            exit 1
          fi
          cosign sign --yes "ghcr.io/vantigo-io/${image}@${digest}"

  release:
    needs: [metadata, publish_images]
    if: needs.publish_images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.metadata.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping release."
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
