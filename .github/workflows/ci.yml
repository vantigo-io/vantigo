name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  metadata:
    name: 📜 Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: ./global.json

      - name: 💾 Dotnet tool restore
        run: dotnet tool restore

      - name: 💾 Set up GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: 6.8.2

      - name: 🧐 Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v4.7.0

    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      fullSemVer: ${{ steps.version.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}
      assemblySemVer: ${{ steps.version.outputs.assemblySemVer }}

  build_and_test_frontends:
    needs: metadata
    name: 🏗️ Build and test frontends
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Check formatting
        run: bun run format:check

      - name: 🔍 Lint frontends
        run: bun run frontend:lint

      - name: 🧪 Test frontends
        run: bun run frontend:test

      - name: 🏗 Build frontends️
        run: bun run frontend:build

  build_and_test_backends:
    needs: metadata
    name: 🏗️ Build backends
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: 🧰 Restore .NET dependencies
        run: dotnet restore Vantigo.slnx

      - name: Build .NET 🏗️
        run: dotnet build Vantigo.slnx --no-restore --configuration Release

      - name: Test .NET 🧪
        run: dotnet test Vantigo.slnx --no-build --configuration Release

  build_images:
    needs: [metadata, build_and_test_backends, build_and_test_frontends]
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: 📦 Package applications locally
        run: |
          dotnet publish \
            --configuration Release \
            -p:ContainerImageFormat=OCI

  publish_images:
    needs: [metadata, build_and_test_frontends, build_and_test_backends]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Setup .net
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: ./global.json

      - name: 💾 Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: .bun-version

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Publish applications to GHCR
        run: |
          dotnet publish \
            --configuration Release \
            -p:ContainerImageFormat=OCI \
            -p:ContainerRegistry=ghcr.io

      - name: 🔏 Install Cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad

      - name: 🔏 Sign multi-architecture images
        run: |
          set -euo pipefail
          tag="v${{ needs.metadata.outputs.majorMinorPatch }}"
          for image in customers communications; do
            digest="$(docker buildx imagetools inspect "ghcr.io/vantigo-io/${image}:${tag}" --format '{{.Manifest.Digest}}')"
            if [ -z "$digest" ]; then
              echo "Failed to resolve digest for ghcr.io/vantigo-io/${image}:${tag}" >&2
              exit 1
            fi
            cosign sign --yes "ghcr.io/vantigo-io/${image}@${digest}"
          done

  release:
    needs: [metadata, publish_images]
    if: needs.publish_images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.metadata.outputs.majorMinorPatch }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; skipping release."
            exit 0
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes
