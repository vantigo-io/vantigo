name: CI

# The whole pipeline: the frontend gate, the Go server gate, the compose and
# CodeQL checks, the container image, and the release. The Go server's three
# own workflows (server-ci.yml, server-release.yml, server-test.yml) folded in
# here at the cutover, when the .NET tree — and with it `dotnet publish` and
# GitVersion — was deleted.
#
# A pull request builds, smoke-tests, scans and pushes a preview image; a push
# to main publishes the release image, signs it and cuts the GitHub Release; a
# manual dispatch additionally runs the GoReleaser dry run. Versions come from
# svu over the v-prefixed git tags (Conventional Commits) — see `metadata`.

on:
  # Only main: every branch reaches CI through its pull request, and the Go
  # gate is long enough that running it twice per push is not free.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vantigo-io/vantigo

jobs:
  metadata:
    name: 📜 Metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # svu computes the upcoming version from tags and history.
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "aqua:caarlos0/svu"

      - name: 🧮 Determine the version
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # --v0 keeps a breaking change inside 0.x. --always gives every push
          # to main a fresh patch: without it a chore-only push re-derives the
          # version already released and would republish an existing image tag
          # over different content.
          tag="$(svu next --v0 --always)"
          version="${tag#v}"
          IFS=. read -r major minor _ <<<"$version"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "major=$major"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"
          # Preview coordinates exist only for a pull request; build_images is
          # the only consumer and runs only there.
          if [ -n "$PR_NUMBER" ]; then
            {
              echo "preview_moving=$version-pr.$PR_NUMBER"
              echo "preview_pinned=$version-pr.$PR_NUMBER.${HEAD_SHA:0:7}"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "version $version (tag $tag)" >> "$GITHUB_STEP_SUMMARY"

    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      preview_moving: ${{ steps.version.outputs.preview_moving }}
      preview_pinned: ${{ steps.version.outputs.preview_pinned }}

  build_and_test_frontend:
    needs: metadata
    name: 🏗️ Build and test host frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🧬 Frontend API types are up to date
        run: |
          bun run gen:client:test
          bun run gen:client
          git diff --exit-code -- '**/api-schema.d.ts' || {
            echo "::error::Frontend API types are stale. Run 'bun run gen:client' and commit the result."
            exit 1
          }
          untracked="$(git status --porcelain -- '**/api-schema.d.ts')"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::gen:client produced API types that are not committed. Run 'bun run gen:client' and commit the result."
            exit 1
          fi

      - name: 🛡️ Audit frontend dependencies (informational)
        run: bun audit
        continue-on-error: true

      - name: 🛡️ Audit frontend dependencies (fail on High/Critical)
        run: bun audit --audit-level=high

      - name: 🌐 Check translation catalogs
        run: bun run translations:check

      - name: 🧪 Test i18n quality gates
        run: bun run i18n:test

      - name: 🔍 Check formatting
        run: bun run format:check

      - name: 🔍 Lint frontends
        run: bun run frontend:lint

      - name: 🧪 Test frontends
        run: bun run frontend:test

      - name: 🏗 Build host frontend
        working-directory: apps/host/frontend
        run: bun run build

  build_and_test_server:
    needs: metadata
    name: 🧪 Go server lint and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vantigo
          POSTGRES_PASSWORD: vantigo
          POSTGRES_DB: vantigo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vantigo -d vantigo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vantigo:vantigo@127.0.0.1:5432/vantigo_test?sslmode=disable
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "go bun aqua:golangci/golangci-lint aqua:goreleaser/goreleaser aqua:rhysd/actionlint aqua:koalaman/shellcheck aqua:sqlc-dev/sqlc"

      - name: 💾 Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Lint workflows and scripts
        run: |
          # Bare: actionlint finds every workflow itself. A glob here would
          # stop covering a .yaml-suffixed workflow the day someone adds one,
          # and would do it silently.
          actionlint
          shellcheck scripts/*.sh

      - name: 🔍 golangci-lint
        working-directory: apps/server
        run: golangci-lint run

      - name: 🧬 Generated code is up to date
        working-directory: apps/server
        run: |
          go generate ./...
          git diff --exit-code -- . ../../openapi || {
            echo "::error::Generated code or embedded contract copies are stale. Run 'go generate ./...' in apps/server and commit the result."
            exit 1
          }
          untracked="$(git status --porcelain -- . ../../openapi)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::go generate produced files that are not committed. Run 'go generate ./...' in apps/server and commit the result."
            exit 1
          fi

      - name: 🧪 Go tests with the race detector
        working-directory: apps/server
        # The race detector makes the identity suite several times slower than
        # a plain run, so the per-package default of 10m is too tight. 20m was
        # enough until the customers, products and energy suites landed: go
        # test runs packages in parallel, so those three (each minutes long and
        # database-backed) now contend with identity for this runner's four
        # CPUs and its single Postgres service, and identity timed out at
        # 1202s — 0.4% over 20m — with every other package passing. 40m is
        # headroom, not a mask: a genuinely deadlocked test still fails here.
        run: go test -race -count=1 -timeout 40m ./...

      - name: 🌍 Energy tests under a non-UTC time zone
        working-directory: apps/server
        # pgx decodes timestamptz in the process's local zone, so a handler
        # that offset-checks a value read back from Postgres passes under UTC
        # and 400s everywhere else. That bug shipped once and this run is the
        # only thing that would catch it again: every other job here runs UTC.
        # Energy owns the timestamp-sensitive handlers, so it alone is enough.
        env:
          TZ: Europe/Oslo
        run: go test -count=1 -timeout 10m ./internal/energy/...

      - name: 🛡️ govulncheck
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: 🔍 GoReleaser configuration
        run: goreleaser check

  validate_compose:
    needs: metadata
    name: 🔍 Validate Docker Compose stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔍 Validate compose configuration
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          cp vantigo.env.example vantigo.env
          docker compose config -q

      - name: 🚫 Assert no leftover .NET configuration keys
        # `docker compose config -q` only checks YAML syntax and variable
        # interpolation: it stays green even if this manifest still targeted
        # a binary or config convention the Go server never reads. Grep is
        # not a deployment test, but it turns that silent failure loud.
        working-directory: deploy/compose
        run: |
          if grep -rn 'Vantigo\.Host\|ConnectionStrings__' compose.yaml .env.example vantigo.env.example; then
            echo "::error::found a leftover .NET binary name or ConnectionStrings__ key in deploy/compose — see the lines above" >&2
            exit 1
          fi

  codeql:
    needs: metadata
    # Dormant until GitHub Advanced Security is enabled on this repository (it
    # is a private org repo without GHAS, so code scanning API calls 403).
    # Flip the `ENABLE_CODE_SCANNING` repository variable to `true` once GHAS
    # is turned on to activate this job — everything else is already wired.
    if: vars.ENABLE_CODE_SCANNING == 'true'
    name: 🔎 CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: 🔎 Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  build_images:
    name: 📦 Image, smoke test and preview
    needs: [metadata, build_and_test_frontend, build_and_test_server]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "go bun trivy"

      - name: 💾 Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build native artifacts
        env:
          VANTIGO_VERSION: ${{ needs.metadata.outputs.preview_pinned }}
        run: bash scripts/build-artifacts.sh

      # Single-arch, into the daemon: a multi-arch index cannot be loaded
      # locally, and the smoke test runs the image.
      - name: 📦 Build the image
        run: docker build -t vantigo:ci .

      - name: 🔥 Smoke-test the image
        env:
          SMOKE_EXPECT_VERSION: ${{ needs.metadata.outputs.preview_pinned }}
        run: bash scripts/smoke-image.sh vantigo:ci

      - name: 🛡️ Scan the image for vulnerabilities
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table vantigo:ci

      - name: 📋 Generate SBOM for the image
        run: |
          trivy image --scanners vuln --format cyclonedx \
            --output "${RUNNER_TEMP}/vantigo-sbom.cdx.json" vantigo:ci

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: ${{ runner.temp }}/vantigo-sbom.cdx.json
          retention-days: 14

      # A fork's PR gets a read-only token; pushing would fail for reasons
      # unrelated to the change.
      - name: 🔀 Can this run push?
        id: gate
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧱 Set up buildx
        if: steps.gate.outputs.push == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 🔐 Log in to GHCR
        if: steps.gate.outputs.push == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Push the preview image (linux/amd64 + linux/arm64)
        if: steps.gate.outputs.push == 'true'
        env:
          MOVING: ${{ needs.metadata.outputs.preview_moving }}
          PINNED: ${{ needs.metadata.outputs.preview_pinned }}
        run: |
          # The binaries are already in dist/server from the step above.
          SKIP_ARTIFACTS=1 TAG="$IMAGE:$PINNED" PUSH=1 bash scripts/build-image.sh
          docker buildx imagetools create -t "$IMAGE:$MOVING" "$IMAGE:$PINNED"
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE:$PINNED" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture' | sort -u)"
          for expected in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$expected" || { echo "::error::The pushed index is missing $expected."; exit 1; }
          done
          {
            echo "### Preview image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$MOVING"
            echo '```'
            echo
            echo "Also tagged \`$PINNED\` (immutable)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The smoke test ran the same amd64 binary and base digest built earlier; this step closes the gap for what was actually pushed, including arm64.
      - name: 🛡️ Scan the pushed images
        if: steps.gate.outputs.push == 'true'
        env:
          PINNED: ${{ needs.metadata.outputs.preview_pinned }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table "$IMAGE:$PINNED"
          done

  publish_images:
    name: 📦 Publish the image to GHCR
    needs: [metadata, build_and_test_frontend, build_and_test_server]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # write: this job reserves the version tag before it pushes anything
      # immutable. See the 🔖 step below.
      contents: write
      packages: write
      id-token: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "go bun trivy aqua:sigstore/cosign"

      - name: 💾 Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: 🏗️ Build native artifacts
        env:
          VANTIGO_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/build-artifacts.sh

      - name: 📦 Build the image
        run: docker build -t vantigo:ci .

      # Nothing reaches GHCR that has not run: the same binaries and base
      # digest that the multi-arch push below rebuilds from dist/server.
      - name: 🔥 Smoke-test the image
        env:
          SMOKE_EXPECT_VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/smoke-image.sh vantigo:ci

      - name: 🛡️ Scan the image for vulnerabilities
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table vantigo:ci

      - name: 🧱 Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 🔐 Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE VERSION TAG IS RESERVED BEFORE ANYTHING IMMUTABLE IS PUSHED, and
      # that ordering is the whole point of this step.
      #
      # svu derives the version from the newest git tag. If the immutable
      # image tag went to GHCR first and the `release` job then failed, the
      # git tag would never land — so the next push to main would re-derive
      # the SAME version and overwrite an already-published immutable tag with
      # different content. (`--always` in `metadata` closes the opposite case,
      # where the tag exists and the commits are not releasable; it does
      # nothing for this one.) Reserving first means a failure anywhere after
      # this point costs one burnt version number, never a mutated release.
      - name: 🔖 Reserve the version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at $GITHUB_SHA — this is a re-run of the same commit; continuing."
              exit 0
            fi
            echo "::error::$TAG already exists at $existing but this run is $GITHUB_SHA. Publishing would overwrite an immutable image tag with different content."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          echo "Reserved $TAG at $GITHUB_SHA."

      - name: 📤 Push the release image (linux/amd64 + linux/arm64)
        id: push
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          # The binaries are already in dist/server from the step above. Only
          # the immutable tag is pushed here; the moving ones wait for the
          # post-push scan below.
          SKIP_ARTIFACTS=1 TAG="$IMAGE:$VERSION" PUSH=1 bash scripts/build-image.sh
          platforms="$(docker buildx imagetools inspect --raw "$IMAGE:$VERSION" \
            | jq -r '.manifests[].platform | select(.os != "unknown") | .os + "/" + .architecture' | sort -u)"
          for expected in linux/amd64 linux/arm64; do
            echo "$platforms" | grep -qx "$expected" || { echo "::error::The pushed index is missing $expected."; exit 1; }
          done
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          [ -n "$digest" ] || { echo "::error::Could not resolve the digest of $IMAGE:$VERSION."; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: 🛡️ Scan the pushed images
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            trivy image --platform "$platform" --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table "$IMAGE:$VERSION"
          done

      # Only now, with both pushed platforms scanned: nothing is advertised as
      # `latest` before arm64 has passed. The full version never moves;
      # major.minor moves with patches, major with minors, latest with every
      # release; sha-<commit> pins exactly.
      - name: 🏷️ Promote the moving tags
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          MAJOR: ${{ needs.metadata.outputs.major }}
          MINOR: ${{ needs.metadata.outputs.minor }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$MAJOR.$MINOR" \
            -t "$IMAGE:$MAJOR" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:$VERSION"
          {
            echo "### Released image"
            echo
            echo '```'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Digest \`$DIGEST\`; also tagged \`$MAJOR.$MINOR\`, \`$MAJOR\`, \`latest\`, \`sha-$GITHUB_SHA\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 📋 Generate SBOM for the published image
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          trivy image --platform linux/amd64 --scanners vuln --format cyclonedx \
            --output "${RUNNER_TEMP}/vantigo-sbom.cdx.json" "$IMAGE:$VERSION"

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-sbom
          path: ${{ runner.temp }}/vantigo-sbom.cdx.json
          retention-days: 90

      - name: 🔏 Sign the multi-architecture index
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  release:
    name: 🚀 Release
    needs: [metadata, publish_images]
    if: needs.publish_images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag already exists: publish_images reserved it before it pushed
      # anything. This job only attaches the GitHub Release to it — so a
      # "tag exists, skip" guard here would now skip every single release.
      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping release."
            exit 0
          fi
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes

  goreleaser_snapshot:
    name: 📦 GoReleaser snapshot (dry run)
    needs: [build_and_test_frontend, build_and_test_server]
    # Manual only: it runs the release pipeline end to end — binaries,
    # archives, checksums, SBOMs and the multi-arch images — without tagging,
    # pushing or signing, and proves the cosign invocations on a throwaway
    # blob (GoReleaser skips signing in snapshot mode, which is how a flag
    # incompatibility would otherwise first show up during a real release).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless cosign for the flag smoke test
    steps:
      - name: 🛎️ Checkout codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 💾 Set up toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: "go bun aqua:goreleaser/goreleaser aqua:sigstore/cosign aqua:anchore/syft"

      - name: 💾 Cache Go modules and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/server/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: 🧰 Install frontend dependencies
        run: bun install --frozen-lockfile

      # Multi-platform builds with SBOM attestations need the docker-container driver.
      - name: 🧱 Set up buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: 📦 GoReleaser (snapshot)
        run: |
          trap 'bash scripts/restore-embed-overlay.sh' EXIT
          goreleaser release --snapshot --clean --skip=sign

      - name: 🔏 Cosign flags smoke test
        run: |
          echo smoke > "$RUNNER_TEMP/cosign-smoke.txt"
          cosign sign-blob --yes --bundle="$RUNNER_TEMP/cosign-smoke.sigstore.json" "$RUNNER_TEMP/cosign-smoke.txt"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/cosign-smoke.sigstore.json" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$RUNNER_TEMP/cosign-smoke.txt"

      - name: 📤 Upload the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-snapshot
          path: |
            dist/goreleaser/*.tar.gz
            dist/goreleaser/checksums.txt
            dist/goreleaser/*.sbom.json
          if-no-files-found: error
          retention-days: 14
