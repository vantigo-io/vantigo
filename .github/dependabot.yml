version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: sunday
      time: '03:00'
      timezone: Europe/Oslo
updates:
  - package-ecosystem: bun
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
    ignore:
      # TypeScript 7 is the native (Go) compiler and ships no JavaScript API:
      # openapi-typescript builds its AST with ts.factory and typescript-eslint
      # supports TypeScript <6.1. Lift this when both support 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /.github/workflows
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
  - package-ecosystem: gomod
    directory: /apps/server
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: all-dependencies
    patterns: ['*']
